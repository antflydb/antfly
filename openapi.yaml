components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
    UserNamePathParameter:
      name: userName
      in: path
      required: true
      description: The username.
      schema:
        type: string
        example: johndoe
    KeyIdPathParameter:
      name: keyId
      in: path
      required: true
      description: The API key ID.
      schema:
        type: string
        example: aBcDeFgHiJkLmNoPqRsT
    SubjectPathParameter:
      name: subject
      in: path
      required: true
      description: Casbin subject name, such as role:tenant_reader or group:eng.
      schema:
        type: string
        example: role:tenant_reader
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Optional stable machine-readable error code for programmatic handling.
        error:
          type: string
          example: An error message
          description: Legacy human-readable error text.
        message:
          type: string
          description: Human-readable error description when supplied by the endpoint.
        retryable:
          type: boolean
          description: Whether retrying the operation may succeed without changing the request.
        retry_after_ms:
          type: integer
          format: int32
          minimum: 1
          description: Suggested minimum retry delay in milliseconds.
      required:
        - error
    UnsupportedIndexCapabilityError:
      type: object
      additionalProperties: false
      description: The requested index depends on a capability unavailable in the current deployment.
      required:
        - error
        - message
        - retryable
      properties:
        error:
          type: string
          enum:
            - unsupported_index_capability
        message:
          type: string
          enum:
            - artifact-backed index sources are not supported by this deployment
        retryable:
          type: boolean
          enum:
            - false
    IndexMutationServiceUnavailableError:
      type: object
      additionalProperties: false
      description: A retryable index mutation failure, including a distributed artifact-source protocol
        fence or a temporarily unavailable model probe.
      required:
        - error
        - message
        - retryable
      properties:
        error:
          type: string
          enum:
            - index_capability_upgrade_pending
            - index_probe_unavailable
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - true
    MetadataCapabilityUnavailableError:
      type: object
      additionalProperties: false
      description: The metadata service does not yet provide the consistency capability required by backup.
      required:
        - code
        - error
        - message
        - required_capability
        - retryable
        - retry_after_ms
      properties:
        code:
          type: string
          enum:
            - metadata_capability_unavailable
        error:
          type: string
          description: Legacy human-readable error text. Use `code` for branching.
          enum:
            - metadata capability unavailable
        message:
          type: string
        required_capability:
          type: string
          enum:
            - linearizable_snapshot
        retryable:
          type: boolean
          enum:
            - true
        retry_after_ms:
          type: integer
          format: int32
          minimum: 1
    MetadataLeaderUnavailableError:
      type: object
      additionalProperties: false
      description: The request could not establish authority with the current metadata leader.
      required:
        - code
        - error
        - message
        - retryable
        - retry_after_ms
      properties:
        code:
          type: string
          enum:
            - metadata_leader_unavailable
        error:
          type: string
          description: Legacy human-readable error text. Use `code` for branching.
          enum:
            - metadata leader unavailable
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - true
        retry_after_ms:
          type: integer
          format: int32
          minimum: 1
    BackupMetadataUnavailableError:
      description: A retryable metadata-availability failure reported before backup side effects begin.
      discriminator:
        propertyName: code
        mapping:
          metadata_capability_unavailable: '#/components/schemas/MetadataCapabilityUnavailableError'
          metadata_leader_unavailable: '#/components/schemas/MetadataLeaderUnavailableError'
      oneOf:
        - $ref: '#/components/schemas/MetadataCapabilityUnavailableError'
        - $ref: '#/components/schemas/MetadataLeaderUnavailableError'
    TableBackupConflictError:
      description: A non-retryable table-backup conflict. Ambiguous outcomes include the logical backup
        ID and, when available, the opaque artifact generation retained for reconciliation.
      discriminator:
        propertyName: code
        mapping:
          backup_already_exists: '#/components/schemas/BackupAlreadyExistsConflict'
          table_catalog_changed: '#/components/schemas/TableCatalogChangedConflict'
          backup_outcome_ambiguous: '#/components/schemas/BackupOutcomeAmbiguousConflict'
      oneOf:
        - $ref: '#/components/schemas/BackupAlreadyExistsConflict'
        - $ref: '#/components/schemas/TableCatalogChangedConflict'
        - $ref: '#/components/schemas/BackupOutcomeAmbiguousConflict'
    BackupAlreadyExistsConflict:
      type: object
      additionalProperties: false
      required:
        - code
        - error
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - backup_already_exists
        error:
          type: string
          description: Legacy human-readable error text. Use `code` for branching.
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
    TableCatalogChangedConflict:
      type: object
      additionalProperties: false
      required:
        - code
        - error
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - table_catalog_changed
        error:
          type: string
          description: Legacy human-readable error text. Use `code` for branching.
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
    BackupOutcomeAmbiguousConflict:
      type: object
      additionalProperties: false
      required:
        - code
        - error
        - message
        - retryable
        - backup_id
      properties:
        code:
          type: string
          enum:
            - backup_outcome_ambiguous
        error:
          type: string
          description: Legacy human-readable error text. Use `code` for branching.
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        backup_id:
          type: string
          description: Logical backup ID whose outcome must be inspected before retrying.
        artifact_backup_id:
          type: string
          description: Opaque artifact generation retained by an ambiguous attempt. This is for reconciliation,
            not as a replacement logical backup ID.
    InferenceCapacityError:
      type: object
      description: Actionable retry contract for temporary inference-capacity failures.
      required:
        - error
        - message
        - reason
        - retryable
        - retry_after_ms
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error description.
        reason:
          type: string
          enum:
            - inference_capacity
            - inference_admission
          description: Machine-readable capacity source.
        retryable:
          type: boolean
          enum:
            - true
          description: Always true for a transient-capacity response.
        retry_after_ms:
          type: integer
          minimum: 1
          description: Minimum retry delay in milliseconds.
    StorageResourceExhaustedError:
      type: object
      additionalProperties: false
      description: Actionable retry contract for temporary storage descriptor exhaustion.
      required:
        - code
        - error
        - message
        - retryable
        - retry_after_ms
      properties:
        code:
          type: string
          enum:
            - storage_resource_exhausted
        error:
          type: string
          enum:
            - storage_resource_exhausted
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - true
        retry_after_ms:
          type: integer
          minimum: 1
    TableStorageUnreadableError:
      type: object
      additionalProperties: false
      description: A non-retryable table-storage integrity or format failure.
      required:
        - code
        - error
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - table_storage_unreadable
          description: Stable client-routing code for unreadable table storage.
        error:
          type: string
          description: Concrete storage error class, such as InvalidManifest.
        message:
          type: string
          description: Human-readable summary.
        retryable:
          type: boolean
          enum:
            - false
          description: Always false; recovery requires repair, restore, or table replacement.
    QueryTemporarilyUnavailableError:
      type: object
      additionalProperties: false
      description: A transient query dependency or read-availability failure that is safe to retry.
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - doc_identity_unavailable
            - read_requires_primary
            - standby_read_unavailable
            - storage_read_temporarily_unavailable
            - index_rebuilding
            - query_embedding_temporarily_unavailable
          description: Stable machine-readable retry classification.
        message:
          type: string
          description: Human-readable error summary.
        retryable:
          type: boolean
          enum:
            - true
          description: Always true; retry after the response's Retry-After delay.
    HierarchyCursorStaleError:
      type: object
      additionalProperties: false
      description: A hierarchy traversal cursor bound to an older source-artifact revision.
      required:
        - status
        - error
        - message
        - action
        - restart_without
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 409
        error:
          type: string
          enum:
            - hierarchy_cursor_stale
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable explanation of why traversal cannot continue.
        action:
          type: string
          enum:
            - restart_hierarchy_traversal
          description: Stable client action for recovering from the conflict.
        restart_without:
          type: string
          enum:
            - search_after
          description: Request field to omit when restarting at the first unit.
        retryable:
          type: boolean
          enum:
            - false
          description: Retrying the same cursor cannot succeed; restart traversal instead.
    TopologyChangedError:
      type: object
      additionalProperties: false
      description: The table topology changed while a query was running after Antfly's bounded internal
        retry.
      required:
        - status
        - error
        - message
        - action
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 409
        error:
          type: string
          enum:
            - topology_changed
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable explanation of why the query must be retried.
        action:
          type: string
          enum:
            - retry_query
          description: Stable client action for recovering from the conflict.
        retryable:
          type: boolean
          enum:
            - true
          description: Retrying the complete query against fresh topology may succeed.
    QueryConflictError:
      oneOf:
        - $ref: '#/components/schemas/HierarchyCursorStaleError'
        - $ref: '#/components/schemas/TopologyChangedError'
      discriminator:
        propertyName: error
        mapping:
          hierarchy_cursor_stale: '#/components/schemas/HierarchyCursorStaleError'
          topology_changed: '#/components/schemas/TopologyChangedError'
    UnsupportedHierarchyGroupingError:
      type: object
      additionalProperties: false
      description: A requested hierarchy grouping level cannot represent every member because at least
        one selected source lacks durable document-unit identity.
      required:
        - status
        - error
        - message
        - reason
        - field
        - action
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - unsupported_hierarchy_grouping
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable remediation using only public query fields.
        reason:
          type: string
          enum:
            - unit_identity_unavailable
          description: Stable reason the requested hierarchy level is unavailable.
        field:
          type: string
          enum:
            - hierarchy.group_by.level
          description: Public request field that selected the unsupported grouping level.
        action:
          type: string
          enum:
            - use_source_grouping_or_direct_members
          description: Select source grouping, omit group_by for direct members, or use an index whose
            every source is unit-backed.
        retryable:
          type: boolean
          enum:
            - false
          description: Retrying the same request cannot succeed without changing its hierarchy grouping.
    UnsupportedQueryError:
      type: object
      additionalProperties: false
      description: A query requests an unsupported feature without a more specific structured diagnostic.
      required:
        - status
        - error
        - message
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - unsupported_query_request
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error summary.
        retryable:
          type: boolean
          enum:
            - false
          description: Retrying the same request cannot succeed without changing it.
    QueryFilterError:
      type: object
      additionalProperties: false
      description: A public filter or exclusion query contains an invalid or unsupported node.
      required:
        - status
        - error
        - message
        - field
        - offending_node
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 400
            - 422
        error:
          type: string
          enum:
            - invalid_query_request
            - unsupported_query_request
        message:
          type: string
        field:
          type: string
          enum:
            - filter_query
            - exclusion_query
        offending_node:
          type: string
          description: Stable name of the first invalid or unsupported filter node.
        retryable:
          type: boolean
          enum:
            - false
    ExactSortError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - reason
        - sort_rejection_reason
        - sort_rejection_detail
        - sort_rejection_field
        - status
      properties:
        error:
          type: string
          enum:
            - unsupported_exact_sort
          description: Stable error class.
          example: unsupported_exact_sort
        message:
          type: string
          description: Human-readable error summary.
          example: exact sort is unsupported for this query
        reason:
          type: string
          description: >
            Stable machine-readable rejection reason. Known exact-sort

            reasons include `unmapped_field`, `non_sortable_field`,

            `unsupported_sort_field`, `mixed_field_type`,

            `field_not_sort_ready`, `filter_not_queryable`,

            `invalid_cursor_arity`, `invalid_cursor_type`,

            `invalid_sort_tuple`, `approximate_candidate_source`,

            `candidate_budget_exceeded`, `missing_null_policy`,

            `non_score_bearing_source`, `invalid_score_value`,

            `count_only_ordered_page`, `stored_json_sort_disabled`,

            `unsupported_exact_sort`, and `distributed_merge_unsupported`.
          example: field_not_sort_ready
        sort_rejection_reason:
          type: string
          description: Stable exact-sort rejection reason; uses the same stable reason taxonomy as `reason`.
          example: field_not_sort_ready
        budget_rejection_reason:
          type: string
          description: >
            Stable budget rejection reason when the rejection was

            budget-driven. Known values include

            `text_exact_late_visibility_totals`,

            `text_field_sort_candidate_window`,

            `match_all_candidate_collect_limit`,

            `match_all_exact_candidate_window`,

            `sorted_segment_scan_window`, and

            `distributed_merge_shard_window`.
          example: text_field_sort_candidate_window
        sort_rejection_detail:
          type: string
          description: >
            Stable user-facing exact-sort rejection detail. Internal storage

            and planner details are reserved for logs, traces, and explicit

            debug surfaces.
          example: field_not_sort_ready
        sort_rejection_field:
          type: string
          description: Sort field associated with the rejection when safe to expose.
          example: created_at
        status:
          type: integer
          format: int32
          enum:
            - 422
          example: 422
    QueryCandidateBudgetExceededError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - reason
        - budget_rejection_reason
        - sort_rejection_reason
        - sort_rejection_detail
        - sort_rejection_field
        - status
      properties:
        error:
          type: string
          enum:
            - query_candidate_budget_exceeded
        message:
          type: string
        reason:
          type: string
        budget_rejection_reason:
          type: string
        sort_rejection_reason:
          type: string
        sort_rejection_detail:
          type: string
        sort_rejection_field:
          type: string
        status:
          type: integer
          format: int32
          enum:
            - 422
    GraphDistinctBudgetExceededError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
        - operation
        - dimension
        - maximum
        - remediation
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_distinct_budget_exceeded
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        operation:
          type: string
          description: Named graph operation whose exact distinct aggregation exhausted the request budget.
        dimension:
          type: string
          enum:
            - distinct_identities
            - distinct_state_bytes
          description: Distinct aggregation resource exhausted by the operation.
        maximum:
          type: integer
          format: uint64
          description: Configured request ceiling for the exhausted resource.
        remediation:
          type: string
          description: Stable user-facing guidance for reducing exact distinct state.
    GraphWorkBudgetExceededError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
        - operation
        - mode
        - dimension
        - maximum
        - remediation
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_work_budget_exceeded
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        operation:
          type: string
          description: Named graph operation whose exact execution exhausted the request budget.
        mode:
          type: string
          description: Graph operation mode, such as match or pattern.
        dimension:
          type: string
          enum:
            - explored_nodes
            - explored_edges
            - explored_edge_bytes
            - scanned_anchors
            - intermediate_states
            - retained_state_bytes
          description: Bounded resource exhausted by the operation.
        maximum:
          type: integer
          format: uint64
          description: Configured request ceiling for the exhausted resource.
        remediation:
          type: string
          description: Stable user-facing guidance for reducing graph work.
    GraphPathWeightDomainError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
        - operation
        - objective
        - violation
        - remediation
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_path_weight_domain_error
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        operation:
          type: string
          description: Named shortest-path operation that encountered the incompatible edge weight.
        objective:
          $ref: '#/components/schemas/GraphPathObjective'
          description: Canonical path objective selected by the named operation.
        violation:
          type: string
          enum:
            - negative_edge_weight
            - edge_weight_above_one
            - path_sum_overflow
          description: Stable machine-readable reason the weight was rejected.
        remediation:
          type: string
          description: Stable user-facing guidance for correcting the graph or query.
    GraphAnchorFilterRequiresIndexError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_anchor_filter_requires_index
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
    GraphQueryUnsupportedError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
        - operation
        - feature
        - reason
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_query_unsupported
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        operation:
          type: string
          description: Named graph operation that cannot execute exactly, or `$request` for a request-wide
            constraint.
        feature:
          type: string
          description: Graph operation feature, such as `match` or `traverse`, or the rejected request
            feature, such as `order_by`, when `operation` is `$request`.
        reason:
          type: string
          enum:
            - expand_strategy_not_supported
            - direction_must_be_out
            - deduplicate_nodes_must_be_true
            - weight_mode_must_be_min_hops
            - start_selector_not_supported
            - target_selector_not_supported
            - target_required
            - k_must_equal_one
            - pattern_required
            - external_alias_document_filter_not_supported
            - external_alias_source_not_supported
            - reverse_variable_path_not_supported
            - legacy_graph_searches_not_supported
            - request_control_not_supported
            - unsupported_mode
          description: Stable machine-readable constraint that prevents exact public execution.
    GraphMatchOperationLimitExceededError:
      type: object
      additionalProperties: false
      required:
        - status
        - error
        - message
        - retryable
        - maximum
        - actual
      properties:
        status:
          type: integer
          format: int32
          enum:
            - 422
        error:
          type: string
          enum:
            - graph_match_operation_limit_exceeded
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - false
        maximum:
          type: integer
          format: uint64
          description: Maximum named MATCH operations accepted in one request.
        actual:
          type: integer
          format: uint64
          description: Named MATCH operations supplied by the request.
    GraphQueryUnprocessableError:
      oneOf:
        - $ref: '#/components/schemas/GraphDistinctBudgetExceededError'
        - $ref: '#/components/schemas/GraphWorkBudgetExceededError'
        - $ref: '#/components/schemas/GraphPathWeightDomainError'
        - $ref: '#/components/schemas/GraphAnchorFilterRequiresIndexError'
        - $ref: '#/components/schemas/GraphQueryUnsupportedError'
        - $ref: '#/components/schemas/GraphMatchOperationLimitExceededError'
      discriminator:
        propertyName: error
        mapping:
          graph_distinct_budget_exceeded: '#/components/schemas/GraphDistinctBudgetExceededError'
          graph_work_budget_exceeded: '#/components/schemas/GraphWorkBudgetExceededError'
          graph_path_weight_domain_error: '#/components/schemas/GraphPathWeightDomainError'
          graph_anchor_filter_requires_index: '#/components/schemas/GraphAnchorFilterRequiresIndexError'
          graph_query_unsupported: '#/components/schemas/GraphQueryUnsupportedError'
          graph_match_operation_limit_exceeded: '#/components/schemas/GraphMatchOperationLimitExceededError'
    QueryUnprocessableError:
      oneOf:
        - $ref: '#/components/schemas/ExactSortError'
        - $ref: '#/components/schemas/QueryCandidateBudgetExceededError'
        - $ref: '#/components/schemas/GraphQueryUnprocessableError'
        - $ref: '#/components/schemas/QueryFilterError'
        - $ref: '#/components/schemas/UnsupportedHierarchyGroupingError'
        - $ref: '#/components/schemas/UnsupportedQueryError'
    SortDirection:
      type: boolean
      description: Sort direction for a single field. true = descending, false = ascending.
    SortField:
      type: object
      description: A single sort field with direction.
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
          description: The field name to sort by.
        desc:
          type: boolean
          default: false
          description: Sort direction. true = descending, false = ascending.
    ClusterHealth:
      type: string
      enum:
        - unknown
        - healthy
        - unhealthy
        - degraded
        - error
      description: Overall health status of the cluster
    IndexRuntimeCapabilities:
      type: object
      additionalProperties: false
      required:
        - artifact_sources
        - artifact_sources_state
      description: Deployment-level index capabilities clients can inspect before submitting index mutations.
      properties:
        artifact_sources:
          type: boolean
          description: Whether full-text, embedding, and graph indexes may currently consume generated
            artifact streams through either single-source or multi-source request forms. Equivalent to
            artifact_sources_state=available.
        artifact_sources_state:
          $ref: '#/components/schemas/ArtifactSourcesCapabilityState'
    ArtifactSourcesCapabilityState:
      type: string
      enum:
        - available
        - upgrade_pending
        - unsupported
      description: Whether artifact-backed index mutations are accepted now, temporarily fenced during
        a distributed rolling upgrade, or permanently unsupported by this deployment.
    ClusterStatus:
      type: object
      required:
        - health
      additionalProperties: true
      properties:
        health:
          $ref: '#/components/schemas/ClusterHealth'
        message:
          type: string
          description: Optional message providing details about the health status
        auth_enabled:
          type: boolean
          description: Indicates whether authentication is enabled for the cluster
          x-omitzero: false
        deployment_mode:
          type: string
          enum:
            - embedded
            - distributed
            - standalone
            - serverless
          description: Runtime deployment topology
        index_capabilities:
          $ref: '#/components/schemas/IndexRuntimeCapabilities'
        secret_store:
          $ref: '#/components/schemas/SecretStoreStatus'
        runtime_config:
          $ref: '#/components/schemas/RuntimeConfigStatus'
        storage:
          $ref: '#/components/schemas/StorageRuntimeStatus'
    ClusterTopology:
      type: object
      required:
        - health
        - data
      additionalProperties: true
      properties:
        health:
          $ref: '#/components/schemas/ClusterHealth'
        message:
          type: string
          description: Optional message providing details about the health status
        auth_enabled:
          type: boolean
          description: Indicates whether authentication is enabled for the cluster
          x-omitzero: false
        deployment_mode:
          type: string
          enum:
            - embedded
            - distributed
            - standalone
            - serverless
          description: Runtime deployment topology
        index_capabilities:
          $ref: '#/components/schemas/IndexRuntimeCapabilities'
        secret_store:
          $ref: '#/components/schemas/SecretStoreStatus'
        runtime_config:
          $ref: '#/components/schemas/RuntimeConfigStatus'
        storage:
          $ref: '#/components/schemas/StorageRuntimeStatus'
        data:
          $ref: '#/components/schemas/ClusterDataStatus'
    StorageMaintenanceCapabilities:
      type: object
      required:
        - check
        - compact
        - vacuum
        - online
        - asynchronous
      additionalProperties: false
      properties:
        check:
          type: boolean
        compact:
          type: boolean
        vacuum:
          type: boolean
        online:
          type: boolean
        asynchronous:
          type: boolean
    StorageRuntimeStatus:
      type: object
      required:
        - engine
        - maintenance
      additionalProperties: false
      properties:
        engine:
          type: string
          enum:
            - lite
            - local
            - object
        format:
          type: string
        fsync:
          type: boolean
        maintenance:
          $ref: '#/components/schemas/StorageMaintenanceCapabilities'
    ClusterDataStatus:
      type: object
      description: Typed Zig status view for table data topology and range placement.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterDataNodeStatus'
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/ClusterDataRangeStatus'
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/ClusterDataReplicaStatus'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ClusterDataGroupStatus'
    ConnectionKind:
      type: string
      enum:
        - inference
        - web_search
        - external_io
        - cdc
      description: Kind of external connection configured on this node.
    ConnectionStatus:
      type: string
      enum:
        - connected
        - error
        - configured
        - unsupported
      description: >
        Connection status. "connected" means a live probe or listing succeeded,

        "error" means the probe failed (see the error field), "configured" means

        the connection is present but was not probed, and "unsupported" means

        no probe is available for this connection kind or provider. For S3,

        connected means an authenticated HeadBucket request succeeded for every

        explicitly allowlisted bucket. It verifies bucket discovery permission,

        not mutation permissions such as PutObject.
    InferenceProviderType:
      type: string
      enum:
        - gemini
        - vertex
        - ollama
        - openai
        - openrouter
        - bedrock
        - cohere
        - anthropic
        - antfly
        - mock
      description: Inference provider type for a connection.
    ConnectedModelType:
      type: string
      enum:
        - embedder
        - generator
        - reranker
        - chunker
        - classifier
        - rewriter
        - reader
        - transcriber
        - extractor
        - other
      description: >
        Model task type. Mirrors the inference registry taxonomy; "other" is

        used for models whose task type the provider's listing API does not

        classify.
    ConnectedModel:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Model identifier as reported by the provider.
        display_name:
          type: string
          description: Human-readable model name when the provider reports one.
        dimensions:
          type: integer
          description: Embedding output dimension when known.
        configured:
          type: boolean
          description: True when this model is referenced by a configured embedder, generator, reranker,
            or chunker.
    InferenceConnection:
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: '#/components/schemas/InferenceProviderType'
        url:
          type: string
          description: Resolved endpoint URL when applicable.
        region:
          type: string
          description: Cloud region (Bedrock).
        project_id:
          type: string
          description: Google Cloud project (Vertex).
        location:
          type: string
          description: Google Cloud location (Vertex).
        names:
          type: array
          items:
            type: string
          description: Named registry entries from node config that resolve to this provider instance.
        configured_model_types:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedModelType'
          description: Model types this instance is configured for.
        models:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ConnectedModel'
          description: >
            Models reported by the provider, grouped by model type. Keys are

            pluralized ConnectedModelType values ("embedders", "generators",

            "rerankers", "chunkers", "classifiers", "rewriters",

            "readers", "transcribers", "extractors") plus "other" for models

            the provider's listing API does not classify by task. Populated

            only when the request includes the "models" expansion.
    ExternalIoProtocol:
      type: string
      enum:
        - s3
        - gcs
        - filesystem
        - http
      description: External IO transport protocol.
    WebSearchConnection:
      type: object
      properties:
        service:
          type: string
          description: Provider-specific service flavor, such as agent_search for provider vertex.
        max_results:
          type: integer
          description: Maximum ranked results this connection is configured to return.
        timeout_ms:
          type: integer
          description: Provider request timeout in milliseconds.
        safe_search:
          type: boolean
          description: Whether safe-search filtering is requested.
        language:
          type: string
          description: Preferred result language.
        region:
          type: string
          description: Preferred result region.
        include_content:
          type: boolean
          description: Whether extracted content is requested when supported.
        include_highlights:
          type: boolean
          description: Whether highlighted passages are requested when supported.
        endpoint:
          type: string
          description: Provider endpoint override when configured.
        project_id:
          type: string
          description: Google Cloud project for provider vertex.
        location:
          type: string
          description: Google Cloud location for provider vertex.
        data_store:
          type: string
          description: Agent Search data store ID for provider vertex.
        serving_config:
          type: string
          description: Agent Search serving config ID for provider vertex.
        include_domains:
          type: array
          items:
            type: string
          description: Domain allowlist when configured.
        exclude_domains:
          type: array
          items:
            type: string
          description: Domain denylist when configured.
        configured:
          type: boolean
          description: True when required credentials/config are present. Secret values are never returned.
    ExternalIoConnection:
      type: object
      required:
        - protocol
      properties:
        protocol:
          $ref: '#/components/schemas/ExternalIoProtocol'
        endpoint:
          type: string
          description: Custom endpoint URL when configured.
        buckets:
          type: array
          items:
            type: string
          description: Buckets this connection is configured for.
        prefix:
          type: string
          description: Key prefix when configured.
        hosts:
          type: array
          items:
            type: string
          description: Hosts or base URLs this connection applies to.
    CdcConnection:
      type: object
      required:
        - provider
        - table_name
        - source_ordinal
      properties:
        provider:
          type: string
          description: CDC provider type. Currently "postgres"; future CDC providers may add new values.
          example: postgres
        table_name:
          type: string
          description: Antfly table receiving changes from this CDC source.
        source_ordinal:
          type: integer
          format: uint32
          description: Zero-based ordinal of the replication source within the table config.
        external_table:
          type: string
          description: Source-side table or stream name when reported by the provider.
        slot_name:
          type: string
          description: Provider replication cursor or slot name when applicable.
        publication_name:
          type: string
          description: Provider publication or stream grouping name when applicable.
        phase:
          type: string
          description: Runtime CDC phase such as snapshot, streaming, configured, or failed.
        lag_records:
          type: integer
          format: uint64
          description: Source records behind, when reported by the runtime.
        lag_millis:
          type: integer
          format: uint64
          description: Source commit lag in milliseconds, when reported by the runtime.
        last_success_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp of the last successful CDC poll/apply, in milliseconds.
        last_change_applied_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp of the last applied source change, in milliseconds.
        updated_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp when this CDC status was last updated, in milliseconds.
    Connection:
      type: object
      required:
        - id
        - name
        - kind
        - status
        - capabilities
      properties:
        id:
          type: string
          description: Stable resource identifier for this connection. Config-derived connections synthesize
            this from the source config path.
        name:
          type: string
          description: Human-readable short name for this connection instance.
        display_name:
          type: string
          description: Optional display name for UIs.
        provider:
          type: string
          description: Provider token for connection kinds that have a provider-level service identity,
            such as web_search.
        kind:
          $ref: '#/components/schemas/ConnectionKind'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        error:
          type: string
          description: Failure detail when status is "error".
        capabilities:
          type: array
          items:
            type: string
          description: Namespaced actions and workflow uses this connection supports, such as models.embed,
            content.fetch, objects.read, or cdc.read_stream.
        sources:
          type: array
          items:
            type: string
          description: >
            Where this connection was configured, e.g.

            "config:embedders/openai-small" or "table:docs/index:body_vec".
        inference:
          $ref: '#/components/schemas/InferenceConnection'
        web_search:
          $ref: '#/components/schemas/WebSearchConnection'
        external_io:
          $ref: '#/components/schemas/ExternalIoConnection'
        cdc:
          $ref: '#/components/schemas/CdcConnection'
    ConnectionsResponse:
      type: object
      required:
        - connections
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    DocumentArtifactChildRange:
      type: object
      description: Parsed child-range descriptor from a derived document artifact manifest.
      required:
        - range_id
        - range_kind
        - artifact_name
        - split_boundary
        - placement
        - start_key
        - end_key_exclusive
        - last_key
        - child_count
      properties:
        range_id:
          type: string
          description: Stable range identifier within the artifact manifest generation.
        range_kind:
          type: string
          description: Kind of children covered by this range, such as unit or chunk.
        artifact_name:
          type: string
          description: Artifact namespace covered by this range.
        split_boundary:
          type: string
          description: Logical boundary used for splitting this range.
        placement:
          type: string
          description: Current placement summary for the range.
        owner_group_id:
          type: integer
          format: uint64
          nullable: true
          description: Owner group for this child artifact range, when assigned.
        placement_generation:
          type: integer
          format: uint64
          nullable: true
          description: Placement generation for range ownership metadata.
        route_status:
          type: string
          nullable: true
          description: Current routing status for child writes in this range.
        split_eligible:
          type: boolean
          nullable: true
          description: Whether this range may split at its configured split boundary.
        start_key:
          type: string
          description: Inclusive first internal child key covered by this range.
        end_key_exclusive:
          type: string
          description: Exclusive end internal child key, or empty for the final range.
        last_key:
          type: string
          description: Inclusive last internal child key covered by this range.
        child_count:
          type: integer
          description: Number of child records covered by this range.
        text_bytes:
          type: integer
          nullable: true
          description: Approximate extracted text bytes covered by this range when available.
    DocumentArtifactManifest:
      type: object
      description: >
        Inspection view for a derived document artifact produced from a source

        table row. The typed fields form the stable summary contract. The

        embedded manifest/state JSON fields are optional raw detail intended

        for admin/debug inspection so producers can evolve their internal unit

        schema without changing this route contract.
      required:
        - document_id
        - artifact_name
        - artifact_id
        - manifest_version
        - generation
        - source_url
        - source_fingerprint
        - content_type
        - route_type
        - unit_count
        - chunk_count
        - child_ranges
        - child_range_count
        - merge_status
        - merge_from_generation
        - merge_to_generation
        - merge_operation_granularity
        - merge_operation_count
      properties:
        document_id:
          type: string
          description: Stable identity of the source document.
        artifact_name:
          type: string
          description: Name of the derived artifact.
          example: document_units_v1
        artifact_id:
          type: string
          description: Stable identity of this artifact under the document.
        manifest_version:
          type: integer
          format: uint64
          description: Version of the opaque manifest payload schema.
        generation:
          type: integer
          format: uint64
          description: Monotonic generation for the current artifact state.
        source_url:
          type: string
          description: Source URL or source identifier used to derive this artifact.
        source_fingerprint:
          type: string
          description: Fingerprint of the source bytes and extractor configuration.
        content_type:
          type: string
          description: Effective source content type selected during extraction.
        route_type:
          type: string
          description: Producer route selected for the source content.
          example: pdf
        unsupported_reason:
          type: string
          nullable: true
          description: Reason extraction was skipped, when the source type is unsupported.
        unit_count:
          type: integer
          description: Number of extracted document units.
        chunk_count:
          type: integer
          description: Number of indexable chunks derived from the units.
        ocr_attempted_count:
          type: integer
          description: Number of pages for which OCR was attempted.
        ocr_selected_count:
          type: integer
          description: Number of pages where OCR text was selected over embedded text.
        ocr_retained_embedded_count:
          type: integer
          description: Number of attempted pages where embedded text remained preferable.
        ocr_failed_count:
          type: integer
          description: Number of pages whose OCR rendering or recognition failed.
        ocr_failed_page_numbers:
          type: array
          description: Up to 32 one-based page numbers where OCR failed.
          items:
            type: integer
            format: uint32
        ocr_failed_pages_truncated:
          type: boolean
          description: Whether additional failed page numbers were omitted from the summary.
        child_ranges:
          type: array
          description: Parsed child range descriptors for this artifact generation.
          items:
            $ref: '#/components/schemas/DocumentArtifactChildRange'
        child_range_count:
          type: integer
          description: Number of storage child ranges used by this artifact.
        merge_status:
          type: string
          description: Current materialization or merge status.
        merge_from_generation:
          type: integer
          format: uint64
          description: Previous artifact generation used by the current merge plan.
        merge_to_generation:
          type: integer
          format: uint64
          description: Target artifact generation produced by the current merge plan.
        merge_operation_granularity:
          type: string
          description: Granularity used when computing merge-plan operations.
        merge_operation_count:
          type: integer
          description: Number of merge operations recorded for this artifact.
        last_error_code:
          type: string
          nullable: true
          description: Last extraction or materialization error code, when the current artifact generation
            failed.
        last_error_message:
          type: string
          nullable: true
          description: Human-readable last extraction or materialization error summary, when available.
        manifest_json:
          type: string
          description: Opaque JSON manifest for the artifact units and provenance. Present only for raw
            detail responses.
        state_json:
          type: string
          nullable: true
          description: Optional opaque JSON state for incremental processing. Present only for raw detail
            responses.
    DocumentArtifactManifestList:
      type: object
      description: Available derived document artifact manifests for a source document.
      required:
        - document_id
        - artifacts
      properties:
        document_id:
          type: string
          description: Stable identity of the source document.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/DocumentArtifactManifest'
    TableArtifactEnrichmentList:
      type: object
      description: Table-level generated artifact enrichments configured for a table.
      required:
        - table_name
        - artifacts
      properties:
        table_name:
          type: string
          description: Table containing the configured artifact enrichments.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/EnrichmentConfig'
    ArtifactRepairKind:
      type: string
      description: Kind of stored artifact tracked by the repair queue.
      enum:
        - embedding
        - asset
        - chunk
        - graph
        - full_text
        - algebraic
    ArtifactRepairReason:
      type: string
      description: Reason an artifact was added to the repair queue.
      enum:
        - missing_artifact
        - corrupt_artifact
        - unreadable_artifact
        - enrichment_failed
        - resource_limit_exceeded
    RepairTarget:
      type: string
      description: Repair subsystem to inspect or run.
      enum:
        - artifact
        - index
    TableRepairIssue:
      type: object
      description: Durable table repair debt. Artifact targets include exact source and artifact identifiers;
        index targets include the affected index and repair status.
      required:
        - artifact_kind
        - index_name
        - doc_key
        - artifact_name
        - repairable
        - sequence
        - reason
        - generation_attempts
        - attempts
        - first_seen_ns
        - last_seen_ns
      properties:
        artifact_kind:
          $ref: '#/components/schemas/ArtifactRepairKind'
        index_name:
          type: string
          description: Index whose replay or derived state observed the artifact problem.
        doc_key:
          type: string
          description: Source or derived document key whose artifact is missing or unreadable.
        parent_doc_key:
          type: string
          description: Parent source document key for chunk-derived artifacts.
        unit_id:
          type: string
          description: Unit identifier for unit-scoped artifacts, when applicable.
        index_source_artifact_name:
          type: string
          description: Canonical artifact stream configured on the affected index. This is the authoritative
            source-readiness identity and is distinct from the producer input and the derived artifact
            being repaired.
        source_artifact_name:
          type: string
          description: Source artifact stream used to produce this artifact, when applicable.
        artifact_name:
          type: string
          description: Derived artifact name that must be reprocessed or made readable.
        artifact_key:
          type: string
          description: Hex-encoded internal artifact storage key, when known.
        chunk_id:
          type: integer
          format: uint32
          nullable: true
          description: Chunk ordinal for chunk-derived artifacts.
        repairable:
          type: boolean
          description: Whether this artifact kind currently has an automated repair reprocessor.
        unsupported_reason:
          type: string
          description: Stable reason code when repairable is false.
        sequence:
          type: integer
          format: uint64
          description: Derived replay sequence that observed the issue.
        reason:
          $ref: '#/components/schemas/ArtifactRepairReason'
        generation_attempts:
          type: integer
          format: uint64
          description: Number of enrichment generation attempts made before this issue was parked.
        generation_error:
          type: string
          description: Stable source-generation error code that caused this issue to be parked.
        attempts:
          type: integer
          format: uint64
          description: Number of repair attempts made for this issue.
        first_seen_ns:
          type: integer
          format: uint64
          description: Monotonic timestamp when this issue was first recorded.
        last_seen_ns:
          type: integer
          format: uint64
          description: Monotonic timestamp when this issue was last observed or attempted.
        last_error:
          type: string
          description: Last stable repair error code, when a repair attempt failed.
    TableRepairIssueList:
      type: object
      description: Bounded page of table repair issues.
      required:
        - table
        - target
        - limit
        - scanned
        - groups_scanned
        - has_more
        - issues
      properties:
        table:
          type: string
          description: Table whose repair queue was listed.
        target:
          $ref: '#/components/schemas/RepairTarget'
        limit:
          type: integer
          format: uint32
          description: Effective page limit.
        scanned:
          type: integer
          format: uint64
          description: Number of repair records scanned while building this page.
        groups_scanned:
          type: integer
          format: uint64
          description: Number of table groups touched while building this page.
        has_more:
          type: boolean
          description: Whether another page is available.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page when has_more is true.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/TableRepairIssue'
    RepairIssueListRequest:
      type: object
      description: Bounded request to list table repair issues.
      properties:
        target:
          $ref: '#/components/schemas/RepairTarget'
          default: artifact
          description: Repair subsystem to list. `artifact` lists durable artifact queue records; `index`
            lists index repair candidates derived from index status and artifact debt.
        kind:
          $ref: '#/components/schemas/ArtifactRepairKind'
        index:
          type: string
          description: Restrict results to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior response.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum repair records to return.
    RepairRunRequest:
      type: object
      description: Bounded request to run a table repair pass.
      properties:
        target:
          $ref: '#/components/schemas/RepairTarget'
        kind:
          $ref: '#/components/schemas/ArtifactRepairKind'
        index:
          type: string
          description: Restrict repair attempts to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior repair response.
        force:
          type: boolean
          default: false
          description: Force one named-index replacement generation even when no repair debt is currently
            recorded. The force is dispatched once across the initial bounded group traversal; later convergence
            passes only observe that generation. Only applies to target=index.
        control:
          type: string
          enum:
            - pause_automatic
            - resume_automatic
            - cancel_current_attempt
          description: Applies one control to an existing named index repair. Requires target=index and
            index; cannot be combined with force, kind, or cursor.
        repair_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Optional opaque generation fence for a repair control. A stale value is rejected
            instead of affecting a newer repair.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum artifact repair records to attempt. For target=index, any positive value
            permits one named index repair.
    TableRepairRunResult:
      type: object
      description: Result of one bounded table repair pass.
      required:
        - scanned
        - groups_scanned
        - reprocessed
        - repaired
        - missing_source_docs
        - failed
        - unsupported
        - unresolved
        - in_progress
        - indexes_rebuilt
        - indexes_degraded_before
        - indexes_degraded_after
        - controls_applied
        - limit
        - has_more
        - debt_remaining
      properties:
        scanned:
          type: integer
          format: uint64
          description: Number of repair records attempted by this pass.
        groups_scanned:
          type: integer
          format: uint64
          description: Number of table groups touched by this bounded repair pass.
        reprocessed:
          type: integer
          format: uint64
          description: Number of artifacts whose source was reprocessed.
        repaired:
          type: integer
          format: uint64
          description: Number of repair records cleared because the artifact became readable.
        missing_source_docs:
          type: integer
          format: uint64
          description: Number of repair records whose source document no longer exists.
        failed:
          type: integer
          format: uint64
          description: Number of supported repair attempts that failed.
        unsupported:
          type: integer
          format: uint64
          description: Number of repair records skipped because no automated repair exists for the selected
            target.
        unresolved:
          type: integer
          format: uint64
          description: Number of attempted repair records that remained queued after this pass.
        in_progress:
          type: integer
          format: uint64
          description: Number of selected repair records or indexes skipped because another repair pass
            already owns them.
        indexes_rebuilt:
          type: integer
          format: uint64
          description: Number of indexes rebuilt by this pass when target is index.
        indexes_degraded_before:
          type: integer
          format: uint64
          description: Number of selected indexes that were degraded or quarantined when this repair pass
            began.
        indexes_degraded_after:
          type: integer
          format: uint64
          description: Number of selected indexes that remain degraded or quarantined when this repair
            pass returns.
        controls_applied:
          type: integer
          format: uint64
          description: Number of existing index repairs that accepted the requested control.
        limit:
          type: integer
          format: uint32
          description: Effective repair limit.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next artifact repair pass when has_more is true. Index repair
            currently repairs one named index per request and does not return a continuation cursor.
        has_more:
          type: boolean
          description: Whether another repair scan page is available via next_cursor.
        debt_remaining:
          type: boolean
          description: Whether repair debt remains after this bounded pass. If true and next_cursor is
            absent, rerun repair from the beginning after addressing failed or unsupported records.
    TableRepairRunResponse:
      type: object
      description: Response for a bounded table repair pass.
      required:
        - table
        - target
        - limit
        - result
      properties:
        table:
          type: string
          description: Table whose repair queue was processed.
        target:
          $ref: '#/components/schemas/RepairTarget'
        limit:
          type: integer
          format: uint32
          description: Effective repair limit.
        result:
          $ref: '#/components/schemas/TableRepairRunResult'
    TableRepairJobStartRequest:
      type: object
      description: Starts a durable table repair job. The job advances in bounded passes using the same
        repair request shape as runTableRepair.
      properties:
        target:
          $ref: '#/components/schemas/RepairTarget'
          default: artifact
        kind:
          $ref: '#/components/schemas/ArtifactRepairKind'
        index:
          type: string
          description: Restrict repair attempts to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior repair response.
        force:
          type: boolean
          default: false
          description: Force a named index rebuild even when no repair debt is currently recorded. Only
            applies to target=index.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum artifact repair records to attempt per pass. For target=index, any positive
            value permits one named index repair.
        advance:
          type: boolean
          default: true
          description: When true, the server immediately attempts the first bounded repair pass before
            returning the job.
    TableRepairJob:
      type: object
      description: Durable table repair job state.
      required:
        - job_id
        - attempt_id
        - table_name
        - phase
        - repair_status
        - target
        - limit
        - force
        - result
        - cancel_requested
        - created_at_millis
        - last_updated_at_millis
        - expires_at_millis
      properties:
        job_id:
          type: integer
          format: uint64
          description: Server-assigned durable repair job identifier.
        attempt_id:
          type: integer
          format: uint64
          description: Monotonic execution attempt token for the current running pass.
        table_name:
          type: string
          description: Table being repaired.
        phase:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
          description: Lifecycle phase of the repair job.
        repair_status:
          type: string
          enum:
            - in_progress
            - complete
            - debt_remaining
            - stopped
          description: User-facing repair progress state. `debt_remaining` means the bounded job stopped
            because unsupported or failed debt still requires operator action.
        target:
          $ref: '#/components/schemas/RepairTarget'
        kind:
          $ref: '#/components/schemas/ArtifactRepairKind'
        index:
          type: string
          description: Index name when the job is restricted to one index.
        cursor:
          type: string
          nullable: true
          description: Opaque continuation cursor for the next bounded repair pass.
        limit:
          type: integer
          format: uint32
          description: Effective per-pass repair limit.
        force:
          type: boolean
          description: Whether the next bounded pass still needs to dispatch the job's one forced named-index
            generation.
        result:
          $ref: '#/components/schemas/TableRepairRunResult'
        last_error:
          type: string
          nullable: true
          description: Last stable job-level error code.
        cancel_requested:
          type: boolean
          description: Whether cancellation is pending. For a named-index job, cancellation durably pauses
            the matching repair in every group and becomes terminal only after that bounded traversal
            completes.
        created_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was created.
        last_updated_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job state was last updated.
        expires_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job is eligible for cleanup.
    DocumentArtifactReprocessResponse:
      type: object
      required:
        - reprocess
      properties:
        reprocess:
          type: string
          enum:
            - triggered
          description: Indicates that reprocessing was accepted.
    DocumentArtifactTableReprocessRequest:
      type: object
      description: Bounded request for reprocessing a derived artifact across source rows in key order.
      properties:
        from_key:
          type: string
          description: Exclusive lower bound source document key. Use the prior response next_key to continue.
          default: ''
        to_key:
          type: string
          description: Inclusive upper bound source document key, or empty for the end of the table/range.
          default: ''
        limit:
          type: integer
          format: uint32
          description: Maximum source rows to scan per shard-local repair pass. Zero uses the server default.
          default: 100
        shard_cursors:
          type: array
          description: Per-shard continuation cursors returned by a prior response. When present, distributed
            repair resumes exactly these shard-local cursors instead of resolving a fresh global key span.
          items:
            $ref: '#/components/schemas/DocumentArtifactReprocessShardCursor'
    DocumentArtifactReprocessFailure:
      type: object
      required:
        - key
        - error_code
      properties:
        key:
          type: string
          description: Source document key that failed during reprocessing.
        error_code:
          type: string
          description: Stable error code for the failed document reprocess attempt.
    DocumentArtifactReprocessShardCursor:
      type: object
      required:
        - next_key
        - scanned
        - reprocessed
        - skipped
        - failed
        - limit
      properties:
        group_id:
          type: integer
          format: uint64
          nullable: true
          description: Physical table group that produced this cursor, when known.
        next_key:
          type: string
          description: Source key cursor for resuming this shard-local repair pass.
        scanned:
          type: integer
          description: Number of source rows scanned by this shard-local pass.
        reprocessed:
          type: integer
          description: Number of source rows whose artifact was reprocessed by this shard-local pass.
        skipped:
          type: integer
          description: Number of scanned source rows that no longer had a reprocessable source document
            in this shard-local pass.
        failed:
          type: integer
          description: Number of scanned source rows that failed in this shard-local pass.
        limit:
          type: integer
          format: uint32
          description: Effective scan limit used by this shard-local pass.
    DocumentArtifactTableReprocessResponse:
      type: object
      required:
        - reprocess
        - reprocess_status
        - artifact_name
        - scanned
        - reprocessed
        - skipped
        - failed
        - limit
        - pending_shards
        - failures
        - shard_cursors
      properties:
        reprocess:
          type: string
          enum:
            - triggered
          description: Indicates that reprocessing was accepted.
        reprocess_status:
          type: string
          enum:
            - in_progress
            - complete
          description: Completion state for this bounded pass. `in_progress` means the caller should persist
            the returned cursor(s) and schedule another pass; `complete` means no continuation cursor
            remains.
        artifact_name:
          type: string
          description: Name of the derived artifact that was reprocessed.
        scanned:
          type: integer
          description: Number of source rows scanned by this bounded pass.
        reprocessed:
          type: integer
          description: Number of source rows whose artifact was reprocessed.
        skipped:
          type: integer
          description: Number of scanned source rows that no longer had a reprocessable source document.
        failed:
          type: integer
          description: Number of scanned source rows that failed before recording a normal artifact manifest.
        limit:
          type: integer
          format: uint32
          description: Effective scan limit used by the bounded pass.
        next_key:
          type: string
          nullable: true
          description: Source key cursor for the next bounded pass, when more rows may remain.
        pending_shards:
          type: integer
          description: Number of shard-local continuations still pending after this pass. For single-shard
            callers this is 1 when only `next_key` remains and 0 when complete.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DocumentArtifactReprocessFailure'
        shard_cursors:
          type: array
          description: Per-shard continuation cursors for distributed repairs. Durable background repair
            jobs should persist and resume these independently instead of collapsing progress into a single
            global cursor.
          items:
            $ref: '#/components/schemas/DocumentArtifactReprocessShardCursor'
    DocumentArtifactReprocessJobStartRequest:
      type: object
      description: Request to create a durable table artifact reprocess job.
      properties:
        from_key:
          type: string
          description: Exclusive lower bound source document key.
          default: ''
        to_key:
          type: string
          description: Inclusive upper bound source document key, or empty for the end of the table/range.
          default: ''
        limit:
          type: integer
          format: uint32
          description: Maximum source rows to scan per shard-local repair pass. Zero uses the server default.
          default: 100
        advance:
          type: boolean
          description: When true, immediately runs the first bounded pass before returning the job state.
          default: true
    DocumentArtifactReprocessJob:
      type: object
      required:
        - job_id
        - attempt_id
        - table_name
        - artifact_name
        - phase
        - reprocess_status
        - from_key
        - to_key
        - limit
        - scanned
        - reprocessed
        - skipped
        - failed
        - pending_shards
        - failures
        - shard_cursors
        - cancel_requested
        - created_at_millis
        - last_updated_at_millis
        - expires_at_millis
      properties:
        job_id:
          type: integer
          format: uint64
          description: Server-assigned durable repair job identifier.
        attempt_id:
          type: integer
          format: uint64
          description: Monotonic execution attempt token for the current running pass.
        table_name:
          type: string
          description: Table containing the source documents being repaired.
        artifact_name:
          type: string
          description: Name of the derived artifact being repaired.
        phase:
          type: string
          enum:
