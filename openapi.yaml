        '503':
          $ref: '#/components/responses/TransientCapacity'
          description: Inference service unavailable. The unified Antfly server also returns this status
            when authentication is enabled but its backend is not ready.
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
  /ai/v1/extract:
    post:
      summary: Extract entities, relations, classifications, and structures
      description: >
        Schema-driven extraction over shared AI content parts. This is the

        canonical public API for named entity recognition, relation extraction,

        text/document classification, token classification, and structured

        document extraction.


        Image-backed extraction uses the same byte-reserving and image-count-weighted

        admission policy as `/read`, before model resolution or download. Text-only

        extraction consumes one admission unit.
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
      responses:
        '200':
          description: Extraction completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '403':
          description: Remote content blocked by the configured content security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '413':
          description: Media content exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '502':
          description: Remote content fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '503':
          $ref: '#/components/responses/TransientCapacity'
          description: Inference service unavailable. The unified Antfly server also returns this status
            when authentication is enabled but its backend is not ready.
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
  /ai/v1/models:
    get:
      summary: List available models
      description: >
        Returns lists of available embedding, chunking, reranking, generator, extractor, rewriter, reader,
        and transcriber models.


        ## Embedders


        - ONNX models from `models_dir/embedders/`

        - Quantized variants have `-i8` suffix


        ## Chunkers


        - Always includes "fixed" (built-in)

        - Plus any ONNX models from `models_dir/chunkers/`


        ## Rerankers


        - Native or ONNX rerankers from `models_dir/rerankers/`

        - `model_manifest.json` capabilities can mark late-interaction text rerankers (`late_interaction`,
        `colbert`)

        - Empty if no models configured


        ## Generators


        - LLM models from `models_dir/generators/`

        - Empty if no models configured


        ## Extractors


        - Extraction-capable models from the managed model registry

        - Includes GLiNER models for zero-shot entity and relation extraction


        ## Rewriters


        - Seq2Seq models from `models_dir/rewriters/`

        - T5, FLAN-T5, BART, and LMQG question generation models


        ## Readers


        - Vision2Seq models from `models_dir/readers/`

        - TrOCR, Donut, Florence-2 for OCR and document understanding


        ## Transcribers


        - Speech2Seq models from `models_dir/transcribers/`

        - Whisper, Wav2Vec2, HuBERT for speech-to-text


        Models are discovered at service startup and cached.
      operationId: listModels
      responses:
        '200':
          description: Models retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceModelsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '503':
          description: The unified Antfly server also returns this status when authentication is enabled
            but its backend is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
  /ai/v1/embeddings:
    post:
      summary: Create embeddings (OpenAI-compatible)
      description: >
        OpenAI-compatible embeddings endpoint. Accepts the same request format

        as OpenAI's `/v1/embeddings` API, served here under `/ai/v1/embeddings`.

        For sparse-capable models, each `data` item still uses the `embedding`

        field, but its value is a sparse vector object instead of a dense float array.

        Dense image inputs are header-validated and admitted against the aggregate

        decoded-pixel budget before model loading. Remote URL byte potential is reserved

        before fetch; inline sources use their actual encoded size. Use this endpoint for

        drop-in compatibility with OpenAI SDKs.
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceEmbedRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceEmbedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '403':
          description: Remote content blocked by the configured content security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '413':
          description: Encoded media, image dimensions, or aggregate decoded pixels exceed the configured
            limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '503':
          $ref: '#/components/responses/TransientCapacity'
          description: Inference service unavailable. The unified Antfly server also returns this status
            when authentication is enabled but its backend is not ready.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '502':
          description: Remote content fetch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
  /ml/v1/models:
    get:
      summary: List Traditional ML predictors
      description: >
        Returns the Traditional ML predictor catalog for `/ml/v1/predict`.

        Predictors are loaded from `<ml_dir>/<name>/` and exposed separately

        from the AI model catalog.
      operationId: listPredictors
      responses:
        '200':
          description: Predictors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferencePredictorsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '503':
          description: The unified Antfly server also returns this status when authentication is enabled
            but its backend is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
  /ml/v1/predict:
    post:
      summary: Run a traditional ML predictor
      description: >
        Run a tabular predictor (tree ensemble, linear, or SVM) on a batch of

        feature vectors. Models are loaded from `<ml_dir>/<name>/` and

        identified by name. Use `/ml/v1/models` for the list of available

        predictors and their feature schemas.
      operationId: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferencePredictRequest'
      responses:
        '200':
          description: Predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferencePredictResponse'
        '400':
          description: Invalid request (malformed body, feature-count mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '404':
          description: Predictor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '413':
          description: Batch too large (> 10000 rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '401':
          description: Authentication is enabled and valid credentials were not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
        '503':
          description: The unified Antfly server also returns this status when authentication is enabled
            but its backend is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
