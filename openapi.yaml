  /db/v1/backup:
    post:
      summary: Backup all tables or selected tables
      tags:
        - cluster_management
      description: >
        Creates a backup of all tables or specified tables. Each table's backup includes:

        - Table metadata (schema, indexes, shard configuration)

        - All shard data (compressed with zstd)


        A non-empty backup publishes a cluster-level manifest only after every

        requested table backup is durable. The manifest is the final commit

        point and records complete expected/completed table counts. A `partial`

        or `failed` attempt returns per-table diagnostics but does not publish a

        restorable aggregate manifest. A cluster with no selected tables returns

        `400` without writing a backup artifact.


        Backup IDs are immutable. Reusing an ID that already has a published

        cluster manifest returns `409` and leaves the existing backup unchanged.


        **Storage Locations:**

        - Local filesystem: `file:///path/to/backup`

        - Amazon S3: `s3://bucket-name/path/to/backup`


        **Backup Structure:**

        ```

        {location}/

        ├── {backup_id}-cluster-metadata.json   (cluster manifest)

        └── generation-scoped table manifests and payloads

        ```
      operationId: backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterBackupRequest'
      responses:
        '200':
          description: >
            Backup attempt completed. Inspect the response `status`: `completed`

            is fully successful, while `partial` or `failed` reports per-table

            failures even though the request itself was processed successfully.

            Only `completed` publishes a restorable cluster manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterBackupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BackupMetadataUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/restore:
    post:
      summary: Restore multiple tables from a backup
      tags:
        - cluster_management
      description: >
        Restores tables from a cluster backup. Can restore all tables or a subset.


        **Restore Modes:**

        - `fail_if_exists`: Abort if any target table already exists (default)

        - `skip_if_exists`: Skip existing tables and restore the rest

        - `overwrite`: Stage and validate replacement generations, then atomically publish them over existing
        tables.


        The restore is a durable asynchronous job. The request returns after the

        job record is persisted and both a durable job store and asynchronous

        worker are available. Poll the restore job resource for progress.

        Catalog publication is durably checkpointed per table and is not

        repeated after restart. If leadership changes before that checkpoint,

        recovery adopts only an exact, still-active restore intent for the same

        backup and location; unrelated or ambiguous existing tables fail closed.

        A job reaches `succeeded` only after all placement replicas report the

        restore complete and metadata clears the restore intent. Cancellation is

        cooperative between table publication boundaries. Remote transfer and

        staging occur before the per-table write fence. Publication stops new

        admission and drains current readers and writers before swapping the

        direct-path generation.
      operationId: restore
      x-antfly-credential-note: Durable CDC and graph destinations require Basic or API-key authentication.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
            x-go-type-skip-optional-pointer: false
          description: Stable key used to safely retry creation of this restore job. Keys are scoped to
            the authenticated principal and cluster restore target. Requests without this header create
            a new job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRestoreRequest'
      responses:
        '202':
          description: Restore job durably accepted
          headers:
            Location:
              description: Relative URL of the durable restore job resource.
              schema:
                type: string
            Retry-After:
              description: Suggested polling delay in seconds.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The selected backup contains durable destinations that cannot be bound to this
            credential type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/restore/jobs:
    get:
      summary: List durable restore jobs
      description: Returns a newest-first, authorization-filtered page of retained restore jobs from the
        metadata leader.
      operationId: listRestoreJobs
      tags:
        - cluster_management
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 20
            pattern: ^[1-9][0-9]{0,19}$
          description: Opaque cursor returned by the preceding page.
        - name: phase
          in: query
          schema:
            type: string
            enum:
              - queued
              - running
              - succeeded
              - failed
              - cancelled
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - table
              - cluster
      responses:
        '200':
          description: Authorized restore jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/restore/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
    get:
      summary: Get durable restore job status
      description: >
        Returns replicated restore-job state. A metadata follower may return

        the retryable metadata-not-leader `503` until a newly committed job has

        applied locally; clients should retry instead of treating that response

        as job absence.
      operationId: getRestoreJob
      tags:
        - cluster_management
      responses:
        '200':
          description: Restore job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
    delete:
      summary: Request cooperative restore cancellation
      description: >
        Requests best-effort cancellation. Queued work is cancelled immediately

        and running work stops at its next safe boundary. If irreversible restore

        publication completes before cancellation is observed, the job remains

        `succeeded` with `cancel_requested: true`.
      operationId: cancelRestoreJob
      tags:
        - cluster_management
      responses:
        '200':
          description: Updated restore job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJob'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/backups:
    get:
      summary: List available backups
      tags:
        - cluster_management
      description: >
        Lists one bounded page of cluster-level backups in stable manifest-key

        order at the specified location. Returns metadata about each backup

        including the tables included, timestamp, and Antfly version. Pass the

        returned `next_cursor` unchanged to retrieve the next page.
      operationId: listBackups
      parameters:
        - name: location
          in: query
          required: true
          description: >
            Storage location to search for backups.

            - Local filesystem: `file:///path/to/backup`

            - Amazon S3: `s3://bucket-name/path/to/backup`
          schema:
            type: string
          example: s3://mybucket/antfly-backups/
        - name: connection
          in: query
          required: true
          description: Named `external_io` connection authorized for reading this backup location.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum backups returned in one page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            x-go-type-skip-optional-pointer: false
        - name: cursor
          in: query
          required: false
          description: Continuation cursor returned by the preceding page.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
            x-go-type-skip-optional-pointer: false
      responses:
        '200':
          description: List of available backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/query:
    post:
      summary: Perform a global query
      tags:
        - query_operations
      description: >
        Executes a query across all relevant tables and shards based on the query content.


        ## Query Examples


        **Full-text search:**

        ```json

        {
          "table": "wikipedia",
          "full_text_search": {"query": "body:computer"},
          "limit": 10
        }

        ```


        **Semantic search:**

        ```json

        {
          "table": "articles",
          "semantic_search": "artificial intelligence applications",
          "indexes": ["title_body_embedding"],
          "limit": 20
        }

        ```


        **Hybrid search (RRF):**

        ```json

        {
          "table": "products",
          "full_text_search": {"query": "laptop gaming"},
          "semantic_search": "high performance gaming computers",
          "indexes": ["product_embedding"],
          "filter_query": {"query": "+price:<2000 +in_stock:true"},
          "fields": ["name", "price", "description"],
          "limit": 15
        }

        ```


        **With filtering:**

        ```json

        {
