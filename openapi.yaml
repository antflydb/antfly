          type: string
    post:
      summary: Synchronize data from external sources (Shopify, Postgres, S3) using a linear merge
      tags:
        - data_operations
      operationId: linearMerge
      description: >
        Synchronize and keep Antfly in sync with external data sources like Shopify,

        Postgres, S3, or any sorted record source. Also known as: data synchronization,

        database sync, incremental sync, e-commerce sync.


        Both source and destination must be sorted by the same key. Performs three-way merge:

        - Inserts new records from source

        - Updates changed records

        - Deletes Antfly records absent from source page


        **Stateless & Idempotent**: No sync state between pages. Safe to restart

        from any page if interrupted.


        **Use Cases**: Sync production databases, e-commerce APIs (Shopify, WooCommerce),

        data lake exports, or warehouse tables to Antfly for low-latency hybrid search.


        **WARNING**: Not safe for concurrent merges with overlapping ranges.

        Single-client sync API only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinearMergeRequest'
            examples:
              plain:
                summary: Uncompressed JSON merge request
                value:
                  records:
                    product:001:
                      name: Laptop
                      price: 999.99
                    product:002:
                      name: Mouse
                      price: 29.99
                  last_merged_id: ''
              gzip:
                summary: Same JSON body with Content-Encoding gzip
                value:
                  records:
                    product:001:
                      name: Laptop
                      price: 999.99
                    product:002:
                      name: Mouse
                      price: 29.99
                  last_merged_id: ''
      responses:
        '200':
          description: Merge completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinearMergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
