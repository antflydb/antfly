            - committed_pending
            - committed_visibility_pending
            - committed_recovery_pending
            - committed_repair_required
          description: Durable commit and recovery state for this operation.
        inserted:
          type: integer
          description: Number of documents inserted by the sealed operation.
        deleted:
          type: integer
          description: Number of documents deleted by the sealed operation.
        transformed:
          type: integer
          description: Number of documents transformed by the sealed operation.
        transaction_id:
          type: string
          description: Stable transaction receipt ID for replay and reconciliation.
        reconcile:
          type: string
          description: Transaction-session status path for this operation.
    IdempotentBatchError:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - message
        - retryable
        - transaction_id
        - reconcile
      properties:
        status:
          type: string
          enum:
            - not_applied
            - aborted
            - unknown
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        transaction_id:
          type: string
        reconcile:
          type: string
          description: Transaction-session status path for this keyed batch.
    DenseRepairBackpressureError:
      type: object
      description: A dense-index rebuild is retaining replay history and the node has reached its hard
        safety budget.
      required:
        - code
        - message
        - retryable
        - retry_after_ms
      properties:
        code:
          type: string
          enum:
            - dense_repair_backpressure
        message:
          type: string
        retryable:
          type: boolean
          enum:
            - true
        retry_after_ms:
          type: integer
          format: uint32
          minimum: 1
          description: Suggested delay before retrying the write.
    MultiBatchRequest:
      type: object
      description: >
        Cross-table batch operations in a single atomic transaction.


        Groups batch operations by table name. All operations across all tables

        are committed atomically using distributed 2-phase commit (2PC).


        **Atomicity**: Either all operations across all tables succeed, or none do.

        This enables use cases like transferring a record from one table to another,

        or maintaining referential integrity across tables.
      required:
        - tables
      properties:
        tables:
          type: object
          description: >
            Map of table names to batch operations for that table.

            Each entry follows the same format as a single-table BatchRequest.
          additionalProperties:
            $ref: '#/components/schemas/BatchRequest'
          example:
            users:
              inserts:
                user:123:
                  name: John Doe
                  email: john@example.com
            orders:
              inserts:
                order:456:
                  user_id: user:123
                  total: 99.99
        sync_level:
          $ref: '#/components/schemas/SyncLevel'
    MultiBatchResponse:
      type: object
      description: >
        Response for a cross-table batch operation. Contains per-table results.
      properties:
        status:
          type: string
          description: >
            Durable commit outcome. Pending states mean requested visibility or

            participant propagation is still completing. `committed_repair_required`

            means the primary writes committed, but a terminal enrichment failure needs

            operator repair and will not be retried indefinitely.
          enum:
            - committed
            - committed_visibility_pending
            - committed_recovery_pending
            - committed_repair_required
        tables:
          type: object
          description: Per-table batch results
          additionalProperties:
            $ref: '#/components/schemas/BatchResponse'
    TransactionReadItem:
      type: object
      description: >
        A key that was read as part of an OCC transaction, along with the version

        observed at read time. Used to detect conflicts at commit time.
      required:
        - table
        - key
        - version
      properties:
        table:
          type: string
          description: Table name the key belongs to
        key:
          type: string
          description: Document key that was read
        version:
          type: string
          description: >
            Version token observed at read time (from X-Antfly-Version header).

            Use "0" to assert the key did not exist at read time.
    TransactionCommitRequest:
      type: object
      description: >
        Stateless OCC (Optimistic Concurrency Control) transaction commit request.


        The client reads documents (capturing version tokens from the X-Antfly-Version

        response header on lookups), computes writes locally, then submits everything

        in this single commit request. The server validates that all read versions

        still match before executing writes atomically via 2PC.


        **No server-side state**: There is no "begin" endpoint. The client manages

        its own read set and submits the full transaction in one request.
      required:
        - read_set
        - tables
      properties:
        read_set:
          type: array
          description: >
            Set of keys that were read during the transaction, with their observed versions.

            The server verifies these versions still match before committing writes.
          items:
            $ref: '#/components/schemas/TransactionReadItem'
        tables:
          type: object
          description: >
            Write set: map of table names to batch operations, same format as MultiBatchRequest.tables.
          additionalProperties:
            $ref: '#/components/schemas/BatchRequest'
        sync_level:
          $ref: '#/components/schemas/SyncLevel'
    TransactionConflictParticipant:
      type: object
      description: Participant location and 2PC phase where the conflict occurred.
      properties:
        group_id:
          type: integer
          format: uint64
          description: Raft group that reported the conflict.
        phase:
          type: string
          enum:
            - begin
            - prepare
            - resolve
          description: 2PC participant phase that reported the conflict.
    TransactionConflict:
      type: object
      description: Structured details for an aborted transaction attempt.
      required:
        - table
        - key
        - message
        - kind
        - retryable
      properties:
        table:
          type: string
          description: Table where the conflict was detected.
        key:
          type: string
          description: Document key associated with the conflict, when applicable.
        message:
          type: string
          description: Human-readable conflict description.
        kind:
          type: string
          enum:
            - version_conflict
            - intent_conflict
            - topology_changed
            - participant_unavailable
            - doc_identity_unavailable
            - session_lease_lost
            - transaction_conflict
            - torn_state
          description: Stable machine-readable conflict classification.
        retryable:
          type: boolean
          description: Whether retrying the transaction may succeed without changing its writes.
        retry_after_ms:
          type: integer
          format: uint32
          minimum: 1
          description: Minimum suggested delay before retrying a retryable conflict.
        retry_scope:
          type: string
          enum:
            - topology
            - participant
            - doc_identity
            - session
          description: Component whose state should be refreshed before retrying.
        expected_version:
          type: integer
          format: uint64
          description: Version required by the transaction predicate.
        current_version:
          type: integer
          format: uint64
          description: Version observed while validating the transaction predicate.
        participant:
          $ref: '#/components/schemas/TransactionConflictParticipant'
    TransactionCommitResponse:
      type: object
      description: Result of an OCC transaction commit attempt.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - committed
            - committed_visibility_pending
            - committed_recovery_pending
            - committed_repair_required
            - aborted
          description: >
            Durable transaction outcome. Pending committed states mean the

            commit decision is durable while its requested visibility barrier

            or participant recovery is still completing. `committed_repair_required`

            means the commit decision is durable and coordination may be released, but

            a terminal enrichment failure requires operator repair.
        conflict:
          description: Details about the conflict that caused an abort (only present when status is "aborted")
          $ref: '#/components/schemas/TransactionConflict'
        tables:
          type: object
          description: Per-table batch results (present for every committed status)
          additionalProperties:
            $ref: '#/components/schemas/BatchResponse'
    TransactionBeginRequest:
      type: object
      properties:
        sync_level:
          $ref: '#/components/schemas/SyncLevel'
    TransactionBeginResponse:
      type: object
      required:
        - transaction_id
        - begin_timestamp
        - sync_level
      properties:
        transaction_id:
          type: string
        begin_timestamp:
          type: integer
          format: int64
        sync_level:
          type: string
    TransactionStatusResponse:
      type: object
      required:
        - status
        - transaction_id
      properties:
        status:
          type: string
        transaction_id:
          type: string
    TransactionSavepointResponse:
      type: object
      required:
        - status
        - transaction_id
        - savepoint_id
      properties:
        status:
          type: string
        transaction_id:
          type: string
        savepoint_id:
          type: integer
          format: int64
    TransactionStageReadRequest:
      type: object
      required:
        - table
        - key
        - version
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: string
    TransactionStageWriteRequest:
      type: object
      required:
        - table
        - key
        - document
      properties:
        table:
          type: string
        key:
          type: string
        document:
          type: object
          additionalProperties: true
    TransactionStageDeleteRequest:
      type: object
      required:
        - table
        - key
      properties:
        table:
          type: string
        key:
          type: string
    TransactionStageReadSnapshot:
      type: object
      required:
        - table
        - key
        - version
        - document
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: string
        document:
          nullable: true
    TransactionStageReadResponse:
      type: object
      required:
        - status
        - transaction_id
        - snapshot
      properties:
        status:
          type: string
        transaction_id:
          type: string
        snapshot:
          $ref: '#/components/schemas/TransactionStageReadSnapshot'
    TransactionSessionCommitResponse:
      allOf:
        - $ref: '#/components/schemas/TransactionCommitResponse'
        - type: object
          required:
            - transaction_id
          properties:
            transaction_id:
              type: string
    TransactionSessionStatus:
      type: object
      required:
        - transaction_id
        - owner_node_id
        - begin_timestamp
        - last_touched_timestamp
        - lease_expires_at
        - lease_state
        - sync_level
        - staged_table_count
        - staged_read_count
        - staged_write_count
        - staged_delete_count
        - read_snapshot_count
        - savepoint_count
        - durable
      properties:
        transaction_id:
          type: string
        owner_node_id:
          type: integer
          format: int64
        begin_timestamp:
          type: integer
          format: int64
        last_touched_timestamp:
          type: integer
          format: int64
        lease_expires_at:
          type: integer
          format: int64
        lease_state:
          type: string
        sync_level:
          type: string
        staged_table_count:
          type: integer
        staged_read_count:
          type: integer
        staged_write_count:
          type: integer
        staged_delete_count:
          type: integer
        read_snapshot_count:
          type: integer
        savepoint_count:
          type: integer
        savepoint_limit:
          type: integer
          nullable: true
        remaining_savepoints:
          type: integer
          nullable: true
        durable:
          type: boolean
        outcome:
          type: string
          nullable: true
          enum:
            - not_applied
            - aborted
            - unknown
            - committed
            - committed_visibility_pending
            - committed_recovery_pending
            - committed_repair_required
        repair_required:
          type: boolean
    TransactionSessionTableDetail:
      type: object
      properties:
        table:
          type: string
        staged_read_count:
          type: integer
        staged_write_count:
          type: integer
        staged_delete_count:
          type: integer
        staged_predicate_count:
          type: integer
    TransactionSessionReadSnapshot:
      type: object
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: integer
          format: int64
        document:
          nullable: true
    TransactionSessionDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/TransactionSessionStatus'
        - type: object
          properties:
            tables:
              type: array
              items:
                $ref: '#/components/schemas/TransactionSessionTableDetail'
            read_snapshots:
              type: array
              items:
                $ref: '#/components/schemas/TransactionSessionReadSnapshot'
            savepoint_ids:
              type: array
              items:
                type: integer
                format: int64
    TransactionSessionListResponse:
      type: object
      properties:
        session_count:
          type: integer
        lease_held_count:
          type: integer
        lease_expired_count:
          type: integer
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSessionStatus'
    TransactionSessionCleanupResponse:
      type: object
      properties:
        removed:
          type: integer
        cutoff_ns:
          type: integer
          format: int64
    BackupRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: >
            Unique identifier for this backup. Used to reference the backup for restore operations.

            Choose a meaningful name that includes date/version information.
          example: backup-2025-01-15-v2
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            Storage location for the backup. Supports multiple backends:

            - Scoped filesystem connection: `file:///logical/path`

            - Amazon S3: `s3://bucket-name/path/to/backup`

            - Google Cloud Storage: `gs://bucket-name/path/to/backup`


            The backup includes all table data, indexes, and metadata for the specified table.
          example: s3://mybucket/antfly-backups/users-table/2025-01-15
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            ID of a configured `external_io` connection. Required for every

            network API backup and restore. Object locations enforce bucket and

            prefix scopes; filesystem URI paths resolve beneath the connection root.
        format:
          type: string
          enum:
            - native
            - portable
          default: portable
          description: >
            Backup format to use:

            - `native`: Engine-specific physical snapshot (fast backup and restore, same-backend only)

            - `portable`: Cross-backend logical backup in AFB format (slower restore due to index rebuild,
            but can be restored by any Antfly backend)


            On restore, the format is auto-detected from file magic bytes.
          example: portable
    RestoreRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Identifier of the published backup to restore.
          example: backup-2025-01-15-v2
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            Storage location containing the backup. The server detects the

            native or portable format from the published manifest and artifact.
          example: s3://mybucket/antfly-backups/users-table/2025-01-15
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            ID of a configured `external_io` connection with `restore.read`.

            Object locations enforce bucket and prefix scopes; filesystem URI

            paths resolve beneath the connection root.
    ClusterBackupRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: >
            Unique identifier for this backup. Used to reference the backup for restore operations.

            Choose a meaningful name that includes date/version information.
          example: cluster-backup-2025-01-15
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            Storage location for the backup. Supports multiple backends:

            - Scoped filesystem connection: `file:///logical/path`

            - Amazon S3: `s3://bucket-name/path/to/backup`

            - Google Cloud Storage: `gs://bucket-name/path/to/backup`


            The backup includes all table data, indexes, and metadata.
          example: s3://mybucket/antfly-backups/cluster/2025-01-15
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: Required configured `external_io` connection with the `backup.write` capability.
        format:
          type: string
          enum:
            - native
            - portable
          default: portable
          description: >
            Backup format to use:

            - `native`: Engine-specific physical snapshot (fast backup and restore, same-backend only)

            - `portable`: Cross-backend logical backup in AFB format (slower restore due to index rebuild,
            but can be restored by any Antfly backend)


            On restore, the format is auto-detected from file magic bytes.
          example: portable
        table_names:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: >
            Optional list of tables to backup. If omitted, all tables are backed up,

            up to the cluster backup limit of 4096 tables. Requests above that limit

            fail before any table backup is created.
          example:
            - users
            - products
    ClusterBackupResponse:
      type: object
      required:
        - backup_id
        - tables
        - status
      properties:
        backup_id:
          type: string
          description: The backup identifier
          example: cluster-backup-2025-01-15
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableBackupStatus'
          description: Status of each table backup
        status:
          type: string
          enum:
            - completed
            - successful
            - partial
            - failed
            - ambiguous
          description: Overall backup status
          example: completed
    TableBackupStatus:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      description: >
        Outcome for one table in a cluster backup. `successful` is the legacy

        spelling emitted by pre-Zig coordinators; new coordinators emit `completed`.


        An `ambiguous` outcome includes `error`, `code`, `retryable: false`,

        `backup_id`, and `artifact_backup_id` so callers can reconcile the retained

        generation without retrying blindly. Failed and skipped outcomes may include

        `error`; other fields are omitted when they do not apply.
      properties:
        name:
          type: string
          description: Table name
          example: users
        status:
          type: string
          enum:
            - completed
            - successful
            - failed
            - skipped
            - ambiguous
          example: completed
        error:
          type: string
          description: Human-readable failure, skip reason, or reconciliation guidance.
        code:
          type: string
          enum:
            - backup_outcome_ambiguous
          description: Stable machine-readable code for an ambiguous outcome.
        retryable:
          type: boolean
          description: False for an ambiguous outcome; inspect the retained attempt before retrying.
        backup_id:
          type: string
          description: Logical per-table backup ID retained by an ambiguous cluster attempt.
        artifact_backup_id:
          type: string
          description: Opaque artifact generation retained by an ambiguous cluster attempt.
    ClusterRestoreRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: >
            Unique identifier of the backup to restore from.
          example: cluster-backup-2025-01-15
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            Storage location where the backup is stored.
          example: s3://mybucket/antfly-backups/cluster/2025-01-15
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: Required configured `external_io` connection with the `restore.read` capability.
        table_names:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: >
            Optional list of tables to restore. If omitted, all tables in the backup are restored,

            up to the cluster restore limit of 4096 tables. Larger backups must be restored

            in explicit batches of at most 256 tables.
          example:
            - users
            - products
        restore_mode:
          type: string
          enum:
            - fail_if_exists
            - skip_if_exists
            - overwrite
          default: fail_if_exists
          description: >
            How to handle existing tables:

            - `fail_if_exists`: Abort if any table already exists (default)

            - `skip_if_exists`: Skip existing tables, restore others

            - `overwrite`: Atomically replace existing table generations after staging and validation
          example: skip_if_exists
    RestoreJob:
      type: object
      required:
        - job_id
        - attempt_id
        - scope
        - backup_id
        - phase
        - cancel_requested
        - durability_pending_table_count
        - published_table_count
        - completed_table_count
        - created_at_ms
        - updated_at_ms
      properties:
        job_id:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
          description: Opaque durable restore-job identifier. Clients must not parse it as a number.
        attempt_id:
          type: integer
          format: int64
        scope:
          type: string
          enum:
            - table
            - cluster
        table_name:
          type: string
        backup_id:
          type: string
        phase:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        cancel_requested:
          type: boolean
        durability_pending_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of tables whose generation publication is visible but whose parent-directory
            durability could not be confirmed.
        published_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of table restore intents durably published. Published tables are adopted,
            not republished, after failover.
        completed_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of published tables whose placement replicas completed restore and whose
            completion checkpoint is durable.
        total_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Requested table count when known before execution.
        result:
          type: object
          additionalProperties: false
          description: >
            Bounded terminal result. A committed result with durability pending means publication is visible
            but

            parent-directory durability was not confirmed. Cluster restores report aggregate triggered,
            committed,

            durability-pending, skipped, and failed table counts plus a bounded sample of failure details.

            `failure_details_truncated` indicates that additional failures or part of a long failure detail
            were omitted.

            Any failed or durability-pending table makes the job phase `failed`; inspect this result for
            partial progress

            and use a new idempotency key when retrying a changed request.
          properties:
            restore:
              type: string
              enum:
                - triggered
                - committed
              description: Present for a single-table restore result.
            durability:
              type: string
              enum:
                - pending
              description: Present when table publication is visible but filesystem durability could not
                be confirmed.
            status:
              type: string
              enum:
                - completed
                - durability_pending
                - partial
                - failed
              description: Aggregate terminal status for a cluster restore.
            triggered_table_count:
              type: integer
              format: int64
              minimum: 0
            committed_table_count:
              type: integer
              format: int64
              minimum: 0
            durability_pending_table_count:
              type: integer
              format: int64
              minimum: 0
            skipped_table_count:
              type: integer
              format: int64
              minimum: 0
            failed_table_count:
              type: integer
              format: int64
              minimum: 0
            failure_details:
              type: array
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required:
                  - table_name
                  - error
                  - table_name_truncated
                properties:
                  table_name:
                    type: string
                    maxLength: 256
                  error:
                    type: string
                    maxLength: 256
                  table_name_truncated:
                    type: boolean
            failure_details_truncated:
              type: boolean
              description: True when additional failed tables or part of a long table name or error were
                omitted.
        error:
          type: string
        created_at_ms:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
          description: Unix epoch milliseconds after which this terminal job record and its idempotency
            key may be removed. Omitted while the job is nonterminal.
    RestoreJobList:
      type: object
      additionalProperties: false
      required:
        - jobs
      properties:
        jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RestoreJob'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[1-9][0-9]{0,19}$
          description: Opaque newest-first continuation cursor. A page can be empty and still include
            a cursor when authorization or filters exclude a bounded scan window. Omitted when the retained
            scan is exhausted.
    ClusterRestoreResponse:
      type: object
      required:
        - tables
        - status
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableRestoreStatus'
          description: Status of each table restore
        status:
          type: string
          enum:
            - completed
            - triggered
            - durability_pending
            - partial
            - failed
          description: Overall restore status
          example: completed
    TableRestoreStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Table name
          example: users
        status:
          type: string
          enum:
            - triggered
            - committed
            - durability_pending
            - skipped
            - failed
          description: Restore status for this table
          example: triggered
        error:
          type: string
          description: Error message if restore failed
    BackupInfo:
      type: object
      required:
        - backup_id
        - timestamp
        - tables
        - location
      properties:
        backup_id:
          type: string
          description: The backup identifier
          example: cluster-backup-2025-01-15
        timestamp:
          type: string
          format: date-time
          description: When the backup was created
          example: '2025-01-15T10:30:00Z'
        tables:
          type: array
          items:
            type: string
          description: Tables included in the backup
          example:
            - users
            - products
        location:
          type: string
          description: Storage location of the backup
          example: s3://mybucket/antfly-backups/cluster/2025-01-15
        antfly_version:
          type: string
          description: Antfly version that created the backup
          example: v1.0.0
        format:
          type: string
          enum:
            - native
            - portable
          description: Backup format used
          example: portable
    BackupListResponse:
      type: object
      required:
        - backups
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/BackupInfo'
          maxItems: 1000
          description: One page of available backups in stable manifest-key order.
        next_cursor:
          type: string
          description: Opaque continuation cursor. Omitted when no additional backups remain.
    QueryBuilderRequest:
      type: object
      required:
        - intent
      properties:
        session_id:
          type: string
          description: Correlation identifier for a bounded agent interaction. In Phase 1 this is echoed
            back to the client but does not imply server-side session persistence.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentDecision'
          description: Structured answers provided by the user as part of client-carried continuation.
        interactive:
          type: boolean
          default: true
          description: If true, the agent may return clarification questions when needed.
        max_internal_iterations:
          type: integer
          minimum: 0
          maximum: 20
          description: Additive bounded-agent field for the query builder. Phase 1 remains a single-pass
            generation flow, but this field is echoed in result accounting.
        max_user_clarifications:
          type: integer
          minimum: 0
          maximum: 10
          description: Maximum number of clarification turns the agent may request from the user.
        require_decision_after:
          type: integer
          minimum: 0
          maximum: 20
          description: Force a user-facing decision after this many unresolved internal passes.
        example_documents:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional example documents to help the query builder infer field shapes and representative
            values. When omitted and the table has data but no schema, the server samples up to one document
            automatically.
        table:
          type: string
          description: Name of the table to build query for. If provided, uses table schema for field
            context.
          example: articles
        intent:
          type: string
          description: Natural language description of the search intent
          example: Find all published articles about machine learning from the last year
        schema_fields:
          type: array
          items:
            type: string
          description: List of searchable field names to consider. Overrides table schema if provided.
          example:
            - title
            - content
            - status
            - published_at
        mode:
          type: string
          description: >
            Optional strategy hint for the coordinator. Suggested values are `auto`, `full_text`,

            `semantic`, `hybrid`, `filter`, `tree`, and `graph`. Unknown values are accepted for

            forward compatibility and may fall back to `auto`.
          example: auto
        output:
          type: string
          description: >
            Preferred output artifact. Suggested values are `query_request`, `bleve`, and

            `filter_query`. The compatibility `query` field is still returned for existing clients.
          example: query_request
        constraints:
          type: object
          additionalProperties: true
          description: >
            Optional execution constraints for the coordinator, such as `limit`, `allowed_fields`,

            `prefer_indexes`, and `require_executable`.
          example:
            limit: 10
            require_executable: true
            prefer_indexes:
              - body_embedding
        generator:
          $ref: '#/components/schemas/GeneratorConfig'
    QueryBuilderResult:
      type: object
      required:
        - query
      properties:
        session_id:
          type: string
          description: Correlation identifier for client-carried continuation.
        iteration:
          type: integer
          description: Number of internal passes consumed while producing this result.
        clarification_count:
          type: integer
          description: Number of user clarification turns already consumed in this interaction.
        status:
          $ref: '#/components/schemas/AgentStatus'
          description: Current status of the bounded query-builder execution.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AgentStep'
          description: Shared bounded-agent execution trace for this query-builder run.
        remaining_internal_iterations:
          type: integer
          description: Remaining internal reasoning passes for this interaction.
        remaining_user_clarifications:
          type: integer
          description: Remaining clarification turns allowed for this interaction.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AgentQuestion'
          description: Clarification questions exposed in the shared bounded-agent envelope.
        query:
          type: object
          description: >
            Generated search query in native Bleve format.

            Can be used directly in QueryRequest.full_text_search or filter_query.
          additionalProperties: true
          example:
            conjuncts:
              - match: machine learning
                field: content
              - term: published
                field: status
        query_request:
          $ref: '#/components/schemas/QueryRequest'
          description: >
            Antfly query request assembled by the coordinator. New clients should prefer this

            field when they want an executable Antfly query object.
        retrieval_query_request:
          $ref: '#/components/schemas/RetrievalQueryRequest'
          description: >
            Antfly retrieval query assembled by the coordinator when the requested artifact

            needs retrieval-only features such as tree_search. This is additive to

            query_request for clients that execute through the retrieval agent pipeline.
        specialist:
          type: string
          description: Specialist or strategy used to build the query, such as `full_text`, `filter`,
            or `hybrid`.
          example: full_text
        plan:
          type: object
          additionalProperties: true
          description: Optional machine-readable coordination plan for observability.
        explanation:
          type: string
          description: Human-readable explanation of what the query does and why it was structured this
            way
          example: Searches for 'machine learning' in content field AND requires status to be exactly
            'published'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Model's confidence in the generated query (0.0-1.0)
          example: 0.85
        warnings:
          type: array
          items:
            type: string
          description: Any issues, limitations, or assumptions made when generating the query
          example:
            - Field 'category' not found in schema, using content field instead
    IncompleteDetails:
      type: object
      description: Explains why the agent stopped before completion. Present when status is "incomplete".
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - max_internal_iterations
            - max_tokens
            - no_tools
            - clarification_required
          description: >
            Why the agent stopped:

            - max_internal_iterations: Hit the configured max_internal_iterations limit

            - max_tokens: LLM output was truncated

            - no_tools: No tools were available for agentic mode

            - clarification_required: The agent needs a user decision before it can continue
    RetrievalStrategy:
      type: string
      enum:
        - semantic
        - bm25
        - metadata
        - tree
        - graph
        - hybrid
      description: >
        Strategy for document retrieval:

        - semantic: Vector similarity search using embeddings

        - bm25: Full-text search using BM25 scoring

        - metadata: Structured query on document fields

        - tree: Iterative tree navigation with summarization

        - graph: Relationship-based traversal

        - hybrid: Combine multiple strategies with RRF or rerank
    TreeSearchConfig:
      type: object
      description: >
        Configuration for tree search strategy. Tree search navigates hierarchical

        document structures by evaluating summaries at each level.
      required:
        - index
      properties:
        index:
          type: string
          description: Name of the graph index to use for tree navigation
          example: doc_hierarchy
        start_nodes:
          type: string
          description: >
            Starting nodes for tree search:

            - "$roots" - Query for root nodes (nodes with no parents)

            - Comma-separated explicit node IDs

            When omitted and combined with a QueryRequest in a RetrievalQueryRequest,

            the query results are used as start nodes.
          example: $roots
        max_depth:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Maximum depth to traverse in the tree
        beam_width:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: Number of branches to explore at each level
    RetrievalQueryRequest:
      description: >
        A canonical query in the retrieval pipeline with an optional tree search

        configuration. Each query specifies its own table. Deprecated stateful

        graph_searches compatibility is intentionally unavailable here.


        When both search fields (semantic_search, full_text_search) and tree_search

        are provided, the search results are used as start nodes for tree navigation.
      allOf:
        - $ref: '#/components/schemas/QueryRequest'
        - type: object
          properties:
            tree_search:
              $ref: '#/components/schemas/TreeSearchConfig'
              description: Optional tree search configuration
    AgentQuestionKind:
      type: string
      enum:
        - confirm
        - single_choice
        - multi_choice
        - free_text
        - field_policy
      description: UI rendering/answer handling hint for a bounded agent question
    AgentQuestion:
      type: object
      required:
        - id
        - kind
        - question
      properties:
        id:
          type: string
          description: Stable question identifier for client-carried continuation
          example: clarify_oauth_version
        kind:
          $ref: '#/components/schemas/AgentQuestionKind'
        question:
          type: string
          description: The clarifying question to ask the user
        reason:
          type: string
          description: Why clarification is needed
        options:
          type: array
          items:
            type: string
          description: Optional list of choices for the user
        default_answer:
          type: string
          description: Suggested default answer when the server has a preferred choice
        affects:
          type: array
          items:
            type: string
          description: High-level result areas affected by this decision
    AgentDecision:
      type: object
      required:
        - question_id
      properties:
        question_id:
          type: string
          description: The question being answered
        answer:
          description: User answer, scalar or structured depending on the question kind
        approved:
          type: boolean
          description: Used for confirm/review steps where the draft may be accepted as-is
    AgentStatus:
      type: string
      enum:
        - clarification_required
        - completed
        - in_progress
        - incomplete
        - failed
      description: Shared bounded-agent execution status
    AgentStepKind:
      type: string
      enum:
        - tool_call
        - planning
        - classification
        - generation
        - validation
        - clarification
      description: Shared bounded-agent step category
    AgentStepStatus:
      type: string
      enum:
        - success
        - error
        - skipped
      description: Outcome of a shared agent step
    AgentStep:
      type: object
      description: A step in the shared bounded-agent execution trace
      required:
        - name
        - action
      properties:
        id:
          type: string
          description: Unique step ID for correlation and tracing
        kind:
          $ref: '#/components/schemas/AgentStepKind'
        name:
          type: string
          description: Stable step name used for correlation across JSON and SSE surfaces
        action:
          type: string
          description: What action was taken
        status:
          $ref: '#/components/schemas/AgentStepStatus'
        error_message:
          type: string
          description: Error details when status is "error"
        duration_ms:
          type: integer
          description: Server-side execution time in milliseconds
        details:
          type: object
          additionalProperties: true
          description: Additional details about the step
    SSEEvent:
      type: string
      description: SSE event types emitted by the retrieval agent streaming endpoint
      enum:
        - step_started
        - step_progress
        - step_completed
        - classification
        - reasoning
        - generation
        - followup
        - hit
        - tool_mode
        - eval
        - error
        - done
    SSEStepStarted:
      type: object
      description: Emitted when a pipeline step begins execution
      required:
        - id
        - name
        - action
      properties:
        id:
          type: string
          description: Unique step ID for correlating with step_completed
          example: step_cr3ig20h5tbs73e3ahrg
        kind:
          $ref: '#/components/schemas/AgentStepKind'
        name:
          type: string
          description: Stable step name used for correlation across JSON and SSE surfaces
        action:
          type: string
          description: Human-readable description of the action being taken
          example: Searching for OAuth configuration in doc_embeddings index
    SSEStepProgress:
      type: object
      description: >
        Emitted to report progress within a running step. The `name` field

        identifies which step this progress belongs to. Additional properties

        vary by step type (e.g., tree_search includes depth, num_nodes, sufficient, etc.).
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the step this progress belongs to
          example: tree_search
      additionalProperties: true
    SSEStepCompleted:
      $ref: '#/components/schemas/AgentStep'
    SSEToolMode:
      type: object
      description: Emitted when the agent selects a tool-calling mode
      required:
        - mode
      properties:
        mode:
          type: string
          description: Tool calling mode selected
          enum:
            - native
            - structured_output
        tools_count:
          type: integer
          description: Number of tools available (present for native mode)
    SSEError:
      type: object
      description: Emitted when an error occurs during retrieval
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
    PruneStats:
      type: object
      description: Statistics from token-based document pruning
      properties:
        resources_kept:
          type: integer
          description: Number of resources kept after pruning
        resources_pruned:
          type: integer
          description: Number of resources pruned to fit token budget
        tokens_kept:
          type: integer
          description: Estimated tokens in kept resources
        tokens_pruned:
          type: integer
          description: Estimated tokens in pruned resources
    RetrievalAgentUsage:
      type: object
      description: Token usage and resource statistics from the retrieval agent execution
      properties:
        input_tokens:
          type: integer
          description: Total input tokens across all LLM calls
        output_tokens:
          type: integer
          description: Total output tokens across all LLM calls
        total_tokens:
          type: integer
          description: Sum of input + output tokens
        cached_input_tokens:
          type: integer
          description: Input tokens served from cache
        llm_calls:
          type: integer
          description: Number of LLM invocations made
        resources_retrieved:
          type: integer
          description: Total resources found across all search queries
        prune_stats:
          $ref: '#/components/schemas/PruneStats'
          description: Token pruning statistics, present when max_context_tokens was configured
    RetrievalStepConfig:
      type: object
      description: >
        Configuration for the retrieval step. Retrieval tools are constrained by

        the top-level request tools policy when both are present.
      properties:
        tools:
          $ref: '#/components/schemas/ChatToolsConfig'
          description: >
            Tool configuration for the retrieval step. When set, this narrows

            the top-level tools policy for retrieval execution.
    RetrievalAgentSteps:
      type: object
      description: >
        Configuration for the retrieval agent's pipeline steps and tool-use behavior.

        Each step can have its own generator (or chain of generators) and step-specific options.

        If a step is not configured, it is skipped (retrieval always runs).
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStepConfig'
          description: >
            Configuration for query classification and transformation.

            When set, runs classification before retrieval to select the optimal

            strategy (simple/decompose/step_back/hyde) and transform the query.
        retrieval:
          $ref: '#/components/schemas/RetrievalStepConfig'
          description: >
            Configuration for retrieval tool execution. Retrieval-step tools

            narrow the top-level tools policy when both are provided.
        generation:
          $ref: '#/components/schemas/GenerationStepConfig'
          description: >
            Configuration for generation from retrieved documents.

            When set, generates a response with citations after retrieval completes.
        followup:
          $ref: '#/components/schemas/FollowupStepConfig'
          description: >
            Configuration for generating follow-up questions.

            Requires steps.generation to be set.
        confidence:
          $ref: '#/components/schemas/ConfidenceStepConfig'
          description: >
            Configuration for confidence assessment of the generated response.

            Requires steps.generation to be set.
        eval:
          $ref: '#/components/schemas/EvalConfig'
          description: >
            Configuration for inline evaluation. Runs evaluators on retrieved

            documents and/or generated response. Requires steps.generation for

            generation-quality evaluators (faithfulness, completeness, etc.).
    RetrievalAgentRequest:
      type: object
      description: >
        Request for the retrieval agent. Queries define which tables and indexes

        to search, each as a QueryRequest with optional tree search configuration.


        **Pipeline mode** (default, max_internal_iterations=0): Queries are executed

        directly without an LLM tool-calling loop.


        **Agentic mode** (max_internal_iterations > 0): The LLM decides which tools to

        call, using the queries to determine available tables and indexes.


        Authenticated row filters are enforced on every initial and generated

        operation in both modes, including scans, aggregates, and graph/tree

        traversal. They cannot be replaced or weakened by model tool arguments.
      required:
        - query
        - queries
      properties:
        query:
          type: string
          description: User's natural language query
          example: How do I configure OAuth?
        queries:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalQueryRequest'
          description: >
            Queries to execute. Each query carries its own table via the

            QueryRequest table field.


            In pipeline mode (max_internal_iterations=0), these are executed directly.

            In agentic mode, these declare which table and indexes are available.


            `filter_query` and `exclusion_query` are mandatory table predicates

            for retrieval-agent execution. Predicates declared by any query for

            a table are conjoined (or unioned for exclusions) and applied to

            every initial query, generated refinement, probe, aggregation,

            graph/tree traversal, root scan, and follow-up for that table.

            They cannot be weakened by generated operations.
          example:
            - table: docs
              semantic_search: How do I configure OAuth?
              indexes:
                - doc_embeddings
              limit: 10
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Optional conversational context for the current turn. Decisions remain the authoritative
            continuation input for bounded agent interactions.
        agent_knowledge:
          type: string
          description: >
            Domain-specific knowledge to include in the agent's system prompt.

            Useful for providing context about the document collection.
          example: This collection contains API documentation for the Acme product suite.
        accumulated_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterSpec'
          description: >
            Mandatory filters from prior interactions. These are converted to

            structured Antfly predicates and applied to every table and every

            search tool invocation, including generated follow-ups, graph/tree

            traversal, aggregations, and root scans.
        session_id:
          type: string
          description: Correlation identifier for a bounded agent interaction. This is echoed back to
            the client and does not imply server-side session persistence.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentDecision'
          description: Structured answers provided by the user as part of client-carried continuation.
        interactive:
          type: boolean
          default: true
          description: If true, the agent may return clarification questions when needed.
        max_internal_iterations:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: >
            Maximum number of internal tool-calling rounds.


            - 0: Pipeline mode — execute provided queries directly, no LLM loop

            - 1+: Agentic mode — LLM decides which tools to call
        max_user_clarifications:
          type: integer
          minimum: 0
          maximum: 10
          description: Maximum number of clarification turns the agent may request from the user.
        require_decision_after:
          type: integer
          minimum: 0
          maximum: 20
          description: Force a user-facing decision after this many unresolved internal passes.
        max_context_tokens:
          type: integer
          description: >
            Maximum tokens for document context in tool responses. Documents

            exceeding this limit are pruned to fit.
        reserve_tokens:
          type: integer
          description: >
            Tokens to reserve for system prompt, answer generation, and other overhead.

            Subtracted from max_context_tokens to determine available context budget.

            Defaults to 4000 if max_context_tokens is set.
          default: 4000
          minimum: 0
          example: 4000
        stream:
          type: boolean
          default: true
          description: Enable SSE streaming vs JSON response
        generator:
          $ref: '#/components/schemas/GeneratorConfig'
          description: Generator for the retrieval agent's LLM calls
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ChainLink'
          description: Chain of generators
        tools:
          $ref: '#/components/schemas/ChatToolsConfig'
          description: >
            Default tool policy for this agent run. Step-specific tool policies

            narrow this default for their step; retrieval currently uses

            steps.retrieval.tools.
        steps:
          $ref: '#/components/schemas/RetrievalAgentSteps'
          description: Step configuration
        document_renderer:
          type: string
          description: >
            Handlebars template for rendering documents in the generation prompt.

            Default uses TOON format for token efficiency.

            Requires steps.generation to be set.
          example: '{{encodeToon this.fields}}'
    RetrievalAgentResult:
      type: object
      description: Result from the retrieval agent
      required:
        - hits
        - status
      properties:
        id:
          type: string
          description: Unique response ID for logging and tracing
          example: ragr_cr3ig20h5tbs73e3ahrg
        model:
          type: string
          description: LLM model used for generation
          example: gemini-2.0-flash
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the response was created
        status:
          $ref: '#/components/schemas/AgentStatus'
          description: Current status of the bounded agent execution
        incomplete_details:
          $ref: '#/components/schemas/IncompleteDetails'
          description: Present when status is "incomplete" — explains why
        usage:
          $ref: '#/components/schemas/RetrievalAgentUsage'
          description: Token usage and resource statistics from this execution
        hits:
          type: array
          items:
            $ref: '#/components/schemas/QueryHit'
          description: Retrieved query hits
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AgentStep'
          description: Shared bounded-agent execution trace for this retrieval run.
        strategy_used:
          $ref: '#/components/schemas/RetrievalStrategy'
          description: Primary strategy that was used (optional in agentic mode)
        session_id:
          type: string
          description: Correlation identifier for client-carried continuation.
        iteration:
          type: integer
          description: Current internal iteration count for this bounded session.
        clarification_count:
          type: integer
          description: Number of user clarification turns already consumed in this session.
        remaining_internal_iterations:
          type: integer
          description: Remaining internal reasoning/tool-use iterations for this session.
        remaining_user_clarifications:
          type: integer
          description: Remaining clarification turns allowed for this session.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AgentQuestion'
          description: Clarification questions exposed in the shared bounded-agent envelope.
        applied_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterSpec'
          description: Filters that were applied during retrieval
        tool_calls_made:
          type: integer
          description: Total number of tool calls made during retrieval
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: >
            Optional conversational context including tool calls and responses.

            Decisions remain the authoritative continuation input for bounded agent interactions.
        classification:
          $ref: '#/components/schemas/ClassificationTransformationResult'
          description: >
            Query classification and transformation result. Present when

            steps.classification was configured. Includes strategy, semantic_query,

            sub_questions (decompose), step_back_query, and reasoning.
        generation:
          type: string
          description: >
            Generated response in markdown format. Present when steps.generation

            was configured.
        generation_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Confidence in the generated response (requires steps.confidence)
        context_relevance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance of retrieved documents to the query (requires steps.confidence)
        followup_questions:
          type: array
          items:
            type: string
          description: Suggested follow-up questions (requires steps.followup)
        eval_result:
          $ref: '#/components/schemas/EvalResult'
          description: Evaluation results when steps.eval was configured
    AnswerAgentSteps:
      type: object
      deprecated: true
      description: >
        DEPRECATED: Use RetrievalAgentSteps instead.

        Configuration for the answer agent's pipeline steps.
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStepConfig'
          description: Configuration for query classification and transformation.
        answer:
          $ref: '#/components/schemas/GenerationStepConfig'
          description: >
            DEPRECATED: Use steps.generation on RetrievalAgentRequest instead.

            Configuration for answer generation from retrieved documents.
        followup:
          $ref: '#/components/schemas/FollowupStepConfig'
          description: Configuration for generating follow-up questions.
        confidence:
          $ref: '#/components/schemas/ConfidenceStepConfig'
          description: Configuration for confidence assessment.
    AnswerAgentRequest:
      type: object
      deprecated: true
      description: >
        DEPRECATED: Use RetrievalAgentRequest instead.

        Request for the answer agent. Accepts the old request format and

        internally delegates to the retrieval agent.
      required:
        - query
        - queries
      properties:
        query:
          type: string
          description: User's natural language query
        queries:
          type: array
          items:
            $ref: '#/components/schemas/QueryRequest'
          description: Queries to execute. Each query specifies its own table.
        with_streaming:
          type: boolean
          default: true
          description: >
            DEPRECATED: Use stream on RetrievalAgentRequest instead.

            Enable SSE streaming vs JSON response.
        generator:
          $ref: '#/components/schemas/GeneratorConfig'
          description: Generator for LLM calls
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ChainLink'
          description: Chain of generators
        agent_knowledge:
          type: string
          description: Domain-specific knowledge for the agent
        max_context_tokens:
          type: integer
          description: Maximum tokens for document context
        reserve_tokens:
          type: integer
          description: Tokens to reserve for overhead
          default: 4000
        steps:
          $ref: '#/components/schemas/AnswerAgentSteps'
          description: Step configuration
        eval:
          $ref: '#/components/schemas/EvalConfig'
          description: >
            DEPRECATED: Use steps.eval on RetrievalAgentRequest instead.

            Evaluation configuration (moved to steps.eval in new API).
        without_generation:
          type: boolean
          default: false
          description: >
            DEPRECATED: Omit steps.generation on RetrievalAgentRequest instead.

            If true, skip the generation step.
    AnswerAgentResult:
      type: object
      deprecated: true
      description: >
        DEPRECATED: Use RetrievalAgentResult instead.

        Result from the answer agent.
      properties:
        answer:
          type: string
          description: >
            DEPRECATED: Use generation on RetrievalAgentResult instead.

            Generated answer in markdown format.
        answer_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: >
            DEPRECATED: Use generation_confidence on RetrievalAgentResult instead.

            Confidence in the generated answer.
        context_relevance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance of retrieved documents to the query
        classification_transformation:
          $ref: '#/components/schemas/ClassificationTransformationResult'
          description: >
            DEPRECATED: Use classification on RetrievalAgentResult instead.

            Query classification and transformation result.
        query_results:
          type: array
          items:
            $ref: '#/components/schemas/QueryResult'
          description: >
            DEPRECATED: Use hits on RetrievalAgentResult instead.

            Query results grouped by table.
        followup_questions:
          type: array
          items:
            type: string
          description: Suggested follow-up questions
        eval_result:
          $ref: '#/components/schemas/EvalResult'
          description: Evaluation results
    Embedding:
      oneOf:
        - type: array
          items:
            type: number
            format: float
          description: Dense embedding as an array of floats, e.g. `[0.1, 0.2, 0.3]`
        - type: object
          required:
            - indices
            - values
          properties:
            indices:
              type: array
              items:
                type: integer
                x-go-type: uint32
            values:
              type: array
              items:
                type: number
                format: float
          description: Sparse embedding with `indices` and `values` arrays
        - type: string
          format: byte
          description: >
            Packed dense embedding as a base64-encoded string of raw little-endian float32 bytes.

            This is ~4x more compact than the JSON array format. For example, a 3-dimensional

            vector `[1.0, 2.0, 3.0]` is encoded as base64(12 bytes of little-endian float32s).
        - type: object
          required:
            - packed_indices
            - packed_values
          properties:
            packed_indices:
              type: string
              format: byte
              description: Base64-encoded little-endian uint32 bytes for sparse indices
            packed_values:
              type: string
              format: byte
              description: Base64-encoded little-endian float32 bytes for sparse values
          description: >
            Packed sparse embedding with base64-encoded indices and values.

            Same semantics as the sparse object format but more compact on the wire.
    RawQuery:
      oneOf:
        - $ref: '#/components/schemas/Query'
      x-go-type: json.RawMessage
      x-zig-type: raw_json
      description: An Antfly query expression retained as syntactically validated JSON and compiled by
        the query engine.
    HierarchyProjection:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            type: string
          description: >
            Fields to include from the hydrated hierarchy document. This projection is

            required whenever the ancestor is requested so hierarchy hydration cannot

            accidentally return an unbounded document. Use an empty array to return

            hierarchy identity without stored document fields.
    HierarchyMatches:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 100
          default: 3
          description: >
            Maximum matching descendant hits attached to each group, independent of

            the top-level query limit. Matches follow the effective query order, and

            the group score is the score of its best matching descendant. The maximum

            bounds nested response growth. Group selection uses an adaptive candidate

            window, then each returned group is expanded with a separately bounded query,

            so a group with fewer matches never forces a global exhaustive scan. To bound

            execution as well as response growth, grouped queries accept at most 100

            top-level groups and 1,000 requested matches across the complete result page.
        fields:
          type: array
          items:
            type: string
          description: >
            Fields to include in each nested match. This projection is required because

