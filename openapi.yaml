        '503':
          $ref: '#/components/responses/TransientCapacity'
          description: Inference service unavailable. The unified Antfly server also returns this status
            when authentication is enabled but its backend is not ready.
        '401':
          description: Authentication is enabled and valid credentials were not supplied
