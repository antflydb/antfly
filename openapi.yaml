          description: Generated output to evaluate (optional for retrieval-only)
        context:
          type: array
          items:
            type: object
          description: Retrieved documents/context
        retrieved_ids:
          type: array
          items:
            type: string
          description: IDs of retrieved documents (for retrieval metrics)
    InferenceError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable error description
        reason:
          type: string
          description: Machine-readable capacity source when the failure is retryable
          enum:
            - inference_capacity
            - inference_admission
        retryable:
          type: boolean
          x-go-type-skip-optional-pointer: false
          description: Whether retrying the request may succeed
        retry_after_ms:
          type: integer
          minimum: 0
          description: Minimum retry delay in milliseconds
    InferenceTransientCapacityError:
      type: object
      description: Actionable retry contract for temporary inference-capacity failures.
      required:
        - error
        - message
        - reason
        - retryable
        - retry_after_ms
      properties:
        error:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable error description
        reason:
          type: string
          description: Machine-readable capacity source
          enum:
            - inference_capacity
            - inference_admission
        retryable:
          type: boolean
          enum:
            - true
          description: Always true for a transient-capacity response
        retry_after_ms:
          type: integer
          minimum: 1
          description: Minimum retry delay in milliseconds
    InferencePredictRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Predictor name from the model catalog.
        input:
          type: array
          maxItems: 10000
          description: Batch of feature vectors. Max 10000 rows.
          items:
            type: array
            items:
              type: number
              format: float
    InferencePredictResponse:
      type: object
      required:
        - model
        - task
        - predictions
      properties:
        model:
          type: string
        task:
          $ref: '#/components/schemas/InferencePredictorTask'
        predictions:
          type: array
          description: >
            Per-row prediction arrays. Length equals the model's `num_outputs`

            (1 for regression / binary, `num_classes` for multiclass).
          items:
            type: array
            items:
              type: number
              format: float
    InferencePredictorTask:
      type: string
      description: Task type for tabular predictors.
      enum:
        - regression
        - binary_classification
        - multiclass
        - ranking
    InferencePredictorInfo:
      type: object
      description: Traditional ML predictor metadata.
      required:
        - task
        - num_features
        - num_outputs
      properties:
        task:
          $ref: '#/components/schemas/InferencePredictorTask'
        num_features:
          type: integer
          minimum: 1
          description: Number of feature columns expected by the predictor.
        num_outputs:
          type: integer
          minimum: 1
          description: Number of output values emitted per input row.
        feature_names:
          type: array
          description: Optional feature names in input order.
          items:
            type: string
        source_framework:
          type: string
          description: Source framework used to produce the predictor IR.
    InferencePredictorsResponse:
      type: object
      required:
        - object
        - predictors
      properties:
        object:
          type: string
          enum:
            - list
          description: Response object type.
        predictors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferencePredictorInfo'
          description: Traditional ML predictors keyed by predictor name.
    InferenceTextContentPart:
      $ref: '#/components/schemas/TextContentPart'
    InferenceImageURL:
      $ref: '#/components/schemas/ImageURL'
    InferenceImageURLContentPart:
      $ref: '#/components/schemas/ImageURLContentPart'
    InferenceMediaContentPart:
      $ref: '#/components/schemas/MediaContentPart'
    InferenceContentPart:
      $ref: '#/components/schemas/ContentPart'
    InferenceEmbedRequest:
      type: object
      description: OpenAI-compatible embedding request with inference multimodal content-part extension
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: Model name to use for embedding generation
        input:
          description: >
            Input content to embed.

            Supports:

            - a single string

            - an array of strings

            - an array of OpenAI-style content parts for multimodal embedding
          oneOf:
            - type: string
              description: Single text string
            - type: array
              description: Array of text strings
              items:
                type: string
            - type: array
              description: Array of multimodal content parts
              items:
                $ref: '#/components/schemas/ContentPart'
        encoding_format:
          type: string
          description: Encoding format for the embeddings (only "float" supported)
          default: float
          enum:
            - float
        dimensions:
          type: integer
          description: Optional truncation size for dense embeddings. Must be a positive integer no larger
            than the model embedding size. Not supported for sparse models.
        task_type:
          type: string
          description: Optional embedding task type using Google embedding task-type names. For Jina v5
            text embeddings, query-side tasks use the query prefix and RETRIEVAL_DOCUMENT uses the document
            prefix.
          enum:
            - RETRIEVAL_QUERY
            - RETRIEVAL_DOCUMENT
            - QUESTION_ANSWERING
            - FACT_VERIFICATION
            - CODE_RETRIEVAL_QUERY
            - CLASSIFICATION
            - CLUSTERING
            - SEMANTIC_SIMILARITY
        input_type:
          type: string
          deprecated: true
          description: Deprecated compatibility alias for task_type. search_query/query map to RETRIEVAL_QUERY;
            search_document/document map to RETRIEVAL_DOCUMENT; classification and clustering map to their
            Google task_type equivalents.
          enum:
            - search_query
            - search_document
            - query
            - document
            - classification
            - clustering
        error_policy:
          type: string
          description: >
            Controls how dense embedding requests report per-input failures.

            `fail_fast` preserves OpenAI-compatible all-or-error behavior.

            `per_item` returns successful embeddings in `data` and indexed

            permanent/transient failures in `errors` without failing the

            entire HTTP request.
          default: fail_fast
          enum:
            - fail_fast
            - per_item
    InferenceEmbedResponse:
      type: object
      description: OpenAI-compatible embedding response with a polymorphic `embedding` field for dense
        or sparse vectors
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          description: Object type, always "list"
          enum:
            - list
        data:
          type: array
          description: List of embedding objects
          items:
            $ref: '#/components/schemas/InferenceEmbeddingObject'
        model:
          type: string
          description: Model used for embedding generation
        usage:
          $ref: '#/components/schemas/InferenceEmbeddingUsage'
        errors:
          type: array
          description: Indexed per-input failures. Only populated when request error_policy is per_item.
          items:
            $ref: '#/components/schemas/InferenceEmbeddingItemError'
        summary:
          $ref: '#/components/schemas/InferenceEmbeddingBatchSummary'
    InferenceEmbeddingItemError:
      type: object
      description: Per-input embedding failure for error_policy=per_item responses
      required:
        - index
        - code
        - message
        - stage
        - retryable
        - status
      properties:
        index:
          type: integer
          description: Original input index that failed
        code:
          type: string
          description: Stable machine-readable failure code
        message:
          type: string
          description: Human-readable failure message
        stage:
          type: string
          description: Pipeline stage that classified the failure
          enum:
            - parse
            - fetch
            - image_decode
            - audio_decode
            - text_inference
            - image_inference
            - audio_inference
            - model_admission
            - inference
        retryable:
          type: boolean
          description: Whether retrying the same item may succeed
        status:
          type: integer
          description: HTTP-style status classification for this item
        retry_after_ms:
          type: integer
          minimum: 0
          nullable: true
          description: Minimum retry delay in milliseconds for a retryable transient failure
    InferenceEmbeddingBatchSummary:
      type: object
      description: Counts for per-item embedding responses
      required:
        - total
        - succeeded
        - failed
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
    InferenceSparseVector:
      type: object
      description: A sparse vector with parallel index/value arrays, sorted by index ascending
      required:
        - indices
        - values
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
          description: Token IDs from the model vocabulary (sorted ascending)
        values:
          type: array
          items:
            type: number
            format: float
          description: Corresponding weights for each index (always positive)
    InferenceChunk:
      description: A chunk of content. Text chunks have mime_type text/plain.
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/InferenceTextContent'
            - $ref: '#/components/schemas/InferenceBinaryContent'
        - type: object
          required:
            - id
            - mime_type
          properties:
            id:
              type: integer
              x-go-type: uint32
              description: Sequence number of the chunk (0, 1, 2, ...)
            mime_type:
              type: string
              description: 'MIME type: text/plain, audio/wav, image/png, etc.'
    InferenceChunkRequest:
      type: object
      required:
        - input
      properties:
        input:
          description: >
            Input content to chunk. Supports two formats:

            - Text string: `"This is a long document..."`

            - ContentPart: `{"type": "media", "data": "<base64>", "mime_type": "audio/wav"}`

            - ContentPart: `{"type": "text", "text": "..."}`
          oneOf:
            - type: string
              description: Text to chunk
            - $ref: '#/components/schemas/InferenceChunkContentPart'
              description: Content part (text or media)
        config:
          $ref: '#/components/schemas/InferenceChunkConfig'
    InferenceChunkResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
        - cache_hit
      example:
        object: list
        data:
          - object: chunk
            index: 0
            id: 0
            text: This is the first chunk...
            start_char: 0
            end_char: 100
            mime_type: text/plain
          - object: chunk
            index: 1
            id: 1
            text: This is the second chunk...
            start_char: 90
            end_char: 190
            mime_type: text/plain
        model: fixed
        usage:
          prompt_tokens: 12
          completion_tokens: 0
          total_tokens: 12
        cache_hit: false
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/InferenceChunkObject'
          description: Array of chunk objects
        model:
          type: string
          description: Chunking model actually used (may differ from requested if fallback occurred)
          example: fixed
        usage:
          $ref: '#/components/schemas/InferenceGenerateUsage'
        cache_hit:
          type: boolean
          description: Whether result was served from cache
    InferenceChunkObject:
      description: A chunk result object. Text chunks have mime_type text/plain.
      allOf:
        - $ref: '#/components/schemas/InferenceChunk'
        - type: object
          required:
            - object
            - index
          properties:
            object:
              type: string
              enum:
                - chunk
            index:
              type: integer
              description: Position of this chunk object in the response data array.
    InferenceRerankRequest:
      type: object
      required:
        - model
        - query
        - prompts
      properties:
        model:
          type: string
          description: Name of reranking model from models_dir/rerankers/
          example: BAAI/bge-reranker-v2-m3
        query:
          type: string
          description: Search query for relevance scoring
          example: machine learning applications
        prompts:
          type: array
          items:
            type: string
          description: >
            Pre-rendered document texts to rerank. The client is responsible for extracting

            and rendering document fields/templates before calling this endpoint.
          example:
            - Introduction to machine learning...
            - Deep learning fundamentals...
    InferenceRerankMultimodalDocument:
      type: object
      required:
        - content
      properties:
        id:
          type: string
          description: Optional caller-provided document identifier
        content:
          $ref: '#/components/schemas/ChatMessageContent'
    InferenceRerankMultimodalRequest:
      type: object
      required:
        - model
        - query
        - documents
      properties:
        model:
          type: string
          description: Name of multimodal reranking model from models_dir/rerankers/
          example: vidore/colqwen2-v1.0
        query:
          type: string
          description: Text query for relevance scoring
          example: invoice total due date
        documents:
          type: array
          items:
            $ref: '#/components/schemas/InferenceRerankMultimodalDocument'
          description: Documents expressed as text and image content parts
    InferenceRerankResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/InferenceRerankObject'
          description: Rerank score objects, one per input prompt.
        model:
          type: string
          description: Name of model used for reranking
        usage:
          $ref: '#/components/schemas/InferenceGenerateUsage'
    InferenceRerankObject:
      type: object
      required:
        - object
        - index
        - score
      properties:
        object:
          type: string
          enum:
            - rerank.score
        index:
          type: integer
          description: Original prompt index.
        score:
          type: number
          format: float
          description: Relevance score for this prompt.
    InferenceRewriteRequest:
      type: object
      required:
        - model
        - inputs
      properties:
        model:
          type: string
          description: Name of Seq2Seq rewriter model from models_dir/rewriters/
          example: lmqg/flan-t5-small-squad-qg
        inputs:
          type: array
          items:
            type: string
          description: Input texts to rewrite/transform
          example:
            - 'Translate to German: Hello, how are you?'
    InferenceRewriteResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/InferenceRewriteObject'
          description: Rewritten text objects, one per input.
        model:
          type: string
          description: Name of model used for rewriting
        usage:
          $ref: '#/components/schemas/InferenceGenerateUsage'
    InferenceRewriteObject:
      type: object
      required:
        - object
        - index
        - texts
      properties:
        object:
          type: string
          enum:
            - rewrite
        index:
          type: integer
          description: Original input text index.
        texts:
          type: array
          items:
            type: string
          description: Rewritten texts for this input, one per beam.
    InferenceReadRequest:
      type: object
      required:
        - model
        - images
      properties:
        model:
          type: string
          description: Name of reader model from models_dir/readers/
          example: microsoft/trocr-base-printed
        images:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InferenceImageURL'
          description: >
            Images to read text from. Supports:

            - Data URIs: `data:image/png;base64,...`

            - URLs (if content_security allows)
          example:
            - url: data:image/png;base64,iVBORw0KGgo...
        prompt:
          type: string
          description: >
            Optional task prompt for document understanding models.

            - TrOCR: Not used (pure OCR)

            - Donut CORD: "<s_cord-v2>" for receipt parsing

            - Donut DocVQA: "<s_docvqa><s_question>What is the total?</s_question><s_answer>"

            - Florence-2: "<OCR>" for OCR, "<CAPTION>" for captioning

            - Pix2Struct: "What type of document is this?"

            - Moondream: "Describe this image."
          example: What type of document is this?
        max_tokens:
          type: integer
          description: Maximum tokens to generate
          minimum: 1
          maximum: 1024
          default: 256
          example: 256
    InferenceTextRegion:
      type: object
      required:
        - text
        - bbox
      properties:
        text:
          type: string
          description: Recognized text within the region
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: Bounding box [x1, y1, x2, y2] in pixel coordinates
        confidence:
          type: number
          description: Recognition confidence score (0-1)
        label:
          type: string
          description: Semantic label from layout analysis (e.g., text, title, table)
    InferenceReadResult:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Extracted text from the image
          example: 'Invoice Total: $123.45'
        fields:
          type: object
          additionalProperties:
            type: string
          description: >
            Structured fields extracted by document understanding models (Donut, Florence-2).

            Fields are flattened with dot notation for nested structures.

            Only present for models that output structured data.
          example:
            menu.nm: Coffee
            menu.price: $3.50
            total: $123.45
        regions:
          type: array
          items:
            $ref: '#/components/schemas/InferenceTextRegion'
          description: >
            Individual text regions with bounding boxes and recognized text.

            Populated by multi-stage OCR models (Surya, PaddleOCR).
    InferenceReadResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/InferenceReadObject'
          description: Read result objects, one per input image.
        model:
          type: string
          description: Name of model used for reading
        usage:
          $ref: '#/components/schemas/InferenceGenerateUsage'
    InferenceReadObject:
      allOf:
        - $ref: '#/components/schemas/InferenceReadResult'
        - type: object
          required:
            - object
            - index
          properties:
            object:
              type: string
              enum:
                - read
            index:
              type: integer
              description: Original input image index.
    InferenceTranscribeRequest:
      type: object
      required:
        - audio
      properties:
        model:
          type: string
          description: Name of transcriber model from models_dir/transcribers/
          example: openai/whisper-tiny
        audio:
          type: string
          format: byte
          description: Base64-encoded audio data (WAV, MP3, FLAC, etc.)
        language:
          type: string
          description: Force specific language for transcription (optional, model-dependent)
          example: en
    InferenceTranscribeResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/InferenceTranscribeObject'
          description: Transcription result objects.
        model:
          type: string
          description: Name of model used for transcription
        usage:
          $ref: '#/components/schemas/InferenceGenerateUsage'
    InferenceTranscribeObject:
      type: object
      required:
        - object
        - index
        - text
      properties:
        object:
          type: string
          enum:
            - transcription
        index:
          type: integer
          description: Input audio index.
        text:
          type: string
          description: Transcribed text from the audio
          example: Hello, how are you today?
        language:
          type: string
          description: Detected or forced language
          example: en
    InferenceModelInfo:
      type: object
      description: Information about a model including its capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string
          description: List of capabilities this model supports (omitted when empty). For rerankers, `late_interaction`
            or `colbert` selects native MaxSim token scoring.
        inputs:
          type: array
          items:
            type: string
          description: List of input modalities this model accepts, such as `text`, `image`, or `audio`
    InferenceModelsResponse:
      type: object
      required:
        - object
        - data
        - allow_downloads
        - backends
        - chunkers
        - rerankers
        - embedders
        - generators
        - extractors
        - rewriters
        - classifiers
        - readers
        - transcribers
      properties:
        object:
          type: string
          enum:
            - list
          description: OpenAI-compatible response object type.
        data:
          type: array
          description: OpenAI-compatible flat model list for generation/embedding models.
          items:
            type: object
            additionalProperties: true
        allow_downloads:
          type: boolean
          description: Whether clients should show model download commands.
          default: true
        backends:
          $ref: '#/components/schemas/InferenceBackendRuntimes'
        chunkers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available chunking models (always includes "fixed")
        rerankers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available reranking models
        classifiers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available zero-shot classification models
        embedders:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available embedding models from models_dir/embedders/
        extractors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available extractor models (models with 'extraction' capability)
        generators:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available generator/LLM models from models_dir/generators/
        rewriters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available Seq2Seq rewriter models from models_dir/rewriters/
        readers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available reader/OCR models from models_dir/readers/
        transcribers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceModelInfo'
          description: Available transcriber/speech-to-text models from models_dir/transcribers/
    InferenceTool:
      type: object
      description: A tool (function) that the model can call
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
          description: The type of tool (currently only "function" is supported)
        function:
          $ref: '#/components/schemas/InferenceFunctionDefinition'
    InferenceFunctionDefinition:
      type: object
      description: Definition of a function that can be called by the model
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the function to call
          example: get_weather
        description:
          type: string
          description: A description of what the function does
          example: Get the current weather in a location
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema object describing the function parameters
          example:
            type: object
            properties:
              location:
                type: string
                description: The city and state, e.g. San Francisco, CA
            required:
              - location
        strict:
          type: boolean
          description: Whether to enforce strict parameter validation
          default: false
    InferenceToolChoice:
      description: >
        Controls how the model uses tools. Options:

        - "auto": Model decides whether to call a tool (default)

        - "none": Model will not call any tools

        - "required": Model must call at least one tool

        - object: Force a specific function to be called
      oneOf:
        - type: string
          enum:
            - auto
            - none
            - required
        - type: object
          description: Force a specific function to be called
          required:
            - type
            - function
          properties:
            type:
              type: string
              enum:
                - function
            function:
              $ref: '#/components/schemas/InferenceToolChoiceFunction'
    InferenceToolChoiceFunction:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the function to call
    InferenceRole:
      $ref: '#/components/schemas/ChatMessageRole'
    InferenceFinishReason:
      type: string
      enum:
        - stop
        - length
        - tool_calls
        - content_filter
        - function_call
      description: Reason why generation stopped
    InferenceChatMessage:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/InferenceRole'
        content:
          $ref: '#/components/schemas/ChatMessageContent'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: Tool calls made by the assistant (only for role=assistant)
        tool_call_id:
          type: string
          description: ID of the tool call this message is responding to (only for role=tool)
    InferenceGenerateStreamOptions:
      type: object
