  /db/v1/tables/{tableName}/documents/{key}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: Key of the document to retrieve
        schema:
          type: string
    get:
      summary: Retrieve a document by key
      tags:
        - data_operations
      operationId: lookupKey
      parameters:
        - name: fields
          in: query
          required: false
          description: >
            Comma-separated list of fields to include in the response.

            If not specified, returns the full document. Supports:

            - Simple fields: "title,author"

            - Nested paths: "user.address.city"

            - Wildcards: "_chunks.*"

            - Exclusions: "-_chunks.*._embedding"

            - Special fields: "_embeddings,_summaries,_chunks"
          schema:
            type: string
          example: title,author,metadata.tags
        - name: consistency
          in: query
          required: false
          description: >
            Read consistency for the lookup. The default `read_index` routes to

            the primary for linearizable reads. `stale` allows a hot standby to

            serve the lookup at its safe-read LSN.
          schema:
            type: string
            enum:
              - read_index
              - leader_lease
              - stale
            default: read_index
      responses:
        '200':
          description: Record found
          headers:
            X-Antfly-Version:
              description: >
                Version token for this document. Use this value in OCC transaction

                read sets to detect concurrent modifications.

                "0" indicates the key does not exist.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/tables/{tableName}/documents/{key}/artifacts:
