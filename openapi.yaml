        min_speech_duration_ms:
          type: integer
          description: 'Minimum speech duration (ms) for a segment to be kept. Shorter segments are discarded.
            Default: 250.'
        speech_pad_ms:
          type: integer
          description: 'Padding (ms) added before and after detected speech. Default: 30.'
        max_segment_duration_ms:
          type: integer
          description: 'Maximum segment duration (ms). Segments longer than this are split. Useful for
            Whisper-compatible chunking. Default: 30000.'
    InferenceAudioChunkConfig:
      type: object
      description: Audio chunking configuration for inference, including VAD options.
      properties:
        window_duration_ms:
          type: integer
          description: 'Window duration in milliseconds for fixed-window audio chunking (default: 30000).'
        overlap_duration_ms:
          type: integer
          description: 'Overlap duration in milliseconds between audio chunks (default: 0).'
        vad:
          $ref: '#/components/schemas/VADOptions'
    InferenceChunkConfig:
      type: object
      description: >
        Configuration for chunking requests to Antfly inference.

        Combines shared text options with inference-specific audio/VAD options.
      properties:
        model:
          type: string
          description: The chunking model to use. Either 'fixed' for simple token-based chunking, or a
            model name from models/chunkers/{name}/.
          default: fixed
          example: fixed
        max_chunks:
          type: integer
          description: Maximum number of chunks to generate per document.
        threshold:
          type: number
          format: float
          description: Confidence threshold for model-based chunking (0.0-1.0). Used by ONNX text models
            and VAD audio models.
        text:
          $ref: '#/components/schemas/TextChunkOptions'
        audio:
          $ref: '#/components/schemas/InferenceAudioChunkConfig'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IndexMutationBadRequest:
      description: Invalid index configuration or a deployment capability mismatch
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/UnsupportedIndexCapabilityError'
              - $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method not allowed for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IndexMutationServiceUnavailable:
      description: Index validation is temporarily unavailable or a distributed rolling upgrade has not
        yet converged.
      headers:
        Retry-After:
          required: false
          description: Minimum number of seconds clients should wait when the failure is retryable.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IndexMutationServiceUnavailableError'
              - $ref: '#/components/schemas/Error'
    BackupMetadataUnavailable:
      description: Backup could not establish the required metadata authority before starting side effects.
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds clients should wait before retrying.
          schema:
            type: integer
            minimum: 1
        X-Antfly-Metadata-Not-Leader:
          required: false
          description: Present with value `true` only when retrying against the current metadata leader
            may succeed.
          schema:
            type: string
            enum:
              - 'true'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackupMetadataUnavailableError'
    TableBackupConflict:
      description: Backup ID collision, catalog-incarnation change, or an outcome requiring reconciliation
        before retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TableBackupConflictError'
    StorageResourceExhausted:
      description: Storage descriptors are temporarily exhausted
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageResourceExhaustedError'
    InferenceTransientCapacity:
      description: Inference capacity is temporarily unavailable
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds clients should wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceCapacityError'
    StatelessTransactionFailure:
      description: >
        Internal transaction failure. If the response says that the outcome is

        unknown, the request may already have committed and the stateless

        request MUST NOT be retried. Use a transaction session when a commit

        must be safely retryable by transaction ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
    DenseRepairBackpressure:
      description: Writes are temporarily limited while a dense-index rebuild catches up.
      headers:
        Retry-After:
          description: Suggested delay in seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DenseRepairBackpressureError'
    UnsupportedMediaType:
      description: Unsupported request media or content encoding
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QueryUnprocessable:
      description: The query is valid but cannot be executed exactly under the declared contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryUnprocessableError'
    HierarchyCursorStale:
      description: Deprecated response component retained for generated-client source compatibility; query
        endpoints now use QueryConflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HierarchyCursorStaleError'
    QueryConflict:
      description: The query's pinned hierarchy or table topology changed while it was running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryConflictError'
    QueryTemporarilyUnavailable:
      description: A query dependency or read path is temporarily unavailable and the request is safe
        to retry
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds clients should wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueryTemporarilyUnavailableError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QueryInternalServerError:
      description: Query failure. Storage integrity failures use a stable non-retryable error payload.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/TableStorageUnreadableError'
    TransientCapacity:
      description: Inference capacity is temporarily unavailable
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds clients should wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InferenceTransientCapacityError'
x-tagGroups:
  - name: Antfly
    tags:
      - cluster_management
      - table_management
      - data_operations
      - query_operations
      - index_management
  - name: Auth
    tags:
      - User
      - Permission
      - ApiKey
      - RowFilter
  - name: Inference
    tags: []
  - name: Extensions
    tags:
      - Packages
      - Installed
