            and the connection is pinned to a vetted address. Setting it to false explicitly opts into
            private and special destinations. Across generate, dense embed, and multimodal rerank, downloaded
            and inline encoded media is capped cumulatively per request at the lower of 100 MiB, max_download_size_bytes,
            and—when admission.inference.max_concurrent_requests is positive—16 MiB times that capacity;
            zero max_download_size_bytes disables nonempty media. Remote URL byte potential is reserved
            before fetch, while inline sources use their actual encoded size. Accepted image inputs also
            undergo header-only dimension and aggregate decoded-pixel admission before model execution.
            Batch generation rejects multimodal content before fetch. Embedded direct transcription and
            extraction use the configured encoded-media per-call ceiling, and direct dense embedding also
            applies pre-allocation and decoded-image admission. In unified Antfly configuration, an empty
            inference policy may first inherit a nonempty remote_content security policy, which is then
            merged over this baseline.
        s3_credentials:
