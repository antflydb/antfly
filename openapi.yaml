            still be evicted under resource pressure or to enforce max_loaded_models.
          default: 5m
          example: 5m
        max_loaded_models:
          type: integer
          description: >
            Maximum total models loaded across all registry types (embedders, rerankers,

            generators, chunkers, etc.). When the limit is reached, the least-recently-used

            idle model from any registry is evicted to make room. Set to 0 for unlimited.

            Defaults to 10.
          default: 10
          example: 3
        pool_size:
          type: integer
          description: >
            Legacy compatibility field. The current Zig inference runtime does not

            create per-model pipeline pools from this setting; configuring it has no effect.
          deprecated: true
        prompt_cache:
          $ref: '#/components/schemas/InferencePromptCacheConfig'
          description: Native generator prompt KV cache settings.
        backend_priority:
          type: array
          items:
            $ref: '#/components/schemas/InferenceBackendPriorityEntry'
          description: >
            Legacy compatibility field. The current Zig inference runtime selects a

            backend from model metadata, explicit preload settings, and compiled capabilities;

            configuring this list has no effect.
          deprecated: true
        max_queue_size:
          type: integer
          description: >
            Legacy Go-runtime queue setting. The current Zig runtime does not retain

            excess inference requests in memory and ignores this field.
          deprecated: true
        request_timeout:
          type: string
          description: >
            Legacy Go-runtime queue/request timeout. The current Zig runtime ignores

            this field; its HTTP listener applies a separate fixed transport timeout.
          deprecated: true
        preload:
          type: array
          description: >
            Models to preload and warm at startup. Generators run a tiny generation

            request so native/Metal weights, KV setup, and kernels use the same

            budgeted path as request-time generation. Other model kinds use the

            best available warm path for that kind.
          items:
            $ref: '#/components/schemas/InferenceModelRef'
          example:
            - kind: generator
              name: antflydb/gemma-e2b
              backend: metal
              format: gguf
              quantization: q4_k
        max_memory_mb:
          type: integer
          description: >
            Legacy compatibility field. The current Zig runtime uses explicit host,

            backend, combined, KV, and scratch budgets instead and ignores this field.
          deprecated: true
        model_strategies:
          type: object
          additionalProperties:
            type: string
            enum:
              - eager
              - lazy
              - bounded
          description: >
            Per-model loading strategy overrides. Maps model names to their loading strategy.

            Models not in this map load on demand. keep_alive controls their idle

            eviction; setting it to "0" disables idle eviction but does not preload or pin them.


            When a model has strategy "eager" in this map:

            - It is loaded at startup through the same startup warmup path

            - It is never unloaded, even when keep_alive>0 (pinned in memory)


            This allows mixing eager and lazy models in the same pool.
          example:
            BAAI/bge-small-en-v1.5: eager
            mirth/chonky-mmbert-small-multilingual-1: lazy
        allow_downloads:
          type: boolean
          description: >
            Legacy compatibility field controlling whether dashboards show model

            download commands. It defaults to true for standalone deployments;

            managed deployments historically set it to false. Download-command

            availability is a build-time setting in the current Zig runtime, so

            configuring this field has no effect.
          default: true
          deprecated: true
        log:
          $ref: '#/components/schemas/Inferenceschemas-Config'
    InferenceBackendRuntimes:
      type: object
      description: Runtime backends compiled into this inference server.
      properties:
        native:
          type: boolean
          description: Whether the native CPU backend is built into this runtime
          example: true
        onnx:
          type: boolean
          description: Whether the ONNX Runtime backend is built into this runtime
          example: false
        metal:
          type: boolean
          description: Whether the Metal backend is built into this runtime
          example: true
        cuda:
          type: boolean
          description: Whether the CUDA backend is built into this runtime
          example: false
        xla:
          type: boolean
          description: Whether the PJRT/XLA backend is built into this runtime
          example: false
        wasm:
          type: boolean
          description: Whether the WASM backend is built into this runtime
          example: false
    InferenceTextContent:
      type: object
      description: Text content with character offsets.
      required:
        - text
        - start_char
        - end_char
      properties:
        text:
          type: string
          description: The chunk text content
        start_char:
          type: integer
          description: Character position in original text where chunk starts
        end_char:
          type: integer
          description: Character position in original text where chunk ends (exclusive)
    InferenceBinaryContent:
      type: object
      description: Binary media content with format-specific metadata.
      properties:
        data:
          type: string
          format: byte
          description: Base64-encoded binary data (valid WAV, PNG, etc.)
        start_time_ms:
          type: number
          format: float
          description: 'Audio: window start time in milliseconds'
        end_time_ms:
          type: number
          format: float
          description: 'Audio: window end time in milliseconds'
        frame_index:
          type: integer
          description: 'Animation: frame number'
        frame_delay_ms:
          type: integer
          description: 'Animation: display delay in milliseconds'
    InferenceContentSecurityConfig:
      type: object
      description: Inference merges configured fields over a fail-closed baseline. HTTP(S), file, and
        S3 content require explicit allowlists; data URIs remain allowed within the configured size budget.
      properties:
        allowed_hosts:
          type: array
          description: Explicit HTTP(S) host allowlist for inference downloads. Omission and an explicit
            empty list both deny all hosts. With block_private_ips enabled, IP literals and every address
            resolved from an allowlisted DNS hostname must be globally routable; the connection is pinned
            to a vetted address.
          items:
            type: string
          example:
            - 93.184.216.34
        block_private_ips:
          type: boolean
          description: Reject loopback, private, link-local, carrier-grade NAT, reserved, and multicast
            destinations. Allowlisted DNS hostnames are resolved, every result is filtered by this policy,
            and the connection is pinned to a vetted address. Set false only as an explicit opt-out that
            permits private and special destinations.
          default: true
        max_download_size_bytes:
          type: integer
          description: Maximum size of downloaded content in bytes
          default: 104857600
          minimum: 0
          example: 104857600
          x-go-type: int64
        download_timeout_seconds:
          type: integer
          description: Maximum HTTP download duration in seconds. Defaults to 30; 0 disables the deadline.
          default: 30
          minimum: 0
        max_image_dimension:
          type: integer
          description: Maximum source-image width or height for accepted inference image inputs, including
            generate/chat, dense embed, multimodal rerank, `/read`, image `/extract`, and their embedded
            direct APIs. Headers exceeding this limit are rejected before model execution; images are
            not resized. Batch generation rejects multimodal content before fetch. Non-inference scraping
            consumers do not enforce this setting.
          minimum: 1
        allowed_paths:
          type: array
          description: Explicit path-prefix allowlist for inference file:// and s3:// URLs. Omission and
            an explicit empty list both deny all file and S3 paths. For file:// use absolute paths (e.g.,
            /Users/data/). For s3:// use bucket/prefix (e.g., my-bucket/uploads/).
          items:
            type: string
          example:
            - /Users/data/
            - my-bucket/uploads/
        user_agent:
          type: string
          description: User-Agent header for HTTP downloads. Defaults to 'AntflyDB/1.0' if not set. Some
            servers (e.g., Wikipedia) reject requests without a User-Agent.
          example: AntflyDB/1.0
    InferenceCredentials:
      type: object
      properties:
        endpoint:
          type: string
          description: S3-compatible endpoint (e.g., 's3.amazonaws.com' or 'localhost:9000' for MinIO)
          minLength: 1
          example: s3.amazonaws.com
        use_ssl:
          type: boolean
          description: 'Enable SSL/TLS for S3 connections (default: true for AWS, false for local MinIO)'
          default: true
        access_key_id:
          type: string
          description: AWS access key ID. Supports keystore syntax for secret lookup. Falls back to AWS_ACCESS_KEY_ID
            environment variable if not set.
          example: your-access-key-id
        secret_access_key:
          type: string
          description: AWS secret access key. Supports keystore syntax for secret lookup. Falls back to
            AWS_SECRET_ACCESS_KEY environment variable if not set.
          example: your-secret-access-key
        session_token:
          type: string
          description: Optional AWS session token for temporary credentials. Supports keystore syntax
            for secret lookup.
          example: your-session-token
    InferenceLevel:
      type: string
      description: Logging verbosity level
      enum:
        - debug
        - info
        - warn
        - error
      default: info
      example: info
    InferenceStyle:
      type: string
      description: Logging output format style. 'terminal' for colorized console, 'json' for structured
        JSON, 'logfmt' for token-efficient key=value pairs, 'noop' for silent.
      enum:
        - terminal
        - json
        - logfmt
        - noop
      default: terminal
      example: terminal
    Inferenceschemas-Config:
      type: object
      description: Legacy inference-local logging configuration. The current unified Zig runtime ignores
        it; configure the top-level `log` object instead.
      deprecated: true
      properties:
        level:
          $ref: '#/components/schemas/InferenceLevel'
        style:
          $ref: '#/components/schemas/InferenceStyle'
    InferenceEmbeddingObject:
      type: object
      description: A single embedding result
      required:
        - object
        - index
      properties:
        object:
          type: string
          description: Object type, always "embedding"
          enum:
