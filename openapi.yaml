security:
  - BasicAuth: []
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /db/v1/status:
    get:
      summary: Get cluster status
      tags:
        - cluster_management
      description: Returns minimal cluster health and runtime status.
      operationId: getStatus
      responses:
        '200':
          description: Cluster status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/cluster:
    get:
      summary: Get cluster topology
      tags:
        - cluster_management
      description: Returns cluster health plus data-node, range, replica, and group topology for dashboard
        views.
      operationId: getCluster
      responses:
        '200':
          description: Cluster topology retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTopology'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/connections:
    get:
      summary: List configured external connections
      tags:
        - cluster_management
      description: >
        Enumerates public external connections configured on this node under

        top-level `connections`: inference providers, web search providers,

        external IO endpoints, and CDC replication sources.


        The default response is config-derived and avoids slow provider calls.

        With include=models, each inference provider is queried live for its

        available models where the provider exposes a listing API. Connections

        that fail to respond are reported with status "error" instead of

        failing the whole response. A status of "configured" means the

        connection exists but was not live-probed in this response.
      operationId: listConnections
      parameters:
        - name: types
          in: query
          required: false
          description: >
            Comma-separated list of connection kinds to include

            (e.g. "inference,external_io,cdc"). Defaults to all

            kinds. This filters by the response "kind" field.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: >
            Comma-separated list of expansions. Supported values: `models` to

            live-query inference model listings and `status` to live-probe

            external connections. Live work is opt-in and single-flight per

            server.
          schema:
            type: string
        - name: refresh
          in: query
          required: false
          description: >
            Set to "true" to bypass the short server-side cache for requested

            live expansions. Live expansion passes are serialized to prevent

            concurrent refresh amplification. This does not force a node config

            or metadata reload.
          schema:
            type: string
      responses:
        '200':
          description: Configured connections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionsResponse'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/connections/{connection_id}/inference/{operation}:
    post:
      summary: Invoke an Antfly-compatible inference connection
      description: >
        Invokes an inference operation through the selected connection.

        Requires `inference/*` write permission. Generation requests with

        `stream: true` return the provider's Server-Sent Events stream; all

        other responses are returned as buffered JSON.
      tags:
        - cluster_management
      operationId: invokeInferenceConnection
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: operation
          in: path
          required: true
          description: Requires the connection capability `models.<operation>`.
          schema:
            type: string
            enum:
              - embed
              - generate
              - rerank
              - chunk
              - extract
              - rewrite
              - read
              - transcribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Inference provider response
          content:
            text/event-stream:
              schema:
                type: string
                description: Streaming inference events when requested by the operation payload.
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid connection or operation
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Inference write permission is missing, or the connection does not declare the required
            capability
        '502':
          description: Inference provider request failed
        '503':
          $ref: '#/components/responses/InferenceTransientCapacity'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/secrets:
    get:
      summary: List secrets status
      tags:
        - cluster_management
      description: >
        List all configured secret names and their status (secret-store file, env var, or both).

        Never returns secret values — only names and configuration status.
      operationId: listSecrets
      responses:
        '200':
          description: Secret status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/secrets/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: Secret key name (e.g., openai.api_key)
        schema:
          type: string
          pattern: ^[a-zA-Z0-9._-]+$
    put:
      summary: Store a secret
      tags:
        - cluster_management
      description: >
        Store a secret in the configured writable secret-store file. Only available in standalone mode.

        Returns 503 in multi-node mode.
      operationId: putSecret
      requestBody:
        required: true
        content:
