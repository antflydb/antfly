          description: Whether cancellation has been requested for a running pass. Running passes finish
            at a bounded reprocess boundary before the job transitions to cancelled.
        created_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was created.
        last_updated_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was last updated.
        expires_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds after which the retained job status may be removed.
