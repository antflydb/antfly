          example: ~/.antfly/inference/ml
        content_security:
          $ref: '#/components/schemas/InferenceContentSecurityConfig'
          description: Configured fields are merged individually over a fail-closed inference baseline.
            Omitted or empty policies deny HTTP(S), file, and S3 while allowing data URIs; omitted allowed_hosts
            and allowed_paths remain explicit deny-all lists even when another field is configured. Enable
