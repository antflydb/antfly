          type: string
          minLength: 1
          pattern: ^/
          description: RFC 6901 JSON Pointer to the stored-document value.
        value:
          type: boolean
    GraphDocumentBoolFieldFilter:
      type: object
      additionalProperties: false
      required:
        - bool_field
      properties:
        bool_field:
          $ref: '#/components/schemas/GraphDocumentBoolFieldBody'
    GraphDocumentFilterConjunction:
      type: object
      additionalProperties: false
      required:
        - conjuncts
      properties:
        conjuncts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphDocumentFilter'
    GraphDocumentFilterDisjunction:
      type: object
      additionalProperties: false
      required:
        - disjuncts
      properties:
        disjuncts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphDocumentFilter'
        min:
          type: integer
          format: uint32
          minimum: 0
          maximum: 64
          x-go-type-skip-optional-pointer: false
          description: Minimum number of disjuncts that must match. Omit for conventional context-sensitive
            disjunction semantics; set to 0 to impose no matching-clause requirement. Under `must_not`,
            the complete thresholded disjunction is negated as one group.
    GraphDocumentFilterBoolean:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Stored-document boolean predicate. `must` and `filter` are required clauses; `should`
        uses its disjunction threshold; and `must_not` negates its thresholded disjunction as one group.
        Thus a `must_not.min` of N excludes a document only when at least N of that group's clauses match.
      properties:
        must:
          $ref: '#/components/schemas/GraphDocumentFilterConjunction'
        should:
          $ref: '#/components/schemas/GraphDocumentFilterDisjunction'
        must_not:
          $ref: '#/components/schemas/GraphDocumentFilterDisjunction'
        filter:
          $ref: '#/components/schemas/GraphDocumentFilter'
    GraphDocumentFilter:
      oneOf:
        - $ref: '#/components/schemas/GraphDocumentFuzzyFilter'
        - $ref: '#/components/schemas/GraphDocumentTermFilter'
        - $ref: '#/components/schemas/GraphDocumentPrefixFilter'
        - $ref: '#/components/schemas/GraphDocumentRegexpFilter'
        - $ref: '#/components/schemas/GraphDocumentWildcardFilter'
        - $ref: '#/components/schemas/GraphDocumentNumericRangeFilter'
        - $ref: '#/components/schemas/GraphDocumentTermRangeFilter'
        - $ref: '#/components/schemas/GraphDocumentDateRangeFilter'
        - $ref: '#/components/schemas/GraphDocumentMatchAllFilter'
        - $ref: '#/components/schemas/GraphDocumentMatchNoneFilter'
        - $ref: '#/components/schemas/GraphDocumentIdsFilter'
        - $ref: '#/components/schemas/GraphDocumentBoolFieldFilter'
        - $ref: '#/components/schemas/GraphDocumentFilterBoolean'
        - $ref: '#/components/schemas/GraphDocumentFilterConjunction'
        - $ref: '#/components/schemas/GraphDocumentFilterDisjunction'
      description: A non-scoring stored-document predicate embedded at a graph node. It uses structurally
        distinct stored-field predicates and deliberately excludes analyzer-backed full-text clauses such
        as match, phrase, multi_match, and query_string. Fuzzy predicates require an explicit fuzziness.
        Range predicates use numeric_range, term_range, or date_range wrappers, and every stored value
        is addressed by an RFC 6901 JSON Pointer in `path`. Alias-to-alias predicates belong in GraphMatch.where.
    GraphMatchNode:
      type: object
      additionalProperties: false
      description: Declared under an alias of at most 128 Unicode code points. Omit table for the queried
        table. Declare it for a cross-table alias that may be used as the source of a relationship, including
        planner-selected reverse expansion of a branched pattern.
      properties:
        table:
          type: string
          minLength: 1
          pattern: '[^ \t\r\n]'
          description: Owning table for this alias. Omit for the queried table.
        filter:
          $ref: '#/components/schemas/GraphDocumentFilter'
          description: Non-scoring structured stored-document predicate evaluated for this alias. Serverless
            execution rejects document filters on aliases qualified with a different table because its
            published snapshot contains only the queried table. Explicitly qualifying an alias with the
            queried table is equivalent to omitting `table`.
    GraphEdgeWeightRange:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Inclusive per-edge weight filter. At least one bound is required. Bounds must be finite
        and non-negative; when both are present, min must not exceed max. This filters individual stored
        edges and does not constrain the aggregate path objective.
      properties:
        min:
          type: number
          format: double
          minimum: 0
          x-go-type-skip-optional-pointer: false
        max:
          type: number
          format: double
          minimum: 0
          x-go-type-skip-optional-pointer: false
    GraphMatchEdge:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      description: 'Structural edge expansion from the `from` alias to the `to` alias. Direction defaults
        to `out`; use `in` to reverse the stored edge or `both` to match an undirected relationship without
        duplicating stored edges. A fixed single-hop relationship preserves physical self-loops and may
        bind two distinct aliases to the same node identity. Variable-length expansion uses node-simple
        paths: a (table, key) identity is visited at most once within one expanded edge path, except when
        closing onto an already bound target alias for an explicit cycle. Exact distributed and serverless
        execution rejects planner-required reverse variable expansion when the source tables of unnamed
        intermediate nodes cannot be proven. Express cross-table multi-hop patterns as explicit single-hop
        edges with a table-qualified alias at each table boundary.'
      properties:
        from:
          $ref: '#/components/schemas/GraphIdentifier'
        to:
          $ref: '#/components/schemas/GraphIdentifier'
        direction:
          $ref: '#/components/schemas/EdgeDirection'
          description: Stored-edge direction relative to `from`; defaults to `out`.
        types:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphEdgeType'
          description: Empty or omitted matches every edge type; otherwise at most 64 unique types totaling
            at most 64 KiB.
        min_hops:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
        max_hops:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
        edge_weight:
          x-go-type-skip-optional-pointer: false
          $ref: '#/components/schemas/GraphEdgeWeightRange'
    GraphWhereAnd:
      type: object
      additionalProperties: false
      required:
        - and
      properties:
        and:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphWhereExpression'
    GraphAliasOperand:
      type: object
      additionalProperties: false
      required:
        - alias
      properties:
        alias:
          $ref: '#/components/schemas/GraphIdentifier'
    GraphNotEqualPredicate:
      type: object
      additionalProperties: false
      required:
        - left
        - right
      properties:
        left:
          $ref: '#/components/schemas/GraphAliasOperand'
        right:
          $ref: '#/components/schemas/GraphAliasOperand'
    GraphWhereNotEqual:
      type: object
      additionalProperties: false
      required:
        - not_equal
      properties:
        not_equal:
          $ref: '#/components/schemas/GraphNotEqualPredicate'
    GraphNotExistsPattern:
      type: object
      additionalProperties: false
      required:
        - edges
      properties:
        edges:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphMatchEdge'
      description: Correlated negative-edge predicate over aliases already visible at this point in the
        MATCH. It does not introduce new aliases.
    GraphWhereNotExists:
      type: object
      additionalProperties: false
      required:
        - not_exists
      properties:
        not_exists:
          $ref: '#/components/schemas/GraphNotExistsPattern'
    GraphWhereExpression:
      oneOf:
        - $ref: '#/components/schemas/GraphWhereAnd'
        - $ref: '#/components/schemas/GraphWhereNotEqual'
        - $ref: '#/components/schemas/GraphWhereNotExists'
    GraphOptionalMatch:
      type: object
      additionalProperties: false
      required:
        - edges
      description: One correlated left-outer graph pattern. Optional groups are evaluated in array order
        and must connect to an alias visible from the required MATCH or an earlier optional group. Each
        input binding is extended by every matching optional binding; when none match, exactly one binding
        is retained with every alias introduced by this group set to null.
      properties:
        nodes:
          type: object
          maxProperties: 64
          additionalProperties:
            $ref: '#/components/schemas/GraphMatchNode'
          x-antfly-property-name-schema:
            $ref: '#/components/schemas/GraphIdentifier'
          description: Keys are GraphIdentifiers naming aliases introduced by this optional match.
        edges:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphMatchEdge'
        where:
          $ref: '#/components/schemas/GraphWhereExpression'
    GraphMatch:
      type: object
      additionalProperties: false
      required:
        - anchor
        - nodes
        - edges
      description: '`anchor` names the alias enumerated from the query table as the source relation. Every
        other alias is reached through graph edges and may resolve to a table-qualified target identity.
        An `ids` filter, or a disjunction made only of `ids` filters, uses the table''s primary identity
        access path and needs no secondary index. Stored-field predicates and row-level authorization
        filters on the anchor must have native index coverage so Antfly can enumerate the complete relation
        in `_id` order; otherwise the request fails with `graph_anchor_filter_requires_index`.'
      properties:
        anchor:
          $ref: '#/components/schemas/GraphIdentifier'
        nodes:
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            $ref: '#/components/schemas/GraphMatchNode'
          x-antfly-property-name-schema:
            $ref: '#/components/schemas/GraphIdentifier'
          description: Keys are GraphIdentifiers naming aliases in the required match.
        edges:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphMatchEdge'
        where:
          $ref: '#/components/schemas/GraphWhereExpression'
        optional:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/GraphOptionalMatch'
          description: Ordered correlated left-outer patterns. Aliases introduced by an earlier item are
            visible to later items, including as null.
    GraphBindingsReturn:
      type: object
      additionalProperties: false
      required:
        - bindings
      properties:
        bindings:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphIdentifier'
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        include_documents:
          type: boolean
          default: false
          description: Hydrate documents for projected non-null bindings when they exist at the pinned
            snapshot. A dangling graph identity omits document. When false, document is always omitted.
            The product of `limit` and the number of projected bindings may not exceed 10,000. Table-qualified
            bindings are hydrated by coordinator-backed deployments; runtimes with only a source-table
            snapshot reject such requests instead of silently omitting an available document.
        fields:
          type: array
          items:
            type: string
          description: Document fields to hydrate. Requires include_documents=true; omit to include all
            fields.
    GraphRowCountTarget:
      type: string
      enum:
        - '*'
      description: Count every complete graph binding, including a binding retained by an unmatched optional
        group through null extension.
    GraphRowCountAggregate:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          $ref: '#/components/schemas/GraphRowCountTarget'
    GraphAliasCountAggregate:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          $ref: '#/components/schemas/GraphIdentifier'
          description: Count bindings in which this alias is non-null. An unmatched optional alias does
            not increment the count.
        distinct:
          type: boolean
          default: false
          description: Count exact table-qualified identities. Exact distinct sets share a request resource
            budget and fail with `graph_distinct_budget_exceeded` instead of returning a partial count.
    GraphCountAggregate:
      oneOf:
        - $ref: '#/components/schemas/GraphRowCountAggregate'
        - $ref: '#/components/schemas/GraphAliasCountAggregate'
      description: Exact count(*) or count(alias). The distinct option exists only for alias counts, making
        distinct count(*) invalid by schema and at runtime. count(*) includes null-extended optional rows;
        count(alias) counts only bindings where that alias is non-null.
    GraphAggregatesReturn:
      type: object
      additionalProperties: false
      required:
        - aggregates
      properties:
        aggregates:
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            $ref: '#/components/schemas/GraphCountAggregate'
          x-antfly-property-name-schema:
            $ref: '#/components/schemas/GraphIdentifier'
          description: Keys are GraphIdentifiers naming aggregate results.
    GraphReturn:
      oneOf:
        - $ref: '#/components/schemas/GraphBindingsReturn'
        - $ref: '#/components/schemas/GraphAggregatesReturn'
      description: Return bindings or exact aggregates. Bindings and aggregates are mutually exclusive.
    GraphMatchQuery:
      type: object
      additionalProperties: false
      required:
        - index
        - match
        - return
      description: Conjunctive graph match over the complete authorized source universe. Top-level retrieval
        queries and filters do not scope that universe; put source constraints on the node named by match.anchor.
        Results are exact or the request fails; execution never labels a partial aggregate exact. Source
        anchors are streamed in stable snapshot-pinned pages and charged to the request-wide `scanned_anchors`
        work dimension; transient expansion state remains bounded, and execution observes request deadlines,
        cancellation, and server resource admission. Exact distinct identity sets are also bounded and
        fail closed when their request-scoped memory budget is exhausted.
      properties:
        index:
          type: string
          minLength: 1
          pattern: .*\S.*
        match:
          $ref: '#/components/schemas/GraphMatch'
        return:
          $ref: '#/components/schemas/GraphReturn'
    GraphKeyNodeSelector:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Exact keys in the table being queried.
    GraphPathEndpoint:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          minLength: 1
        table:
          x-go-type-skip-optional-pointer: false
          type: string
          minLength: 1
          pattern: '[^ \t\r\n]'
          description: Optional table qualifier for an exact cross-table node identity. Omit for the query
            table.
    GraphIdentityNodeSelector:
      type: object
      additionalProperties: false
      required:
        - identities
      properties:
        identities:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphPathEndpoint'
          description: Exact node identities. Omitted table means the query table.
    GraphResultRefNodeSelector:
      description: Select nodes from a prior graph result. `binding` is valid only when `result_ref` names
        a prior MATCH result; traversal and path results select their returned or endpoint nodes and prohibit
        `binding`.
      type: object
      additionalProperties: false
      required:
        - result_ref
      properties:
        result_ref:
          type: string
          x-antfly-graph-result-name-schema:
            $ref: '#/components/schemas/GraphIdentifier'
          description: '`$query_results` selects the final ranked query results. `$graph_results.<query-name>`
            selects a prior graph query result. Prior MATCH results require `binding`; traversal and path
            results prohibit it. A path result selects the endpoint node of each returned path.'
        binding:
          $ref: '#/components/schemas/GraphIdentifier'
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum referenced results to use. Omit only when the referenced result is complete.
    GraphNodeSelector:
      oneOf:
        - $ref: '#/components/schemas/GraphKeyNodeSelector'
        - $ref: '#/components/schemas/GraphIdentityNodeSelector'
        - $ref: '#/components/schemas/GraphResultRefNodeSelector'
      description: Select graph nodes using exactly one explicit, exact selector form.
    GraphTraversal:
      type: object
      additionalProperties: false
      required:
        - start
      description: Breadth-first traversal with request-wide deduplication by exact table-qualified node
        identity. Direction defaults to `out`; use `both` to traverse a relationship as undirected without
        storing a reciprocal edge.
      properties:
        start:
          $ref: '#/components/schemas/GraphNodeSelector'
        direction:
          $ref: '#/components/schemas/EdgeDirection'
          description: Stored-edge direction relative to each expanded node; defaults to `out`.
        edge_types:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphEdgeType'
          description: At most 64 unique edge types totaling at most 64 KiB.
        max_depth:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
          description: Maximum traversal depth. Defaults to one hop to keep fan-out explicit.
        edge_weight:
          x-go-type-skip-optional-pointer: false
          $ref: '#/components/schemas/GraphEdgeWeightRange'
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        include_paths:
          type: boolean
          default: false
        include_documents:
          type: boolean
          default: false
          description: Include each result node's stored document when it exists at the pinned snapshot.
            A dangling graph identity omits document. When false, document is always omitted.
        fields:
          type: array
          items:
            type: string
          description: Requires include_documents=true. Omit to include all document fields.
        filter:
          $ref: '#/components/schemas/GraphDocumentFilter'
          description: Non-scoring structured stored-document predicate for reached nodes.
    GraphTraverseQuery:
      type: object
      additionalProperties: false
      required:
        - index
        - traverse
      properties:
        index:
          type: string
          minLength: 1
          pattern: .*\S.*
        traverse:
          $ref: '#/components/schemas/GraphTraversal'
    GraphShortestPath:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      description: Find the best path from `from` to `to` in the requested stored-edge direction.
      properties:
        from:
          $ref: '#/components/schemas/GraphPathEndpoint'
        to:
          $ref: '#/components/schemas/GraphPathEndpoint'
        direction:
          $ref: '#/components/schemas/EdgeDirection'
          description: Stored-edge direction relative to each expanded path node; defaults to `out`.
        edge_types:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphEdgeType'
          description: At most 64 unique edge types totaling at most 64 KiB.
        max_depth:
          type: integer
          minimum: 1
          maximum: 64
          default: 10
        edge_weight:
          x-go-type-skip-optional-pointer: false
          $ref: '#/components/schemas/GraphEdgeWeightRange'
        objective:
          $ref: '#/components/schemas/GraphPathObjective'
          default: min_hops
        filter:
          $ref: '#/components/schemas/GraphDocumentFilter'
          description: Non-scoring structured stored-document predicate for path nodes.
        include_documents:
          type: boolean
          default: false
          description: Attach the terminal stored document as paths[].document when it exists at the pinned
            snapshot. A dangling terminal identity omits document. When false, document is always omitted.
        fields:
          type: array
          items:
            type: string
          description: Requires include_documents=true. Omit to include all document fields.
    GraphShortestPathQuery:
      type: object
      additionalProperties: false
      required:
        - index
        - shortest_path
      properties:
        index:
          type: string
          minLength: 1
          pattern: .*\S.*
        shortest_path:
          $ref: '#/components/schemas/GraphShortestPath'
    GraphKShortestPaths:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - k
      description: Find up to `k` loopless paths from `from` to `to` in the requested stored-edge direction.
        Results are unique by ordered table-qualified node identities plus stored-edge direction and type,
        and are ordered best-first by the selected objective.
      properties:
        from:
          $ref: '#/components/schemas/GraphPathEndpoint'
        to:
          $ref: '#/components/schemas/GraphPathEndpoint'
        direction:
          $ref: '#/components/schemas/EdgeDirection'
          description: Stored-edge direction relative to each expanded path node; defaults to `out`.
        k:
          type: integer
          minimum: 1
          maximum: 100
        edge_types:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GraphEdgeType'
          description: At most 64 unique edge types totaling at most 64 KiB.
        max_depth:
          type: integer
          minimum: 1
          maximum: 64
          default: 10
        edge_weight:
          x-go-type-skip-optional-pointer: false
          $ref: '#/components/schemas/GraphEdgeWeightRange'
        objective:
          $ref: '#/components/schemas/GraphPathObjective'
          default: min_hops
        filter:
          $ref: '#/components/schemas/GraphDocumentFilter'
          description: Non-scoring structured stored-document predicate for path nodes.
        include_documents:
          type: boolean
          default: false
          description: Attach each terminal stored document as paths[].document when it exists at the
            pinned snapshot. A dangling terminal identity omits document. When false, document is always
            omitted.
        fields:
          type: array
