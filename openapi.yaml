  /db/v1/tables/{tableName}/idempotent-batch:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table for the idempotent batch operation
        schema:
          type: string
    post:
      summary: Perform a durably idempotent batch operation on a table
      tags:
        - data_operations
      operationId: idempotentBatchWrite
      description: >
        Executes a batch under a durable, payload-sealed idempotency receipt. The separate endpoint is
        rolling-upgrade safe because older servers reject it instead of silently ignoring the idempotency
        contract. Keys are scoped to the authenticated principal and table and may be replayed after timeouts,
        lost responses, topology changes, or process restarts. Receipts use the configured transaction-session
        retention period; callers must not reuse a key after that period. Distributed deployments fail
        closed unless the receipt store is cluster-shared and supports atomic owner fencing.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: Stable operation key scoped to the authenticated principal and table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: A committed operation was replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchResponse'
        '201':
          description: Operation committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchResponse'
        '202':
          description: Commit is durable; visibility, recovery, or receipt handoff remains pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          description: Durable non-application or an outcome that must be reconciled by stable key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchError'
        '429':
          description: >
            Write admission or durable receipt capacity is exhausted. Because an

            identical concurrent request may already own execution capacity, the

            keyed response can conservatively report `unknown`; retry the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchError'
        '503':
          description: Cluster-safe durable idempotency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentBatchError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BasicAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
  /db/v1/tables/{tableName}/merge:
    parameters:
      - name: tableName
