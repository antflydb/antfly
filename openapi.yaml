    AntflyChunkerConfig:
      description: >
        Configuration for the Antfly inference chunking provider.


        Antfly inference is a centralized HTTP service that provides chunking with multi-tier caching.

        The model name maps to ONNX model directory names (similar to how Ollama works).


        **Chunking Models:**

        - fixed: Simple fixed-size chunking by token count (built-in, no ONNX required)

        - Any other name will attempt to load from models/chunkers/{name}/ directory


        **Caching:**

        - L1: Memory cache with 2-minute TTL

        - L2: Persistent Pebble database

        - Singleflight deduplication for concurrent identical requests
      allOf:
        - $ref: '#/components/schemas/ChunkOptions'
        - type: object
          properties:
            api_url:
              type: string
              format: uri
              description: The URL of the Inference API endpoint (e.g., 'http://localhost:8080'). Can
                also be set via ANTFLY_INFERENCE_URL environment variable.
              example: http://localhost:8080
            model:
              type: string
              description: The chunking model to use. Defaults to 'fixed' for simple token-based chunking;
                other values select a model from models/chunkers/{name}/. Successful create responses
                include the effective model.
              default: fixed
              example: fixed
      example:
        provider: antfly
        api_url: http://localhost:8080
        model: fixed
        max_chunks: 50
        text:
          target_tokens: 500
          overlap_tokens: 50
          separator: >2+


