        max:
          type: number
          format: double
          x-go-type-skip-optional-pointer: false
        inclusive_min:
          type: boolean
          default: true
          x-go-type-skip-optional-pointer: false
        inclusive_max:
          type: boolean
          default: false
          x-go-type-skip-optional-pointer: false
    GraphDocumentNumericRangeFilter:
      type: object
      additionalProperties: false
      required:
        - numeric_range
      properties:
        numeric_range:
          $ref: '#/components/schemas/GraphDocumentNumericRangeBody'
    GraphDocumentTermRangeBody:
      type: object
      additionalProperties: false
      required:
        - path
      not:
        allOf:
          - not:
              required:
                - min
          - not:
              required:
                - max
      description: At least one of min or max is required and enforced by every Antfly execution boundary.
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^/
          description: RFC 6901 JSON Pointer to the stored-document value.
        min:
          type: string
          x-go-type-skip-optional-pointer: false
        max:
          type: string
          x-go-type-skip-optional-pointer: false
        inclusive_min:
          type: boolean
          default: true
          x-go-type-skip-optional-pointer: false
        inclusive_max:
          type: boolean
          default: false
          x-go-type-skip-optional-pointer: false
    GraphDocumentTermRangeFilter:
      type: object
      additionalProperties: false
      required:
        - term_range
      properties:
        term_range:
          $ref: '#/components/schemas/GraphDocumentTermRangeBody'
    GraphDocumentDateRangeBody:
      type: object
      additionalProperties: false
      required:
        - path
      not:
        allOf:
          - not:
              required:
                - start
          - not:
              required:
                - end
      description: At least one of start or end is required and enforced by every Antfly execution boundary.
        Bounds are RFC 3339 instants in Antfly's unsigned Unix-nanosecond domain, from 1970-01-01T00:00:00Z
        through 2554-07-21T23:34:33.709551615Z inclusive. When both are present, start must not exceed
        end after offset normalization.
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^/
          description: RFC 6901 JSON Pointer to the stored-document value.
        start:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        end:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
        inclusive_start:
          type: boolean
          default: true
          x-go-type-skip-optional-pointer: false
        inclusive_end:
          type: boolean
          default: false
          x-go-type-skip-optional-pointer: false
    GraphDocumentDateRangeFilter:
      type: object
      additionalProperties: false
      required:
        - date_range
      properties:
        date_range:
          $ref: '#/components/schemas/GraphDocumentDateRangeBody'
    GraphDocumentMatchAllFilter:
      type: object
      additionalProperties: false
      required:
        - match_all
      properties:
        match_all:
          type: object
          additionalProperties: false
    GraphDocumentMatchNoneFilter:
      type: object
      additionalProperties: false
      required:
        - match_none
      properties:
        match_none:
          type: object
          additionalProperties: false
    GraphDocumentIdsFilter:
      type: object
      additionalProperties: false
      required:
        - ids
