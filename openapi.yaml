          description: List of operations to apply in sequence
        upsert:
          type: boolean
          default: false
          description: If true, create document if it doesn't exist (like MongoDB upsert)
      example:
        key: article:123
        operations:
          - op: $inc
            path: $.views
            value: 1
          - op: $set
            path: $.lastViewed
            value: '2026-07-28T12:00:00Z'
    ScanKeysRequest:
      type: object
      description: >
        Request to scan keys in a table within a key range.

        If no range is specified, scans all keys in the table.
      properties:
        from:
          type: string
          description: >
            Start of the key range to scan (exclusive by default).

            Can be a full key or a prefix. If not specified, starts from

            the beginning of the table.
          example: user:100
        to:
          type: string
          description: >
            End of the key range to scan (inclusive by default).

            Can be a full key or a prefix. If not specified, scans to

            the end of the table.
          example: user:200
        inclusive_from:
          type: boolean
          description: >
            If true, include keys matching 'from' in the results.

            Default: false (exclusive lower bound for pagination).
          default: false
        exclusive_to:
          type: boolean
          description: >
            If true, exclude keys matching 'to' from the results.

            Default: false (inclusive upper bound).
          default: false
        fields:
          type: array
          items:
            type: string
          description: >
            List of fields to include in each result. If not specified,

            only returns the key. Supports:

            - Simple fields: "title", "author"

            - Nested paths: "user.address.city"

            - Wildcards: "_chunks.*"

            - Exclusions: "-_chunks.*._embedding"

            - Special fields: "_embeddings", "_summaries", "_chunks"
          example:
            - title
            - author
            - metadata.tags
        filter_query:
          $ref: '#/components/schemas/RawQuery'
          description: >
            Structured subset of the Antfly query AST used to filter a primary-key

            scan. Only documents matching this query are included in results.

            Because scans do not open a text index, text-index-only variants such

            as phrase and multi-match queries are rejected with a validation error

            instead of being evaluated with slower stored-document semantics.


            Examples:

            - Status filtering: `{"term":{"path":"/status","value":"published"}}`

            - Date ranges: `{"range":{"/created_at":{"gte":"2023-01-01"}}}`

            - Field existence: `{"exists":{"path":"/category"}}`
        limit:
          type: integer
          minimum: 1
          description: >
            Maximum number of results to return. If not specified, returns all

            matching keys in the range. Useful for pagination or sampling.
          example: 100
    BatchRequest:
      type: object
      description: >
        Batch insert, delete, and transform operations in a single request.


        **Atomicity**:

        - **Single shard**: Operations are atomic within shard boundaries

        - **Multiple shards**: Uses distributed 2-phase commit (2PC) for atomic cross-shard writes


        **How distributed transactions work**:

        1. Metadata server allocates HLC timestamp and selects coordinator shard

        2. Coordinator writes transaction record, participants write intents

        3. After all intents succeed, coordinator commits transaction

        4. Participants are notified asynchronously to resolve intents

        5. Recovery loop ensures notifications complete even after coordinator failure


        **Performance**:

        - Single-shard batches: < 5ms latency

        - Cross-shard transactions: ~20ms latency

        - Intent resolution: < 30 seconds worst-case (via recovery loop)


        **Guarantees**:

        - All writes succeed or all fail (atomicity across all shards)

        - Coordinator failure is recoverable (new leader resumes notifications)

        - Idempotent resolution (duplicate notifications are safe)


        **Benefits**:

        - Reduces network overhead compared to individual requests

        - More efficient indexing (updates are batched)

        - Automatic distributed transactions when operations span shards


        The inserts are upserts - existing keys are overwritten, new keys are created.
      properties:
        inserts:
          type: object
          description: >
            Map of document IDs to document objects. Each key is the unique identifier for the document.


            Best practices:

            - Use consistent key naming schemes (e.g., "user:123", "article:456")

            - Key length affects storage and performance - keep them reasonably short

            - Keys are sorted lexicographically, so choose prefixes that support range scans
          additionalProperties:
            type: object
            description: Document object with arbitrary fields matching your table schema.
          example:
            user:123:
              name: John Doe
              email: john@example.com
              age: 30
              tags:
                - customer
                - premium
            user:456:
              name: Jane Smith
              email: jane@example.com
              age: 25
              tags:
                - customer
        deletes:
          type: array
          description: >
            Array of document IDs to delete. Documents are removed from all indexes.


            Notes:

            - Non-existent keys are silently ignored

            - Deletions are processed before inserts in the same batch

            - Keys are permanently removed from storage and indexes
          items:
            type: string
          example:
            - user:789
            - user:old_account
        transforms:
          type: array
          description: >
            Array of transform operations for in-place document updates using MongoDB-style operators.


            Transform operations allow you to modify documents without read-modify-write races:

            - Operations are applied atomically on the server

            - Multiple operations per document are applied in sequence

            - Supports numeric and set-like operations ($inc, $min, $max, $addToSet, $pull)


            Common use cases:

            - Increment counters (views, likes, votes)

            - Update timestamps ($set)

            - Add or remove array values ($addToSet, $pull)

            - Update nested fields without overwriting the entire document
          items:
            $ref: '#/components/schemas/Transform'
          example:
            - key: article:123
              operations:
                - op: $inc
                  path: $.views
                  value: 1
                - op: $set
                  path: $.lastViewed
                  value: '2026-07-28T12:00:00Z'
            - key: user:456
              operations:
                - op: $addToSet
                  path: $.tags
                  value: vip
        sync_level:
          $ref: '#/components/schemas/SyncLevel'
      example:
        inserts:
          user:123:
            name: John Doe
            email: john@example.com
            age: 30
            tags:
              - customer
              - premium
          user:456:
            name: Jane Smith
            email: jane@example.com
            age: 25
            tags:
              - customer
        deletes:
          - user:789
          - user:old_account
    BatchResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - committed
            - committed_pending
            - committed_visibility_pending
            - committed_recovery_pending
            - committed_repair_required
          description: >
            Durable commit outcome. `committed_pending` means requested visibility or

            participant propagation is still completing. `committed_repair_required`

            means the primary write committed, but a terminal enrichment failure needs

            operator repair and will not be retried indefinitely.
        inserted:
          type: integer
          description: Number of documents successfully inserted
        deleted:
          type: integer
          description: Number of documents successfully deleted
        transformed:
          type: integer
          description: Number of documents successfully transformed
        transaction_id:
          type: string
          nullable: true
          description: Stable transaction receipt ID returned for keyed batches.
        reconcile:
          type: string
          nullable: true
          description: Transaction-session status path for this keyed batch.
