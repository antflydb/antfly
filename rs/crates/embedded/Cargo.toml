[package]
name = "antfly-embedded"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Safe Rust binding for local Antfly databases and inference via libantfly"

[dependencies]
antfly-embedded-sys = { path = "../embedded-sys", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "offline"], optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
either = { version = "1", optional = true }
url = { version = "2", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["serde"]
sqlx = ["serde", "dep:sqlx-core", "dep:tokio", "dep:futures-core", "dep:futures-util", "dep:async-stream", "dep:either", "dep:url", "dep:log"]
# Typed convenience wrappers (Status, Capabilities, CheckReport, ...) on top
# of the raw *_json methods.
serde = ["dep:serde", "dep:serde_json"]
# Actually link against libantfly. Off by default so `cargo build`/plain
# `cargo test` never require the dylib to be present; enable for tests under
# tests/ that call into the real library (see their `required-features`).
libantfly = ["antfly-embedded-sys/libantfly"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["libantfly", "serde"]

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"
required-features = ["libantfly", "serde"]

[[test]]
name = "errors"
path = "tests/errors.rs"
required-features = ["libantfly"]

[[test]]
name = "inference"
path = "tests/inference.rs"
required-features = ["libantfly"]

[[test]]
name = "pure"
path = "tests/pure.rs"

[[test]]
name = "sqlx"
path = "tests/sqlx.rs"
required-features = ["libantfly", "sqlx"]
