apiVersion: v1
kind: Secret
metadata:
  name: antfly-ha-admin-token
  namespace: antfly-operator-namespace
type: Opaque
stringData:
  token: replace-with-a-random-admin-token
---
apiVersion: v1
kind: Secret
metadata:
  name: antfly-ha-admin-token
  namespace: default
type: Opaque
stringData:
  token: replace-with-a-random-admin-token
---
apiVersion: antfly.io/v1
kind: AntflyCluster
metadata:
  name: antfly-primary
  namespace: default
  labels:
    app.kubernetes.io/name: antfly-cluster
    app.kubernetes.io/instance: antfly-primary
    app.kubernetes.io/part-of: antfly
spec:
  image: ghcr.io/antflydb/antfly:latest
  imagePullPolicy: IfNotPresent
  mode: Standalone

  standalone:
    replicas: 1
    nodeID: 1
    metadataAPI:
      port: 8080
    metadataRaft:
      port: 9017
    storeAPI:
      port: 12380
    storeRaft:
      port: 9021
    health:
      port: 4200
    resources:
      cpu: "1000m"
      memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

  publicAPI:
    enabled: true
    serviceType: ClusterIP
    port: 80

  storage:
    storageClass: ""
    standaloneStorage: "20Gi"

  highAvailability:
    mode: HotStandby
    identity:
      clusterID: 100
      shardID: 0
      tableID: 0
      timelineID: 1
      epoch: 1
      currentPrimaryID: primary-a
    admin:
      primaryURL: http://antfly-primary-public-api.default.svc.cluster.local:80
      primaryActionURL: http://antfly-primary-standalone.default.svc.cluster.local:8080
      executePlannedActions: true
      tokenEnvVar: ANTFLY_HA_ADMIN_TOKEN
    runtime:
      role: Primary
      nodeID: primary-a
      fencePath: /antflydb/ha/fence.wal
      formerPrimaryLogPath: /antflydb/ha/primary.wal
      adminTokenEnvVar: ANTFLY_HA_ADMIN_TOKEN
      adminTokenSecretRef:
        name: antfly-ha-admin-token
        key: token
        optional: false
      primary:
        logPath: /antflydb/ha/primary.wal
        slotsPath: /antflydb/ha/slots
    standbys:
    - name: standby-a
      slotName: standby-a
      adminURL: http://antfly-standby-public-api.default.svc.cluster.local:80
      routeSelector:
        app.kubernetes.io/name: antfly-database
        app.kubernetes.io/component: standalone
        app.kubernetes.io/instance: antfly-standby
    syncPolicy:
      mode: RemoteApply
      selection: Any
      required: 1
      standbyNames:
      - standby-a
      failurePolicy: FailClosed
    retention:
      maxLagLSN: 1000000
    automaticFailover:
      enabled: true
      fencingAuthority: KubernetesLease
      requireRemoteApply: true
      maximumLagLSN: 0

  config: |
    {
      "log": {
        "level": "info",
        "style": "json"
      },
      "enable_metrics": true
    }
---
apiVersion: antfly.io/v1
kind: AntflyCluster
metadata:
  name: antfly-standby
  namespace: default
  labels:
    app.kubernetes.io/name: antfly-cluster
    app.kubernetes.io/instance: antfly-standby
    app.kubernetes.io/part-of: antfly
spec:
  image: ghcr.io/antflydb/antfly:latest
  imagePullPolicy: IfNotPresent
  mode: Standalone

  standalone:
    replicas: 1
    nodeID: 2
    metadataAPI:
      port: 8080
    metadataRaft:
      port: 9017
    storeAPI:
      port: 12380
    storeRaft:
      port: 9021
    health:
      port: 4200
    resources:
      cpu: "1000m"
      memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

  publicAPI:
    enabled: true
    serviceType: ClusterIP
    port: 80

  storage:
    storageClass: ""
    standaloneStorage: "20Gi"

  highAvailability:
    mode: HotStandby
    identity:
      clusterID: 100
      shardID: 0
      tableID: 0
      timelineID: 1
      epoch: 1
      currentPrimaryID: primary-a
    admin:
      primaryURL: http://antfly-primary-public-api.default.svc.cluster.local:80
      executePlannedActions: false
      tokenEnvVar: ANTFLY_HA_ADMIN_TOKEN
    runtime:
      role: Standby
      nodeID: standby-a
      fencePath: /antflydb/ha/fence.wal
      adminTokenEnvVar: ANTFLY_HA_ADMIN_TOKEN
      adminTokenSecretRef:
        name: antfly-ha-admin-token
        key: token
        optional: false
      standby:
        logPath: /antflydb/ha/standby.wal
        progressPath: /antflydb/ha/standby-progress.wal
        upstreamURL: http://antfly-primary-public-api.default.svc.cluster.local:80
        slotName: standby-a

  config: |
    {
      "log": {
        "level": "info",
        "style": "json"
      },
      "enable_metrics": true
    }
