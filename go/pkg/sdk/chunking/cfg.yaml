# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: chunking
generate:
  embedded-spec: true
  models: true
compatibility:
  always-prefix-enum-values: true
output: openapi.gen.go
output-options:
  skip-prune: true
  prefer-skip-optional-pointer: true
  prefer-skip-optional-pointer-with-omitzero: true
import-mapping:
  generating.yaml: github.com/antflydb/antfly/go/pkg/sdk/oapi
