[package]
name = "memoryaf-extension"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Reference MemoryAF MCP tool handlers for Antfly's WASM extension runtime."
publish = false

[lib]
name = "memoryaf_extension"
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
wit-bindgen = "0.58.0"
