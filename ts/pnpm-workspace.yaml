packages:
  - packages/*
  - apps/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  koffi: true
  msw: true
  sharp: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - canvas
  - core-js
  - esbuild
  - koffi
  - msw
  - protobufjs
  - sharp

overrides:
  lodash: 4.18.1
