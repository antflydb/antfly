packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  koffi: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@langchain/classic@1.0.56'
  - '@langchain/openai@1.7.1'

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - canvas
  - core-js
  - esbuild
  - koffi
  - msw
  - protobufjs
  - sharp

overrides:
  lodash: 4.18.1
