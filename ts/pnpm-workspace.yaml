packages:
  - packages/*
  - apps/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@antfly/cli-darwin-arm64@0.0.0'
  - '@antfly/cli-linux-arm64@0.0.0'
  - '@antfly/cli-linux-x64@0.0.0'

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - canvas
  - core-js
  - esbuild
  - msw
  - protobufjs
  - sharp

overrides:
  lodash: 4.18.1
