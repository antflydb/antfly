\* Expected-failure config for AntflyDerivedReplay.tla.
\*
\* Enables a mutant where per-hint latest metadata is advanced without the
\* corresponding hint-lane row. The shipped primary-store reader requires the
\* hint lane; replay-all rows alone are not treated as a fallback for hinted
\* replay.
\* Pinned to the specific semantic invariant this mutant must violate.

SPECIFICATION Spec

CONSTANTS
    BuggyEmptyHintAdvance = TRUE
    Indexes = {"dense"}
    MaxSeq = 2

INVARIANTS
    LatestHintMetadataHasHintRows
