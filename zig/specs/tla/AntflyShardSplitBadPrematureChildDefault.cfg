\* Expected-failure shard split config: table manager uses the live
\* SplitReplayCaughtUp signal instead of durable SplitCutoverReady.

CONSTANTS
    k1 = k1
    k2 = k2
    k3 = k3
    Keys       <- MCKeys
    ParentKeys <- MCParentKeys
    ChildKeys  <- MCChildKeys
    BuggyChildDefaultOnReplayCaughtUp = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoDataLoss
    NoDoubleServing
    RollbackRestoresRange
    ByteRangeNarrowsBeforeArchive
    DeltaReplayIntegrity
    DeltaKeysOnlyDuringSplit
    NoPrematureCutover
    FenceRequiresActiveSplit
    ReadAlwaysAvailable
