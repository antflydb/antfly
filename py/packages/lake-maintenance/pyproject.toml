[project]
name = "antfly-lake-maintenance"
version = "0.1.0"
description = "Coordinated Iceberg catalog gateway and maintenance controller"
requires-python = ">=3.11"
dependencies = ["pyiceberg>=0.12,<0.13", "boto3>=1.40,<2", "google-cloud-storage>=3,<4", "pyarrow>=18,<25"]

[project.optional-dependencies]
managed = ["psycopg[binary]>=3.2,<4", "google-cloud-pubsub>=2.30,<3"]

[project.scripts]
antfly-managed-source = "antfly_lake_maintenance.managed_sources_cli:main"
antfly-lake-maintenance = "antfly_lake_maintenance.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16", "pyarrow>=18,<25"]
