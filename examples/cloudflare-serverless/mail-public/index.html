<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antfly Mail</title>
<link rel="stylesheet" href="/mail.css"><script type="module" src="/mail.js"></script>
<body><header><strong>Antfly Mail</strong><span id="identity"></span><button id="logout" hidden>Sign out</button></header>
<main><section id="account"><h1>Your searchable inbox</h1><p>Sign in to read and reply to your messages.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><label id="name-label">Name<input name="name" autocomplete="name"></label><div><button name="action" value="signin">Sign in</button><button name="action" value="signup">Create account</button><button name="action" value="recover" formnovalidate>Reset password</button></div></form></section>
<section id="reset" hidden><h1>Choose a new password</h1><form id="reset-form"><label>New password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><button>Save password</button></form></section>
<section id="mail" hidden><nav><button id="inbox">Inbox</button><button id="outbox">Outbox</button><button id="compose">New message</button><form id="search"><input name="query" type="search" aria-label="Search messages" placeholder="Search your mail" required maxlength="1024"><button>Search</button></form></nav><p id="address"></p><div class="columns"><section aria-label="Messages"><div id="messages"></div><button id="next" hidden>Older messages</button></section><article id="message"><p>Select a message.</p></article></div>
<form id="editor" hidden><h2>Write a message</h2><label>To<input name="to" type="email" required></label><label>Subject<input name="subject" maxlength="998" required></label><label>Message<textarea name="text" rows="10" required maxlength="16384"></textarea></label><button>Send</button><button type="button" id="cancel">Cancel</button></form></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
