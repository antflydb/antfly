[project]
name = "antfly-hackernews-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=18,<25",
  "pyiceberg>=0.12,<0.13",
  "google-cloud-storage>=3,<4",
  "antfly-embedded",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[tool.uv.sources]
antfly-embedded = { path = "../../py/packages/embedded", editable = true }
