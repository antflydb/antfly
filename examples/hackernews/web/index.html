<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hacker News · Antfly</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><main><header><h1>Hacker News search</h1><p>Powered by Antfly</p></header>
<form id="search"><label for="q">Search stories and comments</label><div class="controls"><input id="q" name="q" type="search" required maxlength="256" placeholder="Search Hacker News"><select id="view" aria-label="Data source"><option value="all">All history + current</option><option value="recent">Recent</option><option value="history">Historical archive</option></select><button>Search</button></div></form>
<p id="status" role="status" aria-live="polite"></p><ol id="results"></ol><button id="more" hidden>More results</button></main></body>
</html>
