openapi: 3.0.3
info:
  title: Antfly Schema Types
  version: 1.0.0
  description: |
    Shared schema type definitions used across Antfly.
    This file defines the core schema types that are referenced by other OpenAPI specs.

components:
  schemas:
    AntflyType:
      type: string
      description: Canonical Antfly field type used by compact `x-antfly-types` annotations and runtime capability reporting
      enum:
        - text
        - html
        - keyword
        - numeric
        - boolean
        - datetime
        - geopoint
        - geoshape
        - embedding
        - blob
        - link
        - search_as_you_type
        - substring

    FieldMappingType:
      type: string
      description: |
        Field types accepted by detailed `x-antfly-field` and dynamic-template
        mappings. JSON-schema-oriented aliases are normalized to Antfly's
        corresponding runtime type: number/integer to numeric, bool to boolean,
        date/timestamp to datetime, geo_point to geopoint, and geo_shape to
        geoshape.
      enum:
        - text
        - html
        - keyword
        - numeric
        - number
        - integer
        - boolean
        - bool
        - datetime
        - date
        - timestamp
        - geopoint
        - geo_point
        - geoshape
        - geo_shape
        - embedding
        - blob
        - link
        - search_as_you_type
        - substring

    SQLBuiltinType:
      type: string
      description: |
        Exact PostgreSQL builtin identity for a relational root scalar column.
        SQL array columns use SQLArrayElementType for their element identity.
        Set the JSON Schema property's `x-antfly-sql-type` annotation to one of
        these values. The underlying property type must match. SQL array storage
        is not implied by this annotation. Existing unannotated schemas retain
        their original domains.
        The numeric identity uses an underlying number property and exact
        PostgreSQL NUMERIC semantics, never binary float. Submit finite values
        as JSON numeric lexemes or decimal strings; special values use strings
        NaN, Infinity and -Infinity. Const/enum finite numeric members must be
        JSON numbers, not strings. Bounds and multipleOf are exact decimals.
        Public scalar NUMERIC schemas require reader capability version 22.
        To constrain a NUMERIC scalar or SQL-array column, set the root
        property's `x-antfly-sql-numeric-modifier` annotation to an object with
        precision (1..1000) and signed scale (-1000..1000). The annotation
        requires numeric identity and reader capability version 23. Assignment
        rounds before constraints, indexes and generated dependents; overflow
        rejects the write. Restore verifies stored values without rounding.
      enum: [text, int16, int32, int64, float32, float64, boolean, uuid, jsonb, numeric]

    SQLNumericModifier:
      type: object
      additionalProperties: false
      required: [precision, scale]
      description: PostgreSQL NUMERIC precision and signed scale. For arrays this describes every element, not dimensions. Absent means unconstrained NUMERIC.
      properties:
        precision:
          type: integer
          minimum: 1
          maximum: 1000
        scale:
          type: integer
          minimum: -1000
          maximum: 1000

    SQLArrayElementType:
      type: string
      description: Bound SQL scalar or array-element identity, including numeric widths and exact NUMERIC. Never inferred from JSON value shape.
      enum: [text, int16, int32, int64, float32, float64, boolean, uuid, jsonb, numeric]

    SQLArrayColumnSchema:
      type: object
      additionalProperties: true
      required: [type, x-antfly-sql-type]
      description: |
        JSON Schema property declaration for one typed SQL-array column in a
        relational table. Use it as a root property of DocumentSchema.schema.
        The element identity is mandatory; a JSON Schema `array` remains a JSON
        column and is never inferred to be a SQL array. Column values use the
        lossless SQLArrayValue envelope: dimensions with lower bounds, flat
        row-major values and explicit SQL NULL flags. Integer elements are
        decimal strings, even when small. JSONB null and SQL NULL are distinct.
        Float elements acquire their declared width before validation and
        storage. Outer null represents a SQL NULL array when nullable is true.
        Additional JSON Schema constraints apply to this envelope, not to
        PostgreSQL array subscripts. SQL array index keys and SQL DDL activation
        are not implied by accepting this storage schema.
      properties:
        type:
          type: string
          enum: [sql_array]
        x-antfly-sql-type:
          $ref: "#/components/schemas/SQLArrayElementType"
        x-antfly-sql-numeric-modifier:
          $ref: "#/components/schemas/SQLNumericModifier"
          x-go-type-skip-optional-pointer: false
          description: Accepted only with numeric element identity. Applies assignment coercion to each non-NULL element while preserving dimensions and lower bounds. Requires reader capability version 23.
        nullable:
          type: boolean
          default: false
        description:
          type: string

    DocumentSchema:
      type: object
      description: Defines the structure of a document type
      properties:
        description:
          type: string
          description: A description of the document type.
        schema:
          type: object
          additionalProperties: true
          description: |
            A valid JSON Schema defining the document's structure.
            This is used to infer indexing rules and field types.
          x-antfly-field-mapping-schema:
            $ref: "#/components/schemas/DocumentFieldMapping"
          x-antfly-sql-type-schema:
            $ref: "#/components/schemas/SQLBuiltinType"
          x-antfly-sql-numeric-modifier-schema:
            $ref: "#/components/schemas/SQLNumericModifier"
          x-antfly-sql-array-column-schema:
            $ref: "#/components/schemas/SQLArrayColumnSchema"

    TtlConfig:
      type: object
      additionalProperties: false
      required: [duration]
      description: Automatic document-expiration policy for a table.
      properties:
        duration:
          type: string
          description: |
            Expiration duration using Antfly's integer-component duration format.
            Supported units are `ns`, `us`, `ms`, `s`, `m`, `h`, and `d`;
            examples include `90m`, `1h30m`, and `7d`.
        field:
          type: string
          default: _timestamp
          minLength: 1
          description: Timestamp field used as the expiration reference.

    TableStorageMode:
      type: string
      enum: [document, relational]
      description: |
        Storage representation for the table. Omission selects "document".
        "relational" stores schema-bound typed rows and requires exactly one
        closed document schema with declared properties. It implies
        enforce_types; explicitly setting enforce_types to false is invalid.
        Existing JSON document write and read APIs remain available. This
        setting alone does not declare primary keys or unique constraints.

    RelationalIndexAccessMethod:
      type: string
      enum: [scalar_column, ordered_tuple, algebraic_filter, text_search]
      description: Physical access method of a relational index.

    RelationalIndexLifecycle:
      type: string
      enum: [ready, building, invalid, dropping, catching_up, stale, rebuild_required, failed]
      description: |
        Lifecycle of a relational index generation. Query eligibility additionally
        requires complete coverage and no unapplied mutations; ready alone is
        not an integrity proof.

    RelationalIndexKeyDirection:
      type: string
      enum: [asc, desc]
      description: Direction of one ordered index key component. Omission selects asc.

    RelationalIndexKeyNulls:
      type: string
      enum: [default, first, last]
      description: |
        Null placement for one ordered index key component. The default is
        last for ascending keys and first for descending keys. Omission selects default.

    RelationalIndexKey:
      type: object
      additionalProperties: false
      description: |
        Ordered component of a relational ordered-tuple index key. Supply
        either a declared column or a deterministic typed scalar expression
        with its result_type. Composite keys may mix both forms. Bounds use
        the expression result type, not its input columns.
      properties:
        column:
          type: string
          minLength: 1
          description: Declared relational column used by this key component.
        expression:
          $ref: "#/components/schemas/RelationalScalarExpression"
        result_type:
          $ref: "#/components/schemas/RelationalExpressionType"
        collation:
          type: string
          minLength: 1
          description: |
            String-key collation. Omission selects binary ordering. Supported
            binary aliases are C, POSIX, and binary. The aliases ci,
            case_insensitive, and antfly.case_insensitive select ASCII-only
            case folding, not locale-aware or Unicode case folding.
        direction:
          $ref: "#/components/schemas/RelationalIndexKeyDirection"
        nulls:
          $ref: "#/components/schemas/RelationalIndexKeyNulls"

    RelationalIndexOwnerKind:
      type: string
      enum: [relational_column, unique_constraint, table]
      description: Logical schema object that owns a relational index.

    ForeignKeyAction:
      type: string
      enum: [restrict, set_null, cascade, no_action]
      description: Action on referencing rows when a referenced row is changed or removed.

    ForeignKeyTiming:
      type: string
      enum: [immediate, deferred]
      description: |
        Enforcement timing for atomic mutations and transaction sessions. Deferred
        requires deferrable=true and validates the final transaction state.
        NO ACTION permits a valid final-state parent replacement; RESTRICT
        still rejects referenced parent removal. Existing multi-request
        transaction sessions retain deferred checks until commit; immediate
        checks apply to each staged statement. SET CONSTRAINTS is not provided.

    ForeignKeyMatch:
      type: string
      enum: [simple, full, partial]
      description: |
        Null matching semantics of a composite foreign key. Partial requires
        at least one parent matching every non-null child component; all-null
        children are exempt. Compatible parent witnesses are guarded through
        commit, including concurrent deletion of alternative witnesses.

    RelationalConstraintValidationState:
      type: string
      enum: [enforced, unvalidated, validating, invalid]
      description: Validation state of an existing-row constraint.

    RelationalComparisonOp:
      type: string
      enum: [is_null, is_not_null, eq, ne, gt, gte, lt, lte, is_distinct, is_not_distinct]

    RelationalCheckConstraint:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        A typed CHECK. Supply either expression or column and op (with optional
        value and collation), never both forms. Expressions must return boolean
        and use the shared bounded immutable scalar expression vocabulary.
        New writes are checked from schema publication;
        existing rows are validated separately. SQL UNKNOWN satisfies CHECK.
        Comparison values must match the column type. Integer values may also
        use exact decimal strings to avoid client-side floating-point rounding.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        column:
          type: string
          minLength: 1
        op:
          $ref: "#/components/schemas/RelationalComparisonOp"
        value:
          description: Scalar comparison operand. Omission represents NULL. Null tests require a NULL operand.
        collation:
          type: string
          description: String comparison collation; uses the same rules as ordered indexes.
        expression:
          $ref: "#/components/schemas/RelationalScalarExpression"

    RelationalUniqueConstraintOrigin:
      type: string
      enum: [constraint, index]
      default: constraint
      description: Durable ownership kind. Index-owned uniqueness participates in ON CONFLICT inference but is not a named SQL constraint. Human-readable index descriptions never determine ownership.

    RelationalUniqueConstraint:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        A named, ordered composite unique key. Validation status is maintained
        by the server. TTL expiry uses the distributed integrity coordinator.
        Referenced unique keys are nondeferrable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        origin:
          $ref: '#/components/schemas/RelationalUniqueConstraintOrigin'
        primary:
          type: boolean
          description: SQL primary-key identity. At most one per relational table; all key columns must be required and nonnullable.
        columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
        keys:
          type: array
          minItems: 1
          maxItems: 32
          description: Typed native unique keys. Specify either columns or keys.
          items:
            $ref: '#/components/schemas/RelationalIndexKey'
        where:
          type: array
          maxItems: 256
          description: Conjunction restricting uniqueness to matching rows.
          items:
            $ref: '#/components/schemas/RelationalIndexPredicate'
        nulls_not_distinct:
          type: boolean
          description: When true, NULL components compare equal for uniqueness.
        deferrable:
          type: boolean
          description: Permit uniqueness checks at transaction commit. Never eligible as an ON CONFLICT arbiter or a referenced foreign key target.
        timing:
          $ref: "#/components/schemas/ForeignKeyTiming"

    RelationalForeignKeyConstraint:
      type: object
      additionalProperties: false
      required: [name, child_columns, parent_table, parent_columns]
      description: |
        Composite foreign key. Child and parent columns correspond by position
        and must have the same physical comparison types. The parent columns
        must identify a unique key. Existing-row validation is independent of
        new-write enforcement and is never client-writable.
        Enforcement and referential actions share the bounded distributed
        transaction path, including TTL expiry. Partial matching uses ordered
        support indexes on the parent; activation waits until these are ready.
        SET NULL requires every child column to accept explicit NULL.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        child_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
        parent_table:
          type: string
          minLength: 1
          description: |
            Literal parent table name in the child table's database and namespace.
            Resolved to an immutable table identity when the constraint is declared;
            renaming a parent preserves the reference. Public schemas show its current name.
        parent_columns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
        on_delete:
          $ref: "#/components/schemas/ForeignKeyAction"
        on_update:
          $ref: "#/components/schemas/ForeignKeyAction"
        timing:
          $ref: "#/components/schemas/ForeignKeyTiming"
        match:
          $ref: "#/components/schemas/ForeignKeyMatch"
        deferrable:
          type: boolean

    RelationalIndexPredicate:
      type: object
      additionalProperties: false
      required: [column, op]
      description: A typed partial-index conjunct. Only TRUE is indexed; FALSE and SQL UNKNOWN are excluded.
      properties:
        column:
          type: string
          minLength: 1
        op:
          $ref: "#/components/schemas/RelationalComparisonOp"
        value:
          description: Typed scalar operand; integer columns also accept exact decimal strings. Omission means NULL.
        collation:
          type: string
          description: String comparison collation with the same semantics as ordered keys.

    RelationalIndexDefinition:
      type: object
      additionalProperties: false
      required: [name, keys]
      description: |
        Declarative table-owned ordered index. Keys are compared lexicographically
        in the declared order, with independent direction, null placement, and
        string collation. Creation builds existing rows asynchronously; queries
        must wait for range-local coverage. Unique constraints and expression
        keys are not implied by this object. Optional WHERE conjuncts select
        only matching rows. INCLUDE columns
        store typed values alongside keys for index-only projected reads.
      properties:
        description:
          type: string
          description: Optional human-readable description, also exposed by the shared indexes API.
        name:
          type: string
          minLength: 1
          maxLength: 256
        keys:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/RelationalIndexKey"

        include_columns:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Non-key columns stored in the index; must be distinct from key columns.
          items:
            type: string
            minLength: 1

        where:
          type: array
          maxItems: 256
          description: Conjunction of typed predicates. Indexed queries must explicitly contain every conjunct with equivalent typed comparison semantics.
          items:
            $ref: "#/components/schemas/RelationalIndexPredicate"

    RelationalExpressionOp:
      type: string
      enum: [literal, column, add, subtract, multiply, divide, negate, concat, coalesce, lower_ascii, upper_ascii, eq, ne, gt, gte, lt, lte, is_null, is_not_null, is_distinct, is_not_distinct, and, or, not, cast, case_when, modulo, in_list, not_in_list, array]

    RelationalExpressionType:
      type: string
      enum: [string, blob, boolean, datetime, integer, number, numeric, sql_array]

    RelationalScalarExpression:
      type: object
      additionalProperties: false
      required: [op]
      description: |
        Immutable typed scalar expression, limited to 128 nodes and 16 levels.
        A literal requires type; omitted value means typed null. A column
        requires column; other
        operations require args. Unknown or irrelevant fields are rejected.
        Arithmetic operands have the same integer or number type. Integer
        division truncates toward zero. Overflow and division by zero reject
        the write. Arithmetic and string operations propagate null. ASCII case
        operations leave non-ASCII bytes unchanged. No volatile functions are
        accepted. Allocated results are bounded to 1 MiB each. Allocations
        and byte-comparison operand work share a 4 MiB evaluation budget per
        row and expression set. An integer literal may use a decimal string
        for exact int64 transport; blob uses base64 and datetime uses the
        normal relational datetime representation.
        Comparisons require operands of the same type and return boolean or
        SQL UNKNOWN (null); is_distinct and is_not_distinct always return a
        boolean. Unary is_null and is_not_null test presence/null. AND and OR
        evaluate left to right with SQL three-valued short-circuit semantics;
        NOT preserves UNKNOWN. CHECK accepts TRUE and UNKNOWN, rejecting FALSE.
        Numeric literals and arithmetic operations may specify sql_type to
        retain PostgreSQL builtin overflow and float4 rounding semantics.
        Without it, integer and number operations retain int64 and float64
        semantics. Numeric cast requires type and sql_type, takes one numeric
        argument, and performs a checked conversion when evaluated (not when
        the schema is compiled). Floating-to-integer casts round ties to even.
        The numeric expression type uses exact PostgreSQL NUMERIC values and
        may specify sql_type numeric. Its literals accept decimal strings or
        exact JSON numeric lexemes, including string-valued special values.
        Exact NUMERIC programs require reader capability version 21 even when
        their result is boolean or integer. Float/integer assignment casts keep
        their declared PostgreSQL rounding and overflow semantics.
        A cast to numeric may specify numeric_modifier for PostgreSQL precision
        and signed-scale coercion. Overflow is checked when the selected cast
        executes; unselected lazy branches do not fail. Modifier-bearing programs
        require reader capability version 23 even with integer/boolean output.
        The sql_array expression type requires sql_type on literals, including
        typed NULL, to declare the element builtin. Non-null literals use the
        ordinal SQL array envelope (dimensions with length/lower_bound, values,
        and sql_nulls), retaining shape and lower bounds. Array columns derive
        their exact element identity from the immutable schema. Comparisons,
        IN, COALESCE and CASE require matching array element identities; no
        element type is inferred from values. Array-dependent programs require
        reader capability version 24 even with scalar output. Assignment to a
        NUMERIC array column applies its precision/signed-scale modifier to
        each element. Array casts require type sql_array and an explicit matching
        sql_type; identity casts borrow the immutable input. Casts of numeric
        arrays may additionally specify numeric_modifier, coercing each non-NULL
        element with PostgreSQL precision and signed-scale semantics while
        preserving dimensions, lower bounds and NULL slots. Coercion is lazy
        and shares invocation admission with the surrounding expression.
        Array-valued ordered index keys and element-changing array casts are
        not supported by this expression contract.
        The array constructor requires sql_type and zero to 32 arguments.
        Constructor programs additionally require reader capability version 25,
        including constructors hidden inside scalar/boolean expressions.
        Scalar arguments must have the declared element domain, with explicit
        width-preserving numeric casts where needed. SQL NULL arguments become
        NULL elements. Array arguments must all have matching element types,
        dimensions and lower bounds; one leading dimension with lower bound 1
        is added. All empty/NULL subarrays produce an empty array; mixing an
        empty/NULL subarray with a nonempty one is a dimension mismatch. Child
        expressions execute once, with shared work/cancellation and byte limits.
        case_when takes alternating boolean conditions and result expressions,
        followed by a mandatory fallback result (3 to 31 arguments, at most
        15 branches). Conditions are evaluated in order; only the selected
        result is evaluated, and a NULL condition is not TRUE. All result
        expressions must have the same physical type. Numeric SQL lowering
        records builtin result-domain promotions as explicit casts. This
        operation requires schema capability version 18.
        modulo takes two same-domain integer or NUMERIC operands and returns the signed
        remainder (minInt modulo -1 is zero); a zero divisor rejects the write.
        in_list and not_in_list take one probe followed by 1 to 31 same-domain
        candidates. The probe is evaluated once; NULL probes return UNKNOWN.
        A matching candidate wins over NULL candidates; otherwise a NULL
        candidate makes the result UNKNOWN. These operations require schema
        capability version 19.
      properties:
        op:
          $ref: "#/components/schemas/RelationalExpressionOp"
        type:
          $ref: "#/components/schemas/RelationalExpressionType"
        sql_type:
          $ref: "#/components/schemas/SQLBuiltinType"
          description: Numeric builtin result identity on numeric literals, arithmetic, negate, and cast (capability version 18), or required array element identity on sql_array literals including typed NULL (capability version 24).
        numeric_modifier:
          $ref: "#/components/schemas/SQLNumericModifier"
          description: Optional precision/signed-scale coercion; accepted only on cast with type numeric and sql_type numeric. Requires reader capability version 23.
        value:
          nullable: true
          description: Typed literal value, including null.
        column:
          type: string
          minLength: 1
        collation:
          type: string
          description: Optional binary or ASCII case-insensitive collation for binary string comparison operations only; aliases match ordered indexes.
        args:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/RelationalScalarExpression"

    RelationalColumnExpression:
      type: object
      additionalProperties: false
      required: [column, expression]
      properties:
        column:
          type: string
          minLength: 1
        expression:
          $ref: "#/components/schemas/RelationalScalarExpression"

    ExternalLakeTableSource:
      type: object
      additionalProperties: false
      description: Authoritative Parquet or Iceberg source. A serving statement pins its inventory and object versions before returning rows. Iceberg catalog commits require an explicit writable catalog binding; ordinary row mutations remain unsupported.
      required: [kind, table_id, format, uri]
      properties:
        kind:
          type: string
          enum: [external]
        table_id:
          type: string
          minLength: 1
        format:
          type: string
          enum: [parquet, iceberg]
        uri:
          type: string
          minLength: 1
        schema_fingerprint:
          type: string
          default: auto
          minLength: 1
        write_policy:
          type: string
          enum: [read_only, iceberg_writer]
          default: read_only
          description: iceberg_writer authorizes explicit Iceberg catalog commits and requires catalog plus a current snapshot selector. It does not enable ordinary row batch writes.
        object_mutability:
          type: string
          enum: [mutable, immutable]
          default: mutable
          description: Set immutable only when data files are never replaced at an existing URI. Allows authenticated provider-version proofs from retained index generations to be reused for unchanged data files. Metadata and delete files are still verified.
        credentials:
          $ref: "#/components/schemas/ExternalLakeCredentialRef"
        snapshot:
          $ref: "#/components/schemas/ExternalLakeSnapshotSelector"
        catalog:
          $ref: "#/components/schemas/LakeCatalogConfig"

    LakeCatalogConfig:
      type: object
      additionalProperties: false
      required: [type]
      description: Catalog authority is independent of S3/GCS storage and deployment. managed uses a conditional durable head under the table root. rest uses a named HTTP connection; raw secrets are forbidden. Omit to retain explicit metadata URI/version-hint discovery.
      properties:
        type:
          type: string
          enum: [managed, rest]
        connection:
          type: string
          description: Required for rest. Named external_io/http connection with lake_catalog_read and, for commits, lake_catalog_write capabilities.
        uri:
          type: string
          description: Required for rest; catalog base URI whose origin must be allowed by the named connection.
        namespace:
          type: array
          maxItems: 32
          items:
            type: string
          description: Required nonempty namespace components for rest.
        name:
          type: string
          description: Required table name for rest, distinct from Antfly's logical table name.
        warehouse:
          type: string
          description: Optional REST config warehouse selector. Other fields must be omitted for managed.

    ExternalLakeCredentialRef:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref:
          type: string
          minLength: 1
          description: Name of a configured external_io connection with lake_read capability.
        scope:
          type: string
          description: Allowed object prefix relative to the configured bucket or filesystem root.

    ExternalLakeSnapshotSelector:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [current, snapshot_id, object_version_digest]
        id:
          type: string
          minLength: 1
          description: Required for snapshot_id; selects an Iceberg snapshot.
        digest:
          type: string
          minLength: 1
          description: Required for object_version_digest; pins a Parquet object inventory.

    TableSchema:
      type: object
      description: Schema definition for a table with multiple document types
      properties:
        version:
          type: integer
          format: uint32
          readOnly: true
          description: Backend-managed schema generation used for migrations. Omit it from create and update requests.
        storage_mode:
          $ref: "#/components/schemas/TableStorageMode"
        base_source:
          $ref: "#/components/schemas/ExternalLakeTableSource"
          description: External tables require relational storage mode. Ordinary row writes are read-only; an explicit iceberg_writer catalog binding permits Iceberg file commits. Omit for native tables.
        column_defaults:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/RelationalColumnExpression"
          description: |
            Immutable typed expressions applied only to absent columns on new
            writes, never explicit null. Defaults cannot reference columns.
            A column cannot have both a default and a generated expression.
            Omission or [] declares none. Relational tables only.
        generated_columns:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/RelationalColumnExpression"
          description: |
            Stored immutable generated columns, evaluated in dependency order
            on writes before validation and indexing. Cycles are rejected.
            Generated columns are output-only; submitted values are replaced
            by the computed value. Omission or [] declares none. Defaults
            and generated declarations together are limited to 256 columns,
            4096 expression nodes, and 4 MiB of literal data. Evaluation has
            a shared 4 MiB allocation budget across all column expressions.
            Restore verifies stored results instead of silently recomputing
            them. Changing, adding, or removing generated semantics through
            an existing table's schema update requires explicit rewrite=true
            on the PUT or PATCH schema route. This returns a durable restore
            job and replaces the complete authorized dependency cohort only
            after distributed transformation and validation. Ordinary schema
            updates reject these changes, even when a table appears empty.
            Declaration reordering and default-only changes remain allowed.
            Relational tables only.
        checks:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/RelationalCheckConstraint"
          description: |
            Named scalar CHECK constraints for a relational schema. This is
            part of the complete schema: omission or [] declares no checks.
            New writes enforce every check. Existing-row validation status is
            maintained separately and is never accepted from the client.
        unique_constraints:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/RelationalUniqueConstraint"
          description: Complete set of composite unique declarations. Omission or [] declares none.
        foreign_keys:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/RelationalForeignKeyConstraint"
          description: Complete set of outgoing composite foreign keys. Omission or [] declares none.
        relational_indexes:
          type: array
          x-go-type-skip-optional-pointer: false
          maxItems: 4096
          items:
            $ref: "#/components/schemas/RelationalIndexDefinition"
          description: |
            Desired ordered indexes for a relational table. Names must be unique.
            An explicit array replaces the declarations; an empty array drops
            them. Omission preserves existing declarations during schema updates.
            Index definitions commit atomically with the schema; build progress
            and readiness are local to each owning shard, not client-writable.
        default_type:
          type: string
          description: Default type to use from the document_types.
        enforce_types:
          type: boolean
          description: |
            Whether to enforce that documents must match one of the provided document types.
            If false, documents not matching any type will be accepted but not indexed.
        document_schemas:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DocumentSchema"
          description: A map of type names to their document json schemas.
        ttl:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TtlConfig"
          description: |
            Automatic document expiration. Set this object to enable TTL and
            set it to null to disable an existing TTL policy.
        ttl_field:
          type: string
          deprecated: true
          description: |
            Deprecated compatibility alias for `ttl.field`. Cannot be combined with `ttl`.
        ttl_duration:
          type: string
          deprecated: true
          description: |
            Deprecated compatibility alias for `ttl.duration`. Cannot be combined with `ttl`.
        dynamic_templates:
          type: array
          items:
            $ref: "#/components/schemas/DynamicTemplate"
          description: |
            Rules for mapping dynamically detected fields. When a document contains fields
            that don't have explicit mappings and dynamic mapping is enabled, templates are
            evaluated in order to determine how those fields should be indexed.

    DynamicTemplate:
      type: object
      additionalProperties: false
      description: |
        A rule for mapping dynamically detected fields. Templates are checked in order
        and the first matching template's mapping is used.
      properties:
        name:
          type: string
          description: Optional identifier for the template (useful for debugging)
        match:
          type: string
          description: |
            Glob pattern for field name (last path element).
            Supports * and ** wildcards. Example: "*_text" matches "title_text", "body_text"
        unmatch:
          type: string
          description: |
            Exclusion pattern for field name. If it matches, the template is skipped.
            Example: "skip_*" would exclude fields like "skip_this"
        path_match:
          type: string
          description: |
            Glob pattern for the full dotted path. Supports ** for matching multiple segments.
            Example: "metadata.**" matches "metadata.author", "metadata.tags.primary"
        path_unmatch:
          type: string
          description: Path exclusion pattern. If it matches the full path, the template is skipped.
        match_mapping_type:
          type: string
          enum: [string, number, boolean, date, object]
          description: Filter by detected JSON type
        mapping:
          $ref: "#/components/schemas/TemplateFieldMapping"

    TemplateFieldMapping:
      type: object
      additionalProperties: false
      description: >-
        Field mapping used by a dynamic template. Dynamic templates match one
        physical field at a time and therefore do not accept multifields; use a
        DocumentFieldMapping in a document property's `x-antfly-field`
        annotation when named subfields are required.
      properties:
        type:
          $ref: "#/components/schemas/FieldMappingType"
        analyzer:
          type: string
          description: |
            Analyzer name (e.g., "standard", "keyword", "en", "html_analyzer").
            Used for text fields to control tokenization and normalization.
        index:
          type: boolean
          x-go-type-skip-optional-pointer: false
          description: Whether to index the field. Omit to use the server default of true.
        store:
          type: boolean
          default: false
          description: Whether to store the field value (default false)
        include_in_all:
          type: boolean
          default: false
          description: Whether to include in the _all field for cross-field search
        sortable:
          type: boolean
          default: false
          description: |
            Whether this exact scalar field can be used in order_by. Supported
            sortable mapping types are keyword, numeric/number/integer,
            boolean/bool, datetime/date/timestamp, and link. Analyzed text,
            search_as_you_type, geo, embedding, blob, html, object, and array
            fields are not directly sortable; use an exact scalar subfield such
            as title.keyword for sorted string pagination. When true, Antfly
            derives the internal typed doc-value structures required for exact
            sorting; users should not configure doc_values directly.
        missing_null_policy:
          type: string
          enum: [missing_rejected]
          default: missing_rejected
          description: |
            Missing/null sort policy for this mapped field. The current production
            policy rejects missing or null native sort values so sorted cursors
            remain replayable JSON scalar tuples.

    DocumentSubfieldMapping:
      type: object
      additionalProperties: false
      description: >-
        Mapping for one named multifield emitted from its parent document
        property. Multifields are intentionally one level deep and read the
        parent property's JSON value rather than a nested JSON property.
      properties:
        type:
          $ref: "#/components/schemas/FieldMappingType"
        analyzer:
          type: string
          description: Analyzer name for text-oriented mappings.
        index:
          type: boolean
          x-go-type-skip-optional-pointer: false
          description: Whether to index the field. Omit to use the server default of true.
        store:
          type: boolean
          default: false
          description: Whether to store the field value (default false)
        include_in_all:
          type: boolean
          default: false
          description: Whether to include in the _all field for cross-field search
        sortable:
          type: boolean
          default: false
          description: >-
            Whether this exact scalar subfield can be used in order_by. Antfly
            derives the required typed doc values when enabled.
        missing_null_policy:
          type: string
          enum: [missing_rejected]
          default: missing_rejected
          description: >-
            Missing/null sort policy. The current production policy rejects
            missing or null native sort values.

    DocumentFieldMapping:
      type: object
      additionalProperties: false
      description: >-
        Executable physical mapping used by a document property's
        `x-antfly-field` annotation. The mapping must accept the JSON Schema
        value type. Declarations for the same dotted path across document types
        must normalize to an identical physical mapping, and present values
        that cannot be encoded are rejected at write admission. Mappings
        contributed by `anyOf` or `oneOf` must normalize to the same mapping in
        every alternative; conditional and dynamically named mappings are
        rejected.
      properties:
        type:
          $ref: "#/components/schemas/FieldMappingType"
        analyzer:
          type: string
          description: Analyzer name for text-oriented mappings.
        index:
          type: boolean
          x-go-type-skip-optional-pointer: false
          description: Whether to index the field. Omit to use the server default of true.
        store:
          type: boolean
          default: false
          description: Whether to store the field value (default false)
        include_in_all:
          type: boolean
          default: false
          description: Whether to include in the _all field for cross-field search
        sortable:
          type: boolean
          default: false
          description: |
            Whether this exact scalar field can be used in order_by. Supported
            sortable mapping types are keyword, numeric/number/integer,
            boolean/bool, datetime/date/timestamp, and link. Analyzed text,
            search_as_you_type, geo, embedding, blob, html, object, and array
            fields are not directly sortable; use an exact scalar subfield such
            as title.keyword for sorted string pagination. Antfly derives the
            required typed doc values when enabled.
        missing_null_policy:
          type: string
          enum: [missing_rejected]
          default: missing_rejected
          description: >-
            Missing/null sort policy. The current production policy rejects
            missing or null native sort values.
        fields:
          type: object
          description: >-
            Named one-level multifields emitted from this property's value. For
            example, a text title can expose a sortable keyword subfield.
          additionalProperties:
            $ref: "#/components/schemas/DocumentSubfieldMapping"
