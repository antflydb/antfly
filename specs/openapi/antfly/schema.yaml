openapi: 3.0.3
info:
  title: Antfly Schema Types
  version: 1.0.0
  description: |
    Shared schema type definitions used across Antfly.
    This file defines the core schema types that are referenced by other OpenAPI specs.

components:
  schemas:
    AntflyType:
      type: string
      description: Field type annotations for schema fields
      enum:
        - text
        - html
        - keyword
        - numeric
        - boolean
        - datetime
        - geopoint
        - geoshape
        - embedding
        - blob
        - link
        - search_as_you_type
        - json

    DocumentSchema:
      type: object
      description: Defines the structure of a document type
      properties:
        description:
          type: string
          description: A description of the document type.
        schema:
          type: object
          additionalProperties: true
          description: |
            A valid JSON Schema defining the document's structure.
            This is used to infer indexing rules and field types.
            Relational-mode scalar properties may include optional
            `collation` metadata. The metadata is preserved in the
            durable relational column catalog and reported on result
            schemas for source-backed text/keyword fields.

    TableSchema:
      type: object
      description: Schema definition for a table with multiple document types
      properties:
        version:
          type: integer
          format: uint32
          description: Version of the schema. Used for migrations.
        storage_mode:
          type: string
          enum: [document, relational]
          description: |
            Storage profile for the table.
            - "document" (default): schemaless JSON documents with optional,
              soft schema validation. All indexes are derived from the document.
            - "relational": required closed schema with typed columns. Documents
              must match a declared type; declared scalar properties are stored
              as typed columns for columnar predicate pushdown and aggregation.
              A field typed "json" stores a subtree that is still indexed like a
              document. Implies enforce_types and closed document types.
        default_type:
          type: string
          description: Default type to use from the document_types.
        enforce_types:
          type: boolean
          description: |
            Whether to enforce that documents must match one of the provided document types.
            If false, documents not matching any type will be accepted but not indexed.
        document_schemas:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DocumentSchema"
          description: A map of type names to their document json schemas.
        ttl_field:
          type: string
          description: |
            The field containing the timestamp for TTL expiration (optional).
            Defaults to "_timestamp" if ttl_duration is specified but ttl_field is not.
        ttl_duration:
          type: string
          description: |
            The duration after which documents should expire, based on the ttl_field timestamp (optional).
            Uses Go duration format (e.g., '24h', '7d', '168h').
        dynamic_templates:
          type: array
          items:
            $ref: "#/components/schemas/DynamicTemplate"
          description: |
            Rules for mapping dynamically detected fields. When a document contains fields
            that don't have explicit mappings and dynamic mapping is enabled, templates are
            evaluated in order to determine how those fields should be indexed.
        foreign_keys:
          type: array
          items:
            $ref: "#/components/schemas/ForeignKey"
          description: |
            Relational-mode referential constraints. Supported targets are a
            parent table's `_id` document key or a same-table declared unique
            parent column tuple with `on_delete: "restrict"` /
            `on_delete: "no_action"` or bounded local nullable-column
            `on_delete: "set_null"`, plus bounded local `on_delete: "cascade"`.
            `on_update: "restrict"` and `on_update: "no_action"` are accepted
            as parent-key update checks, and mutating `set_null`/`cascade`
            update actions are supported where owner topology is configured.
            Temporal foreign keys with `period` on both child and parent
            references accept restrictive actions plus bounded delete-side
            `set_null` / `cascade` actions through remaining-coverage proofs.
            Mutating temporal update actions are rejected because changing a
            parent interval/key requires update-side period action semantics
            broader than a scalar child-row rewrite.
            `match: "simple"` is the default; `full` is accepted for composite
            nullable references, and `partial` is rejected until row-subset
            parent matching is implemented.
            Cross-table unique targets require routed parent-table unique participants.
            Unsupported shapes are rejected during schema validation.
        periods:
          type: array
          items:
            $ref: "#/components/schemas/RelationalPeriod"
          description: |
            Application-time period declarations over two numeric or datetime
            relational columns. SQL `PERIOD FOR name (start, end)` and range
            column temporal DDL lower into this metadata.
        primary_key:
          $ref: "#/components/schemas/PrimaryKey"
          description: |
            Relational-mode primary key over one or more ordered declared
            non-json relational columns. Every component must be required and
            present on every row. When omitted, `_id` remains the document-key
            primary identity. `_id` cannot be mixed into a declared composite
            primary-key tuple.
        unique_constraints:
          type: array
          items:
            $ref: "#/components/schemas/UniqueConstraint"
          description: |
            Relational-mode unique constraints over one or more ordered declared
            non-json relational columns. Present scalar tuples are enforced by
            committed integrity rows; rows with any absent nullable component do
            not create unique rows.
        relational_indexes:
          type: array
          items:
            $ref: "#/components/schemas/RelationalIndex"
          description: |
            Durable relational secondary-index catalog entries. This is the
            public schema shape for relational scalar-column, ordered-tuple,
            algebraic-filter, and text-search index metadata; lifecycle,
            generation, and schema_fingerprint identify the physical index
            generation that may be promoted to ready.

    ForeignKeyReference:
      type: object
      additionalProperties: false
      description: Parent side of a relational foreign-key constraint.
      properties:
        table:
          type: string
          description: Referenced relational table name.
        columns:
          type: array
          items:
            type: string
          description: Referenced parent columns. Use ["_id"] for the document-key primary key, or an ordered column tuple backed by a declared unique constraint.
        period:
          type: string
          description: Parent application-time period name for temporal `REFERENCES (..., PERIOD period)` constraints.

    PrimaryKey:
      type: object
      additionalProperties: false
      description: Relational primary-key constraint.
      properties:
        name:
          type: string
          description: Optional durable primary-key constraint name used by DDL and conflict-target resolution.
        columns:
          type: array
          items:
            type: string
          description: Primary-key columns. One or more ordered required non-json relational columns are supported.
        without_overlaps_period:
          type: string
          description: Application-time period name for primary-key `WITHOUT OVERLAPS` temporal uniqueness.

    RelationalPeriod:
      type: object
      additionalProperties: false
      description: Application-time period over a start and end column.
      properties:
        name:
          type: string
          description: Period name used by temporal constraints and `FOR PORTION OF` mutation-source plans.
        start_column:
          type: string
          description: Inclusive period start column.
        end_column:
          type: string
          description: Exclusive period end column.
        range_type:
          type: string
          enum: [numrange, daterange, tsrange, tstzrange]
          description: Optional PostgreSQL range type that produced this period when lowering range-column temporal DDL.
      required:
        - name
        - start_column
        - end_column

    RowsUniquePredicate:
      type: object
      additionalProperties: false
      description: Predicate atom that must match a partial unique constraint definition.
      properties:
        field:
          type: string
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - eq
            - ne
        value:
          description: Predicate comparison value. Omit for null-test operators.
      required:
        - field
        - op

    RowsUniquePredicateGroup:
      type: object
      additionalProperties: false
      description: Conjunction of partial-unique predicate atoms.
      properties:
        all:
          type: array
          items:
            $ref: "#/components/schemas/RowsUniquePredicate"
      required:
        - all

    RowsExpression:
      description: |
        Shared typed row-expression AST. A node is exactly one of `{ "field": "name" }`,
        `{ "value": ... }`, or an operator node such as
        `{ "op": "lower", "args": [{ "field": "email" }] }`. Supported
        operators are the shared row-local expression surface used by schema
        predicates, mutation expressions, query projections, filters, grouping,
        ordering, and SQL lowering.
      oneOf:
        - $ref: "#/components/schemas/RowsExpressionField"
        - $ref: "#/components/schemas/RowsExpressionValue"
        - $ref: "#/components/schemas/RowsExpressionOperator"

    RowsExpressionField:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
          minLength: 1
        source:
          type: string
          enum:
            - row
            - existing
            - proposed
            - source

    RowsExpressionValue:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          description: Literal JSON value for a value node.

    RowsExpressionOperator:
      type: object
      additionalProperties: false
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - now
            - coalesce
            - lower
            - upper
            - initcap
            - trim
            - btrim
            - ltrim
            - rtrim
            - replace
            - translate
            - substring
            - substr
            - overlay
            - split_part
            - strpos
            - left
            - right
            - lpad
            - rpad
            - repeat
            - reverse
            - starts_with
            - ends_with
            - ascii
            - chr
            - md5
            - like
            - ilike
            - bool_and
            - and
            - bool_or
            - or
            - bool_not
            - not
            - concat
            - concat_ws
            - length
            - char_length
            - character_length
            - octet_length
            - nullif
            - greatest
            - least
            - abs
            - round
            - trunc
            - floor
            - ceil
            - sqrt
            - sign
            - power
            - add
            - sub
            - mul
            - div
            - mod
            - interval_ns
            - interval_months
            - date_trunc
            - date_bin
            - date_part
            - extract
            - cast
            - json_extract
            - json_extract_path
            - json_extract_path_text
            - jsonb_extract_path
            - jsonb_extract_path_text
            - json_typeof
            - jsonb_typeof
            - json_array_length
            - jsonb_array_length
            - array_length
            - cardinality
            - array_position
            - array_positions
            - array_append
            - array_prepend
            - array_cat
            - array_remove
            - array_replace
            - array_to_string
            - string_to_array
            - uuid_v4
            - gen_random_uuid
            - uuid_generate_v4
            - json_build_object
            - jsonb_build_object
            - to_jsonb
            - json_path_exists
            - regexp_replace
            - case
        args:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpression"
          description: Operand expressions for operator nodes.
        to:
          type: string
          enum:
            - text
            - numeric
            - bool
            - boolean
            - datetime
          description: Cast target for `cast`.
        path:
          description: Structured JSON path for `json_extract` and `json_path_exists`.
        as_text:
          type: boolean
          description: Return JSON path extraction as text.
        cases:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCaseBranch"
          description: Searched case branches, each with `when` and `then`.
        else:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: "#/components/schemas/RowsExpression"
          description: Fallback expression for searched `case`.

    RowsExpressionCaseBranch:
      type: object
      additionalProperties: false
      properties:
        when:
          $ref: "#/components/schemas/RowsExpressionCondition"
        then:
          $ref: "#/components/schemas/RowsExpression"
      required:
        - when
        - then

    RowsExpressionCondition:
      type: object
      additionalProperties: false
      description: Computed expression predicate over the shared row-expression AST.
      properties:
        lhs:
          $ref: "#/components/schemas/RowsExpression"
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - is_distinct
            - is_not_distinct
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
        rhs:
          $ref: "#/components/schemas/RowsExpression"
      required:
        - lhs
        - op

    ForeignKey:
      type: object
      additionalProperties: false
      description: Relational foreign-key constraint.
      properties:
        name:
          type: string
          description: Constraint name, unique within the table schema.
        columns:
          type: array
          items:
            type: string
          description: Child columns. A single scalar column is supported for ["_id"] references; ordered scalar tuples are supported when references.columns names a unique constraint column tuple.
        period:
          type: string
          description: Child application-time period name for temporal `FOREIGN KEY (..., PERIOD period)` constraints.
        references:
          $ref: "#/components/schemas/ForeignKeyReference"
        on_delete:
          type: string
          enum: [restrict, no_action, set_null, cascade]
          description: Delete action. "no_action" is normalized to immediate restrictive behavior; "set_null" requires nullable child columns; "set_null" and "cascade" are bounded in local execution.
        on_update:
          type: string
          enum: [restrict, no_action, set_null, cascade]
          description: Update action. "restrict" and "no_action" are enforced as parent-key update checks; "set_null" and "cascade" are supported for bounded local/scheduled mutating FK action execution where owner topology is configured.
        timing:
          type: string
          description: Constraint timing. Canonical values are "immediate" and "deferred"; SQL-shaped aliases such as "INITIALLY DEFERRED" and combined deferrability clauses are accepted and normalized by schema parsing.
        deferrable:
          oneOf:
            - type: boolean
            - type: string
          description: Whether transaction-level timing overrides may change this constraint's effective timing. Accepts JSON booleans and SQL-shaped strings such as "DEFERRABLE", "NOT DEFERRABLE", and "DEFERRABLE INITIALLY DEFERRED". Omitted defaults to false unless timing is "deferred" for compatibility.
        match:
          type: string
          enum: [simple, full]
          description: Match mode. "simple" is the default and means any null or absent child component creates no reference. "full" requires all child components to be present or all absent. MATCH PARTIAL is reserved until row-subset parent matching is implemented.
        validation_state:
          type: string
          enum: [enforced, unvalidated]
          description: Constraint validation state. Public schema validation accepts enforced constraints and local unvalidated adoption entries; online job-owned states are reserved for hosted migration jobs.

    UniqueConstraint:
      type: object
      additionalProperties: false
      description: Relational unique constraint.
      properties:
        name:
          type: string
          description: Constraint name, unique within the table schema.
        columns:
          type: array
          items:
            type: string
          description: Unique columns. One or more ordered non-json relational columns are supported.
        expressions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              op:
                type: string
                enum: [lower, upper, md5]
              field:
                type: string
            required: [op, field]
          description: Stable expression keys supported by unique-owner maintenance.
        without_overlaps_period:
          type: string
          description: Application-time period name for `WITHOUT OVERLAPS` temporal uniqueness.
        where:
          $ref: "#/components/schemas/RowsUniquePredicateGroup"
          description: Field-only partial unique predicate shorthand.
        where_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
          description: Deterministic row-expression predicates that decide whether a row participates in this unique constraint.
        validation_state:
          type: string
          enum: [enforced, unvalidated]
          description: Unique validation state. Unvalidated constraints are durable metadata but do not enforce writes until promoted.

    RelationalIndexKey:
      type: object
      additionalProperties: false
      description: Ordered component of a relational ordered-tuple index key.
      properties:
        column:
          type: string
          minLength: 1
          description: Declared relational column used by this key component.
        collation:
          type: string
          minLength: 1
          description: Optional collation used by this ordered key component.
        direction:
          type: string
          enum: [asc, desc]
          description: Sort direction for ordered scans. Omitted defaults to asc.
        nulls:
          type: string
          enum: [default, first, last]
          description: Null placement for ordered scans. Omitted uses method default.
      required:
        - column

    RelationalIndexOwnerRange:
      type: object
      additionalProperties: false
      description: Owner-range coverage for a relational access-method generation.
      properties:
        start:
          type: string
          description: Inclusive owner range start key.
        end:
          type: string
          description: Exclusive owner range end key; empty string means unbounded.
        range_id:
          type: string
          description: Optional stable range identifier.
        placement_generation:
          type: integer
          format: uint64
          description: Placement generation that produced this range assignment.
      required:
        - start
        - end

    RelationalIndexGenerationRecord:
      type: object
      additionalProperties: false
      description: Shared lifecycle record for derived relational access-method generations.
      properties:
        generation:
          type: integer
          format: uint64
          description: Monotonic physical access-method generation.
        owner_ranges:
          type: array
          items:
            $ref: "#/components/schemas/RelationalIndexOwnerRange"
          description: Owner ranges covered by this generation.
        lifecycle:
          type: string
          enum:
            - ready
            - building
            - catching_up
            - stale
            - rebuild_required
            - failed
            - invalid
            - dropping
          description: Lifecycle state for this generation.
        lag:
          type: integer
          format: uint64
          description: Remaining catch-up lag for this generation.
        failure_reason:
          type: string
          description: Typed or operator-facing failure reason when the lifecycle is not healthy.
        ready_watermark:
          type: integer
          format: uint64
          description: Durable watermark that is ready for serving.
      required:
        - generation
        - owner_ranges
        - lifecycle
        - lag
        - ready_watermark

    RelationalIndex:
      type: object
      additionalProperties: false
      description: Durable relational secondary-index metadata.
      properties:
        name:
          type: string
          minLength: 1
          description: Stable index name, unique within the table schema.
        owner_kind:
          type: string
          enum: [relational_column, unique_constraint, table]
          description: Catalog object that owns this physical index.
        owner_name:
          type: string
          description: Owner column, constraint, or table-level sentinel name.
        access_method:
          type: string
          enum: [scalar_column, ordered_tuple, algebraic_filter, text_search]
          description: Logical access method implemented by this index.
        method_config:
          type: object
          additionalProperties: true
          description: Access-method-specific durable configuration, for example full-text analyzer/scoring options or schema-derived algebraic settings.
        unique:
          type: boolean
          description: True when the entry backs a unique constraint.
        columns:
          type: array
          items:
            type: string
          description: Declared relational columns maintained by the index.
        include_columns:
          type: array
          items:
            type: string
          description: Covering payload columns stored with ordered tuple entries.
        keys:
          type: array
          items:
            $ref: "#/components/schemas/RelationalIndexKey"
          description: Ordered tuple key definition. Required for ordered_tuple indexes.
        lifecycle:
          type: string
          enum:
            - ready
            - building
            - catching_up
            - stale
            - rebuild_required
            - failed
            - invalid
            - dropping
          description: Durable lifecycle state for this index generation.
        generation:
          type: integer
          format: uint64
          description: Monotonic physical index generation.
        schema_fingerprint:
          type: string
          description: Stable fingerprint of the index-defining catalog shape.
        generation_record:
          $ref: "#/components/schemas/RelationalIndexGenerationRecord"
          description: Shared generation/lifecycle record for ordered_tuple, text_search, and algebraic_filter access methods.
        where:
          $ref: "#/components/schemas/RowsUniquePredicateGroup"
          description: Field-only partial index predicate shorthand.
        where_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
          description: Deterministic row-expression predicates for index participation.
      required:
        - name
        - owner_kind
        - access_method

    DynamicTemplate:
      type: object
      description: |
        A rule for mapping dynamically detected fields. Templates are checked in order
        and the first matching template's mapping is used.
      properties:
        name:
          type: string
          description: Optional identifier for the template (useful for debugging)
        match:
          type: string
          description: |
            Glob pattern for field name (last path element).
            Supports * and ** wildcards. Example: "*_text" matches "title_text", "body_text"
        unmatch:
          type: string
          description: |
            Exclusion pattern for field name. If it matches, the template is skipped.
            Example: "skip_*" would exclude fields like "skip_this"
        path_match:
          type: string
          description: |
            Glob pattern for the full dotted path. Supports ** for matching multiple segments.
            Example: "metadata.**" matches "metadata.author", "metadata.tags.primary"
        path_unmatch:
          type: string
          description: Path exclusion pattern. If it matches the full path, the template is skipped.
        match_mapping_type:
          type: string
          enum: [string, number, boolean, date, object]
          description: Filter by detected JSON type
        mapping:
          $ref: "#/components/schemas/TemplateFieldMapping"

    TemplateFieldMapping:
      type: object
      description: Field mapping to apply when a dynamic template matches
      properties:
        type:
          $ref: "#/components/schemas/AntflyType"
        analyzer:
          type: string
          description: |
            Analyzer name (e.g., "standard", "keyword", "en", "html_analyzer").
            Used for text fields to control tokenization and normalization.
        index:
          type: boolean
          default: true
          description: Whether to index the field (default true)
        store:
          type: boolean
          default: false
          description: Whether to store the field value (default false)
        include_in_all:
          type: boolean
          default: false
          description: Whether to include in the _all field for cross-field search
        doc_values:
          type: boolean
          default: false
          description: Whether to enable doc values for sorting/faceting
