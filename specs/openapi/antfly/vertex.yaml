openapi: 3.0.3
info:
  title: Vertex Provider Shared Configuration
  description: Shared Google Cloud Vertex/Discovery Engine configuration fields used by Antfly providers.
  version: "0.0.1"
components:
  schemas:
    VertexCredentials:
      type: object
      description: |
        Shared Google Cloud credentials for providers backed by Vertex AI or
        Discovery Engine APIs.

        Providers should expose these fields directly unless there is a strong
        product reason to nest them. The runtime resolution order is:
        configured value, environment variable, then Application Default
        Credentials where supported.
      properties:
        project_id:
          type: string
          description: Google Cloud project ID. Falls back to GOOGLE_CLOUD_PROJECT.
        location:
          type: string
          description: Google Cloud location. Falls back to GOOGLE_CLOUD_LOCATION when applicable.
        credentials_path:
          type: string
          description: ADC credential JSON path (service-account, authorized-user, or external-account). Falls back to GOOGLE_APPLICATION_CREDENTIALS or the default ADC chain.

    VertexProjectId:
      type: string
      description: Google Cloud project ID. Falls back to GOOGLE_CLOUD_PROJECT.

    VertexLocation:
      type: string
      description: Google Cloud location. Falls back to GOOGLE_CLOUD_LOCATION when applicable.

    VertexCredentialsPath:
      type: string
      description: ADC credential JSON path (service-account, authorized-user, or external-account). Falls back to GOOGLE_APPLICATION_CREDENTIALS or the default ADC chain.
