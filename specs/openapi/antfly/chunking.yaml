openapi: 3.0.3
info:
  title: Chunker Provider Configuration
  description: "An OpenAPI specification for configuring different chunking providers in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    ChunkerProvider:
      type: string
      enum:
        - mock
        - antfly
      description: "The chunking provider to use."

    ChunkerConfig:
      description: "A unified configuration for a chunking provider."
      allOf:
        - $ref: "#/components/schemas/AntflyChunkerConfig"
        - type: object
          properties:
            provider:
              $ref: "#/components/schemas/ChunkerProvider"
            store_chunks:
              x-go-type-skip-optional-pointer: true
              type: boolean
              description: >-
                Controls whether chunk data is persisted to storage.
                When false (default), fixed chunks are generated in memory and only embeddings are stored.
                Model-aware streams always retain descriptor recipes; false omits their payloads.
                When true, chunk payloads are also stored. Vectors remain in the embedding artifact family.
              default: false
            full_text_index:
              x-go-type-skip-optional-pointer: true
              type: object
              description: |
                Configuration for full-text indexing of chunks.
                When present (even if empty), chunk artifacts are persisted and indexed in Antfly's native full-text index, queryable and projectable via the document's `_chunks` field.
                When absent, chunks are generated only to drive vector embeddings and are not indexed for full-text search (unless `store_chunks` is also set).
              additionalProperties: true
            # Repeat all inherited fields for generators that flatten only one
            # allOf level. This direct reference preserves the standalone
            # AntflyChunkerConfig type without generating union state.
            api_url:
              type: string
              format: uri
              description: "The URL of the Inference API endpoint. Can also be set via ANTFLY_INFERENCE_URL."
              example: "http://localhost:8080"
            model:
              type: string
              description: "The chunking model to use. Defaults to 'fixed' for simple token-based chunking; other values select a model from models/chunkers/{name}/. Successful create responses include the effective model."
              default: "fixed"
              example: "fixed"
            max_chunks:
              type: integer
              minimum: 0
              maximum: 4096
              description: >-
                Maximum chunks per invocation. Model-aware enrichment treats
                this as a page size and resumes until source completion;
                zero selects the worker page size. Fixed chunking retains
                its per-document cap, with zero meaning unlimited.
            threshold:
              type: number
              format: float
              minimum: 0
              maximum: 1
            text:
              $ref: "../shared/chunking.yaml#/components/schemas/TextChunkOptions"
            audio:
              $ref: "../shared/chunking.yaml#/components/schemas/AudioChunkOptions"
            embedding:
              $ref: '../shared/chunking.yaml#/components/schemas/ChunkEmbeddingTarget'
            outputs:
              $ref: '../shared/chunking.yaml#/components/schemas/ChunkOutputs'
            policy:
              $ref: '../shared/chunking.yaml#/components/schemas/MediaChunkPolicy'
          required:
            - provider
      example:
        provider: "antfly"
        model: "fixed"
        text:
          target_tokens: 500
          overlap_tokens: 50

    AntflyChunkerConfig:
      description: |
        Configuration for the Antfly inference chunking provider.

        Antfly inference is Antfly's built-in ML service for local chunking.

        **Chunking Models:**
        - fixed: Fixed-size chunking by token count, with fixed time windows for audio
          (aliases `fixed_bert`, `fixed_bpe`, and `fixed-bert-tokenizer`). This is the
          only chunking model Antfly inference implements; other model names are
          rejected as unsupported.

        **Deduplication:**
        - Within a single document write, chunk results are deduplicated when multiple
          indexes share the same source text and chunker configuration, so the source
          is chunked at most once per write.
      allOf:
        - $ref: "../shared/chunking.yaml#/components/schemas/ChunkOptions"
        - type: object
          properties:
            api_url:
              type: string
              format: uri
              description: "The URL of the Inference API endpoint (e.g., 'http://localhost:8080'). Can also be set via ANTFLY_INFERENCE_URL environment variable."
              example: "http://localhost:8080"
            model:
              type: string
              description: "The chunking model to use. Defaults to 'fixed' for simple token-based chunking; other values select a model from models/chunkers/{name}/. Successful create responses include the effective model."
              default: "fixed"
              example: "fixed"
      example:
        provider: "antfly"
        api_url: "http://localhost:8080"
        model: "fixed"
        text:
          target_tokens: 500
          overlap_tokens: 50
          separator: "\n\n"

    Chunk:
      $ref: "../shared/chunking.yaml#/components/schemas/Chunk"

    ChunkOptions:
      $ref: "../shared/chunking.yaml#/components/schemas/ChunkOptions"
