openapi: 3.0.3
info:
  title: Antfly Configuration Schema
  description: "Configuration schema for Antfly distributed key-value store and vector search engine."
  version: "0.0.1"

components:
  schemas:
    Config:
      type: object
      properties:
        version:
          type: string
          description: "Internal version of antfly"
          example: "0.0.1"
        log:
          $ref: "../shared/logging.yaml#/components/schemas/Config"
        health_enabled:
          type: boolean
          description: "Enables the health/metrics server. Defaults to true."
          default: true
        health_port:
          type: integer
          description: "Port for the health/metrics server. Defaults to 4200."
          default: 4200
          example: 4200
        admission:
          $ref: "#/components/schemas/AdmissionConfig"
        storage:
          $ref: "#/components/schemas/StorageConfig"
        transaction_sessions:
          $ref: "#/components/schemas/TransactionSessionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataInfo"
        inference:
          $ref: "../inference/config.yaml#/components/schemas/RuntimeConfig"
        tls:
          $ref: "#/components/schemas/TLSInfo"
        remote_content:
          $ref: "../shared/scraping.yaml#/components/schemas/RemoteContentConfig"
        connections:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ConnectionConfig"
          description: |
            Public connection resources keyed by stable connection ID. These
            are the external systems Antfly can use for inference, external IO,
            CDC, backups, indexing, agents, and related workflows.
        speech_to_text:
          type: object
          additionalProperties:
            $ref: "audio.yaml#/components/schemas/STTConfig"
          description: |
            Named speech-to-text provider configurations.

            Define named STT providers that can be referenced by templates and API calls.
            The first provider defined becomes the default when no provider name is specified.

            **Example:**
            ```json
            {
              "speech_to_text": {
                "antfly-whisper": { "provider": "antfly", "api_url": "http://localhost:8080", "model": "openai/whisper-base" },
                "openai-whisper": { "provider": "openai", "model": "whisper-1" }
              }
            }
            ```

            Then in templates: `{{transcribeAudio url="..." provider="whisper-local"}}`
          example:
            antfly-whisper:
              provider: antfly
              api_url: "http://localhost:8080"
              model: openai/whisper-base
            openai-whisper:
              provider: openai
              model: whisper-1
        cors:
          $ref: "../shared/middleware.yaml#/components/schemas/CORSConfig"
        replication_factor:
          type: integer
          description: "How many replicas of each shard should be maintained."
          minimum: 1
          maximum: 5
          default: 3
          example: 3
          x-go-type: uint64
        enable_auth:
          type: boolean
          description: "Enables authentication for the unified API and authorization on routes with defined RBAC policies. Inference routes require a valid principal when enabled, but do not currently enforce per-model or per-operation inference RBAC."
          default: false
        disable_shard_alloc:
          type: boolean
          description: "Disables automatic shard reallocation (splitting/merging)."
          default: true
        shard_cooldown_period:
          type: string
          description: "Cooldown period after shard operations (start/stop/split). Format: duration string like '1m', '30s'. Default: '1m' (one minute)."
          example: "1m"
          x-go-type: time.Duration
        split_timeout:
          type: string
          description: "Maximum duration for a shard split operation before triggering rollback. Format: duration string like '5m', '30s'. Default: '5m' (five minutes)."
          example: "5m"
          x-go-type: time.Duration
        split_finalize_grace_period:
          type: string
          description: "Minimum continuous readiness duration required before finalizing a split. Format: duration string like '15s', '1m'. Default: '15s'."
          example: "15s"
          x-go-type: time.Duration
        max_shard_size_bytes:
          type: integer
          description: "Maximum size of a shard in bytes. Used to determine when to split shards."
          minimum: 1048576
          maximum: 46170898227200
          default: 67108864
          example: 1073741824
          x-go-type: uint64
        min_shard_size_bytes:
          type: integer
          description: "Minimum size of a shard in bytes before it becomes eligible for automatic merge consideration. If unset, defaults to one quarter of max_shard_size_bytes."
          minimum: 1
          example: 268435456
          x-go-type: uint64
        min_shards_per_table:
          type: integer
          description: "Minimum number of shards to keep for a table. Automatic merges will not reduce a table below this count."
          minimum: 1
          example: 1
          x-go-type: uint64
        max_shards_per_table:
          type: integer
          description: "Maximum number of shards that can be created for a single table."
          minimum: 1
          default: 20
          example: 100
          x-go-type: uint64
        default_shards_per_table:
          type: integer
          description: "Default number of shards to create for a new table."
          minimum: 1
          default: 3
          example: 4
          x-go-type: uint64
        deployment_mode:
          type: string
          description: "Runtime deployment topology. Standalone runs metadata, data, APIs, and inference in one process."
          enum:
            - embedded
            - distributed
            - standalone
            - serverless
          default: distributed
        embedders:
          type: object
          additionalProperties:
            $ref: "embeddings.yaml#/components/schemas/EmbedderConfig"
          description: |
            Named embedder configurations for embedding operations.

            Define named embedders that can be referenced by indexes, templates, and API calls.
            The first embedder defined becomes the default when no embedder name is specified.

            **API Key Configuration:**

            API keys can be provided through a protected secret-store file or environment variables:

            1. **Secret store** (recommended for production): mount a platform-managed
               secret file and pass `--secret-store-path /run/secrets/antfly/secrets.json`.
               Reference its values in JSON config as
               `"api_key": "${secret:openai.api_key}"`.

            2. **Environment variable** (simpler for development):
               Omit `api_key` from config and set the appropriate env var:
               - OpenAI: `OPENAI_API_KEY`
               - Gemini: `GEMINI_API_KEY`
               - Anthropic: `ANTHROPIC_API_KEY`
               - Cohere: `COHERE_API_KEY`

            See [Secrets Management](/docs/secrets) for complete documentation.

            **Example:**
            ```json
            {
              "embedders": {
                "openai-small": { "provider": "openai", "model": "text-embedding-3-small" },
                "antfly-local": { "provider": "antfly", "model": "bge-base-en-v1.5", "api_url": "http://localhost:8082" }
              }
            }
            ```
          example:
            openai-small:
              provider: openai
              model: text-embedding-3-small
            antfly-local:
              provider: antfly
              model: bge-base-en-v1.5
              api_url: "http://localhost:8082"
        generators:
          type: object
          additionalProperties:
            $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
          description: |
            Named generator configurations for AI operations.

            Define named generators that can be referenced by chains, templates, and API calls.
            The first generator defined becomes the default when no generator name is specified.

            **API Key Configuration:**

            API keys can be provided through a protected secret-store file or environment variables:

            1. **Secret store** (recommended for production): mount a platform-managed
               secret file and pass `--secret-store-path /run/secrets/antfly/secrets.json`.
               Reference its values in JSON config as
               `"api_key": "${secret:gemini.api_key}"`.

            2. **Environment variable** (simpler for development):
               Omit `api_key` from config and set the appropriate env var:
               - Gemini: `GEMINI_API_KEY`
               - OpenAI: `OPENAI_API_KEY`
               - Anthropic: `ANTHROPIC_API_KEY`

            See [Secrets Management](/docs/secrets) for complete documentation.

            **Example:**
            ```json
            {
              "generators": {
                "gemini-flash": { "provider": "gemini", "model": "gemini-2.5-flash" },
                "ollama-local": { "provider": "ollama", "model": "llama3" },
                "openai-gpt4": { "provider": "openai", "model": "gpt-4.1" }
              }
            }
            ```
          example:
            gemini-flash:
              provider: gemini
              model: gemini-2.5-flash
            ollama-local:
              provider: ollama
              model: llama3
            openai-gpt4:
              provider: openai
              model: gpt-4.1
        chains:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/NamedChainLink"
          description: |
            Named chain configurations for fallback/retry logic.

            Chains are ordered lists of generators with retry and fallback logic.
            Each link references a generator by name from the `generators` map.
            The first chain defined becomes the default when no chain name is specified.

            **Chain Conditions:**
            - `on_error`: Try next generator on any error (default)
            - `on_rate_limit`: Try next only on rate limit (429) errors
            - `on_timeout`: Try next only on timeout errors
            - `always`: Always try the next generator

            **Example:**
            ```json
            {
              "chains": {
                "default": [
                  { "generator": "gemini-flash", "retry": { "max_attempts": 3 }, "condition": "on_rate_limit" },
                  { "generator": "ollama-local" }
                ],
                "with-inline": [
                  { "generator": "gemini-flash" },
                  { "generator_config": { "provider": "anthropic", "model": "claude-sonnet-4-5-20250929" } }
                ]
              }
            }
            ```

            Then in API calls: `chain: "default"` or `chain: "with-inline"`
          example:
            default:
              - generator: gemini-flash
                retry:
                  max_attempts: 3
                condition: on_rate_limit
              - generator: ollama-local
            with-inline:
              - generator: gemini-flash
              - generator_config:
                  provider: anthropic
                  model: claude-sonnet-4-5-20250929
        rerankers:
          type: object
          additionalProperties:
            $ref: "reranking.yaml#/components/schemas/RerankerConfig"
          description: |
            Named reranker configurations for search result reranking.

            Define named rerankers that can be referenced by indexes, search queries, and API calls.
            The first reranker defined becomes the default when no reranker name is specified.

            **Example:**
            ```json
            {
              "rerankers": {
                "cohere-english": { "provider": "cohere", "model": "rerank-english-v3.0" },
                "antfly-local": { "provider": "antfly", "model": "mxbai-rerank-base-v1", "url": "http://localhost:8080" }
              }
            }
            ```
          example:
            cohere-english:
              provider: cohere
              model: rerank-english-v3.0
            antfly-local:
              provider: antfly
              model: mxbai-rerank-base-v1
              url: "http://localhost:8080"
        chunkers:
          type: object
          additionalProperties:
            $ref: "chunking.yaml#/components/schemas/ChunkerConfig"
          description: |
            Named chunker configurations for text chunking.

            Define named chunkers that can be referenced by indexes and API calls.
            The first chunker defined becomes the default when no chunker name is specified.

            **Example:**
            ```json
            {
              "chunkers": {
                "fixed-500": { "provider": "antfly", "model": "fixed", "target_tokens": 500, "overlap_tokens": 50 },
                "semantic": { "provider": "antfly", "model": "semantic-chunker", "api_url": "http://localhost:8080" }
              }
            }
            ```
          example:
            fixed-500:
              provider: antfly
              model: fixed
              target_tokens: 500
              overlap_tokens: 50
            semantic:
              provider: antfly
              model: semantic-chunker
              api_url: "http://localhost:8080"

    NamedChainLink:
      type: object
      description: |
        A link in a chain that can reference a generator by name OR provide an inline config.

        Use `generator` (string) to reference a named generator from the `generators` map.
        Use `generator_config` (object) to provide an inline generator configuration.
        Only one of `generator` or `generator_config` should be specified.
      properties:
        generator:
          type: string
          description: "Name of the generator from the generators map"
        generator_config:
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
          description: "Inline generator configuration (alternative to referencing by name)"
        retry:
          $ref: "../shared/generating.yaml#/components/schemas/RetryConfig"
          description: "Retry configuration for this generator"
        condition:
          $ref: "../shared/generating.yaml#/components/schemas/ChainCondition"
          description: "When to try the next generator in chain"

    ConnectionKind:
      type: string
      enum:
        - inference
        - web_search
        - external_io
        - cdc
      description: Broad physical category for a configured connection.
    ExternalIoProtocol:
      type: string
      enum:
        - s3
        - gcs
        - filesystem
        - http
      description: External IO transport protocol.
    ConnectionConfig:
      discriminator:
        propertyName: kind
        mapping:
          inference: "#/components/schemas/InferenceConnectionVariant"
          web_search: "#/components/schemas/WebSearchConnectionVariant"
          external_io: "#/components/schemas/ExternalIoConnectionVariant"
          cdc: "#/components/schemas/CdcConnectionVariant"
      oneOf:
        - $ref: "#/components/schemas/InferenceConnectionVariant"
        - $ref: "#/components/schemas/WebSearchConnectionVariant"
        - $ref: "#/components/schemas/ExternalIoConnectionVariant"
        - $ref: "#/components/schemas/CdcConnectionVariant"
    InferenceConnectionVariant:
      type: object
      additionalProperties: false
      required: [kind, capabilities, inference]
      properties:
        display_name: { type: string, description: Optional display name for UIs. }
        provider: { type: string, description: Optional provider-level service identity. }
        kind: { type: string, enum: [inference] }
        capabilities:
          type: array
          items: { type: string }
          description: Namespaced actions and workflow uses this connection supports.
        inference: { $ref: "#/components/schemas/InferenceConnectionConfig" }
    WebSearchConnectionVariant:
      type: object
      additionalProperties: false
      required: [kind, capabilities, web_search]
      properties:
        display_name: { type: string, description: Optional display name for UIs. }
        provider: { type: string, description: Optional provider-level service identity. }
        kind: { type: string, enum: [web_search] }
        capabilities:
          type: array
          items: { type: string }
          description: Namespaced actions and workflow uses this connection supports.
        web_search: { $ref: "#/components/schemas/WebSearchConnectionConfig" }
    ExternalIoConnectionVariant:
      type: object
      additionalProperties: false
      required: [kind, capabilities, external_io]
      properties:
        display_name: { type: string, description: Optional display name for UIs. }
        provider: { type: string, description: Optional provider-level service identity. }
        kind: { type: string, enum: [external_io] }
        capabilities:
          type: array
          items: { type: string }
          description: Namespaced actions and workflow uses this connection supports.
        external_io: { $ref: "#/components/schemas/ExternalIoConnectionConfig" }
    CdcConnectionVariant:
      type: object
      additionalProperties: false
      required: [kind, capabilities, cdc]
      properties:
        display_name: { type: string, description: Optional display name for UIs. }
        provider: { type: string, description: Optional provider-level service identity. }
        kind: { type: string, enum: [cdc] }
        capabilities:
          type: array
          items: { type: string }
          description: Namespaced actions and workflow uses this connection supports.
        cdc: { $ref: "#/components/schemas/CdcConnectionConfig" }
    InferenceConnectionConfig:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          type: string
          description: Inference provider type, such as openai, anthropic, antfly, ollama, or mock.
        url:
          type: string
          description: Provider endpoint URL when applicable.
        api_key:
          type: string
          description: Provider API key or secret reference. Never returned by inventory APIs.
        region:
          type: string
          description: Cloud region when applicable.
        project_id:
          type: string
          description: Google Cloud project when applicable. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        location:
          type: string
          description: Google Cloud location when applicable. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        credentials_path:
          type: string
          description: Filesystem path to provider credentials when applicable. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        names:
          type: array
          items:
            type: string
          description: Optional aliases for this provider instance.
        configured_model_types:
          type: array
          items:
            type: string
            enum:
              - embedder
              - generator
              - reranker
              - chunker
          description: Model types this connection is configured to serve.
    WebSearchConnectionConfig:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          description: Provider-specific service flavor, such as agent_search for provider vertex.
        max_results:
          type: integer
          minimum: 1
          maximum: 20
          description: Maximum ranked results to return.
        timeout_ms:
          type: integer
          description: Provider request timeout in milliseconds.
        safe_search:
          x-go-type-skip-optional-pointer: false
          type: boolean
          description: Request provider safe-search filtering.
        language:
          type: string
          description: Preferred result language, such as en.
        region:
          type: string
          description: Preferred result region, such as us.
        include_content:
          type: boolean
          description: Ask the provider to return extracted page content when supported.
        include_highlights:
          type: boolean
          description: Ask the provider to return highlighted passages when supported.
        api_key:
          type: string
          description: Provider API key or secret reference. Never returned by inventory APIs.
        endpoint:
          type: string
          description: Provider endpoint override when applicable.
        project_id:
          type: string
          description: Google Cloud project for provider vertex. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        location:
          type: string
          description: Google Cloud location for provider vertex. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        data_store:
          type: string
          description: Agent Search data store ID for provider vertex.
        serving_config:
          type: string
          description: Agent Search serving config ID for provider vertex.
        credentials_path:
          type: string
          description: Filesystem path to provider credentials when applicable. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials.
        include_domains:
          type: array
          items:
            type: string
          description: Only include results from these domains when provider supports it.
        exclude_domains:
          type: array
          items:
            type: string
          description: Exclude results from these domains when provider supports it.
    ExternalIoConnectionConfig:
      oneOf:
        - $ref: "#/components/schemas/S3ExternalIoConfig"
        - $ref: "#/components/schemas/GcsExternalIoConfig"
        - $ref: "#/components/schemas/FilesystemExternalIoConfig"
        - $ref: "#/components/schemas/HttpExternalIoConfig"
      discriminator:
        propertyName: protocol
        mapping:
          s3: "#/components/schemas/S3ExternalIoConfig"
          gcs: "#/components/schemas/GcsExternalIoConfig"
          filesystem: "#/components/schemas/FilesystemExternalIoConfig"
          http: "#/components/schemas/HttpExternalIoConfig"
    S3ExternalIoConfig:
      type: object
      additionalProperties: false
      required: [protocol, buckets]
      properties:
        protocol: { type: string, enum: [s3] }
        endpoint: { type: string, description: S3-compatible endpoint override. }
        region: { type: string }
        addressing_style:
          type: string
          enum: [path, virtual_hosted]
          default: virtual_hosted
        bucket_provisioning:
          type: string
          enum: [require_existing, create_if_missing]
          default: require_existing
        buckets:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 3, maxLength: 63 }
        prefix: { type: string }
        credentials: { $ref: "#/components/schemas/AwsCredentialConfig" }
        use_ssl: { type: boolean }
    GcsExternalIoConfig:
      type: object
      additionalProperties: false
      required: [protocol, buckets]
      properties:
        protocol: { type: string, enum: [gcs] }
        endpoint: { type: string, description: GCS JSON API endpoint override. }
        upload_endpoint: { type: string, description: GCS JSON upload endpoint override. }
        project_id: { type: string }
        bucket_provisioning:
          type: string
          enum: [require_existing, create_if_missing]
          default: require_existing
        buckets:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, minLength: 3, maxLength: 63 }
        prefix: { type: string }
        credentials: { $ref: "#/components/schemas/GcsCredentialConfig" }
    FilesystemExternalIoConfig:
      type: object
      additionalProperties: false
      required: [protocol, root]
      properties:
        protocol: { type: string, enum: [filesystem] }
        root:
          type: string
          description: Absolute administrator-controlled root. URI paths are resolved beneath this root.
    HttpExternalIoConfig:
      type: object
      additionalProperties: false
      required: [protocol]
      properties:
        protocol: { type: string, enum: [http] }
        hosts:
          type: array
          items: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: HTTP headers or secret references. Never returned by inventory APIs.
    GcsCredentialConfig:
      type: object
      additionalProperties: false
      required: [source]
      oneOf:
        - title: Application default credentials
          properties:
            source: { type: string, enum: [default] }
        - title: Bearer token
          required: [bearer_token]
          properties:
            source: { type: string, enum: [bearer_token] }
        - title: Service account
          properties:
            source: { type: string, enum: [service_account] }
          oneOf:
            - required: [service_account_json]
            - required: [credentials_path]
      properties:
        source: { type: string, enum: [default, bearer_token, service_account] }
        bearer_token: { type: string, description: Token or secret reference. }
        service_account_json: { type: string, description: Service-account JSON or secret reference. }
        credentials_path: { type: string }
        scope: { type: string }
    AwsCredentialConfig:
      type: object
      additionalProperties: false
      required: [source]
      description: >-
        Per-connection AWS credential identity. Each named connection owns an
        independent refresh cache, allowing lanes to use different accounts,
        profiles, or workload identities.
      oneOf:
        - title: Default AWS credential chain
          properties:
            source: { type: string, enum: [default] }
          not:
            anyOf:
              - required: [access_key_id]
              - required: [secret_access_key]
              - required: [session_token]
              - required: [profile]
              - required: [shared_credentials_file]
              - required: [role_arn]
              - required: [token_file]
              - required: [session_name]
              - required: [sts_endpoint]
        - title: Static credentials
          required: [access_key_id, secret_access_key]
          properties:
            source: { type: string, enum: [static] }
          not:
            anyOf:
              - required: [profile]
              - required: [shared_credentials_file]
              - required: [role_arn]
              - required: [token_file]
              - required: [session_name]
              - required: [sts_endpoint]
        - title: Shared credentials profile
          required: [profile]
          properties:
            source: { type: string, enum: [profile] }
          not:
            anyOf:
              - required: [access_key_id]
              - required: [secret_access_key]
              - required: [session_token]
              - required: [role_arn]
              - required: [token_file]
              - required: [session_name]
              - required: [sts_endpoint]
        - title: Web identity
          required: [role_arn, token_file]
          properties:
            source: { type: string, enum: [web_identity] }
          not:
            anyOf:
              - required: [access_key_id]
              - required: [secret_access_key]
              - required: [session_token]
              - required: [profile]
              - required: [shared_credentials_file]
      properties:
        source:
          type: string
          enum: [default, static, profile, web_identity]
        access_key_id:
          type: string
          description: Static access key or secret reference.
        secret_access_key:
          type: string
          description: Static secret key or secret reference.
        session_token:
          type: string
          description: Optional static session token or secret reference.
        profile:
          type: string
          description: Shared credentials profile name.
        shared_credentials_file:
          type: string
          description: Optional credentials file path for this connection.
        role_arn:
          type: string
          description: IAM role assumed with web identity.
        token_file:
          type: string
          description: Web identity token file mounted for this connection.
        session_name:
          type: string
          description: STS role session name.
        sts_endpoint:
          type: string
          description: Optional STS endpoint override.
    CdcConnectionConfig:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          type: string
          description: CDC provider type. Initially postgres.
        dsn:
          type: string
          description: Source DSN or secret reference. Never returned by inventory APIs.
        table_name:
          type: string
          description: Antfly table receiving changes from this CDC source.
        source_ordinal:
          type: integer
          format: uint32
          description: Zero-based ordinal of the source within the table's CDC runtime.
        external_table:
          type: string
          description: Source-side table or stream name.
        slot_name:
          type: string
          description: Provider replication cursor or slot name when applicable.
        publication_name:
          type: string
          description: Provider publication or stream grouping name when applicable.
    AdmissionConfig:
      type: object
      additionalProperties: false
      description: Node-local foreground database request admission settings.
      properties:
        query:
          $ref: "#/components/schemas/QueryAdmissionConfig"
        write:
          $ref: "#/components/schemas/WriteAdmissionConfig"
        inference:
          $ref: "#/components/schemas/InferenceAdmissionConfig"

    QueryAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 32
          example: 32
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent query, search, and retrieval requests in this
            process. The default is 32. The budget is shared by REST, MCP,
            retrieval-agent, A2A, and direct API-kernel execution. Full-text,
            vector, hybrid, graph, aggregation, federated searches, and document
            scans consume it. Point lookups and operational/control-plane reads
            remain outside it. Excess HTTP work is rejected immediately with
            HTTP 429 and Retry-After: 1; asynchronous protocols use their native failure
            response. Excess work is not queued. Set to 0 to disable query
            admission. This budget is independent of transport safeguards,
            write admission, and
            admission.inference.max_concurrent_requests.

    WriteAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 16
          example: 16
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent foreground data mutations in this process. The
            default is 16. Table batch writes, cross-table batches, linear merges,
            and transaction commits consume this budget. Schema, index, backup,
            restore, repair, and other administrative operations use dedicated
            control or background-maintenance paths. Set to 0 to disable write
            admission.

            Excess HTTP work in either foreground class is rejected immediately
            with HTTP 429 and Retry-After: 1; asynchronous protocols use their
            native failure response. Excess work is not queued. Both budgets are
            independent of transport safeguards and
            admission.inference.max_concurrent_requests.

    InferenceAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 32
          example: 32
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent inference requests admitted by this process.
            The budget covers embedded inference routes, direct providers, and
            public connection inference forwarding. Remote forwarding holds a
            slot for the full upstream request. The runtime-reserved
            `local-inference` connection dispatches in process and is admitted
            once by the destination inference route; configured URLs remain
            remote boundaries even when they alias the local listener.
            Embedded standalone uses one shared coordinator for all of those
            surfaces; API-only runtimes use the same setting as a local forwarding
            gate. For embedded inference, this value also sizes the weighted work
            budget: each request consumes one request slot and at least one unit,
            while request body size, generation workload, and image byte/count
            reservations can consume more than one unit. The request count can
            therefore never exceed this value, while expensive requests may
            exhaust weighted capacity sooner. Read and
            image-extraction admission reserves the effective downloaded-byte ceiling at 16 MiB
            per unit and at least one unit per two images. A positive capacity also
            clamps each such request's downloaded-image ceiling to 16 MiB times
            this value. When a request or weighted-work ceiling is exhausted, new HTTP requests are
            rejected immediately with 503 Service Unavailable and Retry-After: 1;
            they are not retained
            in an in-process queue. Set to 0 to disable request admission and,
            for embedded inference, weighted-unit accounting and the
            capacity-derived clamp. The default is 32.

    MetadataInfo:
      type: object
      properties:
        orchestration_urls:
          type: object
          description: "Mapping from Metadata Node ID (hex string) to its URL used by store nodes for enrolling into the cluster"
          additionalProperties:
            type: string
            format: uri
          example:
            "1": "http://localhost:5001"
            "2": "http://localhost:5002"
            "3": "http://localhost:5003"

    TLSInfo:
      type: object
      deprecated: true
      description: |
        Unsupported by the built-in Zig server. Any non-null `tls` object causes
        startup to fail closed. Terminate TLS at a trusted reverse proxy or load balancer.
      properties:
        cert:
          type: string
          deprecated: true
          description: "Legacy certificate path; rejected by the current Zig server."
          example: "/path/to/cert.pem"
        key:
          type: string
          deprecated: true
          description: "Legacy private-key path; rejected by the current Zig server."
          example: "/path/to/key.pem"

    LocalStorageConfig:
      type: object
      additionalProperties: false
      properties:
        base_dir:
          type: string
          description: "Root directory for all antfly data storage. Defaults to 'antflydb'."
          default: "antflydb"
          minLength: 1
          example: "antflydb"

    StorageEngine:
      type: string
      description: "Durable storage representation, independent of deployment topology."
      enum:
        - lite
        - local
        - object
      default: local

    TransactionSessionConfig:
      type: object
      additionalProperties: false
      description: "Resource and retention limits for multi-request transaction sessions."
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 604800
          default: 3600
        cleanup_interval_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 60
        max_count:
          type: integer
          minimum: 1
          maximum: 65536
          default: 1024
        max_record_bytes:
          type: integer
          minimum: 65536
          maximum: 67108864
          default: 16777216
        max_savepoints:
          type: integer
          minimum: 1
          maximum: 1024
          default: 64

    LiteStorageConfig:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          minLength: 8
          pattern: "\\.aflite$"
          description: "Path to the single writable Antfly Lite database file."
          example: "./data.antfly.aflite"
        fsync:
          type: boolean
          default: true
          x-go-type-skip-optional-pointer: false
          description: "Synchronize committed Lite state before acknowledging it."

    ObjectStorageConfig:
      type: object
      additionalProperties: false
      required:
        - connection
        - bucket
      properties:
        connection:
          type: string
          minLength: 1
          description: >-
            ID of a connections entry with kind external_io, protocol s3, and
            the storage.primary capability. Storage credentials are resolved
            from that connection independently of remote-content credentials.
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string
        lanes:
          $ref: "#/components/schemas/ObjectStorageLanes"

    ObjectStorageLanes:
      type: object
      additionalProperties: false
      description: >-
        Optional placement overrides for independently managed serverless
        durability lanes. Unspecified fields inherit from the object-level
        connection, bucket, and prefix.
      properties:
        artifacts:
          $ref: "#/components/schemas/ObjectStorageLocation"
        manifests:
          $ref: "#/components/schemas/ObjectStorageLocation"
        wal:
          $ref: "#/components/schemas/ObjectStorageLocation"
        progress:
          $ref: "#/components/schemas/ObjectStorageLocation"
        catalog:
          $ref: "#/components/schemas/ObjectStorageLocation"

    ObjectStorageLocation:
      type: object
      additionalProperties: false
      properties:
        connection:
          type: string
          minLength: 1
          description: Optional external_io connection override for this lane.
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string

    StorageConfig:
      type: object
      additionalProperties: false
      description: >-
        Tagged storage-engine configuration. Engine is required and exactly the
        matching engine member must be present.
      required: [engine]
      oneOf:
        - title: Lite storage configuration
          required: [engine, lite]
          properties:
            engine:
              type: string
              enum: [lite]
          not:
            anyOf:
              - required: [local]
              - required: [object]
        - title: Local storage configuration
          required: [engine, local]
          properties:
            engine:
              type: string
              enum: [local]
          not:
            anyOf:
              - required: [lite]
              - required: [object]
        - title: Object storage configuration
          required: [engine, object]
          properties:
            engine:
              type: string
              enum: [object]
          not:
            anyOf:
              - required: [lite]
              - required: [local]
      properties:
        engine:
          $ref: "#/components/schemas/StorageEngine"
        lite:
          $ref: "#/components/schemas/LiteStorageConfig"
        object:
          $ref: "#/components/schemas/ObjectStorageConfig"
        local:
          $ref: "#/components/schemas/LocalStorageConfig"
