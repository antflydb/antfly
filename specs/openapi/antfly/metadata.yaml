    RowsMutationSourceRequest:
      type: object
      additionalProperties: false
      description: |
        Typed relational mutation-source plan. The `source` is a lockable base
        row-query request with `row_claim.transaction_id` and no
        `source_cte` or `doc_key_range`; update/delete intents are staged into
        that transaction using committed-version predicates from the selected
        preimages. Claims over physical ranges, CTEs, joins, aggregates,
        windows, and lateral outputs are rejected until those stages expose an
        explicit lockable base-row contract.
      properties:
        op:
          type: string
          enum:
            - update
            - delete
        source:
          $ref: "#/components/schemas/RowsQueryRequest"
        patch:
          $ref: "#/components/schemas/RowsFieldPatch"
          description: Top-level static field patch for update operations.
        increment:
          $ref: "#/components/schemas/RowsNumericIncrement"
          description: Numeric increments for update operations.
        patch_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
          description: Field-to-expression assignments evaluated over the selected row image.
        increment_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
          description: Field-to-expression numeric deltas evaluated over the selected row image.
        json_set:
          type: array
          items:
            $ref: "#/components/schemas/RowsJsonSetTransform"
          description: JSON path transforms for update operations.
        array_update:
          type: array
          items:
            $ref: "#/components/schemas/RowsArrayUpdateTransform"
          description: Array transforms for update operations.
        temporal_portion:
          $ref: "#/components/schemas/RowsTemporalPortion"
          description: Application-time `FOR PORTION OF` slice for temporal update/delete mutation-source plans.
        returning:
          type: array
          items:
            type: string
          description: Fields to return from the final update image or deleted row image. `*` returns the full row.
        returning_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
          description: Typed row-expression projections over the final update image or deleted row image.
      required:
        - op
        - source
    RowsTemporalPortion:
      type: object
      additionalProperties: false
      description: Application-time temporal slice for update/delete mutation-source plans.
      properties:
        period:
          type: string
          minLength: 1
          description: Period name declared on the relational table schema.
        from:
          description: Inclusive lower bound encoded as the period start column's JSON type.
        to:
          description: Exclusive upper bound encoded as the period end column's JSON type.
      required:
        - period
        - from
        - to
    RowsInsertSourceAssignment:
      type: object
      additionalProperties: false
      description: Target-column assignment for a typed insert-source plan.
      properties:
        target_field:
          type: string
          description: Declared target-table relational field to populate.
        expr:
          $ref: "#/components/schemas/RowsExpression"
          description: Typed expression evaluated over each source row. A field expression copies a source field; operator expressions build generated insert values without carrying SQL text.
      required:
        - target_field
        - expr
    RowsInsertSourceRequest:
      type: object
      additionalProperties: false
      description: |
        Typed relational insert-source plan. The `source` is a read-only row
        query over `source_table` or, when omitted, the target table named in the
        path. Each selected source row is projected through `assignments` into a
        target insert row, then optional conflict handling and `RETURNING`
        projection run through the same row-batch semantics as ordinary
        inserts. Execution is fail-closed until the storage/runtime layer
        implements source-to-target routing, duplicate-target detection, and
        owner-local insert staging for this native plan.
      properties:
        op:
          type: string
          enum:
            - insert
        source_table:
          type: string
          description: Optional source table name. Omit or set to the target table for same-table insert-source plans; cross-table execution requires routed source/target ownership support.
        source:
          $ref: "#/components/schemas/RowsQueryRequest"
        assignments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsInsertSourceAssignment"
          description: Ordered target-field assignments used to build each proposed insert row from the source row.
        on_conflict:
          $ref: "#/components/schemas/RowsOnConflict"
        returning:
          type: array
          items:
            type: string
          description: Fields to return from the committed inserted or conflict-updated row image. `*` returns the full row.
        returning_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
          description: Typed row-expression projections over the committed inserted or conflict-updated row image.
      required:
        - op
        - source
        - assignments
    RowsJoinedMutationSourceAssignment:
      type: object
      additionalProperties: false
      description: Source-side assignment for joined mutation-source updates.
      properties:
        target_field:
          type: string
          description: Declared target-side relational field to assign.
        side:
          type: string
          enum:
            - left
            - right
          description: Join side that supplies the source field. Must be the non-target side.
        field:
          type: string
          description: Declared relational field to copy from the source side.
      required:
        - target_field
        - side
        - field
    RowsJoinedMutationSourceRequest:
      type: object
      additionalProperties: false
      description: |
        Typed relational joined mutation-source plan. The target side of the
        `join` must carry a lockable `row_claim.transaction_id`; the non-target
        side is read-only input. Update plans can copy same-typed values from
        the source side through `source_assignments` and can apply target-local
        patches or expression assignments. Delete plans reject update
        assignments. Execution must stage intents only for claimed target rows.
      properties:
        op:
          type: string
          enum:
            - update
            - delete
        source_table:
          type: string
          description: Optional source table name for cross-table joined mutation-source plans. Omit or set to the target table for same-table joined mutation sources. Catalog-routed execution reads source rows through the source table's owner ranges and stages only target-row intents through the target table's owner ranges.
        target_side:
          type: string
          enum:
            - left
            - right
        join:
          $ref: "#/components/schemas/RowsJoinRequest"
        match_expression_where:
          type: array
          description: "Post-match computed predicates over the target row and joined source row. Unqualified fields bind to the target row; fields with `source: source` bind to the source row."
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
        match_expression_any:
          type: array
          description: OR groups of post-match computed predicates over the target row and joined source row.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_not:
          type: array
          description: NOT groups of post-match computed predicates over the target row and joined source row.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_array_contains:
          type: array
          description: Post-match computed array-containment predicates over the target row and joined source row.
          items:
            $ref: "#/components/schemas/RowsExpressionArrayContainsPredicate"
        source_assignments:
          type: array
          items:
            $ref: "#/components/schemas/RowsJoinedMutationSourceAssignment"
          description: Source-side assignments that copy values from the read-only joined source side into the claimed target side.
        patch:
          $ref: "#/components/schemas/RowsFieldPatch"
          description: Target-local static field patch for update operations.
        increment:
          $ref: "#/components/schemas/RowsNumericIncrement"
          description: Target-local numeric increments for update operations.
        patch_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
          description: Target-local field-to-expression assignments evaluated over the target row image.
        increment_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
          description: Target-local field-to-expression numeric deltas evaluated over the target row image.
        returning:
          type: array
          items:
            type: string
          description: Fields to return from the final target update image or deleted target row image. `*` returns the full row.
        returning_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
          description: Typed row-expression projections over the final target update image or deleted target row image.
      required:
        - op
        - target_side
        - join
    RowsMutationSourceResultSet:
      type: object
      properties:
        matched:
          type: integer
          format: int64
          description: Number of source rows that matched before lock/limit selection.
        staged:
          type: integer
          format: int64
          description: Number of rows staged into the claimed transaction.
        returning:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional returning rows from the staged mutation.
    RowsGetRequest:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/RowSelector"
        include_physical_key:
          type: boolean
          default: false
          description: Include the diagnostic storage-owned physical key in each result.
      required:
        - keys
    RowsGetResult:
      type: object
      properties:
        identity:
          $ref: "#/components/schemas/RowSelector"
        found:
          type: boolean
        row:
          type: object
          additionalProperties: true
        version:
          type: integer
          format: uint64
        physical_key:
          type: string
          nullable: true
          description: Diagnostic storage-owned physical key. Null when a unique selector did not resolve. Do not persist as public row identity.
    RowsGetResultSet:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowsGetResult"
    RowsQueryOrder:
      description: Ordered row-stream key. Exactly one of `field` or `expr` is required. `field` names an output/base field; `expr` carries a typed row-expression AST for computed ordering.
      oneOf:
        - $ref: "#/components/schemas/RowsQueryOrderField"
        - $ref: "#/components/schemas/RowsQueryOrderExpression"
    RowsQueryOrderField:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
          minLength: 1
          description: Output/base field to order by. Mutually exclusive with `expr`.
        null_test:
          type: string
          enum:
            - is_null
            - is_not_null
        direction:
          type: string
          enum:
            - asc
            - desc
    RowsQueryOrderExpression:
      type: object
      additionalProperties: false
      required:
        - expr
      properties:
        expr:
          $ref: "#/components/schemas/RowsExpression"
          description: Typed row-expression AST for computed ordering. Mutually exclusive with `field`.
        null_test:
          type: string
          enum:
            - is_null
            - is_not_null
        direction:
          type: string
          enum:
            - asc
            - desc
    RowsRowClaim:
      type: object
      additionalProperties: false
      description: |
        Lockable base-row claim metadata. Public row-plan endpoints reject this
        field; it is only accepted by `rows/mutation-source` lockable base-row
        sources and internal/coordinator execution paths. `transaction_id` is
        the canonical field name.
      properties:
        mode:
          type: string
          enum:
            - for_update
            - for_no_key_update
          default: for_update
        wait_policy:
          type: string
          enum:
            - wait
            - nowait
            - skip_locked
          default: wait
        skip_locked:
          type: boolean
          default: false
          deprecated: true
        lease_ms:
          type: integer
          format: int64
          minimum: 0
          default: 30000
        owner_id:
          type: string
        transaction_id:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          description: Canonical 16-byte transaction id encoded as 32 hex characters.
    RowsDocKeyRange:
      type: object
      additionalProperties: false
      description: |
        Physical row-key range selector used by routed typed row plans after
        durable range ownership is known. At least one of `start` or `end` must be present,
        and a bounded range must have `start < end`.
      anyOf:
        - required:
            - start
        - required:
            - end
      properties:
        start:
          type: string
          description: Inclusive physical row-key lower bound.
        end:
          type: string
          description: Exclusive physical row-key upper bound.
    RowsExpression:
      description: |
        Shared typed row-expression AST. A node is exactly one of `{ "field": "name" }`,
        `{ "value": ... }`, or an operator node such as
        `{ "op": "lower", "args": [{ "field": "email" }] }`. Supported
        operators are the shared row-local expression surface used by schema
        predicates, mutation expressions, query projections, filters, grouping,
        ordering, and SQL lowering.
        Mutation expressions may set `source` to `existing` or `proposed`; query
        expressions use the default row source.
      oneOf:
        - $ref: "#/components/schemas/RowsExpressionField"
        - $ref: "#/components/schemas/RowsExpressionValue"
        - $ref: "#/components/schemas/RowsExpressionOperator"
    RowsExpressionField:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
          minLength: 1
        source:
          type: string
          enum:
            - row
            - existing
            - proposed
            - source
    RowsExpressionValue:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          description: Literal JSON value for a value node.
    RowsExpressionOperator:
      type: object
      additionalProperties: false
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - now
            - coalesce
            - lower
            - upper
            - trim
            - btrim
            - ltrim
            - rtrim
            - replace
            - translate
            - substring
            - substr
            - overlay
            - split_part
            - strpos
            - left
            - right
            - lpad
            - rpad
            - repeat
            - reverse
            - starts_with
            - ends_with
            - ascii
            - chr
            - md5
            - like
            - ilike
            - bool_and
            - and
            - bool_or
            - or
            - bool_not
            - not
            - concat
            - concat_ws
            - length
            - char_length
            - character_length
            - octet_length
            - nullif
            - greatest
            - least
            - abs
            - round
            - trunc
            - floor
            - ceil
            - sqrt
            - sign
            - power
            - add
            - sub
            - mul
            - div
            - mod
            - interval_ns
            - interval_months
            - date_trunc
            - date_bin
            - date_part
            - extract
            - cast
            - json_extract
            - json_extract_path
            - json_extract_path_text
            - jsonb_extract_path
            - jsonb_extract_path_text
            - json_typeof
            - jsonb_typeof
            - json_array_length
            - jsonb_array_length
            - array_length
            - cardinality
            - array_position
            - array_positions
            - array_append
            - array_prepend
            - array_cat
            - array_remove
            - array_replace
            - array_to_string
            - string_to_array
            - uuid_v4
            - gen_random_uuid
            - uuid_generate_v4
            - json_build_object
            - jsonb_build_object
            - to_jsonb
            - json_path_exists
            - regexp_replace
            - case
        args:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpression"
          description: Operand expressions for operator nodes.
        to:
          type: string
          enum:
            - text
            - numeric
            - bool
            - boolean
            - datetime
          description: Cast target for `cast`.
        path:
          description: Structured JSON path for `json_extract` and `json_path_exists`.
        as_text:
          type: boolean
          description: Return JSON path extraction as text.
        cases:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCaseBranch"
          description: Searched case branches, each with `when` and `then`.
        else:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: "#/components/schemas/RowsExpression"
          description: Fallback expression for searched `case`.
    RowsExpressionCaseBranch:
      type: object
      additionalProperties: false
      properties:
        when:
          $ref: "#/components/schemas/RowsExpressionCondition"
        then:
          $ref: "#/components/schemas/RowsExpression"
      required:
        - when
        - then
    RowsExpressionCondition:
      type: object
      additionalProperties: false
      description: Computed expression predicate over the shared row-expression AST.
      properties:
        lhs:
          $ref: "#/components/schemas/RowsExpression"
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - is_distinct
            - is_not_distinct
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
        rhs:
          $ref: "#/components/schemas/RowsExpression"
      required:
        - lhs
        - op
    RowsExpressionConditionGroup:
      type: object
      additionalProperties: false
      properties:
        all:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
      required:
        - all
    RowsExpressionArrayContainsPredicate:
      type: object
      additionalProperties: false
      properties:
        expr:
          $ref: "#/components/schemas/RowsExpression"
        value:
          type: array
          items: {}
      required:
        - expr
        - value
    RowsExpressionProjection:
      type: object
      additionalProperties: false
      properties:
        as:
          type: string
          minLength: 1
        expr:
          $ref: "#/components/schemas/RowsExpression"
      required:
        - as
        - expr
    RowsJsonExtractProjection:
      type: object
      additionalProperties: false
      description: Compact JSON path projection over a declared `json` column.
      properties:
        as:
          type: string
          minLength: 1
          description: Output field name.
        field:
          type: string
          minLength: 1
          description: Declared `json` column to read.
        path:
          description: Non-empty JSON path, encoded as a dot path string or array of path components.
        as_text:
          type: boolean
          default: false
          description: Return the extracted value as text, matching SQL `->>` behavior.
      required:
        - as
        - field
        - path
    RowsArrayLengthProjection:
      type: object
      additionalProperties: false
      description: Compact array-length projection over a declared `array` column.
      properties:
        as:
          type: string
          minLength: 1
          description: Output field name.
        field:
          type: string
          minLength: 1
          description: Declared `array` column to measure.
      required:
        - as
        - field
    RowsCoalesceOperand:
      description: Compact COALESCE operand. Exactly one of `field` or `value` is accepted by the server.
      oneOf:
        - $ref: "#/components/schemas/RowsCoalesceFieldOperand"
        - $ref: "#/components/schemas/RowsCoalesceValueOperand"
    RowsCoalesceFieldOperand:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
          minLength: 1
          description: Declared column to read.
    RowsCoalesceValueOperand:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          description: Literal JSON fallback value.
    RowsCoalesceProjection:
      type: object
      additionalProperties: false
      description: Compact COALESCE projection.
      properties:
        as:
          type: string
          minLength: 1
          description: Output field name.
        operands:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsCoalesceOperand"
      required:
        - as
        - operands
    RowsFieldAliasProjection:
      type: object
      additionalProperties: false
      description: Compact field alias projection over a declared column.
      properties:
        as:
          type: string
          minLength: 1
          description: Output field name.
        field:
          type: string
          minLength: 1
          description: Declared column to project.
      required:
        - as
        - field
    RowsWhereAtom:
      type: object
      additionalProperties: false
      description: |
        Typed scalar, array, JSON, or text-pattern row predicate atom over a
        declared relational column. Null-test operators omit `value`; value
        operators carry one JSON value; `in` and `not_in` carry an array value;
        JSON path operators carry `path`; text-pattern operators carry
        `pattern` and optional flags. The server validates column type and
        operator-specific fields against the table schema.
      properties:
        field:
          type: string
          minLength: 1
          description: Declared relational column.
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - is_distinct
            - is_not_distinct
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - array_any
            - array_contains
            - array_eq
            - in
            - not_in
            - json_contains
            - json_path_eq
            - json_path_exists
            - text_pattern
        value:
          description: JSON comparison value or array operand for operators that require one.
        path:
          description: Non-empty JSON path for `json_path_eq` and `json_path_exists`, encoded as a dot path string or array of path components.
        pattern:
          type: string
          description: SQL LIKE pattern for `text_pattern`.
        case_insensitive:
          type: boolean
          default: false
          description: ASCII case-insensitive matching for `text_pattern`.
        negated:
          type: boolean
          default: false
          description: Negates `text_pattern`.
      required:
        - field
        - op
    RowsWhereBranch:
      description: Predicate branch used by `where.any` and `where.not`; exactly one typed atom or an `all`-only conjunction of typed atoms.
      oneOf:
        - $ref: "#/components/schemas/RowsWhereBranchAtom"
        - $ref: "#/components/schemas/RowsWhereBranchAll"
    RowsWhereBranchAtom:
      type: object
      additionalProperties: false
      required:
        - field
        - op
      properties:
        field:
          type: string
          minLength: 1
          description: Declared relational column for a single-atom branch.
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - is_distinct
            - is_not_distinct
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - array_any
            - array_contains
            - array_eq
            - in
            - not_in
            - json_contains
            - json_path_eq
            - json_path_exists
            - text_pattern
        value:
          description: JSON comparison value or array operand for operators that require one.
        path:
          description: Non-empty JSON path for `json_path_eq` and `json_path_exists`, encoded as a dot path string or array of path components.
        pattern:
          type: string
          description: SQL LIKE pattern for `text_pattern`.
        case_insensitive:
          type: boolean
          default: false
          description: ASCII case-insensitive matching for `text_pattern`.
        negated:
          type: boolean
          default: false
          description: Negates `text_pattern`.
    RowsWhereBranchAll:
      type: object
      additionalProperties: false
      required:
        - all
      properties:
        all:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: Conjunction of typed atoms for this branch.
    RowsWhere:
      description: |
        Canonical row predicate tree. A top-level `where` is one predicate
        atom, an `all` conjunction of atoms, `any` / `not` branch groups, or an
        `all` conjunction plus branch groups. Branches may contain scalar,
        membership, array, JSON, and text-pattern atoms; the server stores
        branches containing structured atoms in native mixed access predicate
        groups and keeps scalar-only branches in scalar predicate groups.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - field
            - op
          not:
            anyOf:
              - required: [all]
              - required: [any]
              - required: [not]
          properties:
            field:
              type: string
              minLength: 1
              description: Declared relational column for a single top-level atom.
            op:
              type: string
              enum:
                - is_null
                - is_not_null
                - is_distinct
                - is_not_distinct
                - eq
                - ne
                - gt
                - gte
                - lt
                - lte
                - array_any
                - array_contains
                - array_eq
                - in
                - not_in
                - json_contains
                - json_path_eq
                - json_path_exists
                - text_pattern
            value:
              description: JSON comparison value or array operand for operators that require one.
            path:
              description: Non-empty JSON path for `json_path_eq` and `json_path_exists`, encoded as a dot path string or array of path components.
            pattern:
              type: string
              description: SQL LIKE pattern for `text_pattern`.
            case_insensitive:
              type: boolean
              default: false
              description: ASCII case-insensitive matching for `text_pattern`.
            negated:
              type: boolean
              default: false
              description: Negates `text_pattern`.
        - type: object
          additionalProperties: false
          anyOf:
            - required: [all]
            - required: [any]
            - required: [not]
          not:
            anyOf:
              - required: [field]
              - required: [op]
              - required: [value]
              - required: [path]
              - required: [pattern]
              - required: [case_insensitive]
              - required: [negated]
          properties:
            all:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/RowsWhereAtom"
            any:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/RowsWhereBranch"
            not:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/RowsWhereBranch"
    RowsQueryRequest:
      type: object
      additionalProperties: false
      description: |
        Typed relational row-query plan. Predicate and expression arrays carry
        Antfly row-expression AST nodes; SQL syntax is adapter sugar over this
        native request shape.
      properties:
        source_cte:
          type: string
          description: Optional ordered CTE name to read instead of the base table.
        where:
          $ref: "#/components/schemas/RowsWhere"
          description: Typed scalar, array, JSON, text-pattern, OR, and NOT predicates.
        expression_where:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
          description: All computed expression predicates that must pass.
        expression_any:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
          description: OR groups of computed expression predicates.
        expression_not:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
          description: NOT groups of computed expression predicates.
        expression_array_contains:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionArrayContainsPredicate"
          description: Computed array-containment predicates.
        select:
          type: array
          items:
            type: string
        json_extract:
          type: array
          items:
            $ref: "#/components/schemas/RowsJsonExtractProjection"
        array_length:
          type: array
          items:
            $ref: "#/components/schemas/RowsArrayLengthProjection"
        coalesce:
          type: array
          items:
            $ref: "#/components/schemas/RowsCoalesceProjection"
        field_aliases:
          type: array
          items:
            $ref: "#/components/schemas/RowsFieldAliasProjection"
        expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
          description: Typed row-expression projections.
        distinct_on:
          type: array
          items:
            type: string
          description: Ordered field keys used to keep the first row per key after order_by and before pagination. The leading order_by fields must match. Field-only shorthand for `distinct_on_expressions`.
        distinct_on_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpression"
          description: Ordered typed row-expression keys used to keep the first row per computed key after order_by and before pagination. The leading order_by expression keys must match.
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        limit:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
        total_mode:
          type: string
          enum:
            - exact
            - bounded
            - none
          description: |
            Controls total counting for paged reads. `exact` scans all matches
            and returns an exact total. `bounded` may stop after the requested
            page and report a lower-bound total. `none` may omit work needed
            only for totals.
        row_claim:
          $ref: "#/components/schemas/RowsRowClaim"
        doc_key_range:
          $ref: "#/components/schemas/RowsDocKeyRange"
    RowsCte:
      type: object
      additionalProperties: false
      description: Ordered named row-query subplan. Later CTEs and final plan stages can reference earlier names through `source_cte`. `max_rows` and `max_bytes` are optional materialization bounds; execution fails closed when the CTE would produce more rows or serialized row bytes than declared.
      properties:
        name:
          type: string
        max_rows:
          type: integer
          format: int64
          minimum: 0
        max_bytes:
          type: integer
          format: int64
          minimum: 0
        query:
          $ref: "#/components/schemas/RowsQueryRequest"
      required:
        - name
        - query
    RowsAggregateSpec:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        op:
          type: string
          enum:
            - count
            - sum
            - min
            - max
            - avg
            - array_agg
            - string_agg
            - percentile_cont
            - percentile_disc
            - mode
            - bool_or
            - bool_and
        field:
          type: string
          minLength: 1
        expr:
          $ref: "#/components/schemas/RowsExpression"
        distinct:
          type: boolean
        distinct_max_items:
          type: integer
          format: int64
          minimum: 1
        percentile:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction for percentile_cont and percentile_disc aggregate specs.
        percentiles:
          type: array
          minItems: 1
          items:
            type: number
            format: double
            minimum: 0
            maximum: 1
          description: Fractions for array-valued percentile_cont and percentile_disc aggregate specs.
        percentile_max_items:
          type: integer
          format: int64
          minimum: 1
          description: Maximum bounded per-group sample count for percentile_cont and percentile_disc.
        percentile_order:
          type: string
          enum:
            - asc
            - desc
          description: Ordered-set sample direction for percentile_cont and percentile_disc; deterministic tie-break direction for mode.
        array_max_items:
          type: integer
          format: int64
          minimum: 1
        array_order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        delimiter:
          type: string
          description: Delimiter for string_agg aggregate specs.
        filter:
          $ref: "#/components/schemas/RowsWhere"
        filter_array_any:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-array element-match filters for this aggregate. Each item must use `op: array_any`."
        filter_array_contains:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-array containment filters for this aggregate. Each item must use `op: array_contains`."
        filter_array_eq:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-array equality filters for this aggregate. Each item must use `op: array_eq`."
        filter_in:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive scalar membership filters for this aggregate. Each item must use `op: in` or `op: not_in`."
        filter_json_contains:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-JSON containment filters for this aggregate. Each item must use `op: json_contains`."
        filter_json_path_eq:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-JSON path equality filters for this aggregate. Each item must use `op: json_path_eq`."
        filter_json_path_exists:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive declared-JSON path-existence filters for this aggregate. Each item must use `op: json_path_exists`."
        filter_text_patterns:
          type: array
          items:
            $ref: "#/components/schemas/RowsWhereAtom"
          description: "Conjunctive text-pattern filters for this aggregate. Each item must use `op: text_pattern`."
        filter_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
        filter_expression_array_contains:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionArrayContainsPredicate"
          description: Conjunctive computed array-containment filters for this aggregate.
        filter_any:
          type: array
          minItems: 1
          description: Disjunction of input-row expression predicate groups for this aggregate. Each group is a conjunction; the aggregate consumes a row when at least one group matches.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        filter_not:
          type: array
          minItems: 1
          description: Negated input-row expression predicate groups for this aggregate. The aggregate skips a row when any group matches.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
      required:
        - name
        - op
    RowsAggregateHavingPredicate:
      type: object
      additionalProperties: false
      description: Predicate over emitted aggregate output fields, evaluated after grouping.
      properties:
        field:
          type: string
          minLength: 1
          description: Emitted aggregate output field name, usually an aggregation `name`, group key, or expression group alias.
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - is_distinct
            - is_not_distinct
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
        value:
          description: Comparison value. Omit for `is_null` and `is_not_null`.
      required:
        - field
        - op
    RowsAggregateHaving:
      type: object
      additionalProperties: false
      description: Conjunction of emitted aggregate-output predicates for HAVING.
      properties:
        all:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsAggregateHavingPredicate"
      required:
        - all
    RowsAggregateRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/RowsQueryRequest"
        group_by:
          type: array
          items:
            type: string
            minLength: 1
        group_expressions:
          type: array
          description: Named expression group keys. These are evaluated for each source row, included in the grouping key, and emitted under their `as` names in aggregate result rows.
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
        aggregations:
          type: array
          description: Metric specs to compute for each group. May be empty or omitted only when group_by or group_expressions is non-empty, which returns one row per distinct group key.
          items:
            $ref: "#/components/schemas/RowsAggregateSpec"
        having:
          $ref: "#/components/schemas/RowsAggregateHaving"
        having_expressions:
          type: array
          description: Expression predicates over aggregate output fields, evaluated after grouping. Field references bind to group keys or aggregation names.
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
        having_any:
          type: array
          minItems: 1
          description: Disjunction of aggregate-output expression predicate groups. Each group is a conjunction; the aggregate row passes when at least one group matches.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        having_not:
          type: array
          minItems: 1
          description: Negated aggregate-output expression predicate groups. Each group is a conjunction; the aggregate row is rejected when any group matches.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        limit:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
      required:
        - source
    RowsWindowFrame:
      type: object
      additionalProperties: false
      properties:
        unit:
          type: string
          enum:
            - rows
            - range
        start:
          type: string
          enum:
            - unbounded_preceding
            - offset_preceding
            - current_row
            - offset_following
        start_offset:
          type: integer
          format: int64
          minimum: 0
        end:
          type: string
          enum:
            - offset_preceding
            - current_row
            - offset_following
            - unbounded_following
        end_offset:
          type: integer
          format: int64
          minimum: 0
      required:
        - unit
        - start
        - end
    RowsWindowSpec:
      type: object
      additionalProperties: false
      properties:
        as:
          type: string
        function:
          type: string
          description: Window function name. Supported values are `row_number`, `rank`, `dense_rank`, `percent_rank`, `cume_dist`, `ntile`, `lag`, `lead`, `first_value`, `last_value`, `nth_value`, `count`, `sum`, `avg`, `min`, and `max`.
        partition_by:
          type: array
          items:
            type: string
            minLength: 1
        order_by:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        expr:
          $ref: "#/components/schemas/RowsExpression"
        offset:
          type: integer
          format: int64
          minimum: 1
        default:
          nullable: true
        frame:
          $ref: "#/components/schemas/RowsWindowFrame"
      required:
        - as
        - function
        - order_by
    RowsWindowRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/RowsQueryRequest"
        windows:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsWindowSpec"
        select:
          type: array
          items:
            type: string
            minLength: 1
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        limit:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
      required:
        - source
        - windows
    RowsJoinOn:
      type: object
      additionalProperties: false
      properties:
        left_field:
          type: string
          minLength: 1
        right_field:
          type: string
          minLength: 1
      required:
        - left_field
        - right_field
    RowsJoinProjection:
      type: object
      additionalProperties: false
      properties:
        as:
          type: string
          minLength: 1
        side:
          type: string
          enum:
            - left
            - right
        field:
          type: string
          minLength: 1
      required:
        - as
        - side
        - field
    RowsJoinStrategy:
      type: string
      description: Physical join strategy requested by the typed plan. `auto` lets Antfly choose from proven local/routed capabilities; `merge` requires both join inputs to be proven ordered by the leading join keys.
      enum:
        - auto
        - lookup
        - hash
        - merge
    RowsJoinStrategySelection:
      type: object
      additionalProperties: false
      description: Join strategy admission metadata returned by native join execution.
      properties:
        requested:
          $ref: "#/components/schemas/RowsJoinStrategy"
        selected:
          $ref: "#/components/schemas/RowsJoinStrategy"
      required:
        - requested
        - selected
    RowsJoinRequest:
      type: object
      additionalProperties: false
      description: Typed equality join plan. Each side is a full row-query request and can read an ordered CTE through `source_cte`.
      properties:
        left:
          $ref: "#/components/schemas/RowsQueryRequest"
        right:
          $ref: "#/components/schemas/RowsQueryRequest"
        "on":
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsJoinOn"
        match_expression_where:
          type: array
          description: "Post-match computed predicates over the joined rows. Unqualified fields bind to the left row; fields with `source: source` bind to the right row."
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
        match_expression_any:
          type: array
          description: OR groups of post-match computed predicates over the joined rows.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_not:
          type: array
          description: NOT groups of post-match computed predicates over the joined rows.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_array_contains:
          type: array
          description: Post-match computed array-containment predicates over the joined rows.
          items:
            $ref: "#/components/schemas/RowsExpressionArrayContainsPredicate"
        join_type:
          type: string
          enum:
            - inner
            - left
        strategy:
          $ref: "#/components/schemas/RowsJoinStrategy"
        select:
          type: array
          items:
            $ref: "#/components/schemas/RowsJoinProjection"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        limit:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
      required:
        - left
        - right
        - "on"
    RowsLateralCorrelation:
      type: object
      additionalProperties: false
      properties:
        left_field:
          type: string
          minLength: 1
        right_field:
          type: string
          minLength: 1
      required:
        - left_field
        - right_field
    RowsLateralRequest:
      type: object
      additionalProperties: false
      description: Typed bounded lateral plan. The right side must include a limit and can read an ordered CTE through `source_cte`.
      properties:
        left:
          $ref: "#/components/schemas/RowsQueryRequest"
        right:
          $ref: "#/components/schemas/RowsQueryRequest"
        correlations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RowsLateralCorrelation"
        match_expression_where:
          type: array
          description: "Post-match computed predicates over the left row and each bounded right row. Unqualified fields bind to the left row; fields with `source: source` bind to the right row."
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
        match_expression_any:
          type: array
          description: OR groups of post-match computed predicates over the left row and each bounded right row.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_not:
          type: array
          description: NOT groups of post-match computed predicates over the left row and each bounded right row.
          items:
            $ref: "#/components/schemas/RowsExpressionConditionGroup"
        match_expression_array_contains:
          type: array
          description: Post-match computed array-containment predicates over the left row and each bounded right row.
          items:
            $ref: "#/components/schemas/RowsExpressionArrayContainsPredicate"
        select:
          type: array
          items:
            $ref: "#/components/schemas/RowsJoinProjection"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/RowsQueryOrder"
        limit:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
      required:
        - left
        - right
        - correlations
    RowsPlanRequest:
      description: |
        Generic typed relational row plan envelope. It is exactly one
        operation-specific envelope: query, aggregate, window, join, or
        lateral. Query, aggregate, and window plans use `ranges`; join and
        lateral plans use paired `left_ranges` and `right_ranges`.
      oneOf:
        - $ref: "#/components/schemas/RowsQueryPlanRequest"
        - $ref: "#/components/schemas/RowsAggregatePlanRequest"
        - $ref: "#/components/schemas/RowsWindowPlanRequest"
        - $ref: "#/components/schemas/RowsJoinPlanRequest"
        - $ref: "#/components/schemas/RowsLateralPlanRequest"
    RowsQueryPlanRequest:
      type: object
      additionalProperties: false
      description: Typed row-query plan envelope. Accepts exactly `query` plus optional ordered `ctes` and declared `ranges`.
      properties:
        ctes:
          type: array
          items:
            $ref: "#/components/schemas/RowsCte"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        query:
          $ref: "#/components/schemas/RowsQueryRequest"
      required:
        - query
    RowsAggregatePlanRequest:
      type: object
      additionalProperties: false
      description: Typed row-aggregate plan envelope. Accepts exactly `aggregate` plus optional ordered `ctes` and declared `ranges`.
      properties:
        ctes:
          type: array
          items:
            $ref: "#/components/schemas/RowsCte"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        aggregate:
          $ref: "#/components/schemas/RowsAggregateRequest"
      required:
        - aggregate
    RowsWindowPlanRequest:
      type: object
      additionalProperties: false
      description: Typed row-window plan envelope. Accepts exactly `window` plus optional ordered `ctes` and declared `ranges`.
      properties:
        ctes:
          type: array
          items:
            $ref: "#/components/schemas/RowsCte"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        window:
          $ref: "#/components/schemas/RowsWindowRequest"
      required:
        - window
    RowsJoinPlanRequest:
      type: object
      additionalProperties: false
      description: Typed row-join plan envelope. Accepts exactly `join` plus optional ordered `ctes`, optional left/right table names, and paired `left_ranges` and `right_ranges`.
      properties:
        ctes:
          type: array
          items:
            $ref: "#/components/schemas/RowsCte"
        left_table:
          type: string
          description: Optional source table for the left side. Omitted or empty uses the endpoint table.
        right_table:
          type: string
          description: Optional source table for the right side. Omitted or empty uses the endpoint table.
        left_ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        right_ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        join:
          $ref: "#/components/schemas/RowsJoinRequest"
      required:
        - join
    RowsLateralPlanRequest:
      type: object
      additionalProperties: false
      description: Typed row-lateral plan envelope. Accepts exactly `lateral` plus optional ordered `ctes`, optional left/right table names, and paired `left_ranges` and `right_ranges`.
      properties:
        ctes:
          type: array
          items:
            $ref: "#/components/schemas/RowsCte"
        left_table:
          type: string
          description: Optional source table for the left side. Omitted or empty uses the endpoint table.
        right_table:
          type: string
          description: Optional source table for the right side. Omitted or empty uses the endpoint table.
        left_ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        right_ranges:
          type: array
          items:
            $ref: "#/components/schemas/RowsDocKeyRange"
        lateral:
          $ref: "#/components/schemas/RowsLateralRequest"
      required:
        - lateral
    RowsResultColumn:
      type: object
      additionalProperties: false
      description: Typed column metadata emitted by a native relational read plan.
      properties:
        name:
          type: string
          description: Unique public result-object field name.
        display_name:
          type: string
          nullable: true
          description: Optional SQL/display label for the result column. This value may be non-unique; use `name` as the stable object key.
        path:
          type: string
          description: Source path represented by this result field.
        type:
          type: string
          description: Antfly scalar/container type for the result field.
        array_item_type:
          type: string
          nullable: true
          description: Item type when `type` is `array`.
        collation:
          type: string
          nullable: true
          description: Optional source collation metadata for source-backed text or keyword result fields.
        nullable:
          type: boolean
          description: Whether the result field may be null.
      required:
        - name
        - path
        - type
        - nullable
    RowsQueryResultSet:
      type: object
      properties:
        total:
          type: integer
          format: int64
        total_exact:
          type: boolean
          description: False when `total` is a bounded or no-total value rather than an exact match count.
        result_schema:
          type: array
          items:
            $ref: "#/components/schemas/RowsResultColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    RowsAggregateResultSet:
      type: object
      properties:
        total_groups:
          type: integer
          format: int64
        result_schema:
          type: array
          items:
            $ref: "#/components/schemas/RowsResultColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    RowsStreamResultSet:
      type: object
      properties:
        total_rows:
          type: integer
          format: int64
        join_strategy:
          $ref: "#/components/schemas/RowsJoinStrategySelection"
        result_schema:
          type: array
          items:
            $ref: "#/components/schemas/RowsResultColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    MultiBatchRequest:
      type: object
      description: |
        Cross-table batch operations in a single atomic transaction.

        Groups batch operations by table name. All operations across all tables
        are committed atomically using distributed 2-phase commit (2PC).

        **Atomicity**: Either all operations across all tables succeed, or none do.
        This enables use cases like transferring a record from one table to another,
        or maintaining referential integrity across tables.
      required:
        - tables
      properties:
        tables:
          type: object
          description: |
            Map of table names to batch operations for that table.
            Each entry follows the same format as a single-table BatchRequest.
          additionalProperties:
            $ref: "#/components/schemas/BatchRequest"
          example:
            users:
              inserts:
                "user:123":
                  name: "John Doe"
                  email: "john@example.com"
            orders:
              inserts:
                "order:456":
                  user_id: "user:123"
                  total: 99.99
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
    MultiBatchResponse:
      type: object
      description: |
        Response for a cross-table batch operation. Contains per-table results.
      properties:
        tables:
          type: object
          description: Per-table batch results
          additionalProperties:
            $ref: "#/components/schemas/BatchResponse"
    TransactionReadItem:
      type: object
      description: |
        A key that was read as part of an OCC transaction, along with the version
        observed at read time. Used to detect conflicts at commit time.
      required:
        - table
        - key
        - version
      properties:
        table:
          type: string
          description: Table name the key belongs to
        key:
          type: string
          description: Document key that was read
        version:
          type: string
          description: |
            Version token observed at read time (from X-Antfly-Version header).
            Use "0" to assert the key did not exist at read time.
    TransactionCommitRequest:
      type: object
      description: |
        Stateless OCC (Optimistic Concurrency Control) transaction commit request.

        The client reads documents (capturing version tokens from the X-Antfly-Version
        response header on lookups), computes writes locally, then submits everything
        in this single commit request. The server validates that all read versions
        still match before executing writes atomically via 2PC.

        **No server-side state**: There is no "begin" endpoint. The client manages
        its own read set and submits the full transaction in one request.
      required:
        - read_set
        - tables
      properties:
        read_set:
          type: array
          description: |
            Set of keys that were read during the transaction, with their observed versions.
            The server verifies these versions still match before committing writes.
          items:
            $ref: "#/components/schemas/TransactionReadItem"
        tables:
          type: object
          description: |
            Write set: map of table names to batch operations, same format as MultiBatchRequest.tables.
          additionalProperties:
            $ref: "#/components/schemas/BatchRequest"
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
    TransactionCommitResponse:
      type: object
      description: Result of an OCC transaction commit attempt.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - committed
            - aborted
          description: Whether the transaction was committed or aborted due to a conflict
        conflict:
          type: object
          description: Details about the conflict that caused an abort (only present when status is "aborted")
          properties:
            table:
              type: string
              description: Table where the conflict was detected
            key:
              type: string
              description: Key that had a version mismatch
            message:
              type: string
              description: Human-readable conflict description
        tables:
          type: object
          description: Per-table batch results (only present when status is "committed")
          additionalProperties:
            $ref: "#/components/schemas/BatchResponse"
    TransactionBeginRequest:
      type: object
      properties:
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
    TransactionBeginResponse:
      type: object
      required:
        - transaction_id
        - begin_timestamp
        - sync_level
      properties:
        transaction_id:
          type: string
        begin_timestamp:
          type: integer
          format: int64
        sync_level:
          type: string
    TransactionStatusResponse:
      type: object
      required:
        - status
        - transaction_id
      properties:
        status:
          type: string
        transaction_id:
          type: string
    TransactionSavepointResponse:
      type: object
      required:
        - status
        - transaction_id
        - savepoint_id
      properties:
        status:
          type: string
        transaction_id:
          type: string
        savepoint_id:
          type: integer
          format: int64
    TransactionStageReadRequest:
      type: object
      required:
        - table
        - key
        - version
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: string
    TransactionStageWriteRequest:
      type: object
      required:
        - table
        - key
        - document
      properties:
        table:
          type: string
        key:
          type: string
        document:
          type: object
          additionalProperties: true
    TransactionStageDeleteRequest:
      type: object
      required:
        - table
        - key
      properties:
        table:
          type: string
        key:
          type: string
    TransactionStageReadSnapshot:
      type: object
      required:
        - table
        - key
        - version
        - document
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: string
        document:
          nullable: true
    TransactionStageReadResponse:
      type: object
      required:
        - status
        - transaction_id
        - snapshot
      properties:
        status:
          type: string
        transaction_id:
          type: string
        snapshot:
          $ref: "#/components/schemas/TransactionStageReadSnapshot"
    TransactionSessionCommitResponse:
      allOf:
        - $ref: "#/components/schemas/TransactionCommitResponse"
        - type: object
          required:
            - transaction_id
          properties:
            transaction_id:
              type: string
    TransactionSessionStatus:
      type: object
      required:
        - transaction_id
        - owner_node_id
        - begin_timestamp
        - last_touched_timestamp
        - lease_expires_at
        - lease_state
        - sync_level
        - staged_table_count
        - staged_read_count
        - staged_write_count
        - staged_delete_count
        - read_snapshot_count
        - savepoint_count
        - durable
      properties:
        transaction_id:
          type: string
        owner_node_id:
          type: integer
          format: int64
        begin_timestamp:
          type: integer
          format: int64
        last_touched_timestamp:
          type: integer
          format: int64
        lease_expires_at:
          type: integer
          format: int64
        lease_state:
          type: string
        sync_level:
          type: string
        staged_table_count:
          type: integer
        staged_read_count:
          type: integer
        staged_write_count:
          type: integer
        staged_delete_count:
          type: integer
        read_snapshot_count:
          type: integer
        savepoint_count:
          type: integer
        savepoint_limit:
          type: integer
          nullable: true
        remaining_savepoints:
          type: integer
          nullable: true
        durable:
          type: boolean
    TransactionSessionTableDetail:
      type: object
      properties:
        table:
          type: string
        staged_read_count:
          type: integer
        staged_write_count:
          type: integer
        staged_delete_count:
          type: integer
        staged_predicate_count:
          type: integer
    TransactionSessionReadSnapshot:
      type: object
      properties:
        table:
          type: string
        key:
          type: string
        version:
          type: integer
          format: int64
        document:
          nullable: true
    TransactionSessionDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/TransactionSessionStatus"
        - type: object
          properties:
            tables:
              type: array
              items:
                $ref: "#/components/schemas/TransactionSessionTableDetail"
            read_snapshots:
              type: array
              items:
                $ref: "#/components/schemas/TransactionSessionReadSnapshot"
            savepoint_ids:
              type: array
              items:
                type: integer
                format: int64
    TransactionSessionListResponse:
      type: object
      properties:
        session_count:
          type: integer
        lease_held_count:
          type: integer
        lease_expired_count:
          type: integer
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionSessionStatus"
    TransactionSessionCleanupResponse:
      type: object
      properties:
        removed:
          type: integer
        cutoff_ns:
          type: integer
          format: int64
    BackupRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: |
            Unique identifier for this backup. Used to reference the backup for restore operations.
            Choose a meaningful name that includes date/version information.
          example: "backup-2025-01-15-v2"
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Storage location for the backup. Supports multiple backends:
            - Scoped filesystem connection: `file:///logical/path`
            - Amazon S3: `s3://bucket-name/path/to/backup`
            - Google Cloud Storage: `gs://bucket-name/path/to/backup`

            The backup includes all table data, indexes, and metadata for the specified table.
          example: "s3://mybucket/antfly-backups/users-table/2025-01-15"
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            ID of a configured `external_io` connection. Required for every
            network API backup and restore. Object locations enforce bucket and
            prefix scopes; filesystem URI paths resolve beneath the connection root.
        format:
          type: string
          enum: [native, portable]
          default: portable
          description: |
            Backup format to use:
            - `native`: Engine-specific physical snapshot (fast backup and restore, same-backend only)
            - `portable`: Cross-backend logical backup in AFB format (slower restore due to index rebuild, but can be restored by any Antfly backend)

            On restore, the format is auto-detected from file magic bytes.
          example: "portable"
    RestoreRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: Identifier of the published backup to restore.
          example: "backup-2025-01-15-v2"
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Storage location containing the backup. The server detects the
            native or portable format from the published manifest and artifact.
          example: "s3://mybucket/antfly-backups/users-table/2025-01-15"
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            ID of a configured `external_io` connection with `restore.read`.
            Object locations enforce bucket and prefix scopes; filesystem URI
            paths resolve beneath the connection root.
    ClusterBackupRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: |
            Unique identifier for this backup. Used to reference the backup for restore operations.
            Choose a meaningful name that includes date/version information.
          example: "cluster-backup-2025-01-15"
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Storage location for the backup. Supports multiple backends:
            - Scoped filesystem connection: `file:///logical/path`
            - Amazon S3: `s3://bucket-name/path/to/backup`
            - Google Cloud Storage: `gs://bucket-name/path/to/backup`

            The backup includes all table data, indexes, and metadata.
          example: "s3://mybucket/antfly-backups/cluster/2025-01-15"
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: Required configured `external_io` connection with the `backup.write` capability.
        format:
          type: string
          enum: [native, portable]
          default: portable
          description: |
            Backup format to use:
            - `native`: Engine-specific physical snapshot (fast backup and restore, same-backend only)
            - `portable`: Cross-backend logical backup in AFB format (slower restore due to index rebuild, but can be restored by any Antfly backend)

            On restore, the format is auto-detected from file magic bytes.
          example: "portable"
        table_names:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: |
            Optional list of tables to backup. If omitted, all tables are backed up,
            up to the cluster backup limit of 4096 tables. Requests above that limit
            fail before any table backup is created.
          example: ["users", "products"]
    ClusterBackupResponse:
      type: object
      required:
        - backup_id
        - tables
        - status
      properties:
        backup_id:
          type: string
          description: The backup identifier
          example: "cluster-backup-2025-01-15"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableBackupStatus"
          description: Status of each table backup
        status:
          type: string
          enum: [completed, partial, failed]
          description: Overall backup status
          example: "completed"
    TableBackupStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Table name
          example: "users"
        status:
          type: string
          enum: [completed, failed, skipped]
          description: Backup status for this table
          example: "completed"
        error:
          type: string
          description: Error message if backup failed
    ClusterRestoreRequest:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - location
        - connection
      properties:
        backup_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: |
            Unique identifier of the backup to restore from.
          example: "cluster-backup-2025-01-15"
        location:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Storage location where the backup is stored.
          example: "s3://mybucket/antfly-backups/cluster/2025-01-15"
        connection:
          type: string
          minLength: 1
          maxLength: 4096
          description: Required configured `external_io` connection with the `restore.read` capability.
        table_names:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: |
            Optional list of tables to restore. If omitted, all tables in the backup are restored,
            up to the cluster restore limit of 4096 tables. Larger backups must be restored
            in explicit batches of at most 256 tables.
          example: ["users", "products"]
        restore_mode:
          type: string
          enum: [fail_if_exists, skip_if_exists, overwrite]
          default: fail_if_exists
          description: |
            How to handle existing tables:
            - `fail_if_exists`: Abort if any table already exists (default)
            - `skip_if_exists`: Skip existing tables, restore others
            - `overwrite`: Atomically replace existing table generations after staging and validation
          example: "skip_if_exists"
    ClusterRestoreResponse:
      type: object
      required:
        - tables
        - status
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRestoreStatus"
          description: Status of each table restore
        status:
          type: string
          enum: [completed, triggered, durability_pending, partial, failed]
          description: Overall restore status
          example: "completed"
    TableRestoreStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Table name
          example: "users"
        status:
          type: string
          enum: [triggered, committed, durability_pending, skipped, failed]
          description: Restore status for this table
          example: "triggered"
        error:
          type: string
          description: Error message if restore failed
    BackupInfo:
      type: object
      required:
        - backup_id
        - timestamp
        - tables
        - location
      properties:
        backup_id:
          type: string
          description: The backup identifier
          example: "cluster-backup-2025-01-15"
        timestamp:
          type: string
          format: date-time
          description: When the backup was created
          example: "2025-01-15T10:30:00Z"
        tables:
          type: array
          items:
            type: string
          description: Tables included in the backup
          example: ["users", "products"]
        location:
          type: string
          description: Storage location of the backup
          example: "s3://mybucket/antfly-backups/cluster/2025-01-15"
        antfly_version:
          type: string
          description: Antfly version that created the backup
          example: "v1.0.0"
        format:
          type: string
          enum: [native, portable]
          description: Backup format used
          example: "portable"
    BackupListResponse:
      type: object
      required:
        - backups
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupInfo"
          maxItems: 1000
          description: One page of available backups in stable manifest-key order.
        next_cursor:
          type: string
          description: Opaque continuation cursor. Omitted when no additional backups remain.
    QueryBuilderRequest:
      type: object
      required:
        - intent
      properties:
        session_id:
          type: string
          description: Correlation identifier for a bounded agent interaction. In Phase 1 this is echoed back to the client but does not imply server-side session persistence.
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/AgentDecision"
          description: Structured answers provided by the user as part of client-carried continuation.
        interactive:
          type: boolean
          default: true
          description: If true, the agent may return clarification questions when needed.
        max_internal_iterations:
          type: integer
          minimum: 0
          maximum: 20
          description: Additive bounded-agent field for the query builder. Phase 1 remains a single-pass generation flow, but this field is echoed in result accounting.
        max_user_clarifications:
          type: integer
          minimum: 0
          maximum: 10
          description: Maximum number of clarification turns the agent may request from the user.
        require_decision_after:
          type: integer
          minimum: 0
          maximum: 20
          description: Force a user-facing decision after this many unresolved internal passes.
        example_documents:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional example documents to help the query builder infer field shapes and representative values. When omitted and the table has data but no schema, the server samples up to one document automatically.
        table:
          type: string
          description: Name of the table to build query for. If provided, uses table schema for field context.
          example: "articles"
        intent:
          type: string
          description: Natural language description of the search intent
          example: "Find all published articles about machine learning from the last year"
        schema_fields:
          type: array
          items:
            type: string
          description: List of searchable field names to consider. Overrides table schema if provided.
          example: ["title", "content", "status", "published_at"]
        mode:
          type: string
          description: |
            Optional strategy hint for the coordinator. Suggested values are `auto`, `full_text`,
            `semantic`, `hybrid`, `filter`, `tree`, and `graph`. Unknown values are accepted for
            forward compatibility and may fall back to `auto`.
          example: "auto"
        output:
          type: string
          description: |
            Preferred output artifact. Suggested values are `query_request`, `bleve`, and
            `filter_query`. The compatibility `query` field is still returned for existing clients.
          example: "query_request"
        constraints:
          type: object
          additionalProperties: true
          description: |
            Optional execution constraints for the coordinator, such as `limit`, `allowed_fields`,
            `prefer_indexes`, and `require_executable`.
          example:
            limit: 10
            require_executable: true
            prefer_indexes: ["body_embedding"]
        generator:
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
    QueryBuilderResult:
      type: object
      required:
        - query
      properties:
        session_id:
          type: string
          description: Correlation identifier for client-carried continuation.
        iteration:
          type: integer
          description: Number of internal passes consumed while producing this result.
        clarification_count:
          type: integer
          description: Number of user clarification turns already consumed in this interaction.
        status:
          $ref: "#/components/schemas/AgentStatus"
          description: Current status of the bounded query-builder execution.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStep"
          description: Shared bounded-agent execution trace for this query-builder run.
        remaining_internal_iterations:
          type: integer
          description: Remaining internal reasoning passes for this interaction.
        remaining_user_clarifications:
          type: integer
          description: Remaining clarification turns allowed for this interaction.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AgentQuestion"
          description: Clarification questions exposed in the shared bounded-agent envelope.
        query:
          type: object
          description: |
            Generated search query in native Bleve format.
            Can be used directly in QueryRequest.full_text_search or filter_query.
          additionalProperties: true
          example:
            conjuncts:
              - match: "machine learning"
                field: "content"
              - term: "published"
                field: "status"
        query_request:
          $ref: "#/components/schemas/QueryRequest"
          description: |
            Antfly query request assembled by the coordinator. New clients should prefer this
            field when they want an executable Antfly query object.
        retrieval_query_request:
          $ref: "#/components/schemas/RetrievalQueryRequest"
          description: |
            Antfly retrieval query assembled by the coordinator when the requested artifact
            needs retrieval-only features such as tree_search. This is additive to
            query_request for clients that execute through the retrieval agent pipeline.
        specialist:
          type: string
          description: Specialist or strategy used to build the query, such as `full_text`, `filter`, or `hybrid`.
          example: "full_text"
        plan:
          type: object
          additionalProperties: true
          description: Optional machine-readable coordination plan for observability.
        explanation:
          type: string
          description: Human-readable explanation of what the query does and why it was structured this way
          example: "Searches for 'machine learning' in content field AND requires status to be exactly 'published'"
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Model's confidence in the generated query (0.0-1.0)
          example: 0.85
        warnings:
          type: array
          items:
            type: string
          description: Any issues, limitations, or assumptions made when generating the query
          example:
            [
              "Field 'category' not found in schema, using content field instead",
            ]

    # ==========================================
    # Retrieval Agent - Agentic document retrieval with tool calling
    # ==========================================

    IncompleteDetails:
      type: object
      description: Explains why the agent stopped before completion. Present when status is "incomplete".
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - max_internal_iterations
            - max_tokens
            - no_tools
            - clarification_required
          description: |
            Why the agent stopped:
            - max_internal_iterations: Hit the configured max_internal_iterations limit
            - max_tokens: LLM output was truncated
            - no_tools: No tools were available for agentic mode
            - clarification_required: The agent needs a user decision before it can continue

    RetrievalStrategy:
      type: string
      enum:
        - semantic
        - bm25
        - metadata
        - tree
        - graph
        - hybrid
      description: |
        Strategy for document retrieval:
        - semantic: Vector similarity search using embeddings
        - bm25: Full-text search using BM25 scoring
        - metadata: Structured query on document fields
        - tree: Iterative tree navigation with summarization
        - graph: Relationship-based traversal
        - hybrid: Combine multiple strategies with RRF or rerank

    TreeSearchConfig:
      type: object
      description: |
        Configuration for tree search strategy. Tree search navigates hierarchical
        document structures by evaluating summaries at each level.
      required:
        - index
      properties:
        index:
          type: string
          description: Name of the graph index to use for tree navigation
          example: "doc_hierarchy"
        start_nodes:
          type: string
          description: |
            Starting nodes for tree search:
            - "$roots" - Query for root nodes (nodes with no parents)
            - Comma-separated explicit node IDs
            When omitted and combined with a QueryRequest in a RetrievalQueryRequest,
            the query results are used as start nodes.
          example: "$roots"
        max_depth:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Maximum depth to traverse in the tree
        beam_width:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: Number of branches to explore at each level

    RetrievalQueryRequest:
      description: |
        A query in the retrieval pipeline. Extends QueryRequest with an optional
        tree search configuration. Each query specifies its own table.

        When both search fields (semantic_search, full_text_search) and tree_search
        are provided, the search results are used as start nodes for tree navigation.
      allOf:
        - $ref: "#/components/schemas/QueryRequest"
        - type: object
          properties:
            tree_search:
              $ref: "#/components/schemas/TreeSearchConfig"
              description: Optional tree search configuration

    AgentQuestionKind:
      type: string
      enum:
        - confirm
        - single_choice
        - multi_choice
        - free_text
        - field_policy
      description: UI rendering/answer handling hint for a bounded agent question

    AgentQuestion:
      type: object
      required:
        - id
        - kind
        - question
      properties:
        id:
          type: string
          description: Stable question identifier for client-carried continuation
          example: "clarify_oauth_version"
        kind:
          $ref: "#/components/schemas/AgentQuestionKind"
        question:
          type: string
          description: The clarifying question to ask the user
        reason:
          type: string
          description: Why clarification is needed
        options:
          type: array
          items:
            type: string
          description: Optional list of choices for the user
        default_answer:
          type: string
          description: Suggested default answer when the server has a preferred choice
        affects:
          type: array
          items:
            type: string
          description: High-level result areas affected by this decision

    AgentDecision:
      type: object
      required:
        - question_id
      properties:
        question_id:
          type: string
          description: The question being answered
        answer:
          description: User answer, scalar or structured depending on the question kind
        approved:
          type: boolean
          description: Used for confirm/review steps where the draft may be accepted as-is

    AgentStatus:
      type: string
      enum:
        - clarification_required
        - completed
        - in_progress
        - incomplete
        - failed
      description: Shared bounded-agent execution status

    AgentStepKind:
      type: string
      enum:
        - tool_call
        - planning
        - classification
        - generation
        - validation
        - clarification
      description: Shared bounded-agent step category

    AgentStepStatus:
      type: string
      enum:
        - success
        - error
        - skipped
      description: Outcome of a shared agent step

    AgentStep:
      type: object
      description: A step in the shared bounded-agent execution trace
      required:
        - name
        - action
      properties:
        id:
          type: string
          description: Unique step ID for correlation and tracing
        kind:
          $ref: "#/components/schemas/AgentStepKind"
        name:
          type: string
          description: Stable step name used for correlation across JSON and SSE surfaces
        action:
          type: string
          description: What action was taken
        status:
          $ref: "#/components/schemas/AgentStepStatus"
        error_message:
          type: string
          description: Error details when status is "error"
        duration_ms:
          type: integer
          description: Server-side execution time in milliseconds
        details:
          type: object
          additionalProperties: true
          description: Additional details about the step

    # --- SSE Event Schemas for Retrieval Agent streaming ---

    SSEEvent:
      type: string
      description: SSE event types emitted by the retrieval agent streaming endpoint
      enum:
        - step_started
        - step_progress
        - step_completed
        - classification
        - reasoning
        - generation
        - followup
        - hit
        - tool_mode
        - eval
        - error
        - done

    SSEStepStarted:
      type: object
      description: Emitted when a pipeline step begins execution
      required:
        - id
        - name
        - action
      properties:
        id:
          type: string
          description: Unique step ID for correlating with step_completed
          example: "step_cr3ig20h5tbs73e3ahrg"
        kind:
          $ref: "#/components/schemas/AgentStepKind"
        name:
          type: string
          description: Stable step name used for correlation across JSON and SSE surfaces
        action:
          type: string
          description: Human-readable description of the action being taken
          example: "Searching for OAuth configuration in doc_embeddings index"

    SSEStepProgress:
      type: object
      description: |
        Emitted to report progress within a running step. The `name` field
        identifies which step this progress belongs to. Additional properties
        vary by step type (e.g., tree_search includes depth, num_nodes, sufficient, etc.).
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the step this progress belongs to
          example: "tree_search"
      additionalProperties: true

    SSEStepCompleted:
      $ref: "#/components/schemas/AgentStep"

    SSEToolMode:
      type: object
      description: Emitted when the agent selects a tool-calling mode
      required:
        - mode
      properties:
        mode:
          type: string
          description: Tool calling mode selected
          enum:
            - native
            - structured_output
        tools_count:
          type: integer
          description: Number of tools available (present for native mode)

    SSEError:
      type: object
      description: Emitted when an error occurs during retrieval
      required:
        - error
      properties:
        error:
          type: string
          description: Error message

    PruneStats:
      type: object
      description: Statistics from token-based document pruning
      properties:
        resources_kept:
          type: integer
          description: Number of resources kept after pruning
        resources_pruned:
          type: integer
          description: Number of resources pruned to fit token budget
        tokens_kept:
          type: integer
          description: Estimated tokens in kept resources
        tokens_pruned:
          type: integer
          description: Estimated tokens in pruned resources

    RetrievalAgentUsage:
      type: object
      description: Token usage and resource statistics from the retrieval agent execution
      properties:
        input_tokens:
          type: integer
          description: Total input tokens across all LLM calls
        output_tokens:
          type: integer
          description: Total output tokens across all LLM calls
        total_tokens:
          type: integer
          description: Sum of input + output tokens
        cached_input_tokens:
          type: integer
          description: Input tokens served from cache
        llm_calls:
          type: integer
          description: Number of LLM invocations made
        resources_retrieved:
          type: integer
          description: Total resources found across all search queries
        prune_stats:
          $ref: "#/components/schemas/PruneStats"
          description: Token pruning statistics, present when max_context_tokens was configured

    RetrievalStepConfig:
      type: object
      description: |
        Configuration for the retrieval step. Retrieval tools are constrained by
        the top-level request tools policy when both are present.
      properties:
        tools:
          $ref: "generating.yaml#/components/schemas/ChatToolsConfig"
          description: |
            Tool configuration for the retrieval step. When set, this narrows
            the top-level tools policy for retrieval execution.

    RetrievalAgentSteps:
      type: object
      description: |
        Configuration for the retrieval agent's pipeline steps and tool-use behavior.
        Each step can have its own generator (or chain of generators) and step-specific options.
        If a step is not configured, it is skipped (retrieval always runs).
      properties:
        classification:
          $ref: "generating.yaml#/components/schemas/ClassificationStepConfig"
          description: |
            Configuration for query classification and transformation.
            When set, runs classification before retrieval to select the optimal
            strategy (simple/decompose/step_back/hyde) and transform the query.
        retrieval:
          $ref: "#/components/schemas/RetrievalStepConfig"
          description: |
            Configuration for retrieval tool execution. Retrieval-step tools
            narrow the top-level tools policy when both are provided.
        generation:
          $ref: "generating.yaml#/components/schemas/GenerationStepConfig"
          description: |
            Configuration for generation from retrieved documents.
            When set, generates a response with citations after retrieval completes.
        followup:
          $ref: "generating.yaml#/components/schemas/FollowupStepConfig"
          description: |
            Configuration for generating follow-up questions.
            Requires steps.generation to be set.
        confidence:
          $ref: "generating.yaml#/components/schemas/ConfidenceStepConfig"
          description: |
            Configuration for confidence assessment of the generated response.
            Requires steps.generation to be set.
        eval:
          $ref: "eval.yaml#/components/schemas/EvalConfig"
          description: |
            Configuration for inline evaluation. Runs evaluators on retrieved
            documents and/or generated response. Requires steps.generation for
            generation-quality evaluators (faithfulness, completeness, etc.).

    RetrievalAgentRequest:
      type: object
      description: |
        Request for the retrieval agent. Queries define which tables and indexes
        to search, each as a QueryRequest with optional tree search configuration.

        **Pipeline mode** (default, max_internal_iterations=0): Queries are executed
        directly without an LLM tool-calling loop.

        **Agentic mode** (max_internal_iterations > 0): The LLM decides which tools to
        call, using the queries to determine available tables and indexes.

        Authenticated row filters are enforced on every initial and generated
        operation in both modes, including scans, aggregates, and graph/tree
        traversal. They cannot be replaced or weakened by model tool arguments.
      required:
        - query
        - queries
      properties:
        query:
          type: string
          description: User's natural language query
          example: "How do I configure OAuth?"
        queries:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalQueryRequest"
          description: |
            Queries to execute. Each query carries its own table via the
            QueryRequest table field.

            In pipeline mode (max_internal_iterations=0), these are executed directly.
            In agentic mode, these declare which table and indexes are available.

            `filter_query` and `exclusion_query` are mandatory table predicates
            for retrieval-agent execution. Predicates declared by any query for
            a table are conjoined (or unioned for exclusions) and applied to
            every initial query, generated refinement, probe, aggregation,
            graph/tree traversal, root scan, and follow-up for that table.
            They cannot be weakened by generated operations.
          example:
            - table: "docs"
              semantic_search: "How do I configure OAuth?"
              indexes: ["doc_embeddings"]
              limit: 10
        messages:
          type: array
          items:
            $ref: "../shared/generating.yaml#/components/schemas/ChatMessage"
          description: Optional conversational context for the current turn. Decisions remain the authoritative continuation input for bounded agent interactions.
        agent_knowledge:
          type: string
          description: |
            Domain-specific knowledge to include in the agent's system prompt.
            Useful for providing context about the document collection.
          example: "This collection contains API documentation for the Acme product suite."
        accumulated_filters:
          type: array
          items:
            $ref: "generating.yaml#/components/schemas/FilterSpec"
          description: |
            Mandatory filters from prior interactions. These are converted to
            structured Antfly predicates and applied to every table and every
            search tool invocation, including generated follow-ups, graph/tree
            traversal, aggregations, and root scans.
        session_id:
          type: string
          description: Correlation identifier for a bounded agent interaction. This is echoed back to the client and does not imply server-side session persistence.
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/AgentDecision"
          description: Structured answers provided by the user as part of client-carried continuation.
        interactive:
          type: boolean
          default: true
          description: If true, the agent may return clarification questions when needed.
        max_internal_iterations:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: |
            Maximum number of internal tool-calling rounds.

            - 0: Pipeline mode — execute provided queries directly, no LLM loop
            - 1+: Agentic mode — LLM decides which tools to call
        max_user_clarifications:
          type: integer
          minimum: 0
          maximum: 10
          description: Maximum number of clarification turns the agent may request from the user.
        require_decision_after:
          type: integer
          minimum: 0
          maximum: 20
          description: Force a user-facing decision after this many unresolved internal passes.
        max_context_tokens:
          type: integer
          description: |
            Maximum tokens for document context in tool responses. Documents
            exceeding this limit are pruned to fit.
        reserve_tokens:
          type: integer
          description: |
            Tokens to reserve for system prompt, answer generation, and other overhead.
            Subtracted from max_context_tokens to determine available context budget.
            Defaults to 4000 if max_context_tokens is set.
          default: 4000
          minimum: 0
          example: 4000
        stream:
          type: boolean
          default: true
          description: Enable SSE streaming vs JSON response
        generator:
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
          description: Generator for the retrieval agent's LLM calls
        chain:
          type: array
          items:
            $ref: "../shared/generating.yaml#/components/schemas/ChainLink"
          description: Chain of generators
        tools:
          $ref: "generating.yaml#/components/schemas/ChatToolsConfig"
          description: |
            Default tool policy for this agent run. Step-specific tool policies
            narrow this default for their step; retrieval currently uses
            steps.retrieval.tools.
        steps:
          $ref: "#/components/schemas/RetrievalAgentSteps"
          description: Step configuration
        document_renderer:
          type: string
          description: |
            Handlebars template for rendering documents in the generation prompt.
            Default uses TOON format for token efficiency.
            Requires steps.generation to be set.
          example: "{{encodeToon this.fields}}"

    RetrievalAgentResult:
      type: object
      description: Result from the retrieval agent
      required:
        - hits
        - status
      properties:
        id:
          type: string
          description: Unique response ID for logging and tracing
          example: "ragr_cr3ig20h5tbs73e3ahrg"
        model:
          type: string
          description: LLM model used for generation
          example: "gemini-2.0-flash"
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the response was created
        status:
          $ref: "#/components/schemas/AgentStatus"
          description: Current status of the bounded agent execution
        incomplete_details:
          $ref: "#/components/schemas/IncompleteDetails"
          description: Present when status is "incomplete" — explains why
        usage:
          $ref: "#/components/schemas/RetrievalAgentUsage"
          description: Token usage and resource statistics from this execution
        hits:
          type: array
          items:
            $ref: "#/components/schemas/QueryHit"
          description: Retrieved query hits
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStep"
          description: Shared bounded-agent execution trace for this retrieval run.
        strategy_used:
          $ref: "#/components/schemas/RetrievalStrategy"
          description: Primary strategy that was used (optional in agentic mode)
        session_id:
          type: string
          description: Correlation identifier for client-carried continuation.
        iteration:
          type: integer
          description: Current internal iteration count for this bounded session.
        clarification_count:
          type: integer
          description: Number of user clarification turns already consumed in this session.
        remaining_internal_iterations:
          type: integer
          description: Remaining internal reasoning/tool-use iterations for this session.
        remaining_user_clarifications:
          type: integer
          description: Remaining clarification turns allowed for this session.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AgentQuestion"
          description: Clarification questions exposed in the shared bounded-agent envelope.
        applied_filters:
          type: array
          items:
            $ref: "generating.yaml#/components/schemas/FilterSpec"
          description: Filters that were applied during retrieval
        tool_calls_made:
          type: integer
          description: Total number of tool calls made during retrieval
        messages:
          type: array
          items:
            $ref: "../shared/generating.yaml#/components/schemas/ChatMessage"
          description: |
            Optional conversational context including tool calls and responses.
            Decisions remain the authoritative continuation input for bounded agent interactions.
        classification:
          $ref: "generating.yaml#/components/schemas/ClassificationTransformationResult"
          description: |
            Query classification and transformation result. Present when
            steps.classification was configured. Includes strategy, semantic_query,
            sub_questions (decompose), step_back_query, and reasoning.
        generation:
          type: string
          description: |
            Generated response in markdown format. Present when steps.generation
            was configured.
        generation_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Confidence in the generated response (requires steps.confidence)
        context_relevance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance of retrieved documents to the query (requires steps.confidence)
        followup_questions:
          type: array
          items:
            type: string
          description: Suggested follow-up questions (requires steps.followup)
        eval_result:
          $ref: "eval.yaml#/components/schemas/EvalResult"
          description: Evaluation results when steps.eval was configured

    # ==========================================
    # Answer Agent (DEPRECATED) - Backward-compatible wrapper for Retrieval Agent
    # ==========================================

    AnswerAgentSteps:
      type: object
      deprecated: true
      description: |
        DEPRECATED: Use RetrievalAgentSteps instead.
        Configuration for the answer agent's pipeline steps.
      properties:
        classification:
          $ref: "generating.yaml#/components/schemas/ClassificationStepConfig"
          description: Configuration for query classification and transformation.
        answer:
          $ref: "generating.yaml#/components/schemas/GenerationStepConfig"
          description: |
            DEPRECATED: Use steps.generation on RetrievalAgentRequest instead.
            Configuration for answer generation from retrieved documents.
        followup:
          $ref: "generating.yaml#/components/schemas/FollowupStepConfig"
          description: Configuration for generating follow-up questions.
        confidence:
          $ref: "generating.yaml#/components/schemas/ConfidenceStepConfig"
          description: Configuration for confidence assessment.

    AnswerAgentRequest:
      type: object
      deprecated: true
      description: |
        DEPRECATED: Use RetrievalAgentRequest instead.
        Request for the answer agent. Accepts the old request format and
        internally delegates to the retrieval agent.
      required:
        - query
        - queries
      properties:
        query:
          type: string
          description: User's natural language query
        queries:
          type: array
          items:
            $ref: "#/components/schemas/QueryRequest"
          description: Queries to execute. Each query specifies its own table.
        with_streaming:
          type: boolean
          default: true
          description: |
            DEPRECATED: Use stream on RetrievalAgentRequest instead.
            Enable SSE streaming vs JSON response.
        generator:
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
          description: Generator for LLM calls
        chain:
          type: array
          items:
            $ref: "../shared/generating.yaml#/components/schemas/ChainLink"
          description: Chain of generators
        agent_knowledge:
          type: string
          description: Domain-specific knowledge for the agent
        max_context_tokens:
          type: integer
          description: Maximum tokens for document context
        reserve_tokens:
          type: integer
          description: Tokens to reserve for overhead
          default: 4000
        steps:
          $ref: "#/components/schemas/AnswerAgentSteps"
          description: Step configuration
        eval:
          $ref: "eval.yaml#/components/schemas/EvalConfig"
          description: |
            DEPRECATED: Use steps.eval on RetrievalAgentRequest instead.
            Evaluation configuration (moved to steps.eval in new API).
        without_generation:
          type: boolean
          default: false
          description: |
            DEPRECATED: Omit steps.generation on RetrievalAgentRequest instead.
            If true, skip the generation step.

    AnswerAgentResult:
      type: object
      deprecated: true
      description: |
        DEPRECATED: Use RetrievalAgentResult instead.
        Result from the answer agent.
      properties:
        answer:
          type: string
          description: |
            DEPRECATED: Use generation on RetrievalAgentResult instead.
            Generated answer in markdown format.
        answer_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: |
            DEPRECATED: Use generation_confidence on RetrievalAgentResult instead.
            Confidence in the generated answer.
        context_relevance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance of retrieved documents to the query
        classification_transformation:
          $ref: "generating.yaml#/components/schemas/ClassificationTransformationResult"
          description: |
            DEPRECATED: Use classification on RetrievalAgentResult instead.
            Query classification and transformation result.
        query_results:
          type: array
          items:
            $ref: "#/components/schemas/QueryResult"
          description: |
            DEPRECATED: Use hits on RetrievalAgentResult instead.
            Query results grouped by table.
        followup_questions:
          type: array
          items:
            type: string
          description: Suggested follow-up questions
        eval_result:
          $ref: "eval.yaml#/components/schemas/EvalResult"
          description: Evaluation results

    # ==========================================
    # Shared value type for the embeddings map (dense or sparse).
    Embedding:
      oneOf:
        - type: array
          items:
            type: number
            format: float
          description: Dense embedding as an array of floats, e.g. `[0.1, 0.2, 0.3]`
        - type: object
          required: [indices, values]
          properties:
            indices:
              type: array
              items:
                type: integer
                x-go-type: uint32
            values:
              type: array
              items:
                type: number
                format: float
          description: Sparse embedding with `indices` and `values` arrays
        - type: string
          format: byte
          description: |
            Packed dense embedding as a base64-encoded string of raw little-endian float32 bytes.
            This is ~4x more compact than the JSON array format. For example, a 3-dimensional
            vector `[1.0, 2.0, 3.0]` is encoded as base64(12 bytes of little-endian float32s).
        - type: object
          required: [packed_indices, packed_values]
          properties:
            packed_indices:
              type: string
              format: byte
              description: Base64-encoded little-endian uint32 bytes for sparse indices
            packed_values:
              type: string
              format: byte
              description: Base64-encoded little-endian float32 bytes for sparse values
          description: |
            Packed sparse embedding with base64-encoded indices and values.
            Same semantics as the sparse object format but more compact on the wire.

    # Generation Agent - Document-to-response generation
    # ==========================================

    QueryRequest: # Based on remoteindex.Query
      type: object
      properties:
        table:
          type: string
          description: Name of the table to query. Optional for global queries.
          example: "wikipedia"
        query:
          x-go-type: json.RawMessage
          type: object
          additionalProperties: true
          description: |
            Canonical public query AST. Prefer this field for new clients.

            Boolean clauses are normalized before planning:
            - `bool.must` is scoring query input.
            - `bool.filter` is non-scoring query input.
            - `bool.must_not` is non-scoring exclusion query input.

            Filter branches accept the same query variants as `filter_query` and
            `exclusion_query`. Structured clauses use the native document-value
            path; text clauses are resolved through the text index before scoring.
          example:
            bool:
              must:
                - match:
                    field: body
                    text: "computer"
              filter:
                - term:
                    path: /tenant
                    value: "acme"
              must_not:
                - exists:
                    path: /deleted_at
        full_text_search:
          allOf:
            - $ref: "query.yaml#/components/schemas/Query"
            - x-go-type: json.RawMessage
              type: object
              additionalProperties: true
          description: |
            Antfly query for full-text search. Supports all Antfly query types.

            See specs/openapi/antfly/query.yaml for complete type definitions.

            Examples:
            - Simple: `{"query": "computer"}`
            - Field-specific: `{"query": "body:computer"}`
            - Boolean: `{"query": "+artificial +intelligence"}`
            - Range: `{"query": "year:>2020"}`
            - Phrase: `{"query": "\"exact phrase\""}`
          example:
            query: "+body:computer +category:technology"
            boost: 1.0
        semantic_search:
          type: string
          x-antfly-max-utf8-bytes: 1048576
          description: |
            Natural language query for vector similarity search. Results are ranked by semantic similarity
            to the query and can be combined with full_text_search using Reciprocal Rank Fusion (RRF).

            The semantic_search string is automatically embedded using the configured embedding model
            for the specified indexes. UTF-8 input is limited to 1 MiB. Use `embedding_template` for
            multimodal queries.
          example: "artificial intelligence and machine learning applications"
        embedding_template:
          type: string
          x-antfly-max-utf8-bytes: 65536
          description: |
            Optional Handlebars template for multimodal embedding of the semantic_search query.
            The template has access to `this` which contains the semantic_search string value.

            UTF-8 template input is limited to 64 KiB.

            Use this when you want to embed template-time multimodal content instead of
            just text. The template is rendered using dotprompt with access to remote content helpers.

            **Available Helpers**:
            - `remoteMedia url=<url>` - Fetches and embeds remote images/media
            - `remotePDF url=<url>` - **Deprecated.** Fetches and extracts text from born-digital PDFs
            - `remoteText url=<url>` - Fetches and includes remote text content

            Use a `document_extraction` asset producer when PDF pages and chunks must be persisted
            and reprocessed. `remoteMedia` and the other helpers only prepare template-time inference input.

            **Examples**:
            - Legacy PDF search: `{{remotePDF url=this}}`
            - Image search: `{{remoteMedia url=this}}`
            - Mixed: `Search for: {{this}} {{#if this}}{{remoteMedia url=this}}{{/if}}`

            When not specified, the semantic_search string is embedded as plain text.
          example: "{{remoteMedia url=this}}"
        indexes:
          type: array
          items:
            type: string
          description: |
            List of vector index names to use for semantic search. Required when using semantic_search.
            Multiple indexes can be specified, and their results will be merged using RRF.
          example: ["title_body_nomic", "description_embedding"]
        filter_prefix:
          type: string
          format: byte
          description: |
            Filter results by key prefix. Only returns documents whose keys start with this string.
            Applied before scoring to improve performance.

            Common use cases:
            - Multi-tenant filtering: `"tenant:acme:"`
            - User-specific data: `"user:123:"`
            - Document type filtering: `"article:"`
        filter_query:
          allOf:
            - $ref: "query.yaml#/components/schemas/Query"
            - x-go-type: json.RawMessage
          description: |
            Antfly query applied as an AND condition. Documents must match both the main query
            and this filter. Applied before scoring for better performance.

            See specs/openapi/antfly/query.yaml for complete type definitions.

            Use for:
            - Status filtering: `"status:published"`
            - Date ranges: `"created_at:>2023-01-01"`
            - Category filtering: `"+category:technology +language:en"`
            - Geo bounding boxes: `{"geo_bbox":{"field":"location","min_lat":-1,"min_lon":179.5,"max_lat":1,"max_lon":-179.5}}`

            For structured `geo_bbox`, `min_lon > max_lon` intentionally
            represents a bounding box that crosses the antimeridian.
          example:
            query: "+category:technology +year:>2020"
            boost: 1.0
        exclusion_query:
          allOf:
            - $ref: "query.yaml#/components/schemas/Query"
            - x-go-type: json.RawMessage
          description: |
            Antfly query applied as a NOT condition. Documents matching this query are excluded
            from results. Applied before scoring.

            See specs/openapi/antfly/query.yaml for complete type definitions.

            Use for:
            - Excluding drafts: `"status:draft"`
            - Removing deprecated content: `"deprecated:true"`
            - Filtering out archived items: `"status:archived"`
          example:
            query: "category:deprecated OR status:archived"
            boost: 1.0
        aggregations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AggregationRequest"
          description: |
            Aggregation requests for computing metrics and bucketing results.
            Each key is a user-defined name for the aggregation, and the value specifies the aggregation configuration.

            Supports metric aggregations (sum, avg, min, max, count, stats, cardinality),
            bucketing aggregations (terms, range, date_range, histogram, date_histogram),
            geo aggregations (geohash_grid, geo_distance), and analytics (significant_terms).

            Example:
            ```json
            {
              "price_stats": {
                "type": "stats",
                "field": "price"
              },
              "categories": {
                "type": "terms",
                "field": "category",
                "size": 10
              }
            }
            ```
        embeddings:
          type: object
          description: |
            Pre-computed embeddings to use for semantic searches instead of embedding the semantic_search string.
            The keys are the index names. Values can be either:
            - **Dense (array)**: an array of floats, e.g. `[0.1, 0.2, 0.3]`
            - **Dense (packed)**: a base64 string of little-endian float32 bytes (~4x more compact)
            - **Sparse**: an object with `indices` (array of ints) and `values` (array of floats),
              e.g. `{"indices": [1, 5, 100], "values": [0.3, 0.7, 0.1]}`
            - **Sparse (packed)**: an object with `packed_indices` (base64 uint32 LE) and `packed_values` (base64 float32 LE)

            Use when you've already generated embeddings on the client side to avoid redundant embedding calls.
          additionalProperties:
            $ref: "#/components/schemas/Embedding"
        search_effort:
          x-go-type-skip-optional-pointer: false
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.5
          description: |
            Controls the vector search recall/latency tradeoff for semantic searches.

            - `0.0` = fastest, lowest recall
            - `0.5` = balanced default
            - `1.0` = highest recall

            When omitted, Antfly uses the balanced default effort (`0.5`) unless
            lower-level vector search overrides are provided internally.
          example: 0.5
        fields:
          type: array
          description: |
            List of fields to include in the results. If not specified, all fields are returned.
            Use to reduce response size and improve performance.
          items:
            type: string
          example: ["title", "url", "summary", "created_at"]
        limit:
          type: integer
          description: |
            Maximum number of results to return. For semantic_search, this is the topk parameter.
            Default varies by query type (typically 10).
          example: 20
        offset:
          type: integer
          description: |
            Number of results to skip for pagination. Supported for text-backed,
            match_all, and filter-only requests. Not supported for semantic_search
            due to vector index limitations.
          example: 0
        timeout_ms:
          type: integer
          minimum: 0
          description: |
            Optional query execution deadline in milliseconds. The server applies this as a
            cooperative deadline across query planning, search execution, aggregation reruns,
            sorting, and response post-processing. If the deadline expires before the query
            completes, the HTTP API returns 504. When omitted, semantic query embedding planning
            and provider I/O use a 30-second default deadline.
          example: 5000
        order_by:
          type: array
          items:
            $ref: '#/components/schemas/SortField'
          description: |
            Sort order for results. Array of sort fields with direction.
            Antfly appends `_id` ascending as a stable tie-breaker when it is omitted.
            Supported for exact text-backed, match_all, and filter-only requests
            when each non-`_id` field is a mapped exact scalar field with sortable
            native doc-value coverage. Sortable mapping types are keyword,
            numeric/number/integer, boolean/bool, datetime/date/timestamp, and
            link. Analyzed `text` fields and `search_as_you_type`, geo, embedding,
            blob, html, object, and array fields are not directly sortable; sort
            on an exact scalar mapping such as `title.keyword` instead. Requests
            that cannot be executed through an exact native sort path return 422
            rather than falling back to stored JSON sorting. Semantic searches
            are always sorted by similarity score. Not supported when `count` is true.
          example:
            - field: created_at
              desc: true
            - field: score
              desc: true
        search_after:
          type: array
          items: {}
          description: |
            Cursor for forward pagination. Pass the `_sort` values from the last hit
            of the previous page exactly, including the appended `_id` tie-breaker.
            Values preserve their JSON types; for example numbers remain numbers,
            booleans remain booleans, and strings remain strings. Cursor values
            must be replayable JSON scalars; nulls, arrays, objects, and non-finite
            numbers are rejected.
            Mutually exclusive with `offset`.
            When `order_by` is omitted, Antfly uses `_id` ascending as the effective
            order and the cursor tuple must contain exactly one `_id` string.
            Supported for exact text-backed, match_all, and filter-only requests;
            not supported for semantic_search or count-only requests.
        search_before:
          type: array
          items: {}
          description: |
            Cursor for backward pagination. Pass the `_sort` values from the first hit
            of the current page exactly, including the appended `_id` tie-breaker.
            Values preserve their JSON types; for example numbers remain numbers,
            booleans remain booleans, and strings remain strings. Cursor values
            must be replayable JSON scalars; nulls, arrays, objects, and non-finite
            numbers are rejected.
            Mutually exclusive with `offset`.
            When `order_by` is omitted, Antfly uses `_id` ascending as the effective
            order and the cursor tuple must contain exactly one `_id` string.
            Supported for exact text-backed, match_all, and filter-only requests;
            not supported for semantic_search or count-only requests.
        distance_under:
          x-go-type-skip-optional-pointer: false
          type: number
          format: float
          description: |
            Maximum distance threshold for semantic similarity search. Results with distance
            greater than this value are excluded. Lower distances indicate higher similarity.

            Useful for filtering out low-confidence matches.
          example: 0.5
        distance_over:
          x-go-type-skip-optional-pointer: false
          type: number
          format: float
          description: |
            Minimum distance threshold for semantic similarity search. Results with distance
            less than this value are excluded.

            Useful for excluding near-exact duplicates or finding dissimilar documents.
          example: 0.1
        merge_config:
          $ref: "indexes.yaml#/components/schemas/MergeConfig"
          description: |
            Configuration for merging full-text and semantic search results.
            Only applies when both `full_text_search` and `semantic_search` are specified.
        count:
          type: boolean
          description: |
            If true, returns only the total count of matching documents without retrieving the actual documents.
            Useful for pagination and displaying result counts. Count-only requests
            do not return an ordered result page, so `order_by`, `search_after`,
            and `search_before` are not supported when this is true.
          example: false
        profile:
          type: boolean
          description: |
            If true, includes detailed execution profiling in the response.
            Adds a `profile` object with per-phase timing breakdowns, shard statistics,
            join metadata, reranker stats, and merge details.
            Has minor performance overhead — not recommended for production traffic.
          example: false
        reranker:
          $ref: "reranking.yaml#/components/schemas/RerankerConfig"
          description: |
            Optional reranker configuration to improve result relevance.

            Rerankers use cross-encoder models that score query-document pairs directly,
            providing more accurate relevance scores than embedding similarity alone.

            **When to use:**
            - Results need high precision (e.g., RAG, question answering)
            - You have semantic or hybrid search results to refine
            - Latency trade-off is acceptable (reranking adds 100-500ms typically)

            **Best practice:** Retrieve more results (limit: 50-100) then rerank to final size.

            Example:
            ```json
            {
              "provider": "antfly",
              "model": "cross-encoder/ms-marco-MiniLM-L-6-v2",
              "field": "content"
            }
            ```
        graph_metric_rerank:
          $ref: "indexes.yaml#/components/schemas/GraphMetricRerank"
          description: |
            Optional graph metric score feature to blend into ordinary search hit ranking.
            The metric must have a published generation. With `metric_freshness: fresh`,
            the request fails if graph writes have made the published generation stale.
        analyses:
          $ref: "#/components/schemas/Analyses"
        graph_searches:
          type: object
          additionalProperties:
            $ref: "indexes.yaml#/components/schemas/GraphQuery"
          description: |
            Declarative graph queries to execute after full-text/vector searches.
            Results can reference search results using node selectors like $full_text_results.
        expand_strategy:
          type: string
          enum:
            - union
            - intersection
          description: |
            Strategy for merging graph results with search results:
            - union: Include nodes from both search and graph results
            - intersection: Only include nodes appearing in both
        document_renderer:
          type: string
          description: |
            Optional Handlebars template string for rendering document content in RAG queries.
            Template has access to document fields via `{{this.fields.fieldName}}`.

            **Default**: Uses TOON (Token-Oriented Object Notation) format for 30-60% token reduction:
            ```handlebars
            {{encodeToon this.fields}}
            ```

            **Available Helpers**:
            - `encodeToon` - Renders fields in compact TOON format with configurable options:
              - `lengthMarker` (bool): Add # prefix to array counts (default: true)
              - `indent` (int): Indentation spacing (default: 2)
              - `delimiter` (string): Field separator for tabular arrays
            - `scrubHtml` - Removes HTML tags and extracts text
            - `media` - Wraps data URIs for GenKit multimodal support
            - `eq` - Equality comparison for conditionals

            **Examples**:
            - Basic TOON: `{{encodeToon this.fields}}`
            - Compact TOON: `{{encodeToon this.fields lengthMarker=false indent=0}}`
            - Tabular data: `{{encodeToon this.fields delimiter="\t"}}`
            - Custom template: `Title: {{this.fields.title}}\nBody: {{this.fields.body}}`
            - Traditional format: `{{#each this.fields}}{{@key}}: {{this}}\n{{/each}}`

            TOON format produces compact, LLM-optimized output like:
            ```
            title: Introduction to Vector Search
            author: Jane Doe
            tags[#3]: ai,search,ml
            ```

            **References**:
            - TOON Specification: https://github.com/toon-format/toon
            - Go Implementation: https://github.com/alpkeskin/gotoon
          example: "{{encodeToon this.fields}}"
        pruner:
          $ref: "indexes.yaml#/components/schemas/Pruner"
          description: |
            Optional result pruning configuration to filter low-relevance results.

            Pruning helps detect "elbows" in score distributions and removes
            results that are significantly worse than top matches.

            **Common patterns:**
            - RAG queries: Use `max_score_gap_percent: 30` to stop at quality drop-offs
            - Strict matching: Use `min_score_ratio: 0.7` for high-quality results only
            - Combine both for best results

            Example:
            ```json
            {
              "min_score_ratio": 0.5,
              "max_score_gap_percent": 25.0,
              "min_absolute_score": 0.3
            }
            ```
        join:
          $ref: "#/components/schemas/JoinClause"
          description: |
            Cross-table join configuration for combining results from multiple tables.

            Joins allow you to enrich query results with data from related tables,
            similar to SQL JOINs but optimized for distributed execution.

            **Join Types:**
            - `inner`: Only return rows that have matches in both tables
            - `left`: Return all rows from the primary table, with NULL for non-matching right rows
            - `right`: Return all rows from the joined table, with NULL for non-matching left rows

            **Join Strategies** (auto-selected based on table sizes):
            - `broadcast`: Small table broadcast to all shards (best for dimension tables < 10MB)
            - `index_lookup`: Batch key lookups using indexes (best for selective joins)
            - `shuffle`: Hash-partition both tables (best for large-large joins)

            **Example - Enrich orders with customer data:**
            ```json
            {
              "table": "orders",
              "full_text_search": {"query": "status:pending"},
              "join": {
                "right_table": "customers",
                "join_type": "inner",
                "on": {
                  "left_field": "customer_id",
                  "right_field": "id"
                },
                "right_filters": {
                  "filter_query": {"query": "tier:premium"}
                }
              },
              "fields": ["order_id", "amount", "customers.name", "customers.email"]
            }
            ```

            **Multi-way joins** (nested):
            ```json
            {
              "table": "orders",
              "join": {
                "right_table": "customers",
                "on": {"left_field": "customer_id", "right_field": "id"},
                "nested_join": {
                  "right_table": "addresses",
                  "on": {"left_field": "customers.address_id", "right_field": "id"}
                }
              }
            }
            ```

            **Performance Tips:**
            - Filter the driving table first to reduce join input size
            - Put the smaller table on the right side for broadcast joins
            - Use indexed fields in join conditions for index_lookup strategy
            - Limit result fields to reduce data transfer
        foreign_sources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ForeignSource"
          description: |
            Map of table name to foreign data source configuration for query-time federated access.
            When a table name referenced in this query (or in a join's `right_table`) appears as a key
            here, the query is routed to the external database instead of Antfly shards.

            This enables joining Antfly search results with structured relational data (customer records,
            product catalogs, etc.) without ingesting that data into Antfly.

            **Supported operations on foreign tables:** filter_query, field selection, limit/offset.
            **Not supported:** full_text_search, semantic_search, graph_searches, aggregations, reranker.

            **Example - Join Antfly products with Postgres customers:**
            ```json
            {
              "table": "products",
              "full_text_search": {"query": "category:electronics"},
              "join": {
                "right_table": "pg_customers",
                "on": {"left_field": "customer_id", "right_field": "id"}
              },
              "foreign_sources": {
                "pg_customers": {
                  "type": "postgres",
                  "dsn": "${secret:pg_dsn}",
                  "postgres_table": "customers"
                }
              }
            }
            ```
