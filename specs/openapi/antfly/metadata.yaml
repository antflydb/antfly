        Linear merge operation for syncing sorted records from external sources.
        Use this to keep Antfly in sync with an external database or data source.

        Requests may be sent as plain JSON or gzip-compressed JSON
        (`Content-Encoding: gzip`).

        Request bodies are limited to 64 MiB after decompression. Requests that
        exceed this limit return HTTP 413.

        **How it works:**
        1. Send sorted records from your external source
        2. Server upserts records that exist in your batch
        3. Server deletes Antfly records in the key range that are absent from your batch
        4. If stopped at shard boundary, use next_cursor for next request

        **WARNING:** Not safe for concurrent operations with overlapping key ranges.
      properties:
        records:
          type: object
          additionalProperties: true
          description: |
            Map of resource ID to resource object: {"resource_id_1": {...}, "resource_id_2": {...}}

            Requirements:
            - The server processes keys in lexicographic order
            - Use consistent key naming (e.g., all start with same prefix)

            This format avoids duplicate IDs and matches Antfly's batch write interface.
          example:
            "product:001":
              name: "Laptop"
              price: 999.99
            "product:002":
              name: "Mouse"
              price: 29.99
            "product:003":
              name: "Keyboard"
              price: 79.99
        last_merged_id:
          type: string
          description: |
            ID of last record from previous merge request.
            - First request: Use empty string ""
            - Subsequent requests: Use next_cursor from previous response
            - Defines lower bound of key range to process

            This enables pagination for large datasets.
          example: "product:003"
        dry_run:
          type: boolean
          default: false
          description: |
            If true, returns what would be deleted without making changes.

            Use cases:
            - Validate sync behavior before committing
            - Check which records will be removed
            - Test key range boundaries

            Response includes deleted_ids array when dry_run=true.
          example: false
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
    FailedOperation:
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
          enum: [upsert, delete]
        error:
          type: string
    KeyRange:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
      description: Key range processed in this request
    LinearMergeResult:
      type: object
      required:
        - status
        - upserted
        - deleted
        - skipped
        - next_cursor
      properties:
        status:
          $ref: "#/components/schemas/LinearMergePageStatus"
        upserted:
          type: integer
          description: Records inserted or updated (0 if dry_run=true)
        skipped:
          type: integer
          description: Records skipped because content hash matched (unchanged)
        deleted:
          type: integer
          description: Records deleted or would be deleted (if dry_run=true)
        deleted_ids:
          type: array
          items:
            type: string
          description: IDs that were deleted (or would be deleted if dry_run=true). Only included if dry_run=true.
        failed:
          type: array
          items:
            $ref: "#/components/schemas/FailedOperation"
        next_cursor:
          type: string
          description: ID of last record in this batch (use for next request)
        key_range:
          $ref: "#/components/schemas/KeyRange"
        keys_scanned:
          type: integer
          description: Total number of keys scanned from Antfly during range query
        message:
          type: string
          description: Additional information (e.g., "stopped at shard boundary", "dry run - no changes made")
        took:
          type: integer
          format: int64
          x-go-type: time.Duration
    # Graph API Schemas
    Edge:
      $ref: "indexes.yaml#/components/schemas/Edge"
    EdgeDirection:
      $ref: "indexes.yaml#/components/schemas/EdgeDirection"
    TraversalRules:
      $ref: "indexes.yaml#/components/schemas/TraversalRules"
    TraversalResult:
      $ref: "indexes.yaml#/components/schemas/TraversalResult"
    EdgesResponse:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        count:
          type: integer
          description: Total number of edges returned
    TraverseResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TraversalResult"
        count:
          type: integer
          description: Total number of results
    PathFindWeightMode:
      $ref: "indexes.yaml#/components/schemas/PathFindWeightMode"
    PathFindRequest:
      $ref: "indexes.yaml#/components/schemas/PathFindRequest"
    PathFindResult:
      $ref: "indexes.yaml#/components/schemas/PathFindResult"
    Path:
      $ref: "indexes.yaml#/components/schemas/Path"
    PathEdge:
      $ref: "indexes.yaml#/components/schemas/PathEdge"
    ForeignSource:
      type: object
      required:
        - type
        - dsn
        - postgres_table
      properties:
        type:
          type: string
          description: |
            Type of the foreign data source. Currently only "postgres" is supported.
          enum:
            - postgres
          example: "postgres"
        dsn:
          type: string
          description: |
            Data source name (connection string) for the foreign database.
            Supports `${secret:key_name}` references that resolve from the Antfly secret store
            or environment variables.
          example: "${secret:pg_dsn}"
        postgres_table:
          type: string
          description: |
            Name of the table or view in the foreign PostgreSQL database to query.
          example: "customers"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ForeignColumn"
          description: |
            Optional column definitions for the foreign table. If omitted, columns are
            auto-discovered from `information_schema.columns` on first query.
    ForeignColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Column name in the foreign table.
          example: "email"
        type:
          type: string
          description: |
            Column data type. Used for filter validation and type coercion.
            Common types: text, integer, bigint, float, boolean, timestamp, uuid, jsonb.
          example: "text"
        nullable:
          type: boolean
          description: Whether the column allows NULL values.
          default: false
    ReplicationSource:
      type: object
      required:
        - type
        - dsn
        - postgres_table
      properties:
        type:
          type: string
          description: |
            Type of the replication source. Currently only "postgres" is supported.
          enum:
            - postgres
          example: "postgres"
        dsn:
          type: string
          description: |
            Data source name (connection string) for the PostgreSQL database.
            Supports `${secret:key_name}` references that resolve from the Antfly secret store
            or environment variables. Requires `wal_level=logical` on the source.
          example: "${secret:pg_dsn}"
        postgres_table:
          type: string
          description: |
            Name of the table in the PostgreSQL database to replicate from.
          example: "users"
        key_template:
          type: string
          default: "id"
          description: |
            Template for constructing the Antfly document key from PG columns.
            A plain string (e.g., "id") uses that column's value directly.
            Use `{{column}}` syntax for composite keys: `{{tenant_id}}:{{user_id}}`.
          example: "id"
        slot_name:
          type: string
          description: |
            PostgreSQL replication slot name. If omitted, auto-derived from
            the Antfly table and PG table names. Specify this when using
            pre-created slots (e.g., on Supabase or Neon).
        publication_name:
          type: string
          description: |
            PostgreSQL publication name. If omitted, auto-derived and created
            automatically. Specify this when using pre-created publications.
        on_update:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationTransformOp"
          description: |
            Transform operations applied on INSERT/UPDATE events. Values can
            reference PG columns via `{{column}}` syntax. If omitted, auto-generates
            `$set` for every column (passthrough mode).
          example:
            - { op: "$set", path: "email", value: "{{user_email}}" }
            - { op: "$set", path: "score", value: "{{score}}" }
            - { op: "$merge", value: "{{metadata}}" }
            - { op: "$set", path: "active", value: true }
        on_delete:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationTransformOp"
          description: |
            Transform operations applied on DELETE events. If omitted, auto-derives
            `$unset` ops from `on_update`'s `$set` paths (safe for multi-source).
            Use `$delete_document` op to delete the entire Antfly document.
          example:
            - { op: "$set", path: "active", value: false }
        publication_filter:
          allOf:
            - $ref: "query.yaml#/components/schemas/Query"
            - x-go-type: json.RawMessage
          description: |
            Bleve-style filter query that gets translated to SQL and applied as a
            WHERE clause on the PostgreSQL publication. This filters rows at the
            source before they are sent over the replication stream, reducing
            network and processing overhead.

            Only a subset of filter types are supported (term, match, range,
            conjuncts, disjuncts, must_not). The filter is translated to SQL
            with inlined literal values.

            Example: `{"term": "active", "field": "status"}` becomes
            `WHERE ("status" = 'active')` on the publication.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationRoute"
          description: |
            Conditional routes for fan-out replication. Each route evaluates its
            `where` filter against every CDC row and, on match, writes to the
            specified `target_table`. Multiple routes can match the same row.

            When routes are present, the top-level `on_update`/`on_delete` are
            ignored — each route defines its own transforms.
          example:
            - target_table: "premium_users"
              where: { "term": "premium", "field": "tier" }
            - target_table: "free_users"
              where: { "term": "free", "field": "tier" }
        require_exact_cutover:
          type: boolean
          description: |
            When true, indicates this source was reseeded with exact cutover mode
            and must replay from a consistent snapshot before streaming.
        status:
          $ref: "#/components/schemas/ReplicationSourceStatus"
        action_hint:
          $ref: "#/components/schemas/ReplicationSourceActionHint"
    ReplicationSourceStatus:
      type: object
      readOnly: true
      description: |
        Runtime status of this replication source. Present only in GET table
        detail responses, not in create/update requests.
      properties:
        source_kind:
          type: string
        external_table:
          type: string
        cutover_mode:
          type: string
        slot_name:
          type: string
        publication_name:
          type: string
        phase:
          type: string
        checkpoint:
          type: string
        snapshot_offset:
          type: integer
        prepared_checkpoint:
          type: string
        stream_checkpoint:
          type: string
        last_error:
          type: string
        failure_class:
          type: string
        lag_records:
          type: integer
        lag_millis:
          type: integer
        consecutive_failures:
          type: integer
        last_source_commit_at_ms:
          type: integer
        last_success_at_ms:
          type: integer
        last_change_applied_at_ms:
          type: integer
        updated_at_ms:
          type: integer
    ReplicationSourceActionHint:
      type: object
      readOnly: true
      description: |
        Action hint for this replication source when remediation is recommended.
        Present only in GET table detail responses.
      properties:
        action:
          type: string
          description: Recommended action (e.g., "reseed_exact_cutover").
        reason:
          type: string
          description: Human-readable reason for the recommendation.
        reseed_exact_cutover_path:
          type: string
          description: API path to trigger a reseed exact cutover, if applicable.
    ReplicationRoute:
      type: object
      required:
        - target_table
      properties:
        target_table:
          type: string
          description: |
            Name of the Antfly table to write matching rows to. The table must
            already exist.
          example: "premium_users"
        where:
          allOf:
            - $ref: "query.yaml#/components/schemas/Query"
            - x-go-type: json.RawMessage
          description: |
            Bleve-style filter query evaluated against each CDC row. Only rows
            matching this filter are written to `target_table`. If omitted,
            all rows match (equivalent to `match_all`).
        key_template:
          type: string
          description: |
            Override the source-level `key_template` for this route. If omitted,
            the source-level template is used.
          example: "{{tenant_id}}:{{user_id}}"
        on_update:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationTransformOp"
          description: |
            Transform operations for INSERT/UPDATE events on this route. If omitted,
            auto-generates `$set` for every column (passthrough mode).
        on_delete:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationTransformOp"
          description: |
            Transform operations for DELETE events on this route. If omitted,
            auto-derives from this route's `on_update` paths.
    ReplicationTransformOp:
      type: object
      required:
        - op
      properties:
        op:
          type: string
          description: |
            Transform operation. Supported ops: `$set`, `$setOnInsert`, `$unset`, `$inc`, `$addToSet`, `$max`.
            Replication-specific: `$merge` (flatten JSONB into top-level fields),
            `$delete_document` (delete entire Antfly doc, `on_delete` only).
          example: "$set"
        path:
          type: string
          description: Antfly document field path. Required for `$set`, `$unset`, etc.
          example: "email"
        value:
          description: |
            Value for the operation. Can be a literal (string, number, boolean)
            or a `{{column}}` reference to a PG column value. Use `{{col.key}}` to
            navigate into decoded JSONB columns.
    StorageMaintenanceCapabilities:
      type: object
      required: [check, compact, vacuum, online, asynchronous]
      additionalProperties: false
      properties:
        check: { type: boolean }
        compact: { type: boolean }
        vacuum: { type: boolean }
        online: { type: boolean }
        asynchronous: { type: boolean }
    StorageRuntimeStatus:
      type: object
      required: [engine, maintenance]
      additionalProperties: false
      properties:
        engine:
          type: string
          enum: [lite, local, object]
        format:
          type: string
        fsync:
          type: boolean
        maintenance:
          $ref: "#/components/schemas/StorageMaintenanceCapabilities"
    RuntimeConfigStatus:
      type: object
      description: Non-secret status for the applied config.json snapshot. Hot publication accepts validated remote_content-only changes; startup-only changes remain stale until restart.
      properties:
        generation:
          type: integer
          format: uint64
          description: Generation of the fully validated and atomically published configuration.
        hash:
          type: string
          description: Lowercase SHA-256 of the exact fully applied config.json bytes; its first 16 characters match the operator config-hash annotation.
        last_reload_failed:
          type: boolean
          description: Whether the latest observed replacement failed loading, semantic validation, or requires restart because startup-only fields changed.
          x-omitzero: false
        stale:
          type: boolean
          description: Whether requests are using the last-known-good snapshot after a failed reload.
          x-omitzero: false
        reload_successes:
          type: integer
          format: uint64
        reload_failures:
          type: integer
          format: uint64
    DenseRepairBackpressureError:
      type: object
      description: A dense-index rebuild is retaining replay history and the node has reached its hard safety budget.
      required:
        - code
        - message
        - retryable
        - retry_after_ms
      properties:
        code:
          type: string
          enum: [dense_repair_backpressure]
        message:
          type: string
        retryable:
          type: boolean
          enum: [true]
        retry_after_ms:
          type: integer
          format: uint32
          minimum: 1
          description: Suggested delay before retrying the write.
    RestoreJob:
      type: object
      required: [job_id, attempt_id, scope, backup_id, phase, cancel_requested, durability_pending_table_count, published_table_count, completed_table_count, created_at_ms, updated_at_ms]
      properties:
        job_id:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: Opaque durable restore-job identifier. Clients must not parse it as a number.
        attempt_id: { type: integer, format: int64 }
        scope: { type: string, enum: [table, cluster] }
        table_name: { type: string }
        backup_id: { type: string }
        phase: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        cancel_requested: { type: boolean }
        durability_pending_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of tables whose generation publication is visible but whose parent-directory durability could not be confirmed.
        published_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of table restore intents durably published. Published tables are adopted, not republished, after failover.
        completed_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of published tables whose placement replicas completed restore and whose completion checkpoint is durable.
        total_table_count:
          type: integer
          format: int64
          minimum: 0
          description: Requested table count when known before execution.
        result:
          type: object
          additionalProperties: false
          description: |
            Bounded terminal result. A committed result with durability pending means publication is visible but
            parent-directory durability was not confirmed. Cluster restores report aggregate triggered, committed,
            durability-pending, skipped, and failed table counts plus a bounded sample of failure details.
            `failure_details_truncated` indicates that additional failures or part of a long failure detail were omitted.
            Any failed or durability-pending table makes the job phase `failed`; inspect this result for partial progress
            and use a new idempotency key when retrying a changed request.
          properties:
            restore:
              type: string
              enum: [triggered, committed]
              description: Present for a single-table restore result.
            durability:
              type: string
              enum: [pending]
              description: Present when table publication is visible but filesystem durability could not be confirmed.
            status:
              type: string
              enum: [completed, durability_pending, partial, failed]
              description: Aggregate terminal status for a cluster restore.
            triggered_table_count: { type: integer, format: int64, minimum: 0 }
            committed_table_count: { type: integer, format: int64, minimum: 0 }
            durability_pending_table_count: { type: integer, format: int64, minimum: 0 }
            skipped_table_count: { type: integer, format: int64, minimum: 0 }
            failed_table_count: { type: integer, format: int64, minimum: 0 }
            failure_details:
              type: array
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required: [table_name, error, table_name_truncated]
                properties:
                  table_name: { type: string, maxLength: 256 }
                  error: { type: string, maxLength: 256 }
                  table_name_truncated: { type: boolean }
            failure_details_truncated:
              type: boolean
              description: True when additional failed tables or part of a long table name or error were omitted.
        error: { type: string }
        created_at_ms: { type: integer, format: int64 }
        updated_at_ms: { type: integer, format: int64 }
        expires_at_ms:
          type: integer
          format: int64
          description: Unix epoch milliseconds after which this terminal job record and its idempotency key may be removed. Omitted while the job is nonterminal.
    RestoreJobList:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RestoreJob" }
        next_cursor:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[1-9][0-9]{0,19}$'
          description: Opaque newest-first continuation cursor. A page can be empty and still include a cursor when authorization or filters exclude a bounded scan window. Omitted when the retained scan is exhausted.
  responses: # Add reusable responses
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Method not allowed for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DenseRepairBackpressure:
      description: Writes are temporarily limited while a dense-index rebuild catches up.
      headers:
        Retry-After:
          description: Suggested delay in seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DenseRepairBackpressureError"
    UnsupportedMediaType:
      description: Unsupported request media or content encoding
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedExactSort:
      description: Exact sort cannot be executed through a supported native plan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExactSortError"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /status:
    get:
      summary: Get cluster status
      tags:
        - cluster_management
      description: Returns minimal cluster health and runtime status.
      operationId: getStatus
      responses:
        "200":
          description: Cluster status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /cluster:
    get:
      summary: Get cluster topology
      tags:
        - cluster_management
      description: Returns cluster health plus data-node, range, replica, and group topology for dashboard views.
      operationId: getCluster
      responses:
        "200":
          description: Cluster topology retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterTopology"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /connections:
    get:
      summary: List configured external connections
      tags:
        - cluster_management
      description: |
        Enumerates public external connections configured on this node under
        top-level `connections`: inference providers, web search providers,
        external IO endpoints, and CDC replication sources.

        The default response is config-derived and avoids slow provider calls.
        With include=models, each inference provider is queried live for its
        available models where the provider exposes a listing API. Connections
        that fail to respond are reported with status "error" instead of
        failing the whole response. A status of "configured" means the
        connection exists but was not live-probed in this response.
      operationId: listConnections
      parameters:
        - name: types
          in: query
          required: false
          description: |
            Comma-separated list of connection kinds to include
            (e.g. "inference,external_io,cdc"). Defaults to all
            kinds. This filters by the response "kind" field.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: |
            Comma-separated list of expansions. Supported values: `models` to
            live-query inference model listings and `status` to live-probe
            external connections. Live work is opt-in and single-flight per
            server.
          schema:
            type: string
        - name: refresh
          in: query
          required: false
          description: |
            Set to "true" to bypass the short server-side cache for requested
            live expansions. Live expansion passes are serialized to prevent
            concurrent refresh amplification. This does not force a node config
            or metadata reload.
          schema:
            type: string
      responses:
        "200":
          description: Configured connections retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionsResponse"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /connections/{connection_id}/inference/{operation}:
    post:
      summary: Invoke an Antfly-compatible inference connection
      tags:
        - cluster_management
      operationId: invokeInferenceConnection
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: operation
          in: path
          required: true
          description: Requires the connection capability `models.<operation>`.
          schema:
            type: string
            enum: [embed, generate, rerank, chunk, recognize, extract, rewrite, read, transcribe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Inference provider response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid connection or operation
        "401":
          description: Unauthorized - authentication required
        "403":
          description: The connection does not declare the capability required by this operation
        "502":
          description: Inference provider request failed
  /secrets:
    get:
      summary: List secrets status
      tags:
        - cluster_management
      description: |
        List all configured secret names and their status (secret-store file, env var, or both).
        Never returns secret values — only names and configuration status.
      operationId: listSecrets
      responses:
        "200":
          description: Secret status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /secrets/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: Secret key name (e.g., openai.api_key)
        schema:
          type: string
          pattern: "^[a-zA-Z0-9._-]+$"
    put:
      summary: Store a secret
      tags:
        - cluster_management
      description: |
        Store a secret in the configured writable secret-store file. Only available in standalone mode.
        Returns 503 in multi-node mode.
      operationId: putSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretWriteRequest"
      responses:
        "200":
          description: Secret stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable - secret management not available in multi-node mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a secret
      tags:
        - cluster_management
      description: |
        Remove a secret from the configured writable secret-store file. Only available in standalone mode.
        Returns 503 in multi-node mode.
      operationId: deleteSecret
      responses:
        "204":
          description: Secret deleted successfully
        "401":
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Service unavailable - secret management not available in multi-node mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batch:
    post:
      summary: Cross-table batch operations
      tags:
        - data_operations
      operationId: multiBatchWrite
      description: |
        Perform batch inserts, deletes, and transforms across multiple tables
        in a single atomic transaction.

        All operations across all tables are committed atomically using distributed
        2-phase commit (2PC). Either all operations succeed, or none do.

        **Use cases**:
        - Transfer records between tables (insert in one, delete from another)
        - Maintain referential integrity across tables
        - Atomic multi-table updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiBatchRequest"
      responses:
        "201":
          description: Cross-table batch operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/indexes/{indexName}/graph-metrics/{metricName}/actions/{action}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: indexName
        in: path
        required: true
        description: Name of the graph index
        schema:
          type: string
      - name: metricName
        in: path
        required: true
        description: Name of the configured graph metric
        schema:
          type: string
      - name: action
        in: path
        required: true
        description: Operational action to apply to the graph metric materialization
        schema:
          type: string
          enum:
            - refresh
            - rebuild
            - delete
            - pause
            - resume
    post:
      summary: Execute a graph metric operational action
      description: |
        Refresh, rebuild, delete, pause, or resume maintenance for a configured
        graph metric. The metric configuration remains owned by the graph index.
        `delete` clears materialized metric state and maintenance controls; a
        later refresh or rebuild can publish a new generation.
      tags:
        - index_management
      operationId: executeGraphMetricAction
      responses:
        "200":
          description: Updated graph metric status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphMetricActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: Graph metric actions are unavailable for this runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /transactions/commit:
    post:
      summary: Commit an OCC transaction
      tags:
        - data_operations
      operationId: commitTransaction
      description: |
        Commit a stateless OCC (Optimistic Concurrency Control) transaction.

        **Workflow**:
        1. Read documents using regular lookup endpoints, capturing the
           `X-Antfly-Version` response header for each read
        2. Compute writes locally based on the read values
        3. Submit this commit request with the read set (keys + versions)
           and the write set (batch operations per table)

        The server validates that all read versions still match current state.
        If any version has changed, the transaction is aborted with a 409 Conflict
        response containing details about which key conflicted.

        If all versions match, writes are executed atomically via 2PC.

        Stateless clients manage their own read set. For server-managed
        read-modify-write workflows, use the transaction session endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCommitRequest"
      responses:
        "200":
          description: Transaction committed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCommitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Transaction aborted due to version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCommitResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /transactions:
    get:
