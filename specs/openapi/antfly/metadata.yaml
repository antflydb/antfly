      tags:
        - data_operations
      operationId: listDocumentArtifactManifests
      responses:
        "200":
          description: Artifact manifest list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactManifestList"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts:
    parameters:
      - name: tableName
        in: path
        required: true
