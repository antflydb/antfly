    ByteRange:
      type: array
      items:
        type: string # B encoded bytes
        format: byte
      minItems: 2
      maxItems: 2
    SyncLevel:
      type: string
      enum:
        - propose
        - write
        - query
        - enrichments
        - full_index
      default: propose
      description: |
        Synchronization level for batch operations:
        - "propose": Wait for Raft proposal acceptance (fastest, default)
        - "write": Wait for Pebble KV write
        - "query": Wait until affected documents are visible to query paths such as full-text search
        - "enrichments": Pre-compute enrichments before Raft proposal (synchronous enrichment generation)
        - "full_index": Wait for all index writes to complete (full-text + enrichments + vector indexes)
    ShardConfig: # Simplified from common.ShardInfo for brevity
      type: object
      required:
        - byte_range
      properties:
        byte_range:
          $ref: "#/components/schemas/ByteRange"
    CreateTableRequest:
      type: object
      properties:
        num_shards:
          type: integer
          format: uint
          description: |
            Number of shards to create for the table. Data is partitioned across shards based on key ranges.

            **Sizing Guidelines:**
            - Small datasets (<100K docs): 1-3 shards
            - Medium datasets (100K-1M docs): 3-10 shards
            - Large datasets (>1M docs): 10+ shards

            More shards enable better parallelism but increase overhead. Choose based on expected data size and query patterns.

            **When to Add More Shards:**

            Antfly supports **online shard reallocation** without downtime. Add more shards when:
            - Individual shards exceed size thresholds (configurable)
            - Query latency increases due to large shard size
            - Need better parallelism for write-heavy workloads

            Use the internal `/reallocate` endpoint to trigger automatic shard splitting:
            ```bash
            POST /internal/v1/reallocate
            ```

            This enqueues a reallocation request that the leader processes asynchronously, splitting
            large shards and redistributing data without service interruption.

            **Advantages over Elasticsearch:**
            - Automatic shard splitting (no manual reindexing required)
            - Online operation (no downtime)
            - Transparent to applications (keys remain accessible during reallocation)
          example: 3
          # default: 1
        description:
          type: string
          maxLength: 500
          description: |
            Optional human-readable description of the table and its purpose.
            Useful for documentation and team collaboration.
          example: "User profiles with embeddings for semantic search"
        indexes:
          type: object
          description: |
            Map of index name to index configuration. Indexes enable different query capabilities:
            - Full-text indexes for BM25 search
            - Vector indexes for semantic similarity
            - Multimodal indexes for images/audio/video

            You can add multiple indexes to support different query patterns.
          additionalProperties:
            $ref: "indexes.yaml#/components/schemas/IndexConfig"
          example:
            search_index:
              type: full_text
            embedding_index:
              type: embeddings
              dimension: 384
              embedder:
                provider: ollama
                model: all-minilm
        typed_paths:
          type: object
          description: |
            Table-level typed document path metadata used by SQL planning for
            JSON/path scalar comparison semantics. This is not a physical index
            and does not imply indexed lookup, rebuild, catch-up, compaction, or
            PostgreSQL `CREATE INDEX` behavior. Use real index definitions for
            physical access paths.

            Keys are scalar type names such as `keyword`, `numeric`, `boolean`,
            or `datetime`; values are a path string or an array of path strings.
          additionalProperties: true
          example:
            numeric:
              - metrics.score
            keyword:
              - status
              - metadata.plan
        schema: # Optional schema for the table
          description: |
            Optional schema definition specifying field types, primary key, and TTL configuration.
            While optional, defining a schema provides type safety, optimized indexing, and better search performance.

            **Schema Features:**
            - **Field Types**: Define document structure using JSON Schema with `x-antfly-types` extensions
            - **Document TTL**: Configure automatic expiration via `ttl_duration` and optional `ttl_field`
            - **Primary Keys**: Specify unique identifier fields
            - **Validation**: Enforce schema constraints on writes

            **TTL Example:**
            ```json
            {
              "ttl_duration": "7d",
              "ttl_field": "_timestamp",
              "document_schemas": {...}
            }
            ```

            See the Table Management documentation for comprehensive TTL configuration and use cases.
          $ref: "schema.yaml#/components/schemas/TableSchema"
        replication_sources:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationSource"
          description: |
            PostgreSQL CDC replication sources. Streams INSERT/UPDATE/DELETE changes from
            PostgreSQL tables into this Antfly table via logical replication.

            Multiple sources can feed into a single table (e.g., `users` + `scores` → Antfly `users`).
            Each source uses `on_update`/`on_delete` transforms to control how PG events map to
            Antfly document operations. Requires `wal_level=logical` on the PostgreSQL source.
        tablespace_name:
          type: string
          description: |
            Optional tablespace binding for the table. When set, the named tablespace must exist and
            cannot be dropped while the table references it.
          example: fastspace
    FieldCapability:
      type: object
      description: Public field capability derived from Antfly schema mappings and observed dynamic field metadata.
      required:
        - type
        - query_modes
        - sortable
        - provenance
        - missing_null_policy
        - sort_lifecycle_state
      properties:
        name:
          type: string
          description: Mapping or dynamic-template name, when applicable.
        field:
          type: string
          description: Concrete query field path when known. Pattern-only dynamic templates may omit this.
        path_pattern:
          type: string
          description: Dynamic-template path_match pattern, when applicable.
        field_pattern:
          type: string
          description: Dynamic-template match pattern, when applicable.
        match_mapping_type:
          type: string
          description: Dynamic-template match_mapping_type, when applicable.
        emitted_name:
          type: string
          description: Physical emitted field name for schema-derived text fields, when different from the logical path.
        document_schema:
          type: string
          description: Document schema that produced this capability, when applicable.
        type:
          $ref: "#/components/schemas/AntflyType"
        query_modes:
          type: array
          items:
            type: string
            enum: [full_text, exact, range, geo, autocomplete]
          description: |
            Query modes supported by this concrete field variant. These modes are derived from
            Antfly field types such as `text`, `keyword`, `datetime`, `geopoint`, and
            `search_as_you_type`; they are not separate schema toggles.
        sortable:
          type: boolean
          description: |
            Whether this concrete field is declared sortable in the effective
            capability model. Public exact order_by accepts it only when
            sort_lifecycle_state is queryable or accelerated.
        provenance:
          type: string
          description: Capability source, such as reserved, document_schema, dynamic_template, or observed_dynamic.
        missing_null_policy:
          type: string
          description: Current missing/null handling policy for this field.
        sort_lifecycle_state:
          type: string
          enum: [unsupported, declared, indexed, covered, queryable, accelerated]
          description: Operational lifecycle state for exact sort use. Queryable fields are accepted by public exact sort; accelerated fields are queryable and participate in the configured index_sort tuple.
        analyzer:
          type: string
          description: Analyzer name for text/searchable fields, when applicable.
        index_sort_position:
          type: integer
          format: int64
          description: Zero-based position in the table index_sort tuple when this field participates.
        index_sort_order:
          type: string
          enum:
            - asc
            - desc
          description: Sort direction in the table index_sort tuple when this field participates.
    AntflyType:
      rules:
        no-unused-components: off
      $ref: "indexes.yaml#/components/schemas/AntflyType"
    Table: # Simplified representation of tablemgr.Table
      type: object
      required:
        - name
        - shards
        - indexes
      properties:
        name:
          type: string
        description:
          type: string
          maxLength: 500
          description: Optional description of the table.
          example: "Table for user data"
        tablespace_name:
          type: string
          description: Optional durable tablespace binding for this table.
        indexes:
          type: object
          additionalProperties:
