        "200":
          description: Row lateral response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsStreamResultSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/merge:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    post:
      summary: Synchronize data from external sources (Shopify, Postgres, S3) using a linear merge
      tags:
        - data_operations
      operationId: linearMerge
      description: |
        Synchronize and keep Antfly in sync with external data sources like Shopify,
        Postgres, S3, or any sorted record source. Also known as: data synchronization,
        database sync, incremental sync, e-commerce sync.

        Both source and destination must be sorted by the same key. Performs three-way merge:
        - Inserts new records from source
        - Updates changed records
        - Deletes Antfly records absent from source page

        **Stateless & Idempotent**: No sync state between pages. Safe to restart
        from any page if interrupted.

        **Use Cases**: Sync production databases, e-commerce APIs (Shopify, WooCommerce),
        data lake exports, or warehouse tables to Antfly for low-latency hybrid search.

        **WARNING**: Not safe for concurrent merges with overlapping ranges.
        Single-client sync API only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinearMergeRequest"
            examples:
              plain:
                summary: Uncompressed JSON merge request
                value:
                  records:
                    product:001:
                      name: Laptop
                      price: 999.99
                    product:002:
                      name: Mouse
                      price: 29.99
                  last_merged_id: ""
              gzip:
                summary: Same JSON body with Content-Encoding gzip
                value:
                  records:
                    product:001:
                      name: Laptop
                      price: 999.99
                    product:002:
                      name: Mouse
                      price: 29.99
                  last_merged_id: ""
      responses:
        "200":
          description: Merge completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinearMergeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/backup:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table to backup
        schema:
          type: string
    post:
      summary: Backup a table
      description: Backup IDs are immutable. Reusing an already published ID returns `409` without changing the existing backup.
      tags:
        - data_operations
      operationId: backupTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "201": # Corrected to 201 as per handler
          description: Backup process initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup:
                    type: string
                    example: successful
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/restore:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table to restore into
        schema:
          type: string
    post:
      summary: Restore a table from backup
      tags:
        - data_operations
      operationId: restoreTable
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
            x-go-type-skip-optional-pointer: false
          description: Stable key used to safely retry creation of this restore job. Keys are scoped to the authenticated principal and table. Requests without this header create a new job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Durable restore job accepted
          headers:
            Location:
              description: Relative URL of the durable restore job resource.
              schema: { type: string }
            Retry-After:
              description: Suggested polling delay in seconds.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/schema:
    parameters:
