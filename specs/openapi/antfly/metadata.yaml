  /tables/{tableName}/documents:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    post:
      summary: Scan documents in a table within a key range
      description: |
        Scans keys in a table within an optional key range and returns them as
        newline-delimited JSON (NDJSON). Each line contains a JSON object with
        the `_id` document identifier and optionally projected document fields. This is useful for
        iterating through all keys in a table or a subset of keys within a range.
      tags:
        - data_operations
      operationId: scanKeys
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanKeysRequest"
      responses:
        "200":
          description: Keys found (streamed as NDJSON)
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON, each line is a JSON object with an "_id" field
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/documents/{key}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: Key of the document to retrieve
        schema:
          type: string
    get:
      summary: Retrieve a document by key
      tags:
        - data_operations
      operationId: lookupKey
      parameters:
        - name: fields
          in: query
          required: false
          description: |
            Comma-separated list of fields to include in the response.
            If not specified, returns the full document. Supports:
            - Simple fields: "title,author"
            - Nested paths: "user.address.city"
            - Wildcards: "_chunks.*"
            - Exclusions: "-_chunks.*._embedding"
            - Special fields: "_embeddings,_summaries,_chunks"
          schema:
            type: string
          example: "title,author,metadata.tags"
        - name: consistency
          in: query
          required: false
          description: |
            Read consistency for the lookup. The default `read_index` routes to
            the primary for linearizable reads. `stale` allows a hot standby to
            serve the lookup at its safe-read LSN.
          schema:
            type: string
            enum:
              - read_index
              - leader_lease
              - stale
            default: read_index
      responses:
        "200":
          description: Record found
          headers:
            X-Antfly-Version:
              description: |
                Version token for this document. Use this value in OCC transaction
                read sets to detect concurrent modifications.
                "0" indicates the key does not exist.
              schema:
                type: string
          content:
            application/json: # Assuming JSON response for the record
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound" # If table or key not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/documents/{key}/artifacts:
