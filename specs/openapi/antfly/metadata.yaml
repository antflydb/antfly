        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/issues:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    post:
      summary: List table repair issues
      description: |
        Lists durable repair debt for a table. This operator-facing endpoint
        returns exact document keys, artifact keys, index names, and repair
        errors, and therefore requires table admin permission when authentication
        is enabled. Request filters are supplied in the JSON body. This release
        supports `target=artifact` for durable artifact queue entries and
        `target=index` for index repair candidates.
      tags:
        - data_operations
      operationId: listTableRepairIssues
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairIssueListRequest"
      responses:
        "200":
          description: Table repair issue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairIssueList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/run:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    post:
      summary: Run a bounded table repair pass
      description: |
        Synchronously attempts to repair queued table issues. `target=artifact` reprocesses
        supported artifact kinds and replays derived state; it is bounded by
        `limit` and returns an opaque continuation cursor when another artifact
        repair page is available. `target=index` repairs one named index by
        building a shadow replacement, catching it up to the current derived
        replay sequence, and atomically swapping it into service; healthy
        indexes are skipped unless `force=true` is supplied, and any positive
        `limit` permits that single named index repair. The response reports
        unresolved debt separately, and the endpoint requires table admin
        permission when authentication is enabled.
      tags:
        - data_operations
      operationId: runTableRepair
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRunRequest"
      responses:
        "200":
          description: Bounded table repair pass completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/jobs:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    post:
      summary: Start a durable table repair job
      description: |
        Creates a durable table repair job for large or long-running repair work.
        The job stores progress and accumulated counters across bounded advance
        calls. Use this endpoint instead of synchronous `runTableRepair` when
        repairing large indexes or when clients need retryable progress.
      tags:
        - data_operations
      operationId: startTableRepairJob
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRepairJobStartRequest"
      responses:
        "200":
          description: Job completed during the initial advance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "202":
          description: Repair job accepted or advanced but not terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/jobs/{jobId}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Repair job identifier.
        schema:
          type: string
    get:
      summary: Get a table repair job
      tags:
        - data_operations
      operationId: getTableRepairJob
      responses:
        "200":
          description: Repair job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/jobs/{jobId}/advance:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Repair job identifier.
        schema:
          type: string
    post:
      summary: Advance a table repair job
      description: Runs at most one bounded repair pass for the job. Concurrent
        advances use the job lease and return the current running state.
      tags:
        - data_operations
      operationId: advanceTableRepairJob
      responses:
        "200":
          description: Repair job reached a terminal phase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "202":
          description: Repair job remains queued or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/repair/jobs/{jobId}/cancel:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Repair job identifier.
        schema:
          type: string
    post:
      summary: Cancel a table repair job
      description: |
        Requests cancellation at a bounded repair boundary. For a named-index
        job, the server also traverses the table in bounded passes, durably
        pauses matching automatic repair, and asks an active owner to yield.
        The job remains nonterminal until that traversal completes, so a
        `cancelled` response means detached reconstruction will not restart
        without an explicit resume action. If the API process restarts during
        the traversal, server maintenance resumes it automatically; clients do
        not need to advance or repeat the cancellation request.
      tags:
        - data_operations
      operationId: cancelTableRepairJob
      responses:
        "200":
          description: Repair job cancelled or already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "202":
          description: Cancellation remains in progress at a running-pass boundary or during the durable named-index pause traversal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableRepairJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/reprocess:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
    post:
      summary: Reprocess a derived document artifact across a table range
      description: |
        Runs a bounded operational repair pass for a derived document artifact
        across source rows in key order. Use `next_key` from the response as
        the next request's `from_key` for simple single-cursor continuation.
        Distributed repair controllers should persist `shard_cursors` from the
        response and pass them back on the next request to resume each shard
        independently when scanning large sharded tables.
      tags:
        - data_operations
      operationId: reprocessDocumentArtifactRange
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentArtifactTableReprocessRequest"
      responses:
        "202":
          description: Bounded reprocessing pass was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactTableReprocessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/enrichment:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Stable generated artifact name.
        schema:
          type: string
    put:
      summary: Register or replace an artifact enrichment
      description: |
        Registers a table-level generated artifact definition. Reusing the same
        artifact name replaces the existing mapping. Chunk or asset enrichments
        may set `full_text_index: true` to map generated text into the table's
        default full-text index.
      tags:
        - index_management
      operationId: putArtifactEnrichment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "indexes.yaml#/components/schemas/EnrichmentConfig"
      responses:
        "201":
          description: Artifact enrichment registered
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete an artifact enrichment
      description: |
        Removes the table-level generated artifact definition. Local table
        reconciliation drops no-longer-desired enrichment registrations when it
        is safe to do so.
      tags:
        - index_management
      operationId: deleteArtifactEnrichment
      responses:
        "201":
          description: Artifact enrichment deleted
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/reprocess-jobs:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
    post:
      summary: Create a derived document artifact reprocess job
      description: |
        Creates a durable user-facing repair job for a derived document
