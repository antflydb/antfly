tags:
  - name: getting_started
    x-displayName: Getting Started
    description: |
      Quick introduction to using the Antfly API.

      ## Client Libraries

      Antfly provides auto-generated SDKs from the OpenAPI specification:

      - **Go**: `github.com/antflydb/antfly/go/pkg/sdk`
      - **TypeScript**: `@antflydb/antfly-ts` (npm)
      - **Python**: `antfly-python` (PyPI)

      All SDKs are type-safe and kept in sync with the API through code generation.

      For architectural overview, feature comparisons, and use case guidance, see the [main documentation](https://antfly.io/docs)
    x-docsaf-questions:
      - Which SDK should I use for my project?
      - How do I authenticate with the API?
      - Where can I find code examples?

  - name: cluster_management
    x-displayName: Cluster Management
    x-docsaf-questions:
      - How do I check if my cluster is healthy?
      - What do the different health statuses mean?
      - How do I integrate Antfly with Prometheus?
    description: |
      Monitor and manage your Antfly cluster's health and status.

      ## Cluster Health

      The cluster health endpoint provides real-time status of all stores and shards:
      - **healthy**: All nodes and shards operational
      - **degraded**: Some shards unavailable but cluster functional
      - **unhealthy**: Critical failures affecting availability
      - **error**: Cluster-wide failures

      ## Monitoring

      - Health check endpoint: `GET /healthz`
      - Prometheus metrics: `GET /metrics` on port 4200

      Use these endpoints to integrate with monitoring systems and alerting infrastructure.

  - name: table_management
    x-displayName: Table Management
    x-docsaf-questions:
      - Do I need to define a schema before inserting documents?
      - How do I add search capabilities to a table?
      - What's the difference between text and keyword types?
    description: |
      Manage tables in your Antfly cluster. Tables store your documents and support multiple indexes.

      ## Schema

      Schemas define the structure and types of data in your tables using **JSON Schema** with custom Antfly extensions.
      While optional, defining a schema provides several benefits:

      - **Type Safety**: Ensures data consistency across documents
      - **Optimized Indexing**: Full Text Index uses type information for appropriate Bleve mappings
      - **Better Search**: Type-aware indexing improves search relevance and performance
      - **Query Optimization**: Enables type-specific query operations

      ## JSON Schema Structure

      Antfly uses standard JSON Schema with custom extensions:

      ```json
      {
        "document_schemas": {
          "article": {
            "schema": {
              "type": "object",
              "properties": {
                "title": {
                  "type": "string",
                  "x-antfly-types": ["text", "keyword"]
                },
                "body": {
                  "type": "string",
                  "x-antfly-types": ["html"]
                },
                "tags": {
                  "type": "array",
                  "items": {"type": "string"},
                  "x-antfly-types": ["keyword"]
                },
                "metadata": {
                  "type": "object",
                  "properties": {
                    "author": {"type": "string"}
                  }
                }
              },
              "additionalProperties": false,
              "x-antfly-include-in-all": ["title", "body"]
            }
          }
        }
      }
      ```

      **Dynamic Indexing** (`additionalProperties`):
      - `"additionalProperties": false` - Only index fields defined in `properties` (recommended for performance)
      - `"additionalProperties": true` - Index all fields dynamically (flexible but slower)
      - If not specified, dynamic indexing is disabled

      **Nested Objects**:
      - Use `"type": "object"` with nested `properties` for structured data
      - Nested objects don't inherit `x-antfly-include-in-all` from parent
      - Arrays of objects: Use `"type": "array"` with `"items": {"type": "object", ...}`

      ## Antfly Extensions

      ### `x-antfly-types`
      Array of Antfly type strings specifying how to index a field. Multiple types create multiple field mappings:

      - **Single type**: `"x-antfly-types": ["text"]` - Creates standard text field
      - **Multiple types**: `"x-antfly-types": ["text", "keyword"]` - Creates `fieldName` (text) and `fieldName.keyword`
      - **With search-as-you-type**: `"x-antfly-types": ["text", "search_as_you_type"]` - Creates `fieldName` (text), `fieldName._2gram`, `fieldName._3gram`, and `fieldName._index_prefix`

      **Type Combination Rules**:
      - `text` and `html` are mutually exclusive (choose one as primary type)
      - Primary types (`text`, `html`) can be combined with variants (`keyword`, `search_as_you_type`)
      - `search_as_you_type` + `keyword` allowed without primary type (auto-adds `text`)

      ### `x-antfly-index`
      Boolean to disable indexing for a field:
      ```json
      {"type": "string", "x-antfly-index": false}
      ```

      ### `x-antfly-include-in-all`
      Schema-level array of field names to include in the special `_all` field for cross-field search:
      ```json
      {
        "x-antfly-include-in-all": ["title", "body", "description"]
      }
      ```
      Only text-based types (`text`, `html`, `keyword`, `search_as_you_type`, `link`) are included, and only the primary field (not `.keyword`, `._2gram`, `._3gram`, or `._index_prefix` variants).

      ## Antfly Types

      ### Text Types
      - `text` - Full-text searchable with tokenization and analysis. Use for articles, descriptions, searchable content.
      - `html` - Full-text searchable with HTML tag stripping. Use for HTML content.
      - `keyword` - Exact-match strings (not analyzed). Use for IDs, tags, categories, filters.
      - `search_as_you_type` - Search-as-you-type mappings for autocomplete. Creates `fieldName._2gram`, `fieldName._3gram`, and `fieldName._index_prefix` mappings.
      - `link` - URL/link field (keyword analyzer).

      ### Numeric and Boolean Types
      - `numeric` - Numbers (integers and floats). Use for counts, prices, scores.
      - `boolean` - True/false values.

      ### Date/Time Types
      - `datetime` - Timestamp fields. Use for created/updated dates, events.

      ### Geospatial Types
      - `geopoint` - Latitude/longitude point. Use for locations, coordinates.
      - `geoshape` - Complex geographic shape. Use for boundaries, regions.

      ### Special Types
      - `embedding` - Vector embeddings (not indexed in Bleve). Use for similarity search.
      - `blob` - Binary data (not indexed). Use for images, files, binary content.

      ## Type Inference

      If `x-antfly-types` is not specified, types are inferred from JSON Schema `type`:
      - `"type": "string"` → `["text"]`
      - `"type": "number"` or `"integer"` → `["numeric"]`
      - `"type": "boolean"` → `["boolean"]`

      ## Automatic Fields

      Antfly automatically adds these fields to all document schemas:
      - **`_timestamp`**: Datetime field for document timestamps
      - **`_summaries`**: Object field (map of index names to summary text) for AI-generated summaries

      ## Field Naming Conventions

      When multiple types are specified, Antfly creates additional field mappings with suffixes:
      - **Primary field** (`text` or `html`): Uses original field name
      - **Keyword variant**: `fieldName.keyword`
      - **Search-as-you-type**: `fieldName._2gram`, `fieldName._3gram`, and `fieldName._index_prefix`

      Example: `"x-antfly-types": ["text", "keyword", "search_as_you_type"]` creates:
      - `title` (text analyzer)
      - `title.keyword` (keyword analyzer)
      - `title._2gram` (2-token shingle analyzer)
      - `title._3gram` (3-token shingle analyzer)
      - `title._index_prefix` (edge n-gram prefix analyzer)

      ## Best Practices

      - Use `text` for searchable content, `keyword` for exact matching
      - Combine types for flexible querying: `["text", "keyword"]` enables both full-text and exact search
      - Add `search_as_you_type` for autocomplete functionality
      - Use `html` type for HTML content to strip tags during indexing
      - Specify `x-antfly-include-in-all` for important searchable fields

      ## Performance Considerations

      - `text` and `html` fields have higher indexing cost due to text analysis
      - `keyword` fields are faster to index but don't support partial matches
      - `search_as_you_type` adds edge n-gram indexing overhead
      - `embedding` and `blob` fields are automatically excluded from text indexing
      - Multiple types per field increase index size and indexing time

      ## Document TTL (Time-To-Live)

      Antfly supports automatic expiration and deletion of documents after a specified duration.
      Documents are automatically removed by a background cleanup job running on the Raft leader.

      ### Basic Configuration

      Configure TTL when creating a table using `ttl_duration`:

      ```json
      {
        "name": "sessions",
        "ttl_duration": "24h",
        "document_schemas": {
          "session": {
            "schema": {
              "type": "object",
              "properties": {
                "user_id": {"type": "string"},
                "data": {"type": "object"}
              }
            }
          }
        }
      }
      ```

      **How it works:**
      - Documents expire after the specified duration from their timestamp
      - Uses `_timestamp` field by default (automatically added at insertion)
      - Background cleanup runs every 30 seconds on the Raft leader
      - Expired documents are filtered from queries immediately (before cleanup)
      - Deletions are batched (1000 documents at a time) and go through Raft consensus

      ### Custom TTL Reference Field

      Use a custom timestamp field instead of `_timestamp`:

      ```json
      {
        "name": "events",
        "ttl_duration": "7d",
        "ttl_field": "created_at",
        "document_schemas": {
          "event": {
            "schema": {
              "type": "object",
              "properties": {
                "created_at": {"type": "string", "format": "date-time"},
                "event_type": {"type": "string"}
              },
              "required": ["created_at"]
            }
          }
        }
      }
      ```

      **Requirements:**
      - Custom TTL field must be present in all documents
      - Must be in RFC3339 format (e.g., `2025-01-01T12:00:00Z`)
      - Documents without the field will fail validation

      ### Duration Format

      TTL durations use Go duration format:
      - `30s` - 30 seconds
      - `5m` - 5 minutes
      - `24h` - 24 hours
      - `7d` - 7 days (treated as 168h)
      - `168h` - 1 week

      ### Use Cases

      **Session Management:**
      ```json
      {
        "ttl_duration": "1h",
        "ttl_field": "last_accessed"
      }
      ```
      Sessions expire 1 hour after `last_accessed`. Update the timestamp on each access to extend the session.

      **Temporary Caching:**
      ```json
      {
        "ttl_duration": "24h"
      }
      ```
      Cache entries expire 24 hours after insertion.

      **Log Rotation:**
      ```json
      {
        "ttl_duration": "30d"
      }
      ```
      Logs are automatically deleted after 30 days.

      ### Performance Characteristics

      **Optimized Storage:**
      - TTL timestamps stored separately (`:t` suffix keys) for O(1) lookups
      - No JSON deserialization needed during cleanup scans
      - ~100-1000x faster than scanning full document bodies
      - Minimal storage overhead (~30 bytes per document)

      **Query Filtering:**
      - Single key lookup to check expiration (~microseconds)
      - No impact on query latency
      - Scales to millions of documents

      **Cleanup Behavior:**
      - Runs every 30 seconds (configurable)
      - Leader-only operation (prevents duplicate work)
      - 5-second grace period ensures writes are fully replicated
      - Batched deletions (1000 docs) prevent overwhelming the system

      ### Monitoring

      TTL operations are logged with cleanup metrics:
      ```
      INFO  Starting TTL cleanup job ttl_duration=24h cleanup_interval=30s
      INFO  Cleaned up expired documents count=42 duration=245ms total_expired=1337
      ```

      ### Modifying TTL Configuration

      **Adding TTL to existing table:**
      - Update schema with `ttl_duration` field
      - Applies retroactively to all documents
      - Documents already expired are marked for immediate deletion

      **Removing TTL:**
      - Set `ttl_duration` to empty string
      - All expiration processing stops
      - Previously expired documents remain

      **Changing duration:**
      - Update schema with new `ttl_duration`
      - New duration applies immediately to all documents
      - Expiration recalculated using existing timestamps

      ### Limitations

      - **Clock synchronization required**: Use NTP to sync clocks across cluster nodes
      - **Cleanup latency**: Expired documents deleted within ~30 seconds (cleanup interval)
      - **Table-level configuration**: TTL applies to all documents in the table
      - **Timestamp format**: Must be RFC3339 or RFC3339Nano

  - name: data_operations
    x-displayName: Data Operations
    x-docsaf-questions:
      - How do distributed transactions work in Antfly?
      - How do I sync data from Postgres or Shopify?
      - What's the difference between batch operations and linear merge?
      - How do I backup and restore a table?
    description: |
      Perform data operations including batch inserts/deletes, linear merge sync,
      backup/restore, and individual key lookups.

      ## Batch Operations

      Efficiently insert or delete multiple documents in a single request. The batch
      endpoint accepts both inserts (map of key-value pairs) and deletes (array of keys).

      ## Distributed Transactions

      Antfly provides atomic cross-shard write transactions using a coordinator-based
      2-phase commit (2PC) protocol. When a batch operation spans multiple shards, Antfly
      automatically executes it as a distributed transaction.

      **How it works:**
      1. Metadata server allocates HLC timestamp and selects coordinator shard
      2. Coordinator writes transaction record, participants write intents
      3. After all intents succeed, coordinator commits transaction
      4. Participants are notified asynchronously to resolve intents
      5. Recovery loop ensures notifications complete even after coordinator failure

      **Features:**
      - **Automatic**: No special API required - just use the batch endpoint
      - **Atomic**: All writes across all shards commit or abort together
      - **Recoverable**: Coordinator failures are handled via recovery loops
      - **Efficient**: ~20ms latency for cross-shard transactions

      **Performance:**
      - Single-shard batches: < 5ms latency
      - Cross-shard transactions: ~20ms latency
      - Intent resolution: < 30 seconds worst-case (via recovery loop)

      **Guarantees:**
      - All writes succeed or all fail (atomicity)
      - Coordinator failure is recoverable (new leader resumes notifications)
      - Idempotent resolution (duplicate notifications are safe)

      **Use Cases:**
      - Updating related records across shards (e.g., user profile + preferences)
      - Multi-table inserts that must succeed together
      - Bulk imports requiring all-or-nothing semantics

      ## Linear Merge (Data Sync)

      Synchronize and keep Antfly in sync with external data sources like Shopify,
      Postgres, S3, or any sorted record source. Also known as: data synchronization,
      database sync, incremental sync, e-commerce sync.

      Both source and Antfly must be sorted by the same key. Performs three-way merge:
      inserts new records, updates changed records, deletes records absent from source.

      **How it works:**
      1. Query external source with pagination (sorted by key)
      2. Send sorted page to linear merge endpoint
      3. Antfly merges: upserts present records, deletes Antfly records absent from page
      4. Repeat for next page - no sync state required between pages

      **Use Cases:**

      - **Postgres/MySQL**: `SELECT * FROM products ORDER BY id LIMIT 1000 OFFSET 0`
        - Sync production DB to Antfly for hybrid search
        - Run periodically (hourly/daily) to stay in sync

      - **Shopify API**: `GET /admin/api/2024-01/products.json?order=id&limit=250`
        - Sync e-commerce catalog with cursor pagination
        - Antfly becomes searchable product index

      - **S3 Data Lake**: Sorted JSON files (`data/0001.json`, `data/0002.json`, ...)
        - Batch import from data warehouse exports
        - Process files in order, send contents page by page

      - **Databricks**: `SELECT * FROM delta_table ORDER BY key LIMIT 10000`
        - Sync data warehouse tables to Antfly
        - Enable low-latency search over warehouse data

      **Benefits:**
      - **Stateless**: No cursors or checkpoints - restart from any page
      - **Idempotent**: Safe to re-run if interrupted
      - **Efficient**: Stream comparison, no random access needed

      **WARNING**: Not safe for concurrent merges with overlapping ranges.
      Single-client sync API only.

      ## Backup and Restore

      Create backups to various storage backends:
      - `file:///path/to/backup` - Local filesystem
      - `s3://bucket/path` - Amazon S3

      Restore operations rebuild tables from backup snapshots.

      ## Key Lookups

      Direct key-value lookups for retrieving individual documents by their unique key.

  - name: query_operations
    x-displayName: Query Operations
    x-docsaf-questions:
      - What's the difference between full-text and semantic search?
      - How does hybrid search with RRF work?
      - How do I improve search relevance?
      - What's the difference between RAG and Retrieval Agent?
    description: |
      Execute queries across tables using full-text search, vector similarity search,
      or hybrid approaches combining both with Reciprocal Rank Fusion (RRF).

      ## Query Types

      ### Full-Text Search
      Uses Antfly query syntax for powerful text searching:
      - Field-specific queries: `body:computer`
      - Boolean operators: `AND`, `OR`, `NOT`
      - Range queries: `year:>2020`
      - Phrase queries: `"exact phrase"`

      ### Semantic Search
      Natural language queries using vector similarity:
      - Searches across specified embedding indexes
      - Returns semantically similar documents
      - Supports multiple embedding models

      ### Hybrid Search (RRF)
      Combines full-text and semantic search using Reciprocal Rank Fusion:
      ```json
      {
        "full_text_search": {"query": "body:computer"},
        "semantic_search": "artificial intelligence",
        "indexes": ["title_body_nomic"]
      }
      ```

      ## Filtering and Exclusion

      Refine results with powerful filtering:

      ### Filter Prefix
      Only return documents whose keys start with a specific string:
      ```json
      {"filter_prefix": "user:"}
      ```
      Returns only keys like "user:123", "user:456"

      ### Filter Query
      Apply an Antfly query as an AND condition:
      ```json
      {"filter_query": {"query": "+category:technology +year:>2020"}}
      ```
      Documents must match both the main query and filter query.

      ### Exclusion Query
      Exclude documents matching an Antfly query (NOT condition):
      ```json
      {"exclusion_query": {"query": "category:deprecated OR status:archived"}}
      ```

      **Performance Note**: All filters are applied before scoring and ranking, improving query performance.

      ## RAG (Retrieval-Augmented Generation)

      Execute queries and generate summaries using LLMs:
      - Supports multiple retrieval queries
      - Streams results as Server-Sent Events (SSE)
      - Returns markdown summaries with inline citations
      - Combines results from multiple tables

      ## Retrieval Agent

      Intelligent query routing with automatic query generation:
      - Classifies queries as "question" or "search"
      - Generates optimal search queries across tables
      - Returns generated responses (for questions) or document IDs (for searches)
      - Streams classification, keywords, queries, and results

      ## Improving Search Relevance

      Antfly provides several techniques to improve search result quality:

      ### 1. Hybrid Search (Combine Full-Text + Semantic)
      Use both `full_text_search` and `semantic_search` together. Results are merged using
      Reciprocal Rank Fusion (RRF) to balance keyword matching and semantic similarity.

      ### 2. Reranking
      Apply a cross-encoder model to re-score results based on query-document relevance.
      Rerankers are more accurate than embedding models but slower, so use them on
      already-filtered results (e.g., top 50-100).

      ```json
      {
        "semantic_search": "gaming laptops",
        "limit": 100,
        "reranker": {
          "provider": "ollama",
          "model": "dengcao/Qwen3-Reranker-0.6B:F16",
          "field": "description"
        }
      }
      ```

      ### 3. Result Pruning
      Filter out low-quality results by detecting score gaps or setting minimum thresholds:

      ```json
      {
        "semantic_search": "machine learning",
        "pruner": {
          "min_score_ratio": 0.5,
          "max_score_gap_percent": 30.0
        }
      }
      ```

      - `min_score_ratio`: Keep only results scoring at least X% of the top result
      - `max_score_gap_percent`: Stop when a consecutive score gap exceeds X% of the total score range

      ### 4. Merge Strategies
      Choose how full-text and semantic results are combined:
      - `rrf` (default): Reciprocal Rank Fusion - balanced, works well in most cases
      - `rsf`: Relative Score Fusion - normalizes and weights scores differently
      - `failover`: Use full-text if embedding generation fails

      ### 5. Query Filtering
      Use `filter_query` and `filter_prefix` to pre-filter before scoring, improving
      both performance and relevance by removing irrelevant documents early.

      **Best Practice**: Combine techniques for optimal results:
      1. Start with hybrid search (full-text + semantic)
      2. Apply filters to narrow the domain
      3. Use reranker on top results
      4. Apply pruner to remove outliers

  - name: index_management
    x-displayName: Index Management
    x-docsaf-questions:
      - What's the difference between full_text and embeddings indexes?
      - Which embedding provider should I use?
      - How do I index images and other media?
      - Can I add indexes after the table is created?
    description: |
      Create and manage indexes for full-text search, vector similarity search, and multimodal content.

      ## Index Types

      Antfly supports two primary index types:

      ### `full_text` - Full-Text Search Index
      BM25-based full-text search using Bleve. Automatically uses schema information for field mappings.

      **Configuration**:
      ```json
      {
        "type": "full_text",
        "name": "search_idx",
        "mem_only": false
      }
      ```

      **Options**:
      - `mem_only` (optional): If true, stores index in memory only (useful for testing)

      **Features**:
      - BM25 ranking algorithm
      - Field-specific queries (`title:computer`)
      - Boolean operators (`AND`, `OR`, `NOT`)
      - Range queries (`year:>2020`)
      - Phrase queries (`"exact phrase"`)
      - Uses schema's `x-antfly-types` for field analyzers
      - Respects `x-antfly-include-in-all` for cross-field search

      ### `embeddings` - Vector Similarity Index
      Approximate k-nearest neighbors (AKNN) index for semantic similarity search using vector embeddings.

      **Performance Features**:
      - Hardware-accelerated distance calculations using SIMD instructions
      - x86/AMD: AVX2 and AVX-512 optimizations for vector operations
      - ARM: NEON and SME (Scalable Matrix Extension) acceleration
      - RaBitQ quantization for reduced memory footprint and faster search
      - No GPU required - optimized for CPU-based deployments

      **Basic Configuration**:
      ```json
      {
        "type": "embeddings",
        "name": "embedding_idx",
        "field": "description",
        "embedder": {
          "provider": "ollama",
          "model": "all-minilm",
          "url": "http://localhost:11434"
        }
      }
      ```

      **Index Modes**:

      **Managed indexes** (`external: false`, default)
      - Antfly owns embedding generation
      - Must specify `field` or `template`
      - Must specify `embedder`
      - Reject manual `_embeddings` writes for that index

      **External indexes** (`external: true`)
      - Your application owns embedding generation
      - Must not specify `field`, `template`, or `embedder`
      - Dense external indexes must specify `dimension`
      - Vectors are written directly through the document `_embeddings` field

      **Managed Index Fields**:
      - `field`: Field to embed using JSONPath syntax (e.g., `"description"`, `"metadata.content"`, `"$.user.bio"`)
      - `template`: Handlebars template for custom prompt generation
      - `embedder`: Embedder configuration for generating vectors
      - `dimension`: Optional for dense indexes; inferred from the embedder if omitted
      - `summarizer`: Vision/multimodal model for processing images/audio/video
      - `mem_only`: Store index in memory only

      **External Index Fields**:
      - `external: true`
      - `dimension`: Required for dense indexes
      - `sparse: true`: Use sparse vectors supplied through `_embeddings`

      **External Dense Example**:
      ```json
      {
        "type": "embeddings",
        "name": "manual_dense_idx",
        "external": true,
        "dimension": 384
      }
      ```

      **External Sparse Example**:
      ```json
      {
        "type": "embeddings",
        "name": "manual_sparse_idx",
        "external": true,
        "sparse": true
      }
      ```

      **Writing Manual Embeddings**:
      - Manual `_embeddings` writes are only accepted for `external: true` indexes
      - Dense vectors use arrays: `"_embeddings": { "manual_dense_idx": [0.1, 0.2, 0.3] }`
      - Sparse vectors use token-weight maps: `"_embeddings": { "manual_sparse_idx": { "7": 1.5, "42": 2.0 } }`
      - Explicit delete uses `null`: `"_embeddings": { "manual_dense_idx": null }`
      - Omitting `_embeddings[<index>]` is a no-op; it does not delete the stored vector

      ## Embedder Providers

      Antfly supports multiple embedding providers via the `embedder` configuration:

      ### Ollama (Local Models)
      ```json
      {
        "provider": "ollama",
        "model": "all-minilm",
        "url": "http://localhost:11434"
      }
      ```
      Popular models: `all-minilm`, `nomic-embed-text`, `mxbai-embed-large`

      ### OpenAI
      ```json
      {
        "provider": "openai",
        "model": "text-embedding-3-small",
        "api_key": "sk-..."
      }
      ```
      Models: `text-embedding-3-small` (1536d), `text-embedding-3-large` (3072d), `text-embedding-ada-002` (1536d)

      ### Google Gemini
      ```json
      {
        "provider": "gemini",
        "model": "text-embedding-004",
        "project_id": "my-project",
        "location": "us-central1",
        "dimension": 768
      }
      ```
      Supports multimodal embeddings (text + images).

      ### AWS Bedrock
      ```json
      {
        "provider": "bedrock",
        "model": "amazon.titan-embed-text-v1",
        "region": "us-east-1"
      }
      ```
      Models: `amazon.titan-embed-text-v1`, `amazon.titan-embed-text-v2`, `cohere.embed-english-v3`, `cohere.embed-multilingual-v3`

      ## Multimodal Indexing

      Vector indexes can process images, audio, and video using vision/multimodal models.

      ### With Summarizer (Two-Stage)
      Use a vision model to generate text descriptions, then embed the descriptions:

      ```json
      {
        "type": "embeddings",
        "dimension": 384,
        "embedder": {
          "provider": "ollama",
          "model": "all-minilm"
        },
        "summarizer": {
          "provider": "ollama",
          "model": "llava"
        }
      }
      ```

      **How it works**: Vision model (`llava`) generates text description → Embedder (`all-minilm`) creates vector

      **Supported Vision Models**:
      - **Ollama**: `llava`, `llava-phi3`, `bakllava`, `llava-llama3`
      - **OpenAI**: `gpt-4o`, `gpt-4-turbo`, `gpt-4o-mini`
      - **Gemini**: `gemini-2.0-flash-exp`, `gemini-1.5-pro`, `gemini-1.5-flash`
      - **Anthropic**: `claude-3-5-sonnet-20241022`, `claude-3-opus-20240229`
      - **Bedrock**: `anthropic.claude-3-5-sonnet-20241022-v2:0`

      ### Native Multimodal (Single-Stage)
      Some models support direct multimodal embeddings:

      ```json
      {
        "type": "embeddings",
        "dimension": 1024,
        "embedder": {
          "provider": "gemini",
          "model": "text-embedding-004",
          "project_id": "my-project"
        }
      }
      ```

      Gemini's embedding models can directly process text and images without a separate vision model.

      ## Supported Media Formats

      When using multimodal indexes, documents can reference media in multiple ways:

      ### Images
      - **Base64 encoded (data URI)**: `data:image/jpeg;base64,<base64>`, `data:image/png;base64,<base64>`, `data:image/webp;base64,<base64>`
      - **URLs**: `http://`, `https://`, `s3://`, `file://`

      ### Audio & Video
      - **URLs**: `http://`, `https://`, `s3://`, `file://`

      Example document with image:
      ```json
      {
        "title": "Product Photo",
        "image": "data:image/jpeg;base64,iVBORw0KGgoAAAANSUhEUgA..."
      }
      ```

      ## Template-Based Prompts

      Customize how documents are converted to text before embedding using Handlebars templates:

      ```json
      {
        "type": "embeddings",
        "dimension": 384,
        "field": "description",
        "template": "Product: {{title}}\nCategory: {{category}}\nDescription: {{description}}",
        "embedder": {
          "provider": "ollama",
          "model": "all-minilm"
        }
      }
      ```

      **Template System:**
      - **Syntax**: Handlebars templating (https://handlebarsjs.com/guide/)
      - **Caching**: Templates are automatically cached with configurable TTL (default: 5 minutes)
      - **Context**: Templates receive the full document as context

      **Basic Syntax:**
      - `{{fieldName}}`: Insert field value
      - `{{#if field}}...{{/if}}`: Conditional logic
      - `{{#each array}}...{{/each}}`: Iterate arrays
      - `{{#unless condition}}...{{/unless}}`: Inverse conditional
      - `{{@index}}`, `{{@key}}`, `{{@first}}`, `{{@last}}`: Loop variables

      **Built-in Helpers:**

      1. **scrubHtml** - Remove script/style tags and extract clean text from HTML
         ```handlebars
         {{scrubHtml html_content}}
         ```
         - Removes `<script>` and `<style>` tags
         - Adds newlines after block elements (p, div, h1-h6, li, etc.)
         - Returns plain text with preserved readability

      2. **eq** - Equality comparison for conditionals
         ```handlebars
         {{#if (eq status "active")}}Active{{/if}}
         {{#if (eq @key "special")}}Special field{{/if}}
         ```

      3. **media** - GenKit dotprompt media directive for multimodal content
         ```handlebars
         {{media url=imageDataURI}}
         {{media url=this.image_url}}
         {{media url="https://example.com/image.jpg"}}
         {{media url="s3://endpoint/bucket/image.png"}}
         {{media url="file:///path/to/image.jpg"}}
         ```

         **Supported URL Schemes:**
         - `data:` - Base64 encoded data URIs (e.g., `data:image/jpeg;base64,...`)
         - `http://` / `https://` - Web URLs with automatic content type detection
         - `file://` - Local filesystem paths
         - `s3://` - S3-compatible storage (format: `s3://endpoint/bucket/key`)

         **Automatic Content Processing:**
         - **Images**: Downloaded, resized (if needed), converted to data URIs
         - **PDFs**: Text extracted or first page rendered as image
         - **HTML**: Readable text extracted using Mozilla Readability

         **Security Controls:**
         Downloads are protected by content security settings:
         - Allowed host whitelist
         - Private IP blocking (prevents SSRF attacks)
         - Download size limits (default: 100MB)
         - Download timeouts (default: 30s)
         - Image dimension limits (default: 2048px, auto-resized)

         See: https://antfly.io/docs/configuration#security--cors

      4. **encodeToon** - Encode data in TOON format (Token-Oriented Object Notation)
         ```handlebars
         {{encodeToon this.fields}}
         {{encodeToon this.fields lengthMarker=false indent=4}}
         {{encodeToon this.fields delimiter="\t"}}
         ```

         **TOON Format** provides **30-60% token reduction** compared to JSON:
         - Compact syntax using `:` for key-value pairs
         - Array length markers: `tags[#3]: ai,search,ml`
         - Tabular format for uniform data structures
         - Optimized for LLM parsing

         Options:
         - `lengthMarker` (bool): Add # prefix to array counts (default: true)
         - `indent` (int): Indentation spacing (default: 2)
         - `delimiter` (string): Field separator for tabular arrays (use `"\t"` for tabs)

         Example output:
         ```
         title: Introduction to Vector Search
         author: Jane Doe
         tags[#3]: ai,search,ml
         ```

         **References:**
         - TOON Specification: https://github.com/toon-format/toon
         - Go Implementation: https://github.com/alpkeskin/gotoon

      Without a template, the `field` value is used directly, or the entire document is serialized.

      ## Field Extraction with JSONPath

      The `field` parameter supports JSONPath syntax for extracting values from nested document structures:

      ```json
      {
        "type": "embeddings",
        "field": "metadata.description",
        "embedder": {"provider": "ollama", "model": "all-minilm"}
      }
      ```

      **JSONPath Examples**:
      - `"title"` - Top-level field
      - `"user.bio"` - Nested field (auto-prepends `$.` if not present)
      - `"$.metadata.content"` - Explicit JSONPath
      - `"$.items[0].name"` - Array indexing

      The extracted value must be a string. Use `template` for complex transformations or combining multiple fields.

      ## Configuration Examples

      ### Simple Text Embedding
      ```json
      {
        "type": "embeddings",
        "field": "content",
        "embedder": {
          "provider": "ollama",
          "model": "all-minilm"
        }
      }
      ```
      Note: `dimension` is omitted and will be inferred from the `all-minilm` model (384).

      ### Multimodal with Custom Template
      ```json
      {
        "type": "embeddings",
        "dimension": 768,
        "template": "{{title}}: {{description}}",
        "embedder": {
          "provider": "gemini",
          "model": "text-embedding-004",
          "dimension": 768
        },
        "summarizer": {
          "provider": "gemini",
          "model": "gemini-1.5-flash"
        }
      }
      ```

      ### Production OpenAI Setup
      ```json
      {
        "type": "embeddings",
        "dimension": 1536,
        "field": "body",
        "embedder": {
          "provider": "openai",
          "model": "text-embedding-3-small",
          "api_key": "${OPENAI_API_KEY}"
        }
      }
      ```

      ## Best Practices

      - **Choose dimension wisely**: Higher dimensions improve accuracy but increase storage/compute costs
      - **Use templates for structured data**: Combine multiple fields into meaningful prompts
      - **Multimodal strategy**: Use two-stage (summarizer + embedder) for flexibility, single-stage for simplicity
      - **Local vs Cloud**: Ollama for development/privacy, cloud providers for production/scale
      - **Field specification**: Specify `field` when embedding a single field to avoid whole-document serialization

      ## Implementing Autocomplete Search

      To implement autocomplete/search-as-you-type functionality:

      **1. Define schema with search_as_you_type type:**
      ```json
      {
        "document_schemas": {
          "product": {
            "schema": {
              "type": "object",
              "properties": {
                "name": {
                  "type": "string",
                  "x-antfly-types": ["text", "search_as_you_type"]
                }
              }
            }
          }
        }
      }
      ```

      **2. Create full-text index:**
      ```json
      {
        "indexes": {
          "search_idx": {
            "type": "full_text"
          }
        }
      }
      ```

      **3. Query with bool-prefix multi-match:**
      ```json
      {
        "full_text_search": {
          "multi_match": {
            "query": "lap",
            "type": "bool_prefix",
            "fields": ["name"]
          }
        }
      }
      ```

      The `search_as_you_type` type creates shingle and prefix subfields that match partial input
      as users type. For example, "lap" matches "laptop", "lapel", etc.

      ## Reindexing Data

      What happens when you need to reindex? Antfly handles reindexing through async enrichment,
      automatically rebuilding indexes in the background. Here's what to expect when reindexing
      data (after adding a new index or changing configuration):

      ### Adding a New Index to Existing Table

      Antfly handles reindexing automatically through async enrichment:

      **1. Add the index:**
      ```bash
      POST /tables/{tableName}/indexes/{indexName}
      {
        "type": "embeddings",
        "embedder": {...}
      }
      ```

      **2. Enrichment happens automatically:**
      - Existing documents are enriched in the background
      - New writes are enriched immediately
      - Leader-only processing prevents duplicate work
      - Check index status to monitor progress

      **3. Monitor progress:**
      ```bash
      GET /tables/{tableName}/indexes/{indexName}
      ```

      Look at `shard_status` for enrichment progress per shard.

      ### Error Handling for Async Enrichment

      When embedding generation or enrichment fails, Antfly handles errors gracefully:

      **Retry Behavior:**
      - Failed enrichments are automatically retried with exponential backoff
      - Leader-only processing ensures no duplicate work during retries
      - Enrichment continues for other documents even if some fail

      **Monitoring Failures:**
      - Check index status (`GET /tables/{table}/indexes/{index}`) for error counts
      - Prometheus metrics expose enrichment failure rates
      - Failed documents remain searchable via full-text index (if configured)

      **Common Failure Scenarios:**

      1. **Embedding API Unavailable**
         - Enrichment retries automatically when service recovers
         - Documents remain indexed (without embeddings) for full-text search
         - Use `sync_level: enrichments` for synchronous embedding (fails write if embedding fails)

      2. **Rate Limiting**
         - Automatic backoff and retry
         - Consider using local Ollama to avoid rate limits
         - Or increase API quota with embedding provider

      3. **Model Errors (invalid input, size limits)**
         - Logged with document ID for investigation
         - Retries stop after max attempts
         - Document remains in table without enrichment

      **Fallback Strategy:**

      For critical workloads, use the `failover` merge strategy to fall back to full-text search
      when embedding generation fails:

      ```json
      {
        "full_text_search": {"query": "search term"},
        "semantic_search": "search term",
        "merge_config": {"strategy": "failover"}
      }
      ```

      This ensures queries always return results even if embeddings are unavailable.

      ### Changing Index Configuration

      To change index configuration:
      1. Drop the existing index: `DELETE /tables/{table}/indexes/{index}`
      2. Recreate with new config: `POST /tables/{table}/indexes/{index}`
      3. Existing data is automatically re-enriched

      **Note:** Full-text indexes (`full_text`) reindex immediately on creation and automatically
      rebuild when schema changes are made. Vector indexes (`embeddings`) enrich asynchronously in the background.

      ### Backup Before Major Reindexing

      For large datasets, backup before reindexing:
      ```bash
      POST /tables/{tableName}/backup
      {
        "backup_id": "before-reindex-2025-01",
        "location": "s3://mybucket/backups/products"
      }
      ```

      ## Graph Indexes and Edge TTL

      Graph indexes (`graph`) enable relationship modeling and traversal queries. Like documents, graph edges
      support automatic expiration through per-index TTL configuration.

      ### Graph Index Overview

      Graph indexes store directed edges between documents, enabling queries like:
      - Finding all connections from a document
      - Traversing multi-hop paths
      - Filtering relationships by type

      **Basic graph index:**
      ```json
      {
        "type": "graph",
        "name": "social_graph"
      }
      ```

      ### Edge TTL Configuration

      Configure automatic edge expiration per graph index using `ttl_duration`:

      ```json
      {
        "type": "graph",
        "name": "recent_interactions",
        "ttl_duration": "7d"
      }
      ```

      **How it works:**
      - Edges expire after the specified duration from their creation timestamp
      - Background cleanup runs every 30 seconds on the Raft leader
      - Each edge has a timestamp key (`:t` suffix) tracking when it was created
      - Expired edges are filtered from traversal queries immediately
      - Deletions are batched (1000 edges at a time) and go through Raft consensus

      ### Edge TTL vs Document TTL

      **Document TTL** (table-level):
      - Configured via `ttl_duration` in table schema
      - Applies to all documents in the table
      - Uses `_timestamp` or custom `ttl_field`

      **Edge TTL** (index-level):
      - Configured via `ttl_duration` in graph index config
      - Applies only to edges in that specific graph index
      - Uses edge creation timestamp (stored in `:t` key)
      - Different graph indexes can have different TTL durations

      ### Duration Format

      Edge TTL uses the same Go duration format as document TTL:
      - `30s` - 30 seconds
      - `5m` - 5 minutes
      - `24h` - 24 hours
      - `7d` - 7 days (treated as 168h)

      ### Use Cases

      **Session Graphs:**
      ```json
      {
        "type": "graph",
        "name": "active_sessions",
        "ttl_duration": "1h"
      }
      ```
      Track active user sessions; edges expire after 1 hour of inactivity.

      **Recent Activity Feed:**
      ```json
      {
        "type": "graph",
        "name": "recent_interactions",
        "ttl_duration": "7d"
      }
      ```
      Keep only the last week of user interactions; older edges automatically deleted.

      **Temporary Recommendations:**
      ```json
      {
        "type": "graph",
        "name": "trending_connections",
        "ttl_duration": "24h"
      }
      ```
      Track trending content connections; refresh daily by letting old edges expire.

      **Rate Limiting:**
      ```json
      {
        "type": "graph",
        "name": "api_calls",
        "ttl_duration": "1h"
      }
      ```
      Track API calls per user; edges expire after 1 hour for sliding window rate limiting.

      ### Performance Characteristics

      Edge TTL cleanup uses the same optimized approach as document TTL:

      **Optimized Scanning:**
      - Only scans edge timestamp keys (`:t` suffix)
      - No document deserialization required
      - O(1) per edge - just reads a timestamp
      - ~100-1000x faster than scanning full edge data

      **Query Filtering:**
      - Single key lookup to check edge expiration
      - Minimal latency impact on traversal queries
      - Scales to millions of edges

      **Cleanup Behavior:**
      - Runs every 30 seconds (same interval as document TTL)
      - Leader-only operation
      - 5-second grace period for replication
      - Batched deletions (1000 edges per batch)

      ### Monitoring

      Edge TTL operations are logged separately from document TTL:
      ```
      INFO  Starting edge TTL cleanup job indexes_with_ttl=3 cleanup_interval=30s
      INFO  Cleaned up expired edges count=127 duration=89ms total_expired=5432
      ```

      Metrics tracked per graph index:
      - Total edges expired since leader became active
      - Last cleanup duration
      - Scanned vs expired edge counts

      ### Modifying Edge TTL

      **Adding TTL to existing graph index:**
      - Currently requires dropping and recreating the index
      - Edges are not preserved when index is dropped
      - Plan accordingly for production deployments

      **Removing TTL:**
      - Drop and recreate index without `ttl_duration`
      - All edges become permanent

      **Changing duration:**
      - Drop and recreate index with new `ttl_duration`
      - Existing edges are not preserved

      ### Limitations

      - **Per-index configuration**: Each graph index has its own TTL setting
      - **Edge-level timestamps**: Uses edge creation time (not document timestamps)
      - **No per-edge TTL**: All edges in a graph index share the same TTL duration
      - **Index recreation required**: Cannot modify TTL on existing graph index
      - **Clock synchronization**: Requires NTP for accurate expiration across cluster nodes

      ### Best Practices

      **Separate indexes for different TTLs:**
      ```json
      {
        "indexes": {
          "permanent_relationships": {
            "type": "graph"
          },
          "recent_activity": {
            "type": "graph",
            "ttl_duration": "7d"
          },
          "realtime_events": {
            "type": "graph",
            "ttl_duration": "1h"
          }
        }
      }
      ```

      Use multiple graph indexes when you need different expiration policies for different types of relationships.

      **Monitor cleanup logs:**
      - Watch for high edge counts requiring cleanup
      - Adjust TTL duration if cleanup becomes a bottleneck
      - Consider shorter cleanup intervals for time-sensitive use cases

      **Test before production:**
      - Verify edge expiration behavior matches expectations
      - Test cleanup performance with representative edge counts
      - Ensure traversal queries filter expired edges correctly

security:
  - BasicAuth: []
  - ApiKeyAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      $ref: "../auth/api.yaml#/components/schemas/Error"
    SqlStatementRequest:
      type: object
      additionalProperties: false
      description: |
        Synchronous SQL statement request. `session_id` is optional on the first
        request and should be reused from prior responses when SQL session state
        must persist across requests.
      properties:
        sql:
          type: string
          minLength: 1
          description: SQL statement text to execute.
        session_id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: Logical SQL session id returned by an earlier SQL response.
        database:
          type: string
          nullable: true
          description: Optional current database override for this request.
        namespace:
          type: string
          nullable: true
          description: Optional single search-path namespace override for this request.
        read_only:
          type: boolean
          default: false
          description: Execute this statement under a server-enforced PostgreSQL-style read-only transaction guard.
      required:
        - sql
    SqlStatementResponse:
      type: object
      additionalProperties: false
      description: |
        Synchronous SQL statement result metadata. Catalog/session/control
        statements route through the typed DDL/session execution path. Read
        statements lower through the same typed row-plan executor used by the
        JSON relational rows APIs. Point write statements lower through the
        typed row-batch mutation path, and insert-from-source statements lower
        through the typed row-read plus row-batch mutation path.
      properties:
        kind:
          type: string
          enum:
            - ddl
            - read
            - write
        session_id:
          type: integer
          format: int64
          minimum: 1
        noop:
          type: boolean
        applied:
          type: object
          additionalProperties: true
          description: Applied DDL/session result record.
        statement_kind:
          type: string
          nullable: true
          description: Lowered read or write statement family for data responses.
        result:
          type: object
          additionalProperties: true
          nullable: true
          description: Typed relational row-plan, row-batch, or mutation-source response for data statements.
      required:
        - kind
        - session_id
    ExactSortError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - reason
        - sort_rejection_reason
        - sort_rejection_detail
        - sort_rejection_field
        - status
      properties:
        error:
          type: string
          description: Stable error class.
          example: unsupported_exact_sort
        message:
          type: string
          description: Human-readable error summary.
          example: exact sort is unsupported for this query
        reason:
          type: string
          description: |
            Stable machine-readable rejection reason. Known exact-sort
            reasons include `unmapped_field`, `non_sortable_field`,
            `unsupported_sort_field`, `mixed_field_type`,
            `field_not_sort_ready`, `filter_not_queryable`,
            `invalid_cursor_arity`, `invalid_cursor_type`,
            `invalid_sort_tuple`, `approximate_candidate_source`,
            `candidate_budget_exceeded`, `missing_null_policy`,
            `non_score_bearing_source`, `invalid_score_value`,
            `count_only_ordered_page`, `stored_json_sort_disabled`,
            `unsupported_exact_sort`, and `distributed_merge_unsupported`.
          example: field_not_sort_ready
        sort_rejection_reason:
          type: string
          description: Stable exact-sort rejection reason; uses the same stable reason taxonomy as `reason`.
          example: field_not_sort_ready
        budget_rejection_reason:
          type: string
          description: |
            Stable budget rejection reason when the rejection was
            budget-driven. Known values include
            `text_exact_late_visibility_totals`,
            `text_field_sort_candidate_window`,
            `match_all_candidate_collect_limit`,
            `match_all_exact_candidate_window`,
            `sorted_segment_scan_window`, and
            `distributed_merge_shard_window`.
          example: text_field_sort_candidate_window
        sort_rejection_detail:
          type: string
          description: |
            Stable user-facing exact-sort rejection detail. Internal storage
            and planner details are reserved for logs, traces, and explicit
            debug surfaces.
          example: field_not_sort_ready
        sort_rejection_field:
          type: string
          description: Sort field associated with the rejection when safe to expose.
          example: created_at
        status:
          type: integer
          format: int32
          example: 422
    SortDirection:
      $ref: "sort.yaml#/components/schemas/SortDirection"
    SortField:
      $ref: "sort.yaml#/components/schemas/SortField"
    ClusterHealth:
      type: string
      enum:
        - unknown
        - healthy
        - unhealthy
        - degraded
        - error
      description: Overall health status of the cluster
    ClusterStatus:
      type: object
      required:
        - health
      additionalProperties: true
      properties:
        health:
          $ref: "#/components/schemas/ClusterHealth"
        message:
          type: string
          description: Optional message providing details about the health status
        auth_enabled:
          type: boolean
          description: Indicates whether authentication is enabled for the cluster
          x-omitzero: false
        deployment_mode:
          type: string
          enum: [embedded, distributed, standalone, serverless]
          description: Runtime deployment topology
        secret_store:
          $ref: "#/components/schemas/SecretStoreStatus"
        runtime_config:
          $ref: "#/components/schemas/RuntimeConfigStatus"
        storage:
          $ref: "#/components/schemas/StorageRuntimeStatus"
    ClusterTopology:
      type: object
      required:
        - health
        - data
      additionalProperties: true
      properties:
        health:
          $ref: "#/components/schemas/ClusterHealth"
        message:
          type: string
          description: Optional message providing details about the health status
        auth_enabled:
          type: boolean
          description: Indicates whether authentication is enabled for the cluster
          x-omitzero: false
        deployment_mode:
          type: string
          enum: [embedded, distributed, standalone, serverless]
          description: Runtime deployment topology
        secret_store:
          $ref: "#/components/schemas/SecretStoreStatus"
        runtime_config:
          $ref: "#/components/schemas/RuntimeConfigStatus"
        storage:
          $ref: "#/components/schemas/StorageRuntimeStatus"
        data:
          $ref: "#/components/schemas/ClusterDataStatus"
    ClusterDataStatus:
      type: object
      description: Typed Zig status view for table data topology and range placement.
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ClusterDataNodeStatus"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/ClusterDataRangeStatus"
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/ClusterDataReplicaStatus"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ClusterDataGroupStatus"
    ConnectionKind:
      type: string
      enum:
        - inference
        - web_search
        - external_io
        - cdc
      description: Kind of external connection configured on this node.
    ConnectionStatus:
      type: string
      enum:
        - connected
        - error
        - configured
        - unsupported
      description: |
        Connection status. "connected" means a live probe or listing succeeded,
        "error" means the probe failed (see the error field), "configured" means
        the connection is present but was not probed, and "unsupported" means
        no probe is available for this connection kind or provider. For S3,
        connected means an authenticated HeadBucket request succeeded for every
        explicitly allowlisted bucket. It verifies bucket discovery permission,
        not mutation permissions such as PutObject.
    InferenceProviderType:
      type: string
      enum:
        - gemini
        - vertex
        - ollama
        - openai
        - openrouter
        - bedrock
        - cohere
        - anthropic
        - antfly
        - mock
      description: Inference provider type for a connection.
    ConnectedModelType:
      type: string
      enum:
        - embedder
        - generator
        - reranker
        - chunker
        - recognizer
        - classifier
        - rewriter
        - reader
        - transcriber
        - extractor
        - other
      description: |
        Model task type. Mirrors the inference registry taxonomy; "other" is
        used for models whose task type the provider's listing API does not
        classify.
    ConnectedModel:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Model identifier as reported by the provider.
        display_name:
          type: string
          description: Human-readable model name when the provider reports one.
        dimensions:
          type: integer
          description: Embedding output dimension when known.
        configured:
          type: boolean
          description: True when this model is referenced by a configured embedder, generator, reranker, or chunker.
    InferenceConnection:
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: "#/components/schemas/InferenceProviderType"
        url:
          type: string
          description: Resolved endpoint URL when applicable.
        region:
          type: string
          description: Cloud region (Bedrock).
        project_id:
          type: string
          description: Google Cloud project (Vertex).
        location:
          type: string
          description: Google Cloud location (Vertex).
        names:
          type: array
          items:
            type: string
          description: Named registry entries from node config that resolve to this provider instance.
        configured_model_types:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedModelType"
          description: Model types this instance is configured for.
        models:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ConnectedModel"
          description: |
            Models reported by the provider, grouped by model type. Keys are
            pluralized ConnectedModelType values ("embedders", "generators",
            "rerankers", "chunkers", "recognizers", "classifiers", "rewriters",
            "readers", "transcribers", "extractors") plus "other" for models
            the provider's listing API does not classify by task. Populated
            only when the request includes the "models" expansion.
    ExternalIoProtocol:
      type: string
      enum:
        - s3
        - gcs
        - filesystem
        - http
      description: External IO transport protocol.
    WebSearchConnection:
      type: object
      properties:
        service:
          type: string
          description: Provider-specific service flavor, such as agent_search for provider vertex.
        max_results:
          type: integer
          description: Maximum ranked results this connection is configured to return.
        timeout_ms:
          type: integer
          description: Provider request timeout in milliseconds.
        safe_search:
          type: boolean
          description: Whether safe-search filtering is requested.
        language:
          type: string
          description: Preferred result language.
        region:
          type: string
          description: Preferred result region.
        include_content:
          type: boolean
          description: Whether extracted content is requested when supported.
        include_highlights:
          type: boolean
          description: Whether highlighted passages are requested when supported.
        endpoint:
          type: string
          description: Provider endpoint override when configured.
        project_id:
          type: string
          description: Google Cloud project for provider vertex.
        location:
          type: string
          description: Google Cloud location for provider vertex.
        data_store:
          type: string
          description: Agent Search data store ID for provider vertex.
        serving_config:
          type: string
          description: Agent Search serving config ID for provider vertex.
        include_domains:
          type: array
          items:
            type: string
          description: Domain allowlist when configured.
        exclude_domains:
          type: array
          items:
            type: string
          description: Domain denylist when configured.
        configured:
          type: boolean
          description: True when required credentials/config are present. Secret values are never returned.
    ExternalIoConnection:
      type: object
      required:
        - protocol
      properties:
        protocol:
          $ref: "#/components/schemas/ExternalIoProtocol"
        endpoint:
          type: string
          description: Custom endpoint URL when configured.
        buckets:
          type: array
          items:
            type: string
          description: Buckets this connection is configured for.
        prefix:
          type: string
          description: Key prefix when configured.
        hosts:
          type: array
          items:
            type: string
          description: Hosts or base URLs this connection applies to.
    CdcConnection:
      type: object
      required:
        - provider
        - table_name
        - source_ordinal
      properties:
        provider:
          type: string
          description: CDC provider type. Currently "postgres"; future CDC providers may add new values.
          example: "postgres"
        table_name:
          type: string
          description: Antfly table receiving changes from this CDC source.
        source_ordinal:
          type: integer
          format: uint32
          description: Zero-based ordinal of the replication source within the table config.
        external_table:
          type: string
          description: Source-side table or stream name when reported by the provider.
        slot_name:
          type: string
          description: Provider replication cursor or slot name when applicable.
        publication_name:
          type: string
          description: Provider publication or stream grouping name when applicable.
        phase:
          type: string
          description: Runtime CDC phase such as snapshot, streaming, configured, or failed.
        lag_records:
          type: integer
          format: uint64
          description: Source records behind, when reported by the runtime.
        lag_millis:
          type: integer
          format: uint64
          description: Source commit lag in milliseconds, when reported by the runtime.
        last_success_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp of the last successful CDC poll/apply, in milliseconds.
        last_change_applied_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp of the last applied source change, in milliseconds.
        updated_at_ms:
          type: integer
          format: uint64
          description: Wall-clock timestamp when this CDC status was last updated, in milliseconds.
    Connection:
      type: object
      required:
        - id
        - name
        - kind
        - status
        - capabilities
      properties:
        id:
          type: string
          description: Stable resource identifier for this connection. Config-derived connections synthesize this from the source config path.
        name:
          type: string
          description: Human-readable short name for this connection instance.
        display_name:
          type: string
          description: Optional display name for UIs.
        provider:
          type: string
          description: Provider token for connection kinds that have a provider-level service identity, such as web_search.
        kind:
          $ref: "#/components/schemas/ConnectionKind"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        error:
          type: string
          description: Failure detail when status is "error".
        capabilities:
          type: array
          items:
            type: string
          description: Namespaced actions and workflow uses this connection supports, such as models.embed, content.fetch, objects.read, or cdc.read_stream.
        sources:
          type: array
          items:
            type: string
          description: |
            Where this connection was configured, e.g.
            "config:embedders/openai-small" or "table:docs/index:body_vec".
        inference:
          $ref: "#/components/schemas/InferenceConnection"
        web_search:
          $ref: "#/components/schemas/WebSearchConnection"
        external_io:
          $ref: "#/components/schemas/ExternalIoConnection"
        cdc:
          $ref: "#/components/schemas/CdcConnection"
    ConnectionsResponse:
      type: object
      required:
        - connections
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    DocumentArtifactChildRange:
      type: object
      description: Parsed child-range descriptor from a derived document artifact manifest.
      required:
        - range_id
        - range_kind
        - artifact_name
        - split_boundary
        - placement
        - start_key
        - end_key_exclusive
        - last_key
        - child_count
      properties:
        range_id:
          type: string
          description: Stable range identifier within the artifact manifest generation.
        range_kind:
          type: string
          description: Kind of children covered by this range, such as unit or chunk.
        artifact_name:
          type: string
          description: Artifact namespace covered by this range.
        split_boundary:
          type: string
          description: Logical boundary used for splitting this range.
        placement:
          type: string
          description: Current placement summary for the range.
        owner_group_id:
          type: integer
          format: uint64
          nullable: true
          description: Owner group for this child artifact range, when assigned.
        placement_generation:
          type: integer
          format: uint64
          nullable: true
          description: Placement generation for range ownership metadata.
        route_status:
          type: string
          nullable: true
          description: Current routing status for child writes in this range.
        split_eligible:
          type: boolean
          nullable: true
          description: Whether this range may split at its configured split boundary.
        start_key:
          type: string
          description: Inclusive first internal child key covered by this range.
        end_key_exclusive:
          type: string
          description: Exclusive end internal child key, or empty for the final range.
        last_key:
          type: string
          description: Inclusive last internal child key covered by this range.
        child_count:
          type: integer
          description: Number of child records covered by this range.
        text_bytes:
          type: integer
          nullable: true
          description: Approximate extracted text bytes covered by this range when available.
    DocumentArtifactManifest:
      type: object
      description: |
        Inspection view for a derived document artifact produced from a source
        table row. The typed fields form the stable summary contract. The
        embedded manifest/state JSON fields are optional raw detail intended
        for admin/debug inspection so producers can evolve their internal unit
        schema without changing this route contract.
      required:
        - document_id
        - artifact_name
        - artifact_id
        - manifest_version
        - generation
        - source_url
        - source_fingerprint
        - content_type
        - route_type
        - unit_count
        - chunk_count
        - child_ranges
        - child_range_count
        - merge_status
        - merge_from_generation
        - merge_to_generation
        - merge_operation_granularity
        - merge_operation_count
      properties:
        document_id:
          type: string
          description: Stable identity of the source document.
        artifact_name:
          type: string
          description: Name of the derived artifact.
          example: document_units_v1
        artifact_id:
          type: string
          description: Stable identity of this artifact under the document.
        manifest_version:
          type: integer
          format: uint64
          description: Version of the opaque manifest payload schema.
        generation:
          type: integer
          format: uint64
          description: Monotonic generation for the current artifact state.
        source_url:
          type: string
          description: Source URL or source identifier used to derive this artifact.
        source_fingerprint:
          type: string
          description: Fingerprint of the source bytes and extractor configuration.
        content_type:
          type: string
          description: Effective source content type selected during extraction.
        route_type:
          type: string
          description: Producer route selected for the source content.
          example: pdf
        unsupported_reason:
          type: string
          nullable: true
          description: Reason extraction was skipped, when the source type is unsupported.
        unit_count:
          type: integer
          description: Number of extracted document units.
        chunk_count:
          type: integer
          description: Number of indexable chunks derived from the units.
        child_ranges:
          type: array
          description: Parsed child range descriptors for this artifact generation.
          items:
            $ref: "#/components/schemas/DocumentArtifactChildRange"
        child_range_count:
          type: integer
          description: Number of storage child ranges used by this artifact.
        merge_status:
          type: string
          description: Current materialization or merge status.
        merge_from_generation:
          type: integer
          format: uint64
          description: Previous artifact generation used by the current merge plan.
        merge_to_generation:
          type: integer
          format: uint64
          description: Target artifact generation produced by the current merge plan.
        merge_operation_granularity:
          type: string
          description: Granularity used when computing merge-plan operations.
        merge_operation_count:
          type: integer
          description: Number of merge operations recorded for this artifact.
        last_error_code:
          type: string
          nullable: true
          description: Last extraction or materialization error code, when the current artifact generation failed.
        last_error_message:
          type: string
          nullable: true
          description: Human-readable last extraction or materialization error summary, when available.
        manifest_json:
          type: string
          description: Opaque JSON manifest for the artifact units and provenance. Present only for raw detail responses.
        state_json:
          type: string
          nullable: true
          description: Optional opaque JSON state for incremental processing. Present only for raw detail responses.
    DocumentArtifactManifestList:
      type: object
      description: Available derived document artifact manifests for a source document.
      required:
        - document_id
        - artifacts
      properties:
        document_id:
          type: string
          description: Stable identity of the source document.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/DocumentArtifactManifest"
    TableArtifactEnrichmentList:
      type: object
      description: Table-level generated artifact enrichments configured for a table.
      required:
        - table_name
        - artifacts
      properties:
        table_name:
          type: string
          description: Table containing the configured artifact enrichments.
        artifacts:
          type: array
          items:
            $ref: "indexes.yaml#/components/schemas/EnrichmentConfig"
    ArtifactRepairKind:
      type: string
      description: Kind of stored artifact tracked by the repair queue.
      enum:
        - embedding
        - asset
        - chunk
        - graph
        - full_text
        - algebraic
    ArtifactRepairReason:
      type: string
      description: Reason an artifact was added to the repair queue.
      enum:
        - missing_artifact
        - corrupt_artifact
        - unreadable_artifact
    RepairTarget:
      type: string
      description: Repair subsystem to inspect or run.
      enum:
        - artifact
        - index
    TableRepairIssue:
      type: object
      description: Durable table repair debt. Artifact targets include exact source and artifact identifiers; index targets include the affected index and repair status.
      required:
        - artifact_kind
        - index_name
        - doc_key
        - artifact_name
        - repairable
        - sequence
        - reason
        - attempts
        - first_seen_ns
        - last_seen_ns
      properties:
        artifact_kind:
          $ref: "#/components/schemas/ArtifactRepairKind"
        index_name:
          type: string
          description: Index whose replay or derived state observed the artifact problem.
        doc_key:
          type: string
          description: Source or derived document key whose artifact is missing or unreadable.
        parent_doc_key:
          type: string
          description: Parent source document key for chunk-derived artifacts.
        unit_id:
          type: string
          description: Unit identifier for unit-scoped artifacts, when applicable.
        source_artifact_name:
          type: string
          description: Source artifact stream used to produce this artifact, when applicable.
        artifact_name:
          type: string
          description: Derived artifact name that must be reprocessed or made readable.
        artifact_key:
          type: string
          description: Hex-encoded internal artifact storage key, when known.
        chunk_id:
          type: integer
          format: uint32
          nullable: true
          description: Chunk ordinal for chunk-derived artifacts.
        repairable:
          type: boolean
          description: Whether this artifact kind currently has an automated repair reprocessor.
        unsupported_reason:
          type: string
          description: Stable reason code when repairable is false.
        sequence:
          type: integer
          format: uint64
          description: Derived replay sequence that observed the issue.
        reason:
          $ref: "#/components/schemas/ArtifactRepairReason"
        attempts:
          type: integer
          format: uint64
          description: Number of repair attempts made for this issue.
        first_seen_ns:
          type: integer
          format: uint64
          description: Monotonic timestamp when this issue was first recorded.
        last_seen_ns:
          type: integer
          format: uint64
          description: Monotonic timestamp when this issue was last observed or attempted.
        last_error:
          type: string
          description: Last stable repair error code, when a repair attempt failed.
    TableRepairIssueList:
      type: object
      description: Bounded page of table repair issues.
      required:
        - table
        - target
        - limit
        - scanned
        - groups_scanned
        - has_more
        - issues
      properties:
        table:
          type: string
          description: Table whose repair queue was listed.
        target:
          $ref: "#/components/schemas/RepairTarget"
        limit:
          type: integer
          format: uint32
          description: Effective page limit.
        scanned:
          type: integer
          format: uint64
          description: Number of repair records scanned while building this page.
        groups_scanned:
          type: integer
          format: uint64
          description: Number of table groups touched while building this page.
        has_more:
          type: boolean
          description: Whether another page is available.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page when has_more is true.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/TableRepairIssue"
    RepairIssueListRequest:
      type: object
      description: Bounded request to list table repair issues.
      properties:
        target:
          $ref: "#/components/schemas/RepairTarget"
          default: artifact
          description: Repair subsystem to list. `artifact` lists durable artifact queue records; `index` lists index repair candidates derived from index status and artifact debt.
        kind:
          $ref: "#/components/schemas/ArtifactRepairKind"
        index:
          type: string
          description: Restrict results to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior response.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum repair records to return.
    RepairRunRequest:
      type: object
      description: Bounded request to run a table repair pass.
      properties:
        target:
          $ref: "#/components/schemas/RepairTarget"
        kind:
          $ref: "#/components/schemas/ArtifactRepairKind"
        index:
          type: string
          description: Restrict repair attempts to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior repair response.
        force:
          type: boolean
          default: false
          description: Force one named-index replacement generation even when no repair debt is currently recorded. The force is dispatched once across the initial bounded group traversal; later convergence passes only observe that generation. Only applies to target=index.
        control:
          type: string
          enum: [pause_automatic, resume_automatic, cancel_current_attempt]
          description: Applies one control to an existing named index repair. Requires target=index and index; cannot be combined with force, kind, or cursor.
        repair_id:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Optional opaque generation fence for a repair control. A stale value is rejected instead of affecting a newer repair.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum artifact repair records to attempt. For target=index, any positive value permits one named index repair.
    TableRepairRunResult:
      type: object
      description: Result of one bounded table repair pass.
      required:
        - scanned
        - groups_scanned
        - reprocessed
        - repaired
        - missing_source_docs
        - failed
        - unsupported
        - unresolved
        - in_progress
        - indexes_rebuilt
        - indexes_degraded
        - controls_applied
        - limit
        - has_more
        - debt_remaining
      properties:
        scanned:
          type: integer
          format: uint64
          description: Number of repair records attempted by this pass.
        groups_scanned:
          type: integer
          format: uint64
          description: Number of table groups touched by this bounded repair pass.
        reprocessed:
          type: integer
          format: uint64
          description: Number of artifacts whose source was reprocessed.
        repaired:
          type: integer
          format: uint64
          description: Number of repair records cleared because the artifact became readable.
        missing_source_docs:
          type: integer
          format: uint64
          description: Number of repair records whose source document no longer exists.
        failed:
          type: integer
          format: uint64
          description: Number of supported repair attempts that failed.
        unsupported:
          type: integer
          format: uint64
          description: Number of repair records skipped because no automated repair exists for the selected target.
        unresolved:
          type: integer
          format: uint64
          description: Number of attempted repair records that remained queued after this pass.
        in_progress:
          type: integer
          format: uint64
          description: Number of selected repair records or indexes skipped because another repair pass already owns them.
        indexes_rebuilt:
          type: integer
          format: uint64
          description: Number of indexes rebuilt by this pass when target is index.
        indexes_degraded:
          type: integer
          format: uint64
          description: Number of selected indexes that were already degraded or quarantined before repair.
        controls_applied:
          type: integer
          format: uint64
          description: Number of existing index repairs that accepted the requested control.
        limit:
          type: integer
          format: uint32
          description: Effective repair limit.
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next artifact repair pass when has_more is true. Index repair currently repairs one named index per request and does not return a continuation cursor.
        has_more:
          type: boolean
          description: Whether another repair scan page is available via next_cursor.
        debt_remaining:
          type: boolean
          description: Whether repair debt remains after this bounded pass. If true and next_cursor is
            absent, rerun repair from the beginning after addressing failed or unsupported records.
    TableRepairRunResponse:
      type: object
      description: Response for a bounded table repair pass.
      required:
        - table
        - target
        - limit
        - result
      properties:
        table:
          type: string
          description: Table whose repair queue was processed.
        target:
          $ref: "#/components/schemas/RepairTarget"
        limit:
          type: integer
          format: uint32
          description: Effective repair limit.
        result:
          $ref: "#/components/schemas/TableRepairRunResult"
    TableRepairJobStartRequest:
      type: object
      description: Starts a durable table repair job. The job advances in bounded passes using the same repair request shape as runTableRepair.
      properties:
        target:
          $ref: "#/components/schemas/RepairTarget"
          default: artifact
        kind:
          $ref: "#/components/schemas/ArtifactRepairKind"
        index:
          type: string
          description: Restrict repair attempts to one index name.
        cursor:
          type: string
          description: Opaque cursor returned by a prior repair response.
        force:
          type: boolean
          default: false
          description: Force a named index rebuild even when no repair debt is currently recorded. Only applies to target=index.
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum artifact repair records to attempt per pass. For target=index, any positive value permits one named index repair.
        advance:
          type: boolean
          default: true
          description: When true, the server immediately attempts the first bounded repair pass before returning the job.
    TableRepairJob:
      type: object
      description: Durable table repair job state.
      required:
        - job_id
        - attempt_id
        - table_name
        - phase
        - repair_status
        - target
        - limit
        - force
        - result
        - cancel_requested
        - created_at_millis
        - last_updated_at_millis
        - expires_at_millis
      properties:
        job_id:
          type: integer
          format: uint64
          description: Server-assigned durable repair job identifier.
        attempt_id:
          type: integer
          format: uint64
          description: Monotonic execution attempt token for the current running pass.
        table_name:
          type: string
          description: Table being repaired.
        phase:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
          description: Lifecycle phase of the repair job.
        repair_status:
          type: string
          enum: [in_progress, complete, debt_remaining, stopped]
          description: User-facing repair progress state. `debt_remaining` means the bounded job stopped because unsupported or failed debt still requires operator action.
        target:
          $ref: "#/components/schemas/RepairTarget"
        kind:
          $ref: "#/components/schemas/ArtifactRepairKind"
        index:
          type: string
          description: Index name when the job is restricted to one index.
        cursor:
          type: string
          nullable: true
          description: Opaque continuation cursor for the next bounded repair pass.
        limit:
          type: integer
          format: uint32
          description: Effective per-pass repair limit.
        force:
          type: boolean
          description: Whether the next bounded pass still needs to dispatch the job's one forced named-index generation.
        result:
          $ref: "#/components/schemas/TableRepairRunResult"
        last_error:
          type: string
          nullable: true
          description: Last stable job-level error code.
        cancel_requested:
          type: boolean
          description: Whether cancellation is pending. For a named-index job, cancellation durably pauses the matching repair in every group and becomes terminal only after that bounded traversal completes.
        created_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was created.
        last_updated_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job state was last updated.
        expires_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job is eligible for cleanup.
    DocumentArtifactReprocessResponse:
      type: object
      required:
        - reprocess
      properties:
        reprocess:
          type: string
          enum:
            - triggered
          description: Indicates that reprocessing was accepted.
    DocumentArtifactTableReprocessRequest:
      type: object
      description: Bounded request for reprocessing a derived artifact across source rows in key order.
      properties:
        from_key:
          type: string
          description: Exclusive lower bound source document key. Use the prior response next_key to continue.
          default: ""
        to_key:
          type: string
          description: Inclusive upper bound source document key, or empty for the end of the table/range.
          default: ""
        limit:
          type: integer
          format: uint32
          description: Maximum source rows to scan per shard-local repair pass. Zero uses the server default.
          default: 100
        shard_cursors:
          type: array
          description: Per-shard continuation cursors returned by a prior response. When present, distributed repair resumes exactly these shard-local cursors instead of resolving a fresh global key span.
          items:
            $ref: "#/components/schemas/DocumentArtifactReprocessShardCursor"
    DocumentArtifactReprocessFailure:
      type: object
      required:
        - key
        - error_code
      properties:
        key:
          type: string
          description: Source document key that failed during reprocessing.
        error_code:
          type: string
          description: Stable error code for the failed document reprocess attempt.
    DocumentArtifactReprocessShardCursor:
      type: object
      required:
        - next_key
        - scanned
        - reprocessed
        - skipped
        - failed
        - limit
      properties:
        group_id:
          type: integer
          format: uint64
          nullable: true
          description: Physical table group that produced this cursor, when known.
        next_key:
          type: string
          description: Source key cursor for resuming this shard-local repair pass.
        scanned:
          type: integer
          description: Number of source rows scanned by this shard-local pass.
        reprocessed:
          type: integer
          description: Number of source rows whose artifact was reprocessed by this shard-local pass.
        skipped:
          type: integer
          description: Number of scanned source rows that no longer had a reprocessable source document in this shard-local pass.
        failed:
          type: integer
          description: Number of scanned source rows that failed in this shard-local pass.
        limit:
          type: integer
          format: uint32
          description: Effective scan limit used by this shard-local pass.
    DocumentArtifactTableReprocessResponse:
      type: object
      required:
        - reprocess
        - reprocess_status
        - artifact_name
        - scanned
        - reprocessed
        - skipped
        - failed
        - limit
        - pending_shards
        - failures
        - shard_cursors
      properties:
        reprocess:
          type: string
          enum:
            - triggered
          description: Indicates that reprocessing was accepted.
        reprocess_status:
          type: string
          enum:
            - in_progress
            - complete
          description: Completion state for this bounded pass. `in_progress` means the caller should persist the returned cursor(s) and schedule another pass; `complete` means no continuation cursor remains.
        artifact_name:
          type: string
          description: Name of the derived artifact that was reprocessed.
        scanned:
          type: integer
          description: Number of source rows scanned by this bounded pass.
        reprocessed:
          type: integer
          description: Number of source rows whose artifact was reprocessed.
        skipped:
          type: integer
          description: Number of scanned source rows that no longer had a reprocessable source document.
        failed:
          type: integer
          description: Number of scanned source rows that failed before recording a normal artifact manifest.
        limit:
          type: integer
          format: uint32
          description: Effective scan limit used by the bounded pass.
        next_key:
          type: string
          nullable: true
          description: Source key cursor for the next bounded pass, when more rows may remain.
        pending_shards:
          type: integer
          description: Number of shard-local continuations still pending after this pass. For single-shard callers this is 1 when only `next_key` remains and 0 when complete.
        failures:
          type: array
          items:
            $ref: "#/components/schemas/DocumentArtifactReprocessFailure"
        shard_cursors:
          type: array
          description: Per-shard continuation cursors for distributed repairs. Durable background repair jobs should persist and resume these independently instead of collapsing progress into a single global cursor.
          items:
            $ref: "#/components/schemas/DocumentArtifactReprocessShardCursor"
    DocumentArtifactReprocessJobStartRequest:
      type: object
      description: Request to create a durable table artifact reprocess job.
      properties:
        from_key:
          type: string
          description: Exclusive lower bound source document key.
          default: ""
        to_key:
          type: string
          description: Inclusive upper bound source document key, or empty for the end of the table/range.
          default: ""
        limit:
          type: integer
          format: uint32
          description: Maximum source rows to scan per shard-local repair pass. Zero uses the server default.
          default: 100
        advance:
          type: boolean
          description: When true, immediately runs the first bounded pass before returning the job state.
          default: true
    DocumentArtifactReprocessJob:
      type: object
      required:
        - job_id
        - attempt_id
        - table_name
        - artifact_name
        - phase
        - reprocess_status
        - from_key
        - to_key
        - limit
        - scanned
        - reprocessed
        - skipped
        - failed
        - pending_shards
        - failures
        - shard_cursors
        - cancel_requested
        - created_at_millis
        - last_updated_at_millis
        - expires_at_millis
      properties:
        job_id:
          type: integer
          format: uint64
          description: Server-assigned durable repair job identifier.
        attempt_id:
          type: integer
          format: uint64
          description: Monotonic execution attempt token for the current running pass.
        table_name:
          type: string
          description: Table containing the source documents being repaired.
        artifact_name:
          type: string
          description: Name of the derived artifact being repaired.
        phase:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
          description: Lifecycle phase of the repair job.
        reprocess_status:
          type: string
          enum:
            - in_progress
            - complete
            - stopped
          description: User-facing completion status derived from the phase and remaining cursors.
        from_key:
          type: string
          description: Original exclusive lower bound for the job.
        to_key:
          type: string
          description: Original inclusive upper bound for the job, or empty for the end of the table/range.
        limit:
          type: integer
          format: uint32
          description: Current per-shard bounded pass limit.
        next_key:
          type: string
          nullable: true
          description: Single-shard continuation key when no shard cursors are present.
        scanned:
          type: integer
          description: Cumulative source rows scanned by completed passes.
        reprocessed:
          type: integer
          description: Cumulative source rows whose artifact was reprocessed.
        skipped:
          type: integer
          description: Cumulative source rows skipped by completed passes.
        failed:
          type: integer
          description: Cumulative source rows that failed during completed passes.
        pending_shards:
          type: integer
          description: Number of shard-local continuations still pending.
        failures:
          type: array
          description: Failures from the most recent completed pass.
          items:
            $ref: "#/components/schemas/DocumentArtifactReprocessFailure"
        shard_cursors:
          type: array
          description: Per-shard continuation cursors to resume on the next advance operation.
          items:
            $ref: "#/components/schemas/DocumentArtifactReprocessShardCursor"
        last_error:
          type: string
          nullable: true
          description: Last terminal or transient job error, when available.
        cancel_requested:
          type: boolean
          description: Whether cancellation has been requested for a running pass. Running passes finish at a bounded reprocess boundary before the job transitions to cancelled.
        created_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was created.
        last_updated_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds when the job was last updated.
        expires_at_millis:
          type: integer
          format: uint64
          description: Unix epoch milliseconds after which the retained job status may be removed.
