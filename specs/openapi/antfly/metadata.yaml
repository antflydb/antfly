          description: |
            Structured subset of the Antfly query AST used to filter a primary-key
            scan. Only documents matching this query are included in results.
            Because scans do not open a text index, text-index-only variants such
            as phrase and multi-match queries are rejected with a validation error
            instead of being evaluated with slower stored-document semantics.

            Examples:
            - Status filtering: `{"term":{"path":"/status","value":"published"}}`
            - Date ranges: `{"range":{"/created_at":{"gte":"2023-01-01"}}}`
            - Field existence: `{"exists":{"path":"/category"}}`
        limit:
          type: integer
          minimum: 1
          description: |
            Maximum number of results to return. If not specified, returns all
            matching keys in the range. Useful for pagination or sampling.
          example: 100

    BatchRequest:
      type: object
      description: |
        Batch insert, delete, and transform operations in a single request.

        **Atomicity**:
        - **Single shard**: Operations are atomic within shard boundaries
        - **Multiple shards**: Uses distributed 2-phase commit (2PC) for atomic cross-shard writes

        **How distributed transactions work**:
        1. Metadata server allocates HLC timestamp and selects coordinator shard
        2. Coordinator writes transaction record, participants write intents
        3. After all intents succeed, coordinator commits transaction
        4. Participants are notified asynchronously to resolve intents
        5. Recovery loop ensures notifications complete even after coordinator failure

        **Performance**:
        - Single-shard batches: < 5ms latency
        - Cross-shard transactions: ~20ms latency
        - Intent resolution: < 30 seconds worst-case (via recovery loop)

        **Guarantees**:
        - All writes succeed or all fail (atomicity across all shards)
        - Coordinator failure is recoverable (new leader resumes notifications)
        - Idempotent resolution (duplicate notifications are safe)

        **Benefits**:
        - Reduces network overhead compared to individual requests
        - More efficient indexing (updates are batched)
        - Automatic distributed transactions when operations span shards

        The inserts are upserts - existing keys are overwritten, new keys are created.
      properties:
        inserts: # Renamed from Writes for clarity
          type: object
          description: |
            Map of document IDs to document objects. Each key is the unique identifier for the document.

            Best practices:
            - Use consistent key naming schemes (e.g., "user:123", "article:456")
            - Key length affects storage and performance - keep them reasonably short
            - Keys are sorted lexicographically, so choose prefixes that support range scans
          additionalProperties:
            type: object # map[string]any
            description: Document object with arbitrary fields matching your table schema.
          example:
            "user:123":
              name: "John Doe"
              email: "john@example.com"
              age: 30
              tags: ["customer", "premium"]
            "user:456":
              name: "Jane Smith"
              email: "jane@example.com"
              age: 25
              tags: ["customer"]
        deletes:
          type: array
          description: |
            Array of document IDs to delete. Documents are removed from all indexes.

            Notes:
            - Non-existent keys are silently ignored
            - Deletions are processed before inserts in the same batch
            - Keys are permanently removed from storage and indexes
          items:
            type: string
          example: ["user:789", "user:old_account"]
        transforms:
          type: array
          description: |
            Array of transform operations for in-place document updates using MongoDB-style operators.

            Transform operations allow you to modify documents without read-modify-write races:
            - Operations are applied atomically on the server
            - Multiple operations per document are applied in sequence
            - Supports numeric and set-like operations ($inc, $max, $addToSet)

            Common use cases:
            - Increment counters (views, likes, votes)
            - Update timestamps ($set)
            - Add unique array values ($addToSet)
            - Update nested fields without overwriting the entire document
          items:
            $ref: "#/components/schemas/Transform"
          example:
            - key: "article:123"
              operations:
                - op: "$inc"
                  path: "$.views"
                  value: 1
                - op: "$set"
                  path: "$.lastViewed"
                  value: "2026-07-28T12:00:00Z"
            - key: "user:456"
              operations:
                - op: "$addToSet"
                  path: "$.tags"
                  value: "vip"
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
      example:
        inserts:
          "user:123":
            name: "John Doe"
            email: "john@example.com"
            age: 30
            tags: ["customer", "premium"]
          "user:456":
            name: "Jane Smith"
            email: "jane@example.com"
            age: 25
            tags: ["customer"]
        deletes:
          - "user:789"
          - "user:old_account"
    BatchResponse:
      type: object
      properties:
        inserted:
          type: integer
          description: Number of documents successfully inserted
        deleted:
          type: integer
          description: Number of documents successfully deleted
        transformed:
          type: integer
          description: Number of documents successfully transformed
    RowPrimarySelector:
      type: object
      additionalProperties: true
      description: |
        Structured primary-key identity. Keys are the declared
        `primary_key.columns`; values are JSON scalar values coerced with the
        table's relational column types.
      example:
        tenant_id: "t1"
        order_id: "o9"
    RowUniqueSelector:
      type: object
      additionalProperties: false
      description: |
        Structured unique-key selector. The server encodes `values` with the
        same relational tuple encoder used by storage, routes to the durable
        unique-owner range, and reads the owner row to resolve the physical row
        identity. This is a point lookup, not a query scan. The selector object
        is exact: only `name` and `values` are accepted.
      properties:
        name:
          type: string
          description: Unique constraint name.
        values:
          type: object
          additionalProperties: true
          description: Values for the declared unique-constraint columns.
      required:
        - name
        - values
    RowSelector:
      type: object
      additionalProperties: false
      description: |
        Structured row selector. `primary` addresses declared primary-key
        tables directly. `unique` addresses a declared unique constraint through
        durable unique-owner rows. The selector is exact and accepts exactly one
        of `primary` or `unique`.
      properties:
        primary:
          $ref: "#/components/schemas/RowPrimarySelector"
        unique:
          $ref: "#/components/schemas/RowUniqueSelector"
      oneOf:
        - required:
            - primary
        - required:
            - unique
    RowsRowDocument:
      type: object
      additionalProperties: true
      description: |
        Full relational row document. Keys are declared relational columns and
        values are JSON values coerced through the table schema before storage.
    RowsFieldPatch:
      type: object
      additionalProperties: true
      description: |
        Static field patch for top-level relational columns. Primary-key fields
        are rejected by the server.
    RowsNumericIncrement:
      type: object
      description: Numeric increment map keyed by declared numeric columns.
      additionalProperties:
        type: number
        format: double
    RowsExpressionAssignmentMap:
      type: object
      description: Field-to-expression assignment map over the shared row-expression AST.
      additionalProperties:
        $ref: "#/components/schemas/RowsExpression"
    RowsJsonSetTransform:
      type: object
      additionalProperties: false
      description: JSON path assignment for a declared `json` column. Exactly one of `value` or `expr` must be supplied.
      properties:
        field:
          type: string
          description: Declared `json` column to update.
        path:
          type: array
          minItems: 1
          items:
            type: string
          description: Non-empty path under the JSON column.
        value:
          description: JSON value to write at the path.
        expr:
          $ref: "#/components/schemas/RowsExpression"
          description: Expression value to evaluate at mutation time and write at the path.
      required:
        - field
        - path
    RowsArrayUpdateTransform:
      type: object
      additionalProperties: false
      description: Array transform for a declared `array` column.
      properties:
        field:
          type: string
          description: Declared `array` column to update.
        op:
          type: string
          enum:
            - append
            - remove
            - add_to_set
        value:
          description: JSON value to append, remove, or add if absent.
      required:
        - field
        - op
        - value
    RowsUniquePredicate:
      type: object
      additionalProperties: false
      description: Predicate atom that must match a partial unique constraint definition.
      properties:
        field:
          type: string
        op:
          type: string
          enum:
            - is_null
            - is_not_null
            - eq
            - ne
        value:
          description: Predicate comparison value. Omit for null-test operators.
      required:
        - field
        - op
    RowsUniquePredicateGroup:
      type: object
      additionalProperties: false
      description: Conjunction of partial-unique predicate atoms.
      properties:
        all:
          type: array
          items:
            $ref: "#/components/schemas/RowsUniquePredicate"
      required:
        - all
    RowsConflictUniqueTarget:
      type: object
      additionalProperties: false
      description: Declared unique constraint target for `ON CONFLICT`.
      properties:
        name:
          type: string
          description: Unique constraint name.
        where:
          $ref: "#/components/schemas/RowsUniquePredicateGroup"
        where_expressions:
          type: array
          description: |
            Expression predicates for expression-partial unique conflict targets.
            When present, the list must exactly match the named unique
            constraint's stored expression predicate metadata.
          items:
            $ref: "#/components/schemas/RowsExpressionCondition"
      required:
        - name
    RowsConflictTarget:
      type: object
      additionalProperties: false
      description: Primary-key or named unique constraint conflict target.
      properties:
        primary:
          type: boolean
          description: Set to `true` to target the declared primary key.
        unique:
          $ref: "#/components/schemas/RowsConflictUniqueTarget"
      oneOf:
        - required:
            - primary
        - required:
            - unique
    RowsOnConflict:
      type: object
      additionalProperties: false
      description: |
        Typed conflict action for insert operations. `nothing` skips the insert
        when the target already exists. `update` applies the same typed update
        operators as ordinary row updates, with expression sources allowed to
        reference `existing` and `proposed` row images.
      properties:
        target:
          $ref: "#/components/schemas/RowsConflictTarget"
        action:
          type: string
          enum:
            - update
            - nothing
        patch:
          $ref: "#/components/schemas/RowsFieldPatch"
        increment:
          $ref: "#/components/schemas/RowsNumericIncrement"
        patch_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
        increment_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
        json_set:
          type: array
          items:
            $ref: "#/components/schemas/RowsJsonSetTransform"
        array_update:
          type: array
          items:
            $ref: "#/components/schemas/RowsArrayUpdateTransform"
        where_expression:
          $ref: "#/components/schemas/RowsExpressionCondition"
      required:
        - target
        - action
    RowOperation:
      type: object
      additionalProperties: false
      description: |
        Structured relational row mutation. `insert` fails if the primary
        identity already exists, `upsert` overwrites or creates, `update`
        applies a non-upsert patch by primary or unique identity, and `delete`
        removes by primary or unique identity. `update.patch` cannot change
        primary-key components. Missing unique selectors fail the write request
        rather than falling back to scans. The operation envelope is exact and
        operation-specific: unsupported fields for the selected `op` fail
        validation instead of being ignored.
      properties:
        op:
          type: string
          enum:
            - insert
            - upsert
            - update
            - delete
        row:
          $ref: "#/components/schemas/RowsRowDocument"
          description: Full row document for insert/upsert. Must include primary-key columns.
        where:
          $ref: "#/components/schemas/RowSelector"
        patch:
          $ref: "#/components/schemas/RowsFieldPatch"
          description: Top-level field patch for update operations.
        increment:
          $ref: "#/components/schemas/RowsNumericIncrement"
        patch_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
        increment_expr:
          $ref: "#/components/schemas/RowsExpressionAssignmentMap"
        json_set:
          type: array
          items:
            $ref: "#/components/schemas/RowsJsonSetTransform"
        array_update:
          type: array
          items:
            $ref: "#/components/schemas/RowsArrayUpdateTransform"
        on_conflict:
          $ref: "#/components/schemas/RowsOnConflict"
        returning:
          type: array
          items:
            type: string
          description: Fields to return from the committed mutation image. `*` returns the full row and cannot be combined with expression projections.
        returning_expressions:
          type: array
          items:
            $ref: "#/components/schemas/RowsExpressionProjection"
          description: Typed row-expression projections from the committed mutation image.
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: Optional optimistic-concurrency predicate for update/delete. The predicate applies to the physical row resolved from primary or unique identity.
      required:
        - op
    RowsBatchRequest:
      type: object
      additionalProperties: false
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/RowOperation"
        sync_level:
          $ref: "#/components/schemas/SyncLevel"
      required:
        - operations
    RelationalColumnBackedIndexRepairRequest:
      type: object
      additionalProperties: false
      properties:
        worker_id:
          type: string
          minLength: 1
