          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/reprocess-jobs/{jobId}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Reprocess job identifier.
        schema:
          type: string
    get:
      summary: Get derived document artifact reprocess job status
      tags:
        - data_operations
      operationId: getDocumentArtifactReprocessJob
      responses:
        "200":
          description: Reprocess job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/reprocess-jobs/{jobId}/advance:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Reprocess job identifier.
        schema:
          type: string
    post:
      summary: Advance a derived document artifact reprocess job
      description: Runs one bounded repair pass and persists the resulting job state.
      tags:
        - data_operations
      operationId: advanceDocumentArtifactReprocessJob
      responses:
        "202":
          description: Reprocess job advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "200":
          description: Reprocess job was already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/artifacts/{artifactName}/reprocess-jobs/{jobId}/cancel:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        description: Reprocess job identifier.
        schema:
          type: string
    post:
      summary: Cancel a derived document artifact reprocess job
      description: |
        Cancels a queued document artifact reprocess job. If a reprocess pass is
        already running, the response returns the current running state;
        cancellation is applied only at pass boundaries so the API never reports
        a committed in-flight pass as cancelled.
      tags:
        - data_operations
      operationId: cancelDocumentArtifactReprocessJob
      responses:
        "200":
          description: Reprocess job cancelled or already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "202":
          description: Cancellation requested; the current running pass has not yet reached a cancellation boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/documents/{key}/artifacts/{artifactName}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: Percent-encoded source document key.
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
    get:
      summary: Inspect a derived document artifact manifest
      description: |
        Returns manifest and processing state for a derived document artifact,
        such as the document-unit hierarchy extracted from a PDF, HTML page, or
        text field. The route is shard-aware; hosted deployments route the
        request to the data group that owns the source document key.
      parameters:
        - name: detail
          in: query
          required: false
          description: |
            Response detail level. `summary` returns typed manifest fields only.
            `raw` also includes opaque manifest/state JSON and requires table
            admin permission when authentication is enabled.
          schema:
            type: string
            enum: [summary, raw]
      tags:
        - data_operations
      operationId: getDocumentArtifactManifest
      responses:
        "200":
          description: Artifact manifest found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactManifest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/documents/{key}/artifacts/{artifactName}/reprocess:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: Percent-encoded source document key.
        schema:
          type: string
      - name: artifactName
        in: path
        required: true
        description: Name of the derived document artifact.
        schema:
          type: string
    post:
      summary: Reprocess a derived document artifact
      description: |
        Invalidates the current artifact state and requests the producer to
        rebuild the derived document hierarchy for the source document.
      tags:
        - data_operations
      operationId: reprocessDocumentArtifact
      responses:
        "202":
          description: Reprocessing was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArtifactReprocessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/indexes:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
    get:
      summary: List all indexes for a table
      tags:
        - index_management
      # Note: Handler in code is handleListTables, which seems incorrect for this path.
      # Documenting based on path intent and typical API design.
      operationId: listIndexes # Changed from listTablesForIndexes
      responses:
        "200":
          description: A list of indexes for the table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndexStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tables/{tableName}/indexes/{indexName}:
    parameters:
      - name: tableName
        in: path
        required: true
        description: Name of the table
        schema:
          type: string
      - name: indexName
        in: path
        required: true
        description: Name of the index
        schema:
          type: string
    post:
      summary: Add an index to a table
      tags:
        - index_management
      operationId: createIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              #$ref: "#/components/schemas/CreateIndexRequest"
              $ref: "indexes.yaml#/components/schemas/IndexConfig"
      responses:
        "201": # Corrected to 201 as per handler
          description: Index added successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Drop an index from a table
      tags:
        - index_management
      operationId: dropIndex
      responses:
        "201": # Corrected to 201 (StatusCreated) as per handler, though 204 is more typical for DELETE
          description: Index dropped successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: Get index details
      tags:
        - index_management
      operationId: getIndex
      responses:
        "200":
          description: Index details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
