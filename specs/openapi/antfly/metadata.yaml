        shards: # map[types.ID]*ShardInfo
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ShardConfig"
        schema:
          $ref: "schema.yaml#/components/schemas/TableSchema"
        migration:
          description: Present only when the table is migrating between schema versions. Absent means the table is stable.
          $ref: "#/components/schemas/TableMigration"
        replication_sources:
          type: array
          items:
            $ref: "#/components/schemas/ReplicationSource"
          description: |
            PostgreSQL CDC replication sources configured for this table.
        field_capabilities:
          type: array
          description: |
            Effective runtime field capabilities for this table. Clients can use this to discover
            concrete field variants and their supported query modes, such as full_text, exact,
            range, geo, and autocomplete. Public exact field sort is supported only for `_id`
            or scalar fields marked sortable whose sort lifecycle is queryable or accelerated.
          items:
            $ref: "#/components/schemas/FieldCapability"
