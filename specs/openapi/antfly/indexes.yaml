openapi: 3.0.3
info:
  title: Index Configuration
  description: "An OpenAPI specification for configuring different indexes in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    SortDirection:
      $ref: "sort.yaml#/components/schemas/SortDirection"
    SortField:
      $ref: "sort.yaml#/components/schemas/SortField"
    IndexType:
      # FIXME (ajr) Looks like a bug in oapi-codegen where it doesn't respect
      # the x-go-type-skip-optional-pointer when the schema is referenced from
      # another schema in the MarshalJSON.
      #
      # x-go-type-skip-optional-pointer: true
      type: string
      enum:
        - full_text
        - embeddings
        - graph
        - algebraic
      description: "The type of the index."
    IndexConfig:
      type: object
      description: "Configuration for an index"
      oneOf:
        - $ref: "#/components/schemas/FullTextIndexConfig"
        - $ref: "#/components/schemas/EmbeddingsIndexConfig"
        - $ref: "#/components/schemas/GraphIndexConfig"
        - $ref: "#/components/schemas/AlgebraicIndexConfig"
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: "Name of the index"
        description:
          type: string
          description: "Optional description of the index and its purpose"
        type:
          $ref: "#/components/schemas/IndexType"
          x-go-name: "type"
        version:
          x-go-type-skip-optional-pointer: true
          type: integer
          default: 0
          description: "Version of the index implementation. Defaults to 0."
        enrichments:
          type: array
          items:
            $ref: "#/components/schemas/EnrichmentConfig"
          x-go-type-skip-optional-pointer: true
          description: "Inline managed enrichment definitions required by this index. Enrichments are table-level generated artifacts such as chunks, asset-derived document units, or embeddings over an artifact stream."
          example:
            - name: document_chunks_v1
              kind: chunk
              field: text
              source_artifact_name: document_units_v1
              chunk_size: 512
            - name: document_chunk_dense_v1
              kind: embedding
              field: text
              source_artifact_name: document_chunks_v1
              expected_dims: 768
    EnrichmentKind:
      type: string
      enum:
        - chunk
        - asset
        - embedding
      description: "Managed generated artifact kind."
    ExecutionPolicy:
      type: object
      additionalProperties: false
      description: "Non-semantic execution policy for one producer or index maintenance operation. These fields tune how work is batched and do not change generated artifact identity."
      properties:
        batch_items:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: "Maximum items to process in one batch for this operation."
        batch_bytes:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          format: uint64
          description: "Approximate maximum source bytes to process in one batch for this operation."
    IndexExecutionConfig:
      type: object
      additionalProperties: false
      description: "Namespaced execution policy for managed index shorthand. Only namespaces with runtime effects are accepted."
      properties:
        chunking:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Chunk producer batching for shorthand-created chunk enrichments."
        embedding:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Embedding producer batching for shorthand-created embedding enrichments."
    EnrichmentConfig:
      type: object
      description: "Inline managed enrichment definition. Enrichments materialize generated artifacts before indexing and may target source rows or previously generated artifact streams."
      required:
        - name
        - kind
      properties:
        name:
          type: string
          description: "Stable generated artifact name."
        kind:
          $ref: "#/components/schemas/EnrichmentKind"
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Source field to read from the source document or source artifact payload."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Optional template for generated text input."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Existing artifact stream this enrichment consumes. Chunk enrichments may consume asset artifacts; embedding enrichments may consume chunk artifacts."
        expected_dims:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Expected embedding dimension for embedding enrichments."
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk size for chunk enrichments."
        chunk_overlap:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk overlap for chunk enrichments."
        chunker_json:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Serialized chunker configuration for chunk enrichments."
        full_text_index:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true on a chunk or asset enrichment, route generated text into the table's default full-text index."
        content_type:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Produced asset content type for asset enrichments."
        producer_json:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Serialized asset producer configuration."
        execution:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Non-semantic execution policy for this enrichment producer. This does not participate in generated artifact identity."
    FullTextIndexConfig:
      type: object
      properties:
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use memory-only storage"
    AlgebraicIndexConfig:
      type: object
      description: "Schema-derived algebraic sidecar configuration. Public requests may opt into schema derivation, while materializations remain engine-owned."
      properties:
        derive_from_schema:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "When true, derive the algebraic capability sidecar from the table schema. Internal fields and materialization definitions are not public API."
    IndexRepairStatus:
      type: object
      description: Compact user-facing state for an automatic index repair. Detailed diagnostics are available from the admin API and metrics.
      required:
        - state
        - action_required
      properties:
        state:
          type: string
          enum:
            - rebuilding
            - waiting
            - paused
            - failed
          description: Stable repair state. Internal state-machine phases are intentionally not exposed here.
        action_required:
          type: boolean
          description: Whether an operator must resume, retry, reconfigure, or drop the affected index.
    FullTextIndexStats:
      type: object
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - full_text
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents in the index"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is currently rebuilding"
        repair:
          $ref: '#/components/schemas/IndexRepairStatus'
        backfill_active:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is actively rebuilding, replaying, or catching up."
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Progress of ongoing rebuild as fraction [0.0, 1.0]"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents indexed during current rebuild"
        backfill_state:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Operational readiness state such as ready, running, retrying, or failed."
        doc_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents visible to the index."
        term_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of indexed terms when available."
        replay_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Highest replay sequence applied to the index runtime."
        replay_target_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Replay sequence the index runtime must reach to be current."
        replay_catch_up_required:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether replay must catch up before the index is fully current."
        runtime_present:
          x-go-type-skip-optional-pointer: true
          type: boolean
        runtime_fresh:
          x-go-type-skip-optional-pointer: true
          type: boolean
        runtime_source:
          x-go-type-skip-optional-pointer: true
          type: string
        runtime_freshness:
          x-go-type-skip-optional-pointer: true
          type: string
        catch_up_active:
          x-go-type-skip-optional-pointer: true
          type: boolean
        catch_up_phase:
          x-go-type-skip-optional-pointer: true
          type: string
        catch_up_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        catch_up_target_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        text_merge:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Full-text merge runtime diagnostics."
        async_indexing:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Asynchronous indexer runtime diagnostics."
        projection_checkpoint_status:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Durable projection checkpoint status: clean, rebuilding, degraded, or repair_required."
        projection_checkpoint_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Highest derived-log sequence covered by the durable projection checkpoint."
        projection_checkpoint_generation:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Projection generation associated with the durable checkpoint."
        projection_checkpoint_config_fingerprint:
          x-go-type-skip-optional-pointer: true
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: "Projection configuration identity associated with the durable checkpoint."
        checkpoint_replay_tail_sequence_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of derived-log sequences after the durable checkpoint that still need replay."
        repair_scan_issue_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Repair issues found by explicit repair-scan accounting for this projection."
        edge_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        node_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        repair_degraded:
          x-go-type-skip-optional-pointer: true
          type: boolean
        repair_issue_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        repair_summary_ready:
          x-go-type-skip-optional-pointer: true
          type: boolean
        repair_issue_count_estimated:
          x-go-type-skip-optional-pointer: true
          type: boolean
        expected_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        reported_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        fresh_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        stale_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        missing_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        unknown_remote_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        resolution:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Artifact resolution replay diagnostics."
        promotion:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Artifact promotion replay diagnostics."
    EmbeddingsIndexConfig:
      type: object
      description: >-
        Unified configuration for embeddings indexes.
        When sparse is true, creates a sparse vector index (SPLADE inverted index).
        When sparse is false (default), creates a dense vector index (HNSW).
        For dense indexes, dimension can be omitted if an embedder is configured — it will be auto-detected.
      properties:
        coverage_policy:
          $ref: "#/components/schemas/DerivedCoveragePolicy"
          description: >-
            Source-unit completeness policy for managed embeddings. `strict`
            requires one produced outcome per source document; `partial` permits
            intentional skips; `best_effort` also treats terminal failures as
            complete while reporting the index unhealthy. External indexes use
            `external: true` and must not set this field.
        external:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, embeddings are supplied externally via _embeddings and the index does not derive prompts from a field or template."
        sparse:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, creates a sparse (SPLADE) inverted index. When false (default), creates a dense (HNSW) vector index."
        dimension:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: "Vector dimension for dense indexes. Required for external dense indexes. Can be omitted for managed dense indexes when an embedder is configured (auto-detected via probe). Ignored for sparse indexes."
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Field to extract embeddings from (managed indexes only; not allowed when external=true)"
        embedding_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Generated embedding artifact name consumed by this vector index. Use with a matching embedding enrichment for artifact-backed managed embeddings."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Artifact stream consumed by the embedding enrichment backing this vector index. This is descriptive public configuration; the matching enrichment defines the materialized source."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: >-
            Handlebars template for generating prompts (managed indexes only; not allowed when external=true).
            See https://handlebarsjs.com/guide/ for more information.
          example: 'Hello, {{#if (eq Name "John")}}Johnathan{{else}}{{Name}}{{/if}}! You are {{Age}} years old.'
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use in-memory only storage (dense only)"
        embedder:
          description: "Configuration for the embeddings plugin (managed indexes only; not allowed when external=true)"
          $ref: "embeddings.yaml#/components/schemas/EmbedderConfig"
        summarizer:
          description: "Configuration for the summarizer plugin (dense managed indexes only)"
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
        chunker:
          description: "Configuration for the chunking plugin. When specified, documents are automatically chunked at write time before indexing. (dense managed indexes only)"
          $ref: "chunking.yaml#/components/schemas/ChunkerConfig"
        top_k:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          default: 10
          description: "Default number of results to return from search (sparse only)"
        min_weight:
          x-go-type-skip-optional-pointer: true
          type: number
          format: float
          default: 0.0
          description: "Minimum weight threshold for sparse vector entries (sparse only)"
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 64
          default: 1024
          description: "Number of documents per posting list chunk (sparse only)"
        execution:
          $ref: "#/components/schemas/IndexExecutionConfig"
          description: "Non-semantic execution policy for shorthand-created chunking or embedding producers."
    DerivedCoveragePolicy:
      type: string
      enum:
        - strict
        - partial
        - best_effort
      default: strict
      description: "How generation-scoped source outcomes determine derived-index completeness."
    DerivedCoverageStatusPolicy:
      type: string
      enum:
        - strict
        - partial
        - best_effort
        - external
    DerivedCoverageObservationIncompleteReason:
      type: string
      enum:
        - runtime_unavailable
        - missing_group
        - unknown_group
        - remote_unknown_group
        - stale_group
        - summary_unavailable
        - config_mismatch
        - counter_mismatch
      description: "A structured reason why the coverage projection cannot be treated as globally complete."
    DerivedCoverageStatus:
      type: object
      additionalProperties: false
      required:
        - policy
        - observation_complete
        - observation_incomplete_reasons
        - config_fingerprint
        - summary_ready
        - config_mismatch_group_count
        - source_total
        - produced
        - skipped
        - terminal_failed
        - covered
        - pending
        - complete
        - healthy
        - degraded
      properties:
        policy:
          $ref: "#/components/schemas/DerivedCoverageStatusPolicy"
        observation_complete:
          type: boolean
          description: "Whether every expected shard contributed a fresh, configuration-compatible observation with valid outcome cardinality."
        observation_incomplete_reasons:
          type: array
          items:
            $ref: "#/components/schemas/DerivedCoverageObservationIncompleteReason"
          description: "Empty when observation_complete is true; otherwise identifies every known reason the projection is incomplete."
        config_fingerprint:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: "Versioned semantic configuration fingerprint encoded as fixed-width hexadecimal. Non-semantic execution tuning does not affect it."
        summary_ready:
          type: boolean
          description: "Whether all observed shard-local coverage summaries were read atomically and completely."
        config_mismatch_group_count:
          type: integer
          format: uint64
          description: "Freshly observed shard groups reporting a different semantic configuration fingerprint."
        source_total:
          type: integer
          format: uint64
          description: >-
            Source documents observed across fresh shard reports. This is the
            exact table total only when observation_complete is true; otherwise
            it is a lower bound and all outcome counts are partial observations.
        produced:
          type: integer
          format: uint64
          description: "Source documents with a durable produced outcome for this index generation."
        skipped:
          type: integer
          format: uint64
          description: "Source documents intentionally producing no indexable output."
        terminal_failed:
          type: integer
          format: uint64
          description: "Source documents whose generation failed non-retryably."
        covered:
          type: integer
          format: uint64
          description: "Raw terminal source outcomes counted by the configured policy. This may exceed source_total only while observation_complete is false with counter_mismatch."
        pending:
          x-go-type-skip-optional-pointer: false
          type: integer
          format: uint64
          nullable: true
          description: "Source documents without a policy-accepted terminal outcome. Null when observations are incomplete and the global value is unknown."
        complete:
          type: boolean
          description: "Whether observations are complete, replay has reached its target, and every observed source has an outcome accepted by the policy."
        healthy:
          type: boolean
          description: "Whether coverage is complete without terminal failures."
        degraded:
          type: boolean
          description: "Whether coverage is complete under best_effort but includes terminal failures."
    EnrichmentRuntimeStatus:
      type: object
      additionalProperties: false
      description: "Runtime state for the durable embeddings enrichment worker."
      required:
        - enabled
        - target_sequence
        - applied_sequence
        - pending_sequence_count
        - projection_checkpoint_status
        - projection_checkpoint_applied_sequence
        - projection_checkpoint_generation
        - projection_checkpoint_config_fingerprint
        - projection_checkpoint_identity_consistent
        - checkpoint_replay_tail_sequence_count
        - processed_requests
        - error_count
        - retryable_error_count
        - fatal_error_count
        - retrying
        - worker_failed
        - worker_started
        - stalled
        - skip_by_hash_count
        - skipped_source_count
        - codec_decode_failures
        - embed_batches_started
        - embed_batches_completed
        - embed_items_started
        - embed_items_completed
        - active_embed_batch_items
        - active_embed_batch_bytes
        - active_embed_batch_max_bytes
        - active_embed_batch_started_ms
        - last_embed_batch_items
        - last_embed_batch_bytes
        - last_embed_batch_max_bytes
        - last_embed_batch_completed_ms
        - last_embed_batch_ns
        - total_embed_ns
      properties:
        enabled:
          type: boolean
        target_sequence:
          type: integer
          format: uint64
        applied_sequence:
          type: integer
          format: uint64
        pending_sequence_count:
          type: integer
          format: uint64
        projection_checkpoint_status:
          type: string
        projection_checkpoint_applied_sequence:
          type: integer
          format: uint64
        projection_checkpoint_generation:
          type: integer
          format: uint64
        projection_checkpoint_config_fingerprint:
          type: string
          pattern: "^[0-9a-f]{16}$"
        projection_checkpoint_identity_consistent:
          type: boolean
          description: "Whether every shard contributing to this status reports the same checkpoint generation and configuration identity."
        checkpoint_replay_tail_sequence_count:
          type: integer
          format: uint64
        processed_requests:
          type: integer
          format: uint64
        error_count:
          type: integer
          format: uint64
        retryable_error_count:
          type: integer
          format: uint64
        fatal_error_count:
          type: integer
          format: uint64
        retrying:
          type: boolean
        worker_failed:
          type: boolean
        worker_started:
          type: boolean
          description: "Whether the background enrichment worker is currently running."
        stalled:
          type: boolean
          description: "Whether work is pending with no running worker, retry, or terminal failure explaining the backlog."
        skip_by_hash_count:
          type: integer
          format: uint64
        skipped_source_count:
          type: integer
          format: uint64
        codec_decode_failures:
          type: integer
          format: uint64
        embed_batches_started:
          type: integer
          format: uint64
        embed_batches_completed:
          type: integer
          format: uint64
        embed_items_started:
          type: integer
          format: uint64
        embed_items_completed:
          type: integer
          format: uint64
        active_embed_batch_items:
          type: integer
          format: uint64
        active_embed_batch_bytes:
          type: integer
          format: uint64
        active_embed_batch_max_bytes:
          type: integer
          format: uint64
        active_embed_batch_started_ms:
          type: integer
          format: uint64
        last_embed_batch_items:
          type: integer
          format: uint64
        last_embed_batch_bytes:
          type: integer
          format: uint64
        last_embed_batch_max_bytes:
          type: integer
          format: uint64
        last_embed_batch_completed_ms:
          type: integer
          format: uint64
          description: "Wall-clock completion time in Unix milliseconds for the most recently completed embedding batch."
        last_embed_batch_ns:
          type: integer
          format: uint64
          description: "Elapsed duration in nanoseconds for the most recently completed embedding batch."
        total_embed_ns:
          type: integer
          format: uint64
    EmbeddingsIndexStats:
      type: object
      description: "Statistics for an embeddings index (dense or sparse)"
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - embeddings
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of vectors/documents in the index"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        total_nodes:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Total number of nodes in the index (dense only)"
        total_terms:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of unique terms in the inverted index (sparse only)"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether enrichment, publication, or replay work is still pending. Documents that do not contain the indexed field are terminal skipped outcomes and do not keep this true."
        repair:
          $ref: '#/components/schemas/IndexRepairStatus'
        wal_backlog:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents pending enrichment in the WAL"
        backfill_active:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is actively rebuilding, replaying, enriching, or catching up."
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Fraction of source documents with a terminal materialization outcome, including produced embeddings and intentionally skipped documents. Reaches 1.0 when no source work is pending and replay is current."
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Total items processed during backfill"
        backfill_state:
