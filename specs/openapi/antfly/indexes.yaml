        at_ms:
          type: integer
          format: int64
        target_edge_generation:
          type: integer
          format: int64
        published_generation:
          type: integer
          format: int64
        score_count:
          type: integer
          format: int64
    GraphMetricEdgeFilterStatus:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - all
            - types
        types:
          type: array
          items:
            type: string
    GraphMetricScore:
      type: object
      required:
        - node
        - score
      properties:
        node:
          type: string
        score:
          type: number
          format: double
    GraphMetricRerank:
      type: object
      required:
        - index
        - metric
      properties:
        index:
          type: string
          description: Graph index that owns the published metric.
        metric:
          type: string
          description: Graph metric name to blend into the search hit score.
        base_weight:
          type: number
          format: double
          default: 1.0
          description: Multiplier applied to the existing hit score before adding the graph metric feature.
        weight:
          type: number
          format: double
          default: 1.0
          description: Multiplier applied to the graph metric score before it is added to the existing hit score.
        missing_score:
          type: number
          format: double
          default: 0.0
          description: Metric feature value to use for hits that do not have a score in the published metric generation.
        metric_freshness:
          type: string
          enum:
            - published
            - fresh
          default: published
          description: Whether stale published generations are acceptable or the metric must be fresh.
    GraphMetricResult:
      type: object
      required:
        - index_name
        - metric
        - scores
        - status
      properties:
        index_name:
          type: string
        metric:
          type: string
        scores:
          type: array
          items:
            $ref: '#/components/schemas/GraphMetricScore'
        status:
          $ref: '#/components/schemas/GraphMetricStatus'
    GraphMetricOrder:
      type: object
      required:
        - metric
      properties:
        metric:
          type: string
        direction:
          type: string
          enum:
            - asc
            - desc
        nulls:
          type: string
          enum:
            - first
            - last
            - nulls_first
            - nulls_last
    GraphMetricFilter:
      type: object
      required:
        - metric
        - op
        - value
      properties:
        metric:
          type: string
        op:
          type: string
          enum:
            - ">"
            - ">="
            - "<"
            - "<="
            - "="
            - "=="
            - "!="
        value:
          type: number
          format: double
