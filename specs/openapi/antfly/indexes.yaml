openapi: 3.0.3
info:
  title: Index Configuration
  description: "An OpenAPI specification for configuring different indexes in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    SortDirection:
      $ref: "sort.yaml#/components/schemas/SortDirection"
    SortField:
      $ref: "sort.yaml#/components/schemas/SortField"
    IndexType:
      # FIXME (ajr) Looks like a bug in oapi-codegen where it doesn't respect
      # the x-go-type-skip-optional-pointer when the schema is referenced from
      # another schema in the MarshalJSON.
      #
      # x-go-type-skip-optional-pointer: true
      type: string
      enum:
        - full_text
        - embeddings
        - graph
        - algebraic
      description: "The type of the index."
    IndexConfig:
      type: object
      description: "Configuration for an index"
      oneOf:
        - $ref: "#/components/schemas/FullTextIndexConfig"
        - $ref: "#/components/schemas/EmbeddingsIndexConfig"
        - $ref: "#/components/schemas/GraphIndexConfig"
        - $ref: "#/components/schemas/AlgebraicIndexConfig"
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: "Name of the index"
        description:
          type: string
          description: "Optional description of the index and its purpose"
        type:
          $ref: "#/components/schemas/IndexType"
        version:
          x-go-type-skip-optional-pointer: true
          type: integer
          default: 0
          description: "Version of the index implementation. Defaults to 0."
        enrichments:
          type: array
          items:
            $ref: "#/components/schemas/EnrichmentConfig"
          x-go-type-skip-optional-pointer: true
          description: "Inline managed enrichment definitions required by this index. Enrichments are table-level generated artifacts such as chunks, asset-derived document units, or embeddings over an artifact stream."
          example:
            - name: document_chunks_v1
              kind: chunk
              field: text
              source_artifact_name: document_units_v1
              chunk_size: 512
            - name: document_chunk_dense_v1
              kind: embedding
              field: text
              source_artifact_name: document_chunks_v1
              expected_dims: 768
    CreateIndexCommon:
      type: object
      description: "Fields shared by every create-index variant. The index name is owned by the request path."
      properties:
        description:
          type: string
          description: "Optional description of the index and its purpose"
        version:
          x-go-type-skip-optional-pointer: true
          type: integer
          default: 0
          description: "Version of the index implementation. Defaults to 0."
        enrichments:
          type: array
          items:
            $ref: "#/components/schemas/EnrichmentConfig"
          x-go-type-skip-optional-pointer: true
          description: "Inline managed enrichment definitions required by this index."
    CreateFullTextIndexRequest:
      description: "Create a full-text index."
      allOf:
        - $ref: "#/components/schemas/CreateIndexCommon"
        - $ref: "#/components/schemas/FullTextIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [full_text]
    CreateEmbeddingsIndexRequest:
      description: "Create a dense or sparse embeddings index."
      allOf:
        - $ref: "#/components/schemas/CreateIndexCommon"
        - $ref: "#/components/schemas/EmbeddingsIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [embeddings]
    CreateGraphIndexRequest:
      description: "Create a graph index."
      allOf:
        - $ref: "#/components/schemas/CreateIndexCommon"
        - $ref: "#/components/schemas/GraphIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [graph]
    CreateAlgebraicIndexRequest:
      description: "Create a schema-derived algebraic index."
      allOf:
        - $ref: "#/components/schemas/CreateIndexCommon"
        - $ref: "#/components/schemas/AlgebraicIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [algebraic]
    CreateIndexRequest:
      description: "Type-safe configuration for a new index. The index name is owned by the request path."
      oneOf:
        - $ref: "#/components/schemas/CreateFullTextIndexRequest"
        - $ref: "#/components/schemas/CreateEmbeddingsIndexRequest"
        - $ref: "#/components/schemas/CreateGraphIndexRequest"
        - $ref: "#/components/schemas/CreateAlgebraicIndexRequest"
      discriminator:
        propertyName: type
        mapping:
          full_text: "#/components/schemas/CreateFullTextIndexRequest"
          embeddings: "#/components/schemas/CreateEmbeddingsIndexRequest"
          graph: "#/components/schemas/CreateGraphIndexRequest"
          algebraic: "#/components/schemas/CreateAlgebraicIndexRequest"
    CreatedIndexCommon:
      type: object
      description: "Fields returned for every newly created index. Provider credentials are write-only and are never returned."
      required:
        - name
      properties:
        name:
          type: string
          description: "Name of the created index"
        description:
          type: string
          description: "Optional description of the index and its purpose"
        version:
          x-go-type-skip-optional-pointer: true
          type: integer
          default: 0
          description: "Version of the index implementation. Defaults to 0."
        enrichments:
          type: array
          items:
            $ref: "#/components/schemas/CreatedEnrichmentConfig"
          x-go-type-skip-optional-pointer: true
          description: "Normalized inline managed enrichment definitions required by this index."
    CreatedProviderConfig:
      type: object
      additionalProperties: false
      required: [provider]
      description: "Credential-free provider configuration returned after index creation. Only non-secret provider settings are represented."
      properties:
        provider:
          type: string
          description: "Configured provider discriminator."
        model:
          type: string
          description: "Configured provider model when applicable."
        models:
          type: array
          items: { type: string }
        project_id: { type: string }
        location: { type: string }
        region: { type: string }
        url: { type: string, format: uri }
        api_url: { type: string, format: uri }
        dimension: { type: integer, minimum: 1 }
        dimensions: { type: integer, minimum: 1 }
        input_type: { type: string }
        truncate: { type: string }
        strip_new_lines: { type: boolean }
        batch_size: { type: integer, minimum: 1 }
        temperature: { type: number, format: float }
        max_tokens: { type: integer, minimum: 1 }
        top_p: { type: number, format: float }
        top_k: { type: integer }
        frequency_penalty: { type: number, format: float }
        presence_penalty: { type: number, format: float }
        timeout: { type: integer, minimum: 1 }
    CreatedEnrichmentConfig:
      type: object
      additionalProperties: false
      required: [name, kind]
      description: "Credential-free normalized enrichment configuration returned after index creation."
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/EnrichmentKind" }
        field: { type: string }
        template: { type: string }
        source_artifact_name: { type: string }
        expected_dims: { type: integer, minimum: 0 }
        chunk_size: { type: integer, minimum: 0 }
        chunk_overlap: { type: integer, minimum: 0 }
        chunker_json: { type: string }
        full_text_index: { type: boolean, default: false }
        content_type: { type: string }
        execution: { $ref: "#/components/schemas/ExecutionPolicy" }
    CreatedEmbeddingsIndexConfig:
      type: object
      description: "Credential-free normalized embeddings configuration returned after creation."
      properties:
        coverage_policy: { $ref: "#/components/schemas/DerivedCoveragePolicy" }
        external: { type: boolean, default: false }
        sparse: { type: boolean, default: false }
        dimension: { type: integer, minimum: 1 }
        field: { type: string }
        embedding_name: { type: string }
        source_artifact_name: { type: string }
        template: { type: string }
        distance_metric: { $ref: "#/components/schemas/DistanceMetric" }
        mem_only: { type: boolean }
        embedder: { $ref: "#/components/schemas/CreatedProviderConfig" }
        summarizer: { $ref: "#/components/schemas/CreatedProviderConfig" }
        chunker: { $ref: "chunking.yaml#/components/schemas/ChunkerConfig" }
        top_k: { type: integer, minimum: 1, default: 10 }
        min_weight: { type: number, format: float, default: 0.0 }
        chunk_size: { type: integer, minimum: 64, default: 1024 }
        execution: { $ref: "#/components/schemas/IndexExecutionConfig" }
    CreatedGraphIndexConfig:
      type: object
      description: "Credential-free normalized graph configuration returned after creation."
      properties:
        summarizer: { $ref: "#/components/schemas/CreatedProviderConfig" }
        template: { type: string }
        edge_types:
          type: array
          items: { $ref: "#/components/schemas/EdgeTypeConfig" }
        max_edges_per_document: { type: integer }
    CreatedFullTextIndex:
      description: "Normalized effective full-text index configuration returned after creation."
      allOf:
        - $ref: "#/components/schemas/CreatedIndexCommon"
        - $ref: "#/components/schemas/FullTextIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [full_text]
    CreatedEmbeddingsIndex:
      description: "Normalized effective dense or sparse embeddings index configuration returned after creation."
      allOf:
        - $ref: "#/components/schemas/CreatedIndexCommon"
        - $ref: "#/components/schemas/CreatedEmbeddingsIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [embeddings]
    CreatedGraphIndex:
      description: "Normalized effective graph index configuration returned after creation."
      allOf:
        - $ref: "#/components/schemas/CreatedIndexCommon"
        - $ref: "#/components/schemas/CreatedGraphIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [graph]
    CreatedAlgebraicIndex:
      description: "Normalized effective schema-derived algebraic index configuration returned after creation."
      allOf:
        - $ref: "#/components/schemas/CreatedIndexCommon"
        - $ref: "#/components/schemas/AlgebraicIndexConfig"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [algebraic]
    CreatedIndex:
      description: "Discriminated normalized configuration returned after an index is created."
      oneOf:
        - $ref: "#/components/schemas/CreatedFullTextIndex"
        - $ref: "#/components/schemas/CreatedEmbeddingsIndex"
        - $ref: "#/components/schemas/CreatedGraphIndex"
        - $ref: "#/components/schemas/CreatedAlgebraicIndex"
      discriminator:
        propertyName: type
        mapping:
          full_text: "#/components/schemas/CreatedFullTextIndex"
          embeddings: "#/components/schemas/CreatedEmbeddingsIndex"
          graph: "#/components/schemas/CreatedGraphIndex"
          algebraic: "#/components/schemas/CreatedAlgebraicIndex"
    EnrichmentKind:
      type: string
      enum:
        - chunk
        - asset
        - embedding
      description: "Managed generated artifact kind."
    ExecutionPolicy:
      type: object
      additionalProperties: false
      description: "Non-semantic execution policy for one producer or index maintenance operation. These fields tune how work is batched and do not change generated artifact identity."
      properties:
        batch_items:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: "Maximum items to process in one batch for this operation."
        batch_bytes:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          format: uint64
          description: "Approximate maximum source bytes to process in one batch for this operation."
    IndexExecutionConfig:
      type: object
      additionalProperties: false
      description: "Namespaced execution policy for managed index shorthand. Only namespaces with runtime effects are accepted."
      properties:
        chunking:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Chunk producer batching for shorthand-created chunk enrichments."
        embedding:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Embedding producer batching for shorthand-created embedding enrichments."
    EnrichmentConfig:
      type: object
      description: "Inline managed enrichment definition. Enrichments materialize generated artifacts before indexing and may target source rows or previously generated artifact streams."
      required:
        - name
        - kind
      properties:
        name:
          type: string
          description: "Stable generated artifact name."
        kind:
          $ref: "#/components/schemas/EnrichmentKind"
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Source field to read from the source document or source artifact payload."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Optional template for generated text input."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Existing artifact stream this enrichment consumes. Chunk enrichments may consume asset artifacts; embedding enrichments may consume chunk artifacts."
        expected_dims:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Expected embedding dimension for embedding enrichments."
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk size for chunk enrichments."
        chunk_overlap:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk overlap for chunk enrichments."
        chunker_json:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Serialized chunker configuration for chunk enrichments."
        full_text_index:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true on a chunk or asset enrichment, route generated text into the table's default full-text index."
        content_type:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Produced asset content type for asset enrichments."
        producer_json:
          x-go-type-skip-optional-pointer: true
          type: string
          writeOnly: true
          description: "Write-only serialized asset producer configuration. It may contain provider credentials and is never returned."
        execution:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: "Non-semantic execution policy for this enrichment producer. This does not participate in generated artifact identity."
    FullTextIndexConfig:
      type: object
      properties:
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use memory-only storage"
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Document field indexed as text. Omit for the table's default full-document text index."
        artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Generated artifact stream indexed as text. Use with matching inline enrichments."
    AlgebraicIndexConfig:
      type: object
      description: "Schema-derived algebraic sidecar configuration. Public requests may opt into schema derivation, while materializations remain engine-owned."
      properties:
        derive_from_schema:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "When true, derive the algebraic capability sidecar from the table schema. Internal fields and materialization definitions are not public API."
    IndexRepairStatus:
      type: object
      description: Compact user-facing state for an automatic index repair. Detailed diagnostics are available from the admin API and metrics.
      required:
        - state
        - action_required
      properties:
        state:
          type: string
          enum:
            - rebuilding
            - waiting
            - paused
            - failed
          description: Stable repair state. Internal state-machine phases are intentionally not exposed here.
        action_required:
          type: boolean
          description: Whether an operator must resume, retry, reconfigure, or drop the affected index.
    FullTextIndexStats:
      type: object
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - full_text
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents in the index"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is currently rebuilding"
        repair:
          $ref: '#/components/schemas/IndexRepairStatus'
        backfill_active:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is actively rebuilding, replaying, or catching up."
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Progress of ongoing rebuild as fraction [0.0, 1.0]"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents indexed during current rebuild"
        backfill_state:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Operational readiness state such as ready, running, retrying, degraded, or failed."
        doc_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents visible to the index."
        term_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of indexed terms when available."
        replay_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Highest replay sequence applied to the index runtime."
        replay_target_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Replay sequence the index runtime must reach to be current."
        replay_catch_up_required:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether replay must catch up before the index is fully current."
        runtime_present:
          x-go-type-skip-optional-pointer: true
          type: boolean
        runtime_fresh:
          x-go-type-skip-optional-pointer: true
          type: boolean
        runtime_source:
          x-go-type-skip-optional-pointer: true
          type: string
        runtime_freshness:
          x-go-type-skip-optional-pointer: true
          type: string
        catch_up_active:
          x-go-type-skip-optional-pointer: true
          type: boolean
        catch_up_phase:
          x-go-type-skip-optional-pointer: true
          type: string
        catch_up_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        catch_up_target_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        text_merge:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Full-text merge runtime diagnostics."
        async_indexing:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Asynchronous indexer runtime diagnostics."
        projection_checkpoint_status:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Durable projection checkpoint status: clean, rebuilding, degraded, or repair_required."
        projection_checkpoint_applied_sequence:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Highest derived-log sequence covered by the durable projection checkpoint."
        projection_checkpoint_generation:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Projection generation associated with the durable checkpoint."
        projection_checkpoint_config_fingerprint:
          x-go-type-skip-optional-pointer: true
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: "Projection configuration identity associated with the durable checkpoint."
        checkpoint_replay_tail_sequence_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of derived-log sequences after the durable checkpoint that still need replay."
        repair_scan_issue_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Repair issues found by explicit repair-scan accounting for this projection."
        edge_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        node_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        repair_degraded:
          x-go-type-skip-optional-pointer: true
          type: boolean
        repair_issue_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        repair_summary_ready:
          x-go-type-skip-optional-pointer: true
          type: boolean
        repair_issue_count_estimated:
          x-go-type-skip-optional-pointer: true
          type: boolean
        expected_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        reported_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        fresh_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        stale_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        missing_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        unknown_remote_groups:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        resolution:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Artifact resolution replay diagnostics."
        promotion:
          x-go-type-skip-optional-pointer: true
          type: object
          additionalProperties: true
          description: "Artifact promotion replay diagnostics."
    EmbeddingsIndexConfig:
      type: object
      description: >-
        Unified configuration for embeddings indexes.
        When sparse is true, creates a sparse vector index (SPLADE inverted index).
        When sparse is false (default), creates a dense vector index (HNSW).
        For dense indexes, dimension can be omitted if an embedder is configured — it will be auto-detected.
      properties:
        coverage_policy:
          $ref: "#/components/schemas/DerivedCoveragePolicy"
          description: >-
            Source-unit completeness policy for managed embeddings. `strict`
            requires one produced outcome per source document; `partial` permits
            intentional skips; `best_effort` also treats terminal failures as
            complete while reporting the index unhealthy. External indexes use
            `external: true` and must not set this field.
        external:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, embeddings are supplied externally via _embeddings and the index does not derive prompts from a field or template."
        sparse:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, creates a sparse (SPLADE) inverted index. When false (default), creates a dense (HNSW) vector index."
        dimension:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: "Vector dimension for dense indexes. Required for external dense indexes. Can be omitted for managed dense indexes when an embedder is configured (auto-detected via probe). Ignored for sparse indexes."
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Field to extract embeddings from (managed indexes only; not allowed when external=true)"
        embedding_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Generated embedding artifact name consumed by this vector index. Use with a matching embedding enrichment for artifact-backed managed embeddings."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Artifact stream consumed by the embedding enrichment backing this vector index. This is descriptive public configuration; the matching enrichment defines the materialized source."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: >-
            Handlebars template for generating prompts (managed indexes only; not allowed when external=true).
            See https://handlebarsjs.com/guide/ for more information.
          example: 'Hello, {{#if (eq Name "John")}}Johnathan{{else}}{{Name}}{{/if}}! You are {{Age}} years old.'
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use in-memory only storage (dense only)"
        embedder:
          description: "Configuration for the embeddings plugin (managed indexes only; not allowed when external=true)"
          $ref: "embeddings.yaml#/components/schemas/EmbedderConfig"
        summarizer:
          description: "Configuration for the summarizer plugin (dense managed indexes only)"
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
        chunker:
          description: "Configuration for the chunking plugin. When specified, documents are automatically chunked at write time before indexing. (dense managed indexes only)"
          $ref: "chunking.yaml#/components/schemas/ChunkerConfig"
        top_k:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          default: 10
          description: "Default number of results to return from search (sparse only)"
        min_weight:
          x-go-type-skip-optional-pointer: true
          type: number
          format: float
          default: 0.0
          description: "Minimum weight threshold for sparse vector entries (sparse only)"
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 64
          default: 1024
          description: "Number of documents per posting list chunk (sparse only)"
        execution:
          $ref: "#/components/schemas/IndexExecutionConfig"
          description: "Non-semantic execution policy for shorthand-created chunking or embedding producers."
    DerivedCoveragePolicy:
      type: string
      enum:
        - strict
        - partial
        - best_effort
      default: strict
      description: "How generation-scoped source outcomes determine derived-index completeness."
    DerivedCoverageStatusPolicy:
      type: string
      enum:
        - strict
        - partial
        - best_effort
        - external
    DerivedCoverageObservationIncompleteReason:
      type: string
      enum:
        - runtime_unavailable
        - missing_group
        - unknown_group
        - remote_unknown_group
        - stale_group
        - summary_unavailable
