openapi: 3.0.3
info:
  title: Index Configuration
  description: "An OpenAPI specification for configuring different indexes in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    SortDirection:
      type: boolean
      description: "Sort direction for a single field. true = descending, false = ascending."
    SortField:
      type: object
      description: "A single sort field with direction."
      required:
        - field
      properties:
        field:
          type: string
          description: "The field name to sort by."
        desc:
          type: boolean
          default: false
          description: "Sort direction. true = descending, false = ascending."
    IndexType:
      # FIXME (ajr) Looks like a bug in oapi-codegen where it doesn't respect
      # the x-go-type-skip-optional-pointer when the schema is referenced from
      # another schema in the MarshalJSON.
      #
      # x-go-type-skip-optional-pointer: true
      type: string
      enum:
        - full_text
        - embeddings
        - graph
        - algebraic
      description: "The type of the index."
    IndexConfig:
      type: object
      description: "Configuration for an index"
      oneOf:
        - $ref: "#/components/schemas/FullTextIndexConfig"
        - $ref: "#/components/schemas/EmbeddingsIndexConfig"
        - $ref: "#/components/schemas/GraphIndexConfig"
        - $ref: "#/components/schemas/AlgebraicIndexConfig"
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: "Name of the index"
        description:
          type: string
          description: "Optional description of the index and its purpose"
        type:
          $ref: "#/components/schemas/IndexType"
          x-go-name: "type"
        version:
          x-go-type-skip-optional-pointer: true
          type: integer
          default: 0
          description: "Version of the index implementation. Defaults to 0."
        enrichments:
          type: array
          items:
            $ref: "#/components/schemas/EnrichmentConfig"
          x-go-type-skip-optional-pointer: true
          description: "Inline managed enrichment definitions required by this index. Enrichments are table-level generated artifacts such as chunks, asset-derived document units, or embeddings over an artifact stream."
          example:
            - name: document_chunks_v1
              kind: chunk
              field: text
              source_artifact_name: document_units_v1
              chunk_size: 512
            - name: document_chunk_dense_v1
              kind: embedding
              field: text
              source_artifact_name: document_chunks_v1
              expected_dims: 768
    EnrichmentKind:
      type: string
      enum:
        - chunk
        - asset
        - embedding
      description: "Managed generated artifact kind."
    EnrichmentConfig:
      type: object
      description: "Inline managed enrichment definition. Enrichments materialize generated artifacts before indexing and may target source rows or previously generated artifact streams."
      required:
        - name
        - kind
      properties:
        name:
          type: string
          description: "Stable generated artifact name."
        kind:
          $ref: "#/components/schemas/EnrichmentKind"
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Source field to read from the source document or source artifact payload."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Optional template for generated text input."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Existing artifact stream this enrichment consumes. Chunk enrichments may consume asset artifacts; embedding enrichments may consume chunk artifacts."
        expected_dims:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Expected embedding dimension for embedding enrichments."
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk size for chunk enrichments."
        chunk_overlap:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 0
          description: "Chunk overlap for chunk enrichments."
        chunker_json:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Serialized chunker configuration for chunk enrichments."
        full_text_index:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true on a chunk enrichment, route generated chunk text into the table's default full-text index."
        content_type:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Produced asset content type for asset enrichments."
        producer_json:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Serialized asset producer configuration."
    FullTextIndexConfig:
      type: object
      properties:
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use memory-only storage"
    AlgebraicIndexConfig:
      type: object
      description: "Schema-derived algebraic sidecar configuration. Public requests may opt into schema derivation, while materializations remain engine-owned."
      properties:
        derive_from_schema:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "When true, derive the algebraic capability sidecar from the table schema. Internal fields and materialization definitions are not public API."
    FullTextIndexStats:
      type: object
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - full_text
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents in the index"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is currently rebuilding"
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Progress of ongoing rebuild as fraction [0.0, 1.0]"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents indexed during current rebuild"
    EmbeddingsIndexConfig:
      type: object
      description: >-
        Unified configuration for embeddings indexes.
        When sparse is true, creates a sparse vector index (SPLADE inverted index).
        When sparse is false (default), creates a dense vector index (HNSW).
        For dense indexes, dimension can be omitted if an embedder is configured — it will be auto-detected.
      properties:
        external:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, embeddings are supplied externally via _embeddings and the index does not derive prompts from a field or template."
        sparse:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: false
          description: "When true, creates a sparse (SPLADE) inverted index. When false (default), creates a dense (HNSW) vector index."
        dimension:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: "Vector dimension for dense indexes. Required for external dense indexes. Can be omitted for managed dense indexes when an embedder is configured (auto-detected via probe). Ignored for sparse indexes."
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Field to extract embeddings from (managed indexes only; not allowed when external=true)"
        embedding_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Generated embedding artifact name consumed by this vector index. Use with a matching embedding enrichment for artifact-backed managed embeddings."
        source_artifact_name:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Artifact stream consumed by the embedding enrichment backing this vector index. This is descriptive public configuration; the matching enrichment defines the materialized source."
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: >-
            Handlebars template for generating prompts (managed indexes only; not allowed when external=true).
            See https://handlebarsjs.com/guide/ for more information.
          example: 'Hello, {{#if (eq Name "John")}}Johnathan{{else}}{{Name}}{{/if}}! You are {{Age}} years old.'
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        mem_only:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether to use in-memory only storage (dense only)"
        embedder:
          description: "Configuration for the embeddings plugin (managed indexes only; not allowed when external=true)"
          $ref: "embeddings.yaml#/components/schemas/EmbedderConfig"
        summarizer:
          description: "Configuration for the summarizer plugin (dense managed indexes only)"
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
        chunker:
          description: "Configuration for the chunking plugin. When specified, documents are automatically chunked at write time before indexing. (dense managed indexes only)"
          $ref: "chunking.yaml#/components/schemas/ChunkerConfig"
        top_k:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          default: 10
          description: "Default number of results to return from search (sparse only)"
        min_weight:
          x-go-type-skip-optional-pointer: true
          type: number
          format: float
          default: 0.0
          description: "Minimum weight threshold for sparse vector entries (sparse only)"
        chunk_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 64
          default: 1024
          description: "Number of documents per posting list chunk (sparse only)"
    EmbeddingsIndexStats:
      type: object
      description: "Statistics for an embeddings index (dense or sparse)"
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - embeddings
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of vectors/documents in the index"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        total_nodes:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Total number of nodes in the index (dense only)"
        total_terms:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of unique terms in the inverted index (sparse only)"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index enricher is currently backfilling"
        wal_backlog:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents pending enrichment in the WAL"
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Backfill progress as a ratio from 0.0 to 1.0"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Total items processed during backfill"
    IndexStats:
      type: object
      description: "Statistics for an index"
      discriminator:
        propertyName: index_type
        mapping:
          full_text: "#/components/schemas/FullTextIndexStats"
          embeddings: "#/components/schemas/EmbeddingsIndexStats"
          graph: "#/components/schemas/GraphIndexStats"
          algebraic: "#/components/schemas/AlgebraicIndexStats"
      oneOf:
        - $ref: "#/components/schemas/FullTextIndexStats"
        - $ref: "#/components/schemas/EmbeddingsIndexStats"
        - $ref: "#/components/schemas/GraphIndexStats"
        - $ref: "#/components/schemas/AlgebraicIndexStats"
    AlgebraicIndexStats:
      type: object
      description: "Compact public statistics for an algebraic sidecar index. Detailed runtime, adaptive, and materialization records remain internal diagnostics."
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - algebraic
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_indexed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents reflected in the algebraic sidecar"
        disk_usage:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Size of the index in bytes"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the sidecar is currently rebuilding"
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Backfill progress as a ratio from 0.0 to 1.0"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of documents processed during current backfill"
        healthy:
          x-go-type-skip-optional-pointer: true
          type: boolean
        parse_error_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        schema_version:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        capability_lifecycle_status:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Schema-derived algebraic capability lifecycle, for example current, stale, or rebuild_required."
        planner_selected:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        planner_fallback_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        planner_last_decision:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - selected
            - fallback
        planner_last_fallback_reason:
          x-go-type-skip-optional-pointer: true
          type: string
        planner_last_estimated_scan_rows:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Latest algebraic planner scan-row estimate for the last selected or fallback decision."
        planner_last_estimated_result_buckets:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Latest algebraic planner result-bucket estimate for the last selected or fallback decision."
        planner_lifecycle_ready:
          x-go-type-skip-optional-pointer: true
          type: boolean
        planner_lifecycle_blocking_reason:
          x-go-type-skip-optional-pointer: true
          type: string
        adaptive_progress_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        recommendation_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of currently recommended algebraic shapes."
        adaptive_backfilling_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        adaptive_ready_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        adaptive_stale_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        adaptive_cleanup_recommended_count:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        last_error_reason:
          x-go-type-skip-optional-pointer: true
          type: string
        active_progress_lifecycle:
          x-go-type-skip-optional-pointer: true
          type: string
        active_progress_rows_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
        active_progress_target_rows:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
    MergeStrategy:
      type: string
      enum:
        - rrf
        - rsf
        - failover
      default: rrf
      description: |
        Merge strategy for combining results from the semantic_search and full_text_search.
        rrf: Reciprocal Rank Fusion - combines scores using reciprocal rank formula
        rsf: Relative Score Fusion - normalizes scores by min/max within a window and combines weighted scores
        failover: Use full_text_search if embedding generation fails
    MergeConfig:
      type: object
      description: Configuration for result fusion when combining multiple search indexes.
      properties:
        strategy:
          $ref: "#/components/schemas/MergeStrategy"
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
          description: |
            Named weights keyed by index name. `full_text` for the full-text search index;
            embedding index names for vector indexes.
            Unspecified indexes default to 1.0. Applied in both RRF and RSF.
          example:
            full_text: 0.3
            title_embedding: 1.0
        window_size:
          x-go-type-skip-optional-pointer: true
          type: integer
          minimum: 1
          description: RSF normalization window size. Defaults to `limit`.
        rank_constant:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: RRF k constant (1/(k+rank)). Defaults to 60.0.
    Pruner:
      type: object
      description: |
        Configuration for pruning search results based on score quality.
        Helps filter out low-relevance results in RAG pipelines by detecting
        score gaps or deviations from top results.
      properties:
        min_score_ratio:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: |
            Keep only results with score >= max_score * min_score_ratio.
            For example, 0.5 keeps results scoring at least half of the top result.
            Applied after fusion scoring.
          example: 0.5
        max_score_gap_percent:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: |
            Stop returning results when the gap between consecutive scores
            exceeds this percentage of the total score range (max - min).
            Detects "elbows" in score distributions regardless of score scale.
            For example, 30.0 stops when a gap spans 30% of the score range.
          example: 30.0
        min_absolute_score:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: |
            Hard minimum score threshold. Results with scores below this value
            are excluded regardless of other pruning settings.
          example: 0.01
        require_multi_index:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: |
            Only keep results that appear in multiple indexes (both full-text
            and vector search). Useful for increasing precision by requiring
            agreement between different retrieval methods.
          default: false
        std_dev_threshold:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: |
            Keep results within N standard deviations below the mean score.
            For example, 1.0 keeps results with score >= mean - 1*stddev.
            Useful for statistical outlier detection in result sets.
          example: 1.5
    DistanceMetric:
      x-go-type-skip-optional-pointer: true
      type: string
      enum: [l2_squared, inner_product, cosine]
      default: l2_squared
      description: >-
        Distance metric for the vector index (dense only).
        Use "cosine" for models trained with cosine similarity (e.g. CLIP, OpenAI).
        Use "inner_product" for models trained with dot product similarity.
        Use "l2_squared" (default) for models trained with Euclidean distance.
    AntflyType:
      type: string
      enum:
        - search_as_you_type
        - keyword
        - text
        - html
        - numeric
        - datetime
        - boolean
        - link
        - geopoint
        - geoshape
        - embedding
        - blob
    GraphIndexConfig:
      type: object
      description: "Configuration for graph index type"
      properties:
        summarizer:
          description: "Configuration for generating node summaries (enables tree navigation in Retrieval Agent)"
          $ref: "../shared/generating.yaml#/components/schemas/GeneratorConfig"
        template:
          x-go-type-skip-optional-pointer: true
          type: string
          description: |
            Handlebars template for generating summarizer input text.
            Uses document fields as template variables.
            Same pattern as EmbeddingsConfig template.
          example: "{{title}}\n{{content}}"
        edge_types:
          type: array
          description: "List of edge types with their configurations"
          items:
            $ref: "#/components/schemas/EdgeTypeConfig"
        max_edges_per_document:
          x-go-type-skip-optional-pointer: true
          type: integer
          description: "Maximum number of edges per document (0 = unlimited)"
    EdgeTypeConfig:
      type: object
      description: "Configuration for a specific edge type"
      properties:
        name:
          type: string
          description: "Edge type name (e.g., 'cites', 'similar_to')"
        field:
          x-go-type-skip-optional-pointer: true
          type: string
          description: |
            Document field containing target node key(s) for automatic edge creation.
            Supports string (single target) or array of strings (multiple targets).
            When omitted, edges must be provided explicitly via _edges.
        topology:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - tree
            - graph
          default: graph
          description: |
            Topology constraint for this edge type:
            - tree: Single parent per node, no cycles
            - graph: No constraints (default)
        max_weight:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          default: 1.0
          description: "Maximum allowed edge weight"
        min_weight:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          default: 0.0
          description: "Minimum allowed edge weight"
        allow_self_loops:
          x-go-type-skip-optional-pointer: true
          type: boolean
          default: true
          description: "Whether to allow edges from a node to itself"
        required_metadata:
          type: array
          description: "Required metadata fields for this edge type"
          items:
            type: string
      required:
        - name
    GraphIndexStats:
      type: object
      description: "Statistics for graph index"
      required:
        - index_type
      properties:
        index_type:
          x-go-type-skip-optional-pointer: true
          type: string
          enum:
            - graph
          description: "Discriminator for the index stats variant."
        error:
          x-go-type-skip-optional-pointer: true
          type: string
          description: "Error message if stats could not be retrieved"
        total_edges:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Total number of edges in the graph"
        edge_types:
          type: object
          additionalProperties:
            type: integer
            format: uint64
          description: "Count of edges per edge type"
        rebuilding:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: "Whether the index is currently rebuilding"
        backfill_progress:
          x-go-type-skip-optional-pointer: true
          type: number
          format: double
          description: "Rebuild progress as a ratio from 0.0 to 1.0"
        backfill_items_processed:
          x-go-type-skip-optional-pointer: true
          type: integer
          format: uint64
          description: "Number of edges indexed during current rebuild"
        algebraic_graph:
          x-go-type-skip-optional-pointer: true
          type: object
          description: "Algebraic graph execution health for bounded semiring traversal."
          properties:
            traversal:
              type: object
              properties:
                attempted:
                  type: integer
                  format: uint64
                proven:
                  type: integer
                  format: uint64
                rejected:
                  type: integer
                  format: uint64
                fallback:
                  type: integer
                  format: uint64
                result_nodes:
                  type: integer
                  format: uint64
        graph_metric_runtime:
          x-go-type-skip-optional-pointer: true
          $ref: "#/components/schemas/GraphMetricRuntimeStats"
    GraphMetricRuntimeStats:
      type: object
      description: "Summarized graph metric maintenance runtime state. Identity fields are stable hashes, not raw process or owner identifiers."
      properties:
        enabled:
          type: boolean
        role:
          type: string
          enum:
            - combined
            - coordinator
            - worker
            - worker_pool
        runtime_id_hash:
          type: integer
          format: uint64
        owner_id_hash:
          type: integer
          format: uint64
        lease_key_hash:
          type: integer
          format: uint64
        worker_id_hash:
          type: integer
          format: uint64
        worker_count:
          type: integer
          format: uint64
        lease_owned:
          type: boolean
        has_lease:
          type: boolean
        acquisition_count:
          type: integer
          format: uint64
        takeover_count:
          type: integer
          format: uint64
        lease_acquire_failures:
          type: integer
          format: uint64
        lost_leases:
          type: integer
          format: uint64
        last_acquired_ms:
          type: integer
          format: uint64
        started:
          type: boolean
        shutdown:
          type: boolean
        notified:
          type: boolean
        ticks_started:
          type: integer
          format: uint64
        ticks_completed:
          type: integer
          format: uint64
        durable_progress_ticks:
          type: integer
          format: uint64
        idle_ticks:
          type: integer
          format: uint64
        error_ticks:
          type: integer
          format: uint64
        last_error_name:
          type: string
        total_metrics_scanned:
          type: integer
          format: uint64
        total_active_builds:
          type: integer
          format: uint64
        total_builds_started:
          type: integer
          format: uint64
        total_worker_steps:
          type: integer
          format: uint64
        total_coordinator_steps:
          type: integer
          format: uint64
        total_pages_claimed:
          type: integer
