openapi: 3.0.3
info:
  title: Reranking Provider Configuration
  description: "An OpenAPI specification for configuring different reranking providers in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    RerankerProvider:
      type: string
      enum:
        - antfly
        - cohere
        - vertex
      description: "The reranking provider to use."

    AntflyRerankerConfig:
      type: object
      description: "Configuration for the Antfly inference reranking provider."
      properties:
        provider:
          type: string
          enum: [antfly]
        model:
          type: string
          description: "The name of the reranking model (e.g., cross-encoder model name)."
        url:
          type: string
          format: uri
          description: "The URL of the Inference API endpoint. Can also be set via ANTFLY_INFERENCE_URL environment variable."
      required:
        - provider
        - model
      example:
        provider: "antfly"
        model: "mixedbread-ai/mxbai-rerank-base-v1"
        url: "http://localhost:8080"

    CohereRerankerConfig:
      type: object
      description: |-
        Configuration for the Cohere reranking provider.

        API key via `api_key` field or `COHERE_API_KEY` environment variable.

        **Example Models:** rerank-english-v3.0 (default), rerank-multilingual-v3.0

        **Docs:** https://docs.cohere.com/reference/rerank
      properties:
        provider:
          type: string
          enum: [cohere]
        model:
          type: string
          description: "The name of the Cohere reranking model to use."
          default: "rerank-english-v3.0"
          example: "rerank-english-v3.0"
        api_key:
          type: string
          description: "The Cohere API key. Can also be set via COHERE_API_KEY environment variable."
      required:
        - provider
        - model
      example:
        provider: "cohere"
        model: "rerank-english-v3.0"

    VertexRerankerConfig:
      type: object
      description: |-
        Configuration for the Google Vertex AI Ranking API.

        Uses Application Default Credentials (ADC) or explicit credentials path.

        **Prerequisites:**
        - Enable Discovery Engine API: `gcloud services enable discoveryengine.googleapis.com`
        - Grant IAM role: `roles/discoveryengine.admin` (includes `discoveryengine.rankingConfigs.rank` permission)

        **Models:** semantic-ranker-default@latest (default), semantic-ranker-fast-004

        **Docs:** https://cloud.google.com/generative-ai-app-builder/docs/ranking

        **IAM:** https://cloud.google.com/generative-ai-app-builder/docs/access-control
      properties:
        provider:
          type: string
          enum: [vertex]
        model:
          type: string
          description: "The ranking model to use."
          default: "semantic-ranker-default@latest"
          example: "semantic-ranker-default@latest"
        project_id:
          type: string
          description: "Google Cloud project ID. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials. Falls back to GOOGLE_CLOUD_PROJECT environment variable."
        credentials_path:
          type: string
          description: "Path to service account JSON file. Shared Vertex credential field; see vertex.yaml#/components/schemas/VertexCredentials. Falls back to GOOGLE_APPLICATION_CREDENTIALS environment variable."
      required:
        - provider
        - model
      example:
        provider: "vertex"
        model: "semantic-ranker-default@latest"
        project_id: "my-gcp-project"

    RerankerConfig:
      x-go-type-skip-optional-pointer: false
      description: "A unified configuration for a reranking provider."
      allOf:
        - type: object
          properties:
            provider:
              $ref: "#/components/schemas/RerankerProvider"
            field:
              type: string
              description: "Field name to extract from documents for reranking."
            template:
              type: string
              description: "Handlebars template to render document text for reranking."
            candidate_count:
              type: integer
              minimum: 1
              description: "Maximum number of highest-ranked retrieval candidates to send to the reranker. Defaults to all candidates returned by retrieval; candidates outside this window are not returned."
            top_n:
              type: integer
              minimum: 1
              description: "Number of reranked documents to return after candidate_count documents have been scored. Defaults to candidate_count and cannot exceed it."
          required:
            - provider
        - oneOf:
            - $ref: "#/components/schemas/AntflyRerankerConfig"
            - $ref: "#/components/schemas/CohereRerankerConfig"
            - $ref: "#/components/schemas/VertexRerankerConfig"
      example:
        provider: "cohere"
        model: "rerank-v4.0-pro"
        field: "content"
