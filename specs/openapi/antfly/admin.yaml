        - applied_lsn
        - has_required_lsn
        - caught_up_to_received
        - fencing_confirmed
        - force
        - mode
        - data_loss_possible
        - safe
        - requires_fencing
        - requires_force
        - can_promote
      additionalProperties: false
      properties:
        required_lsn:
          type: integer
          format: uint64
          minimum: 0
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        has_required_lsn:
          type: boolean
        caught_up_to_received:
          type: boolean
        fencing_confirmed:
          type: boolean
        force:
          type: boolean
        mode:
          type: string
          enum: [blocked, safe, forced, lossy]
          description: |
            Explicit promotion mode for automation. `blocked` means the
