          type: string
          enum: [compaction_publish, derived_effect_writer, enrichment_writer, retention_advance]
        role:
          type: string
          enum: [primary, standby, promoted_standby]
        action:
          type: string
          enum: [run, disable_on_standby, open_promoted_primary]
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        durable_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 0
        promotion_handoff:
          nullable: true
          $ref: "#/components/schemas/StandbyPromotionHandoff"
    StandbyCommitGate:
      type: object
      required: [target_lsn, action, durability]
      additionalProperties: false
      properties:
        target_lsn:
          type: integer
          format: uint64
          minimum: 0
        action:
          type: string
          enum: [acknowledge, wait_for_standby, reject, acknowledge_degraded]
        durability:
          $ref: "#/components/schemas/StandbyDurabilityDecision"
    StandbyReplicationSlot:
      type: object
      required:
        - slot_name
        - timeline_id
        - restart_lsn
        - received_lsn
        - applied_lsn
        - safe_read_lsn
        - active
        - reseed_required
        - current_lsn
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        restart_lsn:
          type: integer
          format: uint64
          minimum: 0
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
        active:
          type: boolean
        reseed_required:
          type: boolean
        last_error:
          type: string
          nullable: true
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        dropped:
          type: boolean
          nullable: true
