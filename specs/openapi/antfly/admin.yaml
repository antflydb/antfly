openapi: "3.0.3"
info:
  title: Antfly Admin API
  version: v1alpha1
  description: |
    Stable operator-facing administration API for Antfly nodes.

    This API is separate from the public `/db/v1` API and from node-to-node
    `/internal/v1` RPCs. Kubernetes operators, automation, and CLIs should use
    this surface for typed hot-standby control-plane operations.
servers:
  - url: /admin/v1
    description: Node-local admin API
security:
  - BearerAuth: []
tags:
  - name: maintenance
    x-displayName: Storage Maintenance
    description: Engine-neutral asynchronous storage inspection and reclamation.
  - name: standby
    x-displayName: Hot Standby
    description: Hot-standby status and replication-slot management.
paths:
  /maintenance/check:
    post:
      tags: [maintenance]
      operationId: startStorageCheck
      summary: Start a coordinated storage integrity check
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/compact:
    post:
      tags: [maintenance]
      operationId: startStorageCompact
      summary: Start coordinated storage compaction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/vacuum:
    post:
      tags: [maintenance]
      operationId: startStorageVacuum
      summary: Start physical storage reclamation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/jobs/{job_id}:
    get:
      tags: [maintenance]
      operationId: getStorageMaintenanceJob
      summary: Get a storage maintenance job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer, format: uint64, minimum: 1 }
      responses:
        "200":
          description: Current maintenance job state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [maintenance]
      operationId: cancelStorageMaintenanceJob
      summary: Request cancellation of a storage maintenance job
      description: >-
        Cancellation is cooperative. The returned job may remain running until
        the storage engine reaches its next safe cancellation point.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer, format: uint64, minimum: 1 }
      responses:
        "202":
          description: Cancellation was requested or the job was already terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /standby/primary/status:
    get:
      tags: [standby]
      operationId: getHAPrimaryStatus
      summary: Get primary hot-standby status
      parameters:
        - name: max_lag_lsn
          in: query
          required: false
          description: Mark slots reseed-recommended after this many retained LSNs.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: max_retained_bytes
          in: query
          required: false
          description: Mark oldest slots reseed-recommended when retained WAL bytes exceed this cap.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: max_retained_age_ns
          in: query
          required: false
          description: Mark oldest slots reseed-recommended when retained WAL timestamp span exceeds this cap.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: sync_mode
          in: query
          required: false
          description: Optional synchronous durability mode to evaluate.
          schema:
            type: string
            enum: [async, remote-write, remote-apply]
        - name: sync_selection
          in: query
          required: false
          description: How named standbys satisfy the synchronous policy.
          schema:
            type: string
            enum: [any, first, all]
        - name: sync_required
          in: query
          required: false
          description: Number of standbys required for the synchronous policy.
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: sync_standby
          in: query
          required: false
          description: Repeatable synchronous standby name.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/StandbySlotName"
          style: form
          explode: true
        - name: sync_failure
          in: query
          required: false
          description: Synchronous standby failure policy.
          schema:
            type: string
            enum: [block, fail-closed, degrade-to-async]
      responses:
        "200":
          description: Primary status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyPrimaryStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/watchdog-proof:
    get:
      tags: [standby]
      operationId: getHAWatchdogProof
      summary: Get the runtime Lease watchdog capability proof
      description: >-
        Returns only the authenticated, process-local Lease watchdog proof. This
        endpoint remains independent of storage mutation critical sections so a
        slow seed capture cannot prevent the operator from renewing an otherwise
        valid fencing Lease.
      responses:
        "200":
          description: Current runtime Lease watchdog capability proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyWatchdogProofResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/status:
    get:
      tags: [standby]
      operationId: getHAStandbyStatus
      summary: Get standby status
      parameters:
        - name: upstream_lsn
          in: query
          required: false
          description: Current upstream primary LSN used to compute standby lag.
          schema:
            type: integer
            format: uint64
            minimum: 0
      responses:
        "200":
          description: Standby status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/commit/check:
    post:
      tags: [standby]
      operationId: checkHACommit
      summary: Evaluate synchronous commit durability for an existing LSN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitCheckRequest"
      responses:
        "200":
          description: Commit gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyCommitCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/commit/append:
    post:
      tags: [standby]
      operationId: appendHACommit
      summary: Append a primary WAL/effects record and evaluate synchronous commit durability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitAppendRequest"
      responses:
        "200":
          description: Appended LSN and commit gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyCommitAppendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/read/check:
    post:
      tags: [standby]
      operationId: checkHARead
      summary: Evaluate standby read freshness and routing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadCheckRequest"
      responses:
        "200":
          description: Read gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReadCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/write/check:
    post:
      tags: [standby]
      operationId: checkHAWrite
      summary: Evaluate whether this node can accept writes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCheckRequest"
      responses:
        "200":
          description: Write gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyWriteCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/owner-jobs/check:
    post:
      tags: [standby]
      operationId: checkHAOwnerJob
      summary: Evaluate whether an owner-only background job may run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerJobCheckRequest"
      responses:
        "200":
          description: Owner-job gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyOwnerJobCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication-slots:
    get:
      tags: [standby]
      operationId: listHAReplicationSlots
      summary: List hot-standby replication slots
      responses:
        "200":
          description: Replication slot list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [standby]
      operationId: createHAReplicationSlot
      summary: Create a hot-standby replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplicationSlotCreateRequest"
      responses:
        "200":
          description: Created slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication-slots/{slot_name}:
    delete:
      tags: [standby]
      operationId: dropHAReplicationSlot
      summary: Drop a hot-standby replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Dropped slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication-slots/{slot_name}/pause:
    put:
      tags: [standby]
      operationId: pauseHAReplicationSlot
      summary: Pause a hot-standby replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Paused slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication-slots/{slot_name}/resume:
    put:
      tags: [standby]
      operationId: resumeHAReplicationSlot
      summary: Resume a hot-standby replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Resumed slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/base-backups:
    post:
      tags: [standby]
      operationId: beginHABaseBackup
      summary: Begin a hot-standby base backup and reserve its replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupStartRequest"
      responses:
        "200":
          description: Base backup start boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyBaseBackupBeginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/base-backups/finish:
    post:
      tags: [standby]
      operationId: finishHABaseBackup
      summary: Finish a hot-standby base backup from a local manifest path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupManifestPathRequest"
      responses:
        "200":
          description: Base backup end boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyBaseBackupFinishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/base-backups/capture:
    post:
      tags: [standby]
      operationId: captureHASeedArtifact
      summary: Capture an immutable seed from runtime-owned primary storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeedArtifactCaptureRequest"
      responses:
        "200":
          description: The runtime-owned seed generation is durably complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbySeedArtifactCaptureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/seed-lifecycle/receipts:
    get:
      tags: [standby]
      operationId: getHASeedLifecycleReceipts
      summary: Read durable runtime-owned hot-standby seed lifecycle receipts
      description: |
        Returns an authenticated, read-only cursor page from the runtime-owned
        append-only receipt ledger. `history_truncated` and `gap` make bounded
        retention explicit so observers can fail closed when their collection
        window is incomplete.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [capture, activation]
        - name: after
          in: query
          required: false
          description: Exclusive durable ledger cursor. Zero starts at the retained prefix.
          schema:
            type: integer
            format: uint64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint32
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Durable receipt page and current runtime observation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbySeedLifecycleReceiptInventoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Durable ledger or authoritative retained receipt is corrupt.
  /standby/base-backups/activate:
    post:
      tags: [standby]
      operationId: activateHASeededSlot
      summary: Activate a seeded slot after durable target-generation publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeededSlotActivateRequest"
      responses:
        "200":
          description: The verified seed checkpoint is now streamable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbySeededSlotActivateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/bootstrap:
    post:
      tags: [standby]
      operationId: bootstrapHAStandby
      summary: Bootstrap this standby from a local base-backup manifest and copied files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyBootstrapRequest"
      responses:
        "200":
          description: Standby bootstrap result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyBootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/upstream:
    post:
      tags: [standby]
      operationId: setHAStandbyUpstream
      summary: Repoint a running standby at a different primary
      description: |
        Atomically replaces the upstream URL and replication slot a running
        standby pulls from, without restarting the process. The request carries
        the identity the caller expects the standby to have; the swap is
        rejected with 409 when the standby's current identity differs, so a
        stale operator cannot repoint a node that has since been promoted or
        reseeded. The next replication round pulls from the new upstream. This
        is the `follow` step of a switchover.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyUpstreamRequest"
      responses:
        "200":
          description: Upstream replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyUpstreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/fence:
    post:
      tags: [standby]
      operationId: acquireHAFence
      summary: Acquire a durable hot-standby promotion fence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Acquired or returned the current matching fence receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyFenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/fence/current:
    get:
      tags: [standby]
      operationId: getHACurrentFence
      summary: Get the current durable hot-standby promotion fence
      responses:
        "200":
          description: Current fence receipt, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyCurrentFenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/promotion/assess:
    post:
      tags: [standby]
      operationId: assessHAPromotion
      summary: Assess whether this standby can be promoted
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionAssessRequest"
      responses:
        "200":
          description: Promotion safety assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyPromotionAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/promotion/current-fence:
    post:
      tags: [standby]
      operationId: promoteHAWithCurrentFence
      summary: Promote this standby using the current durable fence receipt
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyPromotionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/promotion:
    post:
      tags: [standby]
      operationId: promoteHA
      summary: Acquire a fence and promote this standby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyPromotionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/rejoin/assess:
    post:
      tags: [standby]
      operationId: assessHARejoin
      summary: Assess whether a former primary can safely rejoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary rejoin assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyRejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /standby/rejoin/rewind:
    post:
      tags: [standby]
      operationId: rewindHARejoin
      summary: Rewind a fenced former primary onto the promoted timeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary rewind assessment accepted for execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyRejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/rejoin/reseed:
    post:
      tags: [standby]
      operationId: reseedHARejoin
      summary: Reseed a fenced former primary when rewind is unsafe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary reseed assessment accepted for execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyRejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional node-local admin bearer token. When an otherwise unauthenticated
        Antfly process is started with `--admin-token-env`, every typed
        `/admin/v1` route requires `Authorization: Bearer <token>`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Stable caller key used to return the original job on safe retries.
        Completed keys are retained for at least 24 hours within one server
        process. Job IDs are opaque 63-bit process-seeded values with retained
        history collision checks; callers must treat them as non-sequential.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SlotName:
      name: slot_name
      in: path
      required: true
      description: Stable standby replication slot name. Path values are percent-encoded; names must be hot-standby identifiers.
      schema:
        $ref: "#/components/schemas/StandbySlotName"
  responses:
    BadRequest:
      description: Invalid admin request.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Hot-standby operation cannot be completed in the current state.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: The admin bearer token is missing or invalid.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Admin resource was not found.
      content:
        text/plain:
          schema:
            type: string
    UnsupportedOperation:
      description: The configured storage engine does not support this operation.
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: The bounded maintenance history is full of retained job records.
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: The process-local maintenance job namespace is exhausted.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    StorageMaintenanceOperation:
      type: string
      enum: [check, compact, vacuum]
    StorageMaintenanceState:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    StorageMaintenanceResult:
      type: object
      additionalProperties: false
      properties:
        valid: { type: boolean }
        issue: { type: string }
        file_size: { type: integer, format: uint64, minimum: 0 }
        valid_prefix_size: { type: integer, format: uint64, minimum: 0 }
        reclaimable_bytes: { type: integer, format: uint64, minimum: 0 }
        before_size: { type: integer, format: uint64, minimum: 0 }
        after_size: { type: integer, format: uint64, minimum: 0 }
        reclaimed_bytes: { type: integer, format: uint64, minimum: 0 }
        live_file_count: { type: integer, format: uint64, minimum: 0 }
        live_bytes: { type: integer, format: uint64, minimum: 0 }
    StorageMaintenanceJob:
      type: object
      additionalProperties: false
      required: [job_id, operation, state, created_at_ms]
      properties:
        job_id:
          type: integer
          format: uint64
          minimum: 1
          maximum: 9223372036854775807
          description: Opaque non-sequential job identifier.
        operation: { $ref: "#/components/schemas/StorageMaintenanceOperation" }
        state: { $ref: "#/components/schemas/StorageMaintenanceState" }
        created_at_ms: { type: integer, format: int64 }
        started_at_ms: { type: integer, format: int64 }
        completed_at_ms: { type: integer, format: int64 }
        result: { $ref: "#/components/schemas/StorageMaintenanceResult" }
        error: { type: string }
    StandbyIdentifier:
      type: string
      description: Stable hot-standby node or slot identifier. Identifiers are 1-128 ASCII bytes and may contain letters, digits, `_`, `-`, `.`, and `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbySlotName:
      description: Stable standby replication slot name.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbyNodeID:
      description: Stable hot-standby node id.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    ReplicationSlotCreateRequest:
      type: object
      required: [slot_name]
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    BaseBackupStartRequest:
      type: object
      required: [slot_name, manifest_id]
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        manifest_id:
          type: string
          description: Operator-chosen stable id for the base-backup manifest.
          minLength: 1
          maxLength: 256
    BaseBackupManifestPathRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Absolute normalized pod-local path to the hot-standby base-backup manifest.
          minLength: 1
    StandbyBootstrapRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Absolute normalized pod-local path to the hot-standby base-backup manifest.
          minLength: 1
        content_root:
          type: string
          nullable: true
          description: Optional absolute normalized pod-local directory containing files referenced by the manifest.
    SeededSlotActivateRequest:
      type: object
      required:
        - slot_name
        - generation
        - manifest_id
        - timeline_id
        - checkpoint_lsn
        - seed_receipt_sha256
        - capture_receipt_sha256
        - manifest_sha256
        - aggregate_sha256
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        generation:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[A-Za-z0-9_.:-]+$"
        manifest_id:
          type: string
          minLength: 1
          maxLength: 256
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        checkpoint_lsn:
          type: integer
          format: uint64
          minimum: 1
        seed_receipt_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        capture_receipt_sha256:
          type: string
          description: SHA-256 of the exact runtime-owned capture COMPLETE receipt bytes that authorized publication.
          pattern: "^[0-9a-f]{64}$"
        manifest_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        aggregate_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    SeedArtifactCaptureRequest:
      type: object
      required:
        - slot_name
        - generation
        - topology_id
        - topology_generation
        - node_id
        - target_pvc_name
        - target_pvc_uid
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        generation:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[A-Za-z0-9_.:-]+$"
        topology_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        topology_generation:
          type: integer
          format: uint64
          minimum: 1
        node_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        target_pvc_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
        target_pvc_uid:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
    StandbyRuntimeLifecycleObservation:
      type: object
      required: [role, fenced, observed_at_unix_ns]
      additionalProperties: false
      properties:
        node_id:
          type: string
          nullable: true
        role:
          type: string
          enum: [primary, standby, unknown]
        pod_uid:
          type: string
          nullable: true
        fenced:
          type: boolean
        observed_at_unix_ns:
          type: integer
          format: uint64
          minimum: 1
    StandbySeedLifecycleReceiptEvent:
      type: object
      required:
        - cursor
        - kind
        - generation
        - slot_name
        - topology_id
        - topology_generation
        - node_id
        - target_pvc_name
        - target_pvc_uid
        - receipt_sha256
        - receipt_json
        - recorded_at_unix_ns
        - authoritative_state
      additionalProperties: false
      properties:
        cursor:
          type: integer
          format: uint64
          minimum: 1
        kind:
          type: string
          enum: [capture, activation]
        generation:
          type: string
          minLength: 1
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        topology_id:
          type: string
          minLength: 1
        topology_generation:
          type: integer
          format: uint64
          minimum: 1
        node_id:
          type: string
          minLength: 1
        target_pvc_name:
          type: string
          minLength: 1
        target_pvc_uid:
          type: string
          minLength: 1
        receipt_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        receipt_json:
          type: string
          minLength: 2
        recorded_at_unix_ns:
          type: integer
          format: uint64
          minimum: 1
        pod_uid:
          type: string
          nullable: true
        authoritative_state:
          type: string
          enum: [retained, missing]
    StandbySeedLifecycleReceiptInventoryResponse:
      type: object
      required:
        - schema_version
        - entries
        - first_cursor
        - end_cursor
        - next_cursor
        - history_truncated
        - gap
        - has_more
        - runtime
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        entries:
          type: array
          items:
            $ref: "#/components/schemas/StandbySeedLifecycleReceiptEvent"
        first_cursor:
          type: integer
          format: uint64
          minimum: 0
        end_cursor:
          type: integer
          format: uint64
          minimum: 0
        next_cursor:
          type: integer
          format: uint64
          minimum: 0
        history_truncated:
          type: boolean
        gap:
          type: boolean
        has_more:
          type: boolean
        runtime:
          $ref: "#/components/schemas/StandbyRuntimeLifecycleObservation"
    StandbySyncPolicy:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [async, remote_write, remote_apply]
          description: Durability mode to require before acknowledging the commit.
        selection:
          type: string
          enum: [any, first, all]
          default: any
          description: How named standbys are selected to satisfy the policy.
        required:
          type: integer
          format: uint64
          minimum: 1
          default: 1
          description: Number of eligible standbys required for `any` selection.
        standby_names:
          type: array
          items:
            $ref: "#/components/schemas/StandbySlotName"
          default: []
          description: Ordered candidate standby names for synchronous commit.
        failure_policy:
          type: string
          enum: [block, fail_closed, degrade_to_async]
          default: block
          description: Caller-visible action when synchronous durability is not currently satisfied.
    CommitCheckRequest:
      type: object
      required: [target_lsn, sync_policy]
      additionalProperties: false
      properties:
        target_lsn:
          type: integer
          format: uint64
          minimum: 0
        sync_policy:
          $ref: "#/components/schemas/StandbySyncPolicy"
    CommitAppendRequest:
      type: object
      required: [payload, sync_policy]
      additionalProperties: false
      properties:
        payload:
          type: string
          description: Logical WAL/effects payload to append.
        kind:
          type: string
          enum:
            - batch_mutation
            - metadata_mutation
            - derived_effect
            - backup_start
            - backup_end
            - checkpoint
            - manifest
            - truncate
            - timeline_switch
          default: batch_mutation
        payload_codec:
          type: string
          enum: [raw, json, binary]
          default: raw
        shard_id:
          type: integer
          format: uint64
          minimum: 0
          default: 0
        table_id:
          type: integer
          format: uint64
          minimum: 0
          default: 0
        commit_timestamp_ns:
          type: integer
          format: int64
          default: 0
        sync_policy:
          $ref: "#/components/schemas/StandbySyncPolicy"
    ReadCheckRequest:
      type: object
      additionalProperties: false
      properties:
        consistency:
          type: string
          enum: [stale_ok, at_least_lsn, primary]
          default: stale_ok
        required_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
        required_metadata_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
        metadata_applied_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
    WriteCheckRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [primary, standby]
        expected_identity:
          nullable: true
          $ref: "#/components/schemas/StandbyIdentity"
    OwnerJobCheckRequest:
      type: object
      required: [role, kind]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [primary, standby]
        kind:
          type: string
          enum: [compaction_publish, derived_effect_writer, enrichment_writer, retention_advance]
        expected_identity:
          nullable: true
          $ref: "#/components/schemas/StandbyIdentity"
    StandbyIdentity:
      type: object
      required: [cluster_id, shard_id, table_id, timeline_id, epoch]
      additionalProperties: false
      properties:
        cluster_id:
          type: integer
          format: uint64
          minimum: 1
        shard_id:
          type: integer
          format: uint64
          minimum: 0
          description: Shard identity. Use 0 for whole-instance hot-standby scope.
        table_id:
          type: integer
          format: uint64
          minimum: 0
          description: Table identity. Use 0 for whole-instance hot-standby scope.
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        epoch:
          type: integer
          format: uint64
          minimum: 1
    FenceAcquireRequest:
      type: object
      required:
        - identity
        - old_primary_id
        - promoted_node_id
        - new_timeline_id
        - new_epoch
        - required_lsn
        - observed_lsn
        - force
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        old_primary_id:
          $ref: "#/components/schemas/StandbyNodeID"
        promoted_node_id:
          $ref: "#/components/schemas/StandbyNodeID"
        new_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        new_epoch:
          type: integer
          format: uint64
          minimum: 1
        generation:
          type: integer
          format: uint64
          minimum: 1
          description: |
            Fence generation authorizing this fence. When the fencing authority is
            a Kubernetes Lease this is the exact Lease transition generation and
            must be supplied. When omitted, the node allocates the next
            generation itself: the current durable fence generation plus one, or
            1 when no fence exists. Allocation is only permitted when the node
            is not configured with an external fencing authority, so a
            Lease-managed cluster cannot be fenced by an unauthorized caller.
        required_lsn:
          type: integer
          format: uint64
          minimum: 1
        observed_lsn:
          type: integer
          format: uint64
          minimum: 0
        force:
          type: boolean
          default: false
        reason:
          type: string
          default: ""
    StandbyUpstreamRequest:
      type: object
      required: [identity, upstream_url, slot_name]
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
          description: Identity the standby is expected to have right now. Mismatch rejects the swap.
        upstream_url:
          type: string
          format: uri
          minLength: 1
          description: Base URL of the primary to pull from.
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        reason:
          type: string
          default: ""
    StandbyUpstream:
      type: object
      required: [upstream_url, slot_name]
      additionalProperties: false
      properties:
        upstream_url:
          type: string
          format: uri
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
    StandbyUpstreamResponse:
      type: object
      required: [schema_version, action, identity, upstream, changed]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        action:
          $ref: "#/components/schemas/StandbyActionReceipt"
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        upstream:
          $ref: "#/components/schemas/StandbyUpstream"
        previous:
          $ref: "#/components/schemas/StandbyUpstream"
          description: Upstream in effect before this request. Absent when the standby had no continuous upstream configured.
        changed:
          type: boolean
          description: False when the requested upstream already matched, which makes retries idempotent.
    StandbyFenceReceipt:
      type: object
      required:
        - identity
        - old_primary_id
        - promoted_node_id
        - parent_timeline_id
        - parent_epoch
        - new_timeline_id
        - new_epoch
        - required_lsn
        - observed_lsn
        - generation
        - forced
        - token
        - reason
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        old_primary_id:
          $ref: "#/components/schemas/StandbyNodeID"
        promoted_node_id:
          $ref: "#/components/schemas/StandbyNodeID"
        parent_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        parent_epoch:
          type: integer
          format: uint64
          minimum: 1
        new_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        new_epoch:
          type: integer
          format: uint64
          minimum: 1
        required_lsn:
          type: integer
          format: uint64
          minimum: 1
        observed_lsn:
          type: integer
          format: uint64
          minimum: 0
        generation:
          type: integer
          format: uint64
          minimum: 1
        forced:
          type: boolean
        token:
          type: string
          minLength: 1
        reason:
          type: string
    RejoinAssessRequest:
      type: object
      required:
        - node_id
        - identity
        - last_lsn
        - retained_from_lsn
        - allow_rewind_after_forced_promotion
      additionalProperties: false
      properties:
        node_id:
          $ref: "#/components/schemas/StandbyNodeID"
          description: Former primary node id that is attempting to rejoin.
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        last_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Last local LSN durably present on the former primary.
        retained_from_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Earliest parent-timeline WAL LSN still retained for rewind.
        allow_rewind_after_forced_promotion:
          type: boolean
          default: false
        receipt:
          $ref: "#/components/schemas/StandbyFenceReceipt"
          description: Durable promotion fence receipt. Omit to prove the rejoin path rejects unfenced former primaries.
    PromotionAssessRequest:
      type: object
      required:
        - required_lsn
        - fencing_confirmed
        - force
        - use_current_fence
      additionalProperties: false
      properties:
        required_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
        fencing_confirmed:
          type: boolean
          default: false
        force:
          type: boolean
          default: false
        use_current_fence:
          type: boolean
          default: false
    StandbyPrimaryStatusResponse:
      type: object
      required: [schema_version, snapshot]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/StandbyPrimarySnapshot"
    StandbyWatchdogProofResponse:
      type: object
      required: [schema_version, proof]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        proof:
          $ref: "#/components/schemas/StandbyLeaseWatchdogProof"
    StandbyStatusResponse:
      type: object
      required: [schema_version, snapshot]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/StandbySnapshot"
    StandbyCommitCheckResponse:
      type: object
      required: [schema_version, gate]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        gate:
          $ref: "#/components/schemas/StandbyCommitGate"
    StandbyCommitAppendResponse:
      type: object
      required: [schema_version, lsn, gate]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        lsn:
          type: integer
          format: uint64
          minimum: 0
        gate:
          $ref: "#/components/schemas/StandbyCommitGate"
    StandbyReadCheckResponse:
      type: object
      required: [schema_version, decision]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        decision:
          $ref: "#/components/schemas/StandbyReadDecision"
    StandbyWriteCheckResponse:
      type: object
      required: [schema_version, decision]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        decision:
          $ref: "#/components/schemas/StandbyWriteDecision"
    StandbyOwnerJobCheckResponse:
      type: object
      required: [schema_version, decision]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        decision:
          $ref: "#/components/schemas/StandbyOwnerJobDecision"
    StandbyActionReceipt:
      type: object
      required: [action_id, action_kind, target, state, node_id]
      additionalProperties: false
      properties:
        action_id:
          type: string
          minLength: 1
          description: Stable action correlation id derived from the acted-on hot-standby resource and boundary values.
        action_kind:
          type: string
          enum:
            - replication_slot_create
            - replication_slot_pause
            - replication_slot_resume
            - replication_slot_drop
            - base_backup_begin
            - base_backup_finish
            - seed_capture
            - seeded_slot_activate
            - standby_bootstrap
            - fence_acquire
            - promotion_assess
            - promotion
            - rejoin_assess
            - rejoin_rewind
            - rejoin_reseed
            - standby_upstream
          description: Typed hot-standby action that produced this response.
        target:
          type: string
          minLength: 1
          description: Node id, slot name, manifest id, or promotion boundary acted on by this node-local endpoint.
        state:
          type: string
          enum: [assessed, applied, already_applied]
          description: Idempotency state for this action response.
        node_id:
          $ref: "#/components/schemas/StandbyNodeID"
          description: Node id for the node-local admin endpoint that produced this receipt.
    StandbyReplicationSlotActionResponse:
      type: object
      required: [schema_version, action, slot_action, slot]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        action:
          $ref: "#/components/schemas/StandbyActionReceipt"
        slot_action:
          type: string
          enum: [create, pause, resume, drop]
        slot:
          $ref: "#/components/schemas/StandbyReplicationSlot"
    StandbyReplicationSlotListResponse:
      type: object
      required: [schema_version, slots]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        slots:
          type: array
          items:
            $ref: "#/components/schemas/StandbyReplicationSlot"
    StandbyBaseBackupBeginResponse:
      type: object
      required: [schema_version, action, slot_name, manifest_id, backup_lsn, start_record_lsn]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: uint32
          minimum: 1
        action:
          $ref: "#/components/schemas/StandbyActionReceipt"
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
          description: Stable standby replication slot reserved for the base backup.
        manifest_id:
          type: string
          minLength: 1
          description: Stable base-backup manifest id for retry and action correlation.
        backup_lsn:
          type: integer
          format: uint64
          minimum: 1
          description: LSN reserved as the base-backup start boundary.
        start_record_lsn:
          type: integer
