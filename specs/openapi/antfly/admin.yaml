openapi: "3.0.3"
info:
  title: Antfly Admin API
  version: v1alpha1
  description: |
    Stable operator-facing administration API for Antfly nodes.

    This API is separate from the public `/db/v1` API and from node-to-node
    `/internal/v1` RPCs. Kubernetes operators, automation, and CLIs should use
    this surface for typed HA control-plane operations.
servers:
  - url: /admin/v1
    description: Node-local admin API
security:
  - BearerAuth: []
tags:
  - name: maintenance
    x-displayName: Storage Maintenance
    description: Engine-neutral asynchronous storage inspection and reclamation.
  - name: ha
    x-displayName: High Availability
    description: Hot-standby HA status and replication-slot management.
paths:
  /maintenance/check:
    post:
      tags: [maintenance]
      operationId: startStorageCheck
      summary: Start a coordinated storage integrity check
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/compact:
    post:
      tags: [maintenance]
      operationId: startStorageCompact
      summary: Start coordinated storage compaction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/vacuum:
    post:
      tags: [maintenance]
      operationId: startStorageVacuum
      summary: Start physical storage reclamation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Maintenance job accepted or an idempotent existing job returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/UnsupportedOperation" }
  /maintenance/jobs/{job_id}:
    get:
      tags: [maintenance]
      operationId: getStorageMaintenanceJob
      summary: Get a storage maintenance job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer, format: uint64, minimum: 1 }
      responses:
        "200":
          description: Current maintenance job state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [maintenance]
      operationId: cancelStorageMaintenanceJob
      summary: Request cancellation of a storage maintenance job
      description: >-
        Cancellation is cooperative. The returned job may remain running until
        the storage engine reaches its next safe cancellation point.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: integer, format: uint64, minimum: 1 }
      responses:
        "202":
          description: Cancellation was requested or the job was already terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMaintenanceJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ha/primary/status:
    get:
      tags: [ha]
      operationId: getHAPrimaryStatus
      summary: Get primary HA status
      parameters:
        - name: max_lag_lsn
          in: query
          required: false
          description: Mark slots reseed-recommended after this many retained LSNs.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: max_retained_bytes
          in: query
          required: false
          description: Mark oldest slots reseed-recommended when retained WAL bytes exceed this cap.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: max_retained_age_ns
          in: query
          required: false
          description: Mark oldest slots reseed-recommended when retained WAL timestamp span exceeds this cap.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: sync_mode
          in: query
          required: false
          description: Optional synchronous durability mode to evaluate.
          schema:
            type: string
            enum: [async, remote-write, remote-apply]
        - name: sync_selection
          in: query
          required: false
          description: How named standbys satisfy the synchronous policy.
          schema:
            type: string
            enum: [any, first, all]
        - name: sync_required
          in: query
          required: false
          description: Number of standbys required for the synchronous policy.
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: sync_standby
          in: query
          required: false
          description: Repeatable synchronous standby name.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HASlotName"
          style: form
          explode: true
        - name: sync_failure
          in: query
          required: false
          description: Synchronous standby failure policy.
          schema:
            type: string
            enum: [block, fail-closed, degrade-to-async]
      responses:
        "200":
          description: Primary status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAPrimaryStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/standby/status:
    get:
      tags: [ha]
      operationId: getHAStandbyStatus
      summary: Get standby HA status
      parameters:
        - name: upstream_lsn
          in: query
          required: false
          description: Current upstream primary LSN used to compute standby lag.
          schema:
            type: integer
            format: uint64
            minimum: 0
      responses:
        "200":
          description: Standby status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAStandbyStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/commit/check:
    post:
      tags: [ha]
      operationId: checkHACommit
      summary: Evaluate synchronous commit durability for an existing LSN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitCheckRequest"
      responses:
        "200":
          description: Commit gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommitCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/commit/append:
    post:
      tags: [ha]
      operationId: appendHACommit
      summary: Append a primary WAL/effects record and evaluate synchronous commit durability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitAppendRequest"
      responses:
        "200":
          description: Appended LSN and commit gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommitAppendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/read/check:
    post:
      tags: [ha]
      operationId: checkHARead
      summary: Evaluate standby read freshness and routing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadCheckRequest"
      responses:
        "200":
          description: Read gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReadCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/write/check:
    post:
      tags: [ha]
      operationId: checkHAWrite
      summary: Evaluate whether this node can accept writes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCheckRequest"
      responses:
        "200":
          description: Write gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAWriteCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/owner-jobs/check:
    post:
      tags: [ha]
      operationId: checkHAOwnerJob
      summary: Evaluate whether an owner-only background job may run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerJobCheckRequest"
      responses:
        "200":
          description: Owner-job gate decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAOwnerJobCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots:
    get:
      tags: [ha]
      operationId: listHAReplicationSlots
      summary: List HA replication slots
      responses:
        "200":
          description: Replication slot list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReplicationSlotListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [ha]
      operationId: createHAReplicationSlot
      summary: Create an HA replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplicationSlotCreateRequest"
      responses:
        "200":
          description: Created slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReplicationSlotActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}:
    delete:
      tags: [ha]
      operationId: dropHAReplicationSlot
      summary: Drop an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Dropped slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}/pause:
    put:
      tags: [ha]
      operationId: pauseHAReplicationSlot
      summary: Pause an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Paused slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}/resume:
    put:
      tags: [ha]
      operationId: resumeHAReplicationSlot
      summary: Resume an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Resumed slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAReplicationSlotActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/base-backups:
    post:
      tags: [ha]
      operationId: beginHABaseBackup
      summary: Begin an HA base backup and reserve its replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupStartRequest"
      responses:
        "200":
          description: Base backup start boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HABaseBackupBeginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/base-backups/finish:
    post:
      tags: [ha]
      operationId: finishHABaseBackup
      summary: Finish an HA base backup from a local manifest path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupManifestPathRequest"
      responses:
        "200":
          description: Base backup end boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HABaseBackupFinishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/standby/bootstrap:
    post:
      tags: [ha]
      operationId: bootstrapHAStandby
      summary: Bootstrap this standby from a local base-backup manifest and copied files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyBootstrapRequest"
      responses:
        "200":
          description: Standby bootstrap result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAStandbyBootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/fence:
    post:
      tags: [ha]
      operationId: acquireHAFence
      summary: Acquire a durable HA promotion fence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Acquired or returned the current matching fence receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAFenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/fence/current:
    get:
      tags: [ha]
      operationId: getHACurrentFence
      summary: Get the current durable HA promotion fence
      responses:
        "200":
          description: Current fence receipt, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACurrentFenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion/assess:
    post:
      tags: [ha]
      operationId: assessHAPromotion
      summary: Assess whether this standby can be promoted
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionAssessRequest"
      responses:
        "200":
          description: Promotion safety assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAPromotionAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion/current-fence:
    post:
      tags: [ha]
      operationId: promoteHAWithCurrentFence
      summary: Promote this standby using the current durable fence receipt
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAPromotionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion:
    post:
      tags: [ha]
      operationId: promoteHA
      summary: Acquire a fence and promote this standby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAPromotionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/rejoin/assess:
    post:
      tags: [ha]
      operationId: assessHARejoin
      summary: Assess whether a former primary can safely rejoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary rejoin assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HARejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ha/rejoin/rewind:
    post:
      tags: [ha]
      operationId: rewindHARejoin
      summary: Rewind a fenced former primary onto the promoted timeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary rewind assessment accepted for execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HARejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/rejoin/reseed:
    post:
      tags: [ha]
      operationId: reseedHARejoin
      summary: Reseed a fenced former primary when rewind is unsafe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary reseed assessment accepted for execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HARejoinAssessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional node-local HA admin bearer token. When an Antfly process is
        started with `--ha-admin-token-env`, typed `/admin/v1/ha` routes require
        `Authorization: Bearer <token>`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Stable caller key used to return the original job on safe retries.
        Completed keys are retained for at least 24 hours within one server
        process; callers must reconcile job status after a server restart.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SlotName:
      name: slot_name
      in: path
      required: true
      description: Stable standby replication slot name. Path values are percent-encoded; names must be HA identifiers.
      schema:
        $ref: "#/components/schemas/HASlotName"
  responses:
    BadRequest:
      description: Invalid admin request.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: HA operation cannot be completed in the current state.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: HA admin bearer token is missing or invalid.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Admin resource was not found.
      content:
        text/plain:
          schema:
            type: string
    UnsupportedOperation:
      description: The configured storage engine does not support this operation.
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: The bounded maintenance history is full of retained job records.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    StorageMaintenanceOperation:
      type: string
      enum: [check, compact, vacuum]
    StorageMaintenanceState:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    StorageMaintenanceResult:
      type: object
      additionalProperties: false
      properties:
        valid: { type: boolean }
        issue: { type: string }
        file_size: { type: integer, format: uint64, minimum: 0 }
        valid_prefix_size: { type: integer, format: uint64, minimum: 0 }
        reclaimable_bytes: { type: integer, format: uint64, minimum: 0 }
        before_size: { type: integer, format: uint64, minimum: 0 }
        after_size: { type: integer, format: uint64, minimum: 0 }
        reclaimed_bytes: { type: integer, format: uint64, minimum: 0 }
        live_file_count: { type: integer, format: uint64, minimum: 0 }
        live_bytes: { type: integer, format: uint64, minimum: 0 }
    StorageMaintenanceJob:
      type: object
      additionalProperties: false
      required: [job_id, operation, state, created_at_ms]
      properties:
        job_id: { type: integer, format: uint64, minimum: 1 }
        operation: { $ref: "#/components/schemas/StorageMaintenanceOperation" }
        state: { $ref: "#/components/schemas/StorageMaintenanceState" }
        created_at_ms: { type: integer, format: int64 }
        started_at_ms: { type: integer, format: int64 }
        completed_at_ms: { type: integer, format: int64 }
        result: { $ref: "#/components/schemas/StorageMaintenanceResult" }
        error: { type: string }
    HAIdentifier:
      type: string
      description: Stable HA node or slot identifier. Identifiers are 1-128 ASCII bytes and may contain letters, digits, `_`, `-`, `.`, and `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    HASlotName:
      description: Stable standby replication slot name.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    HANodeID:
      description: Stable HA node id.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    ReplicationSlotCreateRequest:
      type: object
      required: [slot_name]
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/HASlotName"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    BaseBackupStartRequest:
      type: object
      required: [slot_name, manifest_id]
      additionalProperties: false
      properties:
        slot_name:
          $ref: "#/components/schemas/HASlotName"
        manifest_id:
          type: string
          description: Operator-chosen stable id for the base-backup manifest.
          minLength: 1
          maxLength: 256
    BaseBackupManifestPathRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Absolute normalized pod-local path to the HA base-backup manifest.
          minLength: 1
    StandbyBootstrapRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Absolute normalized pod-local path to the HA base-backup manifest.
          minLength: 1
        content_root:
          type: string
          nullable: true
          description: Optional absolute normalized pod-local directory containing files referenced by the manifest.
    HASyncPolicy:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [async, remote_write, remote_apply]
          description: Durability mode to require before acknowledging the commit.
        selection:
          type: string
          enum: [any, first, all]
          default: any
          description: How named standbys are selected to satisfy the policy.
        required:
          type: integer
          format: uint64
          minimum: 1
          default: 1
          description: Number of eligible standbys required for `any` selection.
        standby_names:
          type: array
          items:
            $ref: "#/components/schemas/HASlotName"
          default: []
          description: Ordered candidate standby names for synchronous commit.
        failure_policy:
          type: string
          enum: [block, fail_closed, degrade_to_async]
          default: block
          description: Caller-visible action when synchronous durability is not currently satisfied.
