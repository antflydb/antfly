openapi: "3.0.3"
info:
  title: Antfly Admin API
  version: v1alpha1
  description: |
    Stable operator-facing administration API for Antfly nodes.

    This API is separate from the public `/db/v1` API and from node-to-node
    `/internal/v1` RPCs. Kubernetes operators, automation, and CLIs should use
    this surface for typed HA control-plane operations.
servers:
  - url: /admin/v1
    description: Node-local admin API
tags:
  - name: ha
    x-displayName: High Availability
    description: Hot-standby HA status and replication-slot management.
paths:
  /ha/primary/status:
    get:
      tags: [ha]
      operationId: getHAPrimaryStatus
      summary: Get primary HA status
      parameters:
        - name: max_lag_lsn
          in: query
          required: false
          description: Mark slots reseed-recommended after this many retained LSNs.
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: sync_mode
          in: query
          required: false
          description: Optional synchronous durability mode to evaluate.
          schema:
            type: string
            enum: [async, remote-write, remote-apply]
        - name: sync_selection
          in: query
          required: false
          description: How named standbys satisfy the synchronous policy.
          schema:
            type: string
            enum: [any, first, all]
        - name: sync_required
          in: query
          required: false
          description: Number of standbys required for the synchronous policy.
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: sync_standby
          in: query
          required: false
          description: Repeatable synchronous standby name.
          schema:
            type: array
            items:
              type: string
              minLength: 1
          style: form
          explode: true
        - name: sync_failure
          in: query
          required: false
          description: Synchronous standby failure policy.
          schema:
            type: string
            enum: [block, fail-closed, degrade-to-async]
      responses:
        "200":
          description: Primary status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/standby/status:
    get:
      tags: [ha]
      operationId: getHAStandbyStatus
      summary: Get standby HA status
      parameters:
        - name: upstream_lsn
          in: query
          required: false
          description: Current upstream primary LSN used to compute standby lag.
          schema:
            type: integer
            format: uint64
            minimum: 0
      responses:
        "200":
          description: Standby status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots:
    get:
      tags: [ha]
      operationId: listHAReplicationSlots
      summary: List HA replication slots
      responses:
        "200":
          description: Replication slot list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [ha]
      operationId: createHAReplicationSlot
      summary: Create an HA replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplicationSlotCreateRequest"
      responses:
        "200":
          description: Created slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}:
    delete:
      tags: [ha]
      operationId: dropHAReplicationSlot
      summary: Drop an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Dropped slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}/pause:
    put:
      tags: [ha]
      operationId: pauseHAReplicationSlot
      summary: Pause an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Paused slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/replication-slots/{slot_name}/resume:
    put:
      tags: [ha]
      operationId: resumeHAReplicationSlot
      summary: Resume an HA replication slot
      parameters:
        - $ref: "#/components/parameters/SlotName"
      responses:
        "200":
          description: Resumed slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/base-backups:
    post:
      tags: [ha]
      operationId: beginHABaseBackup
      summary: Begin an HA base backup and reserve its replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupStartRequest"
      responses:
        "200":
          description: Base backup start boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/base-backups/finish:
    post:
      tags: [ha]
      operationId: finishHABaseBackup
      summary: Finish an HA base backup from a local manifest path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseBackupManifestPathRequest"
      responses:
        "200":
          description: Base backup end boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/standby/bootstrap:
    post:
      tags: [ha]
      operationId: bootstrapHAStandby
      summary: Bootstrap this standby from a local base-backup manifest and copied files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyBootstrapRequest"
      responses:
        "200":
          description: Standby bootstrap result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/fence:
    post:
      tags: [ha]
      operationId: acquireHAFence
      summary: Acquire a durable HA promotion fence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Acquired or returned the current matching fence receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/fence/current:
    get:
      tags: [ha]
      operationId: getHACurrentFence
      summary: Get the current durable HA promotion fence
      responses:
        "200":
          description: Current fence receipt, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion/assess:
    post:
      tags: [ha]
      operationId: assessHAPromotion
      summary: Assess whether this standby can be promoted
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionAssessRequest"
      responses:
        "200":
          description: Promotion safety assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion/current-fence:
    post:
      tags: [ha]
      operationId: promoteHAWithCurrentFence
      summary: Promote this standby using the current durable fence receipt
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/promotion:
    post:
      tags: [ha]
      operationId: promoteHA
      summary: Acquire a fence and promote this standby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FenceAcquireRequest"
      responses:
        "200":
          description: Promotion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /ha/rejoin/assess:
    post:
      tags: [ha]
      operationId: assessHARejoin
      summary: Assess whether a former primary can safely rejoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejoinAssessRequest"
      responses:
        "200":
          description: Former-primary rejoin assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HACommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    SlotName:
      name: slot_name
      in: path
      required: true
      description: Stable standby replication slot name.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    BadRequest:
      description: Invalid admin request.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: HA operation cannot be completed in the current state.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: HA resource was not found.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    ReplicationSlotCreateRequest:
      type: object
      required: [slot_name]
      additionalProperties: false
      properties:
        slot_name:
          type: string
          description: Stable standby replication slot name.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    BaseBackupStartRequest:
      type: object
      required: [slot_name, manifest_id]
      additionalProperties: false
      properties:
        slot_name:
          type: string
          description: Stable standby replication slot name to reserve for the base backup.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
        manifest_id:
          type: string
          description: Operator-chosen stable id for the base-backup manifest.
          minLength: 1
          maxLength: 256
    BaseBackupManifestPathRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Pod-local path to the HA base-backup manifest.
          minLength: 1
    StandbyBootstrapRequest:
      type: object
      required: [manifest_path]
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          description: Pod-local path to the HA base-backup manifest.
          minLength: 1
        content_root:
          type: string
          nullable: true
          description: Optional pod-local directory containing files referenced by the manifest.
    HAIdentity:
      type: object
      required: [cluster_id, shard_id, table_id, timeline_id, epoch]
      additionalProperties: false
      properties:
        cluster_id:
          type: integer
          format: uint64
          minimum: 1
        shard_id:
          type: integer
          format: uint64
          minimum: 1
        table_id:
          type: integer
          format: uint64
          minimum: 1
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        epoch:
          type: integer
          format: uint64
          minimum: 1
    FenceAcquireRequest:
      type: object
      required:
        - identity
        - old_primary_id
        - promoted_node_id
        - new_timeline_id
        - new_epoch
        - required_lsn
        - observed_lsn
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/HAIdentity"
        old_primary_id:
          type: string
          minLength: 1
        promoted_node_id:
          type: string
          minLength: 1
        new_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        new_epoch:
          type: integer
          format: uint64
          minimum: 1
        required_lsn:
          type: integer
          format: uint64
          minimum: 1
        observed_lsn:
          type: integer
          format: uint64
          minimum: 0
        force:
          type: boolean
          default: false
        reason:
          type: string
          default: ""
    HAFenceReceipt:
      type: object
      required:
        - identity
        - old_primary_id
        - promoted_node_id
        - parent_timeline_id
        - parent_epoch
        - new_timeline_id
        - new_epoch
        - required_lsn
        - observed_lsn
        - generation
        - forced
        - token
        - reason
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/HAIdentity"
        old_primary_id:
          type: string
          minLength: 1
        promoted_node_id:
          type: string
          minLength: 1
        parent_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        parent_epoch:
          type: integer
          format: uint64
          minimum: 1
        new_timeline_id:
          type: integer
          format: uint64
          minimum: 1
        new_epoch:
          type: integer
          format: uint64
          minimum: 1
        required_lsn:
          type: integer
          format: uint64
          minimum: 1
        observed_lsn:
          type: integer
          format: uint64
          minimum: 0
        generation:
          type: integer
          format: uint64
          minimum: 1
        forced:
          type: boolean
        token:
          type: string
          minLength: 1
        reason:
          type: string
    RejoinAssessRequest:
      type: object
      required:
        - node_id
        - identity
        - last_lsn
        - retained_from_lsn
      additionalProperties: false
      properties:
        node_id:
          type: string
          minLength: 1
          description: Former primary node id that is attempting to rejoin.
        identity:
          $ref: "#/components/schemas/HAIdentity"
        last_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Last local LSN durably present on the former primary.
        retained_from_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Earliest parent-timeline WAL LSN still retained for rewind.
        allow_rewind_after_forced_promotion:
          type: boolean
          default: false
        receipt:
          $ref: "#/components/schemas/HAFenceReceipt"
          description: Durable promotion fence receipt. Omit to prove the rejoin path rejects unfenced former primaries.
    PromotionAssessRequest:
      type: object
      additionalProperties: false
      properties:
        required_lsn:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
        fencing_confirmed:
          type: boolean
          default: false
        force:
          type: boolean
          default: false
        use_current_fence:
          type: boolean
          default: false
    HACommandResult:
      type: object
      description: |
        JSON rendering of the underlying HA admin command result. This envelope
        remains intentionally tolerant while the hot-standby API graduates from
        operator integration to a fully typed response schema.
      additionalProperties: true
