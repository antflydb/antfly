      }
    StandbyIdentifier:
      type: string
      description: Stable hot-standby node or slot identifier. Identifiers are 1-128 ASCII bytes and may contain letters, digits, `_`, `-`, `.`, and `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbySlotName:
      description: Stable standby replication slot name.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbyIdentity:
      type: object
      required: [cluster_id, shard_id, table_id, timeline_id, epoch]
      properties:
        cluster_id:
          type: integer
          format: uint64
          minimum: 1
        shard_id:
          type: integer
          format: uint64
          minimum: 0
        table_id:
          type: integer
          format: uint64
          minimum: 0
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        epoch:
          type: integer
          format: uint64
          minimum: 1
    StandbyIdentifySystemResponse:
      type: object
      required: [identity, current_lsn, next_lsn, record_format_version]
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
    StandbyCreateReplicationSlotRequest:
      type: object
      required: [slot_name]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    StandbyReplicationSlotResponse:
      type: object
      required:
        - slot_name
        - timeline_id
        - restart_lsn
        - received_lsn
        - applied_lsn
        - safe_read_lsn
        - active
        - reseed_required
        - current_lsn
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        restart_lsn:
          type: integer
          format: uint64
          minimum: 0
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
        active:
          type: boolean
        reseed_required:
          type: boolean
        last_error:
          type: string
          nullable: true
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
    StandbyStartReplicationRequest:
      type: object
      required: [slot_name, from_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        max_records:
          type: integer
          format: uint64
          minimum: 0
          description: Optional maximum record count. Zero means no record-count limit.
        max_encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Optional encoded byte budget. Zero means no byte limit.
    StandbyRecordKind:
      type: string
      enum:
        - batch-mutation
        - metadata-mutation
        - derived-effect
        - backup-start
        - backup-end
        - checkpoint
        - manifest
        - truncate
        - timeline-switch
    StandbyPayloadCodec:
      type: string
      enum: [raw, json, binary]
    StandbyReplicationFrame:
      type: object
      required: [lsn, kind, payload_codec, encoded]
      properties:
        lsn:
          type: integer
          format: uint64
          minimum: 1
        kind:
          $ref: "#/components/schemas/StandbyRecordKind"
        payload_codec:
          $ref: "#/components/schemas/StandbyPayloadCodec"
        encoded:
          type: string
          format: byte
          description: Base64-encoded complete replication record envelope.
    StandbyStartReplicationResponse:
      type: object
      required:
        - slot_name
        - identity
        - record_format_version
        - timeline_id
        - from_lsn
        - current_lsn
        - last_sent_lsn
        - next_lsn
        - end_of_wal
        - encoded_bytes
        - records
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        last_sent_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        end_of_wal:
          type: boolean
        encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
        records:
          type: array
          items:
            $ref: "#/components/schemas/StandbyReplicationFrame"
    StandbyStatusUpdateRequest:
      type: object
      required: [slot_name, timeline_id, received_lsn, applied_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional safe-read boundary. Defaults to applied_lsn.
    StandbyStatusUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/StandbyReplicationSlotResponse"
