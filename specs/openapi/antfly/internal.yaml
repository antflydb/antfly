  /catalog/changefeed-state-v1:
    post:
      tags: [retained-history]
      operationId: accessInternalChangefeedState
      summary: Read or mutate durable private changefeed ownership state
      description: |
        Signed service-only metadata capability, including during migration.
        Never expose this operation as a public feed API. Reads and authority
        discovery establish a linearizable metadata barrier. Mutations preserve
        the state machine's revision, owner epoch and authority fences and are
        attempted at most once. An uncertain response cannot certify non-commit;
        reconcile by reading durable state before making another decision.
        The routing remaining-time header carries one shared relative budget.
        Bodies are limited to 50335744 bytes to accommodate JSON escaping of an
        encoded state or write of at most 8388608 bytes. Unknown fields, mixed
        action fields and unsupported wire versions are rejected before dispatch.
      security:
        - InternalServicePrincipal: []
      parameters:
        - in: header
          name: X-Antfly-Routing-Remaining-Ms
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InternalChangefeedStateRequest'}
      responses:
        '200':
          description: Action-bound result; a mutation reply confirms durable success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InternalChangefeedStateReply'}
        '400': {description: Invalid bounded request}
        '403': {description: Authenticated service required}
        '409': {description: Known revision or authority conflict}
        '413': {description: Request exceeds wire bounds}
        '503':
          description: Unavailable or uncertain mutation; inspect the outcome header
          headers:
            X-Antfly-Raft-Mutation-Outcome:
              schema: {type: string, enum: [not-proposed-v1, not-applied-v1, unknown-v1, committed-v1]}
        '504': {description: Shared deadline exhausted; mutation may have committed}
  /groups/{group_id}/tables/{table_name}/history/decision-v1:
