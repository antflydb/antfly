openapi: "3.0.3"
info:
  title: Antfly Internal API
  version: v1alpha1
  description: |
    Node-to-node internal API for Antfly runtime traffic.

    This API is separate from the public `/db/v1` API and from operator-facing
    `/admin/v1` control-plane operations. It is intended for trusted Antfly
    nodes in one deployment. Hot-standby WAL replication uses this surface for
    identity probes, slot bootstrap, WAL pulls, and standby progress updates.
servers:
  - url: /internal/v1
    description: Node-local internal API
tags:
  - name: retained-history
    description: Private native retained-history ownership and receipt recovery.
  - name: standby-replication
    x-displayName: Hot Standby Replication
    description: Runtime-to-runtime hot-standby replication protocol.
paths:
  /groups/{group_id}/tables/{table_name}/history/control-v1:
    post:
      tags: [retained-history]
      operationId: controlNativeRetainedHistory
      summary: Submit a native retention control or recover its exact result
      description: |
        Trusted node-to-node operation, bounded to 4096 request and response bytes.
        Requires a service principal and an immutable catalog route fence. Submit
        and recovery are distinct; recovery never proposes the command again.
        A 200 response is not permission to ACK: null or superseded outcomes are
        unconfirmed, and a known rejection is not a successful mutation. A lost
        response is ambiguous and must not cause automatic re-proposal.
        These private Raft receipts are not public feed cursors or PostgreSQL LSNs.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          description: Serialized immutable catalog route fence, including metadata and table incarnation and exact group/range identity. The receiver validates it against current authoritative routing.
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryControlRequest'}
      responses:
        '200':
          description: Bounded typed result; inspect receipt and outcome before advancing any progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryControlResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid internal service authority.
        '403':
          description: The authenticated principal is not an internal service.
        '409':
          description: Route, table incarnation, history scope or original receipt conflicts.
        '413':
          description: Request exceeds the private control byte limit.
        '501':
          description: This serving profile does not support native retained-history controls.
        '503':
          description: Leader, routing or storage admission is temporarily unavailable; admission outcome headers distinguish known not-proposed from ambiguous outcomes.
  /standby/replication/identify:
    get:
      tags: [standby-replication]
      operationId: identifyHAReplicationSystem
      summary: Identify this primary replication system
      responses:
        "200":
          description: Primary identity and replication format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyIdentifySystemResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/slots:
    post:
      tags: [standby-replication]
      operationId: createHAReplicationStreamingSlot
      summary: Create or reserve a runtime replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyCreateReplicationSlotRequest"
      responses:
        "200":
          description: Created replication slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/start:
    post:
      tags: [standby-replication]
      operationId: startHAReplication
      summary: Pull ordered hot-standby replication records from a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStartReplicationRequest"
      responses:
        "200":
          description: Ordered replication records starting at the requested LSN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStartReplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/status:
    post:
      tags: [standby-replication]
      operationId: updateHAStandbyStatus
      summary: Report durable receive and apply progress for a standby slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStatusUpdateRequest"
      responses:
        "200":
          description: Persisted standby slot progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStatusUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    InternalServicePrincipal:
      type: apiKey
      in: header
      name: X-Antfly-Trusted-Principal
      description: Deployment-scoped authenticated service-principal envelope; an ordinary user credential cannot authorize this operation.
  responses:
    BadRequest:
      description: Invalid internal replication request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Requested replication resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Node role or replication state does not allow the request.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    NativeHistoryNamespace:
      {
        "type": "array",
        "minItems": 24,
        "maxItems": 24,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryDigest:
      {
        "type": "array",
        "minItems": 32,
        "maxItems": 32,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryConsumerId:
      {
        "type": "array",
        "minItems": 16,
        "maxItems": 16,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryReceipt:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "term",
          "index"
        ],
        "properties": {
          "term": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "index": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryReference:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "epoch",
          "grant"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "epoch": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "grant": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryGrant:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "sequence",
          "expires_at_seconds",
          "policy_revision"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "sequence": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "expires_at_seconds": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "policy_revision": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "limit": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1,
            "default": 268435456
          }
        }
      }
    NativeHistoryRetirement:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "sequence",
          "grant"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "sequence": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "grant": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryAcknowledge:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference",
          "previous",
          "next"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "previous": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "next": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          }
        }
      }
    NativeHistoryRenew:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference",
          "previous",
          "next"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "previous": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "next": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryReclaim:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "max_frames": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32,
            "default": 1
          }
        }
      }
    NativeHistoryCollect:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "max_frames": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32,
            "default": 1
          }
        }
      }
    NativeHistoryControlCommand:
      {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "enroll"
            ],
            "properties": {
              "enroll": {
                "$ref": "#/components/schemas/NativeHistoryGrant"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "inspect"
            ],
            "properties": {
              "inspect": {
                "$ref": "#/components/schemas/NativeHistoryReference"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "acknowledge"
            ],
            "properties": {
              "acknowledge": {
                "$ref": "#/components/schemas/NativeHistoryAcknowledge"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "renew"
            ],
            "properties": {
              "renew": {
                "$ref": "#/components/schemas/NativeHistoryRenew"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "retire"
            ],
            "properties": {
              "retire": {
                "$ref": "#/components/schemas/NativeHistoryRetirement"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "reclaim"
            ],
            "properties": {
              "reclaim": {
                "$ref": "#/components/schemas/NativeHistoryReclaim"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "collect"
            ],
            "properties": {
              "collect": {
                "$ref": "#/components/schemas/NativeHistoryCollect"
              }
            }
          }
        ]
      }
    NativeHistoryConsumer:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "epoch",
          "start",
          "acknowledged",
          "expires_at_seconds",
          "policy_revision"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "epoch": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "start": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "acknowledged": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "expires_at_seconds": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "policy_revision": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryApplied:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumer",
            "nullable": true
          },
          "reclaimed_frames": {
            "type": "integer",
            "minimum": 0,
            "maximum": 32,
            "default": 0
          }
        }
      }
    NativeHistoryOutcome:
      {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "applied"
            ],
            "properties": {
              "applied": {
                "$ref": "#/components/schemas/NativeHistoryApplied"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "rejected"
            ],
            "properties": {
              "rejected": {
                "type": "string",
                "enum": [
                  "invalid",
                  "resynchronization",
                  "consumer_conflict",
                  "consumer_limit",
                  "checkpoint_conflict",
                  "full",
                  "prepared_transactions"
                ]
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "superseded"
            ],
            "properties": {
              "superseded": {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {}
              }
            }
          }
        ]
      }
    NativeHistoryControlRequest:
      {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "version",
              "operation",
              "command"
            ],
            "properties": {
              "version": {
                "type": "integer",
                "enum": [
                  1
                ]
              },
              "command": {
                "$ref": "#/components/schemas/NativeHistoryControlCommand"
              },
              "operation": {
                "type": "string",
                "enum": [
                  "submit"
                ]
              },
              "receipt": {
                "$ref": "#/components/schemas/NativeHistoryReceipt",
                "nullable": true
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "version",
              "command",
              "operation",
              "receipt"
            ],
            "properties": {
              "version": {
                "type": "integer",
                "enum": [
                  1
                ]
              },
              "command": {
                "$ref": "#/components/schemas/NativeHistoryControlCommand"
              },
              "operation": {
                "type": "string",
                "enum": [
                  "recover"
                ]
              },
              "receipt": {
                "$ref": "#/components/schemas/NativeHistoryReceipt"
              }
            }
          }
        ],
        "description": "Version is mandatory. Submit requires a null or omitted receipt. Recover requires the original receipt. Namespace must match the authenticated route. Unknown and duplicate fields are rejected."
      }
    NativeHistoryControlResponse:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "receipt": {
            "$ref": "#/components/schemas/NativeHistoryReceipt",
            "nullable": true
          },
          "outcome": {
            "$ref": "#/components/schemas/NativeHistoryOutcome",
            "nullable": true
          }
        },
        "description": "Outcome requires a receipt. Recovery echoes the original receipt. Null outcome or superseded means unconfirmed; applied and rejected are resolved results, not equivalent success. Applied consumer identity/epoch and ACK/renew/reclamation bounds must match the request."
      }
    StandbyIdentifier:
      type: string
      description: Stable hot-standby node or slot identifier. Identifiers are 1-128 ASCII bytes and may contain letters, digits, `_`, `-`, `.`, and `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbySlotName:
      description: Stable standby replication slot name.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbyIdentity:
      type: object
      required: [cluster_id, shard_id, table_id, timeline_id, epoch]
      properties:
        cluster_id:
          type: integer
          format: uint64
          minimum: 1
        shard_id:
          type: integer
          format: uint64
          minimum: 0
        table_id:
          type: integer
          format: uint64
          minimum: 0
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        epoch:
          type: integer
          format: uint64
          minimum: 1
    StandbyIdentifySystemResponse:
      type: object
      required: [identity, current_lsn, next_lsn, record_format_version]
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
    StandbyCreateReplicationSlotRequest:
      type: object
      required: [slot_name]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    StandbyReplicationSlotResponse:
      type: object
      required:
        - slot_name
        - timeline_id
        - restart_lsn
        - received_lsn
        - applied_lsn
        - safe_read_lsn
        - active
        - reseed_required
        - current_lsn
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        restart_lsn:
          type: integer
          format: uint64
          minimum: 0
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
        active:
          type: boolean
        reseed_required:
          type: boolean
        last_error:
          type: string
          nullable: true
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
    StandbyStartReplicationRequest:
      type: object
      required: [slot_name, from_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        max_records:
          type: integer
          format: uint64
          minimum: 0
          description: Optional maximum record count. Zero means no record-count limit.
        max_encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Optional encoded byte budget. Zero means no byte limit.
    StandbyRecordKind:
      type: string
      enum:
        - batch-mutation
        - metadata-mutation
        - derived-effect
        - backup-start
        - backup-end
        - checkpoint
        - manifest
        - truncate
        - timeline-switch
    StandbyPayloadCodec:
      type: string
      enum: [raw, json, binary]
    StandbyReplicationFrame:
      type: object
      required: [lsn, kind, payload_codec, encoded]
      properties:
        lsn:
          type: integer
          format: uint64
          minimum: 1
        kind:
          $ref: "#/components/schemas/StandbyRecordKind"
        payload_codec:
          $ref: "#/components/schemas/StandbyPayloadCodec"
        encoded:
          type: string
          format: byte
          description: Base64-encoded complete replication record envelope.
    StandbyStartReplicationResponse:
      type: object
      required:
        - slot_name
        - identity
        - record_format_version
        - timeline_id
        - from_lsn
        - current_lsn
        - last_sent_lsn
        - next_lsn
        - end_of_wal
        - encoded_bytes
        - records
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        last_sent_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        end_of_wal:
          type: boolean
        encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
        records:
          type: array
          items:
            $ref: "#/components/schemas/StandbyReplicationFrame"
    StandbyStatusUpdateRequest:
      type: object
      required: [slot_name, timeline_id, received_lsn, applied_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional safe-read boundary. Defaults to applied_lsn.
    StandbyStatusUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/StandbyReplicationSlotResponse"
