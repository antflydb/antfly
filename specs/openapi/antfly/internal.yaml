openapi: "3.0.3"
info:
  title: Antfly Internal API
  version: v1alpha1
  description: |
    Node-to-node internal API for Antfly runtime traffic.

    This API is separate from the public `/db/v1` API and from operator-facing
    `/admin/v1` control-plane operations. It is intended for trusted Antfly
    nodes in one deployment. Hot-standby WAL replication uses this surface for
    identity probes, slot bootstrap, WAL pulls, and standby progress updates.
servers:
  - url: /internal/v1
    description: Node-local internal API
tags:
  - name: remote-attempt-control
    description: Authenticated remote status and durable quiescence fencing.
  - name: standby-replication
    x-displayName: Hot Standby Replication
    description: Runtime-to-runtime hot-standby replication protocol.
paths:
  /attempt/status:
    post:
      tags: [remote-attempt-control]
      operationId: getRemoteAttemptStatus
      summary: Read signed remote attempt status
      description: |
        Requires X-Antfly-Trusted-Principal with a verified service JWT carrying
        the exact versioned remote-attempt context bound to POST, this path and
        the canonical two-byte body {}. Legacy unsigned migration is forbidden.
        Only identity content encoding and no query parameters are accepted.
        A 200 response is a 368-character version-1 hexadecimal signed reply.
        Verify its exact request binding and independently enrolled root key
        before reconciling capacity. HTTP errors never prove terminal ownership.
      parameters:
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Signed status or completed fence evidence.
          content:
            text/plain:
              schema:
                type: string
                minLength: 368
                maxLength: 368
                pattern: '^[0-9a-f]{368}$'
        "400":
          description: Invalid control request.
        "401":
          description: Signed service context required.
        "409":
          description: Fence pending; physical work still owns capacity. No acknowledgment.
        "415":
          description: Content encoding must be identity.
        "503":
          description: Control owner, recovery, membership or durability unavailable.
        "504":
          description: Original request deadline exceeded. No terminal evidence.
  /attempt/cancel:
    post:
      tags: [remote-attempt-control]
      operationId: cancelRemoteAttempt
      summary: Cancel one remote attempt and suppress delayed dispatch
      description: |
        Requires X-Antfly-Trusted-Principal with a verified service JWT carrying
        the exact versioned remote-attempt context bound to POST, this path and
        the canonical two-byte body {}. Legacy unsigned migration is forbidden.
        Only identity content encoding and no query parameters are accepted.
        A 200 response is a 368-character version-1 hexadecimal signed reply.
        Verify its exact request binding and independently enrolled root key
        before reconciling capacity. HTTP errors never prove terminal ownership.
        The operation owner explicitly abandons the exact attempt. A worker
        records a bounded tombstone if dispatch has not arrived, or signals
        cancellation while retaining every live resource. Only a signed terminal
        or higher quiescent generation reply permits capacity retirement.
      parameters:
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Signed status or completed fence evidence.
          content:
            text/plain:
              schema:
                type: string
                minLength: 368
                maxLength: 368
                pattern: '^[0-9a-f]{368}$'
        "400":
          description: Invalid control request.
        "401":
          description: Signed service context required.
        "409":
          description: Fence pending; physical work still owns capacity. No acknowledgment.
        "415":
          description: Content encoding must be identity.
        "503":
          description: Control owner, recovery, membership or durability unavailable.
        "504":
          description: Original request deadline exceeded. No terminal evidence.
  /attempt/fence:
    post:
      tags: [remote-attempt-control]
      operationId: fenceRemoteAttempts
      summary: Fence a coordinator generation after physical quiescence
      description: |
        Requires X-Antfly-Trusted-Principal with a verified service JWT carrying
        the exact versioned remote-attempt context bound to POST, this path and
        the canonical two-byte body {}. Legacy unsigned migration is forbidden.
        Only identity content encoding and no query parameters are accepted.
        A 200 response is a 368-character version-1 hexadecimal signed reply.
        Verify its exact request binding and independently enrolled root key
        before reconciling capacity. HTTP errors never prove terminal ownership.
      parameters:
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Signed status or completed fence evidence.
          content:
            text/plain:
              schema:
                type: string
                minLength: 368
                maxLength: 368
                pattern: '^[0-9a-f]{368}$'
        "400":
          description: Invalid control request.
        "401":
          description: Signed service context required.
        "409":
          description: Fence pending; physical work still owns capacity. No acknowledgment.
        "415":
          description: Content encoding must be identity.
        "503":
          description: Control owner, recovery, membership or durability unavailable.
        "504":
          description: Original request deadline exceeded. No terminal evidence.
  /attempt/capabilities:
    post:
      tags: [remote-attempt-control]
      operationId: getRemoteOwnedReadCapabilities
      summary: Probe signed owned-read support for an enrolled process
      description: |
        Requires a service JWT with AFAT capability context binding this exact
        path and a fresh 32-byte nonce. The 352-character hexadecimal AFAC v2
        reply binds the nonce, root and process reporter, and independent group
        query and retained-read family bits. Version 2 promises process-scoped
        owned endpoints; version 1 observations must not activate these routes.
        Discovery is not admission or evidence of retirement. Only identity
        content encoding and no query parameters are accepted.
      parameters:
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 32
              maxLength: 32
      responses:
        "200":
          description: Nonce-bound process capability observation, never retirement proof.
          content:
            text/plain:
              schema:
                type: string
                minLength: 352
                maxLength: 352
        "401":
          description: Service context is missing or invalid.
        "503":
          description: Discovery admission or protected capacity unavailable.
  /groups/{group_id}/tables/{table_name}/owned-query/{root_incarnation}/{reporter_incarnation}:
    post:
      tags: [remote-attempt-control]
      operationId: executeProcessOwnedGroupQuery
      summary: Execute a process-scoped owned read
      description: |
        Requires verified AFAT read context whose digest covers this entire URI
        and the versioned owned request body. The receiver must match the root
        and process reporter before any data admission or provider work. Legacy
        service credentials cannot select these endpoints, and no fallback to a
        legacy query route is permitted. A response never retires sender charges;
        only independently verified signed retirement evidence may do so.
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: uint64
        - in: path
          name: table_name
          required: true
          schema:
            type: string
        - in: path
          name: root_incarnation
          required: true
          description: Nonzero unsigned 128-bit root identity in decimal.
          schema:
            type: string
            maxLength: 39
        - in: path
          name: reporter_incarnation
          required: true
          schema:
            type: integer
            format: uint64
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Bounded owned read output; sender ownership is still retained.
        "400":
          description: Invalid owned envelope or route scope.
        "401":
          description: Verified read context is required.
        "503":
          description: Scope, recovery, scheduling or provider admission unavailable.
  /groups/{group_id}/tables/{table_name}/owned-retained-read/{root_incarnation}/{reporter_incarnation}:
    post:
      tags: [remote-attempt-control]
      operationId: executeProcessOwnedRetainedRead
      summary: Execute a process-scoped owned read
      description: |
        Requires verified AFAT read context whose digest covers this entire URI
        and the versioned owned request body. The receiver must match the root
        and process reporter before any data admission or provider work. Legacy
        service credentials cannot select these endpoints, and no fallback to a
        legacy query route is permitted. A response never retires sender charges;
        only independently verified signed retirement evidence may do so.
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
            format: uint64
        - in: path
          name: table_name
          required: true
          schema:
            type: string
        - in: path
          name: root_incarnation
          required: true
          description: Nonzero unsigned 128-bit root identity in decimal.
          schema:
            type: string
            maxLength: 39
        - in: path
          name: reporter_incarnation
          required: true
          schema:
            type: integer
            format: uint64
        - in: header
          name: X-Antfly-Trusted-Principal
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Bounded owned read output; sender ownership is still retained.
        "400":
          description: Invalid owned envelope or route scope.
        "401":
          description: Verified read context is required.
        "503":
          description: Scope, recovery, scheduling or provider admission unavailable.
  /standby/replication/identify:
    get:
      tags: [standby-replication]
      operationId: identifyHAReplicationSystem
      summary: Identify this primary replication system
      responses:
        "200":
          description: Primary identity and replication format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyIdentifySystemResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/slots:
    post:
      tags: [standby-replication]
      operationId: createHAReplicationStreamingSlot
      summary: Create or reserve a runtime replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyCreateReplicationSlotRequest"
      responses:
        "200":
          description: Created replication slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/start:
    post:
      tags: [standby-replication]
      operationId: startHAReplication
      summary: Pull ordered hot-standby replication records from a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStartReplicationRequest"
      responses:
        "200":
          description: Ordered replication records starting at the requested LSN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStartReplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/status:
    post:
      tags: [standby-replication]
      operationId: updateHAStandbyStatus
      summary: Report durable receive and apply progress for a standby slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStatusUpdateRequest"
      responses:
        "200":
          description: Persisted standby slot progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStatusUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  responses:
    BadRequest:
      description: Invalid internal replication request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Requested replication resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Node role or replication state does not allow the request.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    StandbyIdentifier:
      type: string
      description: Stable hot-standby node or slot identifier. Identifiers are 1-128 ASCII bytes and may contain letters, digits, `_`, `-`, `.`, and `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbySlotName:
      description: Stable standby replication slot name.
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:-]+$"
    StandbyIdentity:
      type: object
      required: [cluster_id, shard_id, table_id, timeline_id, epoch]
      properties:
        cluster_id:
          type: integer
          format: uint64
          minimum: 1
        shard_id:
          type: integer
          format: uint64
          minimum: 0
        table_id:
          type: integer
          format: uint64
          minimum: 0
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        epoch:
          type: integer
          format: uint64
          minimum: 1
    StandbyIdentifySystemResponse:
      type: object
      required: [identity, current_lsn, next_lsn, record_format_version]
      properties:
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
    StandbyCreateReplicationSlotRequest:
      type: object
      required: [slot_name]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        initial_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional LSN to initialize the slot at. Defaults to the current primary LSN.
    StandbyReplicationSlotResponse:
      type: object
      required:
        - slot_name
        - timeline_id
        - restart_lsn
        - received_lsn
        - applied_lsn
        - safe_read_lsn
        - active
        - reseed_required
        - current_lsn
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        restart_lsn:
          type: integer
          format: uint64
          minimum: 0
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
        active:
          type: boolean
        reseed_required:
          type: boolean
        last_error:
          type: string
          nullable: true
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
    StandbyStartReplicationRequest:
      type: object
      required: [slot_name, from_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        max_records:
          type: integer
          format: uint64
          minimum: 0
          description: Optional maximum record count. Zero means no record-count limit.
        max_encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Optional encoded byte budget. Zero means no byte limit.
    StandbyRecordKind:
      type: string
      enum:
        - batch-mutation
        - metadata-mutation
        - derived-effect
        - backup-start
        - backup-end
        - checkpoint
        - manifest
        - truncate
        - timeline-switch
    StandbyPayloadCodec:
      type: string
      enum: [raw, json, binary]
    StandbyReplicationFrame:
      type: object
      required: [lsn, kind, payload_codec, encoded]
      properties:
        lsn:
          type: integer
          format: uint64
          minimum: 1
        kind:
          $ref: "#/components/schemas/StandbyRecordKind"
        payload_codec:
          $ref: "#/components/schemas/StandbyPayloadCodec"
        encoded:
          type: string
          format: byte
          description: Base64-encoded complete replication record envelope.
    StandbyStartReplicationResponse:
      type: object
      required:
        - slot_name
        - identity
        - record_format_version
        - timeline_id
        - from_lsn
        - current_lsn
        - last_sent_lsn
        - next_lsn
        - end_of_wal
        - encoded_bytes
        - records
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        identity:
          $ref: "#/components/schemas/StandbyIdentity"
        record_format_version:
          type: integer
          format: uint32
          minimum: 1
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        from_lsn:
          type: integer
          format: uint64
          minimum: 1
        current_lsn:
          type: integer
          format: uint64
          minimum: 0
        last_sent_lsn:
          type: integer
          format: uint64
          minimum: 0
        next_lsn:
          type: integer
          format: uint64
          minimum: 1
        end_of_wal:
          type: boolean
        encoded_bytes:
          type: integer
          format: uint64
          minimum: 0
        records:
          type: array
          items:
            $ref: "#/components/schemas/StandbyReplicationFrame"
    StandbyStatusUpdateRequest:
      type: object
      required: [slot_name, timeline_id, received_lsn, applied_lsn]
      properties:
        slot_name:
          $ref: "#/components/schemas/StandbySlotName"
        timeline_id:
          type: integer
          format: uint64
          minimum: 1
        received_lsn:
          type: integer
          format: uint64
          minimum: 0
        applied_lsn:
          type: integer
          format: uint64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: uint64
          minimum: 0
          description: Optional safe-read boundary. Defaults to applied_lsn.
    StandbyStatusUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/StandbyReplicationSlotResponse"
