              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '422':
          description: The next retained event requires a larger explicit page budget.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '500':
          description: Corrupt retained page or an unclassified owner failure; never return partial rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '503':
