    NativeSourceRetirementReply:
      {"type":"object","additionalProperties":false,"description":"At most 16802816 bytes. Full-request SHA-256 correlation. Command may survive an ambiguous submission without known entry; outcome then must be null. Known entry requires exact command. Recovery preserves original command and entry. Unknown/superseded authorize no retry, source ACK, retention release or global outcome.","properties":{"version":{"type":"integer","enum":[1]},"request_digest":{"$ref":"#/components/schemas/NativeHistoryDigest"},"command":{"allOf":[{"$ref":"#/components/schemas/NativeSourceScopeAbortCommand"}],"nullable":true},"receipt":{"allOf":[{"$ref":"#/components/schemas/NativeHistoryPublicationCut"}],"nullable":true},"outcome":{"allOf":[{"$ref":"#/components/schemas/NativeSourceRetirementOutcome"}],"nullable":true}},"required":["version","request_digest"]}
    NativeSourceScopeAbortIntent:
      {"type":"object","additionalProperties":false,"description":"Private original-owner retirement intent. The receiving control owner must independently read the named coordinator through qualified ReadIndex; caller-supplied absence, a digest, or an outcome body is never abort authority.","properties":{"version":{"type":"integer","enum":[1]},"owner":{"$ref":"#/components/schemas/NativeHistoryPublicationOwner"},"coordinator":{"$ref":"#/components/schemas/NativeHistoryDecisionRequest"},"reference":{"$ref":"#/components/schemas/NativeSourceScopeReference"},"source_purpose":{"$ref":"#/components/schemas/NativeHistoryDigest"},"admission_digest":{"$ref":"#/components/schemas/NativeHistoryDigest"}},"required":["version","owner","coordinator","reference","source_purpose","admission_digest"]}
    NativeSourceScopeAbortCommand:
      {"type":"object","additionalProperties":false,"description":"Trusted ordered reducer command constructed only after an independent qualified coordinator read. Requires the retained original scoped ABORT and original participant membership. Never accept this command body as self-authenticating public or private HTTP evidence.","properties":{"version":{"type":"integer","enum":[1]},"intent":{"$ref":"#/components/schemas/NativeSourceScopeAbortIntent"},"observation":{"$ref":"#/components/schemas/NativeHistoryDecisionReply"}},"required":["version","intent","observation"]}
    NativeSourceScopeAbortReply:
