    NativeHistoryApplied:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumer",
            "nullable": true
          },
          "reclaimed_frames": {
