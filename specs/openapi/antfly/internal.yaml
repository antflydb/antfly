    NativeSourceScopeControlRequest:
      {"type":"object","additionalProperties":false,"description":"Private lifecycle RPC contract, at most 16 KiB. A fresh nonzero request_id correlates one RPC attempt and grants no replay or transaction outcome authority. submit requires intent and null/absent recovery; the receiving leader independently captures fresh signed metadata authority. recover requires recovery and null/absent intent, and only reads the exact prior command/entry. Caller metadata cuts are never accepted as new-write authorization. First strict activation remains gated on independently proven legacy-worker handover.","properties":{"version":{"type":"integer","enum":[1]},"request_id":{"$ref":"#/components/schemas/NativeHistoryConsumerId"},"operation":{"type":"string","enum":["submit","recover"]},"intent":{"allOf":[{"$ref":"#/components/schemas/NativeSourceScopeControlIntent"}],"nullable":true},"recovery":{"allOf":[{"$ref":"#/components/schemas/NativeSourceScopeRecovery"}],"nullable":true}},"required":["version","request_id","operation"]}
    NativeSourceScopeControlReply:
      {"type":"object","additionalProperties":false,"description":"Private correlated reply, at most 24 KiB. request_digest binds the entire request including request_id and operation. An unknown submit may have null command/receipt/outcome; never replay from that state. Every known accepted entry carries both its exact freshly captured command and positive receipt, even if outcome is null. Recovery preserves its exact original command and entry; changing the metadata cut is not recovery. A superseded receipt confirms neither success nor failure. A known rejection is not an applied effect. Applied evidence must match command, action, physical owner and actual ordered cut. One root receipt proves no all-owner fencing or row transaction outcome.","properties":{"version":{"type":"integer","enum":[1]},"request_digest":{"$ref":"#/components/schemas/NativeHistoryDigest"},"command":{"allOf":[{"$ref":"#/components/schemas/NativeSourceScopeControlCommand"}],"nullable":true},"receipt":{"allOf":[{"$ref":"#/components/schemas/NativeHistoryPublicationCut"}],"nullable":true},"outcome":{"allOf":[{"$ref":"#/components/schemas/NativeSourceScopeOutcome"}],"nullable":true}},"required":["version","request_digest"]}
    NativeSourceRetirementRecovery:
