components:
  securitySchemes:
    InternalServicePrincipal:
      type: apiKey
      in: header
      name: X-Antfly-Trusted-Principal
      description: Deployment-scoped authenticated service-principal envelope; an ordinary user credential cannot authorize this operation.
  responses:
    BadRequest:
      description: Invalid internal replication request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Requested replication resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Node role or replication state does not allow the request.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    NativeSourcePlanRoot:
