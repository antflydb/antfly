openapi: "3.0.3"
info:
  title: Antfly Internal API
  version: v1alpha1
  description: |
    Node-to-node internal API for Antfly runtime traffic.

    This API is separate from the public `/db/v1` API and from operator-facing
    `/admin/v1` control-plane operations. It is intended for trusted Antfly
    nodes in one deployment. Hot-standby WAL replication uses this surface for
    identity probes, slot bootstrap, WAL pulls, and standby progress updates.
servers:
  - url: /internal/v1
    description: Node-local internal API
tags:
  - name: retained-history
    description: Private native retained-history ownership and receipt recovery.
  - name: standby-replication
    x-displayName: Hot Standby Replication
    description: Runtime-to-runtime hot-standby replication protocol.
paths:
  /groups/{group_id}/tables/{table_name}/history/grant-v1:
    post:
      tags: [retained-history]
      operationId: observeNativeRetainedHistoryGrant
      summary: Observe retained consumer admission without proposing a command
      description: |
        Signed service-only read, including during legacy migration. Requires an
        immutable catalog route fence. The owner establishes a current leader
        ReadIndex and validates its frozen owner/route before and after reading.
        Returns actual authority/floor/lease state at that cut without binding,
        enrollment, renewal, ACK, collection or receipt mutation. Unbound/absent
        are observations, not reservations or proof that an in-flight command
        can never commit. An observation is never a command receipt or ACK grant.
        Responses bind the exact identity to the private raft read contract
        (wire version 1, raft authority, minimum applied index 1); the receiver
        internally requires the stronger current ReadIndex cut.
        Request and response bodies are each limited to 4096 bytes.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryGrantRequest'}
      responses:
        '200':
          description: Request-bound current grant observation, never a mutation confirmation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope, consumer policy or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt observation or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
  /groups/{group_id}/tables/{table_name}/history/page-v1:
    post:
      tags: [retained-history]
      operationId: readNativeRetainedHistoryPage
      summary: Read one bounded retained native frame page
      description: |
        Trusted node-to-node read, requiring signed service authority even in
        legacy migration mode and an immutable catalog route fence. The owner
        obtains ReadIndex and validates the current leader and route before and
        after reading the native history transaction. This operation neither
        acknowledges history nor certifies a distributed transaction's outcome.
        Binary HPG1 binds namespace, consumer/grant, position, timestamp and all
        page budgets to the response metadata and historical tuple images.
        The response is at most 96 + request.max_bytes bytes. A page never
        substitutes current rows for retained before/after images. These private
        positions are not public changefeed cursors or PostgreSQL LSNs.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryPageRequest'}
      responses:
        '200':
          description: Request-bound HPG1 binary page; returning a page never advances retention.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          description: Invalid request, bounds or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '401':
          description: Missing or invalid service authority.
        '403':
          description: The authenticated principal is not an internal service.
        '409':
          description: Topology changed or the retained scope requires resynchronization; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '422':
          description: The next retained event requires a larger explicit page budget.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '500':
          description: Corrupt retained page or an unclassified owner failure; never return partial rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
  /groups/{group_id}/tables/{table_name}/history/control-v1:
    post:
      tags: [retained-history]
      operationId: controlNativeRetainedHistory
      summary: Submit a native retention control or recover its exact result
      description: |
        Trusted node-to-node operation, bounded to 4096 request and response bytes.
        Requires a service principal and an immutable catalog route fence. Submit
        and recovery are distinct; recovery never proposes the command again.
        A 200 response is not permission to ACK: null or superseded outcomes are
        unconfirmed, and a known rejection is not a successful mutation. A lost
        response is ambiguous and must not cause automatic re-proposal.
        These private Raft receipts are not public feed cursors or PostgreSQL LSNs.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          description: Serialized immutable catalog route fence, including metadata and table incarnation and exact group/range identity. The receiver validates it against current authoritative routing.
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryControlRequest'}
      responses:
        '200':
          description: Bounded typed result; inspect receipt and outcome before advancing any progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryControlResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid internal service authority.
        '403':
          description: The authenticated principal is not an internal service.
        '409':
          description: Route, table incarnation, history scope or original receipt conflicts.
        '413':
          description: Request exceeds the private control byte limit.
        '501':
          description: This serving profile does not support native retained-history controls.
        '503':
          description: Leader, routing or storage admission is temporarily unavailable; admission outcome headers distinguish known not-proposed from ambiguous outcomes.
  /standby/replication/identify:
    get:
      tags: [standby-replication]
      operationId: identifyHAReplicationSystem
      summary: Identify this primary replication system
      responses:
        "200":
          description: Primary identity and replication format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyIdentifySystemResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/slots:
    post:
      tags: [standby-replication]
      operationId: createHAReplicationStreamingSlot
      summary: Create or reserve a runtime replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyCreateReplicationSlotRequest"
      responses:
        "200":
          description: Created replication slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/start:
    post:
      tags: [standby-replication]
      operationId: startHAReplication
      summary: Pull ordered hot-standby replication records from a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStartReplicationRequest"
      responses:
        "200":
          description: Ordered replication records starting at the requested LSN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStartReplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/status:
    post:
      tags: [standby-replication]
      operationId: updateHAStandbyStatus
      summary: Report durable receive and apply progress for a standby slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStatusUpdateRequest"
      responses:
        "200":
          description: Persisted standby slot progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStatusUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    InternalServicePrincipal:
      type: apiKey
      in: header
      name: X-Antfly-Trusted-Principal
      description: Deployment-scoped authenticated service-principal envelope; an ordinary user credential cannot authorize this operation.
  responses:
    BadRequest:
      description: Invalid internal replication request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Requested replication resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Node role or replication state does not allow the request.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    NativeHistoryGrantIdentity:
      {"type":"object","additionalProperties":false,"properties":{"namespace":{"$ref":"#/components/schemas/NativeHistoryNamespace"},"authority":{"$ref":"#/components/schemas/NativeHistoryDigest"},"consumer":{"$ref":"#/components/schemas/NativeHistoryConsumerId"},"definition":{"$ref":"#/components/schemas/NativeHistoryDigest"},"sequence":{"type":"integer","format":"uint64","minimum":1},"policy_revision":{"type":"integer","format":"uint64","minimum":1}},"required":["namespace","authority","consumer","definition","sequence","policy_revision"]}
    NativeHistoryGrantActive:
      {"type":"object","additionalProperties":false,"properties":{"grant":{"type":"integer","format":"uint64","minimum":1},"consumer":{"$ref":"#/components/schemas/NativeHistoryConsumer"},"limit":{"type":"integer","format":"uint64","minimum":1}},"required":["grant","consumer","limit"]}
    NativeHistoryGrantObservation:
      {"oneOf":[{"type":"object","additionalProperties":false,"properties":{"unbound":{"type":"object","additionalProperties":false,"properties":{},"required":[]}},"required":["unbound"]},{"type":"object","additionalProperties":false,"properties":{"absent":{"type":"integer","format":"uint64","minimum":0}},"required":["absent"]},{"type":"object","additionalProperties":false,"properties":{"retired":{"type":"integer","format":"uint64","minimum":0}},"required":["retired"]},{"type":"object","additionalProperties":false,"properties":{"active":{"$ref":"#/components/schemas/NativeHistoryGrantActive"}},"required":["active"]},{"type":"object","additionalProperties":false,"properties":{"other_grant":{"$ref":"#/components/schemas/NativeHistoryGrantActive"}},"required":["other_grant"]}],"description":"Active requires the exact requested grant. Other_grant is not confirmation of it. Absent floor is below the requested sequence; retired floor is at or above it."}
    NativeHistoryGrantRequest:
      {"type":"object","additionalProperties":false,"properties":{"version":{"type":"integer","enum":[1]},"identity":{"$ref":"#/components/schemas/NativeHistoryGrantIdentity"}},"required":["version","identity"]}
    NativeHistoryGrantReply:
      {"type":"object","additionalProperties":false,"properties":{"version":{"type":"integer","enum":[1]},"request_digest":{"$ref":"#/components/schemas/NativeHistoryDigest"},"observation":{"$ref":"#/components/schemas/NativeHistoryGrantObservation"}},"required":["version","request_digest","observation"]}
    NativeHistoryGrantError:
      {"type":"object","additionalProperties":false,"properties":{"version":{"type":"integer","enum":[1]},"code":{"type":"string","enum":["invalid_request","resynchronization_required","consumer_conflict","topology_changed","unsupported","unavailable","corrupt_observation","internal_error"]}},"required":["version","code"]}
    NativeHistoryPosition:
      {"type":"object","additionalProperties":false,"required":["sequence","event"],"properties":{"sequence":{"type":"integer","format":"uint64","minimum":0},"event":{"type":"integer","format":"uint32","minimum":0}}}
    NativeHistoryPageRead:
      {"type":"object","additionalProperties":false,"required":["reference","after","now_seconds"],"properties":{"reference":{"$ref":"#/components/schemas/NativeHistoryReference"},"after":{"$ref":"#/components/schemas/NativeHistoryPosition"},"now_seconds":{"type":"integer","format":"uint64","minimum":1},"max_events":{"type":"integer","format":"uint32","minimum":1,"maximum":1024,"default":256},"max_bytes":{"type":"integer","format":"uint32","minimum":1,"maximum":268435456,"default":1048576}}}
    NativeHistoryPageRequest:
      {"type":"object","additionalProperties":false,"required":["version","request"],"properties":{"version":{"type":"integer","enum":[1]},"request":{"$ref":"#/components/schemas/NativeHistoryPageRead"}},"description":"At most 4096 bytes; version is mandatory; reject unknown and duplicate fields. Reference namespace must equal the catalog fence namespace."}
    NativeHistoryPageError:
      {"type":"object","additionalProperties":false,"required":["version","code"],"properties":{"version":{"type":"integer","enum":[1]},"code":{"type":"string","enum":["invalid_request","resynchronization_required","topology_changed","page_budget_exceeded","unsupported","unavailable","corrupt_page","internal_error"]}}}
    NativeHistoryNamespace:
      {
        "type": "array",
        "minItems": 24,
        "maxItems": 24,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryDigest:
      {
        "type": "array",
        "minItems": 32,
        "maxItems": 32,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryConsumerId:
      {
        "type": "array",
        "minItems": 16,
        "maxItems": 16,
        "items": {
          "type": "integer",
          "minimum": 0,
          "maximum": 255
        }
      }
    NativeHistoryReceipt:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "term",
          "index"
        ],
        "properties": {
          "term": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "index": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryReference:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "epoch",
          "grant"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "epoch": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "grant": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryGrant:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "sequence",
          "expires_at_seconds",
          "policy_revision"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "sequence": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "expires_at_seconds": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "policy_revision": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "limit": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1,
            "default": 268435456
          }
        }
      }
    NativeHistoryRetirement:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority",
          "consumer",
          "definition",
          "sequence",
          "grant"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "consumer": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "definition": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "sequence": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "grant": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryAcknowledge:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference",
          "previous",
          "next"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "previous": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "next": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          }
        }
      }
    NativeHistoryRenew:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference",
          "previous",
          "next"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "previous": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "next": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
      }
    NativeHistoryReclaim:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reference"
        ],
        "properties": {
          "reference": {
            "$ref": "#/components/schemas/NativeHistoryReference"
          },
          "max_frames": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32,
            "default": 1
          }
        }
      }
    NativeHistoryCollect:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "namespace",
          "authority"
        ],
        "properties": {
          "namespace": {
            "$ref": "#/components/schemas/NativeHistoryNamespace"
          },
          "authority": {
            "$ref": "#/components/schemas/NativeHistoryDigest"
          },
          "max_frames": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32,
            "default": 1
          }
        }
      }
    NativeHistoryControlCommand:
      {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "enroll"
            ],
            "properties": {
              "enroll": {
                "$ref": "#/components/schemas/NativeHistoryGrant"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "inspect"
            ],
            "properties": {
              "inspect": {
                "$ref": "#/components/schemas/NativeHistoryReference"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "acknowledge"
            ],
            "properties": {
              "acknowledge": {
                "$ref": "#/components/schemas/NativeHistoryAcknowledge"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "renew"
            ],
            "properties": {
              "renew": {
                "$ref": "#/components/schemas/NativeHistoryRenew"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "retire"
            ],
            "properties": {
              "retire": {
                "$ref": "#/components/schemas/NativeHistoryRetirement"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "reclaim"
            ],
            "properties": {
              "reclaim": {
