      operationId: readNativeHistoryCoordinatorDecision
      summary: Read the retained coordinator decision and original participant admission
      description: |
        Signed service-only read, including during legacy migration. Reads the
        coordinator record and retained admission v3 from one native snapshot
        after ReadIndex, under the complete original physical owner and catalog
        route fence. Validates the owner and quorum before and after the read.
        The reply binds the request and actual persisted native cut and owns all
        retained original participant identities. A null decision is unproven
        absence; pending and aborted records cannot yield a committed manifest.
        The read cannot authorize replay, presume-abort, checkpoint advancement
        or retention release. One original relative deadline bounds all work.
        Requests are limited to 4096 bytes and replies to 16781312 bytes.
        Membership and record metadata are private service information.
