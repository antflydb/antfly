openapi: "3.0.3"
info:
  title: Antfly Internal API
  version: v1alpha1
  description: |
    Node-to-node internal API for Antfly runtime traffic.

    This API is separate from the public `/db/v1` API and from operator-facing
    `/admin/v1` control-plane operations. It is intended for trusted Antfly
    nodes in one deployment. Hot-standby WAL replication uses this surface for
    identity probes, slot bootstrap, WAL pulls, and standby progress updates.
servers:
  - url: /internal/v1
    description: Node-local internal API
tags:
  - name: retained-history
    description: Private native retained-history ownership and receipt recovery.
  - name: standby-replication
    x-displayName: Hot Standby Replication
    description: Runtime-to-runtime hot-standby replication protocol.
paths:
  /catalog/changefeed-state-v1:
    post:
      tags: [retained-history]
      operationId: accessInternalChangefeedState
      summary: Read or mutate durable private changefeed ownership state
      description: |
        Signed service-only metadata capability, including during migration.
        Never expose this operation as a public feed API. Reads and authority
        discovery establish a linearizable metadata barrier. Mutations preserve
        the state machine's revision, owner epoch and authority fences and are
        attempted at most once. An uncertain response cannot certify non-commit;
        reconcile by reading durable state before making another decision.
        The routing remaining-time header carries one shared relative budget.
        Bodies are limited to 50335744 bytes to accommodate JSON escaping of an
        encoded state or write of at most 8388608 bytes. Unknown fields, mixed
        action fields and unsupported wire versions are rejected before dispatch.
      security:
        - InternalServicePrincipal: []
      parameters:
        - in: header
          name: X-Antfly-Routing-Remaining-Ms
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InternalChangefeedStateRequest'}
      responses:
        '200':
          description: Action-bound result; a mutation reply confirms durable success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InternalChangefeedStateReply'}
        '400': {description: Invalid bounded request}
        '403': {description: Authenticated service required}
        '409': {description: Known revision or authority conflict}
        '413': {description: Request exceeds wire bounds}
        '503':
          description: Unavailable or uncertain mutation; inspect the outcome header
          headers:
            X-Antfly-Raft-Mutation-Outcome:
              schema: {type: string, enum: [not-proposed-v1, not-applied-v1, unknown-v1, committed-v1]}
        '504': {description: Shared deadline exhausted; mutation may have committed}
  /groups/{group_id}/tables/{table_name}/history/decision-v1:
    post:
      tags: [retained-history]
      operationId: readNativeHistoryCoordinatorDecision
      summary: Read the retained coordinator decision and original participant admission
      description: |
        Signed service-only read, including during legacy migration. Reads the
        coordinator record and retained admission v3 from one native snapshot
        after ReadIndex, under the complete original physical owner and catalog
        route fence. Validates the owner and quorum before and after the read.
        The reply binds the request and actual persisted native cut and owns all
        retained original participant identities. A null decision is unproven
        absence; pending and aborted records cannot yield a committed manifest.
        The read cannot authorize replay, presume-abort, checkpoint advancement
        or retention release. One original relative deadline bounds all work.
        Requests are limited to 4096 bytes and replies to 16781312 bytes.
        Membership and record metadata are private service information.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
        - name: X-Antfly-Catalog-Route-Deadline-Ms
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryDecisionRequest'}
      responses:
        '200':
          description: Request-bound coordinator record, original admission and actual native cut.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt history or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryDecisionError'}
  /groups/{group_id}/tables/{table_name}/history/owner-v1:
    post:
      tags: [retained-history]
      operationId: captureNativeHistoryOwner
      summary: Qualify the current native history participant owner
      description: |
        Signed service-only bounded read, including during legacy migration.
        Captures the current participant owner under the original catalog route
        fence and expected table binding, establishes ReadIndex, and qualifies
        retained committed history at an actual positive persisted native cut.
        Validates owner and catalog identity before and after the read. The
        observation binds the returned owner and minimum applied index of one.
        Qualification does not reserve retention, vote, accept a transaction,
        advance a source checkpoint, or authorize replay. One shared routing
        deadline bounds all work. Request and response are limited to 4096 bytes.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
        - name: X-Antfly-Catalog-Route-Deadline-Ms
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryOwnerRequest'}
      responses:
        '200':
          description: Qualified current owner and request-bound actual native storage cut.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryOwnerReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt history or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
  /groups/{group_id}/tables/{table_name}/history/publication-v1:
    post:
      tags: [retained-history]
      operationId: readNativeTransactionCompletionPublication
      summary: Read retained complete-certificate publication at its original owner
      description: |
        Signed service-only read, including during legacy migration. Requires the
        complete original owner context, an immutable catalog route fence and one
        shared relative routing budget. The serving owner establishes ReadIndex
        and validates frozen owner/catalog identity before and after the native
        snapshot read. Replies bind the exact logical request and actual persisted
        cut, and retain the certificate's immutable first publication position.
        A null publication is unproven absence and cannot authorize effect replay,
        checkpoint advancement or retention release. This read does not mutate
        publication, consumer state or the applied marker. Both bodies are bounded
        to 4096 bytes. Independent GC still requires its retention authorization.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
        - name: X-Antfly-Catalog-Route-Deadline-Ms
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryPublicationRequest'}
      responses:
        '200':
          description: Request-bound local resolution and actual storage cut; null is unproven absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt receipt or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPublicationError'}
  /groups/{group_id}/tables/{table_name}/history/resolution-v1:
    post:
      tags: [retained-history]
      operationId: readNativeTransactionCompletionResolution
      summary: Read an immutable participant completion receipt at a qualified cut
      description: |
        Signed service-only read, including during legacy migration. Requires an
        immutable catalog route fence and one shared relative routing budget.
        The owner establishes a current leader ReadIndex and validates frozen
        owner and catalog identity before and after reading the receipt and
        persisted applied cut in one storage snapshot. Replies bind the exact
        logical request, retaining the actual observed cut. The original owner
        fence identifies the frozen transaction participant, not today's leader.
        A null resolution is unproven absence, never a zero-effect certificate
        or permission to replay an uncertain mutation. A positive resolution
        authenticates local effects or positive no-effect evidence; it does not
        certify global completion without every frozen manifest participant.
        HTTP accepts only raft authority, a positive minimum_applied_index and
        minimum_native_sequence zero. Both bodies are limited to 4096 bytes.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
        - name: X-Antfly-Catalog-Route-Deadline-Ms
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryResolutionRequest'}
      responses:
        '200':
          description: Request-bound local resolution and actual storage cut; null is unproven absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt receipt or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryResolutionError'}
  /groups/{group_id}/tables/{table_name}/history/grant-v1:
    post:
      tags: [retained-history]
      operationId: observeNativeRetainedHistoryGrant
      summary: Observe retained consumer admission without proposing a command
      description: |
        Signed service-only read, including during legacy migration. Requires an
        immutable catalog route fence. The owner establishes a current leader
        ReadIndex and validates its frozen owner/route before and after reading.
        Returns actual authority/floor/lease state at that cut without binding,
        enrollment, renewal, ACK, collection or receipt mutation. Unbound/absent
        are observations, not reservations or proof that an in-flight command
        can never commit. An observation is never a command receipt or ACK grant.
        Responses bind the exact identity to the private raft read contract
        (wire version 1, raft authority, minimum applied index 1); the receiver
        internally requires the stronger current ReadIndex cut.
        Request and response bodies are each limited to 4096 bytes.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryGrantRequest'}
      responses:
        '200':
          description: Request-bound current grant observation, never a mutation confirmation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantReply'}
        '400':
          description: Invalid request or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '401':
          description: Missing or invalid signed service authority.
        '403':
          description: Internal service authority required.
        '409':
          description: Retention scope, consumer policy or topology conflicts; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '500':
          description: Corrupt observation or internal owner failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryGrantError'}
  /groups/{group_id}/tables/{table_name}/history/page-v1:
    post:
      tags: [retained-history]
      operationId: readNativeRetainedHistoryPage
      summary: Read one bounded retained native frame page
      description: |
        Trusted node-to-node read, requiring signed service authority even in
        legacy migration mode and an immutable catalog route fence. The owner
        obtains ReadIndex and validates the current leader and route before and
        after reading the native history transaction. This operation neither
        acknowledges history nor certifies a distributed transaction's outcome.
        Binary HPG1 binds namespace, consumer/grant, position, timestamp and all
        page budgets to the response metadata and historical tuple images.
        The response is at most 96 + request.max_bytes bytes. A page never
        substitutes current rows for retained before/after images. These private
        positions are not public changefeed cursors or PostgreSQL LSNs.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryPageRequest'}
      responses:
        '200':
          description: Request-bound HPG1 binary page; returning a page never advances retention.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          description: Invalid request, bounds or catalog fence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '401':
          description: Missing or invalid service authority.
        '403':
          description: The authenticated principal is not an internal service.
        '409':
          description: Topology changed or the retained scope requires resynchronization; inspect the typed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '413':
          description: Request exceeds the 4096 byte admission limit.
        '422':
          description: The next retained event requires a larger explicit page budget.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '500':
          description: Corrupt retained page or an unclassified owner failure; never return partial rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '501':
          description: Unsupported native owner profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
        '503':
          description: Leader, routing, deadline or storage admission is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryPageError'}
  /groups/{group_id}/tables/{table_name}/history/control-v1:
    post:
      tags: [retained-history]
      operationId: controlNativeRetainedHistory
      summary: Submit a native retention control or recover its exact result
      description: |
        Trusted node-to-node operation, bounded to 4096 request and response bytes.
        Requires a service principal and an immutable catalog route fence. Submit
        and recovery are distinct; recovery never proposes the command again.
        A 200 response is not permission to ACK: null or superseded outcomes are
        unconfirmed, and a known rejection is not a successful mutation. A lost
        response is ambiguous and must not cause automatic re-proposal.
        These private Raft receipts are not public feed cursors or PostgreSQL LSNs.
      security:
        - InternalServicePrincipal: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer, format: uint64, minimum: 1}
        - name: table_name
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 1024}
        - name: X-Antfly-Catalog-Route-Fence
          in: header
          required: true
          description: Serialized immutable catalog route fence, including metadata and table incarnation and exact group/range identity. The receiver validates it against current authoritative routing.
          schema: {type: string, minLength: 1, maxLength: 16384}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeHistoryControlRequest'}
      responses:
        '200':
          description: Bounded typed result; inspect receipt and outcome before advancing any progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeHistoryControlResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid internal service authority.
        '403':
          description: The authenticated principal is not an internal service.
        '409':
          description: Route, table incarnation, history scope or original receipt conflicts.
        '413':
          description: Request exceeds the private control byte limit.
        '501':
          description: This serving profile does not support native retained-history controls.
        '503':
          description: Leader, routing or storage admission is temporarily unavailable; admission outcome headers distinguish known not-proposed from ambiguous outcomes.
  /standby/replication/identify:
    get:
      tags: [standby-replication]
      operationId: identifyHAReplicationSystem
      summary: Identify this primary replication system
      responses:
        "200":
          description: Primary identity and replication format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyIdentifySystemResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/slots:
    post:
      tags: [standby-replication]
      operationId: createHAReplicationStreamingSlot
      summary: Create or reserve a runtime replication slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyCreateReplicationSlotRequest"
      responses:
        "200":
          description: Created replication slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyReplicationSlotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/start:
    post:
      tags: [standby-replication]
      operationId: startHAReplication
      summary: Pull ordered hot-standby replication records from a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStartReplicationRequest"
      responses:
        "200":
          description: Ordered replication records starting at the requested LSN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStartReplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /standby/replication/status:
    post:
      tags: [standby-replication]
      operationId: updateHAStandbyStatus
      summary: Report durable receive and apply progress for a standby slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandbyStatusUpdateRequest"
      responses:
        "200":
          description: Persisted standby slot progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandbyStatusUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    InternalServicePrincipal:
      type: apiKey
      in: header
      name: X-Antfly-Trusted-Principal
      description: Deployment-scoped authenticated service-principal envelope; an ordinary user credential cannot authorize this operation.
  responses:
    BadRequest:
      description: Invalid internal replication request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Requested replication resource was not found.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Node role or replication state does not allow the request.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    InternalChangefeedStateRequest:
      type: object
      additionalProperties: false
      required: [version, action, metadata_group_id, metadata_incarnation]
      properties:
        version: {type: integer, enum: [1]}
        action: {type: string, enum: [read, authority, mutate]}
        metadata_group_id: {type: integer, minimum: 1}
        metadata_incarnation:
          type: string
          minLength: 32
          maxLength: 32
          description: Expected immutable metadata cluster identity; checked before dispatch
        id:
          type: array
          minItems: 16
          maxItems: 16
          items: {type: integer, minimum: 0, maximum: 255}
          description: Required only for read; immutable feed ID
        write:
          type: string
          maxLength: 8388608
          description: Required only for mutate; exact encoded private revision-fenced write
    InternalChangefeedStateReply:
      type: object
      additionalProperties: false
      required: [version, action, metadata_group_id, metadata_incarnation]
      properties:
        version: {type: integer, enum: [1]}
        action: {type: string, enum: [read, authority, mutate]}
        metadata_group_id: {type: integer, minimum: 1}
        metadata_incarnation: {type: string, minLength: 32, maxLength: 32}
        id:
          type: array
          minItems: 16
          maxItems: 16
          items: {type: integer, minimum: 0, maximum: 255}
        state:
          type: string
          maxLength: 8388608
          description: Exact validated state envelope, present only for read
        authority:
          type: object
          additionalProperties: false
          required: [incarnation, sequence]
          description: Present only for authority; omitted before first feed mutation
          properties:
            incarnation:
              type: array
              minItems: 32
              maxItems: 32
              items: {type: integer, minimum: 0, maximum: 255}
            sequence: {type: integer, minimum: 1}
