    NativeHistoryConsumer:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "epoch",
          "start",
          "acknowledged",
          "expires_at_seconds",
          "policy_revision"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/NativeHistoryConsumerId"
          },
          "epoch": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "start": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "acknowledged": {
            "type": "integer",
            "format": "uint64",
            "minimum": 0
          },
          "expires_at_seconds": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          },
          "policy_revision": {
            "type": "integer",
            "format": "uint64",
            "minimum": 1
          }
        }
