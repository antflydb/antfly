openapi: "3.0.3"
info:
  title: Antfly Internal API
  version: v1alpha1
  description: |
    Node-to-node internal API for Antfly runtime traffic.

    This API is separate from the public `/db/v1` API and from operator-facing
    `/admin/v1` control-plane operations. It is intended for trusted Antfly
    nodes in one deployment. Hot-standby WAL replication uses this surface for
    identity probes, slot bootstrap, WAL pulls, and standby progress updates.
servers:
  - url: /internal/v1
    description: Node-local internal API
tags:
  - name: source-metadata-recovery
    description: Private qualified metadata source lifecycle observations.
  - name: source-plan-staging
    description: Private frozen-input ownership, bounded native staging and recovery.
  - name: retained-history
    description: Private native retained-history ownership and receipt recovery.
  - name: standby-replication
    x-displayName: Hot Standby Replication
    description: Runtime-to-runtime hot-standby replication protocol.
paths:
  /catalog/source-scope-capture-v1:
    {"post":{"tags":["source-metadata-recovery"],"operationId":"captureNativeSourceMetadataScope","summary":"Capture a native source lifecycle through metadata ReadIndex","description":"Private metadata-node endpoint, bounded to 2 KiB request and 8 KiB reply. Authenticated service credentials remain mandatory in migration mode. Requires a shared remaining routing budget. The metadata service obtains ReadIndex, reads actor/configuration/authority at one applied snapshot, and revalidates cluster identity. Reply correlation, an acknowledgement header and numeric cuts do not independently create binding, retirement, legacy-drain or transaction-outcome authority. Read retries share one bounded deadline and cannot propose a mutation.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"X-Antfly-Routing-Remaining-Ms","in":"header","required":true,"schema":{"type":"integer","minimum":1,"maximum":5000}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceMetadataCaptureRequest"}}}},"responses":{"200":{"description":"Qualified correlated snapshot; validate the binding and lifecycle phase before using it.","headers":{"X-Antfly-Source-Scope-Capture":{"required":true,"schema":{"type":"string","enum":["read-index-v1"]}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceMetadataCaptureReply"}}}},"400":{"description":"Invalid query or routing budget.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid service credential.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Internal service authority required.","content":{"text/plain":{"schema":{"type":"string"}}}},"408":{"description":"Capture cancelled; no snapshot returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Metadata incarnation or source binding changed.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 2 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt or inconsistent captured state.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Metadata leader, readiness or source authority unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}},"504":{"description":"Shared deadline exhausted; no snapshot returned.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-plan/control-v1:
    {"post":{"tags":["source-plan-staging"],"operationId":"controlNativeSourcePlan","summary":"Stage or retire a frozen source plan","description":"Trusted node-to-node operation, bounded to 2 MiB request JSON. Requires an internal service principal and an independently validated immutable catalog route fence. Submit requires durable all-applying-member protocol floor 36. Effects or deterministic rejection commit with the ordinary Raft marker. Recovery is a separate read-only operation. A successful HTTP status is not proof of input ownership or permission to advance a source checkpoint. Ambiguous responses never authorize mutation retry.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanControlRequest"}}}},"responses":{"200":{"description":"Bounded typed response; validate request binding and evidence before advancing progress.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanControlReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, upload or receipt conflicts, or input was fenced/reclaimed.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 2 MiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-retirement/control-v1:
    {"post":{"tags":["source-retirement"],"operationId":"controlNativeSourceRetirement","summary":"Submit coordinator-authorized source retirement intent or recover its exact receipt","description":"Private authenticated internal-service RPC. Submit accepts only an original intent and coordinator locator; the leader independently obtains fresh qualified coordinator ReadIndex evidence for resolved positive ABORT before activated data profile 41 proposal. Caller observations are accepted only for exact read-only recovery. Request limit 16798720 bytes; reply limit 16802816 bytes includes the bounded original admission. Every reply correlates the full request and nonce. Ambiguous submissions preserve any known exact command and entry, with null outcome; never blindly retry. Local fencing proves no global source ACK, publication, or all-owner retirement.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceRetirementRequest"}}}},"responses":{"200":{"description":"Correlated result; validate the exact request, owner, command and receipt. A known rejection is not application. An outcome-unknown marker clears confirmation but must preserve any valid known command/receipt.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceRetirementReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 16798720 bytes.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-scope/control-v1:
    {"post":{"tags":["source-scope-control"],"operationId":"controlNativeSourceScope","summary":"Submit a metadata-authorized lifecycle intent or recover its exact receipt","description":"Private authenticated service RPC. Request JSON is bounded to 16 KiB and reply JSON to 24 KiB. Submit accepts only an intent and fresh request_id; the leader independently captures signed ReadIndex metadata authority and uses activated data profile 40. Recovery is read-only, preserves the exact original command/entry and honors minimum_applied_index; it never reauthorizes or resubmits. Known accepted responses preserve the captured command and receipt even when outcome is unknown. Superseded or unknown results authorize no blind transport replay, row transaction outcome or all-owner fencing. First strict activation still requires independently proven legacy-worker handover.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceScopeControlRequest"}}}},"responses":{"200":{"description":"Correlated result; validate the exact request, owner, command and receipt. A known rejection is not application. An outcome-unknown marker clears confirmation but must preserve any valid known command/receipt.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceScopeControlReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 16 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-producers/legacy-inventory-v1:
    {"post":{"tags":["source-producer-control"],"operationId":"readNativeLegacyInventory","summary":"Read bounded original legacy work at a qualified physical cut","description":"Private authenticated RPC. Request limit 8192 bytes; reply limit 270336 bytes. Requires complete catalog and physical owner fencing plus a fresh nonzero request_id. Fresh frozen quorum ReadIndex precedes one native snapshot of authority, applied marker, immutable closure and canonical transaction records. Inspect at most 256 records and 1 MiB of record data per page; omitted ordinary/scoped/resolved records consume credit. Resume after the last inspected ID. Reply digest binds nonce, cursor, owner, record bound and minimum cut. Pages may observe different cuts. Empty/reached_end is not a coherent all-record/all-root drainage certificate. Chooses no pending decision, appends no command, and authorizes no strict activation, source ACK or retention release.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeLegacyInventoryRequest"}}}},"responses":{"200":{"description":"Correlated bounded page. Validate digest, owner, closure and actual read cut. Caller owns decoded items. Empty/end pages grant no drainage authority.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeLegacyInventoryReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 8192 bytes.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members do not support activated original-terminal recovery.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-producers/legacy-terminal-v1:
    {"post":{"tags":["source-producer-control"],"operationId":"controlNativeLegacyTerminal","summary":"Submit original terminal legacy recovery or read its exact outcome","description":"Private authenticated internal-service RPC. Request JSON is bounded to 16384 bytes; reply JSON to 12288 bytes. Submit carries a fresh nonzero request_id and complete original owner/record proof, with null receipt and zero minimum_applied_index. The leader independently qualifies persisted producer closure, current ownership and all-applying-member protocol 47 before proposal. It cannot choose a pending COMMIT/ABORT. Recovery carries the exact command and accepted entry, requires minimum_applied_index at least that entry, establishes fresh ReadIndex and never appends a barrier or command. Replies bind the entire request and nonce. Accepted positions survive lost confirmation but do not prove commitment. Applied/rejected outcomes are exact local command evidence; superseded/null outcomes authorize no blind replay. This provides no global drainage, strict activation, source ACK, retention release or public feed position.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeLegacyTerminalRequest"}}}},"responses":{"200":{"description":"Correlated accepted position and optional qualified exact local outcome. Validate request_digest, command, owner, entry and actual cut. Outcome-unknown markers or late cancellation clear confirmation while preserving valid accepted positions. An applied ABORT is original intent retirement, not a new row commit.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeLegacyTerminalReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 16384 bytes.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members do not support activated original-terminal recovery.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-producers/close-v1:
    {"post":{"tags":["source-producer-control"],"operationId":"closeNativeSourceProducers","summary":"Submit one owner-fenced cumulative producer intake closure","description":"Private authenticated internal-service mutation. Request/reply limits are 4096/12288 bytes. Caller supplies only a fresh correlation nonce and the original complete physical owner, with a catalog route fence. The leader independently checks current ownership, term, membership and durable protocol-46 activation before one closure proposal. Receipt is accepted proposal identity, not confirmation of commitment. Outcome is a fresh ReadIndex-qualified current closure observation at or beyond that index, not an original command or row-transaction outcome. Lost confirmation preserves any valid receipt; never blindly retry this RPC. Recover state through source-producers/observe-v1. Cumulative intake closure is not old-transaction drainage, source checkpoint acknowledgement, all-owner fencing or first-strict activation.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceProducerCloseRequest"}}}},"responses":{"200":{"description":"Request-correlated accepted position and optional qualified current state. Null outcome remains unknown. A positive closure state does not certify original proposal commitment or drainage.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceProducerCloseReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 8 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-producers/observe-v1:
    {"post":{"tags":["source-producer-recovery"],"operationId":"observeNativeSourceProducerClosure","summary":"Read physical producer intake closure at a qualified native cut","description":"Private read-only internal-service RPC. Request JSON is bounded to 4096 bytes and reply to 8192 bytes. Requires the full original physical owner and current catalog route fence. The owner independently captures and revalidates leader ReadIndex, catalog/table incarnation, namespace and root generation around the native snapshot. Returns actual apply cut and optional immutable first closure cut. Absence is not a transaction outcome or replay grant; closure is not a drainage certificate, source acknowledgement, all-owner fence or first-strict activation. No document batch or mutation is submitted.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceProducerClosureQuery"}}}},"responses":{"200":{"description":"Qualified bounded state observation, not confirmation of an original mutation. Validate the owner, minimum actual apply cut and immutable closure basis.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceProducerClosureObservation"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 8 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-scope/observe-v1:
    {"post":{"tags":["source-scope-recovery"],"operationId":"observeNativeSourceScope","summary":"Read bounded source scope state at a qualified native cut","description":"Private read-only recovery, bounded to 8 KiB request JSON and 8 KiB reply. Requires an internal service principal, current catalog route fence and the complete original physical owner. Establish and revalidate leader ReadIndex and physical owner; actual apply cut, registry header and domain record are read from one native snapshot. Scope absence proves no transaction outcome, legacy worker drainage, global fencing or replay authority. Closed scopes retain their first actual close cut and root metadata floors survive domain cleanup.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceScopeQuery"}}}},"responses":{"200":{"description":"Bounded typed response; validate request binding and evidence before advancing progress.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceScopeObservation"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete scope command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 8 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-checkpoint/observe-v1:
    {"post":{"tags":["source-checkpoint-recovery"],"operationId":"observeNativeSourceCheckpoint","summary":"Read bounded retained source checkpoint receipts at a qualified native cut","description":"Private read-only recovery, bounded to 16 KiB request JSON and 8 KiB reply. Requires an internal service principal, current catalog route fence and the complete original checkpoint owner. Establish and revalidate leader ReadIndex and physical owner; head and retained receipt are read from one native snapshot. A receipt proves only local checkpoint commitment, not complete participant publication, source acknowledgment or cleanup authority. Absent evidence is unproven and never permits mutation replay or replan. Expired receipt windows require explicit resynchronization.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceCheckpointReadRequest"}}}},"responses":{"200":{"description":"Bounded typed response; validate request binding and evidence before advancing progress.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourceCheckpointReadReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, source binding, receipt profile or complete checkpoint command conflicts, or retained history requires resynchronization.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 16 KiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-plan/observe-v1:
    {"post":{"tags":["source-plan-staging"],"operationId":"observeNativeSourcePlan","summary":"Observe root quota and frozen upload status","description":"Trusted node-to-node operation, bounded to 2 MiB request JSON. Requires an internal service principal and an independently validated immutable catalog route fence. Establish and revalidate the original owner under a leader ReadIndex. Quota, status and actual native cut come from one snapshot. Evidence must bind the exact root/spec and requested minimum cut; unsealed presence cannot certify sealed input.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanObserveRequest"}}}},"responses":{"200":{"description":"Bounded typed response; validate request binding and evidence before advancing progress.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanObservationReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, upload or receipt conflicts, or input was fenced/reclaimed.","content":{"text/plain":{"schema":{"type":"string"}}}},"413":{"description":"Request exceeds 2 MiB.","content":{"text/plain":{"schema":{"type":"string"}}}},"500":{"description":"Corrupt evidence or malformed internal response; no partial bytes are returned.","content":{"text/plain":{"schema":{"type":"string"}}}},"501":{"description":"Serving profile or applying members cannot support the native source-plan contract.","content":{"text/plain":{"schema":{"type":"string"}}}},"503":{"description":"Leader, routing, deadline, quorum or storage admission unavailable.","content":{"text/plain":{"schema":{"type":"string"}}}}}}}
  /groups/{group_id}/tables/{table_name}/source-plan/chunk-v1:
    {"post":{"tags":["source-plan-staging"],"operationId":"readNativeSourcePlanChunk","summary":"Read one authenticated sealed source-plan chunk","description":"Trusted node-to-node operation, bounded to 2 MiB request JSON. Requires an internal service principal and an independently validated immutable catalog route fence. Read at most 1 MiB of sealed input under the same qualified owner/cut as its status. Return no bytes for fenced or reclaimed work. Decoder validates the request digest, seal, exact decoded size and ordinal hash. These private positions are not public feed cursors or PostgreSQL LSNs.","security":[{"InternalServicePrincipal":[]}],"parameters":[{"name":"group_id","in":"path","required":true,"schema":{"type":"integer","format":"uint64","minimum":1}},{"name":"table_name","in":"path","required":true,"schema":{"type":"string","minLength":1,"maxLength":1024}},{"name":"X-Antfly-Catalog-Route-Fence","in":"header","required":true,"description":"Immutable catalog route fence. Receiver independently validates current metadata/table incarnation, group and physical generation; the supplied source_owner must match.","schema":{"type":"string","minLength":1,"maxLength":16384}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanChunkRequest"}}}},"responses":{"200":{"description":"Bounded typed response; validate request binding and evidence before advancing progress.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/NativeSourcePlanChunkReply"}}}},"400":{"description":"Malformed command, owner, route fence or read request.","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid internal service authority.","content":{"text/plain":{"schema":{"type":"string"}}}},"403":{"description":"Principal is not an internal service.","content":{"text/plain":{"schema":{"type":"string"}}}},"409":{"description":"Original owner, upload or receipt conflicts,