{
  "openapi": "3.0.3",
  "info": {
    "title": "Source Management",
    "version": "1.0.0",
    "description": "Shared Go source-server and Colony contract. Mount relative to an explicit management base URL, never the Antfly database URL. Authentication and configuration/credential APIs belong to each runtime. POST start is not automatically retried: resolve ambiguous submission through run history. Cancellation is capability-gated. Completed execution does not imply authoritative publication; inspect outcome and authoritative. Cursors are opaque and runtime-specific; pages may be empty with a next cursor."
  },
  "paths": {
    "/capabilities": {
      "get": {
        "operationId": "sourceCapabilities",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Capabilities"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/sources": {
      "get": {
        "operationId": "listSources",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SourcePage"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/sources/{source_id}": {
      "parameters": [
        {
          "name": "source_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "getSource",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Source"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "putSource",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Source"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Source"
                }
              }
            }
          },
          "default": {
            "description": "Result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "removeSource",
        "parameters": [
          {
            "name": "purge",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Mutation"
                }
              }
            }
          },
          "default": {
            "description": "Result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/sources/{source_id}/runs": {
      "parameters": [
        {
          "name": "source_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "listSourceRuns",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunPage"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ]
      },
      "post": {
        "operationId": "startSourceRun",
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128,
              "pattern": "^[A-Za-z0-9_-]{1,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RunInput"
              }
            }
          }
        },
        "description": "Idempotency is scoped to the authenticated runtime, source and key. Reusing a key with different input returns 409. Receipts remain addressable for the retained source lifetime. Restart replaces pinned selection only after older execution is terminal. Purge executes only after an explicit purge intent."
      }
    },
    "/sources/{source_id}/runs/{run_id}": {
      "parameters": [
        {
          "name": "source_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "run_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "getSourceRun",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/sources/{source_id}/runs/{run_id}/cancel": {
      "parameters": [
        {
          "name": "source_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "run_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "operationId": "cancelSourceRun",
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Capabilities": {
        "type": "object",
        "required": [
          "version",
          "runtime",
          "per_source_runs",
          "cancel_runs"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "runtime": {
            "type": "string"
          },
          "per_source_runs": {
            "type": "boolean"
          },
          "cancel_runs": {
            "type": "boolean"
          },
          "configuration_url": {
            "type": "string"
          },
          "configure_sources": {
            "type": "boolean"
          },
          "purge_sources": {
            "type": "boolean"
          },
          "media_proxy": {
            "type": "boolean"
          },
          "serialized_runs": {
            "type": "boolean"
          }
        }
      },
      "Source": {
        "type": "object",
        "required": [
          "id",
          "name",
          "connection",
          "table",
          "publication",
          "state",
          "config",
          "permissions"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "connection": {
            "type": "string"
          },
          "table": {
            "type": "string"
          },
          "publication": {
            "type": "string",
            "enum": [
              "native",
              "text",
              "media"
            ],
            "description": "Native acquisition is the default: text stays inline and binary originals are revision-pinned for native artifact producers."
          },
          "state": {
            "type": "string",
            "description": "Runtime lifecycle state. PUT configures a source; retirement and purge use explicit operations."
          },
          "config": {
            "type": "object",
            "additionalProperties": true
          },
          "permissions": {
            "$ref": "#/components/schemas/Permissions"
          },
          "permission_ttl_seconds": {
            "type": "integer",
            "minimum": 60,
            "maximum": 86400
          },
          "streams": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "$ref": "#/components/schemas/TextStream"
            },
            "x-go-type-skip-optional-pointer": true,
            "description": "Searchable source-text and native artifact bindings; credentials and producer execution remain separate."
          }
        },
        "additionalProperties": false
      },
      "Run": {
        "type": "object",
        "required": [
          "id",
          "source_id",
          "state",
          "outcome",
          "authoritative",
          "created_at"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "pending",
              "running",
              "completed",
              "failed",
              "cancelled",
              "interrupted"
            ]
          },
          "outcome": {
            "type": "string",
            "enum": [
              "unknown",
              "success",
              "partial",
              "failed"
            ]
          },
          "authoritative": {
            "type": "boolean"
          },
          "created_at": {
            "type": "integer",
            "format": "int64"
          },
          "finished_at": {
            "type": "integer",
            "format": "int64"
          },
          "code": {
            "type": "string"
          },
          "operation": {
            "type": "string",
            "enum": [
              "sync",
              "purge"
            ]
          }
        }
      },
      "SourcePage": {
        "type": "object",
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Source"
            }
          },
          "next_cursor": {
            "type": "string"
          }
        }
      },
      "RunPage": {
        "type": "object",
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Run"
            }
          },
          "next_cursor": {
            "type": "string"
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "version",
          "code"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "code": {
            "type": "string"
          }
        }
      },
      "Permissions": {
        "type": "object",
        "required": [
          "public",
          "readers"
        ],
        "properties": {
          "public": {
            "type": "boolean"
          },
          "readers": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 256
          }
        }
      },
      "Mutation": {
        "type": "object",
        "required": [
          "source_id",
          "state"
        ],
        "properties": {
          "source_id": {
            "type": "string"
          },
          "state": {
            "type": "string"
          }
        }
      },
      "RunInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "restart": {
            "type": "boolean",
            "default": false
          },
          "operation": {
            "type": "string",
            "enum": [
              "sync",
              "purge"
            ],
            "default": "sync"
          }
        }
      },
      "TextStream": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "field",
          "default"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "artifact": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "index": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "field": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "purpose": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "location_field": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[^\\u0000\\r\\n]+$",
            "x-go-type-skip-optional-pointer": true
          },
          "default": {
            "type": "boolean",
            "x-go-type-skip-optional-pointer": true
          },
          "generated": {
            "type": "boolean",
            "x-go-type-skip-optional-pointer": true
          },
          "boundary": {
            "enum": [
              "record",
              "unit"
            ],
            "x-go-type-skip-optional-pointer": true,
            "type": "string"
          }
        },
        "dependentRequired": {
          "artifact": [
            "index"
          ]
        }
      }
    }
  }
}
