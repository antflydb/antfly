openapi: 3.0.3
info:
  title: Antfly Resource Policy
  description: Shared resource policy for database and inference runtimes.
  version: "0.0.1"
components:
  schemas:
    ResourcesConfig:
      type: object
      additionalProperties: false
      description: Shared node-local resource policy for DB and standalone inference. All memory quantities are bytes.
      properties:
        execution:
          type: object
          additionalProperties: false
          description: Node-wide runnable capacity and finite request/state ownership budgets.
          properties:
            runnable:
              $ref: "#/components/schemas/RunnableSchedulingConfig"
            max_request_duration_ms:
              type: integer
              minimum: 1
              maximum: 86400000
              default: 300000
            max_request_memory_bytes:
              type: integer
              format: uint64
              minimum: 1048576
              default: 268435456
            max_retained_memory_bytes:
              type: integer
              format: uint64
              minimum: 1048576
              default: 268435456
        memory:
          type: object
          additionalProperties: false
          properties:
            max_bytes:
              type: integer
              minimum: 0
              description: Whole-process memory envelope; zero selects automatic cgroup or host detection. Physical capacity always clamps this value.
        query:
          type: object
          additionalProperties: false
          properties:
            admission:
              $ref: "#/components/schemas/QueryAdmissionConfig"
            request_limits:
              type: object
              additionalProperties: false
              properties:
                graph:
                  $ref: "#/components/schemas/GraphExecutionConfig"
        write:
          type: object
          additionalProperties: false
          properties:
            admission:
              $ref: "#/components/schemas/WriteAdmissionConfig"
        inference:
          type: object
          additionalProperties: false
          properties:
            memory:
              $ref: "#/components/schemas/InferenceMemoryConfig"
            admission:
              $ref: "#/components/schemas/InferenceAdmissionConfig"
            request_limits:
              $ref: "#/components/schemas/InferenceRequestLimitsConfig"

    InferenceMemoryConfig:
      type: object
      additionalProperties: false
      description: Inference memory ceilings in bytes. Omitted or zero values select automatic policy; physical capacity and the process envelope remain authoritative.
      properties:
        max_host_bytes:
          type: integer
          minimum: 0
          description: Host memory ceiling.
        max_device_bytes:
          type: integer
          minimum: 0
          description: Accelerator memory ceiling.
        max_combined_bytes:
          type: integer
          minimum: 0
          description: Combined host and accelerator ceiling; integrated devices also enforce this across CPU and GPU leases.
        max_kv_bytes:
          type: integer
          minimum: 0
          description: KV cache memory ceiling.
        max_scratch_bytes:
          type: integer
          minimum: 0
          description: Scratch memory ceiling.

    InferenceRequestLimitsConfig:
      type: object
      additionalProperties: false
      description: Deployment request ceilings only narrow model capabilities. Applied equally to direct calls, HTTP and discovery. Omitted values retain native limits.
      properties:
        max_items_per_request:
          type: integer
          minimum: 1
          description: Maximum items in one public or direct request. Independent callers may still be combined into a larger native execution microbatch.
        max_input_tokens_per_item:
          type: integer
          minimum: 1
          description: Maximum effective input tokens per item, including expanded image prompts.
        max_output_tokens_per_item:
          type: integer
          minimum: 1
          description: Maximum generated output tokens per item. Omitted request max_tokens resolves to a bounded effective default.
        max_decoded_pixels_per_batch:
          type: integer
          minimum: 1
          description: Maximum aggregate decoded image pixels in a request batch; also bounds execution microbatch pixels.

    GraphExecutionConfig:
      type: object
      additionalProperties: false
      description: >-
        Operator-owned ceilings shared by all named graph operations in one
        admitted query. Public requests cannot raise these values. Explored
        work, scanned anchors, and exact-distinct capacity are request-consumptive;
        intermediate and retained-state ceilings bound simultaneously live state.
      properties:
        max_explored_nodes:
          type: integer
          minimum: 1
          default: 100000
          description: Cumulative node expansions across every named operation and path spur in one request.
        max_explored_edges:
          type: integer
          minimum: 1
          default: 1000000
          description: Cumulative edge expansions across every named operation and path spur in one request.
        max_explored_edge_bytes:
          type: integer
          minimum: 1
          default: 67108864
          description: Cumulative owned bytes of materialized edges read while executing one request.
        max_scanned_anchors:
          type: integer
          minimum: 1
          default: 1000000
          description: Cumulative source anchors scanned by exact MATCH operations in one request.
        max_intermediate_states:
          type: integer
          minimum: 1
          default: 100000
          description: Maximum simultaneously live traversal, pathfinding, or MATCH frontier states.
        max_retained_state_bytes:
          type: integer
          minimum: 1
          default: 67108864
          description: Maximum simultaneously retained bytes of admitted graph execution state.
        max_distinct_identities:
          type: integer
          minimum: 1
          default: 100000
          description: Cumulative exact-distinct identities admitted across all named aggregates in one request.
        max_distinct_state_bytes:
          type: integer
          minimum: 1
          default: 16777216
          description: Request-consumptive bytes for exact-distinct identities, indexes, and ownership transfer.

    QueryAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        waiting:
          $ref: "#/components/schemas/QueryAdmissionWaiting"
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 32
          example: 32
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent query, search, and retrieval requests in this
            process. The default is 32. The budget is shared by REST, MCP,
            retrieval-agent, A2A, and direct API-kernel execution. Full-text,
            vector, hybrid, graph, aggregation, federated searches, and document
            scans consume it. Point lookups and operational/control-plane reads
            remain outside it. Excess HTTP work is rejected immediately with
            HTTP 429 and Retry-After: 1; asynchronous protocols use their native failure
            response. Excess work is not queued. Set to 0 to disable query
            admission. This budget is independent of transport safeguards,
            write admission, and
            resources.inference.admission.max_concurrent_requests.

    WriteAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 16
          example: 16
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent foreground data mutations in this process. The
            default is 16. Table batch writes, cross-table batches, linear merges,
            and transaction commits consume this budget. Schema, index, backup,
            restore, repair, and other administrative operations use dedicated
            control or background-maintenance paths. Set to 0 to disable write
            admission.

            Excess HTTP work in either foreground class is rejected immediately
            with HTTP 429 and Retry-After: 1; asynchronous protocols use their
            native failure response. Excess work is not queued. Both budgets are
            independent of transport safeguards and
            resources.inference.admission.max_concurrent_requests.

    InferenceAdmissionConfig:
      type: object
      additionalProperties: false
      properties:
        max_work_units:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Weighted work and media capacity, independent of request count. Omitted derives capacity from concurrency; zero disables weighted accounting.

        max_concurrent_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 32
          example: 32
          x-go-type-skip-optional-pointer: false
          description: |
            Maximum concurrent inference requests admitted by this process.
            The budget covers embedded inference routes, direct providers, and
            public connection inference forwarding. Remote forwarding holds a
            slot for the full upstream request. The runtime-reserved
            `local-inference` connection dispatches in process and is admitted
            once by the destination inference route; configured URLs remain
            remote boundaries even when they alias the local listener.
            Embedded standalone uses one shared coordinator for all of those
            surfaces; API-only runtimes use the same setting as a local forwarding
            gate. Weighted work/media capacity is controlled independently by
            max_work_units; when omitted it derives from max_concurrent_requests.
            Request count zero disables only the request-count gate. An explicit
            max_work_units remains authoritative. Excess work is rejected with
            503 and Retry-After; it is not queued.

    RunnableSchedulingConfig:
      type: object
      nullable: true
      additionalProperties: false
      description: Node-wide runnable scheduling across execution classes. Omitting resources.execution.runnable enables automatic initial sizing using the declared defaults as ceilings. Setting null disables runnable scheduling and implicit query waiting. An explicit object uses its property defaults, including fixed mode unless capacity_mode is supplied. Automatic mode resolves once before node publication and preserves protected health and cleanup capacity.
      properties:
        capacity_mode:
          type: string
          enum: [fixed, automatic]
          default: fixed
          description: Fixed preserves declared capacity. Automatic uses affinity and visible CPU quotas, with a protected-lane floor inside the declared slot ceiling, and limits metadata to 1/32 of the effective host/container/process memory budget. Request and retained-state pools each receive at most 1/8 of that budget. Resolution is frozen before publication; active policy is never resized.
        slots:
          type: integer
          minimum: 3
          maximum: 65535
          default: 8
          description: Total runnable slots, or the upper bound in automatic mode, including health/control and cleanup reserves. Managed startup requires at least one ordinary slot after both reserves. Protected lanes can share OS CPU time on small quotas and do not promise dedicated cores.
        control_slots:
          type: integer
          minimum: 1
          default: 1
          description: Health/control CPU slots reserved within slots, independently from cleanup. The combined reserves must leave at least one ordinary slot.
        cleanup_slots:
          type: integer
          minimum: 0
          maximum: 1
          default: 0
          description: Dedicated cleanup CPU slots drawn from slots. Managed startup establishes one slot when zero is configured, before publishing work; it does not increase the total slot limit.
        read_isolation:
          type: boolean
          nullable: true
          default: null
          description: Reserve bounded_read_slots ordinary CPU slots, including one nonborrowable floor, and one quarter of ordinary scheduling entries and metadata for server-verified bounded reads. General reads, analytical reads and other ordinary classes share the remainder. Omitted or null selects automatic isolation only in automatic capacity mode with enough ordinary slots for the configured bounded reserve plus one general slot and eight entries; fixed mode defaults to disabled. Explicit false disables isolation, including in automatic mode. Explicit true requires sufficient capacity, including managed cleanup, or startup fails. Unverified plans cannot claim the bounded lane. When enabled, production startup carves one quarter of the ordinary request heap into finite read pools, with half for demoted reads and one quarter each for bounded and transition allocations. This reduces the ordinary heap without increasing max_request_memory_bytes. Existing control and retained-state envelopes remain separate. Only verified operators may use the protected pools; this does not bound every backend allocation or preempt non-yielding work.
        bounded_read_slots:
          type: integer
          minimum: 1
          maximum: 65533
          default: 1
          description: Bounded-read CPU reserve within the total slot ceiling when read isolation is enabled. One slot is a nonborrowable floor. Only capacity above that floor may lend a CPU to a server-verified stage; at most one CPU loan is supported. The default reserves only the floor and permits no CPU lending. The reserve must leave at least one general slot after health and cleanup; automatic isolation is disabled when that capacity is unavailable unless explicitly required.
        weights:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 1
            maximum: 65535
          default: [4, 2, 1, 1]
          description: Query, write, inference and background slot-service weights.
        max_operations:
          type: integer
          minimum: 4
          default: 128
          description: Outstanding operation entries including protected controls. Managed startup requires at least two control entries, reserved within this bound.
        max_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 8388608
          description: Caller-declared scheduling metadata bytes across queued, running and blocked operations; not a whole-process heap limit.
        control_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 65536
          description: Protected scheduling metadata bytes reserved within max_bytes. Up to four operation entries, capped at half max_operations, are also reserved for controls.
        max_wait_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 250
        max_backfills:
          type: integer
          minimum: 0
          maximum: 65535
          default: 8
        quantum_ms:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
        checkpoint_budget:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 64


    QueryAdmissionWaiting:
      type: object
      additionalProperties: false
      description: |
        Bounded waiting for contextual REST, native SQL and managed serverless
        reads. Omitting admission.query.waiting uses eight queued requests, eight
        MiB of retained input and a 250 millisecond ceiling when scheduling is
        enabled. An explicit object uses the zero property defaults: {} is
        fail-fast. Waiting retains a bounded runtime task and owned input;
        existing executor and transport bounds still apply. Write, inference,
        MCP, and unsupported legacy direct calls remain fail-fast. All three limits must be positive to enable waiting, or all
        zero to disable it. These are queued input limits, not total heap limits.
      properties:
        max_queued_requests:
          type: integer
          minimum: 0
          maximum: 4294967295
          default: 0
        max_queued_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
        max_wait_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 0
