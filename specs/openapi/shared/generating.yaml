openapi: 3.0.3
info:
  title: Generator Provider Configuration
  description: "An OpenAPI specification for configuring different generative AI providers in AntflyDB."
  version: "0.0.1"
components:
  schemas:
    RateLimitConfig:
      $ref: "./provider.yaml#/components/schemas/RateLimitConfig"
    GeneratorProvider:
      type: string
      enum:
        - gemini
        - vertex
        - bedrock
        - anthropic
        - ollama
        - openai
        - chatgpt
        - openrouter
        - antfly
        - apple
      description: "Generator providers implemented by Antfly's generation runtime."

    GeneratorConfig:
      description: |
        A unified configuration for a generative AI provider.
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/GoogleGeneratorConfig"
            - $ref: "#/components/schemas/VertexGeneratorConfig"
            - $ref: "#/components/schemas/BedrockGeneratorConfig"
            - $ref: "#/components/schemas/AnthropicGeneratorConfig"
            - $ref: "#/components/schemas/OllamaGeneratorConfig"
            - $ref: "#/components/schemas/AntflyGeneratorConfig"
            - $ref: "#/components/schemas/ChatGPTGeneratorConfig"
            - $ref: "#/components/schemas/OpenAIGeneratorConfig"
            - $ref: "#/components/schemas/OpenRouterGeneratorConfig"
            - $ref: "#/components/schemas/AppleGeneratorConfig"
        - properties:
            max_image_input_tokens:
              x-go-type-skip-optional-pointer: false
              type: integer
              format: int64
              minimum: 1
              description: Conservative input-token ceiling per image. Required for image calls when tokens_per_minute is configured; choose a bound valid for the model and image policy.
            rate_limit:
              x-go-type-skip-optional-pointer: false
              $ref: "./provider.yaml#/components/schemas/RateLimitConfig"
            provider:
              $ref: "#/components/schemas/GeneratorProvider"
          required:
            - provider
      example:
        provider: "openai"
        model: "gpt-4.1"
        temperature: 0.7
        max_tokens: 2048

    ConstrainedOutput:
      type: string
      enum: [auto, tool_call, json_schema, grammar]
      default: auto
      description: Provider and model admission selects a supported constrained mechanism. Auto prefers forced tools, then provider JSON schema, then native grammar. Free-text parsing is not a mode.
    ConstrainedProbabilities:
      type: string
      enum: [token_logprobs, verdict_only]
      default: token_logprobs
      description: Token probabilities require complete decoder evidence for the allowed values. Verdict-only is explicit opt-in; model-reported confidence is never used.
    ConstrainedGenerationBatch:
      type: object
      additionalProperties: false
      properties:
        max_items_per_call:
          type: integer
          minimum: 1
          maximum: 256
          default: 8
        max_input_bytes:
          type: integer
          minimum: 1
          maximum: 4194304
          default: 65536
    ConstrainedGeneratorProducerConfig:
      type: object
      additionalProperties: false
      required: [generator, output_schema]
      properties:
        generator:
          $ref: '#/components/schemas/GeneratorConfig'
        instructions:
          type: string
          maxLength: 65536
        output_schema:
          type: object
          additionalProperties: true
          description: JSON schema enforced before artifact publication. Unsupported schema vocabulary fails admission. Invalid or missing batch items receive one validation retry; successful siblings are retained.
        output:
          $ref: '#/components/schemas/ConstrainedOutput'
        batch:
          $ref: '#/components/schemas/ConstrainedGenerationBatch'

    AppleGeneratorConfig:
      type: object
      description: "On-device Apple Foundation Models generation. Requires a macOS Apple provider build, Apple Intelligence enabled, and its system model ready. Supports text conversations; tool calling and media attachments are not supported."
      properties:
        provider:
          type: string
          enum: [apple]
        max_tokens:
          type: integer
          minimum: 1
          default: 256
        temperature:
          type: number
          minimum: 0
          maximum: 2

    RetryConfig:
      type: object
      description: "Retry configuration for generator calls"
      properties:
        max_attempts:
          type: integer
          default: 3
          minimum: 1
          maximum: 10
          description: "Maximum number of retry attempts"
        initial_backoff_ms:
          type: integer
          default: 1000
          minimum: 100
          description: "Initial backoff delay in milliseconds"
        backoff_multiplier:
          type: number
          format: float
          default: 2.0
          minimum: 1.0
          maximum: 5.0
          description: "Multiplier for exponential backoff"
        max_backoff_ms:
          type: integer
          default: 30000
          description: "Maximum backoff delay in milliseconds"

    ChainCondition:
      type: string
      enum: ["always", "on_error", "on_timeout", "on_rate_limit"]
      default: "on_error"
      description: |
        Condition for trying the next generator in chain:
        - always: Always try next regardless of outcome
        - on_error: Try next on any error (default)
        - on_timeout: Try next only on timeout errors
        - on_rate_limit: Try next only on rate limit errors

    ChainLink:
      type: object
      description: "A single link in a generator chain with optional retry and condition"
      required:
        - generator
      properties:
        generator:
          $ref: "#/components/schemas/GeneratorConfig"
        retry:
          $ref: "#/components/schemas/RetryConfig"
          description: "Retry configuration for this generator"
        condition:
          $ref: "#/components/schemas/ChainCondition"
          description: "When to try the next generator in chain"

    ChatMessageRole:
      type: string
      enum: ["user", "assistant", "system", "tool"]
      description: "Role of the message sender in a generation/chat conversation"

    TextContentPart:
      type: object
      description: Text content for multimodal input.
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
          description: Text content.

    ImageURL:
      type: object
      description: Image URL or data URI.
      required:
        - url
      properties:
        url:
          type: string
          description: URL or data URI (data:image/png;base64,...).
          example: data:image/png;base64,iVBORw0KGgo...

    ImageURLContentPart:
      type: object
      description: Image content in OpenAI-compatible format.
      required:
        - type
        - image_url
      properties:
        type:
          type: string
          enum:
            - image_url
        image_url:
          $ref: "#/components/schemas/ImageURL"

    MediaContentPart:
      type: object
      description: Inline binary media content (audio, image, etc.).
      required:
        - type
        - data
        - mime_type
      properties:
        type:
          type: string
          enum:
            - media
        data:
          type: string
          format: byte
          description: Base64-encoded binary data.
        mime_type:
          type: string
          description: MIME type (audio/wav, image/gif, image/png, etc.).
        sampling:
          $ref: '#/components/schemas/VideoSamplingPolicy'

    VideoSamplingPolicy:
      type: object
      description: Explicit EmbeddingGemma 2 video-group sampling. Timestamp windows are half-open and relative to the first presentation picture.
      required: [policy]
      properties:
        policy:
          type: string
          enum: [reference, timestamps]
        start_ns:
          type: integer
          format: int64
          minimum: 0
        end_ns:
          type: integer
          format: int64
          minimum: 1
        step_ns:
          type: integer
          format: int64
          minimum: 1
        max_frames:
          type: integer
          minimum: 1
          maximum: 32
        overflow:
          type: string
          enum: [uniform, truncate]
        hold:
          type: boolean
          description: Sample the displayed picture, including VFR holds, rather than the next picture at or after the target.

    ContentPart:
      description: A content part for multimodal input (text, image URL, or inline media).
      oneOf:
        - $ref: "#/components/schemas/TextContentPart"
        - $ref: "#/components/schemas/ImageURLContentPart"
        - $ref: "#/components/schemas/MediaContentPart"

    ChatMessageContent:
      x-go-type: stdjson.RawMessage
      x-go-type-import:
        path: encoding/json
        name: stdjson
      description: |
        Message content. Supports two formats:
        - Simple string: "Hello, how are you?"
        - Array of content parts: [{"type": "text", "text": "Hello"}]
      oneOf:
        - type: string
          description: Simple text content.
        - type: array
          description: Array of multimodal content parts.
          items:
            $ref: "#/components/schemas/ContentPart"

    ToolCall:
      type: object
      description: "OpenAI-compatible assistant tool call."
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: "Tool call identifier."
        type:
          type: string
          enum:
            - function
        function:
          $ref: "#/components/schemas/ToolCallFunction"
        extra_content:
          type: object
          additionalProperties: true
          description: Opaque provider tool metadata, including Google thought signatures. Preserve it unchanged when replaying assistant tool calls.

    ToolCallFunction:
      type: object
      description: "The function called by a model tool call."
      required:
        - name
        - arguments
      properties:
        name:
          type: string
          description: "Function name."
        arguments:
          type: string
          description: "JSON string of function arguments."

    ChatMessage:
      type: object
      description: "OpenAI-compatible message in a generation/chat conversation."
      required:
        - role
      properties:
        extra_content:
          type: object
          additionalProperties: true
          description: Opaque provider message metadata. Preserve unchanged when replaying assistant messages; native Anthropic content retains signed thinking blocks.
        role:
          $ref: "#/components/schemas/ChatMessageRole"
        content:
          $ref: "#/components/schemas/ChatMessageContent"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          description: "Tool calls made by the assistant (only for role=assistant)."
        tool_call_id:
          type: string
          description: "ID of the tool call this message responds to (only for role=tool)."
        name:
          type: string
          description: "Optional tool name for tool messages when model templates need it."

    GoogleGeneratorConfig:
      type: object
      description: |
        Configuration for the Google generative AI provider (Gemini).
      properties:
        provider:
          type: string
          enum: [gemini]
        project_id:
          type: string
          description: "The Google Cloud project ID."
        location:
          type: string
          description: "The Google Cloud location (e.g., 'us-central1')."
        model:
          type: string
          description: "The name of the generative model to use."
          default: "gemini-2.5-flash"
          example: "gemini-2.5-flash"
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
        api_key:
          type: string
          writeOnly: true
          description: "The Google API key."
        url:
          type: string
          format: uri
          description: "The URL of the Google API endpoint."
      required:
        - provider
        - model

    VertexGeneratorConfig:
      type: object
      description: |
        Configuration for Google Cloud Vertex AI generative models.
      properties:
        provider:
          type: string
          enum: [vertex]
        model:
          type: string
          description: "The name of the Vertex AI model to use."
          default: "gemini-2.5-flash"
          example: "gemini-2.5-flash"
        project_id:
          type: string
          description: "Google Cloud project ID."
        location:
          type: string
          description: "Google Cloud region for Vertex AI API."
          default: "us-central1"
        credentials_path:
          type: string
          writeOnly: true
          description: "Path to service account JSON key file."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate in the response."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
      required:
        - provider
        - model

    OllamaGeneratorConfig:
      type: object
      description: |
        Configuration for the Ollama generative AI provider.
      properties:
        provider:
          type: string
          enum: [ollama]
        model:
          type: string
          description: "The name of the Ollama model to use."
          example: "llama3.3:70b"
        url:
          type: string
          format: uri
          description: "The URL of the Ollama API endpoint."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
        timeout:
          type: integer
          description: "HTTP response timeout in seconds for Ollama API calls."
          minimum: 1
      required:
        - provider
        - model

    AntflyGeneratorConfig:
      type: object
      description: |
        Configuration for the Antfly inference generative AI provider.
      properties:
        provider:
          type: string
          enum: [antfly]
        model:
          type: string
          description: "The name of the generator model."
          example: "ggml-org/gemma-4-E4B-it-GGUF"
        api_url:
          type: string
          format: uri
          description: "The URL of the Inference API endpoint. Can also be set via ANTFLY_INFERENCE_URL environment variable."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
        timeout:
          type: integer
          description: "HTTP response timeout in seconds for Inference API calls."
          minimum: 1
      required:
        - provider
        - model

    OpenAIReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, xhigh, max]
      description: OpenAI reasoning effort; model support varies. Omit to use the model default.

    OpenAIGeneratorConfig:
      type: object
      description: |
        Configuration for the OpenAI generative AI provider.
      properties:
        provider:
          type: string
          enum: [openai]
        model:
          type: string
          description: "The name of the OpenAI model to use."
          default: "gpt-4.1"
          example: "gpt-4.1"
        url:
          type: string
          format: uri
          description: "The URL of the OpenAI API endpoint."
        api_key:
          type: string
          writeOnly: true
          description: "The OpenAI API key."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate."
        max_completion_tokens:
          type: integer
          minimum: 1
          description: |
            OpenAI completion budget, including visible output and reasoning tokens.
            Use for reasoning models instead of max_tokens; the two are mutually exclusive.
        reasoning_effort:
          $ref: "#/components/schemas/OpenAIReasoningEffort"
          description: Optional reasoning effort. Supported values depend on the selected OpenAI model.
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter."
          minimum: 0.0
          maximum: 1.0
        frequency_penalty:
          type: number
          format: float
          description: "Penalty for token frequency (-2.0 to 2.0)."
          minimum: -2.0
          maximum: 2.0
        presence_penalty:
          type: number
          format: float
          description: "Penalty for token presence (-2.0 to 2.0)."
          minimum: -2.0
          maximum: 2.0
      required:
        - provider
        - model

    BedrockGeneratorConfig:
      type: object
      description: |
        AWS Bedrock Converse generation, including image inputs and tools for
        models that support them. Uses the AWS default credential chain unless
        an explicit Bedrock API key is configured. Image capability is declared
        per target through inference_capabilities; model IDs are not allowlisted.
      properties:
        provider:
          type: string
          enum: [bedrock]
        url:
          type: string
          description: Optional Bedrock Runtime endpoint override. Defaults to the regional AWS endpoint.
        api_key:
          type: string
          description: Optional Bedrock bearer API key or secret reference. Omit to use signed AWS requests and the default credential chain.
        model:
          type: string
          description: "The Bedrock model ID to use."
          example: "anthropic.claude-sonnet-4-5-20250929-v1:0"
        region:
          type: string
          description: AWS region. Defaults to AWS_REGION, then AWS_DEFAULT_REGION, then us-east-1.
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter."
          minimum: 0.0
          maximum: 1.0
      required:
        - provider
        - model

    AnthropicGeneratorConfig:
      type: object
      description: |
        Configuration for the Anthropic generative AI provider.
      properties:
        provider:
          type: string
          enum: [anthropic]
        workspace_id:
          type: string
          description: Anthropic workspace for keys not scoped to a workspace. Defaults to ANTHROPIC_WORKSPACE_ID.
        model:
          type: string
          description: "The full model ID of the Anthropic model to use."
          default: "claude-sonnet-4-5-20250929"
          example: "claude-sonnet-4-5-20250929"
        api_key:
          type: string
          writeOnly: true
          description: "Anthropic API key or secret reference. Defaults to ANTHROPIC_API_KEY."
        url:
          type: string
          format: uri
          description: "Messages API base URL. Defaults to https://api.anthropic.com/v1."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate in the response."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
      required:
        - provider
        - model

    CohereGeneratorConfig:
      type: object
      description: |
        Configuration for the Cohere generative AI provider.
      properties:
        model:
          type: string
          description: "The name of the Cohere model to use."
          default: "command-r-plus"
          example: "command-r-plus"
        api_key:
          type: string
          writeOnly: true
          description: "The Cohere API key."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate in the response."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        top_k:
          type: integer
          description: "Top-k sampling parameter."
        frequency_penalty:
          type: number
          format: float
          description: "Penalty for token frequency (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        presence_penalty:
          type: number
          format: float
          description: "Penalty for token presence (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
      required:
        - model

    OpenRouterGeneratorConfig:
      type: object
      description: |
        Configuration for the OpenRouter generative AI provider.
      properties:
        provider:
          type: string
          enum: [openrouter]
        model:
          type: string
          description: "The OpenRouter model identifier to use."
          example: "openai/gpt-4.1"
        url:
          type: string
          format: uri
          description: "The URL of the OpenRouter API endpoint."
          default: "https://openrouter.ai/api/v1"
        api_key:
          type: string
          writeOnly: true
          description: "The OpenRouter API key."
        temperature:
          type: number
          format: float
          description: "Controls randomness in generation (0.0-2.0)."
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          description: "Maximum number of tokens to generate in the response."
        top_p:
          type: number
          format: float
          description: "Nucleus sampling parameter (0.0-1.0)."
          minimum: 0.0
          maximum: 1.0
        frequency_penalty:
          type: number
          format: float
          description: "Penalty for token frequency (-2.0 to 2.0)."
          minimum: -2.0
          maximum: 2.0
        presence_penalty:
          type: number
          format: float
          description: "Penalty for token presence (-2.0 to 2.0)."
          minimum: -2.0
          maximum: 2.0
      required:
        - provider
        - model

    ChatGPTGeneratorConfig:
      type: object
      description: Personal ChatGPT plan for interactive generation. Credentials stay in the local runtime.
      required: [provider, model, connection_id]
      properties:
        provider:
          type: string
          enum: [chatgpt]
        reasoning_effort:
          $ref: "#/components/schemas/OpenAIReasoningEffort"
        model:
          type: string
        connection_id:
          type: string
          description: Opaque personal registration owned by the authenticated caller.
