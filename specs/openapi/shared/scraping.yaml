openapi: 3.0.3
info:
  title: Scraping Configuration
  description: "Configuration schema for content security and download settings."
  version: "0.0.1"
components:
  schemas:
    ContentSecurityConfig:
      type: object
      description: |
        Low-level content download policy. In the generic scraper, omitted
        `allowed_hosts` and `allowed_paths` fields do not restrict those sources;
        explicit empty lists deny them. Consumers may merge this object over a
        stricter baseline before downloading. Antfly inference does so: omitted
        or empty inference policies, and omitted inference allowlists, deny
        HTTP(S), file, and S3 content until explicit allowlists are configured.
        Do not assume omission has identical policy semantics across consumers.
      properties:
        allowed_hosts:
          type: array
          description: "Whitelist for HTTP(S) downloads. With block_private_ips enabled (the default), IP literals and every address resolved from an allowlisted DNS hostname must be globally routable; the connection is pinned to a vetted address. Set block_private_ips to false only to opt into private or special destinations. The generic scraper treats omission as unrestricted subject to that policy and an explicit empty list as deny-all; Antfly inference requires an explicit allowlist."
          items:
            type: string
          example:
            - "93.184.216.34"
        block_private_ips:
          type: boolean
          description: "Reject loopback, private, link-local, carrier-grade NAT, reserved, and multicast destinations. Allowlisted DNS hostnames are resolved, every result is filtered by this policy, and the connection is pinned to a vetted address. Set false only as an explicit opt-out that permits private and special destinations."
          default: true
        nat64_prefixes:
          type: array
          description: "RFC 6052 network-specific NAT64 prefixes used by this deployment. Resolved IPv6 addresses under these prefixes are decoded and checked against the private IPv4 policy. Prefix length must be 32, 40, 48, 56, 64, or 96."
          items:
            type: string
          example:
            - "2001:db8:64::/96"
        max_download_size_bytes:
          type: integer
          description: "Maximum size of downloaded content in bytes"
          default: 104857600
          minimum: 0
          example: 104857600
          x-go-type: int64
        download_timeout_seconds:
          type: integer
          description: "Maximum HTTP(S) and S3 download duration in seconds. Defaults to 30. Zero disables this configured ceiling, but a caller-supplied request deadline still applies. A deadline-bound file:// fetch fails closed because portable filesystem I/O does not expose a preemptive timeout."
          default: 30
          minimum: 0
        max_image_dimension:
          type: integer
          description: "Maximum source-image width or height enforced for accepted inference image inputs, including generate/chat, batch generation, dense embed, multimodal rerank, `/read`, image `/extract`, and their embedded direct APIs. Images are rejected rather than resized. Batch generation applies the same image-header admission before model execution; non-inference scraping consumers do not enforce this setting."
          minimum: 1
        allowed_paths:
          type: array
          description: "Whitelist of allowed path prefixes for file:// and s3:// URLs. The generic scraper treats omission as unrestricted and an explicit empty list as deny-all. Consumers may impose stricter defaults; Antfly inference requires explicit path allowlists. For file:// use absolute paths (e.g., /Users/data/). For s3:// use bucket/prefix (e.g., my-bucket/uploads/)."
          items:
            type: string
          example:
            - "/Users/data/"
            - "my-bucket/uploads/"
        user_agent:
          type: string
          description: "User-Agent header for HTTP downloads. Defaults to 'AntflyDB/1.0' if not set. Some servers (e.g., Wikipedia) reject requests without a User-Agent."
          example: "AntflyDB/1.0"

    S3CredentialConfig:
      type: object
      description: S3 credential with optional bucket patterns and security overrides.
      allOf:
        - $ref: 's3.yaml#/components/schemas/Credentials'
        - type: object
          properties:
            buckets:
              type: array
              description: Glob patterns for bucket names this credential handles. When a URL matches a pattern, this credential is auto-selected.
              items:
                type: string
              example: ["user-uploads-*", "media-*"]
            security:
              $ref: '#/components/schemas/ContentSecurityConfig'
              description: Security overrides for this credential.

    HTTPCredentialConfig:
      type: object
      description: HTTP credential for authenticated endpoints.
      properties:
        base_url:
          type: string
          format: uri
          description: Exact HTTP(S) origin and optional path scope for this credential. Matching requires the same scheme, host, and effective port plus a path-segment boundary; automatic selection uses the longest matching scope. An explicitly named credential must exist and match this scope or the fetch fails closed.
        headers:
          type: object
          description: HTTP headers to include. Supports secret-store references (e.g., "${secret:token}").
          additionalProperties:
            type: string
        security:
          $ref: '#/components/schemas/ContentSecurityConfig'
          description: Security overrides for this credential.

    RemoteContentConfig:
      type: object
      description: |
        Configuration for remote content fetching (`remoteMedia`, `remoteText`, and the deprecated
        `remotePDF` compatibility helper). Durable PDF ingestion uses a `document_extraction` asset producer.
        Consolidates S3 credentials and security settings separate from backup storage.

        **Credential Resolution Order:**
        1. Explicit `credentials="name"` parameter in template
        2. First credential where `buckets` glob pattern matches URL's bucket
        3. `default_s3` credential
      properties:
        security:
          $ref: '#/components/schemas/ContentSecurityConfig'
          description: Global security defaults for remote content operations.
        default_s3:
          type: string
          description: Default S3 credential name when no bucket pattern matches.
          example: "primary"
        s3:
          type: object
          description: Named S3 credentials for remote content fetching.
          additionalProperties:
            $ref: '#/components/schemas/S3CredentialConfig'
          example:
            primary:
              endpoint: "s3.amazonaws.com"
              access_key_id: "${secret:aws.key}"
              secret_access_key: "${secret:aws.secret}"
            untrusted:
              endpoint: "s3.amazonaws.com"
              buckets: ["user-uploads-*", "public-*"]
              access_key_id: "${secret:uploads.key}"
              secret_access_key: "${secret:uploads.secret}"
              security:
                max_download_size_bytes: 10485760
        http:
          type: object
          description: Named HTTP credentials for authenticated endpoints.
          additionalProperties:
            $ref: '#/components/schemas/HTTPCredentialConfig'
          example:
            internal-api:
              base_url: "https://docs.internal.com"
              headers:
                Authorization: "Bearer ${secret:token}"
