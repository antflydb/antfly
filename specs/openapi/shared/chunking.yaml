openapi: 3.0.3
info:
  title: Chunking Types
  description: "Shared types for text and media chunking."
  version: "0.0.2"
components:
  schemas:
    TextContent:
      type: object
      description: "Text content with character offsets."
      required:
        - text
        - start_char
        - end_char
      properties:
        text:
          type: string
          description: "The chunk text content"
        start_char:
          type: integer
          description: "Character position in original text where chunk starts"
        end_char:
          type: integer
          description: "Character position in original text where chunk ends (exclusive)"

    BinaryContent:
      type: object
      description: "Binary media content with format-specific metadata."
      properties:
        data:
          type: string
          format: byte
          description: "Base64-encoded binary data (valid WAV, PNG, etc.)"
        start_time_ms:
          type: number
          format: float
          description: "Audio: window start time in milliseconds"
        end_time_ms:
          type: number
          format: float
          description: "Audio: window end time in milliseconds"
        frame_index:
          type: integer
          description: "Animation: frame number"
        frame_delay_ms:
          type: integer
          description: "Animation: display delay in milliseconds"

    Chunk:
      description: "A chunk of content. Text chunks have mime_type text/plain."
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/TextContent"
            - $ref: "#/components/schemas/BinaryContent"
        - type: object
          required:
            - id
            - mime_type
          properties:
            id:
              type: integer
              x-go-type: uint32
              description: "Sequence number of the chunk (0, 1, 2, ...)"
            mime_type:
              type: string
              description: "MIME type: text/plain, audio/wav, image/png, etc."

    TextChunkOptions:
      type: object
      description: "Options specific to text chunking."
      properties:
        target_tokens:
          type: integer
          minimum: 0
          maximum: 1000000
          description: "Target number of tokens per chunk."
        overlap_tokens:
          type: integer
          minimum: 0
          maximum: 1000000
          description: "Number of tokens to overlap between consecutive chunks. Helps maintain context across chunk boundaries. Only used by fixed-size chunkers."
        separator:
          type: string
          description: "Separator string for splitting (e.g., '\\n\\n' for paragraphs). Only used by fixed-size chunkers."

    AudioChunkOptions:
      type: object
      description: "Options specific to audio chunking."
      properties:
        window_duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: "Window duration in milliseconds for fixed-window audio chunking (default: 30000)."
        overlap_duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: "Overlap duration in milliseconds between audio chunks (default: 0)."

    ChunkOptions:
      type: object
      description: "Per-request configuration for chunking. All fields are optional - zero/omitted values use chunker defaults."
      properties:
        max_chunks:
          type: integer
          minimum: 0
          maximum: 4096
          description: >-
            Maximum number of chunks to generate per document. Zero (the
            default when omitted) means unlimited: the document is chunked in
            full. Set an explicit value up to 4096 to cap output; any chunks
            beyond the cap are silently omitted, so treat a result whose
            chunk count equals `max_chunks` as potentially truncated.
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Confidence threshold for model-based chunking (0.0-1.0)."
        text:
          $ref: "#/components/schemas/TextChunkOptions"
        audio:
          $ref: "#/components/schemas/AudioChunkOptions"
        embedding:
          $ref: '#/components/schemas/ChunkEmbeddingTarget'
        policy:
          $ref: '#/components/schemas/MediaChunkPolicy'

    VADOptions:
      type: object
      description: "Options for Voice Activity Detection (VAD) based audio segmentation."
      properties:
        min_silence_duration_ms:
          type: integer
          description: "Minimum silence duration (ms) to split speech segments. Gaps shorter than this are merged. Higher values produce longer, fewer segments. Default: 300."
        min_speech_duration_ms:
          type: integer
          description: "Minimum speech duration (ms) for a segment to be kept. Shorter segments are discarded. Default: 250."
        speech_pad_ms:
          type: integer
          description: "Padding (ms) added before and after detected speech. Default: 30."
        max_segment_duration_ms:
          type: integer
          description: "Maximum segment duration (ms). Segments longer than this are split. Useful for Whisper-compatible chunking. Default: 30000."

    InferenceAudioChunkConfig:
      type: object
      description: "Audio chunking configuration for inference, including VAD options."
      properties:
        window_duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: "Window duration in milliseconds for fixed-window audio chunking (default: 30000)."
        overlap_duration_ms:
          type: integer
          minimum: 0
          maximum: 86400000
          description: "Overlap duration in milliseconds between audio chunks (default: 0)."
        vad:
          $ref: "#/components/schemas/VADOptions"

    InferenceChunkConfig:
      type: object
      description: |
        Configuration for chunking requests to Antfly inference.
        Combines shared text options with inference-specific audio/VAD options.
      properties:
        model:
          type: string
          description: "The chunking model to use. Antfly inference implements only 'fixed' (token-count text chunking and fixed audio windows); other model names are rejected."
          default: "fixed"
          example: "fixed"
        max_chunks:
          type: integer
          minimum: 0
          maximum: 4096
          description: >-
            Maximum number of chunks to generate per document. Zero (the
            default when omitted) means unlimited: the document is chunked in
            full. Set an explicit value up to 4096 to cap output; any chunks
            beyond the cap are silently omitted, so treat a result whose
            chunk count equals `max_chunks` as potentially truncated.
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Confidence threshold for model-based chunking (0.0-1.0). Validated but not used by the built-in fixed chunker."
        text:
          $ref: "#/components/schemas/TextChunkOptions"
        audio:
          $ref: "#/components/schemas/InferenceAudioChunkConfig"

    InferenceChunkRequest:
      type: object
      required:
        - input
      properties:
        input:
          description: |
            Input content to chunk. Supports two formats:
            - Text string: `"This is a long document..."`
            - ContentPart: `{"type": "media", "data": "<base64>", "mime_type": "audio/wav"}`
            - ContentPart: `{"type": "text", "text": "..."}`
          oneOf:
            - type: string
              description: "Text to chunk"
            - $ref: "#/components/schemas/InferenceChunkContentPart"
              description: "Content part (text or media)"
        config:
          $ref: "#/components/schemas/InferenceChunkConfig"
        embedding:
          $ref: '#/components/schemas/ChunkEmbeddingTarget'
        policy:
          $ref: '#/components/schemas/MediaChunkPolicy'
        source_id:
          type: string
          description: Caller source identity; immutable content is independently fingerprinted.
        source_version:
          type: string
          description: Immutable caller version, included in continuation and plan identity.
        continuation:
          type: string
          description: Resume the exact source and semantic plan; changed inputs are rejected.
        include_content:
          type: boolean
          default: false
          description: In model-aware mode include chunk payloads in addition to mandatory descriptors.
        stream:
          type: boolean
          default: false
          description: In model-aware mode return NDJSON chunk events followed by a terminal coverage response.

    InferenceChunkContentPart:
      description: "Content part supported by chunking requests."
      oneOf:
        - $ref: "generating.yaml#/components/schemas/TextContentPart"
        - $ref: "generating.yaml#/components/schemas/MediaContentPart"
        - $ref: "#/components/schemas/ChunkSourceReference"

    ChunkEmbeddingTarget:
      type: object
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
        model_identity:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: Optional required embedding-weight/recipe identity; a changed model is rejected before delivery.
        task_type:
          type: string
          default: RETRIEVAL_DOCUMENT
        dimensions:
          type: integer
          minimum: 1
        execute:
          type: boolean
          x-go-type-skip-optional-pointer: false
          default: true
          description: False resolves model limits and plans descriptors without running embedding inference.
        allow_partial:
          type: boolean
          default: false
          description: Return explicit per-chunk failures and gaps instead of aborting on the first non-retryable embedding failure.
    MediaChunkPolicy:
      type: object
      description: Semantic chunk policy. Execution batch size and queue depth are deliberately separate.
      properties:
        max_text_bytes:
          type: integer
          minimum: 4
          maximum: 16777216
          default: 1048576
          description: Explicit byte ceiling per text chunk, independently of the target tokenizer budget.
        target_tokens:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 500
        overlap_tokens:
          x-go-type-skip-optional-pointer: false
          type: integer
          minimum: 0
          default: 50
        window_ns:
          type: integer
          format: int64
          minimum: 1
          default: 32000000000
        overlap_ns:
          type: integer
          format: int64
          minimum: 0
          default: 0
        step_ns:
          type: integer
          format: int64
          minimum: 1
          default: 1000000000
        video_hold:
          type: integer
          minimum: 0
          maximum: 1
          default: 1
          x-go-type-skip-optional-pointer: false
          description: Select the displayed picture at each video cadence target, including VFR holds. Zero retains at-or-after timestamp sampling.
        max_frames:
          type: integer
          minimum: 1
          maximum: 32
          default: 32
        tile_width:
          type: integer
          minimum: 0
          default: 0
        tile_height:
          type: integer
          minimum: 0
          default: 0
        tile_overlap:
          type: integer
          minimum: 0
          default: 0
        audio_pause_ns:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Optional minimum silence duration for choosing an earlier boundary; no samples are discarded.
        audio_pause_search_ns:
          type: integer
          format: int64
          minimum: 0
          default: 5000000000
        audio_silence_milli:
          x-go-type-skip-optional-pointer: false
          type: integer
          minimum: 0
          maximum: 1000
          default: 10
          description: Absolute normalized PCM amplitude threshold in thousandths.
    ChunkCoordinates:
      type: object
      required: [kind]
      description: Original-source coordinates; time intervals are half-open integer nanoseconds and text spans are UTF-8 byte offsets.
      properties:
        kind:
          type: string
          enum: [text, pdf, image, gif, audio, video]
        start_byte:
          type: integer
          format: int64
          minimum: 0
        end_byte:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 1
        region:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
          description: Full-raster coordinates [left, top, right, bottom], end exclusive; raster_width/height declare the basis, including adaptively rendered PDF pages.
        raster_width:
          type: integer
          minimum: 1
          description: Width of the complete source/prepared-page raster before tiling, not the returned crop width.
        raster_height:
          type: integer
          minimum: 1
          description: Height of the complete source/prepared-page raster before tiling; map PDF regions through page_box and page_rotation.
        start_ns:
          type: integer
          format: int64
        end_ns:
          type: integer
          format: int64
        first_picture:
          type: integer
          format: int64
          minimum: 0
        selected_pictures:
          type: array
          maxItems: 32
          items:
            type: integer
            format: int64
            minimum: 0
          description: Ordered selectors in the immutable source index, including repeated cadence selections.
        picture_basis:
          type: string
          enum: [logical, packet_assembly]
          description: WebM logical presentation pictures or the first MP4 packet of a completed picture assembly.
        picture_count:
          type: integer
          minimum: 0
        start_sample:
          type: integer
          format: int64
        end_sample:
          type: integer
          format: int64
        sample_rate:
          type: integer
          format: int64
        start_tick:
          type: integer
          format: int64
        end_tick:
          type: integer
          format: int64
        timescale:
          type: integer
          format: int64
        page_rotation:
          type: integer
          format: int64
        page_box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
          description: Original PDF page box in PDF user-space coordinates.
    ChunkDescriptor:
      type: object
      required: [id, ordinal, coordinates, input_tokens]
      properties:
        id:
          type: string
          description: Opaque source-plan-bound inference identity; not a database artifact ID.
        ordinal:
          type: integer
          format: int64
          minimum: 0
        coordinates:
          $ref: '#/components/schemas/ChunkCoordinates'
        input_tokens:
          type: integer
          minimum: 0
    ChunkEmbeddingError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ChunkEmbeddingObject:
      type: object
      required: [descriptor, mime_type]
      properties:
        descriptor:
          $ref: '#/components/schemas/ChunkDescriptor'
        mime_type:
          type: string
        embedding:
          type: array
          items:
            type: number
            format: float
        error:
          $ref: '#/components/schemas/ChunkEmbeddingError'
        text:
          type: string
        data:
          type: string
          format: byte
          description: Optional base64 payload; source coordinates remain mandatory.
    ChunkEmbeddingResponse:
      type: object
      required: [object, data, status, source_fingerprint, source_version, plan_id, model, model_identity, model_revision, task_type, dimensions, policy, start_ordinal, covered_through_ordinal, gaps]
      properties:
        object:
          type: string
          enum: [chunk.embedding.list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChunkEmbeddingObject'
        status:
          type: string
          enum: [complete, partial, failed]
          description: Completion of this response's suffix starting at start_ordinal; callers must retain earlier acknowledged coverage.
        source_reference:
          $ref: '#/components/schemas/ChunkSourceReference'
        source_id:
          type: string
        source_fingerprint:
          type: string
        source_version:
          type: string
        plan_id:
          type: string
        model:
          type: string
        model_identity:
          type: string
        model_revision:
          type: string
          description: Model generation revision used by inference capability leases.
        task_type:
          type: string
        dimensions:
          type: integer
        policy:
          $ref: '#/components/schemas/MediaChunkPolicy'
        start_ordinal:
          type: integer
          format: int64
          minimum: 0
        covered_through_ordinal:
          type: integer
          format: int64
          minimum: 0
          description: Exclusive end of acknowledged output ordinals; failed chunk coordinates are reported in gaps.
        error:
          $ref: '#/components/schemas/ChunkEmbeddingError'
        next_continuation:
          type: string
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/ChunkCoordinates'

    ChunkEmbeddingEvent:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [chunk.embedding]
        data:
          $ref: '#/components/schemas/ChunkEmbeddingObject'
    ChunkEmbeddingTerminalEvent:
      type: object
      required: [object, response]
      properties:
        object:
          type: string
          enum: [chunk.embedding.complete]
        response:
          $ref: '#/components/schemas/ChunkEmbeddingResponse'
    ChunkEmbeddingInitializationErrorEvent:
      type: object
      required: [object, code]
      properties:
        object:
          type: string
          enum: [chunk.embedding.error]
        code:
          type: string

    ChunkEmbeddingContext:
      type: object
      required: [source_fingerprint, source_version, plan_id, model, model_identity, model_revision, task_type, policy, start_ordinal]
      properties:
        source_reference:
          $ref: '#/components/schemas/ChunkSourceReference'
        source_id:
          type: string
        source_fingerprint:
          type: string
        source_version:
          type: string
        plan_id:
          type: string
        model:
          type: string
        model_identity:
          type: string
        model_revision:
          type: string
        task_type:
          type: string
        dimensions:
          type: integer
          description: Known vector width; may be absent before a planning-only or failed first item.
        policy:
          $ref: '#/components/schemas/MediaChunkPolicy'
        start_ordinal:
          type: integer
          format: int64
          minimum: 0
    ChunkEmbeddingStartEvent:
      type: object
      required: [object, context]
      properties:
        object:
          type: string
          enum: [chunk.embedding.start]
        context:
          $ref: '#/components/schemas/ChunkEmbeddingContext'

    ChunkSourceReference:
      type: object
      required: [type, uri, mime_type, version, length]
      properties:
        type:
          type: string
          enum: [source]
        uri:
          type: string
          maxLength: 16384
          description: HTTP(S) or S3 object URI resolved through configured content security and credentials.
        mime_type:
          type: string
        version:
          type: string
          minLength: 1
          maxLength: 4096
          description: Quoted strong HTTP/S3 ETag or immutable S3 version ID; enforced on every range read.
        version_kind:
          type: string
          enum: [strong_etag, s3_version_id]
          description: Defaults to strong_etag. S3 version IDs are supported only for S3 sources.
        length:
          type: integer
          format: int64
          minimum: 1
          description: Exact immutable object length, verified against Content-Range.
