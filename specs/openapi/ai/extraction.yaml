openapi: 3.0.3
info:
  title: Antfly AI Extraction Schemas
  version: 1.0.0
  description: Shared schema-driven extraction request and response types.
paths: {}
components:
  schemas:
    ExtractionProvider:
      type: string
      enum:
      - antfly
      - pioneer
      - openai
      - mock
    ExtractionConfig:
      type: object
      required:
      - provider
      properties:
        provider:
          $ref: '#/components/schemas/ExtractionProvider'
        model:
          type: string
        schema_version:
          allOf:
          - $ref: '#/components/schemas/ExtractionSchemaVersion'
          x-go-type-skip-optional-pointer: false
        url:
          type: string
        api_url:
          type: string
        api_key:
          type: string
        bearer_token:
          type: string
        schema:
          $ref: '#/components/schemas/ExtractionSchema'
        options:
          $ref: '#/components/schemas/ExtractionOptions'
    ExtractionInput:
      type: object
      required:
      - content
      properties:
        id:
          type: string
        content:
          $ref: ../shared/generating.yaml#/components/schemas/ChatMessageContent
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionToken'
        metadata:
          type: object
          additionalProperties: true
        schema:
          description: Version 2 only. Replaces the complete shared schema for this input.
          allOf:
          - $ref: '#/components/schemas/ExtractionSchema'
          x-go-type-skip-optional-pointer: false
        options:
          description: Version 2 only. Replaces the complete shared options; omitted fields use runtime defaults.
          allOf:
          - $ref: '#/components/schemas/ExtractionOptions'
          x-go-type-skip-optional-pointer: false
    ExtractionToken:
      type: object
      required:
      - text
      properties:
        text:
          type: string
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
    ExtractionRelationSchema:
      type: object
      description: Optional source and target labels constrain relation endpoints. A target requires a source.
      required:
      - type
      properties:
        type:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
        description:
          type: string
          description: Version 2 model-facing relation description.
          x-go-type-skip-optional-pointer: false
        threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
    ExtractionClassificationSchema:
      type: object
      required:
      - name
      - labels
      properties:
        name:
          type: string
        labels:
          type: array
          items:
            type: string
        multi_label:
          type: boolean
          description: 'The server uses false when omitted. Version 1: return highest-ranked labels up to top_k when false, or labels meeting options.threshold
            when true. Version 2: selects ordinary single or multi classification unless mode is specified; classification.threshold
            controls the decision threshold.'
        hypothesis_template:
          type: string
          description: Version 1 NLI hypothesis template with {} as the label placeholder; the server uses
            "This example is {}." when omitted. Version 2 GLiNER boundary
            extraction rejects an explicit hypothesis_template; use prompt/instruction and label_definitions for
            model conditioning.
        top_k:
          type: integer
          minimum: 1
          description: Maximum labels for ordinary single-label classification; the server uses 1 when omitted.
            Version 2 constrained or ordinal selection uses min_labels/max_labels. Advanced set-selection options
            or cross-task constraints on any classification in the collection reject every explicit top_k in that
            collection, including 1. Omit top_k when using these options.
        mode:
          type: string
          enum:
          - single
          - multi
          - ordinal
          description: Version 2 classification mode. Ordinal labels are ordered from lowest to highest.
          x-go-type-skip-optional-pointer: false
        label_definitions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractionLabelDefinition'
          x-go-type-skip-optional-pointer: false
        min_labels:
          type: integer
          minimum: 0
          x-go-type-skip-optional-pointer: false
        max_labels:
          type: integer
          minimum: 0
          nullable: true
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          description: Version 2 maximum selected labels. Explicit null means no maximum; omission preserves mode
            defaults.
        ordered:
          type: boolean
          x-go-type-skip-optional-pointer: false
        threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionDecisionProbability'
          x-go-type-skip-optional-pointer: false
        candidate_threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        activation:
          type: string
          enum:
          - auto
          - sigmoid
          - softmax
          x-go-type-skip-optional-pointer: false
        temperature:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          x-go-type-skip-optional-pointer: false
        default:
          type: string
          description: Version 2 fallback label; must be declared in labels.
          x-go-type-skip-optional-pointer: false
        prompt:
          type: string
          description: Version 2 model-facing task instruction. Mutually exclusive with instruction.
          x-go-type-skip-optional-pointer: false
        instruction:
          type: string
          description: Alias of prompt.
          x-go-type-skip-optional-pointer: false
        examples:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ExtractionClassificationExample'
          x-go-type-skip-optional-pointer: false
    ExtractionStructureField:
      oneOf:
      - type: string
      - type: object
        properties:
          type:
            type: string
            enum:
            - str
            - string
            - list
            - array
          enum:
            type: array
            minItems: 2
            items:
              type: string
              minLength: 1
          dtype:
            type: string
            enum:
            - str
            - list
            x-go-type-skip-optional-pointer: false
          choices:
            type: array
            minItems: 2
            items:
              type: string
            x-go-type-skip-optional-pointer: false
          description:
            type: string
            x-go-type-skip-optional-pointer: false
          threshold:
            allOf:
            - $ref: '#/components/schemas/ExtractionProbability'
            x-go-type-skip-optional-pointer: false
          cardinality:
            type: string
            enum:
            - optional_one
            - required_one
            - zero_or_more
            - one_or_more
            description: Version 2 explicit cardinality. Required fields are validated after record assignment.
            x-go-type-skip-optional-pointer: false
          exclusive:
            type: boolean
            description: Version 2 field spans cannot be assigned to multiple record instances.
            x-go-type-skip-optional-pointer: false
          validators:
            type: array
            items:
              $ref: '#/components/schemas/ExtractionRegexValidator'
            x-go-type-skip-optional-pointer: false
        additionalProperties: true
    ExtractionStructureSchema:
      type: object
      required:
      - fields
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/ExtractionStructureField'
        mode:
          type: string
          enum:
          - natural
          - latent
          - anchorless
          description: Version 2 record grouping. Omission preserves one-record extraction.
          x-go-type-skip-optional-pointer: false
        anchor:
          type: string
          description: Natural mode only; defaults to the first declared field.
          x-go-type-skip-optional-pointer: false
        occurrence_policy:
          type: string
          enum:
          - all
          - first
          - error_on_ambiguous
          - latent_all
          x-go-type-skip-optional-pointer: false
      additionalProperties: true
    ExtractionSchema:
      type: object
      description: 'Version 1 selects one extraction family; entities may accompany relations.

        With schema_version 2, entities, attributes, classifications, structures,

        and ordinary relations may share one encoded input. joint_ie is a separate,

        mutually exclusive typed graph schema. The version 2 compiler rejects

        unknown fields and validates all references before model execution.

        '
      properties:
        entities:
          type: array
          items:
            type: string
            minLength: 1
        relations:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionRelationSchema'
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionClassificationSchema'
        structures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractionStructureSchema'
        entity_definitions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractionEntityDefinition'
          x-go-type-skip-optional-pointer: false
        entity_attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractionAttributeGroup'
          x-go-type-skip-optional-pointer: false
        classification_constraints:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/ExtractionClassificationConstraint'
          x-go-type-skip-optional-pointer: false
        joint_ie:
          allOf:
          - $ref: '#/components/schemas/ExtractionJointSchema'
          x-go-type-skip-optional-pointer: false
      additionalProperties: true
    ExtractionReaderOptions:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        url:
          type: string
        api_url:
          type: string
      additionalProperties: true
    ExtractionResolverOptions:
      type: object
      description: Optional cross-input entity and relation deduplication.
      properties:
        similarity_threshold:
          type: number
          format: float
          default: 0.85
          minimum: 0
          maximum: 1
        type_must_match:
          type: boolean
          default: true
        min_entity_confidence:
          type: number
          format: float
          default: 0
          minimum: 0
          maximum: 1
        min_relation_confidence:
          type: number
          format: float
          default: 0
          minimum: 0
          maximum: 1
        deduplicate_relations:
          type: boolean
          default: true
        track_provenance:
          type: boolean
          default: true
    ExtractionOptions:
      type: object
      properties:
        threshold:
          type: number
          format: float
        flat_ner:
          type: boolean
        include_confidence:
          type: boolean
        include_spans:
          type: boolean
        word_splitter:
          type: string
          enum:
          - whitespace
          - char
          description: Version 2 source word splitting. char keeps ASCII alphanumeric and @._-+ runs together
            and splits other non-whitespace codepoints, preserving original source offsets.
            An input's options replace the shared options in full; omitted word_splitter
            uses whitespace. Explicit word_splitter is rejected by version 1.
          x-go-type-skip-optional-pointer: false
        overlap:
          type: string
          enum:
          - allow
          - nested
          - flat
          - disallow
          - longest
          description: Version 2 overlap selection. flat/disallow prohibit overlap, nested permits containment,
            longest removes strictly contained spans.
          x-go-type-skip-optional-pointer: false
        offset_unit:
          allOf:
          - $ref: '#/components/schemas/ExtractionOffsetUnit'
          x-go-type-skip-optional-pointer: false
        long_document:
          allOf:
          - $ref: '#/components/schemas/ExtractionLongDocumentOptions'
          x-go-type-skip-optional-pointer: false
        decoder:
          allOf:
          - $ref: '#/components/schemas/ExtractionDecoderOptions'
          x-go-type-skip-optional-pointer: false
        joint_ie:
          allOf:
          - $ref: '#/components/schemas/ExtractionJointOptions'
          x-go-type-skip-optional-pointer: false
        reader:
          $ref: '#/components/schemas/ExtractionReaderOptions'
        resolver:
          $ref: '#/components/schemas/ExtractionResolverOptions'
      additionalProperties: true
    ExtractionRequest:
      type: object
      description: Atomic extraction request. Every input is validated before inference; failures return no partial
        data.
      required:
      - model
      - inputs
      - schema
      properties:
        model:
          type: string
          minLength: 1
        schema_version:
          allOf:
          - $ref: '#/components/schemas/ExtractionSchemaVersion'
          x-go-type-skip-optional-pointer: false
        inputs:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/ExtractionInput'
        schema:
          $ref: '#/components/schemas/ExtractionSchema'
        options:
          $ref: '#/components/schemas/ExtractionOptions'
    ExtractionEntity:
      type: object
      required:
      - label
      - text
      properties:
        label:
          type: string
        text:
          type: string
        start:
          type: integer
        end:
          type: integer
        score:
          type: number
          format: float
        attributes:
          type: object
          description: Version 2 span attributes. Attribute confidence is retained independently of include_confidence.
          additionalProperties:
            $ref: '#/components/schemas/ExtractionAttributeSelection'
          x-go-type-skip-optional-pointer: false
    ExtractionRelationEndpoint:
      type: object
      properties:
        entity_index:
          type: integer
        id:
          type: string
        label:
          type: string
          description: Entity type when the endpoint has a typed identity.
          x-go-type-skip-optional-pointer: false
        text:
          type: string
          description: Version 2 endpoint surface, including endpoints absent from the entities list.
          x-go-type-skip-optional-pointer: false
        start:
          type: integer
          minimum: 0
          x-go-type-skip-optional-pointer: false
        end:
          type: integer
          minimum: 0
          x-go-type-skip-optional-pointer: false
        score:
          type: number
          format: float
          x-go-type-skip-optional-pointer: false
      additionalProperties: true
    ExtractionRelation:
      type: object
      required:
      - type
      properties:
        type:
          type: string
        source:
          $ref: '#/components/schemas/ExtractionRelationEndpoint'
        target:
          $ref: '#/components/schemas/ExtractionRelationEndpoint'
        score:
          type: number
          format: float
        derived:
          type: boolean
          description: Version 2 inverse or symmetric companion derived from a selected relation.
          x-go-type-skip-optional-pointer: false
      additionalProperties: true
    ExtractionClassification:
      type: object
      required:
      - name
      - label
      properties:
        name:
          type: string
        label:
          type: string
        score:
          type: number
          format: float
      additionalProperties: true
    ExtractionObject:
      type: object
      properties:
        id:
          type: string
        offset_unit:
          allOf:
          - $ref: '#/components/schemas/ExtractionOffsetUnit'
          x-go-type-skip-optional-pointer: false
        entities:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionEntity'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionRelation'
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionClassification'
        structures:
          type: object
          description: Structure name to record array. Each record maps field names to value objects or arrays of
            value objects; v2 value objects follow ExtractionFieldValue.
          additionalProperties: true
        structure_metadata:
          type: object
          description: Version 2 metadata arrays aligned with each named structure's record array.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ExtractionRecordMetadata'
          x-go-type-skip-optional-pointer: false
        solvers:
          allOf:
          - $ref: '#/components/schemas/ExtractionSolverDiagnostics'
          x-go-type-skip-optional-pointer: false
        long_document:
          allOf:
          - $ref: '#/components/schemas/ExtractionLongDocumentMetadata'
          x-go-type-skip-optional-pointer: false
      additionalProperties: true
    ExtractionResponse:
      type: object
      required:
      - object
      - model
      - data
      properties:
        object:
          type: string
          enum:
          - extraction
        model:
          type: string
        schema_version:
          allOf:
          - $ref: '#/components/schemas/ExtractionSchemaVersion'
          x-go-type-skip-optional-pointer: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionObject'
        usage:
          type: object
          additionalProperties: true
    ExtractionSchemaVersion:
      type: integer
      enum:
      - 1
      - 2
      default: 1
      description: Omission preserves the legacy extraction contract. Version 2 opts into strict mixed-task schemas,
        per-input replacements and explicit offsets; the selected model/runtime must support every requested feature.
    ExtractionProbability:
      type: number
      format: double
      minimum: 0
      maximum: 1
      x-go-type-skip-optional-pointer: false
    ExtractionDecisionProbability:
      type: number
      format: double
      minimum: 0
      maximum: 1
      exclusiveMinimum: true
      exclusiveMaximum: true
      x-go-type-skip-optional-pointer: false
      description: Finite centered-logit decisions require a threshold strictly between zero and one.
    ExtractionOffsetUnit:
      type: string
      description: Half-open offsets into the immutable caller text. Version 2 defaults to utf8_bytes. No normalization,
        lowercasing or synthetic suffix is included in these coordinates.
      enum:
      - utf8_bytes
      - unicode_codepoints
      - utf16_codeunits
    ExtractionRegexValidator:
      type: object
      required:
      - pattern
      properties:
        type:
          type: string
          enum:
          - regex
          x-go-type-skip-optional-pointer: false
        pattern:
          type: string
          maxLength: 4096
        mode:
          type: string
          enum:
          - full
          - partial
          default: full
          x-go-type-skip-optional-pointer: false
        exclude:
          type: boolean
          x-go-type-skip-optional-pointer: false
          default: false
        flags:
          type: integer
          minimum: 0
          x-go-type-skip-optional-pointer: false
          default: 2
          description: Python-compatible regex flags supported by the active bounded validator engine; unsupported
            flags or syntax fail validation.
      additionalProperties: false
    ExtractionLabelDefinition:
      type: object
      properties:
        description:
          type: string
          description: Model-facing label description.
          x-go-type-skip-optional-pointer: false
      additionalProperties: false
    ExtractionClassificationExample:
      oneOf:
      - type: object
        required:
        - input
        - label
        properties:
          input:
            type: string
          label:
            type: string
        additionalProperties: false
      - type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
        description: A two-string [input,label] pair.
    ExtractionEntityDefinition:
      type: object
      properties:
        description:
          type: string
          x-go-type-skip-optional-pointer: false
        dtype:
          type: string
          enum:
          - str
          - list
          x-go-type-skip-optional-pointer: false
        type:
          type: string
          enum:
          - str
          - string
          - list
          - array
          x-go-type-skip-optional-pointer: false
        threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        validators:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionRegexValidator'
          maxItems: 64
          x-go-type-skip-optional-pointer: false
      additionalProperties: false
    ExtractionAttributeGroup:
      type: object
      required:
      - labels
      properties:
        labels:
          type: array
          items:
            type: string
          maxItems: 128
          minItems: 1
        multi_label:
          type: boolean
          x-go-type-skip-optional-pointer: false
          default: false
        threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        applies_to:
          type: array
          items:
            type: string
          maxItems: 128
          x-go-type-skip-optional-pointer: false
        qualify_labels:
          type: boolean
          x-go-type-skip-optional-pointer: false
          default: false
      additionalProperties: false
      description: Version 2 attributes are scored on retained entity spans using shared encoded states. Omitted
        applies_to selects all entities; [] selects none. Raw labels must be unique across groups, including when
        qualify_labels is true. Group names text,confidence,start,end are reserved.
    ExtractionLongDocumentOptions:
      type: object
      properties:
        mode:
          type: string
          enum:
          - reject
          - window
          default: reject
          x-go-type-skip-optional-pointer: false
        window_words:
          type: integer
          minimum: 1
          maximum: 4096
          x-go-type-skip-optional-pointer: false
          description: Maximum body words per window; also bounded by the checkpoint and encoded token limits.
        overlap_words:
          type: integer
          minimum: 0
          maximum: 4095
          x-go-type-skip-optional-pointer: false
        max_windows:
          type: integer
          minimum: 1
          maximum: 128
          x-go-type-skip-optional-pointer: false
        record_identity:
          type: string
          enum: [occurrence, semantic]
          default: occurrence
          description: Identity of latent, anchorless and legacy records across windows. Occurrence uses exact source spans; semantic explicitly merges equal field values. Natural records always use their exact source anchor. This is independent of annotation occurrence_policy.
          x-go-type-skip-optional-pointer: false
      additionalProperties: false
      description: Version 2 never silently truncates. Reject is the default. Windowing requires an enabled runtime
        capability, reconstructs document-global offsets and revalidates all hard graph constraints after merging.
    ExtractionLongDocumentMetadata:
      type: object
      additionalProperties: false
      required: [version, window_count, window_policy, classification_aggregation, duplicate_score, natural_record_identity, other_record_identity, solver_optimality_scope]
      properties:
        version:
          type: integer
          enum: [1]
        window_count:
          type: integer
          minimum: 1
        window_policy:
          type: string
          enum: [source_words_midpoint_ownership]
        classification_aggregation:
          type: string
          enum: [owned_word_weighted_mean_raw_logits]
        duplicate_score:
          type: string
          enum: [maximum_calibrated_score]
        natural_record_identity:
          type: string
          enum: [exact_source_anchor]
        other_record_identity:
          type: string
          enum: [occurrence, semantic]
        solver_optimality_scope:
          type: string
          enum: [retained_candidate_graph]
    ExtractionDecoderOptions:
      type: object
      properties:
        algorithm:
          type: string
          enum:
          - auto
          - exact
          - beam
          description: Omit to use the model's per-task default. GLiNER2.5 uses source-compatible beam selection for single-window JointIE and automatic selection for classification. Windowed JointIE uses the native automatic global solver with independent window resources. Explicit values select the native bounded search algorithm.
          x-go-type-skip-optional-pointer: false
        beam_width:
          type: integer
          minimum: 1
          maximum: 1024
          x-go-type-skip-optional-pointer: false
        max_search_nodes:
          type: integer
          minimum: 0
          maximum: 200000
          x-go-type-skip-optional-pointer: false
        max_local_assignments:
          type: integer
          minimum: 1
          maximum: 4096
          x-go-type-skip-optional-pointer: false
        best_effort:
          type: boolean
          x-go-type-skip-optional-pointer: false
          default: false
      additionalProperties: false
      description: Bounded classification and JointIE selection. Exact optimality is with respect to admitted candidates.
        A completed beam may be feasible without an optimality proof. By default exhausted search is an error; best_effort
        permits only a validated feasible witness and reports exhausted:true.
    ExtractionJointOptions:
      type: object
      properties:
        candidate_threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        entity_threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        relation_role_threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        top_k_entities:
          type: integer
          minimum: 1
          maximum: 256
          x-go-type-skip-optional-pointer: false
        top_k_roles:
          type: integer
          minimum: 1
          maximum: 32
          x-go-type-skip-optional-pointer: false
        relation_pair_cap:
          type: integer
          minimum: 1
          maximum: 128
          x-go-type-skip-optional-pointer: false
        max_edges_per_type:
          type: integer
          minimum: 1
          maximum: 256
          x-go-type-skip-optional-pointer: false
        entity_weight:
          type: number
          format: double
          minimum: 0
          x-go-type-skip-optional-pointer: false
        relation_weight:
          type: number
          format: double
          minimum: 0
          x-go-type-skip-optional-pointer: false
      additionalProperties: false
      description: JointIE proposal admission and utility calibration. Entity candidate caps are bypassed for endpoints
        of retained relation proposals, subject to server hard bounds. entity_threshold overrides candidate admission,
        not entity decision thresholds.
    ExtractionJointEntity:
      type: object
      properties:
        description:
          type: string
          x-go-type-skip-optional-pointer: false
        threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionDecisionProbability'
          x-go-type-skip-optional-pointer: false
        candidate_threshold:
          allOf:
          - $ref: '#/components/schemas/ExtractionProbability'
          x-go-type-skip-optional-pointer: false
        max_candidates:
          type: integer
          minimum: 1
          maximum: 256
          x-go-type-skip-optional-pointer: false
        allow_nested:
          type: boolean
