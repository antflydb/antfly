openapi: 3.0.3
info:
  title: Antfly AI Extraction Schemas
  version: "1.0.0"
  description: Shared schema-driven extraction request and response types.
paths: {}
components:
  schemas:
    ExtractionProvider:
      type: string
      enum:
        - antfly
        - pioneer
        - openai
        - mock
    ExtractionConfig:
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: "#/components/schemas/ExtractionProvider"
        model:
          type: string
        url:
          type: string
        api_url:
          type: string
        api_key:
          type: string
        bearer_token:
          type: string
        schema:
          $ref: "#/components/schemas/ExtractionSchema"
        options:
          $ref: "#/components/schemas/ExtractionOptions"
    ExtractionInput:
      type: object
      required:
        - content
      properties:
        id:
          type: string
        content:
          $ref: "../shared/generating.yaml#/components/schemas/ChatMessageContent"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionToken"
        metadata:
          type: object
          additionalProperties: true
    ExtractionToken:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
    ExtractionRelationSchema:
      type: object
      description: Optional source and target labels constrain relation endpoints. A target requires a source.
      required:
        - type
      properties:
        type:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    ExtractionClassificationSchema:
      type: object
      required:
        - name
        - labels
      properties:
        name:
          type: string
        labels:
          type: array
          items:
            type: string
        multi_label:
          type: boolean
          default: false
    ExtractionStructureField:
      oneOf:
        - type: string
        - type: object
          properties:
            type:
              type: string
              enum: [str, string, list, array]
            enum:
              type: array
              minItems: 2
              items:
                type: string
                minLength: 1
          additionalProperties: true
    ExtractionStructureSchema:
      type: object
      required:
        - fields
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/ExtractionStructureField"
      additionalProperties: true
    ExtractionSchema:
      type: object
      description: |
        Selects one extraction operation family per request. Entity labels may
        accompany relation schemas so relation extraction can return its
        participating entities in the same response.
      properties:
        entities:
          type: array
          items:
            type: string
            minLength: 1
        relations:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionRelationSchema"
        classifications:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionClassificationSchema"
        structures:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExtractionStructureSchema"
      additionalProperties: true
    ExtractionReaderOptions:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        url:
          type: string
        api_url:
          type: string
      additionalProperties: true
    ExtractionResolverOptions:
      type: object
      description: Optional cross-input entity and relation deduplication.
      properties:
        similarity_threshold:
          type: number
          format: float
          default: 0.85
          minimum: 0
          maximum: 1
        type_must_match:
          type: boolean
          default: true
        min_entity_confidence:
          type: number
          format: float
          default: 0
          minimum: 0
          maximum: 1
        min_relation_confidence:
          type: number
          format: float
          default: 0
          minimum: 0
          maximum: 1
        deduplicate_relations:
          type: boolean
          default: true
        track_provenance:
          type: boolean
          default: true
    ExtractionOptions:
      type: object
      properties:
        threshold:
          type: number
          format: float
        flat_ner:
          type: boolean
        include_confidence:
          type: boolean
        include_spans:
          type: boolean
        reader:
          $ref: "#/components/schemas/ExtractionReaderOptions"
        resolver:
          $ref: "#/components/schemas/ExtractionResolverOptions"
      additionalProperties: true
    ExtractionRequest:
      type: object
      required:
        - model
        - inputs
        - schema
      properties:
        model:
          type: string
          minLength: 1
        inputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExtractionInput"
        schema:
          $ref: "#/components/schemas/ExtractionSchema"
        options:
          $ref: "#/components/schemas/ExtractionOptions"
    ExtractionEntity:
      type: object
      required:
        - label
        - text
      properties:
        label:
          type: string
        text:
          type: string
        start:
          type: integer
        end:
          type: integer
        score:
          type: number
          format: float
    ExtractionRelationEndpoint:
      type: object
      properties:
        entity_index:
          type: integer
        id:
          type: string
      additionalProperties: true
    ExtractionRelation:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        source:
          $ref: "#/components/schemas/ExtractionRelationEndpoint"
        target:
          $ref: "#/components/schemas/ExtractionRelationEndpoint"
        score:
          type: number
          format: float
      additionalProperties: true
    ExtractionClassification:
      type: object
      required:
        - name
        - label
      properties:
        name:
          type: string
        label:
          type: string
        score:
          type: number
          format: float
      additionalProperties: true
    ExtractionObject:
      type: object
      properties:
        id:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionEntity"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionRelation"
        classifications:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionClassification"
        structures:
          type: object
          additionalProperties: true
      additionalProperties: true
    ExtractionResponse:
      type: object
      required:
        - object
        - model
        - data
      properties:
        object:
          type: string
          enum:
            - extraction
        model:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionObject"
        usage:
          type: object
          additionalProperties: true
