          maxItems: 4
          items:
            type: integer
        features:
          $ref: '#/components/schemas/DocumentTokenClassificationFeatures'
        best:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DocumentTokenClassificationResult'
