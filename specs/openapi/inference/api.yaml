          description: Relevance score for this prompt.
    RewriteRequest:
      type: object
      required:
        - model
        - inputs
      properties:
        model:
          type: string
          description: Name of Seq2Seq rewriter model from models_dir/rewriters/
          example: lmqg/flan-t5-small-squad-qg
        inputs:
          type: array
          items:
            type: string
          description: Input texts to rewrite/transform
          example:
            - 'Translate to German: Hello, how are you?'
    RewriteResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/RewriteObject'
          description: Rewritten text objects, one per input.
        model:
          type: string
          description: Name of model used for rewriting
        usage:
          $ref: '#/components/schemas/GenerateUsage'
    RewriteObject:
      type: object
      required:
        - object
        - index
        - texts
      properties:
        object:
          type: string
          enum:
            - rewrite
        index:
          type: integer
          description: Original input text index.
        texts:
          type: array
          items:
            type: string
          description: Rewritten texts for this input, one per beam.
    ClassifyRequest:
      type: object
      required:
        - model
        - texts
        - labels
      properties:
        model:
          type: string
          description: Name of classifier model from models_dir/classifiers/
          example: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
        texts:
          type: array
          items:
            type: string
          description: Texts to classify
          example:
            - I love this product!
            - The service was terrible.
        labels:
          type: array
          items:
            type: string
          description: |
            Candidate labels for zero-shot classification.
            The model will predict which label(s) best describe each text.
          example:
            - positive
            - negative
            - neutral
        hypothesis_template:
          type: string
          description: |
            Custom hypothesis template for NLI-based classification.
            Use "{}" as placeholder for the label.
            Default: "This example is {}."
          example: This text expresses a {} sentiment.
        multi_label:
          type: boolean
          default: false
          description: |
            If true, allows multiple labels per text (independent scoring).
            If false (default), scores are normalized across labels.
    ClassifyResult:
      type: object
      required:
        - label
        - score
      properties:
        label:
          type: string
          description: The predicted class/category
          example: positive
        score:
          type: number
          format: float
          description: Confidence score (0.0 to 1.0)
          example: 0.95
    ClassifyResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassifyObject'
          description: Classification result objects, one per input text.
        model:
          type: string
          description: Name of model used for classification
        usage:
          $ref: '#/components/schemas/GenerateUsage'
    ClassifyObject:
      type: object
      required:
        - object
        - index
        - classifications
      properties:
        object:
          type: string
          enum:
            - classification
        index:
          type: integer
          description: Original input text index.
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassifyResult'
          description: |
            Classification results for this input text.
    DocumentClassificationRequest:
      type: object
      required:
        - model
        - image_path
        - num_tokens
        - labels
      properties:
        model:
          type: string
          description: Name or path of the document classification model directory or checkpoint
          example: acme/layoutdoc-invoice-sequence
        image_path:
          type: string
          description: Absolute or server-local path to the page image
          example: /tmp/page.png
        num_tokens:
          type: integer
          minimum: 0
          description: Number of OCR/text tokens associated with the page
          example: 42
        labels:
          type: array
          items:
            type: string
          description: Labels in the same order expected by the checkpoint output head
          example:
            - invoice
            - form
            - email
        prefix:
          type: string
          description: Optional tensor prefix inside the safetensors checkpoint
          default: layoutdoc_sequence_head
          example: layoutdoc_sequence_head
    DocumentClassificationFeatures:
      type: object
      required:
        - num_tokens
        - image_width
        - image_height
        - image_components
        - mean_darkness
        - std_darkness
        - top_darkness
        - bottom_darkness
        - left_darkness
        - right_darkness
        - center_darkness
      properties:
        num_tokens:
          type: integer
        image_width:
          type: integer
        image_height:
          type: integer
        image_components:
          type: integer
        mean_darkness:
          type: number
          format: float
        std_darkness:
          type: number
          format: float
        top_darkness:
          type: number
          format: float
        bottom_darkness:
          type: number
          format: float
        left_darkness:
          type: number
          format: float
        right_darkness:
          type: number
          format: float
        center_darkness:
          type: number
          format: float
    DocumentClassificationResult:
      type: object
      required:
        - label
        - score
      properties:
        label:
          type: string
        score:
          type: number
          format: float
    DocumentClassificationResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentClassificationObject'
        model:
          type: string
        usage:
          $ref: '#/components/schemas/GenerateUsage'
    DocumentClassificationObject:
      type: object
      required:
        - object
