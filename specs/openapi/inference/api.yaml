        width:
          type: number
          format: float
        height:
          type: number
          format: float
        relative_position:
          type: number
          format: float
        bbox_phase_sin:
          type: number
          format: float
    DocumentTokenClassificationResult:
      type: object
      required:
        - label
        - score
