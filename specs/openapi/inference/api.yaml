openapi: 3.0.3
info:
  version: v1alpha1
  title: Inference API
  description: |
    Antfly inference is a local inference server for ONNX-based ML models.

    ## What is Antfly inference

    Antfly inference provides local ML inference with an OpenAI-compatible API:
    - **Embedding Generation**: OpenAI-compatible text embedding endpoints, with dense or sparse embedding payloads
    - **Text Chunking**: Semantic chunking with ONNX models or fixed-size fallback
    - **Reranking**: Relevance re-scoring for search results
    - **Extraction**: Schema-driven entity, relation, classification, and structured extraction
    - **Text Rewriting**: Transform text using Seq2Seq models (question generation, query generation, etc.)

    Download the latest release at https://antfly.io/docs/downloads

    ## When to Use Antfly inference

    Antfly inference can run standalone or as part of an Antfly cluster:
    - Local ONNX model inference without external API dependencies
    - OpenAI-compatible embedding payloads served at `/ai/v1/embed` and `/ai/v1/embeddings`
    - Semantic text chunking for RAG pipelines
    - Relevance reranking for improved search quality
    - Centralized model serving across distributed nodes
    - Privacy-preserving ML inference (data never leaves your infrastructure)

    ## Features

    ### Embedding Generation
    - **Models**: ONNX models auto-discovered from `{models_dir}/embedders/`
    - **API**: OpenAI-compatible payloads served at `/ai/v1/embed` and `/ai/v1/embeddings`
    - **Response Shape**: Each `data[i].embedding` is either a dense float vector or a sparse `{indices, values}` object

    ### Text Chunking
    - **Models**: Fixed-size chunking (always available) + ONNX models
    - **Model Discovery**: Auto-discovers models from `{models_dir}/chunkers/`
    - **Caching**: 2-minute TTL memory cache
    - **Fallback**: Falls back to fixed chunking if model fails

    ### Reranking
    - **Model Discovery**: Auto-discovers ONNX models from `{models_dir}/rerankers/`
    - **Quantization**: Automatically uses quantized models if available
    - **Input**: Pre-rendered text prompts (client handles field extraction)
  contact:
    name: Antfly
    url: https://github.com/antflydb/antfly
  license:
    name: All Rights Reserved
    url: https://antfly.io/legal
servers:
  - url: /ai/v1
    description: Inference API server
security: []
paths:
  /embed:
    post:
      summary: Create embeddings (alias of `/embeddings`)
      description: |
        Alias of `/ai/v1/embeddings`.

        Accepts the OpenAI embeddings request shape and returns the same OpenAI-compatible
        response envelope. For sparse-capable models, `data[i].embedding` is a sparse
        vector object instead of a dense float array.
      operationId: generateEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Embeddings generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chunk:
    post:
      summary: Chunk text into smaller segments
      description: |
        Splits text into smaller chunks using semantic or fixed-size chunking models.

        ## Models

        ### Fixed Chunking (always available)
        - Simple token-based splitting with overlap
        - Use model="fixed"
        - Fast and deterministic

        ### ONNX Models
        - Semantic chunking based on content similarity
        - Models auto-discovered from `models_dir/chunkers/`
        - Falls back to fixed chunking if model fails

        ## Caching

        Results are cached in memory for 2 minutes. Cache key includes both config and text content.
      operationId: chunkText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkRequest'
      responses:
        '200':
          description: Text chunked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /rerank_multimodal:
    post:
      summary: Rerank multimodal documents by relevance
      description: |
        Re-scores multimodal documents based on relevance to a text query.

        This endpoint accepts the same content-part image conventions as generation and embedding.
        Text-only requests can be served immediately. Image-bearing requests reserve the stable
        contract for native ColQwen-style late-interaction reranking as that encoder lands.
        Image-bearing requests already run native Zig image preprocessing and grid preparation.
      operationId: rerankMultimodalPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankMultimodalRequest'
      responses:
        '200':
          description: Documents reranked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          description: Invalid request or unsupported model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Multimodal reranking contract recognized but encoder path not implemented yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /rerank:
    post:
      summary: Rerank prompts by relevance
      description: |
        Re-scores pre-rendered text prompts based on relevance to a query using native or ONNX reranking models.

        ## Client Responsibilities

        The client must:
        1. Extract relevant fields from documents
        2. Render any templates
        3. Send pre-rendered text strings as `prompts`

        This design keeps inference stateless and allows clients to customize rendering logic.

        ## Models

        - Models are auto-discovered from `models_dir/rerankers/`
        - Cross-encoder rerankers are supported through the existing text scorer
        - Late-interaction text rerankers such as ColBERT can opt in with `model_manifest.json` capability `late_interaction` or `colbert`
        - Supports quantized models (`model_quantized.onnx`)
        - Automatically prefers quantized variants if available

        This endpoint is still text-only. Real ColQwen-style multimodal reranking requires a future request shape that carries page images or image-derived embeddings.

        For document-based reranking with field extraction, use the client-side
        `lib/reranking` package which handles rendering before calling this endpoint.
      operationId: rerankPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Prompts reranked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /generate:
    post:
      summary: Generate text using LLM (OpenAI-compatible)
      description: |
        Generates text using local LLM models (e.g., Gemma 3).
        Fully compatible with the OpenAI Chat Completions API.

        ## Models

        Models are auto-discovered from `models_dir/generators/` at startup.
        Use the `/ai/v1/models` endpoint to list available models.

        ## Streaming

        Set `stream: true` to receive Server-Sent Events (SSE) with incremental
        token deltas. Each event contains a `ChatCompletionChunk` object.
        The stream ends with `data: [DONE]`.

        ## Input Format

        Uses OpenAI-compatible chat format with messages array containing role
        (system, user, assistant) and content. Set `stream: true` for streaming responses.
      operationId: generateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: |
            Chat completion response. Returns JSON for non-streaming requests,
            or Server-Sent Events for streaming requests (stream: true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GenerateChunk'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /generate/batch:
    post:
      summary: Generate text for a synchronous batch of requests
      description: |
        Runs multiple non-streaming generation requests as one synchronous batch.
        Compatible native requests for the same model are executed through the
        native batched KV decoder; unsupported per-item options are returned as
        per-item errors without failing sibling requests.

        This endpoint implements the synchronous form only. Future async durable
        batching will use the same request item shape with `mode: async`.
      operationId: generateBatchContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateBatchRequest'
      responses:
        '200':
          description: Batch generation results in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateBatchResponse'
        '400':
          description: Invalid batch envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /chat/completions:
    post:
      summary: OpenAI Chat Completions endpoint
      description: |
        OpenAI-compatible chat completions path for SDKs that call
        `/chat/completions` relative to the configured base URL.
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: |
            Chat completion response. Returns JSON for non-streaming requests,
            or Server-Sent Events for streaming requests (stream: true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GenerateChunk'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /rewrite:
    post:
      summary: Rewrite text using Seq2Seq models
      description: |
        Rewrite/transform text using Seq2Seq models (T5, FLAN-T5, BART, etc.).

        ## Models

        - Models are auto-discovered from `models_dir/rewriters/`
        - Seq2Seq models have encoder.onnx, decoder-init.onnx, and decoder.onnx files
        - Compatible with LMQG question generation models

        ## Use Cases

        - **Question Generation**: Generate questions from answer-context pairs
        - **Query Generation**: Generate search queries from documents
        - **Paraphrasing**: Rewrite text in different words
        - **Translation**: Translate text between languages
      operationId: rewriteText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
      responses:
        '200':
          description: Text rewritten successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewriteResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /read:
    post:
      summary: Read text from images (OCR/document understanding)
      description: |
        Extracts text from images using Vision2Seq models like TrOCR, Donut, Florence-2, or Pix2Struct.

        ## Models

        Models are auto-discovered from `models_dir/readers/` at startup.
        Use the `/ai/v1/models` endpoint to list available models.

        - **TrOCR**: Pure OCR for printed/handwritten text
        - **Donut**: Document understanding with structured output (receipts, forms)
        - **Florence-2**: Multi-task vision model (OCR, captioning, VQA)
        - **Pix2Struct**: Visual question answering with natural-language prompts
        - **Moondream**: Decoder-only vision-language reader that can return text plus optional flattened fields

        ## Task Prompts

        Some models support task prompts for different extraction modes:

        - **Donut CORD**: `<s_cord-v2>` for receipt parsing
        - **Donut DocVQA**: `<s_docvqa><s_question>...</s_question><s_answer>` for visual QA
        - **Florence-2 OCR**: `<OCR>` for text extraction
        - **Florence-2 Caption**: `<CAPTION>` for image description
        - **Pix2Struct**: natural-language questions like `What type of document is this?`
        - **Moondream**: natural-language prompts like `Describe this image.`
      operationId: readImages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: Images read successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /transcribe:
    post:
      summary: Transcribe audio to text (speech-to-text)
      description: |
        Transcribes audio to text using Speech2Seq models like Whisper, Wav2Vec2, or HuBERT.

        ## Models

        Models are auto-discovered from `models_dir/transcribers/` at startup.
        Use the `/api/models` endpoint to list available models.

        - **Whisper**: OpenAI's Whisper models (multilingual, automatic language detection)
        - **Wav2Vec2**: Facebook's Wav2Vec 2.0 models (English-focused)
        - **HuBERT**: Facebook's HuBERT models (self-supervised)

        ## Audio Input

        Audio data should be base64-encoded. Supported formats depend on the model:
        - WAV (recommended - raw PCM)
        - MP3
        - FLAC
        - M4A/AAC

        ## Example

        ```json
        {
          "model": "openai/whisper-tiny",
          "audio": "UklGRi..."
        }
        ```

        With language hint:
        ```json
        {
          "model": "openai/whisper-tiny",
          "audio": "UklGRi...",
          "language": "en"
        }
        ```
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeRequest'
      responses:
        '200':
          description: Audio transcribed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /extract:
    post:
      summary: Extract entities, relations, classifications, and structures
      description: |
        Schema-driven extraction over shared AI content parts. This is the
        canonical public API for named entity recognition, relation extraction,
        text/document classification, token classification, and structured
        document extraction.
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../ai/extraction.yaml#/components/schemas/ExtractionRequest'
      responses:
        '200':
          description: Extraction completed successfully
          content:
            application/json:
              schema:
                $ref: '../ai/extraction.yaml#/components/schemas/ExtractionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
  /models:
    get:
      summary: List available models
      description: |
        Returns lists of available embedding, chunking, reranking, generator, extractor, rewriter, reader, and transcriber models.

        ## Embedders

        - ONNX models from `models_dir/embedders/`
        - Quantized variants have `-i8` suffix

        ## Chunkers

        - Always includes "fixed" (built-in)
        - Plus any ONNX models from `models_dir/chunkers/`

        ## Rerankers

        - Native or ONNX rerankers from `models_dir/rerankers/`
        - `model_manifest.json` capabilities can mark late-interaction text rerankers (`late_interaction`, `colbert`)
        - Empty if no models configured

        ## Generators

        - LLM models from `models_dir/generators/`
        - Empty if no models configured

        ## Extractors

        - Extraction-capable models from the managed model registry
        - Includes GLiNER models for zero-shot entity and relation extraction

        ## Rewriters

        - Seq2Seq models from `models_dir/rewriters/`
        - T5, FLAN-T5, BART, and LMQG question generation models

        ## Readers

        - Vision2Seq models from `models_dir/readers/`
        - TrOCR, Donut, Florence-2 for OCR and document understanding

        ## Transcribers

        - Speech2Seq models from `models_dir/transcribers/`
        - Whisper, Wav2Vec2, HuBERT for speech-to-text

        Models are discovered at service startup and cached.
      operationId: listModels
      responses:
        '200':
          description: Models retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /embeddings:
    post:
      summary: Create embeddings (OpenAI-compatible)
      description: |
        OpenAI-compatible embeddings endpoint. Accepts the same request format
        as OpenAI's `/v1/embeddings` API, served here under `/ai/v1/embeddings`.
        For sparse-capable models, each `data` item still uses the `embedding`
        field, but its value is a sparse vector object instead of a dense float array.
        Use this endpoint for drop-in compatibility with OpenAI SDKs.
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/TransientCapacity'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /predictors:
    get:
      summary: List Traditional ML predictors
      description: |
        Returns the Traditional ML predictor catalog for `/ml/v1/predict`.
        Predictors are loaded from `<ml_dir>/<name>/` and exposed separately
        from the AI model catalog.
      operationId: listPredictors
      responses:
        '200':
          description: Predictors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictorsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /predict:
    post:
      summary: Run a traditional ML predictor
      description: |
        Run a tabular predictor (tree ensemble, linear, or SVM) on a batch of
        feature vectors. Models are loaded from `<ml_dir>/<name>/` and
        identified by name. Use `/ml/v1/models` for the list of available
        predictors and their feature schemas.
      operationId: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
      responses:
        '200':
          description: Predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '400':
          description: Invalid request (malformed body, feature-count mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Predictor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Batch too large (> 10000 rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    TransientCapacity:
      description: Inference capacity is temporarily unavailable
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds clients should wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransientCapacityError'
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable error description
        reason:
          type: string
          description: Machine-readable capacity source when the failure is retryable
          enum:
            - inference_capacity
            - request_queue
        retryable:
          type: boolean
          description: Whether retrying the same request may succeed
        retry_after_ms:
          type: integer
          minimum: 0
          description: Minimum retry delay in milliseconds
    TransientCapacityError:
      type: object
      description: Actionable retry contract for temporary inference-capacity failures.
      required:
        - error
        - message
        - reason
        - retryable
        - retry_after_ms
      properties:
        error:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable error description
        reason:
          type: string
          description: Machine-readable capacity source
          enum:
            - inference_capacity
            - request_queue
        retryable:
          type: boolean
          enum: [true]
          description: Always true for a transient-capacity response
        retry_after_ms:
          type: integer
          minimum: 1
          description: Minimum retry delay in milliseconds
    PredictRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: Predictor name from the model catalog.
        input:
          type: array
          maxItems: 10000
          description: Batch of feature vectors. Max 10000 rows.
          items:
            type: array
            items:
              type: number
              format: float
    PredictResponse:
      type: object
      required: [model, task, predictions]
      properties:
        model:
          type: string
        task:
          $ref: '#/components/schemas/PredictorTask'
        predictions:
          type: array
          description: |
            Per-row prediction arrays. Length equals the model's `num_outputs`
            (1 for regression / binary, `num_classes` for multiclass).
          items:
            type: array
            items:
              type: number
              format: float
    PredictorTask:
      type: string
      description: Task type for tabular predictors.
      enum: [regression, binary_classification, multiclass, ranking]
    PredictorInfo:
      type: object
      description: Traditional ML predictor metadata.
      required: [task, num_features, num_outputs]
      properties:
        task:
          $ref: '#/components/schemas/PredictorTask'
        num_features:
          type: integer
          minimum: 1
          description: Number of feature columns expected by the predictor.
        num_outputs:
          type: integer
          minimum: 1
          description: Number of output values emitted per input row.
        feature_names:
          type: array
          description: Optional feature names in input order.
          items:
            type: string
        source_framework:
          type: string
          description: Source framework used to produce the predictor IR.
    PredictorsResponse:
      type: object
      required: [object, predictors]
      properties:
        object:
          type: string
          enum: [list]
          description: Response object type.
        predictors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PredictorInfo'
          description: Traditional ML predictors keyed by predictor name.
    TextContentPart:
      $ref: '../shared/generating.yaml#/components/schemas/TextContentPart'
    ImageURL:
      $ref: '../shared/generating.yaml#/components/schemas/ImageURL'
    ImageURLContentPart:
      $ref: '../shared/generating.yaml#/components/schemas/ImageURLContentPart'
    MediaContentPart:
      $ref: '../shared/generating.yaml#/components/schemas/MediaContentPart'
    ContentPart:
      $ref: '../shared/generating.yaml#/components/schemas/ContentPart'
    EmbedRequest:
      type: object
      description: OpenAI-compatible embedding request with inference multimodal content-part extension
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: Model name to use for embedding generation
        input:
          description: |
            Input content to embed.
            Supports:
            - a single string
            - an array of strings
            - an array of OpenAI-style content parts for multimodal embedding
          oneOf:
            - type: string
              description: Single text string
            - type: array
              description: Array of text strings
              items:
                type: string
            - type: array
              description: Array of multimodal content parts
              items:
                $ref: '../shared/generating.yaml#/components/schemas/ContentPart'
        encoding_format:
          type: string
          description: Encoding format for the embeddings (only "float" supported)
          default: float
          enum:
            - float
        dimensions:
          type: integer
          description: Optional truncation size for dense embeddings. Must be a positive integer no larger than the model embedding size. Not supported for sparse models.
        task_type:
          type: string
          description: Optional embedding task type using Google embedding task-type names. For Jina v5 text embeddings, query-side tasks use the query prefix and RETRIEVAL_DOCUMENT uses the document prefix.
          enum:
            - RETRIEVAL_QUERY
            - RETRIEVAL_DOCUMENT
            - QUESTION_ANSWERING
            - FACT_VERIFICATION
            - CODE_RETRIEVAL_QUERY
            - CLASSIFICATION
            - CLUSTERING
            - SEMANTIC_SIMILARITY
        input_type:
          type: string
          deprecated: true
          description: Deprecated compatibility alias for task_type. search_query/query map to RETRIEVAL_QUERY; search_document/document map to RETRIEVAL_DOCUMENT; classification and clustering map to their Google task_type equivalents.
          enum:
            - search_query
            - search_document
            - query
            - document
            - classification
            - clustering
        error_policy:
          type: string
          description: |
            Controls how dense embedding requests report per-input failures.
            `fail_fast` preserves OpenAI-compatible all-or-error behavior.
            `per_item` returns successful embeddings in `data` and indexed
            permanent/transient failures in `errors` without failing the
            entire HTTP request.
          default: fail_fast
          enum:
            - fail_fast
            - per_item
    EmbedResponse:
      type: object
      description: OpenAI-compatible embedding response with a polymorphic `embedding` field for dense or sparse vectors
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          description: Object type, always "list"
          enum:
            - list
        data:
          type: array
          description: List of embedding objects
          items:
            $ref: '#/components/schemas/EmbeddingObject'
        model:
          type: string
          description: Model used for embedding generation
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
        errors:
          type: array
          description: Indexed per-input failures. Only populated when request error_policy is per_item.
          items:
            $ref: '#/components/schemas/EmbeddingItemError'
        summary:
          $ref: '#/components/schemas/EmbeddingBatchSummary'
    EmbeddingItemError:
      type: object
      description: Per-input embedding failure for error_policy=per_item responses
      required:
        - index
        - code
        - message
        - stage
        - retryable
        - status
      properties:
        index:
          type: integer
          description: Original input index that failed
        code:
          type: string
          description: Stable machine-readable failure code
        message:
          type: string
          description: Human-readable failure message
        stage:
          type: string
          description: Pipeline stage that classified the failure
          enum:
            - parse
            - fetch
            - image_decode
            - audio_decode
            - text_inference
            - image_inference
            - audio_inference
            - model_admission
            - inference
        retryable:
          type: boolean
          description: Whether retrying the same item may succeed
        status:
          type: integer
          description: HTTP-style status classification for this item
        retry_after_ms:
          type: integer
          minimum: 0
          nullable: true
          description: Minimum retry delay in milliseconds for a retryable transient failure
    EmbeddingBatchSummary:
      type: object
      description: Counts for per-item embedding responses
      required:
        - total
        - succeeded
        - failed
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
    SparseVector:
      type: object
      description: A sparse vector with parallel index/value arrays, sorted by index ascending
      required:
        - indices
        - values
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
          description: Token IDs from the model vocabulary (sorted ascending)
        values:
          type: array
          items:
            type: number
            format: float
          description: Corresponding weights for each index (always positive)
    Chunk:
      description: A chunk of content. Text chunks have mime_type text/plain.
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/TextContent'
            - $ref: '#/components/schemas/BinaryContent'
        - type: object
          required:
            - id
            - mime_type
          properties:
            id:
              type: integer
              x-go-type: uint32
              description: Sequence number of the chunk (0, 1, 2, ...)
            mime_type:
              type: string
              description: 'MIME type: text/plain, audio/wav, image/png, etc.'
    VADOptions:
      $ref: '../shared/chunking.yaml#/components/schemas/VADOptions'
    AudioChunkConfig:
      $ref: '../shared/chunking.yaml#/components/schemas/InferenceAudioChunkConfig'
    ChunkConfig:
      $ref: '../shared/chunking.yaml#/components/schemas/InferenceChunkConfig'
    ChunkRequest:
      $ref: '../shared/chunking.yaml#/components/schemas/InferenceChunkRequest'
    ChunkResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
        - cache_hit
      example:
        object: list
        data:
          - object: chunk
            index: 0
            id: 0
            text: This is the first chunk...
            start_char: 0
            end_char: 100
            mime_type: text/plain
          - object: chunk
            index: 1
            id: 1
            text: This is the second chunk...
            start_char: 90
            end_char: 190
            mime_type: text/plain
        model: fixed
        usage:
          prompt_tokens: 12
          completion_tokens: 0
          total_tokens: 12
        cache_hit: false
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChunkObject'
          description: Array of chunk objects
        model:
          type: string
          description: Chunking model actually used (may differ from requested if fallback occurred)
          example: fixed
        usage:
          $ref: '#/components/schemas/GenerateUsage'
        cache_hit:
          type: boolean
          description: Whether result was served from cache
    ChunkObject:
      description: A chunk result object. Text chunks have mime_type text/plain.
      allOf:
        - $ref: '#/components/schemas/Chunk'
        - type: object
          required:
            - object
            - index
          properties:
            object:
              type: string
              enum:
                - chunk
            index:
              type: integer
              description: Position of this chunk object in the response data array.
    RerankRequest:
      type: object
      required:
        - model
        - query
        - prompts
      properties:
        model:
          type: string
          description: Name of reranking model from models_dir/rerankers/
          example: BAAI/bge-reranker-v2-m3
        query:
          type: string
          description: Search query for relevance scoring
          example: machine learning applications
        prompts:
          type: array
          items:
            type: string
          description: |
            Pre-rendered document texts to rerank. The client is responsible for extracting
            and rendering document fields/templates before calling this endpoint.
          example:
            - Introduction to machine learning...
            - Deep learning fundamentals...
    RerankMultimodalDocument:
      type: object
      required:
        - content
      properties:
        id:
          type: string
          description: Optional caller-provided document identifier
        content:
          $ref: '../shared/generating.yaml#/components/schemas/ChatMessageContent'
    RerankMultimodalRequest:
      type: object
      required:
        - model
        - query
        - documents
      properties:
        model:
          type: string
          description: Name of multimodal reranking model from models_dir/rerankers/
          example: vidore/colqwen2-v1.0
        query:
          type: string
          description: Text query for relevance scoring
          example: invoice total due date
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RerankMultimodalDocument'
          description: Documents expressed as text and image content parts
    RerankResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum:
            - list
          description: Object type, always "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/RerankObject'
          description: Rerank score objects, one per input prompt.
        model:
          type: string
          description: Name of model used for reranking
