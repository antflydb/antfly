name: Upload temporary CI artifact
description: Store bulk bytes once in GCS and retain a small Actions receipt
inputs:
  gcs-enabled:
    description: Enable GCS transfer, resolved by the calling workflow
    default: 'false'
  name:
    description: Logical artifact name
    required: true
  path:
    description: Files or directories to upload
    required: true
  namespace:
    description: release or vopr (separate bucket-scoped identities)
    default: release
  retention-days:
    description: Receipt retention, 14 or 90 days
    default: '14'
  overwrite:
    description: Replace this run's receipt on retry
    default: 'false'
runs:
  using: composite
  steps:
    - if: ${{ inputs.gcs-enabled == 'true' }}
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      id: auth
      with:
        workload_identity_provider: projects/281947489474/locations/global/workloadIdentityPools/antfly-ci-artifacts/providers/github
        service_account: ci-${{ inputs.namespace }}-artifacts@antfly-image-artifacts.iam.gserviceaccount.com
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/devstorage.read_write
        create_credentials_file: false
        export_environment_variables: false
    - if: ${{ inputs.gcs-enabled == 'true' }}
      id: receipt
      shell: bash
      env:
        CI_ARTIFACT_TOKEN: ${{ steps.auth.outputs.access_token }}
        ARTIFACT_NAMESPACE: ${{ inputs.namespace }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        ARTIFACT_NAME: ${{ inputs.name }}
        ARTIFACT_PATHS: ${{ inputs.path }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        receipt_dir="$(mktemp -d "$RUNNER_TEMP/ci-receipt.XXXXXX")"
        python3 "$ACTION_ROOT/../../../scripts/ci/artifact_exchange.py" upload \
          --name "$ARTIFACT_NAME" --paths "$ARTIFACT_PATHS" --destination "$receipt_dir" \
          --namespace "$ARTIFACT_NAMESPACE" --retention-days "$RETENTION_DAYS"
        echo "path=$receipt_dir" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.gcs-enabled == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.receipt.outputs.path }}/
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
        if-no-files-found: error
    - if: ${{ inputs.gcs-enabled != 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
        if-no-files-found: error
