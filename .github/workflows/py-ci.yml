name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "py/**"
      - "openapi.yaml"
      - ".github/workflows/py-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "py/**"
      - "openapi.yaml"
      - ".github/workflows/py-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.13"]') || fromJSON('["3.10", "3.11", "3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        working-directory: py/packages/sdk
        run: uv sync

      - name: Verify generated client
        if: matrix.python-version == '3.13'
        working-directory: py/packages/sdk
        run: |
          make generate
          status="$(git status --porcelain -- src/antfly/client_generated)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Run linting
        working-directory: py/packages/sdk
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Run type checking
        working-directory: py/packages/sdk
        run: uv run pyright src tests

      - name: Run tests
        working-directory: py/packages/sdk
        run: uv run pytest tests
