name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "py/**"
      - "openapi.yaml"
      - ".github/workflows/py-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "py/**"
      - "openapi.yaml"
      - ".github/workflows/py-ci.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pull requests cover the oldest and newest supported runtimes; main
        # covers every supported minor release.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        working-directory: py/packages/sdk
        run: uv sync

      - name: Verify generated client
        if: matrix.python-version == '3.14'
        working-directory: py/packages/sdk
        run: |
          make generate
          status="$(git status --porcelain -- src/antfly/client_generated)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Run linting
        working-directory: py/packages/sdk
        run: uv run ruff check src tests

      - name: Check Python formatting
        run: git ls-files -z -- '*.py' | xargs -0 uv run --project py/packages/sdk --locked ruff format --check

      - name: Run type checking
        working-directory: py/packages/sdk
        run: uv run pyright src tests

      - name: Run tests
        working-directory: py/packages/sdk
        run: uv run pytest tests

      - name: Check CLI wrapper compatibility
        run: python -m compileall -q py/packages/cli/src/antfly_cli
