name: Release Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/antfly-release.yml"
      - ".github/workflows/antfly-release-preflight.yml"
      - ".github/workflows/antfly-container.yml"
      - ".goreleaser.yaml"
      - "RELEASE.md"
      - "scripts/packaging/build_zig_release_archive.sh"
      - "scripts/packaging/render_homebrew_antfly_formula.py"
      - "zig/Dockerfile.runtime"
      - "zig/build.zig"
      - "zig/cloudbuild.runtime.yaml"
      - "zig/pkg/inference/build.zig"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zig-runtime-archives:
    name: Build Zig archive (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: antfly-zig-linux-amd64
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            archive_os: Linux
            archive_arch: x86_64
            metal: "false"
            system_blas: "false"
          - artifact_name: antfly-zig-linux-arm64
            runner: arc-antfly-publish-arm64
            os: linux
            zig_arch: aarch64
            zig_target: aarch64-linux-musl
            archive_os: Linux
            archive_arch: arm64
            metal: "false"
            system_blas: "false"
          - artifact_name: antfly-zig-darwin-arm64
            runner: macos-15
            os: darwin
            zig_target: aarch64-macos
            archive_os: Darwin
            archive_arch: arm64
            metal: "true"
            system_blas: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-${{ matrix.zig_arch }}-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install Zig (macOS)
        if: ${{ matrix.os == 'darwin' }}
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build archive
        run: |
          version="0.0.0-preflight"
          archive="antfly_${version}_${{ matrix.archive_os }}_${{ matrix.archive_arch }}.tar.gz"
          scripts/packaging/build_zig_release_archive.sh \
            --version "$version" \
            --target "${{ matrix.zig_target }}" \
            --archive-name "$archive" \
            --out-dir dist/release-archives \
            --metal "${{ matrix.metal }}" \
            --system-blas "${{ matrix.system_blas }}"

      - name: Verify archive layout
        run: |
          tar -tzf dist/release-archives/*.tar.gz | sort
          tar -tzf dist/release-archives/*.tar.gz | grep -E '^\./antfly$|^antfly$'
          tar -tzf dist/release-archives/*.tar.gz | grep -E '^\./share/antfly/?|^share/antfly/?'

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-preflight
          path: dist/release-archives/*.tar.gz
          if-no-files-found: error
