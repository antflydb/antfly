name: Release Preflight

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/antfly-release-preflight.yml"
      - ".github/workflows/antfly-release.yml"
      - "scripts/packaging/build_zig_release_archive.sh"
      - "zig/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.17.0-dev.607+456b2ec07

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-zig-runtime-archive:
    name: Build Zig archive (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: antfly-zig-linux-amd64-preflight
            runner: arc-antfly-publish
            arch: amd64
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            archive_os: Linux
            archive_arch: x86_64
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-arm64-preflight
            runner: arc-antfly-publish-arm64
            arch: arm64
            zig_arch: aarch64
            zig_target: aarch64-linux-musl
            archive_os: Linux
            archive_arch: arm64
            zig_optimize: ReleaseSmall
            zig_jobs: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Verify runner architecture
        run: |
          case "$(uname -m)" in
            x86_64) actual=amd64 ;;
            aarch64) actual=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [ "$actual" != "${{ matrix.arch }}" ]; then
            echo "expected ${{ matrix.arch }} runner, got ${actual}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/builds/zig-${{ matrix.zig_arch }}-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Verify Zig version
        run: zig version

      - name: Build archive
        run: |
          archive="antfly_0.0.0-preflight_${{ matrix.archive_os }}_${{ matrix.archive_arch }}.tar.gz"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "0.0.0-preflight" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "$archive" \
            --out-dir dist/release-preflight \
            --metal false \
            --system-blas false

      - name: Verify archive layout
        run: |
          archive="dist/release-preflight/antfly_0.0.0-preflight_${{ matrix.archive_os }}_${{ matrix.archive_arch }}.tar.gz"
          tar -tzf "$archive" | sort > "$RUNNER_TEMP/archive-files.txt"
          grep -qx './antfly' "$RUNNER_TEMP/archive-files.txt"
          grep -qx './README.md' "$RUNNER_TEMP/archive-files.txt"
          grep -qx './LICENSE' "$RUNNER_TEMP/archive-files.txt"

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release-preflight/*.tar.gz
          if-no-files-found: error
