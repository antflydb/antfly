name: Issue 443 sparse diagnostic

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Fresh-server sparse-batch attempts
        required: false
        default: "20"

jobs:
  sparse-batch:
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Build inference binary
        run: make -C zig build ZIG_BUILD_FLAGS='-Doptimize=ReleaseSafe'
      - name: Repeat isolated sparse batch with server diagnostics
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_DOWNLOAD: "1"
          ANTFLY_INFERENCE_REQUEST_TIMEOUT: "330"
          ANTFLY_INFERENCE_DIAGNOSTICS: "1"
        run: |
          set -o pipefail
          for attempt in $(seq 1 '${{ inputs.attempts }}'); do
            status=0
            echo "::group::sparse batch attempt $attempt"
            uv run --project e2e/inference pytest -vv -s e2e/inference/test_sparse_embed.py::test_sparse_batch || status=$?
            echo "::endgroup::"
            if [ "${status:-0}" -ne 0 ]; then exit "$status"; fi
          done
