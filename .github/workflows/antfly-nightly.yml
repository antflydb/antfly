name: Nightly snapshot

# "nightly" is a channel contract, not a required cadence. A schedule or a
# main-push trigger can be added later without changing artifact identities.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Optional exact commit from the default branch; defaults to its current head"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: antfly-nightly-build
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact nightly snapshot identity
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Resolve source commit and sequence
        id: identity
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          commit="$REQUESTED_COMMIT"
          if [ -z "$commit" ]; then
            commit="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$commit^{commit}"
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.0-dev.${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/antfly-artifact-build.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag }}
      source_commit: ${{ needs.resolve.outputs.commit }}
      channel: nightly
