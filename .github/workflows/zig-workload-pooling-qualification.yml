name: Zig Workload Pooling Qualification
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline ref to compare under identical container limits
        default: main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: workload-pooling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: arc-antfly-heavy
    timeout-minutes: 240
    env:
      ANTFLY_ZIG_MAX_RSS: "23622320128"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Load pinned toolchain
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils file
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.toolchain.outputs.zig_nixpkgs_revision }}.tar.gz
      - name: Install glibc-linked Zig
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
          ZIG_NIX_ATTRIBUTE: ${{ steps.toolchain.outputs.zig_nix_attribute }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A "$ZIG_NIX_ATTRIBUTE" --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          grep -Eq 'interpreter /nix/store/[^ ,]*glibc[^ ,]*/lib[^ ,]*/ld-linux' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"
          mkdir -p qualification-bin
          {
            echo "version=$ZIG_VERSION"
            echo "nix_attribute=$ZIG_NIX_ATTRIBUTE"
            echo "nixpkgs_revision=${{ steps.toolchain.outputs.zig_nixpkgs_revision }}"
            echo "compiler=$zig_path/bin/zig"
            echo "$compiler_description"
            sha256sum "$zig_path/bin/zig"
          } > qualification-bin/toolchain.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build and test candidate
        working-directory: zig
        run: |
          zig build antfly antfly-workload-pooling-test lib-httpx-protected-dispatch-test antfly-api-connections-test \
            shared-signal-stack-test resource-budget-test antfly-storage-owner-test \
            '-Dstorage-owner-test-filter=opaque storage context enforces owner lifetime and shares process storage state' \
            -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=true -j1 \
            --maxrss "$ANTFLY_ZIG_MAX_RSS" --cache-dir "$RUNNER_TEMP/pooling-candidate-cache" \
            --prefix ../qualification-bin/candidate 2>&1 | tee ../qualification-bin/candidate-build.log
          zig build antfly-data-runtime-test \
            '-Dtest-filter=data raft forwarding progresses while the control executor is saturated' \
            -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=true -j1 \
            --maxrss "$ANTFLY_ZIG_MAX_RSS" --cache-dir "$RUNNER_TEMP/pooling-candidate-cache" \
            2>&1 | tee ../qualification-bin/candidate-forwarding-tests.log
          zig build pgwire-test \
            -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=false -j1 \
            --maxrss "$ANTFLY_ZIG_MAX_RSS" --cache-dir "$RUNNER_TEMP/pooling-candidate-cache" \
            2>&1 | tee ../qualification-bin/candidate-pgwire-tests.log
          # Nix Zig 0.17 ARM64 crashes compiling this stripped test partition;
          # keep test diagnostics while leaving performance binaries stripped.
          zig build antfly-api-auth-test \
            '-Dtest-filter=chatgpt manager persists host identity and partitions personal registrations' \
            -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=false -j1 \
            --maxrss "$ANTFLY_ZIG_MAX_RSS" --cache-dir "$RUNNER_TEMP/pooling-candidate-cache" \
            2>&1 | tee ../qualification-bin/candidate-credential-permission-tests.log
      - name: Build baseline
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          git fetch --no-tags origin "$BASELINE_REF"
          git worktree add --detach /tmp/antfly-pooling-baseline FETCH_HEAD
          git -C /tmp/antfly-pooling-baseline submodule update --init --recursive
          # Older main opens the credential directory with O_PATH, then calls
          # fchmod. Apply the same startup fix as the candidate and retain it.
          startup_patch="$GITHUB_WORKSPACE/zig/qualification/workload-pooling/baseline-linux-startup.patch"
          if git -C /tmp/antfly-pooling-baseline apply --check "$startup_patch"; then
            git -C /tmp/antfly-pooling-baseline apply "$startup_patch"
            git -C /tmp/antfly-pooling-baseline diff -- zig/pkg/antfly-embedded/src/chatgpt/manager.zig \
              > qualification-bin/baseline-linux-startup.patch
          fi
          # Older main puts idle pgwire sessions on the small outbound executor.
          # Repair only that task ownership bug, preserving main's SQL policy.
          pgwire_patch="$GITHUB_WORKSPACE/zig/qualification/workload-pooling/baseline-pgwire-transport.patch"
          if git -C /tmp/antfly-pooling-baseline apply --check "$pgwire_patch"; then
            git -C /tmp/antfly-pooling-baseline apply "$pgwire_patch"
            git -C /tmp/antfly-pooling-baseline diff -- zig/pkg/antfly/src/api/sql_pgwire.zig \
              > qualification-bin/baseline-pgwire-transport.patch
          elif ! rg -q 'transport_io' /tmp/antfly-pooling-baseline/zig/pkg/antfly/src/api/sql_pgwire.zig; then
            echo 'Baseline pgwire transport repair needs rebasing' >&2
            exit 1
          fi
          git rev-parse HEAD > qualification-bin/candidate/revision.txt
          git -C /tmp/antfly-pooling-baseline rev-parse HEAD > qualification-bin/baseline-revision.txt
          cd /tmp/antfly-pooling-baseline/zig
          zig build antfly -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=true -j1 \
            --maxrss "$ANTFLY_ZIG_MAX_RSS" --cache-dir "$RUNNER_TEMP/pooling-baseline-cache" \
            --prefix "$GITHUB_WORKSPACE/qualification-bin/baseline" 2>&1 | tee "$GITHUB_WORKSPACE/qualification-bin/baseline-build.log"
      - name: Preserve qualification binaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workload-pooling-binaries
          path: qualification-bin/
          if-no-files-found: error

  qualify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workload-pooling-binaries
          path: qualification-bin
      - name: Restore executable permissions
        run: chmod +x qualification-bin/candidate/bin/antfly qualification-bin/baseline/bin/antfly
      - name: Build measurement image
        run: docker build -t antfly-pooling-qualification -f zig/qualification/workload-pooling/Dockerfile .
      - name: Qualify small Linux envelope
        run: |
          docker run --rm --cpus=2 --memory=2g --memory-swap=2g --pids-limit=512 --ulimit nofile=512:512 \
            -v "$GITHUB_WORKSPACE:/workspace" antfly-pooling-qualification \
            --candidate qualification-bin/candidate/bin/antfly --baseline qualification-bin/baseline/bin/antfly \
            --manifest zig/qualification/workload-pooling/linux-small.json \
            --manifest zig/qualification/workload-pooling/linux-mixed-load.json \
            --manifest zig/qualification/workload-pooling/linux-waiting-pressure.json \
            --manifest zig/qualification/workload-pooling/linux-combined-pressure.json \
            --repetitions 3 \
            --output-dir qualification-receipts/small
      - name: Qualify larger Linux envelope
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --cpus=4 --memory=4g --memory-swap=4g --pids-limit=768 --ulimit nofile=1024:1024 \
            -v "$GITHUB_WORKSPACE:/workspace" antfly-pooling-qualification \
            --candidate qualification-bin/candidate/bin/antfly --baseline qualification-bin/baseline/bin/antfly \
            --manifest zig/qualification/workload-pooling/linux-large.json \
            --repetitions 3 \
            --output-dir qualification-receipts/large
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: workload-pooling-qualification
          path: |
            qualification-receipts
            qualification-bin/**/revision.txt
            qualification-bin/baseline-revision.txt
            qualification-bin/toolchain.txt
