name: Container

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: "The release tag name (e.g., v1.0.0)"
        required: false
        type: string
      source_sha:
        description: "Exact 40-character source revision to build; defaults to the invoking revision"
        required: false
        default: ""
        type: string
      publish_mode:
        description: "release publishes GAR and GHCR; development publishes an immutable GAR-only main-SHA image"
        required: false
        default: release
        type: string
      architectures:
        description: "Comma-separated runtime architectures: amd64, arm64, or amd64,arm64"
        required: false
        default: amd64,arm64
        type: string
      artifact_source:
        description: "Where Linux runtime archives come from: build or github"
        required: false
        default: build
        type: string
    outputs:
      image:
        description: "Digest-pinned GAR runtime image"
        value: ${{ jobs.publish.outputs.image }}
      manifest:
        description: "Compact JSON build manifest"
        value: ${{ jobs.publish.outputs.manifest }}
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag; omitted for development mode"
        required: false
        default: ""
      artifact_source:
        description: "Where Linux runtime archives come from: build or github"
        required: false
        default: build
      source_sha:
        description: "Exact 40-character source revision to build"
        required: false
        default: ""
      publish_mode:
        description: "release or development"
        required: false
        default: release
        type: choice
        options: [release, development]
      architectures:
        description: "amd64, arm64, or amd64,arm64"
        required: false
        default: amd64,arm64

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_REGION: us-central1
  GCP_PROJECT: antfly-image-artifacts
  GCP_REPOSITORY: containers
  GAR_REGISTRY: us-central1-docker.pkg.dev
  CLOUD_BUILD_WORKER_POOL: projects/antfly-image-artifacts/locations/us-central1/workerPools/antfly-container-builders
  ZIG_ARTIFACT_BUCKET: antfly-image-artifacts-zig-build-artifacts
  ZIG_VERSION: 0.16.0
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      # This checkout deliberately uses the workflow ref, not source_sha.  It is
      # the trust boundary for deciding whether a historical revision may use
      # the publishing identity.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize source and publication inputs
        id: source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          MODE: ${{ inputs.publish_mode || 'release' }}
          ARTIFACT_SOURCE: ${{ inputs.artifact_source || 'build' }}
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a 40-character lowercase commit SHA" >&2; exit 1; }
          case "$MODE" in release|development) ;; *) echo "publish_mode must be release or development" >&2; exit 1;; esac
          case "$ARTIFACT_SOURCE" in build|github) ;; *) echo "artifact_source must be build or github" >&2; exit 1;; esac
          # GitHub release artifacts are a release-only provenance channel.
          if [[ "$ARTIFACT_SOURCE" == github && "$MODE" != release ]]; then
            echo "artifact_source=github is only supported for release publishing" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_SOURCE_SHA}^{commit}"
          if [[ "$MODE" == development ]]; then
            git merge-base --is-ancestor "$REQUESTED_SOURCE_SHA" origin/main || { echo "development source_sha must be an ancestor of protected main" >&2; exit 1; }
          else
            test -n "$RELEASE_TAG" || { echo "release publishing requires tag_name" >&2; exit 1; }
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$REQUESTED_SOURCE_SHA" ]] || { echo "release source_sha must equal the requested release tag commit" >&2; exit 1; }
          fi
          echo "source_sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Select runtime architectures
        id: matrix
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'amd64,arm64' }}
        run: |
          set -euo pipefail
          case "$ARCHITECTURES" in
            amd64)
              matrix='{"include":[{"arch":"amd64","runner":"arc-antfly-publish","zig_arch":"x86_64","zig_target":"x86_64-linux-musl","zig_optimize":"ReleaseFast","zig_jobs":""}]}'
              ;;
            arm64)
              matrix='{"include":[{"arch":"arm64","runner":"arc-antfly-publish-arm64","zig_arch":"aarch64","zig_target":"aarch64-linux-musl","zig_optimize":"ReleaseSmall","zig_jobs":"1"}]}'
              ;;
            amd64,arm64)
              matrix='{"include":[{"arch":"amd64","runner":"arc-antfly-publish","zig_arch":"x86_64","zig_target":"x86_64-linux-musl","zig_optimize":"ReleaseFast","zig_jobs":""},{"arch":"arm64","runner":"arc-antfly-publish-arm64","zig_arch":"aarch64","zig_target":"aarch64-linux-musl","zig_optimize":"ReleaseSmall","zig_jobs":"1"}]}'
              ;;
            *) echo "architectures must be amd64, arm64, or amd64,arm64" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-artifact:
    name: Build ${{ matrix.arch }} artifact
    needs: plan
    if: ${{ inputs.artifact_source != 'github' }}
    runs-on: ${{ matrix.runner }}
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify runner architecture
        run: |
          case "$(uname -m)" in
            x86_64) actual=amd64 ;;
            aarch64) actual=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "expected ${{ matrix.arch }} runner, got ${actual}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_arch }}-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build runtime artifact
        run: |
          set -euo pipefail
          MODE="${{ inputs.publish_mode || 'release' }}"
          SOURCE_SHA="${{ needs.plan.outputs.source_sha }}"
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "checkout did not resolve the requested source_sha" >&2
            exit 1
          fi
          if [[ "$MODE" == development ]]; then
            VERSION="main-${SOURCE_SHA}"
          else
            VERSION="${{ inputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name }}"
          fi
          VERSION="${VERSION#v}"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$VERSION" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "antfly-zig-${{ matrix.arch }}.tar.gz" \
            --out-dir "$RUNNER_TEMP" \
            --metal false \
            --system-blas false

      - name: Upload runtime artifact to GCS
        run: |
          gsutil cp \
            "$RUNNER_TEMP/antfly-zig-${{ matrix.arch }}.tar.gz" \
            "gs://${ZIG_ARTIFACT_BUCKET}/zig/${{ needs.plan.outputs.source_sha }}/antfly-zig-${{ matrix.arch }}.tar.gz"

  publish:
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      manifest: ${{ steps.manifest.outputs.manifest }}
    runs-on: arc-antfly-publish
    needs: [plan, build-artifact]
    if: ${{ always() && (inputs.artifact_source == 'github' || needs.build-artifact.result == 'success') }}
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      # The final mutable tag is serialized.  Per-run staging tags below are
      # unique, so concurrent builds cannot exchange architecture inputs.
      group: runtime-container-${{ inputs.publish_mode || 'release' }}-${{ needs.plan.outputs.source_sha }}-${{ inputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download release runtime archives
        if: ${{ inputs.artifact_source == 'github' }}
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-linux-*
          merge-multiple: true
          path: dist/release-archives

      - name: Upload release runtime archives to GCS
        if: ${{ inputs.artifact_source == 'github' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-artifacts"
          IFS=, read -ra arches <<< "${{ inputs.architectures || 'amd64,arm64' }}"
          for arch in "${arches[@]}"; do
            case "$arch" in
              amd64) source_glob='antfly_*_Linux_x86_64.tar.gz' ;;
              arm64) source_glob='antfly_*_Linux_arm64.tar.gz' ;;
              *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
            esac
            mapfile -t matches < <(find dist/release-archives -maxdepth 1 -type f -name "$source_glob" -print)
            [[ ${#matches[@]} -eq 1 && -f "${matches[0]}" ]] || { echo "expected exactly one $arch release archive" >&2; exit 1; }
            cp "${matches[0]}" "$RUNNER_TEMP/container-artifacts/antfly-zig-${arch}.tar.gz"
            gsutil cp \
              "$RUNNER_TEMP/container-artifacts/antfly-zig-${arch}.tar.gz" \
              "gs://${ZIG_ARTIFACT_BUCKET}/zig/${{ needs.plan.outputs.source_sha }}/antfly-zig-${arch}.tar.gz"
          done

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          MODE="${{ inputs.publish_mode || 'release' }}"
          case "$MODE" in
            release)
              VERSION="${{ inputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name }}"
              test -n "$VERSION"
              ;;
            development)
              [[ "$(git rev-parse HEAD)" == "${{ needs.plan.outputs.source_sha }}" ]]
              SOURCE_SHA="${{ needs.plan.outputs.source_sha }}"
              VERSION="main-${SOURCE_SHA}"
              ;;
            *)
              echo "publish_mode must be release or development" >&2
              exit 1
              ;;
          esac
          ARCHITECTURES="${{ inputs.architectures || 'amd64,arm64' }}"
          case "$ARCHITECTURES" in
            amd64|arm64|amd64,arm64) ;;
            *) echo "architectures must be amd64, arm64, or amd64,arm64" >&2; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "architectures=${ARCHITECTURES}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

      - name: Package GAR images with Cloud Build
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "gcloud builds submit failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA="${{ needs.plan.outputs.source_sha }}"
          STAGING_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IFS=, read -ra arches <<< "${{ steps.version.outputs.architectures }}"
          for arch in "${arches[@]}"; do
            submit_cloud_build . \
              --project="${GCP_PROJECT}" \
              --region="${GCP_REGION}" \
              --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
              --config=zig/cloudbuild.runtime.yaml \
              --substitutions="_ARTIFACT_URI=gs://${ZIG_ARTIFACT_BUCKET}/zig/${SOURCE_SHA}/antfly-zig-${arch}.tar.gz,_IMAGE_NAME=antfly,_DOCKERFILE=zig/Dockerfile.runtime,_CONTEXT=/workspace/.zig-container,_ALIAS_TAG=__skip_alias__,_VERSION_TAG=${VERSION}-${arch}-${STAGING_SUFFIX},_PLATFORMS=linux/${arch},_DESCRIPTION=AntflyDB Zig runtime image"
          done

      - name: Create GAR multi-arch manifest with Cloud Build
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "gcloud builds submit failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          STAGING_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SOURCES=""
          IFS=, read -ra arches <<< "${{ steps.version.outputs.architectures }}"
          for arch in "${arches[@]}"; do
            SOURCES="${SOURCES:+${SOURCES},}${VERSION}-${arch}-${STAGING_SUFFIX}"
          done
          ALIAS_TAG=latest
          if [[ "${{ inputs.publish_mode || 'release' }}" == development || "$VERSION" == *-* || "$VERSION" == v0.1.* ]]; then
            ALIAS_TAG=__skip_alias__
          fi
          submit_cloud_build . \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
            --config=zig/cloudbuild.manifest.yaml \
            --substitutions="_IMAGE_NAME=antfly,_VERSION_TAG=${VERSION},_ALIAS_TAG=${ALIAS_TAG},_SOURCE_TAGS=${SOURCES//,/\\,}"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Authenticate crane to GAR
        # Development runs resolve and sign GAR digests too; authenticate before
        # any crane or cosign operation, while GHCR remains release-only.
        run: echo "${{ steps.auth.outputs.access_token }}" | crane auth login "$GAR_REGISTRY" -u oauth2accesstoken --password-stdin

      - name: Mirror image GAR -> GHCR
        if: ${{ (inputs.publish_mode || 'release') == 'release' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAGS=("${VERSION}")
          if [[ "$VERSION" != *-* && "$VERSION" != v0.1.* ]]; then
            TAGS=(latest "${TAGS[@]}")
          fi
          for tag in "${TAGS[@]}"; do
            crane copy \
              "$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly:${tag}" \
              "ghcr.io/antflydb/antfly:${tag}"
          done

      - uses: sigstore/cosign-installer@v3

      - name: Sign GHCR images
        if: ${{ (inputs.publish_mode || 'release') == 'release' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=("${VERSION}")
          if [[ "$VERSION" != *-* && "$VERSION" != v0.1.* ]]; then
            TAGS=(latest "${TAGS[@]}")
          fi
          for tag in "${TAGS[@]}"; do
            cosign sign --yes \
              -a "repo=${{ github.repository }}" \
              -a "workflow=${{ github.workflow }}" \
              -a "ref=${{ needs.plan.outputs.source_sha }}" \
              "ghcr.io/antflydb/antfly:${tag}"
          done

      - name: Resolve, sign, and verify immutable GAR image
        id: sign
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA="${{ needs.plan.outputs.source_sha }}"
          REPOSITORY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GCP_REPOSITORY}/antfly"
          DIGEST="$(crane digest "${REPOSITORY}:${VERSION}")"
          IMAGE="${REPOSITORY}@${DIGEST}"
          cosign sign --yes -a "repo=${{ github.repository }}" -a "workflow=${{ github.workflow }}" -a "ref=${SOURCE_SHA}" "$IMAGE"
          cosign verify --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/antfly-container.yml@" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" -a "repo=${{ github.repository }}" -a "ref=${SOURCE_SHA}" "$IMAGE" >/dev/null
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable image and emit build manifest
        id: manifest
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_SHA="${{ needs.plan.outputs.source_sha }}"
          IMAGE="${{ steps.sign.outputs.image }}"
          MANIFEST="$(jq -cn \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg tag "$VERSION" \
            --arg mode "${{ inputs.publish_mode || 'release' }}" \
            --arg architectures "${{ steps.version.outputs.architectures }}" \
            '{schema_version:1,source_sha:$source_sha,image:$image,tag:$tag,publish_mode:$mode,architectures:($architectures|split(","))}')"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/antfly-container.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            -a "repo=${{ github.repository }}" \
            -a "ref=${SOURCE_SHA}" \
            "$IMAGE" >/dev/null
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$MANIFEST" > antfly-build-manifest.json
          {
            echo "## Runtime build"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Architectures: \`${{ steps.version.outputs.architectures }}\`"
            echo "- Publication mode: \`${{ inputs.publish_mode || 'release' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build manifest
        uses: actions/upload-artifact@v6
        with:
          name: antfly-build-manifest-${{ needs.plan.outputs.source_sha }}
          path: antfly-build-manifest.json
          retention-days: 14
