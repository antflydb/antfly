name: Container

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: "The release tag name (e.g., v1.0.0)"
        required: true
        type: string
      artifact_source:
        description: "Where Linux runtime archives come from: build or github"
        required: false
        default: build
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The release tag name (e.g., v1.0.0)"
        required: true
      artifact_source:
        description: "Where Linux runtime archives come from: build or github"
        required: false
        default: build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_REGION: us-central1
  GCP_PROJECT: antfly-image-artifacts
  GCP_REPOSITORY: containers
  GAR_REGISTRY: us-central1-docker.pkg.dev
  CLOUD_BUILD_WORKER_POOL: projects/antfly-image-artifacts/locations/us-central1/workerPools/antfly-container-builders
  ZIG_ARTIFACT_BUCKET: antfly-image-artifacts-zig-build-artifacts
  ZIG_VERSION: 0.16.0

jobs:
  build-artifact:
    name: Build ${{ matrix.arch }} artifact
    if: ${{ inputs.artifact_source != 'github' }}
    runs-on: ${{ matrix.runner }}
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: arc-antfly-publish
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - arch: arm64
            runner: arc-antfly-publish-arm64
            zig_arch: aarch64
            zig_target: aarch64-linux-musl
            zig_optimize: ReleaseSmall
            zig_jobs: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify runner architecture
        run: |
          case "$(uname -m)" in
            x86_64) actual=amd64 ;;
            aarch64) actual=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "expected ${{ matrix.arch }} runner, got ${actual}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_arch }}-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build runtime artifact
        run: |
          VERSION="${{ inputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$VERSION" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "antfly-zig-${{ matrix.arch }}.tar.gz" \
            --out-dir "$RUNNER_TEMP" \
            --metal false \
            --system-blas false

      - name: Upload runtime artifact to GCS
        run: |
          gsutil cp \
            "$RUNNER_TEMP/antfly-zig-${{ matrix.arch }}.tar.gz" \
            "gs://${ZIG_ARTIFACT_BUCKET}/zig/${GITHUB_SHA}/antfly-zig-${{ matrix.arch }}.tar.gz"

  publish:
    runs-on: arc-antfly-publish
    needs: build-artifact
    if: ${{ always() && (inputs.artifact_source == 'github' || needs.build-artifact.result == 'success') }}
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download release runtime archives
        if: ${{ inputs.artifact_source == 'github' }}
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-linux-*
          merge-multiple: true
          path: dist/release-archives

      - name: Upload release runtime archives to GCS
        if: ${{ inputs.artifact_source == 'github' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-artifacts"
          cp dist/release-archives/antfly_*_Linux_x86_64.tar.gz "$RUNNER_TEMP/container-artifacts/antfly-zig-amd64.tar.gz"
          cp dist/release-archives/antfly_*_Linux_arm64.tar.gz "$RUNNER_TEMP/container-artifacts/antfly-zig-arm64.tar.gz"
          for arch in amd64 arm64; do
            gsutil cp \
              "$RUNNER_TEMP/container-artifacts/antfly-zig-${arch}.tar.gz" \
              "gs://${ZIG_ARTIFACT_BUCKET}/zig/${GITHUB_SHA}/antfly-zig-${arch}.tar.gz"
          done

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.tag_name || github.event.release.tag_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

      - name: Package GAR images with Cloud Build
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "gcloud builds submit failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          for arch in amd64 arm64; do
            submit_cloud_build . \
              --project="${GCP_PROJECT}" \
              --region="${GCP_REGION}" \
              --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
              --config=zig/cloudbuild.runtime.yaml \
              --substitutions="_ARTIFACT_URI=gs://${ZIG_ARTIFACT_BUCKET}/zig/${GITHUB_SHA}/antfly-zig-${arch}.tar.gz,_IMAGE_NAME=antfly,_DOCKERFILE=zig/Dockerfile.runtime,_CONTEXT=/workspace/.zig-container,_ALIAS_TAG=__skip_alias__,_VERSION_TAG=${VERSION}-${arch},_PLATFORMS=linux/${arch},_DESCRIPTION=AntflyDB Zig runtime image"
          done

      - name: Create GAR multi-arch manifest with Cloud Build
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "gcloud builds submit failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          ALIAS_TAG=latest
          if [[ "$VERSION" == *-* || "$VERSION" == v0.1.* ]]; then
            ALIAS_TAG=__skip_alias__
          fi
          submit_cloud_build . \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
            --config=zig/cloudbuild.manifest.yaml \
            --substitutions="_IMAGE_NAME=antfly,_VERSION_TAG=${VERSION},_ALIAS_TAG=${ALIAS_TAG},_AMD64_TAG=${VERSION}-amd64,_ARM64_TAG=${VERSION}-arm64"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Mirror image GAR -> GHCR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "${{ steps.auth.outputs.access_token }}" | crane auth login "$GAR_REGISTRY" -u oauth2accesstoken --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAGS=("${VERSION}")
          if [[ "$VERSION" != *-* && "$VERSION" != v0.1.* ]]; then
            TAGS=(latest "${TAGS[@]}")
          fi
          for tag in "${TAGS[@]}"; do
            crane copy \
              "$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly:${tag}" \
              "ghcr.io/antflydb/antfly:${tag}"
          done

      - uses: sigstore/cosign-installer@v3

      - name: Sign GHCR images
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=("${VERSION}")
          if [[ "$VERSION" != *-* && "$VERSION" != v0.1.* ]]; then
            TAGS=(latest "${TAGS[@]}")
          fi
          for tag in "${TAGS[@]}"; do
            cosign sign --yes \
              -a "repo=${{ github.repository }}" \
              -a "workflow=${{ github.workflow }}" \
              -a "ref=${{ github.sha }}" \
              "ghcr.io/antflydb/antfly:${tag}"
          done

      - name: Sign GAR images
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=("${VERSION}")
          if [[ "$VERSION" != *-* && "$VERSION" != v0.1.* ]]; then
            TAGS=(latest "${TAGS[@]}")
          fi
          for tag in "${TAGS[@]}"; do
            cosign sign --yes \
              -a "repo=${{ github.repository }}" \
              -a "workflow=${{ github.workflow }}" \
              -a "ref=${{ github.sha }}" \
              "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GCP_REPOSITORY }}/antfly:${tag}"
          done
