name: Container promotion

# This workflow is deliberately callable only. The default-branch release
# controller authenticates and restores the release bundle before invoking it.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "Authenticated release tag (for example v1.0.0)"
        required: true
        type: string
      source_commit:
        description: "Authenticated release source commit"
        required: true
        type: string
      ledger_sha256:
        description: "Digest of the authenticated release ledger"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_REGION: us-central1
  GCP_PROJECT: antfly-image-artifacts
  GCP_REPOSITORY: containers
  GAR_REGISTRY: us-central1-docker.pkg.dev
  CLOUD_BUILD_WORKER_POOL: projects/antfly-image-artifacts/locations/us-central1/workerPools/antfly-container-builders
  ZIG_ARTIFACT_BUCKET: antfly-image-artifacts-zig-build-artifacts

jobs:
  publish:
    runs-on: arc-antfly-publish
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: true

      - name: Revalidate trusted caller and release identity
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_COMMIT: ${{ inputs.source_commit }}
          LEDGER_SHA256: ${{ inputs.ledger_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_run|repository_dispatch) ;;
            *) echo "untrusted container caller event: $GITHUB_EVENT_NAME" >&2; exit 2 ;;
          esac
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi
          [[ "$LEDGER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"

      - uses: actions/download-artifact@v6
        with:
          name: antfly-release-runtime-archives
          path: dist/release-archives

      - name: Select the canonical GNU container archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-artifacts"
          while IFS= read -r entry; do
            arch="$(jq -r .container_arch <<<"$entry")"
            archive_pattern="$(jq -r .archive_pattern <<<"$entry")"
            mapfile -t archives < <(compgen -G "dist/release-archives/$archive_pattern")
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "expected one $archive_pattern archive, found ${#archives[@]}" >&2
              exit 1
            fi
            cp "${archives[0]}" "$RUNNER_TEMP/container-artifacts/antfly-zig-${arch}-gnu.tar.gz"
          done < <(python scripts/release/release_platforms.py consumer-matrix container | jq -c '.include[]')

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Authenticate immutable container registries
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | crane auth login "$GAR_REGISTRY" -u oauth2accesstoken --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Upload verified runtime archives to immutable build inputs
        env:
          RELEASE_COMMIT: ${{ inputs.source_commit }}
          LEDGER_SHA256: ${{ inputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gsutil cp \
              "$RUNNER_TEMP/container-artifacts/antfly-zig-${arch}-gnu.tar.gz" \
              "gs://${ZIG_ARTIFACT_BUCKET}/zig/${RELEASE_COMMIT}/${LEDGER_SHA256}/antfly-zig-${arch}-gnu.tar.gz"
          done

      - name: Package architecture images with Cloud Build
        env:
          RELEASE_COMMIT: ${{ inputs.source_commit }}
          LEDGER_SHA256: ${{ inputs.ledger_sha256 }}
          BUILD_TAG: release-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              echo "gcloud builds submit failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done
          }
          for arch in amd64 arm64; do
            submit_cloud_build . \
              --project="${GCP_PROJECT}" \
              --region="${GCP_REGION}" \
              --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
              --config=zig/cloudbuild.runtime.yaml \
              --substitutions="_ARTIFACT_URI=gs://${ZIG_ARTIFACT_BUCKET}/zig/${RELEASE_COMMIT}/${LEDGER_SHA256}/antfly-zig-${arch}-gnu.tar.gz,_IMAGE_NAME=antfly,_DOCKERFILE=zig/Dockerfile.runtime,_CONTEXT=/workspace/.zig-container,_ALIAS_TAG=__skip_alias__,_VERSION_TAG=${BUILD_TAG}-${arch},_PLATFORMS=linux/${arch},_DESCRIPTION=AntflyDB Zig runtime image"
          done

      - name: Seal ledger-addressed architecture images
        env:
          BUILD_TAG: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          LEDGER_TAG: sha256-${{ inputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          promote_ref() {
            local source="$1" destination="$2" source_digest destination_digest actual_digest
            source_digest="$(crane digest "$source")"
            destination_digest="$(crane digest "$destination" 2>/dev/null || true)"
            if [ -n "$destination_digest" ]; then
              if [ "$destination_digest" != "$source_digest" ]; then
                echo "immutable container tag differs: $destination" >&2
                echo "existing: $destination_digest" >&2
                echo "new:      $source_digest" >&2
                return 1
              fi
              echo "immutable container tag already matches: $destination"
              return 0
            fi
            crane copy "$source" "$destination"
            actual_digest="$(crane digest "$destination")"
            test "$actual_digest" = "$source_digest"
          }
          image="$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly"
          for arch in amd64 arm64; do
            promote_ref "${image}:${BUILD_TAG}-${arch}" "${image}:${LEDGER_TAG}-${arch}"
          done

      - name: Create the multi-architecture manifest last
        env:
          BUILD_TAG: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          LEDGER_TAG: sha256-${{ inputs.ledger_sha256 }}
        run: |
          submit_cloud_build() {
            local attempt sleep_seconds
            for attempt in 1 2 3; do
              if gcloud builds submit "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 15))
              sleep "${sleep_seconds}"
            done
          }
          submit_cloud_build . \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --worker-pool="${CLOUD_BUILD_WORKER_POOL}" \
            --config=zig/cloudbuild.manifest.yaml \
            --substitutions="_IMAGE_NAME=antfly,_VERSION_TAG=${BUILD_TAG},_ALIAS_TAG=__skip_alias__,_AMD64_TAG=${LEDGER_TAG}-amd64,_ARM64_TAG=${LEDGER_TAG}-arm64"

      - name: Seal ledger and version image tags
        env:
          VERSION: ${{ inputs.tag_name }}
          BUILD_TAG: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          LEDGER_TAG: sha256-${{ inputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          promote_ref() {
            local source="$1" destination="$2" source_digest destination_digest actual_digest
            source_digest="$(crane digest "$source")"
            destination_digest="$(crane digest "$destination" 2>/dev/null || true)"
            if [ -n "$destination_digest" ]; then
              if [ "$destination_digest" != "$source_digest" ]; then
                echo "immutable container tag differs: $destination" >&2
                echo "existing: $destination_digest" >&2
                echo "new:      $source_digest" >&2
                return 1
              fi
              echo "immutable container tag already matches: $destination"
              return 0
            fi
            crane copy "$source" "$destination"
            actual_digest="$(crane digest "$destination")"
            test "$actual_digest" = "$source_digest"
          }
          gar_image="$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly"
          promote_ref "${gar_image}:${BUILD_TAG}" "${gar_image}:${LEDGER_TAG}"
          for arch in amd64 arm64; do
            promote_ref "${gar_image}:${LEDGER_TAG}-${arch}" "${gar_image}:${VERSION}-${arch}"
          done
          promote_ref "${gar_image}:${LEDGER_TAG}" "${gar_image}:${VERSION}"
          promote_ref "${gar_image}:${LEDGER_TAG}" "ghcr.io/antflydb/antfly:${VERSION}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign the immutable GAR and GHCR image digests
        env:
          VERSION: ${{ inputs.tag_name }}
          LEDGER_SHA256: ${{ inputs.ledger_sha256 }}
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ inputs.source_commit }}" \
            -a "ledger_sha256=${LEDGER_SHA256}" \
            "$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly:${VERSION}"
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ inputs.source_commit }}" \
            -a "ledger_sha256=${LEDGER_SHA256}" \
            "ghcr.io/antflydb/antfly:${VERSION}"
