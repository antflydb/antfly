# Proxy CI for the Antfly proxy library module.

name: Proxy Tests

on:
  push:
    branches: ["main"]
    paths:
      - "go/pkg/proxy/**"
      - ".github/workflows/antfly-proxy-go.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "go/pkg/proxy/**"
      - ".github/workflows/antfly-proxy-go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: "1.26.4"

jobs:
  proxies:
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Test proxies
        run: cd go/pkg/proxy && GOWORK=off go test ./...
