# Proxy CI for the Antfly proxy library module.

name: Proxy Tests

on:
  push:
    branches: ["main"]
    paths:
      - "go/pkg/proxy/**"
      - "scripts/ci/toolchain-policy.json"
      - ".github/actions/load-toolchain-policy/action.yml"
      - ".github/workflows/antfly-proxy-go.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "go/pkg/proxy/**"
      - "scripts/ci/toolchain-policy.json"
      - ".github/actions/load-toolchain-policy/action.yml"
      - ".github/workflows/antfly-proxy-go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  proxies:
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Test proxies
        run: cd go/pkg/proxy && GOWORK=off go test ./...
