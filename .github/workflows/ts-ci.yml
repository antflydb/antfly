name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "ts/**"
      - "zig/pkg/antfly/antfarm/**"
      - "openapi.yaml"
      - "specs/openapi/**"
      - ".github/workflows/ts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ts/**"
      - "zig/pkg/antfly/antfarm/**"
      - "openapi.yaml"
      - "specs/openapi/**"
      - ".github/workflows/ts-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # Preserve the required-check name and pin the canonical bundle producer
    # so generated bytes do not drift with runner or Node aliases.
    name: test (24.x)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts

    strategy:
      matrix:
        node-version: ["24.16.0"]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json

      - name: Use pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ts/package.json
          cache: 'pnpm'
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type check
        run: pnpm lint

      - name: Verify generated SDKs
        run: |
          pnpm --filter @antfly/sdk generate
          status="$(git status --porcelain -- packages/sdk/src/public-api.d.ts packages/sdk/src/query.d.ts)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Upload canonical Antfarm bundle
        uses: actions/upload-artifact@v6
        with:
          name: antfarm-linux-node-${{ matrix.node-version }}-${{ github.sha }}
          path: ts/apps/antfarm/dist
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        run: pnpm test

  embedded-antfarm:
    name: Verify embedded Antfarm bundle
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download canonical Antfarm bundle
        uses: actions/download-artifact@v6
        with:
          name: antfarm-linux-node-24.16.0-${{ github.sha }}
          path: ts/apps/antfarm/dist

      - name: Verify checked-in bundle
        run: diff -qr ts/apps/antfarm/dist zig/pkg/antfly/antfarm

  playwright:
    needs: [test]
    timeout-minutes: 60
    runs-on: arc-antfly-heavy
    env:
      PNPM_STORE_PATH: /mnt/cache/pnpm-store
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Configure cache directories
        run: |
          playwright_browsers_path="${RUNNER_TEMP}/playwright-browsers"
          xdg_cache_home="${RUNNER_TEMP}/xdg"
          tmpdir="${RUNNER_TEMP}/tmp"

          {
            echo "PLAYWRIGHT_BROWSERS_PATH=${playwright_browsers_path}"
            echo "XDG_CACHE_HOME=${xdg_cache_home}"
            echo "TMPDIR=${tmpdir}"
          } >> "$GITHUB_ENV"

          mkdir -p "$PNPM_STORE_PATH" "$playwright_browsers_path" "$xdg_cache_home" "$tmpdir"
        working-directory: .

      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Configure pnpm cache
        run: pnpm config set store-dir "$PNPM_STORE_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright OS Dependencies
        working-directory: ts/apps/antfarm
        # ARC package mirrors can take more than ten minutes to serve the
        # Ubuntu browser dependency set even when apt is making progress.
        # Keep this below the job timeout while avoiding false cancellations
        # before Playwright itself runs.
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          time pnpm exec playwright install-deps chromium

      # ARC hangs extracting Playwright-managed browser archives, so use apt-installed Chrome.
      - name: Install Google Chrome
        working-directory: .
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          chrome_deb="${RUNNER_TEMP}/google-chrome-stable_current_amd64.deb"
          curl -fsSL -o "$chrome_deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y "$chrome_deb"
          google-chrome --version

      - name: Preview server
        working-directory: ts/apps/antfarm
        run: pnpm preview &

      - name: Wait for Server
        working-directory: ts/apps/antfarm
        run: pnpm exec wait-on http://localhost:4173

      - name: Run Playwright tests
        working-directory: ts/apps/antfarm
        run: pnpm exec playwright test --project=chromium --reporter=list
        env:
          ANTFARM_PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
          BASE_URL: http://localhost:4173

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ts/apps/antfarm/playwright-report/
          retention-days: 30
