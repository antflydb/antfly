name: Linux Release Archives

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release-style tag used to derive the archive version
        required: true
        type: string
      upload_artifacts:
        description: Upload the built archives for downstream release jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-zig-runtime-archives-linux:
    name: Build Zig archive (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: antfly-zig-linux-amd64
            runner: arc-antfly-publish
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            archive_arch: x86_64
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-arm64
            runner: arc-antfly-publish-arm64
            zig_arch: aarch64
            zig_target: aarch64-linux-musl
            archive_arch: arm64
            zig_optimize: ReleaseSmall
            zig_jobs: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install native Zig toolchain
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-${{ matrix.zig_arch }}-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build release package
        shell: bash
        env:
          ANTFLY_RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          version="${ANTFLY_RELEASE_TAG#v}"
          archive="antfly_${version}_Linux_${{ matrix.archive_arch }}.tar.gz"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$version" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "$archive" \
            --out-dir dist/release-archives \
            --metal false \
            --system-blas false

      - name: Upload archive
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release-archives/*.tar.gz
          if-no-files-found: error
