name: Zig Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Full validation scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - inference-e2e

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-global-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: arc-antfly-standard
    outputs:
      zig_tests: ${{ steps.detect.outputs.zig_tests }}
      e2e: ${{ steps.detect.outputs.e2e }}
      model_check: ${{ steps.detect.outputs.model_check }}
      trace_validate: ${{ steps.detect.outputs.trace_validate }}
      backup_s3: ${{ steps.detect.outputs.backup_s3 }}
      release_tooling: ${{ steps.detect.outputs.release_tooling }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.validation_scope }}" == "inference-e2e" ]]; then
              {
                echo "zig_tests=false"
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
                echo "backup_s3=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
              echo "release_tooling=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.schedule }}" == "0 3 * * 0" ]]; then
              {
                echo "e2e=false"
                echo "model_check=true"
                echo "trace_validate=true"
                echo "backup_s3=false"
                echo "release_tooling=false"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
                echo "backup_s3=true"
                echo "release_tooling=false"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
              echo "release_tooling=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(exclude,glob)zig/pkg/antfly/antfarm/**' \
            ':(glob)scripts/ci/**' \
            scripts/test-backup-s3-integration.sh \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "zig_tests=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(exclude,glob)zig/pkg/antfly/antfarm/**' \
            ':(glob)scripts/ci/**' \
            scripts/test-backup-s3-integration.sh \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            scripts/test-backup-s3-integration.sh \
            zig/build.zig \
            zig/lib/httpx \
            zig/lib/objectstore \
            zig/pkg/antfly/src/api/backups.zig \
            zig/pkg/antfly/src/serverless/remote_uri.zig \
            .github/workflows/zig-tests.yml
          then
            echo "backup_s3=false" >> "$GITHUB_OUTPUT"
          else
            echo "backup_s3=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            Makefile \
            .github/workflows/zig-tests.yml
          then
            echo "model_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "model_check=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            ':(glob)zig/pkg/antfly/src/tracing/**' \
            ':(glob)zig/pkg/antfly/src/raft/**' \
            ':(glob)zig/pkg/antfly/src/storage/db/**' \
            ':(glob)zig/lib/raft/**' \
            Makefile \
            zig/build.zig \
            .github/workflows/zig-tests.yml
          then
            echo "trace_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "trace_validate=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob).github/workflows/*.yml' \
            ':(glob).github/workflows/*.yaml' \
            .github/dependabot.yml \
            scripts/install.sh \
            scripts/publish-zig-runtime-dev.sh \
            scripts/test_install_download_markers.sh \
            scripts/test_quickstart_docs.py \
            ':(glob)scripts/packaging/**' \
            ':(glob)scripts/release/**' \
            py/packages/cli/pyproject.toml \
            ':(glob)ts/packages/cli*/**' \
            docs/cli-packaging.md \
            docs/guides/quickstart.mdx \
            RELEASE.md \
            zig/Dockerfile.runtime \
            zig/cloudbuild.manifest.yaml \
            zig/cloudbuild.runtime.yaml \
            .github/workflows/zig-tests.yml
          then
            echo "release_tooling=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_tooling=true" >> "$GITHUB_OUTPUT"
          fi

  release-tooling:
    name: release-tooling
    needs: changes
    if: needs.changes.outputs.release_tooling == 'true'
    runs-on: arc-antfly-standard
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Test release packaging and scripts
        run: scripts/release/test.sh

  backup-s3-integration:
    name: backup-s3-integration
    needs: changes
    # Opt in explicitly to avoid GitHub-hosted runner charges while this
    # service-backed integration is temporarily disabled.
    if: needs.changes.outputs.backup_s3 == 'true' && vars.ENABLE_BACKUP_S3_INTEGRATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Run backup listing against MinIO
        run: scripts/test-backup-s3-integration.sh

  arm64-codec:
    name: ${{ (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') && 'zig-base / arm64-codec' || 'zig-full / arm64-codec' }}
    needs: changes
    if: |
      (
        (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') &&
        (
          needs.changes.outputs.zig_tests == 'true' ||
          needs.changes.outputs.model_check == 'true' ||
          needs.changes.outputs.trace_validate == 'true'
        )
      ) ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'all') ||
      github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-publish-arm64
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.16.0"
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-arm64-codec
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache-arm64-codec
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify native Linux ARM64 runner
        run: |
          set -euo pipefail
          uname -srm
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "aarch64"

      - name: Install Zig
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl xz-utils
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" \
            -C "$RUNNER_TEMP/zig" \
            --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Verify Zig version
        run: test "$(zig version)" = "$ZIG_VERSION"

      - name: Run StreamVByte codec tests
        run: |
          set -euo pipefail
          zig test zig/pkg/antfly/src/encoding/streamvbyte.zig
          zig test -O ReleaseFast zig/pkg/antfly/src/encoding/streamvbyte.zig
          zig test zig/pkg/antfly/src/encoding/chunked_coder.zig
          zig test -O ReleaseFast zig/pkg/antfly/src/encoding/chunked_coder.zig

  zig-base-tests:
    name: zig-base / x86_64
    needs: changes
    if: (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') && (needs.changes.outputs.zig_tests == 'true' || needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true')
    runs-on: arc-antfly-heavy
    # Keep the outer job timeout above the in-step hard watchdog so true hangs
    # produce the watchdog stack dump instead of an opaque GitHub cancellation.
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb file

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      - name: Check generated sources
        run: make zig-generated-check

      - name: Test bounded-build tooling
        working-directory: zig
        run: >-
          python3 -m unittest
          tools/test_patch_zig_0_16_build_runner_maxrss.py
          tools/test_run_bounded_zig_build.py
          tools/test_analyze_zig_import_graph.py
          tools/test_audit_storage_test_shards.py
          tools/test_run_test_partitions.py
          tools/test_run_recall_checks.py

      - name: Check inference kernel generator
        working-directory: zig/pkg/inference
        run: zig build quant-kernel-local-check -Dmetal=false -Dcuda=false

      - name: Run inference benchmark and release contract tests
        working-directory: zig/pkg/inference
        run: |
          python3 -m unittest \
            scripts.gemma4.test_benchmark_gemma4_long_e2e_server \
            scripts.gemma4.test_benchmark_gemma4_cuda_batching \
            scripts.gemma4.test_benchmark_gemma4_cuda_matrix \
            scripts.gemma4.test_benchmark_metal_gemma4_ab \
            scripts.gemma4.test_benchmark_metal_gemma4_long_output \
            scripts.test_content_security_contract \
            scripts.gemma4.test_gemma4_cuda_l4_release_gate \
            scripts.gemma4.test_gemma4_cuda_production_gate \
            scripts.gemma4.test_gemma4_qat_cuda_tuning \
            scripts.gemma4.test_gemma4_qat_llamacpp_pair_benchmark \
            scripts.test_paired_benchmark \
            scripts.test_regen_cuda_artifacts \
            scripts.test_summarize_cuda_flash_prefill_v2 \
            scripts.gemma4.test_validate_gemma4_cuda_candidate \
            scripts.gemma4.test_validate_gemma4_cuda_quality_candidate

      - name: Test reproducible release archive packaging
        run: python3 scripts/packaging/test_reproducible_tar.py

      # ARC may expose the shared node's memory total when the runner cgroup is
      # unlimited. Cap the aggregate scheduler budget at 20 GiB so concurrent
      # test runtimes cannot overcommit the runner while still admitting the
      # largest individual compile step, which reserves 20 GiB. The patched
      # 0.16 runner correctly reserves each ready step's max_rss claim as it
      # wakes it.
      - name: Configure bounded parallel unit tests
        if: needs.changes.outputs.zig_tests == 'true'
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"
          echo "max_rss=$(python3 zig/tools/run_bounded_zig_build.py --print-max-rss --max-rss-cap 21474836480)" >> "$GITHUB_OUTPUT"
          zig_lib_dir="$(zig env | sed -n 's/^[[:space:]]*\.lib_dir = "\(.*\)",$/\1/p')"
          patched_runner="${RUNNER_TEMP}/zig-build-runner-maxrss.zig"
          python3 zig/tools/patch_zig_0_16_build_runner_maxrss.py \
            "$zig_lib_dir/compiler/build_runner.zig" \
            "$patched_runner"
          echo "build_runner=$patched_runner" >> "$GITHUB_OUTPUT"

      - name: Run hermetic Antfly unit tests
        if: needs.changes.outputs.zig_tests == 'true'
        env:
          ANTFLY_TEST_CLEANUP_TRACE: "1"
        run: |
          set -euo pipefail

          collect_descendants() {
            local roots="$*"
            local all=" ${roots} "
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              while read -r pid ppid; do
                if [[ " $all " == *" $ppid "* && " $all " != *" $pid "* ]]; then
                  all="${all}${pid} "
                  changed=1
                fi
              done < <(ps -eo pid=,ppid=)
            done
            echo "$all"
          }

          dump_stacks() {
            local root_pid="$1"
            echo "::group::antfly unit watchdog ptrace settings"
            if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
              cat /proc/sys/kernel/yama/ptrace_scope || true
            fi
            sysctl kernel.yama.ptrace_scope 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::antfly unit watchdog process tree"
            ps -eo pid,ppid,stat,etime,cmd | awk 'NR == 1 || /zig build|zig-local|\/test|make zig-unit-test|make -C \.\/zig unit-test/' || true
            echo "::endgroup::"

            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if ! kill -0 "$pid" 2>/dev/null; then
                continue
              fi
              local cmdline
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              case "$cmdline" in
                *"/test "*|*"/test"*|*"zig build"*|*" make "*)
                  echo "::group::proc snapshot pid=$pid cmd=$cmdline"
                  if [ -r "/proc/$pid/status" ]; then
                    grep -E "^(Name|State|Pid|PPid|Threads|VmRSS|VmHWM|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):" "/proc/$pid/status" || true
                  fi
                  if [ -r "/proc/$pid/wchan" ]; then
                    printf "wchan="
                    cat "/proc/$pid/wchan" || true
                    printf "\n"
                  fi
                  if [ -r "/proc/$pid/stack" ]; then
                    cat "/proc/$pid/stack" || true
                  fi
                  echo "::endgroup::"

                  echo "::group::gdb thread dump pid=$pid cmd=$cmdline"
                  timeout 45s gdb -batch -p "$pid" \
                    -ex "set pagination off" \
                    -ex "thread apply all bt" \
                    -ex "detach" || \
                    timeout 45s sudo gdb -batch -p "$pid" \
                      -ex "set pagination off" \
                      -ex "thread apply all bt" \
                      -ex "detach" || true
                  echo "::endgroup::"
                  ;;
              esac
            done
          }

          terminate_tree() {
            local root_pid="$1"
            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            sleep 5
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done
          }

          if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
            echo "::group::configure ptrace for unit watchdog"
            echo "ptrace_scope before: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            sudo sysctl -w kernel.yama.ptrace_scope=0 || true
            echo "ptrace_scope after: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            echo "::endgroup::"
          fi

          unit_log="${RUNNER_TEMP:-/tmp}/antfly-zig-unit.log"
          : > "$unit_log"

          (
            set +e
            taskset -c "${{ steps.cpus.outputs.list }}" make zig-unit-test ZIG_BUILD_FLAGS="--build-runner ${{ steps.cpus.outputs.build_runner }} --maxrss ${{ steps.cpus.outputs.max_rss }}" 2>&1 | tee -a "$unit_log"
            exit "${PIPESTATUS[0]}"
          ) &
          unit_pid="$!"
          (
            # A cold Zig compile can legitimately remain silent for more than
            # 15 minutes on the x86_64 ARC runner. Keep the idle watchdog below
            # the independent hard limit without killing an active cold build.
            idle_limit_secs="${ANTFLY_UNIT_WATCHDOG_IDLE_SECS:-1800}"
            hard_limit_secs="${ANTFLY_UNIT_WATCHDOG_HARD_SECS:-3600}"
            start_epoch="$(date +%s)"
            last_progress_epoch="$start_epoch"
            last_mtime=0
            while kill -0 "$unit_pid" 2>/dev/null; do
              sleep 15
              now_epoch="$(date +%s)"
              if [ -e "$unit_log" ]; then
                current_mtime="$(stat -c %Y "$unit_log" 2>/dev/null || echo 0)"
                if [ "$current_mtime" -gt "$last_mtime" ]; then
                  last_mtime="$current_mtime"
                  last_progress_epoch="$now_epoch"
                fi
              fi

              elapsed_secs=$((now_epoch - start_epoch))
              idle_secs=$((now_epoch - last_progress_epoch))
              if [ "$hard_limit_secs" -gt 0 ] && [ "$elapsed_secs" -ge "$hard_limit_secs" ]; then
                echo "::error::zig-unit-test hard watchdog fired after ${elapsed_secs}s; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
              if [ "$idle_limit_secs" -gt 0 ] && [ "$idle_secs" -ge "$idle_limit_secs" ]; then
                echo "::error::zig-unit-test idle watchdog fired after ${idle_secs}s without unit log progress; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
            done
          ) &
          watchdog_pid="$!"

          status=0
          wait "$unit_pid" || status="$?"
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ] && [ -d /sys/fs/cgroup ]; then
            echo "::group::unit failure cgroup memory"
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "[$metric]"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Set up Java for TLA+
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLA verification
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        env:
          ANTFLY_TLA_MODEL_CHECK: ${{ needs.changes.outputs.model_check }}
          ANTFLY_TLA_TRACE_VALIDATE: ${{ needs.changes.outputs.trace_validate }}
        run: scripts/ci/zig-tla-verify.sh

  zig-full-tests:
    name: zig-full / x86_64
    needs: changes
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'all') || github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-heavy
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      - name: Check generated sources
        run: make zig-generated-check

      - name: Test bounded-build tooling
        working-directory: zig
        run: >-
          python3 -m unittest
          tools/test_patch_zig_0_16_build_runner_maxrss.py
          tools/test_run_bounded_zig_build.py
          tools/test_analyze_zig_import_graph.py
          tools/test_audit_storage_test_shards.py
          tools/test_run_test_partitions.py
          tools/test_run_recall_checks.py

      # Keep normal build-step parallelism while bounding aggregate compiler
      # memory to the pod's cgroup budget.
      - name: Configure bounded parallel heavy tests
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"
          echo "max_rss=$(python3 zig/tools/run_bounded_zig_build.py --print-max-rss --max-rss-cap 21474836480)" >> "$GITHUB_OUTPUT"
          zig_lib_dir="$(zig env | sed -n 's/^[[:space:]]*\.lib_dir = "\(.*\)",$/\1/p')"
          patched_runner="${RUNNER_TEMP}/zig-build-runner-maxrss.zig"
          python3 zig/tools/patch_zig_0_16_build_runner_maxrss.py \
            "$zig_lib_dir/compiler/build_runner.zig" \
            "$patched_runner"
          echo "build_runner=$patched_runner" >> "$GITHUB_OUTPUT"

      - name: Run full Zig unit tests
        run: |
          set +e
          taskset -c ${{ steps.cpus.outputs.list }} make zig-unit-test ZIG_BUILD_FLAGS="--build-runner ${{ steps.cpus.outputs.build_runner }} --maxrss ${{ steps.cpus.outputs.max_rss }}"
          status="$?"
          if [ "$status" -ne 0 ] && [ -d /sys/fs/cgroup ]; then
            echo "::group::unit failure cgroup memory"
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "[$metric]"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Run corpus-scale release regressions
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          release-scale-test
          recall-harness-build
          --build-runner ${{ steps.cpus.outputs.build_runner }}
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Set up Java for TLA+
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLA verification
        env:
          ANTFLY_TLA_MODEL_CHECK: "true"
          ANTFLY_TLA_TRACE_VALIDATE: "true"
        run: scripts/ci/zig-tla-verify.sh

      - name: Run Zig simulation tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          sim-test
          --build-runner ${{ steps.cpus.outputs.build_runner }}
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Run Zig integration tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          integration-test
          --build-runner ${{ steps.cpus.outputs.build_runner }}
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Run Zig recall checks
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          recall-ci-test
          --build-runner ${{ steps.cpus.outputs.build_runner }}
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Run Zig chaos tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          chaos-test
          --build-runner ${{ steps.cpus.outputs.build_runner }}
          --maxrss ${{ steps.cpus.outputs.max_rss }}

  zig-base:
    name: zig-base
    needs: [changes, zig-base-tests, arm64-codec]
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') &&
      (
        needs.changes.result != 'success' ||
        needs.changes.outputs.zig_tests == 'true' ||
        needs.changes.outputs.model_check == 'true' ||
        needs.changes.outputs.trace_validate == 'true'
      )
    runs-on: arc-antfly-standard
    steps:
      - name: Verify zig-base shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-base-tests.result }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"

  zig-full:
    name: zig-full
    needs: [changes, zig-full-tests, arm64-codec]
    if: |
      always() &&
      (
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'all') ||
        github.event.schedule == '0 8 * * *'
      )
    runs-on: arc-antfly-standard
    steps:
      - name: Verify zig-full shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-full-tests.result }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"

  e2e-base-build:
    name: e2e-base / build
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true'
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      ANTFLY_CI_TRACE: "1"
      # The PR E2E artifact is also the release-packaging smoke artifact. Build
      # the partitioned graph once, test that exact binary, and reuse its
      # distributed PIC archive for both public C API packaging shapes.
      ANTFLY_CI_ZIG_OPTIMIZE: ReleaseFast
      ANTFLY_CI_ZIG_STRIP: "true"
      ANTFLY_CI_BUILD_CAPI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Build E2E executable once
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Package E2E executable
        run: tar -C zig -czf "${RUNNER_TEMP}/antfly-e2e-base.tar.gz" zig-out/bin/antfly

      - name: Upload E2E executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: antfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-base.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 1

  e2e-base-tests:
    name: e2e-base / ${{ matrix.suite }}
    needs: [changes, e2e-base-build]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.e2e-base-build.result == 'success'
    runs-on: arc-antfly-heavy
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [antfly, inference]
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ matrix.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      UV_CACHE_DIR: /mnt/cache/antfly/zig/uv
      HF_HOME: /mnt/cache/antfly/zig/hf
      ANTFLY_E2E_DURATION_FILE: /mnt/cache/antfly/zig/e2e-durations/antfly-v1.json
      ANTFLY_CI_TRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ matrix.suite }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          test_tmp="/mnt/cache/antfly/zig/e2e-tmp/${{ github.job }}/${{ matrix.suite }}/${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "ZIG_LOCAL_CACHE_DIR=$local_cache"
            echo "ZIG_GLOBAL_CACHE_DIR=$global_cache"
            echo "TMPDIR=$test_tmp"
          } >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$test_tmp" "$UV_CACHE_DIR" "$HF_HOME" "$(dirname "$ANTFLY_E2E_DURATION_FILE")"
          mkdir -p "/mnt/cache/antfly/zig/home-cache-${{ matrix.suite }}" "/mnt/cache/antfly/zig/home-antfly-${{ matrix.suite }}"
          rm -rf ~/.cache ~/.antfly
          ln -s "/mnt/cache/antfly/zig/home-cache-${{ matrix.suite }}" ~/.cache
          ln -s "/mnt/cache/antfly/zig/home-antfly-${{ matrix.suite }}" ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Download E2E executable
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-base

      - name: Install E2E executable
        run: tar -xzf "${RUNNER_TEMP}/antfly-e2e-base/antfly-e2e-base.tar.gz" -C zig

      - name: Run base E2E
        env:
          SKIP_BUILD: "1"
          ANTFLY_E2E_SUITE: ${{ matrix.suite }}
        run: taskset -c ${{ steps.e2e_cpus.outputs.list }} scripts/ci/zig-e2e-base-linux.sh

      - name: Run low-FD HTTP worker ratchet regression
        if: matrix.suite == 'antfly'
        working-directory: zig
        env:
          ANTFLY_REQUIRE_LOW_FD_HTTP_RATCHET: "1"
        run: |
          ulimit -n 256
          taskset -c ${{ steps.e2e_cpus.outputs.list }} zig build http-low-fd-ratchet-test

      - name: Run low-FD Autograph regression
        if: matrix.suite == 'antfly'
        env:
          SKIP_BUILD: "1"
          ANTFLY_E2E_NOFILE_LIMIT: "256"
          ANTFLY_E2E_REGRESSION_REPEATS: "3"
        run: >-
          taskset -c ${{ steps.e2e_cpus.outputs.list }}
          scripts/ci/zig-e2e-regression-loop.sh
          e2e/antfly/test_resolution.py::test_multinode_autograph_resolves_promotes_and_hydrates_entities

  e2e-base:
