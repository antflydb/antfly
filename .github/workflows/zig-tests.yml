        if: needs.changes.outputs.zig_tests == 'true'
        env:
          ANTFLY_TEST_WORK_PROFILE: "1"
          ANTFLY_TEST_CLEANUP_TRACE: "1"
          ANTFLY_TEST_TIMINGS: "1"
        run: >-
          bash scripts/ci/run-zig-unit-tests.sh
          '${{ steps.cpus.outputs.list }}'
          '${{ steps.cpus.outputs.max_rss }}'

      - name: Verify externally fetched Apache Zig source package
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 zig/tools/check_embedded_zig_package.py --
          --maxrss ${{ steps.cpus.outputs.max_rss }}
          --summary all

      - name: Release correctness-fixture workspace
        if: always() && env.ANTFLY_TEST_WORKSPACE != ''
        run: |
          df -h "$ANTFLY_TEST_WORKSPACE"
          python3 zig/tools/fixture_workspace.py cleanup

      - name: Retain unit test progress
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zig-unit-progress-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/antfly-zig-unit.log
            ${{ runner.temp }}/antfly-zig-test-logs/*.log
            ${{ runner.temp }}/antfly-zig-test-logs/hung/
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Java for TLA+
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
