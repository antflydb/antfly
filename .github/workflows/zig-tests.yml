        working-directory: zig/pkg/inference
        run: |
          python3 -m unittest \
            scripts.gemma4.test_benchmark_gemma4_long_e2e_server \
            scripts.gemma4.test_benchmark_gemma4_cuda_batching \
            scripts.gemma4.test_benchmark_gemma4_cuda_matrix \
            scripts.gemma4.test_benchmark_metal_gemma4_ab \
            scripts.gemma4.test_benchmark_metal_gemma4_long_output \
            scripts.test_content_security_contract \
            scripts.gemma4.test_gemma4_cuda_l4_release_gate \
            scripts.gemma4.test_gemma4_cuda_production_gate \
            scripts.gemma4.test_gemma4_qat_cuda_tuning \
            scripts.gemma4.test_gemma4_qat_llamacpp_pair_benchmark \
            scripts.gemma4.test_run_gemma4_cuda_preference_smoke \
            scripts.gemma4.test_run_gemma4_unsloth_preference_benchmark \
            scripts.test_paired_benchmark \
            scripts.test_regen_cuda_artifacts \
            scripts.test_regen_cuda_training_math \
            scripts.test_regen_cuda_boundary_attention \
            scripts.test_summarize_cuda_flash_prefill_v2 \
            scripts.gemma4.test_validate_gemma4_cuda_candidate \
            scripts.gemma4.test_validate_gemma4_cuda_quality_candidate
          python3 -m unittest discover -s scripts/gliner25 -p test_verify_family_contract.py
          python3 -m unittest discover -s scripts/gliner25 -p test_compare_decide_performance.py
          python3 scripts/gliner25/format_family_captures.py --check

      - name: Run Qwen model parity and promotion contract tests
        working-directory: zig/pkg/inference
        run: >-
          uv run --with numpy==2.4.2 python
          scripts/run_model_contract_tests.py
          qwen3_embedding qwen3vl

      - name: Test reproducible release archive packaging
        run: python3 scripts/packaging/test_reproducible_tar.py

      - name: Release completed pre-unit test artifacts
        if: needs.changes.outputs.zig_tests == 'true'
        run: |
          # All earlier consumers have exited. Retire outputs and manifests
          # together: self-hosted debug emits no disposable link objects.
          cache="$ZIG_LOCAL_CACHE_DIR"
          du -sh "$cache"
          python3 zig/tools/prune_completed_test_cache.py --release-phase "$cache"
          df -h "$cache"
          df -i "$cache"

      # ARC may expose the shared node's memory total when the runner cgroup is
      # unlimited. Cap the aggregate scheduler budget at 22 GiB so concurrent
      # test runtimes cannot overcommit the runner while still admitting the
