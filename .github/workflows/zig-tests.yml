            -Dembedded-only=true -Dlite-local-inference-runtime=true -Dmetal=false -Dcuda=false \
            -j1
          cd pkg/inference
          python3 ../../tools/run_bounded_zig_build.py build test \
            '-Dtest-filter=capi resolver model identity' -Dmetal=false -Dcuda=false -j1 \
            --cache-dir "$ZIG_LOCAL_CACHE_DIR" --prefix ../../zig-out
          cd ../../..
          python3 scripts/ci/prepare_lite_previous_reader.py
          ANTFLY_LIBRARY="$GITHUB_WORKSPACE/zig/zig-out/lib/libantfly.so" \
          ANTFLY_LITE_PREVIOUS_LIBRARY="$GITHUB_WORKSPACE/.worktrees/reader-baseline-e8666a5b75/zig/zig-out/lib/libantfly.so" \
          ANTFLY_LITE_REQUIRE_PREVIOUS_READER=1 \
          ANTFLY_LITE_REQUIRE_LIBRARY=1 PYTHONPATH="$GITHUB_WORKSPACE/py/packages/embedded/src" TZ=UTC0 \
            uv run --no-project --with pytest python -m pytest -q py/packages/embedded/tests/test_graph_edge_readiness.py
          ANTFLY_LIBRARY="$GITHUB_WORKSPACE/zig/zig-out/lib/libantfly.so" \
          PYTHONPATH="$GITHUB_WORKSPACE/py/packages/embedded/src" TZ=UTC0 \
            python3 scripts/ci/run_lite_extraction_eval.py --models-dir "$models_root" \
              --output "$RUNNER_TEMP/lite-extraction-eval.json"
          ANTFLY_LIBRARY="$GITHUB_WORKSPACE/zig/zig-out/lib/libantfly.so" \
          PYTHONPATH="$GITHUB_WORKSPACE/py/packages/embedded/src" TZ=UTC0 \
            python3 scripts/ci/run_lite_embedding_test.py --models-dir "$models_root"

      - name: Locate real-model extraction evaluation
        id: lite_extraction_report
        if: always() && !cancelled()
        run: |
          if [ -f "$RUNNER_TEMP/lite-extraction-eval.json" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload real-model extraction evaluation
        if: always() && !cancelled() && steps.lite_extraction_report.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-extraction-evaluation
          path: ${{ runner.temp }}/lite-extraction-eval.json
          if-no-files-found: error

      - name: Release correctness-fixture workspace
        if: always() && env.ANTFLY_TEST_WORKSPACE != ''
        run: |
          df -h "$ANTFLY_TEST_WORKSPACE"
          python3 zig/tools/fixture_workspace.py cleanup
          # Later scale and qualification phases keep their disk-backed paths.
          echo 'ANTFLY_TEST_WORKSPACE=' >> "$GITHUB_ENV"
          echo 'ANTFLY_TEST_WORKSPACE_MOUNTED=' >> "$GITHUB_ENV"

      - name: Retain unit test progress
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zig-unit-progress-${{ github.job }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/antfly-zig-unit.log
            ${{ runner.temp }}/antfly-zig-test-logs/*.log
            ${{ runner.temp }}/antfly-zig-test-logs/hung/
          if-no-files-found: ignore
          retention-days: 14


      - name: Release completed phase compiler cache
        run: |
          # The completed phase owns this private cache. Self-hosted debug
          # emits no disposable link objects; retire outputs and manifests
          # together before the next phase. Global dependencies and zig-out stay.
          cache="$ZIG_LOCAL_CACHE_DIR"
          du -sh "$cache"
          python3 zig/tools/prune_completed_test_cache.py --release-phase "$cache"
          df -h "$cache"
          df -i "$cache"

      - name: Run corpus-scale release regressions
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          release-scale-test
          recall-harness
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Set up Java for TLA+
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLA verification
        env:
          ANTFLY_TLA_MODEL_CHECK: "true"
          ANTFLY_TLA_TRACE_VALIDATE: "true"
        run: scripts/ci/zig-tla-verify.sh

      - name: Retain TLA trace evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tla-traces-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/antfly-tla-traces/
          if-no-files-found: ignore
          retention-days: 14

      # Includes index-maintenance and index-ownership replay campaigns. The
      # fixed maintenance seed is already part of the zig-base unit aggregate.
      - name: Release completed phase compiler cache
        run: |
          # The completed phase owns this private cache. Self-hosted debug
          # emits no disposable link objects; retire outputs and manifests
          # together before the next phase. Global dependencies and zig-out stay.
          cache="$ZIG_LOCAL_CACHE_DIR"
          du -sh "$cache"
          python3 zig/tools/prune_completed_test_cache.py --release-phase "$cache"
          df -h "$cache"
          df -i "$cache"

      - name: Run Zig VOPR tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          vopr-test
          secrets-test
          vopr-build
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Test VOPR corpus retention and reuse
        timeout-minutes: 10
        run: |
          python3 -m unittest discover -s scripts/ci -p test_zig_vopr_soak.py
          python3 scripts/ci/zig_vopr_qualification.py --binary zig/zig-out/bin/vopr --output "$RUNNER_TEMP/vopr-qualification"

      - name: Retain VOPR qualification diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vopr-qualification-diagnostics
          path: |
            ${{ runner.temp }}/vopr-qualification/**/*.json
            ${{ runner.temp }}/vopr-qualification/**/*.log
            ${{ runner.temp }}/vopr-qualification/**/*.voprtrace
            ${{ runner.temp }}/vopr-qualification/**/*.voprquarantine
          retention-days: 90

      # Includes complete graph owner coverage and the native maintenance fixture;
      # no graph-specific CLI or promotion matrix is built here.
      - name: Release completed phase compiler cache
        run: |
          # The completed phase owns this private cache. Self-hosted debug
          # emits no disposable link objects; retire outputs and manifests
          # together before the next phase. Global dependencies and zig-out stay.
          cache="$ZIG_LOCAL_CACHE_DIR"
          du -sh "$cache"
          python3 zig/tools/prune_completed_test_cache.py --release-phase "$cache"
          df -h "$cache"
          df -i "$cache"

      - name: Run Zig integration tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          antfly-integration-test
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Run Zig recall checks
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          antfly-recall-test
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Run Zig chaos tests
        working-directory: zig
        run: >-
          taskset -c ${{ steps.cpus.outputs.list }}
          python3 tools/run_bounded_zig_build.py --zig zig -- build
          antfly-chaos-test
          --maxrss ${{ steps.cpus.outputs.max_rss }}

      - name: Remove job compiler cache
        if: always()
        run: |
          rm -rf -- "$ZIG_LOCAL_CACHE_DIR"

  zig-build-cache-tests:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (inputs.full_validation ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      ((inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') &&
      inputs.validation_scope == 'all') ||
      github.event.schedule == '0 8 * * *') }}
    name: zig-full / build-cache / ${{ matrix.shard }}
    needs: [admission, changes]
    runs-on: arc-antfly-heavy
    # The production ownership audit includes seven incremental source
    # mutations: measured cold/read/write phases alone take 35 minutes.
    timeout-minutes: ${{ matrix.shard == 'storage-ownership' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-1, runtime-2, storage, storage-ownership]
    env:
      ANTFLY_ZIG_MAX_RSS: "23622320128"
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      ANTFLY_BUILD_CACHE_TMPDIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils file

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.toolchain.outputs.zig_nixpkgs_revision }}.tar.gz
      - name: Install glibc-linked Zig
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
          ZIG_NIX_ATTRIBUTE: ${{ steps.toolchain.outputs.zig_nix_attribute }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A "$ZIG_NIX_ATTRIBUTE" --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"

      - name: Prepare ARC Zig cache dirs
        run: |
          mkdir -p "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR" "$ANTFLY_BUILD_CACHE_TMPDIR"
          # These checks explicitly place private compiler caches inside Python
          # temporary workspaces. Route those workspaces to the PVC as well:
          # /tmp counts toward the runner pod's 10 GiB ephemeral-storage limit.
          echo "TMPDIR=$ANTFLY_BUILD_CACHE_TMPDIR" >> "$GITHUB_ENV"

      # Each shard gets its own runner and PVC. Physical storage ownership has
      # several production rebuilds, so give it the full job budget separately
      # from the cold host-generator and linked-cache contract fixtures.
      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies

      - name: Test runtime compilation and cache contracts
        if: startsWith(matrix.shard, 'runtime-')
        working-directory: zig
        run: python3 -u -m tools.run_build_cache_contracts "${{ matrix.shard }}"

      - name: Test host-generator and linked cache contracts
        if: matrix.shard == 'storage'
        working-directory: zig
        run: python3 -u -m tools.run_build_cache_contracts storage

      - name: Verify physical storage compilation ownership
        if: matrix.shard == 'storage-ownership'
        working-directory: zig
        run: |
          cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:8])))')
          taskset -c "$cpus" python3 -u tools/check_storage_compilation.py --report storage-compilation.json

      - name: Upload storage compilation measurements
        if: ${{ always() && matrix.shard == 'storage-ownership' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-compilation
          path: zig/storage-compilation.json
          if-no-files-found: ignore

      - name: Remove build-cache temporary workspaces
        if: always()
        run: |
          # Restore the normal temporary root before action post steps run.
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          rm -rf -- "$ANTFLY_BUILD_CACHE_TMPDIR"

  zig-base:
    if: >-
      ${{ !cancelled() &&
      !inputs.full_validation &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      (inputs.pr_number != '' ||
      github.event.schedule == '0 3 * * 0') &&
      ( needs.changes.result != 'success' ||
      needs.changes.outputs.zig_tests == 'true' ||
      needs.changes.outputs.model_check == 'true' ||
      needs.changes.outputs.trace_validate == 'true' )) }}
    name: zig-base
    needs: [admission, changes, zig-base-tests, zig-base-wasm, zig-base-lite-models, arm64-codec]
    runs-on: arc-antfly-standard-runtime
    steps:
      - name: Verify zig-base shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-base-tests.result }}
          WASM_RESULT: ${{ needs.zig-base-wasm.result }}
          LITE_MODEL_RESULT: ${{ needs.zig-base-lite-models.result }}
          REQUIRE_LITE_MODELS: ${{ needs.changes.outputs.zig_tests == 'true' }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"
          test "$WASM_RESULT" = "success"
          if [ "$REQUIRE_LITE_MODELS" = "true" ] || [ "$LITE_MODEL_RESULT" != "skipped" ]; then
            test "$LITE_MODEL_RESULT" = "success"
          fi

  zig-full:
    if: >-
      ${{ !cancelled() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      ( inputs.full_validation ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      ((inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') &&
      inputs.validation_scope == 'all') ||
      github.event.schedule == '0 8 * * *' )) }}
    name: zig-full
    needs: [admission, changes, zig-full-tests, zig-build-cache-tests, arm64-codec]
    runs-on: arc-antfly-standard-runtime
    steps:
      - name: Verify zig-full shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-full-tests.result }}
          BUILD_CACHE_RESULT: ${{ needs.zig-build-cache-tests.result }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$BUILD_CACHE_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"

  e2e-base-build:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (inputs.pr_number != '' &&
      needs.changes.outputs.e2e == 'true') }}
    name: e2e-base / build
    needs: [admission, changes]
    # Compilation needs the heavy runner's 50 GiB scratch PVC; runtime-only
    # runners have a 10 GiB ephemeral container disk and no scratch mount.
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    env:
      # Override ARC's 20 GiB default: storage reserves 22 GiB. The 24 GiB
      # pod still has 2 GiB outside the aggregate compiler reservation.
      ANTFLY_ZIG_MAX_RSS: "23622320128"
      ANTFLY_CI_TRACE: "1"
      # The PR E2E artifact is also the release-packaging smoke artifact. Build
      # the partitioned graph once, test that exact binary, and reuse its
      # distributed PIC archive for both public C API packaging shapes.
      # Functional E2E and installed-ABI packaging smoke coverage need runtime
      # safety checks, not LLVM optimization of every storage/SQL owner. Keep
      # this artifact bounded; release, scale, and GPU workflows qualify their
      # optimized artifacts separately.
      ANTFLY_CI_ZIG_OPTIMIZE: debug
      # Retain source locations for runtime panics in functional qualification.
      ANTFLY_CI_ZIG_STRIP: "false"
      ANTFLY_CI_BUILD_CAPI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Prepare job-local Zig cache dirs
        run: |
          mountpoint -q /mnt/cache || { echo "E2E compilation requires the heavy runner scratch PVC" >&2; exit 1; }
          cache_root="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$cache_root/zig-local" "$cache_root/zig-global" "$cache_root/tmp"
          {
            echo "ANTFLY_E2E_BUILD_CACHE_ROOT=$cache_root"
            echo "ZIG_LOCAL_CACHE_DIR=$cache_root/zig-local"
            echo "ZIG_GLOBAL_CACHE_DIR=$cache_root/zig-global"
            echo "TMPDIR=$cache_root/tmp"
          } >> "$GITHUB_ENV"

      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies

      - name: Build E2E executable once
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Package E2E executable
        run: tar -C zig -czf "${RUNNER_TEMP}/antfly-e2e-base.tar.gz" zig-out/bin/antfly

      - name: Upload E2E executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-base.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Package native SDK library installation
        run: tar -C zig/zig-out -czf "${RUNNER_TEMP}/libantfly-e2e-base.tar.gz" lib include

      - name: Upload native SDK library installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libantfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/libantfly-e2e-base.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 1

      - name: Release completed E2E build scratch
        if: always()
        run: |
          if [[ -n "${ANTFLY_E2E_BUILD_CACHE_ROOT:-}" ]]; then
            rm -rf -- "$ANTFLY_E2E_BUILD_CACHE_ROOT"
          fi

  embedded-sdk-native:
    if: >-
      ${{ always() && !cancelled() && needs.admission.result == 'success' &&
      (inputs.pr_number == '' || github.run_attempt == 1) &&
      (needs.e2e-base-build.result == 'success' || needs.e2e-full-build.result == 'success') }}
    name: embedded-sdk-native / ${{ matrix.sdk }}
    needs: [admission, e2e-base-build, e2e-full-build]
    runs-on: arc-antfly-standard-runtime
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk: [go, rust, python, typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Download native SDK library installation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libantfly-e2e-${{ needs.e2e-base-build.result == 'success' && 'base' || 'full' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-sdk-artifact
      - name: Extract native SDK library installation
        run: |
          mkdir -p "${RUNNER_TEMP}/native-sdk"
          tar -xzf "${RUNNER_TEMP}/native-sdk-artifact/"*.tar.gz -C "${RUNNER_TEMP}/native-sdk"
      - name: Set up Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false
      - name: Set up Rust
        if: matrix.sdk == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
      - name: Set up Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - name: Set up uv
        if: matrix.sdk == 'python'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Node
        if: matrix.sdk == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json
      - name: Set up pnpm
        if: matrix.sdk == 'typescript'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - name: Test embedded SDK against the installed C ABI
        env:
          ANTFLY_INFERENCE_MODELS_DIR: ${{ runner.temp }}/embedded-sdk-native-models
        run: scripts/ci/test-embedded-sdk-native.sh "${RUNNER_TEMP}/native-sdk" "${{ matrix.sdk }}"

  pgwire-driver-conformance:
    if: >-
      ${{ always() && !cancelled() && needs.admission.result == 'success' &&
      (inputs.pr_number == '' || github.run_attempt == 1) &&
      (needs.e2e-base-build.result == 'success' || needs.e2e-full-build.result == 'success') }}
    name: pgwire-driver-conformance
    needs: [admission, e2e-base-build, e2e-full-build]
    runs-on: arc-antfly-standard-runtime
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install driver build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Download candidate E2E executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfly-e2e-${{ needs.e2e-base-build.result == 'success' && 'base' || 'full' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pgwire-driver-artifact
      - name: Install candidate E2E executable
        run: tar -xzf "${RUNNER_TEMP}/pgwire-driver-artifact/"*.tar.gz -C zig
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test standard PostgreSQL drivers against candidate runtime
        run: >-
          uv run --no-project --with requests --with pytest
          --with 'psycopg[binary]==3.3.6' --with asyncpg==0.31.0
          python scripts/test_pgwire_drivers.py --binary zig/zig-out/bin/antfly
      - name: Test large-catalog PostgreSQL startup readiness
        env:
          ANTFLY_BIN: zig/zig-out/bin/antfly
        run: >-
          uv run --no-project --with requests --with pytest --with pytest-xdist
          --with 'psycopg[binary]==3.3.6'
          python -m pytest zig/e2e/antfly/test_pgwire_startup.py -q

  e2e-base-plan:
    if: >-
      ${{ !cancelled() && success() && !inputs.full_validation && needs.admission.result == 'success' &&
      inputs.pr_number != '' && github.run_attempt == 1 && needs.changes.outputs.e2e == 'true' }}
    name: e2e-base / plan
    needs: [admission, changes]
    runs-on: arc-antfly-standard-runtime
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Restore common E2E duration history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/e2e-plan/durations.json
          key: antfly-e2e-durations-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: antfly-e2e-durations-v2-
      - name: Collect once and balance fixture groups
        working-directory: zig
        env:
          PYTHONPATH: ../scripts/ci
          ANTFLY_E2E_DURATION_FILE: ${{ runner.temp }}/e2e-plan/durations.json
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e-plan"
          if [[ ! -f "$ANTFLY_E2E_DURATION_FILE" ]]; then
            cp ../scripts/ci/antfly_e2e_durations.json "$ANTFLY_E2E_DURATION_FILE"
          fi
          uv run --project e2e/antfly pytest --collect-only -q -p zig_e2e_shard \
            --antfly-ci-plan-output "${RUNNER_TEMP}/e2e-plan/plan.json" \
            -m "$(python3 ../scripts/ci/zig_e2e_shard.py base-marker)" e2e/antfly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: antfly-e2e-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-plan
          retention-days: 7

  e2e-base-tests:
    if: >-
      ${{ !cancelled() &&
      !inputs.full_validation &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      inputs.pr_number != '' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.e2e-base-build.result == 'success' && needs.e2e-base-plan.result == 'success') }}
    name: e2e-base / ${{ matrix.suite }}
    needs: [admission, changes, e2e-base-build, e2e-base-plan]
    runs-on: arc-antfly-heavy-runtime
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: antfly-ordinary-0
            shard: ordinary-0
          - suite: antfly-ordinary-1
            shard: ordinary-1
          - suite: antfly-ordinary-2
            shard: ordinary-2
          - suite: antfly-recovery-0
            shard: recovery-0
          - suite: antfly-recovery-1
            shard: recovery-1
          - suite: antfly-recovery-2
            shard: recovery-2
          - suite: inference
            shard: all
    env:
      # Mixed stateful/serverless groups need two processes on one worker.
      # Limit process-owning workers instead, so separate cluster workloads
      # cannot add concurrent durable commits to latency/availability tests.
      ANTFLY_E2E_PROCESS_SLOTS: "2"
      ANTFLY_E2E_PROCESS_WORKERS: "1"
      # Permit the diagnostic debugger to attach to disposable test children.
      ANTFLY_E2E_NATIVE_STACKS: "1"
      ANTFLY_CI_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Prepare job-local cache dirs
        run: |
          cache_root="${RUNNER_TEMP}/antfly/zig"
          local_cache="$cache_root/zig-local"
          global_cache="$cache_root/zig-global"
          uv_cache="$cache_root/uv"
          hf_home="$cache_root/hf"
          duration_file="${RUNNER_TEMP}/e2e-reports/durations.json"
          # Keep WAL/fsync-heavy disposable databases on runner-local disk,
          # not memory tmpfs: these tests exercise diskful crash/reopen and
          # retain failure logs.
          test_tmp="${RUNNER_TEMP}/antfly-e2e/${{ github.job }}/${{ matrix.suite }}/${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "ZIG_LOCAL_CACHE_DIR=$local_cache"
            echo "ZIG_GLOBAL_CACHE_DIR=$global_cache"
            echo "UV_CACHE_DIR=$uv_cache"
            echo "HF_HOME=$hf_home"
            echo "ANTFLY_E2E_DURATION_FILE=$duration_file"
            echo "ANTFLY_E2E_REPORT_DIR=${RUNNER_TEMP}/e2e-reports"
            echo "ANTFLY_E2E_SHARD_PLAN=${RUNNER_TEMP}/e2e-plan/plan.json"
            echo "TMPDIR=$test_tmp"
          } >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$test_tmp" "$uv_cache" "$hf_home" "$(dirname "$duration_file")"
          mkdir -p "$cache_root/home-cache-${{ matrix.suite }}" "$cache_root/home-antfly-${{ matrix.suite }}"
          rm -rf ~/.cache ~/.antfly
          ln -s "$cache_root/home-cache-${{ matrix.suite }}" ~/.cache
          ln -s "$cache_root/home-antfly-${{ matrix.suite }}" ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Download E2E executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-base

      - name: Install E2E executable
        run: tar -xzf "${RUNNER_TEMP}/antfly-e2e-base/antfly-e2e-base.tar.gz" -C zig

      - name: Download common E2E plan and timing baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: antfly-e2e-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-plan
      - name: Initialize lane timing history
        run: cp "${RUNNER_TEMP}/e2e-plan/durations.json" "$ANTFLY_E2E_DURATION_FILE"

      - name: Set up Go for operator runtime contract
        if: matrix.suite == 'inference'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      # Execute the SAME reconciler-generated contract as the operator job's
      # pinned v0.2.1 baseline, now against this PR's newly built runtime.
      - name: Test generated inference command against candidate runtime
        if: matrix.suite == 'inference'
        working-directory: go/pkg/operator
        env:
          ANTFLY_RUNTIME_BIN: ${{ github.workspace }}/zig/zig-out/bin/antfly
          GOWORK: 'off'
          GOEXPERIMENT: simd
        run: >-
          taskset -c ${{ steps.e2e_cpus.outputs.list }} go test
          -tags runtimeintegration ./controllers/inference
          -run '^Test(InferenceRuntimeContract|RuntimeModelPullRetry)$' -count=1 -v -timeout=20m

      - name: Test exhaustive E2E shard partition
        if: matrix.suite == 'antfly-ordinary-0'
        run: |
          uv run --project zig/e2e/antfly python -m unittest discover -s scripts/ci -p test_zig_e2e_shard.py

      - name: Run base E2E
        env:
          SKIP_BUILD: "1"
          ANTFLY_E2E_SUITE: ${{ matrix.suite }}
          ANTFLY_E2E_SHARD: ${{ matrix.shard }}
          ANTFLY_E2E_PRESERVE_ROOT_ON_FAILURE: "1"
        run: |
          if [[ "$ANTFLY_E2E_SUITE" == antfly* && ! -f scripts/ci/zig_e2e_shard.py ]]; then
            echo "::error::Merge origin/main into this PR to obtain the required E2E shard helper."
            exit 1
          fi
          taskset -c ${{ steps.e2e_cpus.outputs.list }} scripts/ci/zig-e2e-base-linux.sh

      - name: Run inference config contract with a real CPU model
        if: matrix.suite == 'inference'
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_MODELS_DIR: ${{ runner.temp }}/inference-config-models
          ANTFLY_INFERENCE_DOWNLOAD: "1"
          UV_PROJECT_ENVIRONMENT: /tmp/antfly-ci-venv/inference
        run: >-
          taskset -c ${{ steps.e2e_cpus.outputs.list }} uv run --project e2e/inference pytest -q
          --junitxml "${RUNNER_TEMP}/e2e-reports/inference-config.xml" e2e/inference/test_run_config.py

      - name: Summarize measured E2E fixture groups
        if: always()
        run: >-
          python3 scripts/ci/summarize_e2e_timings.py
          --plan "$ANTFLY_E2E_SHARD_PLAN" --reports "$ANTFLY_E2E_REPORT_DIR"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Retain E2E timings and per-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: antfly-e2e-timings-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Retain failed E2E server logs and cluster diagnostics
        if: failure() && startsWith(matrix.suite, 'antfly')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-e2e-server-logs-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/antfly-zig-standalone-e2e-*/server.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/native-stacks.txt
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/native-stacks.txt
          if-no-files-found: ignore
          retention-days: 7

  e2e-base-low-fd:
    if: >-
      ${{ !cancelled() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      inputs.pr_number != '' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.e2e-base-build.result == 'success') }}
    name: e2e-base / low-fd
    needs: [admission, changes, e2e-base-build]
    runs-on: arc-antfly-heavy-runtime
    timeout-minutes: 60
    env:
      # Mixed stateful/serverless groups need two processes on one worker.
      # Limit process-owning workers instead, so separate cluster workloads
      # cannot add concurrent durable commits to latency/availability tests.
      ANTFLY_E2E_PROCESS_SLOTS: "2"
      ANTFLY_E2E_PROCESS_WORKERS: "1"
      # Permit the diagnostic debugger to attach to disposable test children.
      ANTFLY_E2E_NATIVE_STACKS: "1"
      ANTFLY_CI_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Prepare job-local cache dirs
        run: |
          cache_root="${RUNNER_TEMP}/antfly/zig"
          local_cache="$cache_root/zig-local"
          global_cache="$cache_root/zig-global"
          uv_cache="$cache_root/uv"
          hf_home="$cache_root/hf"
          duration_file="$cache_root/e2e-durations/antfly-v1.json"
          # Keep WAL/fsync-heavy disposable databases on runner-local disk,
          # not memory tmpfs: these tests exercise diskful crash/reopen and
          # retain failure logs.
          test_tmp="${RUNNER_TEMP}/antfly-e2e/${{ github.job }}/low-fd/${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "ZIG_LOCAL_CACHE_DIR=$local_cache"
            echo "ZIG_GLOBAL_CACHE_DIR=$global_cache"
            echo "UV_CACHE_DIR=$uv_cache"
            echo "HF_HOME=$hf_home"
            echo "ANTFLY_E2E_DURATION_FILE=$duration_file"
            echo "TMPDIR=$test_tmp"
          } >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$test_tmp" "$uv_cache" "$hf_home" "$(dirname "$duration_file")"
          mkdir -p "$cache_root/home-cache-low-fd" "$cache_root/home-antfly-low-fd"
          rm -rf ~/.cache ~/.antfly
          ln -s "$cache_root/home-cache-low-fd" ~/.cache
          ln -s "$cache_root/home-antfly-low-fd" ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Download E2E executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfly-e2e-base-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-base

      - name: Install E2E executable
        run: tar -xzf "${RUNNER_TEMP}/antfly-e2e-base/antfly-e2e-base.tar.gz" -C zig

      - name: Run low-FD HTTP worker ratchet regression
        working-directory: zig
        env:
          ANTFLY_REQUIRE_LOW_FD_HTTP_RATCHET: "1"
        run: |
          ulimit -n 256
          taskset -c ${{ steps.e2e_cpus.outputs.list }} zig build http-low-fd-ratchet-test

      - name: Run low-FD Autograph regression
        env:
          SKIP_BUILD: "1"
          ANTFLY_E2E_NOFILE_LIMIT: "256"
          ANTFLY_E2E_REGRESSION_REPEATS: "3"
          ANTFLY_E2E_REGRESSION_REPORT_DIR: ${{ runner.temp }}/low-fd-reports
        run: >-
          taskset -c ${{ steps.e2e_cpus.outputs.list }}
          scripts/ci/zig-e2e-regression-loop.sh
          e2e/antfly/test_resolution.py::test_multinode_autograph_resolves_promotes_and_hydrates_entities


      - name: Retain low-FD regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: antfly-low-fd-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/low-fd-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Retain failed low-FD server logs and cluster diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-low-fd-server-logs-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/antfly-zig-standalone-e2e-*/server.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/native-stacks.txt
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/native-stacks.txt
          if-no-files-found: ignore
          retention-days: 7

  e2e-base:
    if: >-
      ${{ !cancelled() &&
      !inputs.full_validation &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      inputs.pr_number != '' &&
      needs.changes.outputs.e2e == 'true') }}
    name: e2e-base
    needs: [admission, changes, e2e-base-build, e2e-base-plan, e2e-base-tests, e2e-base-low-fd, embedded-sdk-native, pgwire-driver-conformance]
    runs-on: arc-antfly-standard-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify base E2E shards
        env:
          BUILD_RESULT: ${{ needs.e2e-base-build.result }}
          TEST_RESULT: ${{ needs.e2e-base-tests.result }}
          PLAN_RESULT: ${{ needs.e2e-base-plan.result }}
          LOW_FD_RESULT: ${{ needs.e2e-base-low-fd.result }}
          NATIVE_SDK_RESULT: ${{ needs.embedded-sdk-native.result }}
          PGWIRE_DRIVER_RESULT: ${{ needs.pgwire-driver-conformance.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PLAN_RESULT" = "success"
          test "$LOW_FD_RESULT" = "success"
          test "$NATIVE_SDK_RESULT" = "success"
          test "$PGWIRE_DRIVER_RESULT" = "success"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: antfly-e2e-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: antfly-e2e-timings-*
          path: ${{ runner.temp }}/e2e-observations
      - name: Merge healthy lane measurements
        run: >-
          python3 scripts/ci/merge_e2e_durations.py
          --baseline "${RUNNER_TEMP}/e2e-plan/durations.json"
          --observations "${RUNNER_TEMP}/e2e-observations"
          --output "${RUNNER_TEMP}/e2e-plan/durations.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/e2e-plan/durations.json
          key: antfly-e2e-durations-v2-${{ github.run_id }}-${{ github.run_attempt }}

  e2e-full-build:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    if: >-
      ${{ !cancelled() &&
      success() &&
      !inputs.full_validation &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') ||
      github.event.schedule == '0 8 * * *') }}
    name: e2e-full / build
    needs: [admission, changes]
    # Compilation needs the heavy runner's 50 GiB scratch PVC; runtime-only
    # runners have a 10 GiB ephemeral container disk and no scratch mount.
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    env:
      ANTFLY_ZIG_MAX_RSS: "23622320128"
      # Match the PR functional artifact: preserve runtime safety and assertions
      # without recompiling every storage/SQL owner through LLVM optimization.
      # Release, scale, and GPU workflows qualify their optimized builds.
      ANTFLY_CI_ZIG_OPTIMIZE: debug
      # Runtime failures must retain actionable stack traces. Optimized
      # release workflows qualify stripped release artifacts separately.
      ANTFLY_CI_ZIG_STRIP: "false"
      ANTFLY_CI_BUILD_CAPI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Prepare job-local Zig cache dirs
        run: |
          mountpoint -q /mnt/cache || { echo "E2E compilation requires the heavy runner scratch PVC" >&2; exit 1; }
          cache_root="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$cache_root/zig-local" "$cache_root/zig-global" "$cache_root/tmp"
          {
            echo "ANTFLY_E2E_BUILD_CACHE_ROOT=$cache_root"
            echo "ZIG_LOCAL_CACHE_DIR=$cache_root/zig-local"
            echo "ZIG_GLOBAL_CACHE_DIR=$cache_root/zig-global"
            echo "TMPDIR=$cache_root/tmp"
          } >> "$GITHUB_ENV"

      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies

      - name: Build E2E executable once
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Package E2E executable
        run: tar -C zig -czf "${RUNNER_TEMP}/antfly-e2e-full.tar.gz" zig-out/bin/antfly

      - name: Upload E2E executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-e2e-full-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-full.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Package native SDK library installation
        run: tar -C zig/zig-out -czf "${RUNNER_TEMP}/libantfly-e2e-full.tar.gz" lib include

      - name: Upload native SDK library installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libantfly-e2e-full-${{ github.run_id }}
          path: ${{ runner.temp }}/libantfly-e2e-full.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 1

      - name: Release completed E2E build scratch
        if: always()
        run: |
          if [[ -n "${ANTFLY_E2E_BUILD_CACHE_ROOT:-}" ]]; then
            rm -rf -- "$ANTFLY_E2E_BUILD_CACHE_ROOT"
          fi

  e2e-full-tests:
    if: >-
      ${{ !cancelled() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      (needs.e2e-full-build.result == 'success' ||
      (inputs.full_validation && needs.e2e-base-build.result == 'success')) &&
      (inputs.full_validation ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') ||
      github.event.schedule == '0 8 * * *')) }}
    name: e2e-full / ${{ matrix.suite }}
    needs: [admission, changes, e2e-base-build, e2e-full-build]
    runs-on: ${{ !startsWith(matrix.suite, 'inference-') && 'arc-antfly-heavy-runtime' || 'arc-antfly-heavy' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: ${{ fromJSON((inputs.pr_number == '' && github.event_name == 'workflow_dispatch') && inputs.validation_scope == 'inference-e2e' && '["inference-generation","inference-speech","inference-embedding"]' || '["inference-generation","inference-speech","inference-embedding","antfly"]') }}
    env:
      # Full Antfly E2E has the same multi-process groups as the base shards.
      # Keep one process-owning worker per runner while lightweight tests may
      # continue on the other pytest workers.
      ANTFLY_E2E_PROCESS_SLOTS: "2"
      ANTFLY_E2E_PROCESS_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb libopenblas0-pthread

      - name: Prepare ARC test cache dirs
        run: |
          # Inference model downloads retain the PVC. Antfly's measured cache
          # footprint fits on job-local disk; crash-test databases also use
          # runner-local disk (not tmpfs), just like the required base lanes.
          test_tmp="${RUNNER_TEMP}/antfly-e2e/${{ github.job }}/${{ matrix.suite }}/${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ "${{ matrix.suite }}" == "antfly" ]]; then
            home_cache_root="${RUNNER_TEMP}/antfly/zig"
          else
            home_cache_root="/mnt/cache/antfly/zig"
          fi
          uv_cache="$home_cache_root/uv"
          hf_home="$home_cache_root/hf"
          duration_file="$home_cache_root/e2e-durations/antfly-v1.json"
          {
            echo "TMPDIR=$test_tmp"
            echo "UV_CACHE_DIR=$uv_cache"
            echo "HF_HOME=$hf_home"
            echo "ANTFLY_E2E_DURATION_FILE=$duration_file"
          } >> "$GITHUB_ENV"
          mkdir -p "$test_tmp" "$uv_cache" "$hf_home" "$(dirname "$duration_file")"
          mkdir -p "$home_cache_root/home-cache-full-${{ matrix.suite }}" "$home_cache_root/home-antfly-full-${{ matrix.suite }}"
          rm -rf ~/.cache ~/.antfly
          ln -s "$home_cache_root/home-cache-full-${{ matrix.suite }}" ~/.cache
          ln -s "$home_cache_root/home-antfly-full-${{ matrix.suite }}" ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Set up Rust WASI target
        if: matrix.suite == 'antfly'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
          targets: wasm32-wasip2

      - name: Build record-tools extension test fixture
        if: matrix.suite == 'antfly'
        run: cargo build --manifest-path zig/e2e/fixtures/extensions/records/Cargo.toml --release --target wasm32-wasip2

      - name: Download E2E executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfly-e2e-${{ inputs.full_validation && 'base' || 'full' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/antfly-e2e-full

      - name: Install E2E executable
        run: tar -xzf "${RUNNER_TEMP}/antfly-e2e-full/antfly-e2e-${{ inputs.full_validation && 'base' || 'full' }}.tar.gz" -C zig

      # Independent ingestion writers use the checkout's embedded SDK and the
      # C ABI artifact produced by the same build as the server under test.
      - name: Download ingestion native library
        if: matrix.suite == 'antfly'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libantfly-e2e-${{ inputs.full_validation && 'base' || 'full' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/libantfly-e2e-full

      - name: Install ingestion native library
        if: matrix.suite == 'antfly'
        run: |
          mkdir -p zig/zig-out
          tar -xzf "${RUNNER_TEMP}/libantfly-e2e-full/libantfly-e2e-${{ inputs.full_validation && 'base' || 'full' }}.tar.gz" -C zig/zig-out
          echo "ANTFLY_LIBRARY=${GITHUB_WORKSPACE}/zig/zig-out/lib/libantfly.so" >> "$GITHUB_ENV"

      - name: Report inference memory baseline
        if: startsWith(matrix.suite, 'inference-')
        run: |
          echo "memory.current=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo unavailable)"
          echo "memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable)"
          if [ -r /sys/fs/cgroup/memory.stat ]; then
            awk '$1 == "anon" || $1 == "file" || $1 == "inactive_file" { print "memory.stat." $1 "=" $2 }' /sys/fs/cgroup/memory.stat
          fi

      - name: Install Wasmtime C API
        if: matrix.suite == 'antfly'
        env:
          WASMTIME_VERSION: v45.0.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="wasmtime-${WASMTIME_VERSION}-${arch}-linux-c-api.tar.xz"
          root="/tmp/wasmtime-c-api"
          rm -rf "$root"
          mkdir -p "$root"
          curl -L "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${archive}" -o "/tmp/${archive}"
          tar -xJf "/tmp/${archive}" -C "$root" --strip-components=1
          lib="$(find "$root/lib" -maxdepth 1 -name 'libwasmtime.so*' | sort | head -n 1)"
          test -n "$lib"
          echo "ANTFLY_WASMTIME_LIB=$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Antfly inference full E2E
        if: startsWith(matrix.suite, 'inference-')
        working-directory: zig
        env:
          # CPU inference qualifies the shipped optional LP64 pthread backend.
          # Fail fast if the artifact/runner cannot load it instead of silently
          # exercising Debug scalar kernels under a serving-latency deadline.
          ANTFLY_INFERENCE_BLAS: openblas
          OPENBLAS_NUM_THREADS: "2"
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_REPORT_DIR: ${{ runner.temp }}/inference-reports
          ANTFLY_INFERENCE_SERVER_LOG_DIR: ${{ runner.temp }}/inference-server-logs
          ANTFLY_INFERENCE_DOWNLOAD: "1"
          # Gemma 4 covers ordinary, tool-calling, and multimodal generation;
          # keep one decoder artifact across every generation endpoint.
          ANTFLY_INFERENCE_DEFAULT_GENERATOR_MODEL: ggml-org/gemma-4-e2b-it-gguf
          ANTFLY_INFERENCE_FLORENCE_MODEL: antflydb/florence-2-base
          ANTFLY_INFERENCE_REQUEST_TIMEOUT: "300"
          # Cold native model and projector initialization can exceed the
          # steady request deadline on CPU-only release runners. Only tests
          # explicitly covering first-use paths opt into this hard bound.
          ANTFLY_INFERENCE_FIRST_USE_REQUEST_TIMEOUT: "1800"
          ANTFLY_INFERENCE_MAX_LOADED_MODELS: "1"
          # Keep the model process inside its existing 14GiB admission budget.
          # Shards remain serial and use the existing heavy runner envelope.
          ANTFLY_INFERENCE_PROCESS_MEMORY_BUDGET_MB: "14000"
          # Bound the native hot set while allowing the measured 11173MiB 2B
          # decoder working set plus its scoped projector to complete. Keep
          # 2000MiB inside the process envelope for harness and process overhead.
          ANTFLY_INFERENCE_HOST_BUDGET_MB: "12000"
          # This is a release contract, not an optional capability probe. Keep
          # it targeted so unrelated large-model suites do not inflate this job.
          RUN_MULTIMODAL_GENERATOR_TESTS: "1"
          RUN_CLIPCLAP_CONTRACT_TESTS: "1"
        run: |
          chmod +x ./zig-out/bin/antfly
          shard="${{ matrix.suite }}"
          taskset -c ${{ steps.e2e_cpus.outputs.list }} uv run --project e2e/inference python ../scripts/ci/inference_e2e_shards.py "${shard#inference-}"

      - name: Validate standalone inference resource composition
        if: matrix.suite == 'inference-generation'
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_STANDALONE_TESTS: "1"
          ANTFLY_INFERENCE_STANDALONE_MODELS_DIR: ~/.antfly/inference/models
          ANTFLY_INFERENCE_STANDALONE_MODEL_NAME: ggml-org/gemma-4-e2b-it-gguf
          # Match the cold-start contract used by the full inference suite.
          # Standalone exercises the same CPU-only model initialization path.
          ANTFLY_INFERENCE_FIRST_USE_REQUEST_TIMEOUT: "1800"
          ANTFLY_INFERENCE_STANDALONE_PROCESS_MEMORY_BUDGET_MB: "14000"
          ANTFLY_INFERENCE_STANDALONE_HOST_BUDGET_MB: "12000"
          ANTFLY_INFERENCE_STANDALONE_COMBINED_BUDGET_MB: "12000"
        run: |
          taskset -c ${{ steps.e2e_cpus.outputs.list }} uv run --project e2e/antfly pytest -q \
            e2e/antfly/test_standalone.py::test_standalone_inference_process_envelope_composition

      - name: Run Antfly full E2E
        if: matrix.suite == 'antfly'
        working-directory: zig
        env:
          ANTFLY_E2E_FULL_LAKE: "1"
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_E2E_PRESERVE_ROOT_ON_FAILURE: "1"
          ANTFLY_E2E_NATIVE_STACKS: "1"
        run: |
          chmod +x ./zig-out/bin/antfly
          taskset -c ${{ steps.e2e_cpus.outputs.list }} ../scripts/ci/zig-antfly-e2e-pytest.sh e2e/antfly

      - name: Retain full inference server logs
        if: always() && startsWith(matrix.suite, 'inference-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-inference-full-server-logs-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-server-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain failed full E2E server logs and cluster diagnostics
        if: failure() && matrix.suite == 'antfly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-e2e-full-server-logs-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/antfly-zig-standalone-e2e-*/server.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-scaling-e2e-*/native-stacks.txt
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/*.log
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/failure-diagnostics.json
            ${{ env.TMPDIR }}/antfly-zig-metadata-backup-e2e-*/native-stacks.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain inference timings
        if: always() && startsWith(matrix.suite, 'inference-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inference-timings-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-reports
          if-no-files-found: warn
          retention-days: 14

  e2e-full:
    if: >-
      ${{ !cancelled() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (always() &&
      (inputs.full_validation ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') ||
      github.event.schedule == '0 8 * * *')) }}
    name: e2e-full
    needs: [admission, changes, e2e-base-build, e2e-full-build, e2e-full-tests, e2e-base-low-fd, embedded-sdk-native, pgwire-driver-conformance]
    runs-on: arc-antfly-standard-runtime
    steps:
      - name: Verify full E2E suites
        env:
          BUILD_RESULT: ${{ inputs.full_validation && needs.e2e-base-build.result || needs.e2e-full-build.result }}
          TEST_RESULT: ${{ needs.e2e-full-tests.result }}
          LOW_FD_RESULT: ${{ needs.e2e-base-low-fd.result }}
          NATIVE_SDK_RESULT: ${{ needs.embedded-sdk-native.result }}
          PGWIRE_DRIVER_RESULT: ${{ needs.pgwire-driver-conformance.result }}
          REQUIRE_LOW_FD: ${{ inputs.full_validation && inputs.pr_number != '' }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$NATIVE_SDK_RESULT" = "success"
          test "$PGWIRE_DRIVER_RESULT" = "success"
          if [[ "$REQUIRE_LOW_FD" == "true" ]]; then
            test "$LOW_FD_RESULT" = "success"
          fi
