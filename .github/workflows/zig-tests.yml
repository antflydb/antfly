name: Zig Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-global-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: arc-antfly-standard
    outputs:
      zig_tests: ${{ steps.detect.outputs.zig_tests }}
      e2e: ${{ steps.detect.outputs.e2e }}
      model_check: ${{ steps.detect.outputs.model_check }}
      trace_validate: ${{ steps.detect.outputs.trace_validate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.schedule }}" == "0 3 * * 0" ]]; then
              {
                echo "e2e=false"
                echo "model_check=true"
                echo "trace_validate=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(glob)scripts/ci/**' \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "zig_tests=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(glob)scripts/ci/**' \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            Makefile \
            .github/workflows/zig-tests.yml
          then
            echo "model_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "model_check=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            ':(glob)zig/pkg/antfly/src/tracing/**' \
            ':(glob)zig/pkg/antfly/src/raft/**' \
            ':(glob)zig/pkg/antfly/src/storage/db/**' \
            ':(glob)zig/lib/raft/**' \
            Makefile \
            zig/build.zig \
            .github/workflows/zig-tests.yml
          then
            echo "trace_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "trace_validate=true" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: changes
    if: (github.event_name != 'schedule' && needs.changes.outputs.zig_tests == 'true') || needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
    runs-on: arc-antfly-heavy
    # Keep the outer job timeout above the in-step hard watchdog so true hangs
    # produce the watchdog stack dump instead of an opaque GitHub cancellation.
    timeout-minutes: 75
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      - name: Check generated sources
        run: make zig-generated-check

      - name: Run hermetic Antfly unit tests
        if: needs.changes.outputs.zig_tests == 'true'
        env:
          ANTFLY_TEST_CLEANUP_TRACE: "1"
        run: |
          set -euo pipefail

          collect_descendants() {
            local roots="$*"
            local all=" ${roots} "
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              while read -r pid ppid; do
                if [[ " $all " == *" $ppid "* && " $all " != *" $pid "* ]]; then
                  all="${all}${pid} "
                  changed=1
                fi
              done < <(ps -eo pid=,ppid=)
            done
            echo "$all"
          }

          dump_stacks() {
            local root_pid="$1"
            echo "::group::antfly unit watchdog ptrace settings"
            if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
              cat /proc/sys/kernel/yama/ptrace_scope || true
            fi
            sysctl kernel.yama.ptrace_scope 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::antfly unit watchdog process tree"
            ps -eo pid,ppid,stat,etime,cmd | grep -E "PID|zig build|zig-local|/test|make zig-unit-test|make -C ./zig unit-test" || true
            echo "::endgroup::"

            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if ! kill -0 "$pid" 2>/dev/null; then
                continue
              fi
              local cmdline
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              case "$cmdline" in
                *"/test "*|*"/test"*|*"zig build"*|*" make "*)
                  echo "::group::proc snapshot pid=$pid cmd=$cmdline"
                  if [ -r "/proc/$pid/status" ]; then
                    grep -E "^(Name|State|Pid|PPid|Threads|VmRSS|VmHWM|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):" "/proc/$pid/status" || true
                  fi
                  if [ -r "/proc/$pid/wchan" ]; then
                    printf "wchan="
                    cat "/proc/$pid/wchan" || true
                    printf "\n"
                  fi
                  if [ -r "/proc/$pid/stack" ]; then
                    cat "/proc/$pid/stack" || true
                  fi
                  echo "::endgroup::"

                  echo "::group::gdb thread dump pid=$pid cmd=$cmdline"
                  timeout 45s gdb -batch -p "$pid" \
                    -ex "set pagination off" \
                    -ex "thread apply all bt" \
                    -ex "detach" || \
                    timeout 45s sudo gdb -batch -p "$pid" \
                      -ex "set pagination off" \
                      -ex "thread apply all bt" \
                      -ex "detach" || true
                  echo "::endgroup::"
                  ;;
              esac
            done
          }

          terminate_tree() {
            local root_pid="$1"
            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            sleep 5
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done
          }

          if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
            echo "::group::configure ptrace for unit watchdog"
            echo "ptrace_scope before: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            sudo sysctl -w kernel.yama.ptrace_scope=0 || true
            echo "ptrace_scope after: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            echo "::endgroup::"
          fi

          unit_log="${RUNNER_TEMP:-/tmp}/antfly-zig-unit.log"
          : > "$unit_log"

          (
            set +e
            make zig-unit-test 2>&1 | tee -a "$unit_log"
            exit "${PIPESTATUS[0]}"
          ) &
          unit_pid="$!"
          (
            idle_limit_secs="${ANTFLY_UNIT_WATCHDOG_IDLE_SECS:-900}"
            hard_limit_secs="${ANTFLY_UNIT_WATCHDOG_HARD_SECS:-3600}"
            start_epoch="$(date +%s)"
            last_progress_epoch="$start_epoch"
            last_mtime=0
            while kill -0 "$unit_pid" 2>/dev/null; do
              sleep 15
              now_epoch="$(date +%s)"
              if [ -e "$unit_log" ]; then
                current_mtime="$(stat -c %Y "$unit_log" 2>/dev/null || echo 0)"
                if [ "$current_mtime" -gt "$last_mtime" ]; then
                  last_mtime="$current_mtime"
                  last_progress_epoch="$now_epoch"
                fi
              fi

              elapsed_secs=$((now_epoch - start_epoch))
              idle_secs=$((now_epoch - last_progress_epoch))
              if [ "$hard_limit_secs" -gt 0 ] && [ "$elapsed_secs" -ge "$hard_limit_secs" ]; then
                echo "::error::zig-unit-test hard watchdog fired after ${elapsed_secs}s; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
              if [ "$idle_limit_secs" -gt 0 ] && [ "$idle_secs" -ge "$idle_limit_secs" ]; then
                echo "::error::zig-unit-test idle watchdog fired after ${idle_secs}s without unit log progress; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
            done
          ) &
          watchdog_pid="$!"

          status=0
          wait "$unit_pid" || status="$?"
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          exit "$status"

  tla-verify:
    needs: changes
    if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
    runs-on: ${{ needs.changes.outputs.trace_validate == 'true' && 'arc-antfly-heavy' || 'arc-antfly-standard' }}
    timeout-minutes: 30
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ needs.changes.outputs.trace_validate == 'true' }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        if: needs.changes.outputs.trace_validate == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        if: needs.changes.outputs.trace_validate == 'true'
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Set up Java for TLA+
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLC on all specs
        if: needs.changes.outputs.model_check == 'true'
        working-directory: zig
        run: make tla-check

      - name: Download TLA+ tools
        if: needs.changes.outputs.trace_validate == 'true'
        working-directory: zig
        run: make tla-tools

      - name: Run raft tests and extract traces
        if: needs.changes.outputs.trace_validate == 'true'
        working-directory: zig
        env:
          ANTFLY_TRACE_FILE: /tmp/raft-trace.ndjson
        run: |
          zig build -Dwith_tla=true raft-test
          test -s /tmp/raft-trace.ndjson
          echo "Raft trace lines: $(wc -l < /tmp/raft-trace.ndjson)"

      - name: Validate raft traces
        if: needs.changes.outputs.trace_validate == 'true'
        working-directory: zig
        run: make tla-trace-raft TRACE_FILES=/tmp/raft-trace.ndjson

      - name: Run transaction tests and extract traces
        if: needs.changes.outputs.trace_validate == 'true'
        working-directory: zig
        env:
          ANTFLY_TRACE_FILE: /tmp/txn-trace.ndjson
        run: |
          zig build -Dwith_tla=true lib-db-txn-test
          test -s /tmp/txn-trace.ndjson
          echo "Transaction trace lines: $(wc -l < /tmp/txn-trace.ndjson)"

      - name: Validate transaction traces
        if: needs.changes.outputs.trace_validate == 'true'
        working-directory: zig
        run: make tla-trace-txn TRACE_FILES=/tmp/txn-trace.ndjson

  full-default:
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-heavy
    timeout-minutes: 60
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      # The in-process cluster simulations size their thread pools from the
      # visible CPU count, which on ARC reflects the node rather than the pod
      # quota. The resulting burst can starve the runner agent long enough for
      # GitHub to declare the runner lost (~10 min of missed heartbeats), which
      # is how most full-default failures present. Bound the test steps to a
      # fixed CPU set so pools and zig build parallelism stay within budget.
      - name: Compute CPU bound for heavy test steps
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Run full Zig unit tests
        run: taskset -c ${{ steps.cpus.outputs.list }} make zig-unit-test

      - name: Run Zig simulation tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build sim-test

      - name: Run Zig integration tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build integration-test

      - name: Run Zig recall tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build recall-test

      - name: Run Zig recall harness sweep
        working-directory: zig
        run: |
          set -euo pipefail
          datasets=(
            images-512d-10k.gob
            random-20d-1k.gob
            fashionminst-784d-1k.gob
            fashionminst-784d-10k.gob
            laionclip-768d-1k.gob
            laiongemini-1408d-1k.gob
            laiongemini-512d-10k.gob
            dbpedia-1536d-1k.gob
            random-2048d-1k.gob
            random-4096d-1k.gob
            wikiarticles-768d-10k.gob
          )
          for dataset in "${datasets[@]}"; do
            echo "::group::recall-harness ${dataset}"
            taskset -c ${{ steps.cpus.outputs.list }} zig build recall-harness -- --dataset-dir testdata/vectorsets --dataset "${dataset}"
            echo "::endgroup::"
          done

      - name: Run Zig chaos tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build chaos-test

  e2e-base:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.e2e == 'true'
    runs-on: arc-antfly-heavy
    timeout-minutes: 45
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      UV_CACHE_DIR: /mnt/cache/antfly/zig/uv
      HF_HOME: /mnt/cache/antfly/zig/hf
      ANTFLY_CI_TRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$UV_CACHE_DIR" "$HF_HOME"
          mkdir -p /mnt/cache/antfly/zig/home-cache /mnt/cache/antfly/zig/home-antfly
          rm -rf ~/.cache ~/.antfly
          ln -s /mnt/cache/antfly/zig/home-cache ~/.cache
          ln -s /mnt/cache/antfly/zig/home-antfly ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build E2E binaries
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Run base E2E
        env:
          SKIP_BUILD: "1"
        run: scripts/ci/zig-e2e-base-linux.sh

  e2e-full:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      UV_CACHE_DIR: /mnt/cache/antfly/zig/uv
      HF_HOME: /mnt/cache/antfly/zig/hf
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$UV_CACHE_DIR" "$HF_HOME"
          mkdir -p /mnt/cache/antfly/zig/home-cache /mnt/cache/antfly/zig/home-antfly
          rm -rf ~/.cache ~/.antfly
          ln -s /mnt/cache/antfly/zig/home-cache ~/.cache
          ln -s /mnt/cache/antfly/zig/home-antfly ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Rust WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build MemoryAF extension package
        run: cargo build --manifest-path extensions/memoryaf/Cargo.toml --release --target wasm32-wasip2

      - name: Build E2E binaries
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Install Wasmtime C API
        env:
          WASMTIME_VERSION: v45.0.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="wasmtime-${WASMTIME_VERSION}-${arch}-linux-c-api.tar.xz"
          root="/tmp/wasmtime-c-api"
          rm -rf "$root"
          mkdir -p "$root"
          curl -L "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${archive}" -o "/tmp/${archive}"
          tar -xJf "/tmp/${archive}" -C "$root" --strip-components=1
          lib="$(find "$root/lib" -maxdepth 1 -name 'libwasmtime.so*' | sort | head -n 1)"
          test -n "$lib"
          echo "ANTFLY_WASMTIME_LIB=$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Antfly full E2E
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_LSM_OPEN_DEBUG: "1"
          ANTFLY_FS_PATH_DEBUG: "1"
        run: |
          chmod +x ./zig-out/bin/antfly
          uv run --project e2e/antfly pytest -q -x e2e/antfly

      - name: Run Antfly inference full E2E
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_DOWNLOAD: "1"
          ANTFLY_INFERENCE_DEFAULT_GENERATOR_MODEL: openai-community/gpt2
        run: uv run --project e2e/inference pytest -q -x e2e/inference
