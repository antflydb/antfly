name: Zig Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-global-cache
  # Required PR/push/scheduled aggregates skip the gated HA suites. Manual
  # dispatch retains the full HA test surface until the paired Colony and
  # Antfly HA changes land.
  ZIG_BUILD_FLAGS: ${{ github.event_name == 'workflow_dispatch' && '-Dha-tests=true' || '-Dha-tests=false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: arc-antfly-standard
    outputs:
      zig_tests: ${{ steps.detect.outputs.zig_tests }}
      e2e: ${{ steps.detect.outputs.e2e }}
      model_check: ${{ steps.detect.outputs.model_check }}
      trace_validate: ${{ steps.detect.outputs.trace_validate }}
      backup_s3: ${{ steps.detect.outputs.backup_s3 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.schedule }}" == "0 3 * * 0" ]]; then
              {
                echo "e2e=false"
                echo "model_check=true"
                echo "trace_validate=true"
                echo "backup_s3=false"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
                echo "backup_s3=true"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(glob)scripts/ci/**' \
            scripts/test-backup-s3-integration.sh \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "zig_tests=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/**' \
            ':(glob)scripts/ci/**' \
            scripts/test-backup-s3-integration.sh \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            scripts/test-backup-s3-integration.sh \
            zig/build.zig \
            zig/lib/httpx \
            zig/lib/objectstore \
            zig/pkg/antfly/src/api/backups.zig \
            zig/pkg/antfly/src/serverless/remote_uri.zig \
            .github/workflows/zig-tests.yml
          then
            echo "backup_s3=false" >> "$GITHUB_OUTPUT"
          else
            echo "backup_s3=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            Makefile \
            .github/workflows/zig-tests.yml
          then
            echo "model_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "model_check=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "${{ github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            ':(glob)zig/pkg/antfly/src/tracing/**' \
            ':(glob)zig/pkg/antfly/src/raft/**' \
            ':(glob)zig/pkg/antfly/src/storage/db/**' \
            ':(glob)zig/lib/raft/**' \
            Makefile \
            zig/build.zig \
            .github/workflows/zig-tests.yml
          then
            echo "trace_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "trace_validate=true" >> "$GITHUB_OUTPUT"
          fi

  backup-s3-integration:
    name: backup-s3-integration
    needs: changes
    # Opt in explicitly to avoid GitHub-hosted runner charges while this
    # service-backed integration is temporarily disabled.
    if: needs.changes.outputs.backup_s3 == 'true' && vars.ENABLE_BACKUP_S3_INTEGRATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Run backup listing against MinIO
        run: scripts/test-backup-s3-integration.sh

  arm64-codec:
    name: ${{ (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') && 'zig-base / arm64-codec' || 'zig-full / arm64-codec' }}
    needs: changes
    if: |
      (
        (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') &&
        (
          needs.changes.outputs.zig_tests == 'true' ||
          needs.changes.outputs.model_check == 'true' ||
          needs.changes.outputs.trace_validate == 'true'
        )
      ) ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-publish-arm64
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.16.0"
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-arm64-codec
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache-arm64-codec
    steps:
      - uses: actions/checkout@v6

      - name: Verify native Linux ARM64 runner
        run: |
          set -euo pipefail
          uname -srm
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "aarch64"

      - name: Install Zig
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl xz-utils
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" \
            -C "$RUNNER_TEMP/zig" \
            --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Verify Zig version
        run: test "$(zig version)" = "$ZIG_VERSION"

      - name: Run StreamVByte codec tests
        run: |
          set -euo pipefail
          zig test zig/pkg/antfly/src/encoding/streamvbyte.zig
          zig test -O ReleaseFast zig/pkg/antfly/src/encoding/streamvbyte.zig
          zig test zig/pkg/antfly/src/encoding/chunked_coder.zig
          zig test -O ReleaseFast zig/pkg/antfly/src/encoding/chunked_coder.zig

  zig-base-tests:
    name: zig-base / x86_64
    needs: changes
    if: (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') && (needs.changes.outputs.zig_tests == 'true' || needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true')
    runs-on: arc-antfly-heavy
    # Keep the outer job timeout above the in-step hard watchdog so true hangs
    # produce the watchdog stack dump instead of an opaque GitHub cancellation.
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      - name: Check generated sources
        run: make zig-generated-check

      # ARC exposes the node CPU count instead of the pod quota. Keep the
      # process affinity aligned with the pod CPU budget, and independently
      # give Zig one memory-heavy process slot on the 15 GiB runner. A single
      # unit artifact can approach half that budget while compiling or running;
      # it still retains the full CPU set for its internal parallel work.
      - name: Compute CPU bound for unit tests
        if: needs.changes.outputs.zig_tests == 'true'
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"
          echo "build_jobs=1" >> "$GITHUB_OUTPUT"

      - name: Run hermetic Antfly unit tests
        if: needs.changes.outputs.zig_tests == 'true'
        env:
          ANTFLY_TEST_CLEANUP_TRACE: "1"
        run: |
          set -euo pipefail

          collect_descendants() {
            local roots="$*"
            local all=" ${roots} "
            local changed=1
            while [ "$changed" -eq 1 ]; do
              changed=0
              while read -r pid ppid; do
                if [[ " $all " == *" $ppid "* && " $all " != *" $pid "* ]]; then
                  all="${all}${pid} "
                  changed=1
                fi
              done < <(ps -eo pid=,ppid=)
            done
            echo "$all"
          }

          dump_stacks() {
            local root_pid="$1"
            echo "::group::antfly unit watchdog ptrace settings"
            if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
              cat /proc/sys/kernel/yama/ptrace_scope || true
            fi
            sysctl kernel.yama.ptrace_scope 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::antfly unit watchdog process tree"
            ps -eo pid,ppid,stat,etime,cmd | grep -E "PID|zig build|zig-local|/test|make zig-unit-test|make -C ./zig unit-test" || true
            echo "::endgroup::"

            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if ! kill -0 "$pid" 2>/dev/null; then
                continue
              fi
              local cmdline
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              case "$cmdline" in
                *"/test "*|*"/test"*|*"zig build"*|*" make "*)
                  echo "::group::proc snapshot pid=$pid cmd=$cmdline"
                  if [ -r "/proc/$pid/status" ]; then
                    grep -E "^(Name|State|Pid|PPid|Threads|VmRSS|VmHWM|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):" "/proc/$pid/status" || true
                  fi
                  if [ -r "/proc/$pid/wchan" ]; then
                    printf "wchan="
                    cat "/proc/$pid/wchan" || true
                    printf "\n"
                  fi
                  if [ -r "/proc/$pid/stack" ]; then
                    cat "/proc/$pid/stack" || true
                  fi
                  echo "::endgroup::"

                  echo "::group::gdb thread dump pid=$pid cmd=$cmdline"
                  timeout 45s gdb -batch -p "$pid" \
                    -ex "set pagination off" \
                    -ex "thread apply all bt" \
                    -ex "detach" || \
                    timeout 45s sudo gdb -batch -p "$pid" \
                      -ex "set pagination off" \
                      -ex "thread apply all bt" \
                      -ex "detach" || true
                  echo "::endgroup::"
                  ;;
              esac
            done
          }

          terminate_tree() {
            local root_pid="$1"
            local pids
            pids="$(collect_descendants "$root_pid")"
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            sleep 5
            for pid in $pids; do
              if [ "$pid" != "$$" ]; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done
          }

          if [ -r /proc/sys/kernel/yama/ptrace_scope ]; then
            echo "::group::configure ptrace for unit watchdog"
            echo "ptrace_scope before: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            sudo sysctl -w kernel.yama.ptrace_scope=0 || true
            echo "ptrace_scope after: $(cat /proc/sys/kernel/yama/ptrace_scope || true)"
            echo "::endgroup::"
          fi

          unit_log="${RUNNER_TEMP:-/tmp}/antfly-zig-unit.log"
          : > "$unit_log"

          (
            set +e
            taskset -c "${{ steps.cpus.outputs.list }}" make zig-unit-test ZIG_BUILD_FLAGS="${ZIG_BUILD_FLAGS} -j${{ steps.cpus.outputs.build_jobs }}" 2>&1 | tee -a "$unit_log"
            exit "${PIPESTATUS[0]}"
          ) &
          unit_pid="$!"
          (
            idle_limit_secs="${ANTFLY_UNIT_WATCHDOG_IDLE_SECS:-900}"
            hard_limit_secs="${ANTFLY_UNIT_WATCHDOG_HARD_SECS:-3600}"
            start_epoch="$(date +%s)"
            last_progress_epoch="$start_epoch"
            last_mtime=0
            while kill -0 "$unit_pid" 2>/dev/null; do
              sleep 15
              now_epoch="$(date +%s)"
              if [ -e "$unit_log" ]; then
                current_mtime="$(stat -c %Y "$unit_log" 2>/dev/null || echo 0)"
                if [ "$current_mtime" -gt "$last_mtime" ]; then
                  last_mtime="$current_mtime"
                  last_progress_epoch="$now_epoch"
                fi
              fi

              elapsed_secs=$((now_epoch - start_epoch))
              idle_secs=$((now_epoch - last_progress_epoch))
              if [ "$hard_limit_secs" -gt 0 ] && [ "$elapsed_secs" -ge "$hard_limit_secs" ]; then
                echo "::error::zig-unit-test hard watchdog fired after ${elapsed_secs}s; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
              if [ "$idle_limit_secs" -gt 0 ] && [ "$idle_secs" -ge "$idle_limit_secs" ]; then
                echo "::error::zig-unit-test idle watchdog fired after ${idle_secs}s without unit log progress; dumping stacks before terminating live test processes"
                tail -n 200 "$unit_log" || true
                dump_stacks "$unit_pid"
                terminate_tree "$unit_pid"
                exit 0
              fi
            done
          ) &
          watchdog_pid="$!"

          status=0
          wait "$unit_pid" || status="$?"
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ] && [ -d /sys/fs/cgroup ]; then
            echo "::group::unit failure cgroup memory"
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "[$metric]"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Set up Java for TLA+
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLA verification
        if: needs.changes.outputs.model_check == 'true' || needs.changes.outputs.trace_validate == 'true'
        env:
          ANTFLY_TLA_MODEL_CHECK: ${{ needs.changes.outputs.model_check }}
          ANTFLY_TLA_TRACE_VALIDATE: ${{ needs.changes.outputs.trace_validate }}
        run: scripts/ci/zig-tla-verify.sh

  zig-full-tests:
    name: zig-full / x86_64
    needs: changes
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-heavy
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Verify Zig version
        run: zig version

      - name: Check generated sources
        run: make zig-generated-check

      # The in-process cluster simulations size their thread pools from the
      # visible CPU count, which on ARC reflects the node rather than the pod
      # quota. Give Zig one memory-heavy process slot while retaining the full
      # pod CPU set inside that process.
      - name: Compute CPU bound for heavy test steps
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"
          echo "build_jobs=1" >> "$GITHUB_OUTPUT"

      - name: Run full Zig unit tests
        run: |
          set +e
          taskset -c ${{ steps.cpus.outputs.list }} make zig-unit-test ZIG_BUILD_FLAGS="${ZIG_BUILD_FLAGS} -j${{ steps.cpus.outputs.build_jobs }}"
          status="$?"
          if [ "$status" -ne 0 ] && [ -d /sys/fs/cgroup ]; then
            echo "::group::unit failure cgroup memory"
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "[$metric]"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Set up Java for TLA+
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run TLA verification
        env:
          ANTFLY_TLA_MODEL_CHECK: "true"
          ANTFLY_TLA_TRACE_VALIDATE: "true"
        run: scripts/ci/zig-tla-verify.sh

      - name: Run Zig simulation tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build sim-test

      - name: Run Zig integration tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build integration-test

      - name: Run Zig recall tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build recall-test

      - name: Run Zig recall harness sweep
        working-directory: zig
        run: |
          set -euo pipefail
          datasets=(
            images-512d-10k.gob
            random-20d-1k.gob
            fashionminst-784d-1k.gob
            fashionminst-784d-10k.gob
            laionclip-768d-1k.gob
            laiongemini-1408d-1k.gob
            laiongemini-512d-10k.gob
            dbpedia-1536d-1k.gob
            random-2048d-1k.gob
            random-4096d-1k.gob
            wikiarticles-768d-10k.gob
          )
          for dataset in "${datasets[@]}"; do
            echo "::group::recall-harness ${dataset}"
            taskset -c ${{ steps.cpus.outputs.list }} zig build recall-harness -- --dataset-dir testdata/vectorsets --dataset "${dataset}"
            echo "::endgroup::"
          done

      - name: Run Zig chaos tests
        working-directory: zig
        run: taskset -c ${{ steps.cpus.outputs.list }} zig build chaos-test ${ZIG_BUILD_FLAGS}

  zig-base:
    name: zig-base
    needs: [changes, zig-base-tests, arm64-codec]
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event.schedule == '0 3 * * 0') &&
      (
        needs.changes.result != 'success' ||
        needs.changes.outputs.zig_tests == 'true' ||
        needs.changes.outputs.model_check == 'true' ||
        needs.changes.outputs.trace_validate == 'true'
      )
    runs-on: arc-antfly-standard
    steps:
      - name: Verify zig-base shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-base-tests.result }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"

  zig-full:
    name: zig-full
    needs: [changes, zig-full-tests, arm64-codec]
    if: |
      always() &&
      (
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '0 8 * * *'
      )
    runs-on: arc-antfly-standard
    steps:
      - name: Verify zig-full shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          X86_64_RESULT: ${{ needs.zig-full-tests.result }}
          ARM64_CODEC_RESULT: ${{ needs.arm64-codec.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          test "$X86_64_RESULT" = "success"
          test "$ARM64_CODEC_RESULT" = "success"

  e2e-base:
    name: e2e-base
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true'
    runs-on: arc-antfly-heavy
    timeout-minutes: 45
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      UV_CACHE_DIR: /mnt/cache/antfly/zig/uv
      HF_HOME: /mnt/cache/antfly/zig/hf
      ANTFLY_CI_TRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$UV_CACHE_DIR" "$HF_HOME"
          mkdir -p /mnt/cache/antfly/zig/home-cache /mnt/cache/antfly/zig/home-antfly
          rm -rf ~/.cache ~/.antfly
          ln -s /mnt/cache/antfly/zig/home-cache ~/.cache
          ln -s /mnt/cache/antfly/zig/home-antfly ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Build E2E binaries
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Run base E2E
        env:
          SKIP_BUILD: "1"
        run: taskset -c ${{ steps.e2e_cpus.outputs.list }} scripts/ci/zig-e2e-base-linux.sh

  e2e-full:
    name: e2e-full
    needs: changes
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: arc-antfly-heavy
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
      UV_CACHE_DIR: /mnt/cache/antfly/zig/uv
      HF_HOME: /mnt/cache/antfly/zig/hf
      # Keep production optimization while preserving runtime-safety checks and
      # std.debug.assert invariants exercised by the full E2E suite.
      ANTFLY_CI_ZIG_OPTIMIZE: ReleaseSafe
      # Match release artifact symbol handling without disabling ReleaseSafe
      # checks or std.debug.assert invariants.
      ANTFLY_CI_ZIG_STRIP: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore ARC cache dirs
        run: |
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache" "$UV_CACHE_DIR" "$HF_HOME"
          mkdir -p /mnt/cache/antfly/zig/home-cache /mnt/cache/antfly/zig/home-antfly
          rm -rf ~/.cache ~/.antfly
          ln -s /mnt/cache/antfly/zig/home-cache ~/.cache
          ln -s /mnt/cache/antfly/zig/home-antfly ~/.antfly

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Compute CPU bound for E2E
        id: e2e_cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Set up Rust WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build MemoryAF extension package
        run: cargo build --manifest-path extensions/memoryaf/Cargo.toml --release --target wasm32-wasip2

      - name: Build E2E binaries
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Install Wasmtime C API
        env:
          WASMTIME_VERSION: v45.0.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="wasmtime-${WASMTIME_VERSION}-${arch}-linux-c-api.tar.xz"
          root="/tmp/wasmtime-c-api"
          rm -rf "$root"
          mkdir -p "$root"
          curl -L "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${archive}" -o "/tmp/${archive}"
          tar -xJf "/tmp/${archive}" -C "$root" --strip-components=1
          lib="$(find "$root/lib" -maxdepth 1 -name 'libwasmtime.so*' | sort | head -n 1)"
          test -n "$lib"
          echo "ANTFLY_WASMTIME_LIB=$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run Antfly full E2E
        id: antfly_full_e2e
        continue-on-error: true
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_LSM_OPEN_DEBUG: "1"
        run: |
          chmod +x ./zig-out/bin/antfly
          taskset -c ${{ steps.e2e_cpus.outputs.list }} uv run --project e2e/antfly pytest -q --continue-on-collection-errors e2e/antfly

      - name: Run Antfly inference full E2E
        id: inference_full_e2e
        if: always()
        continue-on-error: true
        working-directory: zig
        env:
          ANTFLY_BIN: ./zig-out/bin/antfly
          ANTFLY_INFERENCE_DOWNLOAD: "1"
          # Use one model for ordinary, tool-calling, and multimodal generation
          # so the ReleaseSafe suite does not retain competing generator sessions.
          ANTFLY_INFERENCE_DEFAULT_GENERATOR_MODEL: ggml-org/gemma-4-e2b-it-gguf
          ANTFLY_INFERENCE_FLORENCE_MODEL: antflydb/florence-2-base
          ANTFLY_INFERENCE_REQUEST_TIMEOUT: "300"
          ANTFLY_INFERENCE_SERVER_CONFIG: e2e/inference/ci-server.json
        run: taskset -c ${{ steps.e2e_cpus.outputs.list }} uv run --project e2e/inference pytest -q --continue-on-collection-errors e2e/inference

      - name: Report full E2E result
        if: always()
        env:
          ANTFLY_E2E_OUTCOME: ${{ steps.antfly_full_e2e.outcome }}
          INFERENCE_E2E_OUTCOME: ${{ steps.inference_full_e2e.outcome }}
        run: |
          if [[ "$ANTFLY_E2E_OUTCOME" != "success" || "$INFERENCE_E2E_OUTCOME" != "success" ]]; then
            echo "Antfly E2E: $ANTFLY_E2E_OUTCOME" >&2
            echo "Inference E2E: $INFERENCE_E2E_OUTCOME" >&2
            exit 1
          fi
