name: CUDA L4 Pre-Merge Validation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: CUDA validation scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regressions
          - inference-e2e

permissions:
  actions: read
  contents: read

jobs:
  canary:
    uses: ./.github/workflows/zig-inference-l4-spot.yml
    with:
      scope: ${{ inputs.scope }}
      artifact_run_id: "32587830193"
