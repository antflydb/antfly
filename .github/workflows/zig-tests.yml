name: Zig Tests

on:
  workflow_call:
    inputs:
      full_validation:
        description: Run full Zig and E2E suites for an approved PR
        type: boolean
        default: false
      pr_number:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      check_id:
        type: string
        default: ''
      comment_id:
        type: string
        default: ''
      validation_scope:
        type: string
        default: all
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Full validation scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - inference-e2e

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-global-cache

concurrency:
  group: zig-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    uses: ./.github/workflows/pr-ci-admission.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      check_id: ${{ inputs.check_id }}
      comment_id: ${{ inputs.comment_id }}
      suite: ${{ inputs.full_validation && 'full' || 'zig' }}

  changes:
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) }}
    needs: admission
    runs-on: arc-antfly-standard-runtime
    outputs:
      zig_tests: ${{ steps.detect.outputs.zig_tests }}
      e2e: ${{ steps.detect.outputs.e2e }}
      model_check: ${{ steps.detect.outputs.model_check }}
      trace_validate: ${{ steps.detect.outputs.trace_validate }}
      backup_s3: ${{ steps.detect.outputs.backup_s3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Zig release pins and checksums
        run: python3 scripts/ci/verify_zig_toolchain.py

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Detect relevant changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          helper="$RUNNER_TEMP/zig-relevant-changes.sh"
          cat > "$helper" <<'HELPER'
          #!/usr/bin/env bash
          # Decide whether a diff selects Zig test work.
          #
          # Usage: zig-relevant-changes.sh BASE HEAD -- PATHSPEC...
          # Exit 0 when the diff contains a relevant change, 1 when it does not.
          #
          # Markdown is documentation, not test input: .md/.mdx files are dropped from
          # the diff before deciding. Two exceptions stay in scope: fixture READMEs under
          # a testdata/ directory (oracle scripts check them) and the files listed in
          # DOC_TEST_INPUTS, which Zig tests read directly. Renames are reported as a
          # delete plus an add so renaming code to Markdown still counts. If git itself
          # fails, the change is treated as relevant so tests run rather than skip.
          set -uo pipefail

          DOC_TEST_INPUTS=(
            zig/pkg/inference/QUANT_KERNEL_COMPILER.md
          )

          base="${1:?base revision}"
          head="${2:?head revision}"
          shift 2
          if [ "${1:-}" != "--" ]; then
            echo "usage: $0 BASE HEAD -- PATHSPEC..." >&2
            exit 2
          fi
          shift

          if ! changed="$(git diff --no-renames --name-only "$base" "$head" -- "$@")"; then
            echo "zig-relevant-changes: git diff failed; selecting tests conservatively" >&2
            exit 0
          fi

          keep="$(printf '%s\n' "$changed" | awk -v inputs="${DOC_TEST_INPUTS[*]}" '
            BEGIN { n = split(inputs, list, " "); for (i = 1; i <= n; i++) allow[list[i]] = 1 }
            $0 == "" { next }
            /\.mdx?$/ && !/(^|\/)testdata\// && !($0 in allow) { next }
            { print }
          ')"
          [ -n "$keep" ]
          HELPER
          chmod +x "$helper"

          if [[ "${{ inputs.full_validation }}" == "true" ]]; then
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.validation_scope }}" == "inference-e2e" ]]; then
              {
                echo "zig_tests=false"
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
                echo "backup_s3=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}" == "schedule" ]]; then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.schedule }}" == "0 3 * * 0" ]]; then
              {
                echo "e2e=false"
                echo "model_check=true"
                echo "trace_validate=true"
                echo "backup_s3=false"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "e2e=true"
                echo "model_check=false"
                echo "trace_validate=false"
                echo "backup_s3=true"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}" == "pull_request" ]]; then
            base="${{ inputs.base_sha }}"
          elif [[ "${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            {
              echo "zig_tests=true"
              echo "e2e=true"
              echo "model_check=true"
              echo "trace_validate=true"
              echo "backup_s3=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! "$helper" "$base" "${{ inputs.head_sha || github.sha }}" -- \
            ':(glob)zig/**' \
            ':(exclude,glob)zig/pkg/antfly/antfarm/**' \
            ':(glob)scripts/ci/zig-*.sh' \
            scripts/ci/zig_e2e_shard.py \
            scripts/ci/test_zig_e2e_shard.py scripts/ci/merge_e2e_durations.py scripts/ci/summarize_e2e_timings.py scripts/ci/antfly_e2e_durations.json \
            ':(glob)scripts/ci/*vopr*.py' \
            .github/workflows/zig-vopr-soak.yml \
            scripts/ci/check_zig_checksum_usage.py \
            scripts/ci/test_check_zig_checksum_usage.py \
            scripts/ci/toolchain-policy.json \
            .github/actions/load-toolchain-policy/action.yml \
            scripts/test-backup-s3-integration.sh \
            scripts/run_db_query_matrix.py \
            scripts/test_run_db_query_matrix.py \
            scripts/test_conformance_fixtures.py \
            ':(glob)specs/openapi/**' \
            openapi.yaml \
            scripts/join_openapi.py \
            scripts/join_public_openapi.py \
            scripts/openapi_joiner.py \
            scripts/openapi_inputs.py \
            scripts/public_openapi_overlays.py \
            scripts/yaml_to_json.py \
            scripts/generate_graph_identifier_policy.py \
            scripts/generate_mcp_schema_fragments.py \
            scripts/pyproject.toml \
            scripts/uv.lock \
            scripts/ci/test_zig_validation_scope.py \
            ':(glob)scripts/bench/pdf/**' \
            ':(glob)scripts/laya/**' \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "zig_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "zig_tests=true" >> "$GITHUB_OUTPUT"
          fi

          if ! "$helper" "$base" "${{ inputs.head_sha || github.sha }}" -- \
            ':(glob)zig/**' \
            ':(exclude,glob)zig/pkg/antfly/antfarm/**' \
            ':(glob)scripts/ci/zig-*.sh' \
            scripts/ci/zig_e2e_shard.py \
            scripts/ci/test_zig_e2e_shard.py scripts/ci/merge_e2e_durations.py scripts/ci/summarize_e2e_timings.py scripts/ci/antfly_e2e_durations.json \
            scripts/ci/toolchain-policy.json \
            ':(glob)go/pkg/embedded/**' \
            ':(glob)rs/crates/embedded*/**' \
            rs/Cargo.toml rs/Cargo.lock \
            ':(glob)py/packages/embedded/**' \
            ':(glob)ts/packages/embedded*/**' \
            ts/package.json ts/pnpm-lock.yaml ts/pnpm-workspace.yaml \
            scripts/ci/test-embedded-sdk-native.sh \
            scripts/ci/test_embedded_sdk_native.py \
            scripts/test_pgwire_drivers.py \
            ':(glob)scripts/pgwire_drivers/**' \
            ':(glob)go/pkg/operator/**' \
            ':(glob)go/pkg/sdk/admin/**' \
            go/pkg/sdk/go.mod \
            go/pkg/sdk/go.sum \
            ':(glob)specs/openapi/**' \
            .github/actions/load-toolchain-policy/action.yml \
            scripts/test-backup-s3-integration.sh \
            Makefile \
            .github/workflows/zig-tests.yml \
            .github/workflows/antfly-container.yml
          then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

          if ! "$helper" "$base" "${{ inputs.head_sha || github.sha }}" -- \
            scripts/test-backup-s3-integration.sh \
            zig/build.zig \
            ':(glob)zig/pkg/antfly/build/**' \
            ':(glob)zig/build_support/embedded/**' \
            ':(glob)zig/build_support/antfly/**' \
            zig/embedded.build.zig \
            ':(glob)zig/pkg/inference/build/**' \
            ':(glob)zig/lib/**/build_support.zig' \
            ':(glob)zig/lib/**/build.zig' \
            zig/tools/build_support.zig \
            zig/lib/httpx \
            zig/lib/objectstore \
            zig/pkg/antfly/src/api/backups.zig \
            zig/pkg/antfly-embedded/src/serverless/remote_uri.zig \
            .github/workflows/zig-tests.yml
          then
            echo "backup_s3=false" >> "$GITHUB_OUTPUT"
          else
            echo "backup_s3=true" >> "$GITHUB_OUTPUT"
          fi

          if ! "$helper" "$base" "${{ inputs.head_sha || github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            Makefile \
            .github/workflows/zig-tests.yml
          then
            echo "model_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "model_check=true" >> "$GITHUB_OUTPUT"
          fi

          if ! "$helper" "$base" "${{ inputs.head_sha || github.sha }}" -- \
            ':(glob)zig/specs/tla/**' \
            ':(glob)scripts/tla-*.sh' \
            ':(glob)scripts/tla-*.py' \
            ':(glob)zig/pkg/antfly/src/tracing/**' \
            ':(glob)zig/pkg/antfly/src/raft/**' \
            ':(glob)zig/pkg/antfly-embedded/src/storage/db/**' \
            ':(glob)zig/lib/raft/**' \
            Makefile \
            zig/build.zig \
            ':(glob)zig/pkg/antfly/build/**' \
            ':(glob)zig/build_support/embedded/**' \
            ':(glob)zig/build_support/antfly/**' \
            zig/embedded.build.zig \
            ':(glob)zig/pkg/inference/build/**' \
            ':(glob)zig/lib/**/build_support.zig' \
            ':(glob)zig/lib/**/build.zig' \
            zig/tools/build_support.zig \
            .github/workflows/zig-tests.yml
          then
            echo "trace_validate=false" >> "$GITHUB_OUTPUT"
          else
            echo "trace_validate=true" >> "$GITHUB_OUTPUT"
          fi

  backup-s3-integration:
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (needs.changes.outputs.backup_s3 == 'true' &&
      vars.ENABLE_BACKUP_S3_INTEGRATION == 'true') }}
    name: backup-s3-integration
    needs: [admission, changes]
    # Opt in explicitly to avoid GitHub-hosted runner charges while this
    # service-backed integration is temporarily disabled.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Run backup listing against MinIO
        run: scripts/test-backup-s3-integration.sh

  arm64-codec:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (( (inputs.pr_number != '' ||
      github.event.schedule == '0 3 * * 0') &&
      ( needs.changes.outputs.zig_tests == 'true' ||
      needs.changes.outputs.model_check == 'true' ||
      needs.changes.outputs.trace_validate == 'true' ) ) ||
      inputs.full_validation ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      ((inputs.pr_number == '' &&
      github.event_name == 'workflow_dispatch') &&
      inputs.validation_scope == 'all') ||
      github.event.schedule == '0 8 * * *') }}
    name: ${{ ((inputs.pr_number != '' && !inputs.full_validation) || github.event.schedule == '0 3 * * 0') && 'zig-base / arm64-codec' || 'zig-full / arm64-codec' }}
    needs: [admission, changes]
    runs-on: arc-antfly-arm64-runtime
    timeout-minutes: 20
    env:
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-arm64-codec
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache-arm64-codec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Verify native Linux ARM64 runner
        run: |
          set -euo pipefail
          uname -srm
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "aarch64"

      - name: Install Zig
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
          ZIG_AARCH64_LINUX_SHA256: ${{ steps.toolchain.outputs.zig_aarch64_linux_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl xz-utils python3 make
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_AARCH64_LINUX_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" \
            -C "$RUNNER_TEMP/zig" \
            --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies

      - name: Verify Zig version
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
        run: test "$(zig version)" = "$ZIG_VERSION"

      - name: Run StreamVByte codec tests
        run: |
          set -euo pipefail
          zig test zig/pkg/antfly-embedded/src/encoding/streamvbyte.zig
          zig test -O fast zig/pkg/antfly-embedded/src/encoding/streamvbyte.zig
          zig test zig/pkg/antfly-embedded/src/encoding/chunked_coder.zig
          zig test -O fast zig/pkg/antfly-embedded/src/encoding/chunked_coder.zig

      - name: Check shared checksum usage
        run: make zig-checksums-check

      - name: Test baseline ARM64 checksum runtime dispatch
        run: |
          zig test zig/lib/hash/src/mod.zig -O safe -mcpu=baseline
          zig test zig/lib/hash/src/mod.zig -O safe -mcpu=baseline -lc

  zig-base-tests:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    if: >-
      ${{ !cancelled() &&
      success() &&
      !inputs.full_validation &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      ((inputs.pr_number != '' ||
      github.event.schedule == '0 3 * * 0') &&
      (needs.changes.outputs.zig_tests == 'true' ||
      needs.changes.outputs.model_check == 'true' ||
      needs.changes.outputs.trace_validate == 'true')) }}
    name: zig-base / x86_64
    needs: [admission, changes]
    runs-on: arc-antfly-heavy
    # Keep the outer job timeout above the in-step hard watchdog so true hangs
    # produce the watchdog stack dump instead of an opaque GitHub cancellation.
    timeout-minutes: 120
    env:
      # ARC heavy pods have a 24 GiB limit but inject a 20 GiB default.
      # Admit the 22 GiB storage compile while leaving 2 GiB for the runner
      # and build driver. Keep this scoped to the heavy build jobs.
      ANTFLY_ZIG_MAX_RSS: "23622320128"
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils gdb file libopenblas0-pthread

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Restore ARC Zig cache dirs
        run: |
          # Compiler outputs belong on the PVC; runner temp counts toward
          # the pod's 10 GiB ephemeral-storage limit. Retire completed phase
          # caches below before starting the next phase.
          local_cache="/mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local"
          global_cache="/mnt/cache/antfly/zig/zig-global"
          echo "ZIG_LOCAL_CACHE_DIR=$local_cache" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$global_cache" >> "$GITHUB_ENV"
          mkdir -p "$local_cache" "$global_cache"

      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies

      - name: Verify Zig version
        run: zig version

      - name: Check shared checksum usage
        run: make zig-checksums-check

      - name: Test baseline checksum runtime dispatch
        working-directory: zig
        run: |
          zig test lib/hash/src/mod.zig -O debug -mcpu=baseline -fno-llvm
          zig build lib-hash-test -Dcpu=baseline -Doptimize=safe

      - name: Test portable Linux x86 inference kernel dispatch
        run: python3 zig/tools/verify_linux_x86_kernels.py

      - name: Test native Linux x86 video decoding and logical indexing
        working-directory: zig/lib/video
        run: |
          uname -srm
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          zig build test-video -Dcpu=baseline -Doptimize=ReleaseSafe -j1 --summary all

      - name: Test optional OpenBLAS dispatch and fallback
        run: python3 zig/tools/verify_runtime_openblas.py --openblas-library /usr/lib/x86_64-linux-gnu/libopenblas.so.0

      - name: Test native static-musl process execution
        working-directory: zig
        run: |
          set -euo pipefail
          zig build lib-platform-test -Dtarget=x86_64-linux-musl --summary all 2>&1 | tee "$RUNNER_TEMP/platform-musl.log"
          # A successful aggregate could hide a skipped process check.
          grep -q 'run python3 success' "$RUNNER_TEMP/platform-musl.log"

      - name: Set up Node for generated source checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json

      - name: Verify Zig source cache round trip
        env:
          ANTFLY_TEST_ZIG: zig
        run: python3 -m unittest discover -s scripts/ci -p test_zig_dependencies.py

      - name: Check generated sources
        run: make zig-generated-check

      - name: Compile consolidated storage and graph benchmark contracts
        if: needs.changes.outputs.zig_tests == 'true'
        working-directory: zig
        run: zig build antfly-storage-bench antfly-graph-bench -Doptimize=debug

      # Keep inexpensive tooling checks beside the normal unit gate. The
      # isolated compilation/cache matrix runs in zig-full / build-cache.
      - name: Test build tooling
        working-directory: zig
        run: >-
          python3 -m unittest
          tools/test_patch_zig_0_16_build_runner_maxrss.py
          tools/test_run_bounded_zig_build.py
          tools/test_fixture_workspace.py
          tools/test_prune_completed_test_cache.py
          tools/test_test_cache_lifetime.py
          tools/test_analyze_zig_import_graph.py
          tools/test_audit_storage_test_shards.py
          tools/test_audit_test_selection.py
          tools/test_audit_unit_test_ownership.py
          tools/test_check_storage_compilation.py
          tools/test_capi_exports.py
          tools/test_run_build_cache_contracts.py
          tools/test_run_test_partitions.py
          tools/test_retain_test_process.py
          tools/test_run_recall_checks.py
          tools/test_test_runner.py
          tools/test_local_test_partitions.py
          tools/test_sync_generated.py
          pkg/inference/build/test_prepare_wasm64_zig_lib.py

      - name: Test benchmark orchestration and fixture setup
        run: |
          python3 -m unittest discover -s scripts/ci -p test_eval_extract.py
          python3 -m unittest discover -s scripts/ci -p test_lite_embedding_bundle.py
          python3 -m unittest discover -s scripts -p test_run_db_query_matrix.py
          python3 -m unittest discover -s scripts -p test_conformance_fixtures.py
          python3 -m unittest discover -s scripts -p 'test_laya_cuda*.py'
          python3 -m unittest discover -s scripts/bench/pdf -p 'test_*.py'

      - name: Test Laya data and qualification contracts
        run: |
          PYTHONPATH=scripts/laya python3 -m unittest discover -s scripts/laya -p 'test_*.py'

