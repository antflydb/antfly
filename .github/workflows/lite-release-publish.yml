name: Publish Apache Lite and Inference

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing immutable Antfly release tag (v-prefixed)"
        required: true
        type: string
      build_run_id:
        description: "Successful Release build run containing the Lite snapshot"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Verify immutable Lite release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      python_version: ${{ steps.identity.outputs.python_version }}
      npm_tag: ${{ steps.identity.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}

      - name: Require a successful trusted release build and tagged source
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([+-][0-9A-Za-z.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/lite-build-run.json"
          test "$(jq -r .name "$RUNNER_TEMP/lite-build-run.json")" = 'Release build'
          test "$(jq -r .conclusion "$RUNNER_TEMP/lite-build-run.json")" = success
          git fetch --no-tags origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          commit="$(git rev-parse "$TAG_NAME^{commit}")"
          version="${TAG_NAME#v}"
          python_version="$(python -c 'import sys; sys.path.insert(0, "scripts/release"); from release_channels import python_version_from_release; print(python_version_from_release(sys.argv[1]))' "$version")"
          npm_tag=latest
          if [[ "$version" == *-* ]]; then npm_tag=next; fi
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "python_version=$python_version"
            echo "npm_tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: antfly-lite-package-snapshot
          path: dist/lite-snapshot
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hashes, product license, and archive equivalence
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "${{ steps.identity.outputs.commit }}"
          python scripts/packaging/verify_lite_release.py \
            --version "${{ steps.identity.outputs.version }}" \
            --archive-dir dist/release-archives \
            --wheel-dir dist/lite-snapshot \
            --npm-dir dist/lite-snapshot

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-antfly-lite-snapshot
          path: dist/lite-snapshot/
          if-no-files-found: error

  publish-pypi:
    name: Publish antfly-lite wheels to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-lite
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-antfly-lite-snapshot
          path: dist/lite-snapshot
      - name: Select exact Python wheels
        id: pypi
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.commit }}"
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-lite \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --out-dir dist/pypi
      - name: Publish wheels
        if: ${{ steps.pypi.outputs.has_packages == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi
      - name: Verify exact PyPI release
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-lite \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --verify-complete --attempts 30 --retry-seconds 10

  publish-npm:
    name: Publish @antfly/lite packages to npm
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned npm toolchain
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-antfly-lite-snapshot
          path: dist/lite-snapshot
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/
      - name: Install exact npm trusted-publishing client
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm_version }}
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Publish platform packages, then selector
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: |
          set -euo pipefail
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot --version "$VERSION" \
            --commit "${{ needs.prepare.outputs.commit }}"
          for name in lite-darwin-arm64 lite-linux-arm64 lite-linux-x64 lite; do
            sh scripts/packaging/publish_npm_package.sh "@antfly/$name" \
              "$VERSION" "$NPM_TAG" "dist/lite-snapshot/antfly-${name}-${VERSION}.tgz"
          done
