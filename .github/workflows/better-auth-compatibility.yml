name: Better Auth compatibility
on:
  workflow_call:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    permissions:
      contents: read
      id-token: write
    runs-on: arc-antfly-heavy
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/${{ github.job }}/${{ github.run_id }}-${{ github.run_attempt }}/zig-local
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/load-toolchain-policy
        id: toolchain
      - name: Install native build tools
        run: bash scripts/ci/install_ubuntu_packages.sh build-essential pkg-config ca-certificates git curl xz-utils file
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.toolchain.outputs.zig_nixpkgs_revision }}.tar.gz
      - name: Install glibc-linked Zig
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
          ZIG_NIX_ATTRIBUTE: ${{ steps.toolchain.outputs.zig_nix_attribute }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A "$ZIG_NIX_ATTRIBUTE" --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"
      - name: Prepare compiler cache directories
        run: mkdir -p "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR"
      - name: Prepare verified Zig source dependencies
        uses: ./.github/actions/prepare-zig-dependencies
      - name: Build native test artifacts
        working-directory: zig
        run: >-
          python3 tools/run_bounded_zig_build.py --zig zig --
          build --build-file ./build.zig libantfly antfly
          -Doptimize=ReleaseFast -Dstrip=true -Dcpu=baseline
          -Dmetal=false -Dcuda=false -j2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-native
          path: zig/zig-out
          retention-days: 1
      - name: Remove native compiler cache
        if: always()
        run: rm -rf -- "$ZIG_LOCAL_CACHE_DIR"
  compatibility:
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["supported","latest","beta"]' || '["supported"]') }}
    continue-on-error: ${{ matrix.version != 'supported' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: auth-native
          path: zig/zig-out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ts/package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: ts/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: ts
      - name: Install compatibility candidate
        if: matrix.version != 'supported'
        working-directory: ts
        env:
          AUTH_VERSION: ${{ matrix.version }}
        run: |
          pnpm --filter @antfly/better-auth add -D "better-auth@$AUTH_VERSION" "@better-auth/test-utils@$AUTH_VERSION"
          pnpm --filter @antfly/better-auth add "@better-auth/core@$AUTH_VERSION"
      - name: Build and test
        working-directory: ts
        env:
          ANTFLY_LIBRARY: ${{ github.workspace }}/zig/zig-out/lib/libantfly.so
        run: |
          pnpm --filter @antfly/embedded --filter @antfly/sdk --filter @antfly/better-auth build
          pnpm --filter @antfly/better-auth typecheck
          pnpm --filter @antfly/sdk exec vitest run test/sql.test.ts
          pnpm --filter @antfly/better-auth test
          pnpm --filter @antfly/better-auth test:integration
      - name: Test installed npm packages outside the workspace
        if: matrix.version == 'supported'
        env:
          ANTFLY_LIBRARY: ${{ github.workspace }}/zig/zig-out/lib/libantfly.so
        run: node ts/packages/better-auth/test/package-consumer.mjs
      - name: Test remote transport
        env:
          ANTFLY_AUTH_TEST_BINARY: ${{ github.workspace }}/zig/zig-out/bin/antfly
        run: |
          chmod +x zig/zig-out/bin/antfly
          pnpm --dir ts --filter @antfly/better-auth test:remote
      - name: Test persistent container recipe
        if: matrix.version == 'supported'
        run: |
          mkdir -p ts/packages/embedded-linux-x64/lib
          cp zig/zig-out/lib/libantfly.so ts/packages/embedded-linux-x64/lib/
          docker build -f ts/examples/express-auth/Dockerfile -t antfly-auth-example .
          docker run -d --name antfly-auth-example -p 13029:3000 -v auth-example-data:/data \
            -e BETTER_AUTH_SECRET="ci-only-secret-at-least-thirty-two-characters" \
            -e APP_ORIGIN=http://localhost:13029 antfly-auth-example
          trap 'docker logs antfly-auth-example; docker rm -f antfly-auth-example; docker volume rm auth-example-data' EXIT
          for ((attempt=0; attempt<60; attempt++)); do
            if curl --fail --silent http://localhost:13029/ > /dev/null; then break; fi
            sleep 1
          done
          AUTH_APP_URL=http://localhost:13029 node ts/packages/better-auth/test/http-smoke.mjs
