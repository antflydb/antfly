name: Publish Apache Embedded Packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing immutable Antfly release tag (v-prefixed)"
        required: true
        type: string
      build_run_id:
        description: "Successful release-controller run containing the embedded package snapshot"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Verify immutable embedded release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      python_version: ${{ steps.identity.outputs.python_version }}
      npm_tag: ${{ steps.identity.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}

      - name: Authenticate the release artifact producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/embedded-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/antfly-release-build-controller.yml" > "$RUNNER_TEMP/embedded-build-workflow.json"
          python scripts/release/verify_embedded_publish_inputs.py producer \
            --run-json "$RUNNER_TEMP/embedded-build-run.json" \
            --workflow-json "$RUNNER_TEMP/embedded-build-workflow.json" \
            --repository "$GITHUB_REPOSITORY" --default-branch main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: antfly-release-request
          path: dist/release-request
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable controller and release-source identity
        id: identity
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          python scripts/release/verify_embedded_publish_inputs.py identity \
            --run-json "$RUNNER_TEMP/embedded-build-run.json" \
            --workflow-json "$RUNNER_TEMP/embedded-build-workflow.json" \
            --repository "$GITHUB_REPOSITORY" --default-branch main \
            --request dist/release-request/release-request.json \
            --tag "$TAG_NAME" --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: antfly-embedded-package-snapshot
          path: dist/lite-snapshot
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hashes, product license, and archive equivalence
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "${{ steps.identity.outputs.commit }}"
          python scripts/packaging/verify_lite_release.py \
            --version "${{ steps.identity.outputs.version }}" \
            --archive-dir dist/release-archives \
            --wheel-dir dist/lite-snapshot \
            --npm-dir dist/lite-snapshot

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot/
          if-no-files-found: error

  publish-pypi:
    name: Publish antfly-embedded wheels to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-embedded
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot
      - name: Select exact Python wheels
        id: pypi
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.commit }}"
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-embedded \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --out-dir dist/pypi
      - name: Publish wheels
        if: ${{ steps.pypi.outputs.has_packages == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi
      - name: Verify exact PyPI release
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-embedded \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --verify-complete --attempts 30 --retry-seconds 10

  publish-npm:
    name: Publish @antfly/embedded packages to npm
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned npm toolchain
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/
      - name: Install exact npm trusted-publishing client
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm_version }}
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Publish platform packages, then selector
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: |
          set -euo pipefail
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot --version "$VERSION" \
            --commit "${{ needs.prepare.outputs.commit }}"
          for name in embedded-darwin-arm64 embedded-linux-arm64 embedded-linux-x64 embedded; do
            sh scripts/packaging/publish_npm_package.sh "@antfly/$name" \
              "$VERSION" "$NPM_TAG" "dist/lite-snapshot/antfly-${name}-${VERSION}.tgz"
          done
