name: Publish Apache Embedded Packages

on:
  workflow_run:
    workflows: ["Release build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing immutable Antfly release tag (v-prefixed)"
        required: true
        type: string
      build_run_id:
        description: "Successful release-controller run containing the embedded package snapshot"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Verify immutable embedded release inputs
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build_contract_schema: ${{ steps.identity.outputs.build_contract_schema }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      python_version: ${{ steps.identity.outputs.python_version }}
      npm_tag: ${{ steps.identity.outputs.npm_tag }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
      build_run_id: ${{ steps.producer.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}

      - uses: ./.github/actions/setup-github-cli

      - name: Authenticate the release artifact producer
        id: producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/embedded-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/antfly-release-build-controller.yml" > "$RUNNER_TEMP/embedded-build-workflow.json"
          python scripts/release/verify_embedded_publish_inputs.py producer \
            --run-json "$RUNNER_TEMP/embedded-build-run.json" \
            --workflow-json "$RUNNER_TEMP/embedded-build-workflow.json" \
            --repository "$GITHUB_REPOSITORY" --default-branch main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfly-release-request
          path: dist/release-request
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable controller and release-source identity
        id: identity
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          # Nightlies still build artifacts but do not publish package versions.
          if [ "$(jq -r .channel dist/release-request/release-request.json)" = nightly ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_args=()
          if [ -n "$TAG_NAME" ]; then tag_args=(--tag "$TAG_NAME"); fi
          python scripts/release/verify_embedded_publish_inputs.py identity \
            --run-json "$RUNNER_TEMP/embedded-build-run.json" \
            --workflow-json "$RUNNER_TEMP/embedded-build-workflow.json" \
            --repository "$GITHUB_REPOSITORY" --default-branch main \
            --request dist/release-request/release-request.json \
            "${tag_args[@]}" --github-output "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ github.event_name == 'workflow_dispatch' && steps.identity.outputs.publish == 'true' }}
        with:
          name: antfly-embedded-package-snapshot
          path: dist/lite-snapshot
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ github.event_name == 'workflow_dispatch' && steps.identity.outputs.publish == 'true' }}
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hashes, product license, and archive equivalence
        if: ${{ github.event_name == 'workflow_dispatch' && steps.identity.outputs.publish == 'true' }}
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "${{ steps.identity.outputs.commit }}"
          python scripts/packaging/verify_lite_release.py \
            --version "${{ steps.identity.outputs.version }}" \
            --build-contract-schema "${{ steps.identity.outputs.build_contract_schema }}" \
            --archive-dir dist/release-archives \
            --wheel-dir dist/lite-snapshot \
            --npm-dir dist/lite-snapshot
          python scripts/release/embedded_registry_preflight.py \
            --snapshot dist/lite-snapshot \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "${{ steps.identity.outputs.commit }}" \
            --npm-tag "${{ steps.identity.outputs.npm_tag }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'workflow_dispatch' && steps.identity.outputs.publish == 'true' }}
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot/
          if-no-files-found: error

  dispatch-publication:
    name: Dispatch validated embedded publication
    needs: prepare
    # crates.io rejects OIDC tokens issued to workflow_run jobs. Handoff to a
    # fresh main-branch workflow_dispatch after authenticating the build source.
    if: ${{ github.event_name == 'workflow_run' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-github-cli
      - name: Dispatch publisher on main with immutable inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh workflow run embedded-release-publish.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f "tag_name=$RELEASE_TAG" -f "build_run_id=$BUILD_RUN_ID"

  prepare-cargo:
    name: Build and preflight immutable embedded crates
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.packages.outputs.has_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
      - uses: ./.github/actions/setup-github-cli
      - name: Verify protected crates.io environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release/github_environment.py check \
            --repository "$GITHUB_REPOSITORY" --environment crates-io
      - name: Package source-bound crates and preflight registry identities
        id: packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python scripts/release/embedded_cargo.py build \
            --version "$VERSION" --commit "$SOURCE_COMMIT" \
            --stage "$GITHUB_WORKSPACE/dist/cargo-source" \
            --target "$GITHUB_WORKSPACE/rs/target" --snapshot dist/cargo-snapshot
          python scripts/release/embedded_cargo.py preflight \
            --version "$VERSION" --commit "$SOURCE_COMMIT" --snapshot dist/cargo-snapshot \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-antfly-embedded-cargo-snapshot
          path: dist/cargo-snapshot/
          if-no-files-found: error

  publish-cargo:
    name: Publish embedded crates to crates.io
    needs: [prepare, prepare-cargo]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true' && needs.prepare-cargo.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-antfly-embedded-cargo-snapshot
          path: dist/cargo-snapshot
      - name: Obtain short-lived crates.io credentials
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish sealed sys crate before safe bindings
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python scripts/release/embedded_cargo.py publish \
            --version "$VERSION" --commit "$SOURCE_COMMIT" --snapshot dist/cargo-snapshot

  publish-pypi:
    name: Publish antfly-embedded wheels to PyPI
    needs: [prepare, prepare-cargo]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-embedded
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot
      - name: Select exact Python wheels
        id: pypi
        run: |
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.commit }}"
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-embedded \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --out-dir dist/pypi
      - name: Publish wheels
        if: ${{ steps.pypi.outputs.has_packages == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/pypi
      - name: Verify exact PyPI release
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-embedded \
            --snapshot-dir dist/lite-snapshot \
            --expected-version "${{ needs.prepare.outputs.python_version }}" \
            --verify-complete --attempts 30 --retry-seconds 10

  publish-npm:
    name: Publish @antfly/embedded packages to npm
    needs: [prepare, prepare-cargo]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true' }}
    concurrency:
      group: embedded-npm-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load pinned npm toolchain
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-antfly-embedded-snapshot
          path: dist/lite-snapshot
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/
      - name: Install exact npm trusted-publishing client
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm_version }}
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Publish platform packages, then selector
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: |
          set -euo pipefail
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/lite-snapshot --version "$VERSION" \
            --commit "${{ needs.prepare.outputs.commit }}"
          # Recheck under the publication lock so an older build completing late
          # cannot move next/latest behind a newer embedded release.
          python scripts/release/embedded_registry_preflight.py \
            --snapshot dist/lite-snapshot --version "$VERSION" \
            --commit "${{ needs.prepare.outputs.commit }}" --npm-tag "$NPM_TAG"
          for name in embedded-darwin-arm64 embedded-linux-arm64 embedded-linux-x64 embedded; do
            sh scripts/packaging/publish_npm_package.sh "@antfly/$name" \
              "$VERSION" "$NPM_TAG" "dist/lite-snapshot/antfly-${name}-${VERSION}.tgz"
          done
