name: Apache license boundary

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    name: Apache license boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository licenses and Apache dependency boundary
        run: |
          python3 scripts/license_headers.py --check
          python3 scripts/check_apache_boundary.py
          python3 -m unittest discover -s scripts -p test_check_apache_boundary.py
          python3 -m unittest discover -s scripts -p test_license_headers.py
          python3 -m unittest discover -s scripts -p test_qualification_provenance.py
          python3 -m unittest discover -s scripts -p test_asset_licenses.py
          python3 -m unittest discover -s scripts/ci -p test_check_contributor_signoffs.py
      - name: Check contributor sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/check_contributor_signoffs.py --base "$BASE_SHA"

  source-build:
    name: Apache-only source build
    # The build executes PR code on an ARC runner. Forks receive the static
    # required boundary check, while staged builds run on trusted branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils python3
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false
      - name: Build from Apache-only source tree
        run: python3 scripts/ci/apache_source_build.py
