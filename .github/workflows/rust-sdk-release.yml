name: Publish Rust SDK

# Dispatch on main after pushing rs/antfly/sdk/vX.Y.Z. Publication credentials
# never reach Cargo or build.rs; the publisher uploads the sealed crate bytes.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing rs/antfly/sdk/vX.Y.Z release tag
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rust-sdk-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      has_packages: ${{ steps.preflight.outputs.has_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/load-toolchain-policy
        id: toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
      - name: Validate SDK tag, package version, and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: python scripts/release/rust_sdk_release.py resolve --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Build and seal source-bound SDK crate
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          mkdir -p .worktrees
          python scripts/release/rust_sdk_release.py build \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --stage .worktrees/rust-sdk-release --snapshot dist/sdk-snapshot
      - name: Preflight immutable registry identity
        id: preflight
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          python scripts/release/rust_sdk_release.py preflight \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --snapshot dist/sdk-snapshot --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-sdk-snapshot
          path: dist/sdk-snapshot/
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/load-toolchain-policy
        id: toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-sdk-snapshot
          path: dist/sdk-snapshot
      - name: Verify sealed SDK before authentication
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python scripts/release/rust_sdk_release.py verify \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --snapshot dist/sdk-snapshot
      - name: Obtain short-lived crates.io credentials
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish sealed Rust SDK
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python scripts/release/rust_sdk_release.py publish \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --snapshot dist/sdk-snapshot
