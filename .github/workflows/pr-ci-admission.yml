name: PR CI admission
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      check_id:
        type: string
        default: ''
      comment_id:
        type: string
        default: ''
      suite:
        type: string
        required: true
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_ID: ${{ inputs.check_id }}
          COMMENT_ID: ${{ inputs.comment_id }}
          SUITE: ${{ inputs.suite }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        with:
          script: |
            if (!process.env.PR_NUMBER) {
              if (!['push', 'schedule', 'merge_group', 'workflow_dispatch'].includes(context.eventName))
                throw new Error('Unapproved CI event');
              if (context.eventName === 'workflow_dispatch' &&
                  context.ref !== `refs/heads/${context.payload.repository.default_branch}`)
                throw new Error('Manual runs use the default branch; approve PRs with /ci run <sha>');
              return;
            }
            const {main} = require('./.github/scripts/pr-ci.cjs');
            await main({github, context, core, mode: 'verify',
              config: require('./.github/scripts/pr-ci-config.json')});
