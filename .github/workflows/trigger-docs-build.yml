name: Trigger Colony Docs Build

on:
  push:
    branches: [main]
    paths:
      - 'openapi.yaml'
      - 'CHANGELOG.md'
      - 'examples/**'
      - 'docs/**'
      - 'go/pkg/operator/docs/**'
      - 'specs/openapi/**'
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger colony rebuild
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.COLONY_DISPATCH_TOKEN }}
          repository: antflydb/colony
          event-type: antfly-docs-updated
          client-payload: '{"ref":"${{ github.ref_name }}","sha":"${{ github.sha }}","event":"${{ github.event_name }}"}'
