name: SDK CI

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      check_id:
        type: string
        default: ''
      comment_id:
        type: string
        default: ''
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: sdks-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admission:
    uses: ./.github/workflows/pr-ci-admission.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      check_id: ${{ inputs.check_id }}
      comment_id: ${{ inputs.comment_id }}
      suite: sdks

  sdks:
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) }}
    needs: admission
    name: sdks-ci
    # Multi-language build caches exceed the runtime runner’s 10 GiB overlay.
    runs-on: arc-antfly-heavy
    timeout-minutes: 60
    env:
      SDK_CI_WORK_DIR: /mnt/cache/antfly/sdk/${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      antfarm_e2e: ${{ steps.scopes.outputs.antfarm_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare SDK build caches
        run: |
          mkdir -p "$SDK_CI_WORK_DIR"/{tmp,cargo-phases,cargo-target,cargo-home,rustup,go-build,go-mod,gopath,uv-cache,python,pnpm-store,xdg}
          {
            echo "TMPDIR=$SDK_CI_WORK_DIR/tmp"
            echo "ANTFLY_CARGO_TARGET_PARENT=$SDK_CI_WORK_DIR/cargo-phases"
            echo "CARGO_TARGET_DIR=$SDK_CI_WORK_DIR/cargo-target"
            echo "CARGO_HOME=$SDK_CI_WORK_DIR/cargo-home"
            echo "RUSTUP_HOME=$SDK_CI_WORK_DIR/rustup"
            echo "GOCACHE=$SDK_CI_WORK_DIR/go-build"
            echo "GOMODCACHE=$SDK_CI_WORK_DIR/go-mod"
            echo "GOPATH=$SDK_CI_WORK_DIR/gopath"
            echo "UV_CACHE_DIR=$SDK_CI_WORK_DIR/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$SDK_CI_WORK_DIR/python"
            echo "PNPM_STORE_PATH=$SDK_CI_WORK_DIR/pnpm-store"
            echo "XDG_CACHE_HOME=$SDK_CI_WORK_DIR/xdg"
          } >> "$GITHUB_ENV"

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - name: Classify validation scopes
        id: scopes
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "${{ inputs.pr_number != '' && 'pull_request' || github.event_name }}" == "workflow_dispatch" ]]; then
            python3 scripts/ci/classify_validation.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/classify_validation.py \
              --base "$BASE_SHA" \
              --head "${{ inputs.head_sha || github.sha }}" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Test validation scope classification
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Set up Python
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true' || steps.scopes.outputs.release == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}

      - name: Validate repository toolchain policy
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true' || steps.scopes.outputs.release == 'true'
        run: python scripts/ci/check_toolchain_policy.py

      - name: Install uv
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Node.js
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.typescript == 'true' || steps.scopes.outputs.format_typescript == 'true' || steps.scopes.outputs.release == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json

      - name: Install pnpm
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.typescript == 'true' || steps.scopes.outputs.format_typescript == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - name: Set up Go
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.memory == 'true' || steps.scopes.outputs.sources == 'true' || steps.scopes.outputs.format_go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: true
          cache-dependency-path: |
            go/pkg/sdk/go.sum
            go/pkg/sources/go.sum

      - name: Set up Rust
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.rust_version }}
          components: rustfmt

      # setup-zig extracts an .xz archive, so xz-utils must exist before that
      # action runs on a clean ARC image. The SDK also needs native build tools
      # for Go's race detector and Rust dependencies. Release packaging executes
      # the Homebrew formula's C ABI smoke program even without SDK changes.
      - name: Install native test dependencies
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.memory == 'true' || steps.scopes.outputs.format_zig == 'true' || steps.scopes.outputs.release == 'true'
        env:
          NEED_BUILD_TOOLS: ${{ steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.memory == 'true' || steps.scopes.outputs.release == 'true' }}
        run: |
          sudo_cmd=""
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi
          packages=(xz-utils)
          if [[ "$NEED_BUILD_TOOLS" == "true" ]]; then
            packages+=(build-essential cmake pkg-config file)
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install --yes --no-install-recommends "${packages[@]}"

      # Release fixtures compile cross-target providers. Match Zig CI's pinned
      # glibc-linked compiler instead of cold-starting the static download here.
      - name: Install Nix for release tooling
        if: steps.scopes.outputs.release == 'true'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ steps.toolchain.outputs.zig_nixpkgs_revision }}.tar.gz

      - name: Install glibc-linked Zig for release tooling
        if: steps.scopes.outputs.release == 'true'
        env:
          ZIG_VERSION: ${{ steps.toolchain.outputs.zig_version }}
          ZIG_NIX_ATTRIBUTE: ${{ steps.toolchain.outputs.zig_nix_attribute }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A "$ZIG_NIX_ATTRIBUTE" --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"

      - name: Set up Zig for formatting
        if: steps.scopes.outputs.format_zig == 'true' && steps.scopes.outputs.release != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Install Python tooling
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true'
        run: |
          uv python install ${{ steps.toolchain.outputs.python_supported }}
          uv sync \
            --project py/packages/sdk \
            --python "${{ steps.toolchain.outputs.python_build }}" \
            --locked

      - name: Install TypeScript tooling
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.typescript == 'true' || steps.scopes.outputs.format_typescript == 'true'
        working-directory: ts
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_PATH"

      - name: Check Zig formatting
        if: steps.scopes.outputs.format_zig == 'true'
        run: scripts/ci/check.sh format zig

      - name: Check Go formatting
        if: steps.scopes.outputs.format_go == 'true'
        run: scripts/ci/check.sh format go

      - name: Check Python formatting
        if: steps.scopes.outputs.format_python == 'true'
        run: scripts/ci/check.sh format python

      - name: Check TypeScript formatting
        if: steps.scopes.outputs.format_typescript == 'true'
        run: scripts/ci/check.sh format typescript

      - name: Check Rust formatting
        if: steps.scopes.outputs.format_rust == 'true'
        run: scripts/ci/check.sh format rust

      - name: Check SDKs
        if: steps.scopes.outputs.sdk == 'true'
        run: scripts/ci/check.sh sdk

      - name: Check TypeScript SDK consumers
        if: steps.scopes.outputs.typescript == 'true' && steps.scopes.outputs.sdk != 'true'
        run: scripts/ci/check.sh typescript

      - name: Check portable source ingestion
        if: steps.scopes.outputs.sources == 'true'
        run: scripts/ci/check.sh sources

      - name: Check memory
        if: steps.scopes.outputs.memory == 'true' && steps.scopes.outputs.sdk != 'true'
        run: scripts/ci/check.sh memory

      - name: Check release packaging and scripts
        if: steps.scopes.outputs.release == 'true'
        run: scripts/ci/check.sh release

      - name: Upload canonical Antfarm bundle
        # Preserve the Linux build when the checked-in bundle is stale, so it
        # can be inspected and updated without reproducing CI on another OS.
        if: always() && steps.scopes.outputs.antfarm_e2e == 'true' && hashFiles('ts/apps/antfarm/dist/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfarm-linux-node-${{ inputs.head_sha || github.sha }}
          path: ts/apps/antfarm/dist
          if-no-files-found: error
          retention-days: 7

      - name: Retire SDK compiler scratch
        if: always()
        run: |
          # Keep reusable dependency caches until Actions finishes its post
          # steps. The runner's ephemeral PVC owns their final lifetime.
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          rm -rf -- "$SDK_CI_WORK_DIR/tmp" "$SDK_CI_WORK_DIR/cargo-phases" "$SDK_CI_WORK_DIR/cargo-target"

  playwright:
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) &&
      (needs.sdks.outputs.antfarm_e2e == 'true') }}
    name: Antfarm Playwright
    needs: [admission, sdks]
    timeout-minutes: 60
    runs-on: arc-antfly-heavy-runtime
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Configure cache directories
        run: |
          pnpm_store_path="${RUNNER_TEMP}/pnpm-store"
          playwright_browsers_path="${RUNNER_TEMP}/playwright-browsers"
          xdg_cache_home="${RUNNER_TEMP}/xdg"
          tmpdir="${RUNNER_TEMP}/tmp"

          {
            echo "PNPM_STORE_PATH=${pnpm_store_path}"
            echo "PLAYWRIGHT_BROWSERS_PATH=${playwright_browsers_path}"
            echo "XDG_CACHE_HOME=${xdg_cache_home}"
            echo "TMPDIR=${tmpdir}"
          } >> "$GITHUB_ENV"

          mkdir -p "$pnpm_store_path" "$playwright_browsers_path" "$xdg_cache_home" "$tmpdir"
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Sample ARC runner disk use
        uses: ./.github/actions/runner-disk-audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - name: Configure pnpm cache
        run: pnpm config set store-dir "$PNPM_STORE_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical Antfarm bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antfarm-linux-node-${{ inputs.head_sha || github.sha }}
          path: ts/apps/antfarm/dist

      - name: Install Playwright OS Dependencies
        working-directory: ts/apps/antfarm
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          time pnpm exec playwright install-deps chromium

      # ARC hangs extracting Playwright-managed browser archives, so use apt-installed Chrome.
      - name: Install Google Chrome
        working-directory: .
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          chrome_deb="${RUNNER_TEMP}/google-chrome-stable_current_amd64.deb"
          curl -fsSL -o "$chrome_deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y "$chrome_deb"
          google-chrome --version

      - name: Preview server
        working-directory: ts/apps/antfarm
        run: pnpm preview &

      - name: Wait for Server
        working-directory: ts/apps/antfarm
        run: pnpm exec wait-on http://localhost:4173

      - name: Run Playwright tests
        working-directory: ts/apps/antfarm
        run: pnpm exec playwright test --project=chromium --reporter=list
        env:
          ANTFARM_PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
          BASE_URL: http://localhost:4173

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ts/apps/antfarm/playwright-report/
          retention-days: 30
