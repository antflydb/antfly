name: CUDA Gemma 4 L4 Evidence

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_call:
    inputs:
      gate:
        required: false
        default: release
        type: string
      e2b_model:
        required: false
        type: string
      gemma12b_q4_model:
        required: false
        type: string
      llama_cpp_bin:
        required: false
        type: string
      mtp_draft_model:
        required: false
        type: string
      long_e2e_lock_sha256:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      gate:
        description: "Collect current evidence or enforce the release performance contract"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release
      e2b_model:
        description: "Absolute path to the Gemma 4 E2B QAT GGUF on the runner (optional)"
        required: false
        type: string
      gemma12b_q4_model:
        description: "Absolute path to the Gemma 4 12B Q4_K_M GGUF on the runner (optional)"
        required: false
        type: string
      llama_cpp_bin:
        description: "Absolute path to llama.cpp llama-completion on the runner (optional)"
        required: false
        type: string
      mtp_draft_model:
        description: "Absolute path to the optional Gemma 4 E2B MTP draft GGUF on the runner"
        required: false
        type: string
      long_e2e_lock_sha256:
        description: "Reviewed SHA-256 for the pinned E2B warm-server benchmark lock"
        required: false
        type: string

permissions:
  contents: read

# An L4 is an exclusive performance resource. Queue evidence runs rather than
# letting separate scheduled/manual runs perturb each other's measurements.
concurrency:
  group: cuda-gemma4-l4-evidence
  cancel-in-progress: false

jobs:
  configure:
    name: Validate L4 runner configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.runner-labels.outputs.enabled }}
    env:
      CUDA_RELEASE_MODE: ${{ inputs.gate || 'nightly' }}
      RUNNER_LABELS_JSON: ${{ vars.ANTFLY_CUDA_L4_RUNNER_LABELS_JSON }}
    steps:
      - name: Validate dedicated L4 runner labels
        id: runner-labels
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RUNNER_LABELS_JSON" ]]; then
            if [[ "$CUDA_RELEASE_MODE" == "release" ]]; then
              echo "ANTFLY_CUDA_L4_RUNNER_LABELS_JSON must be configured for release gates." >&2
              exit 1
            fi
            echo "No L4 runner labels are configured; skipping nightly CUDA evidence."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os

          labels = json.loads(os.environ["RUNNER_LABELS_JSON"])
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              raise SystemExit("ANTFLY_CUDA_L4_RUNNER_LABELS_JSON must be a non-empty JSON string array")

          generic = {"self-hosted", "linux", "windows", "macos", "x64", "arm64"}
          if "self-hosted" not in labels or not any(label not in generic for label in labels):
              raise SystemExit(
                  "ANTFLY_CUDA_L4_RUNNER_LABELS_JSON must include self-hosted and a dedicated L4 runner label"
              )
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  l4-evidence:
    name: Gemma 4 CUDA evidence (L4 / SM89)
    needs: configure
    if: ${{ needs.configure.outputs.enabled == 'true' }}
    # Configure ANTFLY_CUDA_L4_RUNNER_LABELS_JSON as a repository variable with
    # the labels assigned to the L4 runner, for example
    # ["self-hosted","linux","x64","gpu-l4"]. The configure job skips
    # unconfigured nightly runs and fails closed for release gates. The hosted
    # fallback is parsed only for a skipped job and can never claim a
    # self-hosted runner.
    runs-on: ${{ fromJSON(vars.ANTFLY_CUDA_L4_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 240
    env:
      CUDA_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/cuda-gemma4-l4
      CUDA_VISIBLE_DEVICES: ${{ vars.ANTFLY_CUDA_VISIBLE_DEVICES || '0' }}
      CUDA_RELEASE_MODE: ${{ inputs.gate || 'nightly' }}
      E2B_MODEL: ${{ inputs.e2b_model || vars.ANTFLY_CUDA_E2B_MODEL || '' }}
      GEMMA12B_Q4_MODEL: ${{ inputs.gemma12b_q4_model || vars.ANTFLY_CUDA_GEMMA12B_Q4_MODEL || '' }}
      LLAMA_CPP_BIN: ${{ inputs.llama_cpp_bin || vars.ANTFLY_CUDA_LLAMA_CPP_BIN || '/tmp/llama.cpp/build/bin/llama-completion' }}
      MTP_DRAFT_MODEL: ${{ inputs.mtp_draft_model || vars.ANTFLY_CUDA_MTP_DRAFT_MODEL || '' }}
      LLAMA_SERVER_BIN: ${{ vars.ANTFLY_CUDA_LLAMA_SERVER_BIN || '' }}
      LONG_E2E_LOCK: ${{ vars.ANTFLY_CUDA_LONG_E2E_LOCK || '' }}
      LONG_E2E_LOCK_SHA256: ${{ inputs.long_e2e_lock_sha256 || vars.ANTFLY_CUDA_LONG_E2E_LOCK_SHA256 || '' }}
      E4B_QAT_MODEL: ${{ vars.ANTFLY_CUDA_E4B_QAT_MODEL || '' }}
      E4B_MODELS_DIR: ${{ vars.ANTFLY_CUDA_E4B_MODELS_DIR || '' }}
      E4B_BASELINE_EVIDENCE: ${{ vars.ANTFLY_CUDA_E4B_BASELINE_EVIDENCE || '' }}
      E4B_BASELINE_SHA256: ${{ vars.ANTFLY_CUDA_E4B_BASELINE_SHA256 || '' }}
      E4B_REGRESSION_LOCK: ${{ vars.ANTFLY_CUDA_E4B_REGRESSION_LOCK || '' }}
      E4B_REGRESSION_LOCK_SHA256: ${{ vars.ANTFLY_CUDA_E4B_REGRESSION_LOCK_SHA256 || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare CUDA evidence inputs
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/antfly-zig-local"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/antfly-zig-global"
          {
            echo "ZIG_LOCAL_CACHE_DIR=$ZIG_LOCAL_CACHE_DIR"
            echo "ZIG_GLOBAL_CACHE_DIR=$ZIG_GLOBAL_CACHE_DIR"
          } >> "$GITHUB_ENV"
          mkdir -p "$CUDA_EVIDENCE_DIR" "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR"

          if [[ -z "$E2B_MODEL" ]]; then
            E2B_MODEL="$GITHUB_WORKSPACE/.models/unsloth/gemma-4-E2B-it-qat-GGUF/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf"
          fi
          if [[ -z "$GEMMA12B_Q4_MODEL" ]]; then
            GEMMA12B_Q4_MODEL="$GITHUB_WORKSPACE/.models/google/gemma-4-12B-it-q4_k/gemma-4-12B-it-Q4_K_M.gguf"
          fi
          if [[ -z "$MTP_DRAFT_MODEL" ]]; then
            MTP_DRAFT_MODEL="$GITHUB_WORKSPACE/.models/unsloth/gemma-4-E2B-it-qat-GGUF/MTP/gemma-4-E2B-it-Q8_0-MTP.gguf"
          fi

          long_e2e_values=("$LLAMA_SERVER_BIN" "$LONG_E2E_LOCK" "$LONG_E2E_LOCK_SHA256")
          long_e2e_configured=0
          for value in "${long_e2e_values[@]}"; do
            [[ -n "$value" ]] && long_e2e_configured=$((long_e2e_configured + 1))
          done
          if [[ "$long_e2e_configured" -ne 0 ]]; then
            if [[ "$long_e2e_configured" -ne 3 ]]; then
              echo "LLAMA_SERVER_BIN, LONG_E2E_LOCK, and LONG_E2E_LOCK_SHA256 must be configured together." >&2
              exit 1
            fi
            if [[ ! "$LONG_E2E_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "LONG_E2E_LOCK_SHA256 must be a lowercase 64-character SHA-256 digest." >&2
              exit 1
            fi
          fi
          if [[ "$long_e2e_configured" -eq 0 ]]; then
            if [[ "$CUDA_RELEASE_MODE" == "release" ]]; then
              echo "Release mode requires LLAMA_SERVER_BIN, LONG_E2E_LOCK, and LONG_E2E_LOCK_SHA256." >&2
              exit 1
            fi
            echo "long_e2e_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "long_e2e_enabled=true" >> "$GITHUB_OUTPUT"
          fi

          e4b_regression_values=(
            "$E4B_BASELINE_EVIDENCE"
            "$E4B_BASELINE_SHA256"
            "$E4B_REGRESSION_LOCK"
            "$E4B_REGRESSION_LOCK_SHA256"
          )
          e4b_regression_configured=0
          for value in "${e4b_regression_values[@]}"; do
            [[ -n "$value" ]] && e4b_regression_configured=$((e4b_regression_configured + 1))
          done
          if [[ "$e4b_regression_configured" -ne 0 && "$e4b_regression_configured" -ne 4 ]]; then
            echo "E4B_BASELINE_EVIDENCE, E4B_BASELINE_SHA256, E4B_REGRESSION_LOCK, and E4B_REGRESSION_LOCK_SHA256 must be configured together." >&2
            exit 1
          fi
          if [[ "$e4b_regression_configured" -eq 4 && -z "$E4B_QAT_MODEL" ]]; then
            echo "E4B_QAT_MODEL is required when E4B regression evidence is configured." >&2
            exit 1
          fi
          if [[ "$e4b_regression_configured" -eq 4 ]]; then
            if [[ ! "$E4B_BASELINE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "E4B_BASELINE_SHA256 must be a lowercase 64-character SHA-256 digest." >&2
              exit 1
            fi
            if [[ ! "$E4B_REGRESSION_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "E4B_REGRESSION_LOCK_SHA256 must be a lowercase 64-character SHA-256 digest." >&2
              exit 1
            fi
          fi
          if [[ "$CUDA_RELEASE_MODE" == "release" && ( -z "$E4B_QAT_MODEL" || "$e4b_regression_configured" -ne 4 ) ]]; then
            echo "Release mode requires E4B_QAT_MODEL and reviewed frozen E4B regression evidence." >&2
            exit 1
          fi
          if [[ -n "$E4B_QAT_MODEL" ]]; then
            echo "e4b_regression_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "e4b_regression_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          E2B_MODELS_DIR="$(dirname "$(dirname "$E2B_MODEL")")"
          if [[ -n "$E4B_QAT_MODEL" && -z "$E4B_MODELS_DIR" ]]; then
            E4B_MODELS_DIR="$(dirname "$(dirname "$E4B_QAT_MODEL")")"
          fi

          for item in \
            "E2B_MODEL:$E2B_MODEL" \
            "GEMMA12B_Q4_MODEL:$GEMMA12B_Q4_MODEL" \
            "LLAMA_CPP_BIN:$LLAMA_CPP_BIN"; do
            name="${item%%:*}"
            path="${item#*:}"
            if [[ ! -f "$path" ]]; then
              echo "missing $name: $path" >&2
              echo "Configure the matching workflow input or repository variable." >&2
              exit 1
            fi
          done
          if [[ "$long_e2e_configured" -eq 3 ]]; then
            for item in "LLAMA_SERVER_BIN:$LLAMA_SERVER_BIN" "LONG_E2E_LOCK:$LONG_E2E_LOCK"; do
              name="${item%%:*}"
              path="${item#*:}"
              if [[ ! -f "$path" ]]; then
                echo "missing $name: $path" >&2
                exit 1
              fi
            done
          fi
          if [[ -n "$E4B_QAT_MODEL" && ! -f "$E4B_QAT_MODEL" ]]; then
            echo "missing E4B_QAT_MODEL: $E4B_QAT_MODEL" >&2
            exit 1
          fi
          if [[ "$e4b_regression_configured" -eq 4 ]]; then
            for item in \
              "E4B_BASELINE_EVIDENCE:$E4B_BASELINE_EVIDENCE" \
              "E4B_REGRESSION_LOCK:$E4B_REGRESSION_LOCK"; do
              name="${item%%:*}"
              path="${item#*:}"
              if [[ ! -f "$path" ]]; then
                echo "missing $name: $path" >&2
                exit 1
              fi
            done
          fi
          command -v nvidia-smi
          command -v nvcc
          command -v python3
          nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv,noheader
          nvcc --version
          zig version

          {
            echo "E2B_MODEL=$E2B_MODEL"
            echo "E2B_MODELS_DIR=$E2B_MODELS_DIR"
            echo "GEMMA12B_Q4_MODEL=$GEMMA12B_Q4_MODEL"
            echo "MTP_DRAFT_MODEL=$MTP_DRAFT_MODEL"
            echo "E4B_MODELS_DIR=$E4B_MODELS_DIR"
            if [[ "$e4b_regression_configured" -eq 4 ]]; then
              echo "GEMMA4_E4B_REGRESSION_ENFORCED=true"
            else
              echo "GEMMA4_E4B_REGRESSION_ENFORCED=false"
            fi
          } >> "$GITHUB_ENV"

      - name: Check generated CUDA sources
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          zig build quant-kernel-codegen \
            -Dcuda=true -Dmetal=false -Dcuda-artifacts=sm89 \
            -Doptimize=ReleaseFast -- --check

      - name: Check CUDA artifacts
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          bash scripts/regen-cuda-artifacts.sh --check --all

      - name: Build ReleaseFast CUDA inference
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          zig build -Dcuda=true -Dmetal=false -Dcuda-artifacts=sm89 \
            -Doptimize=ReleaseFast -j4

      - name: Run CUDA smoke test
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          zig-out/bin/antfly-inference cuda-info --smoke

      - name: Verify exact F32 E2B FFN raw parity
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          zig build quant-kernel-cuda-ffn-diff \
            -Dcuda=true -Dmetal=false -Dcuda-artifacts=sm89 \
            -Doptimize=ReleaseFast -- --json

      - name: Screen score-prework on fixed long context
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          python3 scripts/validate_gemma4_cuda_candidate.py \
            --kernel-id cuda.attention.gqa.decode.score_prework \
            --qualification-profile screening \
            --binary "$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference" \
            --artifact-check-script scripts/regen-cuda-artifacts.sh \
            --model "$E2B_MODEL" \
            --prompt-fixture scripts/fixtures/gemma4_long_context_v1.json \
            --lengths 300 \
            --prefill-chunk-size 512 \
            --cache-dtype f16 \
            --capture-kv-capacity 2432 \
            --config-label l4-sm89-long-context-f16-decode-score-prework-screening \
            --output-dir "$CUDA_EVIDENCE_DIR/score-prework-screening"

      - name: Verify paged Polar4 and F16 attention parity
        working-directory: zig/pkg/inference
        run: |
          set -euo pipefail
          zig build quant-kernel-cuda-paged-attention-diff \
            -Dcuda=true -Dmetal=false -Dcuda-artifacts=sm89 \
            -Doptimize=ReleaseFast -- \
            --candidate-hd256 src/ops/cuda/artifacts/inference_cuda_kernels.fatbin \
            --candidate-hd512 src/ops/cuda/artifacts/inference_cuda_kernels.fatbin \
            --kv-len 1024 --pattern all --key-format all --json \
            | tee "$CUDA_EVIDENCE_DIR/paged_attention_diff.json"

      - name: Validate Polar4 server batching
        run: |
          set -euo pipefail
          args=(
            python3 zig/pkg/inference/scripts/benchmark_gemma4_cuda_batching.py
            --antfly-bin "$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference"
            --model "$E2B_MODEL"
            --models-dir "$GITHUB_WORKSPACE/.models"
            --output-dir "$CUDA_EVIDENCE_DIR/batching"
            --cache-dtype polar4
            --tokens 64
            --concurrency 1 2
            --warmups 1
            --repeats 2
            --min-c2-speedup 0.40
            --max-c1-p95-ratio 1.20
          )
          # Continuous batching remains default-off. CI proves row isolation
          # and guards a regression floor; the script's 1.5x default remains
          # the manual promotion gate.
          "${args[@]}"

      - name: Collect fixed E2B and 12B release evidence
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python3 zig/pkg/inference/scripts/gemma4_cuda_l4_release_gate.py
            --binary "$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference"
            --llama-cpp-bin "$LLAMA_CPP_BIN"
            --e2b-model "$E2B_MODEL"
            --gemma12b-q4-model "$GEMMA12B_Q4_MODEL"
            --output-dir "$CUDA_EVIDENCE_DIR"
            --warmups 1
            --repeats 3
            --timeout-sec 600
          )
          case "$CUDA_RELEASE_MODE" in
            nightly)
              ;;
            release)
              args+=(--enforce-performance --min-comparable-ratio 0.70 --verify-artifacts)
              ;;
            *)
              echo "unsupported CUDA_RELEASE_MODE=$CUDA_RELEASE_MODE" >&2
              exit 2
              ;;
          esac
          "${args[@]}"

      - name: Gate E2B warm-server long-context E2E
        if: ${{ steps.prepare.outputs.long_e2e_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          long_e2e_dir="$CUDA_EVIDENCE_DIR/long-e2e"
          args=(
            python3 zig/pkg/inference/scripts/benchmark_gemma4_long_e2e_server.py
            --antfly-bin "$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference"
            --llama-server-bin "$LLAMA_SERVER_BIN"
            --backend cuda
            --profile headline
            --model "$E2B_MODEL"
            --models-dir "$E2B_MODELS_DIR"
            --output-dir "$long_e2e_dir"
            --warmups 2
            --repeats 10
            --lockfile "$LONG_E2E_LOCK"
            --lockfile-sha256 "$LONG_E2E_LOCK_SHA256"
            --require-lock
            --enforce-performance
          )
          benchmark_rc=0
          "${args[@]}" || benchmark_rc=$?
          python3 zig/pkg/inference/scripts/merge_gemma4_long_e2e_release_summary.py \
            "$CUDA_EVIDENCE_DIR/release_summary.json" \
            "$long_e2e_dir/evidence.json" \
            "$benchmark_rc"
          exit "$benchmark_rc"

      - name: Validate E4B warm-server long-context correctness/regression
        if: ${{ steps.prepare.outputs.e4b_regression_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          e4b_dir="$CUDA_EVIDENCE_DIR/e4b-regression"
          args=(
            python3 zig/pkg/inference/scripts/benchmark_gemma4_long_e2e_server.py
            --antfly-bin "$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference"
            --llama-server-bin "$LLAMA_SERVER_BIN"
            --backend cuda
            --profile e4b-regression
            --model "$E4B_QAT_MODEL"
            --models-dir "$E4B_MODELS_DIR"
            --output-dir "$e4b_dir"
            --warmups 2
          )
          if [[ "$GEMMA4_E4B_REGRESSION_ENFORCED" == "true" ]]; then
            args+=(
              --repeats 10
              --baseline-evidence "$E4B_BASELINE_EVIDENCE"
              --baseline-sha256 "$E4B_BASELINE_SHA256"
              --lockfile "$E4B_REGRESSION_LOCK"
              --lockfile-sha256 "$E4B_REGRESSION_LOCK_SHA256"
              --require-lock
              --enforce-performance
            )
          else
            args+=(--repeats 3 --collect-only)
          fi
          benchmark_rc=0
          "${args[@]}" || benchmark_rc=$?
          python3 zig/pkg/inference/scripts/merge_gemma4_long_e2e_release_summary.py \
            --lane-field e4b_regression \
            --lane-label "Gemma 4 E4B warm-server correctness/regression lane" \
            "$CUDA_EVIDENCE_DIR/release_summary.json" \
            "$e4b_dir/evidence.json" \
            "$benchmark_rc"
          exit "$benchmark_rc"

      - name: Collect experimental fixed-corpus MTP diagnostics
        if: ${{ (inputs.gate || 'nightly') == 'nightly' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mtp_dir="$CUDA_EVIDENCE_DIR/mtp"
          mkdir -p "$mtp_dir"
          if [[ ! -f "$MTP_DRAFT_MODEL" ]]; then
            echo "SKIP MTP evidence: draft model missing: $MTP_DRAFT_MODEL"
            printf '%s\n' \
              'diagnostic_status=skipped_missing_draft' \
              'release_contract=none; experimental diagnostic only' \
              > "$mtp_dir/mtp_collection_profile.txt"
            exit 0
          fi

          source zig/pkg/inference/scripts/gemma4_qat_cuda_tuning.sh
          gemma4_qat_cuda_tuning_env 544
          export "${GEMMA4_QAT_CUDA_ENV[@]}"
          export ANTFLY_GEMMA4_MTP_TARGET_REPLAY=auto
          export ANTFLY_GEMMA4_MTP_UNSAFE_TARGET_REPLAY=0
          export ANTFLY_GEMMA4_MTP_VERIFY_DEVICE_RESULT=1
          export ANTFLY_GEMMA4_MTP_PREPROJECT_FUSION=1
          export ANTFLY_GEMMA4_MTP_MASKED_SELECT_FUSION=0
          export ANTFLY_GEMMA4_MTP_MASKED_SELECT_HIDDEN_FUSION=0
          export ANTFLY_GEMMA4_MTP_ADAPTIVE_K=1
          export ANTFLY_GEMMA4_MTP_AUTO_MAX_K=1
          export ANTFLY_GEMMA4_MTP_AUTO_COST_PROBE_ROUNDS=16
          export ANTFLY_GEMMA4_MTP_AUTO_MIN_ACCEPTED_PER_ROUND_MILLI=1500
          export ANTFLY_GEMMA4_MTP_HIDDEN_ONLY_MATERIALIZE=1
          export ANTFLY_GEMMA4_MTP_ACTIVE_MATERIALIZE=1
          export ANTFLY_GEMMA4_MTP_ACCEPT_BONUS=1
          export ANTFLY_GEMMA4_MTP_DEDICATED_RUNTIME=1
          export ANTFLY_GEMMA4_MTP_MATERIALIZE_REPLAY=0
          export ANTFLY_GEMMA4_MTP_DEFER_MATERIALIZE=0
          export ANTFLY_GEMMA4_MTP_DEFER_MATERIALIZE_TARGET_ACTIVATION=0
          export ANTFLY_GEMMA4_MTP_ASSISTANT_REPLAY=0
          mtp_status=0
          RUN_MTP=required \
          ANTFLY_BIN="$GITHUB_WORKSPACE/zig/pkg/inference/zig-out/bin/antfly-inference" \
          MTP_TARGET_MODEL="$E2B_MODEL" \
          MTP_DRAFT_MODEL="$MTP_DRAFT_MODEL" \
          MTP_PROMPT="Here is a sentence about ants:" \
          MTP_TOKENS=255 \
          MTP_SPECULATIVE_K=1 \
          MTP_MIN_ACTIVE_SPEED_RATIO=0 \
          OUT_DIR="$mtp_dir" \
            zig/pkg/inference/scripts/gemma4_cuda_production_gate.sh --mtp-only || mtp_status=$?

          printf '%s\n' \
            'comparison=collection-only; not paired or interleaved with llama.cpp' \
            'prompt=Here is a sentence about ants:' \
            'tokens=255' \
            'requested_speculative_k=1' \
            'auto_max_k=1' \
            'effective_speculative_k_when_active=1' \
            'release_contract=none; experimental diagnostic only' \
            "diagnostic_exit_code=$mtp_status" \
            > "$mtp_dir/mtp_collection_profile.txt"

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$CUDA_EVIDENCE_DIR/release_summary.json"
          if [[ ! -f "$summary" ]]; then
            echo "CUDA evidence did not produce release_summary.json" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

