name: Dictation example

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      check_id:
        type: string
        default: ''
      comment_id:
        type: string
        default: ''
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'examples/dictation/Sources/**'
      - 'examples/dictation/Tests/**'
      - 'examples/dictation/Assets/**'
      - 'examples/dictation/presets/**'
      - 'examples/dictation/release/**'
      - 'scripts/release/objectstore_channel.py'
      - 'scripts/release/publish_objectstorage.py'
      - 'scripts/release/download_objectstorage.py'
      - 'scripts/release/verify_release_ledger.py'
      - 'scripts/release/create_github_release.py'
      - 'scripts/release/release_channels.py'
      - 'scripts/release/release_lines.py'
      - 'scripts/release/requirements.lock'
      - 'examples/dictation/*.swift'
      - 'examples/dictation/*.sh'
      - 'examples/dictation/Package.resolved'
      - 'examples/dictation/Info.plist'
      - 'examples/dictation/antfly.yaml'
      - '.github/workflows/dictation-example.yml'
      - '.github/workflows/dictation-release*.yml'

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: dictation-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    uses: ./.github/workflows/pr-ci-admission.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      check_id: ${{ inputs.check_id }}
      comment_id: ${{ inputs.comment_id }}
      suite: dictation

  macos:
    needs: admission
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - name: Test release policy
        run: |
          bash examples/dictation/release/fetch-tools.sh
          python3 -m unittest discover -s examples/dictation/release -p 'test_*.py'

      - name: Test configuration, streaming, and persistence clients
        run: examples/dictation/test.sh
      - name: Build signed application bundle
        run: |
          examples/dictation/build-app.sh
          DICTATION_TEST_APP="$PWD/examples/dictation/dist/Antfly Dictation.app/Contents/MacOS/AntflyDictation" python3 -m unittest discover -s examples/dictation/release -p 'test_runtime.py'
