name: Diagnose Zig ARM64 bad_alloc

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    name: Validate one-time release retry
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-antfly-publish-arm64
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Install Linux diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build ARM64 release archive with bounded retry
        run: |
          scripts/packaging/build_zig_release_archive.sh \
            --version 0.2.0-rc.26 \
            --target aarch64-linux-musl \
            --optimize ReleaseSmall \
            --jobs 1 \
            --archive-name antfly_0.2.0-rc.26_Linux_arm64.tar.gz \
            --out-dir "$RUNNER_TEMP/zig-retry-validation" \
            --metal false \
            --system-blas false

      - name: Upload retry validation
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: zig-arm64-release-retry-validation
          path: |
            ${{ runner.temp }}/zig-retry-validation
            ${{ runner.temp }}/antfly-zig-release-aarch64-linux-musl/*-attempt-*.log
          if-no-files-found: error
