name: Diagnose ARM64 storage-kernel allocations

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.16.0

jobs:
  storage-kernel-memory:
    name: Attribute storage-kernel LLVM memory
    runs-on: arc-antfly-publish
    timeout-minutes: 240
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Verify 32 GiB runner
        run: |
          test "$(uname -m)" = x86_64
          test "$(awk '$1 == "oom" { print $2 }' /sys/fs/cgroup/memory.events)" = 0
          sed -n '1,20p' /sys/fs/cgroup/memory.current || true
          sed -n '1,20p' /sys/fs/cgroup/memory.peak || true
          sed -n '1,20p' /sys/fs/cgroup/memory.max || true
          cat /proc/sys/vm/max_map_count
          sed -n '1,20p' /proc/meminfo

      - name: Install diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates file gdb strace

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Install glibc-linked Zig
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A zig_0_16 --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          echo "$zig_path/bin" >> "$GITHUB_PATH"
          echo "ZIG_EXE=$zig_path/bin/zig" >> "$GITHUB_ENV"

      - name: Inspect compiler binary
        run: |
          file "$ZIG_EXE" | tee "$RUNNER_TEMP/zig-file.txt"
          ldd "$ZIG_EXE" 2>&1 | tee "$RUNNER_TEMP/zig-ldd.txt" || true
          nm -C "$ZIG_EXE" 2>/dev/null \
            | grep -E 'llvm::(allocate_buffer|report_bad_alloc_error)' \
            | tee "$RUNNER_TEMP/zig-allocation-symbols.txt" || true

      - name: Run glibc ReleaseFast storage-kernel probe
        env:
          STORAGE_KERNEL_REPORT_ROOT: ${{ runner.temp }}/storage-kernel-reports
        run: |
          mkdir -p "$STORAGE_KERNEL_REPORT_ROOT"
          scripts/ci/diagnose-storage-kernel-codegen.sh \
            release-fast-nix-glibc ReleaseFast true

      - name: Summarize probe results
        if: ${{ always() }}
        run: |
          shopt -s nullglob
          for summary in "$RUNNER_TEMP"/storage-kernel-reports/*.summary.txt; do
            echo "===== $summary"
            cat "$summary"
          done
          echo '===== failed allocation syscalls'
          failed_allocations=("$RUNNER_TEMP"/storage-kernel-reports/*.failed-allocations.txt)
          if (( ${#failed_allocations[@]} > 0 )); then
            cat "${failed_allocations[@]}"
          fi
          echo '===== crash backtraces'
          backtraces=("$RUNNER_TEMP"/storage-kernel-reports/*.gdb.txt)
          for backtrace in "${backtraces[@]}"; do
            echo "===== $backtrace"
            sed -n '1,240p' "$backtrace"
          done

      - name: Upload diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: storage-kernel-allocation-probe
          path: |
            ${{ runner.temp }}/storage-kernel-reports
            ${{ runner.temp }}/zig-file.txt
            ${{ runner.temp }}/zig-ldd.txt
            ${{ runner.temp }}/zig-allocation-symbols.txt
          if-no-files-found: warn
