name: Diagnose linked Zig ARM64 runtime libraries

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linked-runtime:
    name: ARM64 ReleaseFast single linked executable
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-antfly-publish
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Verify x86_64 host
        run: test "$(uname -m)" = x86_64

      - name: Verify runtime import boundaries
        run: |
          python3 zig/tools/analyze_zig_import_graph.py --check-runtime-boundary --check-codegen-boundary --check-api-kernel-boundary --json
          python3 -m unittest zig/tools/test_analyze_zig_import_graph.py
          python3 -m unittest zig/tools/test_patch_zig_0_16_build_runner_maxrss.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates time file binutils

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Backport Zig max_rss scheduler fix
        run: |
          python3 zig/tools/patch_zig_0_16_build_runner_maxrss.py \
            "$RUNNER_TEMP/zig/lib/compiler/build_runner.zig" \
            "$RUNNER_TEMP/zig-build-runner-maxrss.zig"

      - name: Build linked ARM64 ReleaseFast archive artifacts
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/linked-runtime-cache/global
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/linked-runtime-cache/compiler-local
        run: |
          set -o pipefail
          mkdir -p \
            "$RUNNER_TEMP/linked-runtime" \
            "$RUNNER_TEMP/linked-runtime-cache/local" \
            "$RUNNER_TEMP/linked-runtime-cache/global" \
            "$RUNNER_TEMP/linked-runtime-reports"
          # Keep 4000Mi of the ARC pod's 24000Mi request outside Zig's
          # scheduling budget. Step max_rss values are scheduling claims, not
          # a complete accounting of build-runner state and page cache. Claims
          # admit the measured 9GiB distributed-control consumer and 10.25GiB
          # PIC storage kernel as the initial 19.25GiB group. This fits the
          # unchanged 20,000MiB cap. With product composition moved out of the
          # kernel, inference starts when distributed finishes and overlaps the
          # storage tail at an 18.25GiB claim. The short enrichment and remote
          # CLI units also wait for distributed; max_rss admission holds them
          # until capacity remains. Explicit build dependencies keep Zig's
          # randomized traversal from admitting downstream units ahead of the
          # two initial critical units. The pod reserve covers runner state,
          # linker work, page cache, and drift.
          cd zig
          runner_root="$(dirname "$(dirname "$RUNNER_TEMP")")"
          node_bin="$runner_root/externals/node24/bin/node"
          if [ ! -x "$node_bin" ]; then
            echo "Actions runner Node 24 binary not found at $node_bin" >&2
            exit 1
          fi
          "$node_bin" --version
          /usr/bin/time -v -o "$RUNNER_TEMP/linked-runtime.time" \
            zig build install capi \
            --build-runner "$RUNNER_TEMP/zig-build-runner-maxrss.zig" \
            -Dtarget=aarch64-linux-musl \
            -Doptimize=ReleaseFast \
            -Dstrip=true \
            -Dcpu=baseline \
            -Donnx=false \
            -Dmetal=false \
            -Dsystem-blas=false \
            -Dlinked-runtime-libraries=true \
            -Dproduction-lsm-only=true \
            -Dstorage-kernel-experiment=true \
            --prefix "$RUNNER_TEMP/linked-runtime" \
            --cache-dir "$RUNNER_TEMP/linked-runtime-cache/local" \
            --global-cache-dir "$RUNNER_TEMP/linked-runtime-cache/global" \
            --maxrss 20971520000 \
            --summary all \
            --time-report \
            --webui=127.0.0.1:19125 \
            >"$RUNNER_TEMP/linked-runtime.log" 2>&1 &
          build_pid=$!

          stop_webui_build() {
            if ! kill -0 "$build_pid" 2>/dev/null; then
              wait "$build_pid" || true
              return
            fi
            # GNU time, the Zig launcher, and Zig's generated build runner form
            # a short parent/child chain. --time-report intentionally leaves
            # the deepest build-runner process waiting in the WebUI after the
            # summary. Interrupt that idle process; its parents then reap it
            # and GNU time writes the complete resource report.
            webui_pid="$build_pid"
            while true; do
              child_pid="$(pgrep -P "$webui_pid" | head -n 1 || true)"
              if [ -z "$child_pid" ]; then break; fi
              webui_pid="$child_pid"
            done
            kill -INT "$webui_pid" 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! kill -0 "$build_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$build_pid" 2>/dev/null; then
              kill -TERM "$webui_pid" 2>/dev/null || true
              kill -TERM "$build_pid" 2>/dev/null || true
            fi
            wait "$build_pid" || true
          }

          webui_ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$build_pid" 2>/dev/null; then break; fi
            if curl --silent --fail http://127.0.0.1:19125/ >/dev/null; then
              webui_ready=true
              break
            fi
            sleep 1
          done
          if [ "$webui_ready" != true ]; then
            stop_webui_build
            cat "$RUNNER_TEMP/linked-runtime.log"
            echo "Zig time-report web UI did not become ready" >&2
            exit 1
          fi

          "$node_bin" tools/capture_zig_time_report.mjs \
            ws://127.0.0.1:19125/ antfly-storage-kernel \
            "$RUNNER_TEMP/linked-runtime-reports/storage.json" 30 &
          storage_report_pid=$!
          "$node_bin" tools/capture_zig_time_report.mjs \
            ws://127.0.0.1:19125/ antfly-runtime-distributed \
            "$RUNNER_TEMP/linked-runtime-reports/distributed.json" 30 &
          distributed_report_pid=$!
          "$node_bin" tools/capture_zig_time_report.mjs \
            ws://127.0.0.1:19125/ antfly-runtime-enrichment_compute \
            "$RUNNER_TEMP/linked-runtime-reports/enrichment.json" 5 &
          enrichment_report_pid=$!
          "$node_bin" tools/capture_zig_time_report.mjs \
            ws://127.0.0.1:19125/ antfly-runtime-inference \
            "$RUNNER_TEMP/linked-runtime-reports/inference.json" 30 &
          inference_report_pid=$!
          "$node_bin" tools/capture_zig_time_report.mjs \
            ws://127.0.0.1:19125/ antfly-runtime-cli \
            "$RUNNER_TEMP/linked-runtime-reports/cli.json" 5 &
          cli_report_pid=$!

          report_status=0
          for report_pid in \
            "$storage_report_pid" \
            "$distributed_report_pid" \
            "$enrichment_report_pid" \
            "$inference_report_pid" \
            "$cli_report_pid"; do
            wait "$report_pid" || report_status=$?
          done
          if [ "$report_status" -ne 0 ]; then
            stop_webui_build
            cat "$RUNNER_TEMP/linked-runtime.log"
            exit "$report_status"
          fi

          # A Zig 0.16 WebUI build does not exit after completing its steps; it
          # waits for an interactive rebuild request. The full summary is the
          # authoritative completion marker. Allow ample time for the thin
          # final links after the last compiler report arrives, then stop only
          # the idle WebUI child above.
          build_complete=false
          for _ in $(seq 1 600); do
            if grep -q '^Build Summary:' "$RUNNER_TEMP/linked-runtime.log"; then
              build_complete=true
              break
            fi
            if ! kill -0 "$build_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          stop_webui_build
          cat "$RUNNER_TEMP/linked-runtime.log"

          if [ "$build_complete" != true ]; then
            echo "Zig time-report build did not reach a final summary" >&2
            exit 1
          fi
          if ! grep -Eq '^Build Summary: [0-9]+/[0-9]+ steps succeeded$' "$RUNNER_TEMP/linked-runtime.log"; then
            echo "Zig time-report build summary was not successful" >&2
            exit 1
          fi

          storage_object="$(find "$RUNNER_TEMP/linked-runtime-cache/local" -type f -name 'libantfly-storage-kernel_zcu.o' -print -quit)"
          distributed_object="$(find "$RUNNER_TEMP/linked-runtime-cache/local" -type f -name 'libantfly-runtime-distributed_zcu.o' -print -quit)"
          enrichment_object="$(find "$RUNNER_TEMP/linked-runtime-cache/local" -type f -name 'libantfly-runtime-enrichment_compute_zcu.o' -print -quit)"
          inference_object="$(find "$RUNNER_TEMP/linked-runtime-cache/local" -type f -name 'libantfly-runtime-inference_zcu.o' -print -quit)"
          cli_object="$(find "$RUNNER_TEMP/linked-runtime-cache/local" -type f -name 'libantfly-runtime-cli_zcu.o' -print -quit)"
          if [ -z "$storage_object" ] || [ -z "$distributed_object" ] || [ -z "$enrichment_object" ] || [ -z "$inference_object" ] || [ -z "$cli_object" ]; then
            echo "Zig runtime objects were not found for emitted-overlap analysis" >&2
            exit 1
          fi

          python3 tools/analyze_zig_import_graph.py \
            --time-report "storage=$RUNNER_TEMP/linked-runtime-reports/storage.json" \
            --time-report "distributed=$RUNNER_TEMP/linked-runtime-reports/distributed.json" \
            --time-report "enrichment=$RUNNER_TEMP/linked-runtime-reports/enrichment.json" \
            --time-report "inference=$RUNNER_TEMP/linked-runtime-reports/inference.json" \
            --time-report "cli=$RUNNER_TEMP/linked-runtime-reports/cli.json" \
            --object "storage=$storage_object" \
            --object "distributed=$distributed_object" \
            --object "enrichment=$enrichment_object" \
            --object "inference=$inference_object" \
            --object "cli=$cli_object" \
            --top-groups 30 \
            --json | tee "$RUNNER_TEMP/linked-runtime-reports/summary.json"

      - name: Verify ARM64 release artifacts
        run: |
          test "$(find "$RUNNER_TEMP/linked-runtime/bin" -maxdepth 1 -type f | wc -l)" -eq 1
          binary="$RUNNER_TEMP/linked-runtime/bin/antfly"
          library="$RUNNER_TEMP/linked-runtime/lib/libantfly.so"
          test -f "$library"
          test -f "$RUNNER_TEMP/linked-runtime/include/antfly.h"
          file "$binary"
          file "$library"
          readelf -h "$binary" | tee "$RUNNER_TEMP/linked-runtime.elf-header"
          readelf -h "$library" | tee "$RUNNER_TEMP/capi.elf-header"
          readelf -Ws "$library" | tee "$RUNNER_TEMP/capi.symbols"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/linked-runtime.elf-header"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/capi.elf-header"
          grep -Eq 'GLOBAL.*antfly_db_open$' "$RUNNER_TEMP/capi.symbols"
          if grep -Eq 'GLOBAL.*antfly_(runtime_|api_kernel_|enrichment_|standalone_inference_|storage_kernel_link_anchor|storage_context_|storage_owner_|storage_snapshot_|storage_restore_|data_apply_store_)' "$RUNNER_TEMP/capi.symbols"; then
            echo "private executable ABI leaked from libantfly.so" >&2
            exit 1
          fi
          stat -c 'binary_size_bytes=%s' "$binary" | tee "$RUNNER_TEMP/linked-runtime.size"
          stat -c 'capi_size_bytes=%s' "$library" | tee "$RUNNER_TEMP/capi.size"
          library_size=$(stat -c '%s' "$library")
          if [ "$library_size" -ge 20971520 ]; then
            echo "libantfly.so exceeded the 20MiB retained-code budget: $library_size bytes" >&2
            exit 1
          fi

      - name: Report compiler memory
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/linked-runtime.time" || true

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: zig-arm64-linked-runtime-release-fast
          path: |
            ${{ runner.temp }}/linked-runtime
            ${{ runner.temp }}/linked-runtime.log
            ${{ runner.temp }}/linked-runtime.time
            ${{ runner.temp }}/linked-runtime-reports
            ${{ runner.temp }}/linked-runtime.elf-header
            ${{ runner.temp }}/linked-runtime.size
            ${{ runner.temp }}/capi.elf-header
            ${{ runner.temp }}/capi.symbols
            ${{ runner.temp }}/capi.size
          if-no-files-found: error
