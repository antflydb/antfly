name: Diagnose focused Zig ARM64 runtime artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  focused-runtime:
    name: ARM64 ReleaseFast artifact (${{ matrix.role }})
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-antfly-publish
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        role: [metadata, data, standalone]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Verify x86_64 host
        run: test "$(uname -m)" = x86_64

      - name: Verify runtime import boundaries
        run: |
          python3 zig/tools/analyze_zig_import_graph.py --check-runtime-boundary --json
          python3 -m unittest zig/tools/test_analyze_zig_import_graph.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates time file binutils

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build focused ARM64 ReleaseFast artifact
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/runtime-${{ matrix.role }}-cache/global
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/runtime-${{ matrix.role }}-cache/compiler-local
        run: |
          set -o pipefail
          mkdir -p \
            "$RUNNER_TEMP/runtime-${{ matrix.role }}" \
            "$RUNNER_TEMP/runtime-${{ matrix.role }}-cache/local" \
            "$RUNNER_TEMP/runtime-${{ matrix.role }}-cache/global"
          cd zig
          /usr/bin/time -v -o "$RUNNER_TEMP/runtime-${{ matrix.role }}.time" \
            zig build runtime-artifact -j1 \
            -Dtarget=aarch64-linux-musl \
            -Doptimize=ReleaseFast \
            -Dstrip=true \
            -Dcpu=baseline \
            -Donnx=false \
            -Dmetal=false \
            -Dsystem-blas=false \
            -Druntime-artifact-role=${{ matrix.role }} \
            --prefix "$RUNNER_TEMP/runtime-${{ matrix.role }}" \
            --cache-dir "$RUNNER_TEMP/runtime-${{ matrix.role }}-cache/local" \
            --global-cache-dir "$RUNNER_TEMP/runtime-${{ matrix.role }}-cache/global" \
            2>&1 | tee "$RUNNER_TEMP/runtime-${{ matrix.role }}.log"

      - name: Verify artifact
        run: |
          file "$RUNNER_TEMP/runtime-${{ matrix.role }}/bin/antfly-${{ matrix.role }}"
          readelf -h "$RUNNER_TEMP/runtime-${{ matrix.role }}/bin/antfly-${{ matrix.role }}" \
            | tee "$RUNNER_TEMP/runtime-${{ matrix.role }}.elf-header"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/runtime-${{ matrix.role }}.elf-header"

      - name: Report compiler memory
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/runtime-${{ matrix.role }}.time" || true

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: zig-arm64-runtime-${{ matrix.role }}-release-fast
          path: |
            ${{ runner.temp }}/runtime-${{ matrix.role }}
            ${{ runner.temp }}/runtime-${{ matrix.role }}.log
            ${{ runner.temp }}/runtime-${{ matrix.role }}.time
            ${{ runner.temp }}/runtime-${{ matrix.role }}.elf-header
          if-no-files-found: error
