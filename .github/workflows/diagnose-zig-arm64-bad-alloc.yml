name: Diagnose linked Zig ARM64 runtime libraries

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linked-runtime:
    name: ARM64 ReleaseFast single linked executable
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-antfly-publish
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Verify x86_64 host
        run: test "$(uname -m)" = x86_64

      - name: Verify runtime import boundaries
        run: |
          python3 zig/tools/analyze_zig_import_graph.py --check-runtime-boundary --json
          python3 -m unittest zig/tools/test_analyze_zig_import_graph.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates time file binutils

      - name: Install Zig
        run: |
          curl -L "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build linked ARM64 ReleaseFast executable
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/linked-runtime-cache/global
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/linked-runtime-cache/compiler-local
        run: |
          set -o pipefail
          mkdir -p \
            "$RUNNER_TEMP/linked-runtime" \
            "$RUNNER_TEMP/linked-runtime-cache/local" \
            "$RUNNER_TEMP/linked-runtime-cache/global"
          # Match the ARC pod's 24000Mi memory request; the host-reported
          # total includes memory Kubernetes cannot safely give this pod.
          cd zig
          /usr/bin/time -v -o "$RUNNER_TEMP/linked-runtime.time" \
            zig build \
            -Dtarget=aarch64-linux-musl \
            -Doptimize=ReleaseFast \
            -Dstrip=true \
            -Dcpu=baseline \
            -Donnx=false \
            -Dmetal=false \
            -Dsystem-blas=false \
            -Dlinked-runtime-libraries=true \
            --prefix "$RUNNER_TEMP/linked-runtime" \
            --cache-dir "$RUNNER_TEMP/linked-runtime-cache/local" \
            --global-cache-dir "$RUNNER_TEMP/linked-runtime-cache/global" \
            --maxrss 25165824000 \
            --summary all \
            2>&1 | tee "$RUNNER_TEMP/linked-runtime.log"

      - name: Verify single artifact and linked entry points
        run: |
          test "$(find "$RUNNER_TEMP/linked-runtime/bin" -maxdepth 1 -type f | wc -l)" -eq 1
          binary="$RUNNER_TEMP/linked-runtime/bin/antfly"
          file "$binary"
          readelf -h "$binary" | tee "$RUNNER_TEMP/linked-runtime.elf-header"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/linked-runtime.elf-header"
          nm -g "$binary" | tee "$RUNNER_TEMP/linked-runtime.symbols"
          for role in client data ha inference lite metadata serverless standalone; do
            grep -Eq "antfly_runtime_${role}$" "$RUNNER_TEMP/linked-runtime.symbols"
          done
          for operation in create configure provider register_routes destroy; do
            grep -Eq "antfly_standalone_inference_${operation}$" "$RUNNER_TEMP/linked-runtime.symbols"
          done
          stat -c 'binary_size_bytes=%s' "$binary" | tee "$RUNNER_TEMP/linked-runtime.size"

      - name: Report compiler memory
        if: ${{ always() }}
        run: cat "$RUNNER_TEMP/linked-runtime.time" || true

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: zig-arm64-linked-runtime-release-fast
          path: |
            ${{ runner.temp }}/linked-runtime
            ${{ runner.temp }}/linked-runtime.log
            ${{ runner.temp }}/linked-runtime.time
            ${{ runner.temp }}/linked-runtime.elf-header
            ${{ runner.temp }}/linked-runtime.symbols
            ${{ runner.temp }}/linked-runtime.size
          if-no-files-found: error
