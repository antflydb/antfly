name: Zig secret store cloud qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 0'

permissions:
  contents: read

concurrency:
  group: secret-store-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    # Run only trusted main-branch code, with dedicated qualification credentials.
    if: vars.SECRET_STORE_CLOUD_QUALIFICATION == 'true' && github.ref == 'refs/heads/main'
    runs-on: arc-antfly-heavy
    environment: secret-store-qualification
    timeout-minutes: 90
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/secrets-cloud/${{ github.run_id }}-${{ github.run_attempt }}
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build production executable
        working-directory: zig
        run: >-
          python3 tools/run_bounded_zig_build.py --max-rss-cap 23622320128 --
          build antfly -Doptimize=ReleaseSafe --summary all
          --cache-dir "$ZIG_LOCAL_CACHE_DIR" --global-cache-dir "$ZIG_GLOBAL_CACHE_DIR"
      - name: Qualify real S3 and GCS conditional publication
        env:
          ANTFLY_BIN: ${{ github.workspace }}/zig/zig-out/bin/antfly
          OBJECTSTORE_S3_INTEGRATION: '1'
          OBJECTSTORE_GCS_INTEGRATION: '1'
          OBJECTSTORE_S3_TEST_BUCKET: ${{ vars.SECRET_STORE_S3_BUCKET }}
          OBJECTSTORE_GCS_TEST_BUCKET: ${{ vars.SECRET_STORE_GCS_BUCKET }}
          AWS_REGION: ${{ vars.SECRET_STORE_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_STORE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_STORE_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.SECRET_STORE_AWS_SESSION_TOKEN }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.SECRET_STORE_GCS_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/secret-store-gcs.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for name in ("OBJECTSTORE_S3_TEST_BUCKET", "OBJECTSTORE_GCS_TEST_BUCKET", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "GCS_SERVICE_ACCOUNT_JSON"):
              if not os.environ.get(name):
                  raise SystemExit(f"Required qualification setting missing: {name}")
          credentials = json.loads(os.environ["GCS_SERVICE_ACCOUNT_JSON"])
          path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          with path.open("x") as stream:
              path.chmod(0o600)
              json.dump(credentials, stream)
          PY
          unset GCS_SERVICE_ACCOUNT_JSON
          uv run --project zig/e2e/antfly pytest -q zig/e2e/antfly/test_secrets.py \
            -m objectstore_integration --junitxml="$RUNNER_TEMP/secrets-cloud.xml"
      - name: Retain qualification results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-cloud-results
          path: ${{ runner.temp }}/secrets-cloud.xml
          retention-days: 30
