name: Zig VOPR soaks

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      histories:
        description: Histories per shard (0 uses scenario budgets)
        type: number
        default: 0

      diagnostic_run:
        description: Inspect an earlier soak with its original executable (empty runs a new soak)
        type: string
        default: ''
      diagnostic_shard:
        description: Artifact name when inspecting an earlier run
        type: string
        default: ''
      diagnostic_trace:
        description: Trace filename when inspecting an earlier run
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: vopr-soak-${{ github.ref }}-${{ inputs.diagnostic_trace || 'campaign' }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: inputs.diagnostic_run != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/zig-vopr-replay-diagnostics.yml
    with:
      run_id: ${{ inputs.diagnostic_run }}
      shard_artifact: ${{ inputs.diagnostic_shard }}
      trace_name: ${{ inputs.diagnostic_trace }}

  build:
    if: inputs.diagnostic_run == ''
    runs-on: arc-antfly-heavy
    timeout-minutes: 90
    env:
      ZIG_LOCAL_CACHE_DIR: /mnt/cache/antfly/zig/vopr-soak/${{ github.run_id }}-${{ github.run_attempt }}
      ZIG_GLOBAL_CACHE_DIR: /mnt/cache/antfly/zig/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false
      - name: Test soak orchestration
        run: python3 -m unittest discover -s scripts/ci -p test_zig_vopr_soak.py
      - name: Build campaign runner
        working-directory: zig
        run: zig build vopr-build -Doptimize=ReleaseSafe -j1 --summary all
      - name: Package executable
        run: tar -C zig/zig-out/bin -czf "$RUNNER_TEMP/vopr.tar.gz" vopr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vopr-runner
          path: ${{ runner.temp }}/vopr.tar.gz
          retention-days: 7
          overwrite: true

  campaign:
    needs: build
    runs-on: arc-antfly-heavy
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [ha, raft, distributed-data, ha-scaling]
        shard: [0, 1]
        include:
          - scenario: ha
            histories: 1000
          - scenario: raft
            histories: 1000
          - scenario: distributed-data
            histories: 12
          - scenario: ha-scaling
            histories: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vopr-runner
          path: ${{ runner.temp }}/runner
      - run: tar -C "$RUNNER_TEMP/runner" -xzf "$RUNNER_TEMP/runner/vopr.tar.gz"
      - name: Restore merged corpus from earlier runs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vopr-corpus-retained
          key: vopr-corpus-v1-${{ github.ref_name }}--${{ matrix.scenario }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vopr-corpus-v1-${{ github.ref_name }}--${{ matrix.scenario }}--
      - name: Run retained-corpus campaign
        timeout-minutes: 240
        working-directory: zig
        env:
          SCENARIO: ${{ matrix.scenario }}
          SHARD: ${{ matrix.shard }}
          HISTORY_BUDGET: ${{ inputs.histories }}
          DEFAULT_HISTORY_BUDGET: ${{ matrix.histories }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Dispatch can supply the string "0", which is truthy in expressions.
          # Normalize the sentinel and the absent scheduled input explicitly.
          if [ -z "$HISTORY_BUDGET" ] || [ "$HISTORY_BUDGET" = "0" ]; then
            HISTORY_BUDGET="$DEFAULT_HISTORY_BUDGET"
          fi
          seed=$((0xa17f5500 + RUN_NUMBER * 65536 + SHARD))
          python3 ../scripts/ci/zig_vopr_soak.py --binary "$RUNNER_TEMP/runner/vopr" run \
            --scenario "$SCENARIO" --histories "$HISTORY_BUDGET" --seed "$seed" \
            --corpus "$RUNNER_TEMP/vopr-corpus-retained" --output "$RUNNER_TEMP/vopr-run"
      - name: Retain reports, replay traces, and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vopr-run-${{ matrix.scenario }}--${{ matrix.shard }}
          path: ${{ runner.temp }}/vopr-run
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  corpus:
    needs: [build, campaign]
    if: always() && needs.build.result == 'success'
    runs-on: arc-antfly-heavy
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [ha, raft, distributed-data, ha-scaling]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vopr-runner
          path: ${{ runner.temp }}/runner
      - run: tar -C "$RUNNER_TEMP/runner" -xzf "$RUNNER_TEMP/runner/vopr.tar.gz"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vopr-run-${{ matrix.scenario }}--*
          path: ${{ runner.temp }}/vopr-shards
      - name: Replay, deduplicate, and quarantine incompatible corpus entries
        timeout-minutes: 120
        working-directory: zig
        run: |
          python3 ../scripts/ci/zig_vopr_soak.py --binary "$RUNNER_TEMP/runner/vopr" merge \
            --inputs "$RUNNER_TEMP/vopr-shards" --output "$RUNNER_TEMP/vopr-corpus" \
            --retained "$RUNNER_TEMP/vopr-corpus-retained"
      - name: Publish corpus for the next scheduled run
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vopr-corpus-retained
          key: vopr-corpus-v1-${{ github.ref_name }}--${{ matrix.scenario }}--${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain merged corpus and quarantine review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vopr-corpus-${{ matrix.scenario }}
          path: ${{ runner.temp }}/vopr-corpus
          retention-days: 90
          overwrite: true
          if-no-files-found: error
