name: Release build

# Tag code has read-only access and only calls the shared immutable artifact
# build. Privileged promotion is loaded independently from the default branch.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/antfly-artifact-build.yml
    with:
      tag_name: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}
      channel: auto
