name: Release build

# Tag code receives read-only repository access and can only upload ephemeral
# Actions artifacts. The privileged promotion is a workflow_run loaded from the
# default branch and independently authenticates this tag and source commit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.16.0
  NIXPKGS_REV: c5c4a43b0e8056328ec4529f735cabdb8f1942bb
  MACOS_SDK_VERSION: "15.5"
  MACOS_SDK_SHA256: c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd

jobs:
  release-plan:
    name: Resolve canonical release platform matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and export release platforms
        id: platforms
        run: |
          matrix="$(python scripts/release/release_platforms.py github-matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-zig-runtime-archives:
    name: Build Zig archive (${{ matrix.artifact_name }})
    needs: release-plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates file

      - name: Install Nix
        if: ${{ matrix.os == 'linux' }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIXPKGS_REV }}.tar.gz

      - name: Install glibc-linked Zig
        if: ${{ matrix.os == 'linux' }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A zig_0_16 --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"

      - name: Install pinned macOS cross-compilation SDK
        if: ${{ matrix.macos_sdk == 'true' }}
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          sdk_stage="$RUNNER_TEMP/macos-sdk"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz" \
            -o "$sdk_archive"
          echo "$MACOS_SDK_SHA256  $sdk_archive" | sha256sum --check --strict
          mkdir -p "$sdk_stage"
          tar -xJf "$sdk_archive" -C "$sdk_stage"
          sdk_path="$sdk_stage/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdk_path/System/Library/Frameworks/Metal.framework"
          test -d "$sdk_path/System/Library/Frameworks/MetalPerformanceShaders.framework"
          test -d "$sdk_path/System/Library/Frameworks/Accelerate.framework"
          echo "SDK_PATH=$sdk_path" >> "$GITHUB_ENV"

      - name: Test reproducible archive packaging
        run: python3 scripts/packaging/test_reproducible_tar.py

      - name: Build archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="antfly_${version}_${{ matrix.archive_os }}_${{ matrix.archive_arch }}${{ matrix.archive_suffix }}.tar.gz"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$version" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "$archive" \
            --out-dir dist/release-archives \
            --metal "${{ matrix.metal }}" \
            --system-blas "${{ matrix.system_blas }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release-archives/*.tar.gz
          if-no-files-found: error

  package-cli-artifacts:
    name: Build immutable CLI package snapshot
    needs: build-zig-runtime-archives
    uses: ./.github/workflows/cli-package.yml
    with:
      version: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}

  release-request:
    name: Record immutable release identity
    needs:
      - build-zig-runtime-archives
      - package-cli-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Write request
        run: |
          mkdir -p dist/release-request
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --argjson schema_version 1 \
            '{schema_version: $schema_version, tag: $tag, commit: $commit}' \
            > dist/release-request/release-request.json
      - uses: actions/upload-artifact@v6
        with:
          name: antfly-release-request
          path: dist/release-request/release-request.json
          if-no-files-found: error
