name: Package Apache Embedded

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      python_build:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Build Apache Embedded wheels and npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_build }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - name: Install locked TypeScript dependencies
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Verify embedded packaging contract
        run: python -m unittest scripts.packaging.test_lite_packaging scripts.packaging.test_release_licenses

      - name: Stage release package source
        run: git worktree add --detach dist/embedded-package-source HEAD

      - name: Populate platform packages and wheels
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python dist/embedded-package-source/scripts/packaging/package_lite_release.py \
            --version "$RELEASE_VERSION" \
            --archive-dir dist/release-archives \
            --out-dir dist/embedded-packages

      - name: Build and check TypeScript binding
        working-directory: ts
        env:
          ANTFLY_LIBRARY: ${{ github.workspace }}/dist/embedded-package-source/ts/packages/embedded-linux-x64/lib/libantfly.so
          ANTFLY_LITE_REQUIRE_LIBRARY: "1"
        run: |
          pnpm --filter @antfly/embedded typecheck
          pnpm --filter @antfly/embedded test
          pnpm --filter @antfly/embedded build

      - name: Qualify Better Auth against the release library
        working-directory: ts
        env:
          ANTFLY_LIBRARY: ${{ github.workspace }}/dist/embedded-package-source/ts/packages/embedded-linux-x64/lib/libantfly.so
        run: |
          pnpm --filter @antfly/sdk --filter @antfly/better-auth build
          pnpm --filter @antfly/better-auth typecheck
          pnpm --filter @antfly/better-auth test
          pnpm --filter @antfly/better-auth test:integration

      - name: Pack Apache npm packages
        run: |
          set -euo pipefail
          mkdir -p dist/embedded-packages/npm
          cp -R ts/packages/embedded/dist dist/embedded-package-source/ts/packages/embedded/dist
          for name in embedded-darwin-arm64 embedded-linux-arm64 embedded-linux-x64 embedded; do
            npm pack --ignore-scripts --pack-destination dist/embedded-packages/npm "./dist/embedded-package-source/ts/packages/$name"
          done
          python scripts/packaging/verify_lite_release.py \
            --version "${{ inputs.version }}" \
            --archive-dir dist/release-archives \
            --wheel-dir dist/embedded-packages/python \
            --npm-dir dist/embedded-packages/npm

      - name: Seal immutable embedded package snapshot
        run: |
          python scripts/release/lite_snapshot.py build \
            --version "${{ inputs.version }}" \
            --commit "${{ inputs.source_commit }}" \
            --npm-dir dist/embedded-packages/npm \
            --wheel-dir dist/embedded-packages/python \
            --out-dir dist/embedded-snapshot
          python scripts/release/lite_snapshot.py verify \
            --snapshot-dir dist/embedded-snapshot \
            --version "${{ inputs.version }}" \
            --commit "${{ inputs.source_commit }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antfly-embedded-package-snapshot
          path: dist/embedded-snapshot/
          if-no-files-found: error
