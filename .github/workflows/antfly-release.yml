name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v0.0.0-dev10
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Antfly release version to republish to PyPI/npm"
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.16.0
  # Keep the glibc-linked host compiler reproducible. Linux release artifacts
  # include portable musl builds and GNU builds for containers and plugins.
  NIXPKGS_REV: c5c4a43b0e8056328ec4529f735cabdb8f1942bb
  MACOS_SDK_VERSION: "15.5"
  MACOS_SDK_SHA256: c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd

jobs:
  build-zig-runtime-archives:
    name: Build Zig archive (${{ matrix.artifact_name }})
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: antfly-zig-linux-amd64
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            archive_os: Linux
            archive_arch: x86_64
            archive_suffix: ""
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-amd64-gnu
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: x86_64-linux-gnu.2.28
            archive_os: Linux
            archive_arch: x86_64
            archive_suffix: _gnu
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-arm64
            # Zig supplies the musl libc and target linker, so this artifact
            # does not need a native ARM64 runner.
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: aarch64-linux-musl
            archive_os: Linux
            archive_arch: arm64
            archive_suffix: ""
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-arm64-gnu
            runner: arc-antfly-publish-arm64
            os: linux
            zig_arch: aarch64
            zig_target: aarch64-linux-gnu.2.28
            archive_os: Linux
            archive_arch: arm64
            archive_suffix: _gnu
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-darwin-arm64
            # The v0.1.x release used this same Linux-to-Darwin Zig toolchain.
            # Metal and Accelerate are target framework links; they do not run
            # on the build host.
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: aarch64-macos
            archive_os: Darwin
            archive_arch: arm64
            archive_suffix: ""
            macos_sdk: "true"
            metal: "true"
            system_blas: "true"
            zig_optimize: ReleaseFast
            zig_jobs: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates file

      - name: Install Nix
        if: ${{ matrix.os == 'linux' }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIXPKGS_REV }}.tar.gz

      - name: Install glibc-linked Zig (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          zig_path="$(nix-build '<nixpkgs>' -A zig_0_16 --no-out-link)"
          test "$("$zig_path/bin/zig" version)" = "$ZIG_VERSION"
          compiler_description="$(file "$zig_path/bin/zig")"
          echo "$compiler_description"
          grep -q 'dynamically linked' <<<"$compiler_description"
          echo "$zig_path/bin" >> "$GITHUB_PATH"

      - name: Install pinned macOS cross-compilation SDK
        if: ${{ matrix.macos_sdk == 'true' }}
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          sdk_stage="$RUNNER_TEMP/macos-sdk"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz" \
            -o "$sdk_archive"
          echo "$MACOS_SDK_SHA256  $sdk_archive" | sha256sum --check --strict
          mkdir -p "$sdk_stage"
          tar -xJf "$sdk_archive" -C "$sdk_stage"

          sdk_path="$sdk_stage/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdk_path/System/Library/Frameworks/Metal.framework"
          test -d "$sdk_path/System/Library/Frameworks/MetalPerformanceShaders.framework"
          test -d "$sdk_path/System/Library/Frameworks/Accelerate.framework"
          echo "SDK_PATH=$sdk_path" >> "$GITHUB_ENV"

      - name: Test reproducible archive packaging
        run: python3 scripts/packaging/test_reproducible_tar.py

      - name: Build archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="antfly_${version}_${{ matrix.archive_os }}_${{ matrix.archive_arch }}${{ matrix.archive_suffix }}.tar.gz"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$version" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "$archive" \
            --out-dir dist/release-archives \
            --metal "${{ matrix.metal }}" \
            --system-blas "${{ matrix.system_blas }}"

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release-archives/*.tar.gz
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - build-zig-runtime-archives
      - package-cli-artifacts
    runs-on: arc-antfly-standard
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native Zig runtime archives
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - name: Download immutable CLI snapshot
        uses: actions/download-artifact@v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install object storage dependencies
        run: python -m pip install boto3

      - name: Build release payload
        run: |
          python scripts/release/verify_cli_snapshot.py \
            --snapshot-dir dist/cli-snapshot \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
          python scripts/release/build_release_payload.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --archive-dir dist/release-archives \
            --extra-dir dist/cli-snapshot \
            --out-dir dist/release-payload

      - name: Attest immutable release ledger and artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release-payload/*

      - name: Create GitHub draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release/create_github_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --draft \
            --immutable-assets \
            --asset 'dist/release-payload/*'

      - name: Publish release payload to object storage
        run: |
          python scripts/release/publish_objectstorage.py \
            --provider s3 \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --prefix "antfly/${GITHUB_REF_NAME}" \
            --content-addressed-prefix antfly/artifacts \
            --latest-prefix antfly/latest \
            --publish-latest-if-stable "$GITHUB_REF_NAME" \
            dist/release-payload/*
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}

  package-cli-artifacts:
    name: Build immutable CLI package snapshot
    needs: build-zig-runtime-archives
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/cli-package.yml
    with:
      version: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}

  restore-cli-artifacts:
    name: Restore immutable CLI package snapshot
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          raw="$RAW_VERSION"
          version="${raw#v}"
          tag="v${version}"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Download exact package snapshot from the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/cli-snapshot
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' \
            --pattern '*.whl' \
            --pattern cli-snapshot.json \
            --dir dist/cli-snapshot

      - name: Verify release attestations and snapshot manifest
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for artifact in dist/cli-snapshot/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/antfly-release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_COMMIT"
          done
          python scripts/release/verify_cli_snapshot.py \
            --snapshot-dir dist/cli-snapshot \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - name: Upload recovered CLI snapshot
        uses: actions/upload-artifact@v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot/
          if-no-files-found: error

  publish-cli-pypi:
    name: Publish antfly-cli to PyPI
    needs:
      - package-cli-artifacts
      - restore-cli-artifacts
      - publish-release-assets
    if: >-
      ${{ always() &&
          ((github.event_name == 'push' && needs.publish-release-assets.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.restore-cli-artifacts.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot

      - name: Select digest-verified Python distributions
        id: pypi
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-cli \
            --snapshot-dir dist/cli-snapshot \
            --out-dir dist/pypi

      - name: Publish wheels
        if: ${{ steps.pypi.outputs.has_packages == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi

  publish-cli-npm:
    name: Publish @antfly/cli to npm
    needs:
      - package-cli-artifacts
      - restore-cli-artifacts
      - publish-release-assets
    if: >-
      ${{ always() &&
          ((github.event_name == 'push' && needs.publish-release-assets.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.restore-cli-artifacts.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot

      - uses: actions/setup-node@v6
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC support
        # npm 12.0.0 omitted sigstore from its published bundle: npm/cli#9722.
        run: npm install -g npm@11

      - name: Publish npm packages
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          raw="$RAW_VERSION"
          version="${raw#v}"
          npm_tag="latest"
          case "$version" in
            *-*) npm_tag="next" ;;
          esac
          echo "Publishing CLI npm packages with dist-tag: ${npm_tag}"
          sh scripts/packaging/publish_npm_package.sh \
            @antfly/cli-darwin-arm64 "$version" "$npm_tag" \
            "./dist/cli-snapshot/antfly-cli-darwin-arm64-${version}.tgz"
          sh scripts/packaging/publish_npm_package.sh \
            @antfly/cli-linux-arm64 "$version" "$npm_tag" \
            "./dist/cli-snapshot/antfly-cli-linux-arm64-${version}.tgz"
          sh scripts/packaging/publish_npm_package.sh \
            @antfly/cli-linux-x64 "$version" "$npm_tag" \
            "./dist/cli-snapshot/antfly-cli-linux-x64-${version}.tgz"
          # Publish the top-level selector only after every platform package is
          # present, so users never receive a version with missing dependencies.
          sh scripts/packaging/publish_npm_package.sh \
            @antfly/cli "$version" "$npm_tag" \
            "./dist/cli-snapshot/antfly-cli-${version}.tgz"

  publish-zig-homebrew:
    name: Publish antfly Homebrew formula
    needs:
      - build-zig-runtime-archives
      - publish-release-assets
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - name: Render formula
        run: |
          python scripts/packaging/test_cabi_packaging.py
          version="${GITHUB_REF_NAME#v}"
          python scripts/packaging/render_homebrew_antfly_formula.py \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --archive-dir dist/release-archives \
            --out "$RUNNER_TEMP/antfly.rb"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: antflydb/homebrew-taps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-taps
          fetch-depth: 1

      - name: Push formula to tap
        run: |
          set -euo pipefail
          tap_dir="$GITHUB_WORKSPACE/homebrew-taps"
          cp "$RUNNER_TEMP/antfly.rb" "$tap_dir/Formula/antfly.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/antfly.rb; then
            echo "Formula unchanged"
            exit 0
          fi
          git add Formula/antfly.rb
          git commit -m "Update antfly to ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # Build and publish container images after release
  publish-container:
    needs:
      - build-zig-runtime-archives
      - publish-release-assets
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/antfly-container.yml
    with:
      tag_name: ${{ github.ref_name }}
      # Reuse the GNU release artifacts; the unsuffixed musl archives remain
      # the portable CLI/install defaults.
      artifact_source: github
    secrets: inherit
