name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v0.0.0-dev10

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.16.0
  MACOS_SDK_VERSION: "15.5"
  MACOS_SDK_SHA256: c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd

jobs:
  build-zig-runtime-archives:
    name: Build Zig archive (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: antfly-zig-linux-amd64
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: x86_64-linux-musl
            archive_os: Linux
            archive_arch: x86_64
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-linux-arm64
            # Zig supplies the musl libc and target linker, so this artifact
            # does not need a native ARM64 runner.
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: aarch64-linux-musl
            archive_os: Linux
            archive_arch: arm64
            macos_sdk: "false"
            metal: "false"
            system_blas: "false"
            zig_optimize: ReleaseFast
            zig_jobs: ""
          - artifact_name: antfly-zig-darwin-arm64
            # The v0.1.x release used this same Linux-to-Darwin Zig toolchain.
            # Metal and Accelerate are target framework links; they do not run
            # on the build host.
            runner: arc-antfly-publish
            os: linux
            zig_arch: x86_64
            zig_target: aarch64-macos
            archive_os: Darwin
            archive_arch: arm64
            macos_sdk: "true"
            metal: "true"
            system_blas: "true"
            zig_optimize: ReleaseFast
            zig_jobs: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates

      - name: Install Zig (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_arch }}-linux-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install pinned macOS cross-compilation SDK
        if: ${{ matrix.macos_sdk == 'true' }}
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          sdk_stage="$RUNNER_TEMP/macos-sdk"
          curl --fail --location --retry 3 \
            "https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz" \
            -o "$sdk_archive"
          echo "$MACOS_SDK_SHA256  $sdk_archive" | sha256sum --check --strict
          mkdir -p "$sdk_stage"
          tar -xJf "$sdk_archive" -C "$sdk_stage"

          sdk_path="$sdk_stage/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdk_path/System/Library/Frameworks/Metal.framework"
          test -d "$sdk_path/System/Library/Frameworks/MetalPerformanceShaders.framework"
          test -d "$sdk_path/System/Library/Frameworks/Accelerate.framework"
          echo "SDK_PATH=$sdk_path" >> "$GITHUB_ENV"

      - name: Test reproducible archive packaging
        run: python3 scripts/packaging/test_reproducible_tar.py

      - name: Build archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="antfly_${version}_${{ matrix.archive_os }}_${{ matrix.archive_arch }}.tar.gz"
          jobs_arg=()
          if [ -n "${{ matrix.zig_jobs }}" ]; then
            jobs_arg=(--jobs "${{ matrix.zig_jobs }}")
          fi
          scripts/packaging/build_zig_release_archive.sh \
            --version "$version" \
            --target "${{ matrix.zig_target }}" \
            --optimize "${{ matrix.zig_optimize }}" \
            "${jobs_arg[@]}" \
            --archive-name "$archive" \
            --out-dir dist/release-archives \
            --metal "${{ matrix.metal }}" \
            --system-blas "${{ matrix.system_blas }}"

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release-archives/*.tar.gz
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - build-zig-runtime-archives
    runs-on: arc-antfly-standard
    permissions:
      contents: write # Required only here for creating the draft release.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native Zig runtime archives
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install object storage dependencies
        run: python -m pip install boto3

      - name: Build release payload
        run: |
          python scripts/release/build_release_payload.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --archive-dir dist/release-archives \
            --out-dir dist/release-payload

      - name: Create GitHub draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release/create_github_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --draft \
            --replace-assets \
            --asset 'dist/release-payload/antfly_*.tar.gz' \
            --asset dist/release-payload/antfly_zig_checksums.txt \
            --asset dist/release-payload/metadata.json \
            --asset dist/release-payload/artifacts.json

      - name: Publish release payload to object storage
        run: |
          python scripts/release/publish_objectstorage.py \
            --provider s3 \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --prefix "antfly/${GITHUB_REF_NAME}" \
            --latest-prefix antfly/latest \
            --publish-latest-if-stable "$GITHUB_REF_NAME" \
            dist/release-payload/*
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}

  package-cli-artifacts:
    name: Build CLI package artifacts
    needs:
      - build-zig-runtime-archives
      - publish-release-assets
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Set up Zig
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Test Antfly C ABI packaging
        run: python scripts/packaging/test_cabi_packaging.py

      - name: Build wheels and populate npm packages
        run: |
          python scripts/packaging/package_cli_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --archive-dir dist/release-archives \
            --out-dir dist/cli-packages

      - name: Smoke check package wrappers
        run: |
          python -m compileall -q py/packages/cli/src/antfly_cli
          node --check ts/packages/cli/bin/antfly.js

      - name: Pack npm packages
        run: |
          set -euo pipefail
          mkdir -p dist/cli-packages/npm
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-darwin-arm64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-linux-arm64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-linux-x64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli

      - name: Upload Python wheels
        uses: actions/upload-artifact@v6
        with:
          name: antfly-cli-wheels
          path: dist/cli-packages/python/*.whl

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v6
        with:
          name: antfly-cli-npm
          path: dist/cli-packages/npm/*.tgz

  publish-cli-pypi:
    name: Publish antfly-cli to PyPI
    needs: package-cli-artifacts
    runs-on: arc-antfly-standard
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-wheels
          path: dist/

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-cli-npm:
    name: Publish @antfly/cli to npm
    needs: package-cli-artifacts
    runs-on: arc-antfly-standard
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-npm
          path: dist/

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC support
        # npm 12.0.0 omitted sigstore from its published bundle: npm/cli#9722.
        run: npm install -g npm@11

      - name: Publish npm packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm_tag="latest"
          case "$version" in
            *-*) npm_tag="next" ;;
          esac
          echo "Publishing CLI npm packages with dist-tag: ${npm_tag}"
          npm publish ./dist/antfly-cli-darwin-arm64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish ./dist/antfly-cli-linux-arm64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish ./dist/antfly-cli-linux-x64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish ./dist/antfly-cli-[0-9]*.tgz --access public --provenance --tag "$npm_tag"

  publish-zig-homebrew:
    name: Publish antfly Homebrew formula
    needs:
      - build-zig-runtime-archives
      - publish-release-assets
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives

      - name: Render formula
        run: |
          python scripts/packaging/test_cabi_packaging.py
          version="${GITHUB_REF_NAME#v}"
          python scripts/packaging/render_homebrew_antfly_formula.py \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --archive-dir dist/release-archives \
            --out "$RUNNER_TEMP/antfly.rb"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: antflydb/homebrew-taps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-taps
          fetch-depth: 1

      - name: Push formula to tap
        run: |
          set -euo pipefail
          tap_dir="$GITHUB_WORKSPACE/homebrew-taps"
          cp "$RUNNER_TEMP/antfly.rb" "$tap_dir/Formula/antfly.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/antfly.rb; then
            echo "Formula unchanged"
            exit 0
          fi
          git add Formula/antfly.rb
          git commit -m "Update antfly to ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # Build and publish container images after release
  publish-container:
    needs:
      - build-zig-runtime-archives
      - publish-release-assets
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/antfly-container.yml
    with:
      tag_name: ${{ github.ref_name }}
      artifact_source: github
    secrets: inherit
