name: Release promotion

# The default-branch build controller produces immutable inputs;
# repository_dispatch is the exact-ledger recovery path.
on:
  workflow_run:
    workflows: ["Release build"]
    types: [completed]
  repository_dispatch:
    types: [promote-cli-release, promote-release-channel]

permissions:
  contents: read

# Release channel state is compare-and-swapped, and a single promotion controller
# keeps external registries from racing between that preflight and commit.
concurrency:
  group: antfly-release-promotion
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_VERSION: 11.19.1
  GCP_REGION: us-central1
  GCP_PROJECT: antfly-image-artifacts
  GCP_REPOSITORY: containers
  GAR_REGISTRY: us-central1-docker.pkg.dev

jobs:
  prepare-release-promotion:
    name: Authenticate, seal, and restore release bundle
    if: ${{ github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: arc-antfly-standard
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      build_controller_commit: ${{ steps.identity.outputs.build_controller_commit }}
      promotion_controller_commit: ${{ steps.identity.outputs.promotion_controller_commit }}
      allow_legacy: ${{ steps.identity.outputs.allow_legacy }}
      ledger_sha256: ${{ steps.ledger.outputs.sha256 }}
      container_digest: ${{ steps.container-state.outputs.digest }}
      channel: ${{ steps.identity.outputs.channel }}
      journal_key: ${{ steps.identity.outputs.journal_key }}
      bootstrap: ${{ steps.identity.outputs.bootstrap }}
      npm_tag: ${{ steps.identity.outputs.npm_tag }}
      publish_pypi: ${{ steps.identity.outputs.publish_pypi }}
      publish_homebrew: ${{ steps.identity.outputs.publish_homebrew }}
      container_alias: ${{ steps.identity.outputs.container_alias }}
      object_alias: ${{ steps.identity.outputs.object_alias }}
      github_release: ${{ steps.identity.outputs.github_release }}
      recovery_source: ${{ steps.identity.outputs.recovery_source }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Download runtime archives from the completed build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: antfly-zig-*
          merge-multiple: true
          path: dist/release-archives
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI snapshot from the completed build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release identity from the completed build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-release-request
          path: dist/release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download commit-bound release support files
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-release-source
          path: dist/release-source
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and validate requested release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_EVENT: ${{ github.event.workflow_run.event }}
          RAW_RECOVERY_VERSION: ${{ github.event.client_payload.version }}
          RAW_RECOVERY_CHANNEL: ${{ github.event.client_payload.channel }}
          RAW_RECOVERY_COMMIT: ${{ github.event.client_payload.commit }}
          RECOVERY_LEDGER_SHA256: ${{ github.event.client_payload.ledger_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected_ledger=""
          promotion_controller_commit="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = workflow_run ]; then
            request=dist/release-request/release-request.json
            test "$(jq -r .schema_version "$request")" = 4
            raw="$(jq -r .tag "$request")"
            commit="$(jq -r .source_commit "$request")"
            build_controller_commit="$(jq -r .build_controller_commit "$request")"
            requested_channel="$(jq -r .channel "$request")"
            allow_legacy=false
            test "$BUILD_EVENT" = workflow_run
          else
            raw="$RAW_RECOVERY_VERSION"
            requested_channel="${RAW_RECOVERY_CHANNEL:-auto}"
            expected_ledger="${RECOVERY_LEDGER_SHA256,,}"
            test -n "$expected_ledger"
            build_controller_commit=""
            allow_legacy=true
          fi
          if ! [[ "$raw" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $raw" >&2
            exit 2
          fi
          version="${raw#v}"
          tag="v${version}"
          legacy_args=()
          if [ "$allow_legacy" = true ]; then legacy_args=(--allow-legacy); fi
          resolved="$(python scripts/release/release_channels.py resolve \
            --tag "$tag" \
            --channel "$requested_channel" \
            "${legacy_args[@]}" \
            --github-output "$GITHUB_OUTPUT")"
          channel="$(jq -r .channel <<<"$resolved")"
          if [ "$EVENT_NAME" != workflow_run ]; then
            if [ "$channel" = nightly ]; then
              commit="${RAW_RECOVERY_COMMIT,,}"
              [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            else
              commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
            echo "build_controller_commit=$build_controller_commit"
            echo "promotion_controller_commit=$promotion_controller_commit"
            echo "allow_legacy=$allow_legacy"
            echo "expected_ledger=$expected_ledger"
          } >> "$GITHUB_OUTPUT"

      - name: Require the tag and commit to be immutable default-branch history
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
          BUILD_CONTROLLER_COMMIT: ${{ steps.identity.outputs.build_controller_commit }}
          PROMOTION_CONTROLLER_COMMIT: ${{ steps.identity.outputs.promotion_controller_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" != nightly ]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git cat-file -e "$RELEASE_COMMIT^{commit}"
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$PROMOTION_CONTROLLER_COMMIT"
          git merge-base --is-ancestor "$PROMOTION_CONTROLLER_COMMIT" "origin/$DEFAULT_BRANCH"
          if [ -n "$BUILD_CONTROLLER_COMMIT" ]; then
            [[ "$BUILD_CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$BUILD_CONTROLLER_COMMIT^{commit}"
            git merge-base --is-ancestor "$BUILD_CONTROLLER_COMMIT" "origin/$DEFAULT_BRANCH"
          fi

      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check

      - name: Build the schema-versioned release payload
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          PROMOTION_CONTROLLER_COMMIT: ${{ steps.identity.outputs.promotion_controller_commit }}
        run: |
          python scripts/release/verify_cli_snapshot.py \
            --snapshot-dir dist/cli-snapshot \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"
          python scripts/release/build_release_payload.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --archive-dir dist/release-archives \
            --extra-dir dist/cli-snapshot \
            --source-dir dist/release-source \
            --release-spec dist/release-request/release-request.json \
            --promotion-controller-commit "$PROMOTION_CONTROLLER_COMMIT" \
            --out-dir dist/release-payload

      - name: Verify the newly assembled release ledger before sealing
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          ledger_sha256="$(sha256sum dist/release-payload/artifacts.json | cut -d' ' -f1)"
          python scripts/release/verify_release_ledger.py \
            --ledger dist/release-payload/artifacts.json \
            --payload-dir dist/release-payload \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$ledger_sha256"

      - name: Attest the immutable release bundle
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/release-payload/*

      - name: Save immutable assets on a draft GitHub release
        if: ${{ github.event_name == 'workflow_run' && steps.identity.outputs.github_release != 'none' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          python scripts/release/create_github_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --draft \
            --immutable-assets \
            --asset 'dist/release-payload/*'

      - name: Seal immutable object-storage keys
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python scripts/release/publish_objectstorage.py \
            --provider s3 \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --prefix "antfly/${RELEASE_TAG}" \
            --content-addressed-prefix antfly/artifacts \
            dist/release-payload/*

      - name: Recover the complete immutable payload from GitHub
        if: ${{ github.event_name == 'repository_dispatch' && steps.identity.outputs.recovery_source == 'github-release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          mkdir -p dist/release-payload
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/release-payload

      - name: Recover the complete immutable payload from object storage
        if: ${{ github.event_name == 'repository_dispatch' && steps.identity.outputs.recovery_source == 'object-storage' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python scripts/release/download_objectstorage.py \
            --provider s3 \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --prefix "antfly/${RELEASE_TAG}" \
            --out-dir dist/release-payload

      - name: Verify recovered artifact attestations
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/antfly-release.yml" \
              --source-ref "refs/heads/${{ github.event.repository.default_branch }}"
          done < <(find dist/release-payload -type f -print | sort)

      - name: Bind and verify the complete release ledger
        id: ledger
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_LEDGER: ${{ steps.identity.outputs.expected_ledger }}
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/release-payload/artifacts.json | cut -d' ' -f1)"
          if [ -n "$EXPECTED_LEDGER" ] && [ "$actual" != "$EXPECTED_LEDGER" ]; then
            echo "release ledger digest differs" >&2
            echo "expected: $EXPECTED_LEDGER" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi
          python scripts/release/verify_release_ledger.py \
            --ledger dist/release-payload/artifacts.json \
            --payload-dir dist/release-payload \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$actual"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Reuse any container identity already bound by the channel journal
        id: container-state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          LEDGER_SHA256: ${{ steps.ledger.outputs.sha256 }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
          JOURNAL_KEY: ${{ steps.identity.outputs.journal_key }}
          ALLOW_LEGACY: ${{ steps.identity.outputs.allow_legacy }}
        run: |
          set -euo pipefail
          legacy_args=()
          if [ "$ALLOW_LEGACY" = true ]; then legacy_args=(--allow-legacy-candidate); fi
          digest="$(python scripts/release/release_channel_state.py resolve-container \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --key "$JOURNAL_KEY" \
            --channel "$CHANNEL" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$LEDGER_SHA256" \
            "${legacy_args[@]}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Materialize and verify typed bundle scopes
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          LEDGER_SHA256: ${{ steps.ledger.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-ledger dist/release-runtime dist/verified-cli-snapshot
          cp dist/release-payload/artifacts.json dist/release-ledger/artifacts.json
          cp dist/release-payload/antfly_*.tar.gz dist/release-runtime/
          cp dist/release-payload/*.tgz dist/release-payload/*.whl \
            dist/release-payload/cli-snapshot.json dist/verified-cli-snapshot/
          python scripts/release/verify_release_ledger.py \
            --ledger dist/release-ledger/artifacts.json \
            --payload-dir dist/release-runtime \
            --scope runtime \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$LEDGER_SHA256"
          python scripts/release/verify_release_ledger.py \
            --ledger dist/release-ledger/artifacts.json \
            --payload-dir dist/verified-cli-snapshot \
            --scope cli \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$LEDGER_SHA256"
          python scripts/release/verify_cli_snapshot.py \
            --snapshot-dir dist/verified-cli-snapshot \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: antfly-cli-snapshot
          path: dist/verified-cli-snapshot/
          if-no-files-found: error

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: antfly-release-runtime-archives
          path: dist/release-runtime/
          if-no-files-found: error

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: antfly-release-payload
          path: dist/release-payload/
          if-no-files-found: error

  publish-cli-pypi:
    name: Publish antfly-cli to PyPI
    needs:
      - prepare-release-promotion
      - begin-release-channel
    if: ${{ needs.prepare-release-promotion.outputs.publish_pypi == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot
      - name: Select digest-verified Python distributions
        id: pypi
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-cli \
            --snapshot-dir dist/cli-snapshot \
            --out-dir dist/pypi
      - name: Publish wheels
        if: ${{ steps.pypi.outputs.has_packages == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi
      - name: Verify exact PyPI release contents
        run: |
          python scripts/release/prepare_pypi_promotion.py \
            --project antfly-cli \
            --snapshot-dir dist/cli-snapshot \
            --verify-complete \
            --attempts 30 \
            --retry-seconds 10

  publish-cli-npm:
    name: Publish @antfly/cli to npm
    needs:
      - prepare-release-promotion
      - begin-release-channel
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-cli-snapshot
          path: dist/cli-snapshot
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/
      - name: Install exact npm trusted-publishing client
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Publish npm packages in dependency order
        env:
          VERSION: ${{ needs.prepare-release-promotion.outputs.version }}
          NPM_TAG: ${{ needs.prepare-release-promotion.outputs.npm_tag }}
        run: |
          set -euo pipefail
          sh scripts/packaging/publish_npm_package.sh @antfly/cli-darwin-arm64 "$VERSION" "$NPM_TAG" "./dist/cli-snapshot/antfly-cli-darwin-arm64-${VERSION}.tgz"
          sh scripts/packaging/publish_npm_package.sh @antfly/cli-linux-arm64 "$VERSION" "$NPM_TAG" "./dist/cli-snapshot/antfly-cli-linux-arm64-${VERSION}.tgz"
          sh scripts/packaging/publish_npm_package.sh @antfly/cli-linux-x64 "$VERSION" "$NPM_TAG" "./dist/cli-snapshot/antfly-cli-linux-x64-${VERSION}.tgz"
          sh scripts/packaging/publish_npm_package.sh @antfly/cli "$VERSION" "$NPM_TAG" "./dist/cli-snapshot/antfly-cli-${VERSION}.tgz"

  prepare-zig-homebrew:
    name: Prepare antfly Homebrew formula
    needs: prepare-release-promotion
    if: ${{ needs.prepare-release-promotion.outputs.publish_homebrew == 'true' }}
    runs-on: arc-antfly-standard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-release-runtime-archives
          path: dist/release-archives
      - name: Render formula
        env:
          VERSION: ${{ needs.prepare-release-promotion.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
        run: |
          python scripts/packaging/test_cabi_packaging.py
          python scripts/packaging/render_homebrew_antfly_formula.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --archive-dir dist/release-archives \
            --out "$RUNNER_TEMP/antfly.rb"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: antfly-homebrew-formula
          path: ${{ runner.temp }}/antfly.rb
          if-no-files-found: error

  stage-container:
    name: Build digest-addressed container candidate
    needs: prepare-release-promotion
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/antfly-container.yml
    with:
      tag_name: ${{ needs.prepare-release-promotion.outputs.tag }}
      source_commit: ${{ needs.prepare-release-promotion.outputs.commit }}
      promotion_controller_commit: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      ledger_sha256: ${{ needs.prepare-release-promotion.outputs.ledger_sha256 }}
      expected_digest: ${{ needs.prepare-release-promotion.outputs.container_digest }}
    secrets: inherit

  begin-release-channel:
    name: Begin mutable release channel transaction
    needs:
      - prepare-release-promotion
      - stage-container
    runs-on: arc-antfly-standard
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check
      - name: Resolve current release channel
        id: channel
        env:
          CHANNEL: ${{ needs.prepare-release-promotion.outputs.channel }}
          BOOTSTRAP: ${{ needs.prepare-release-promotion.outputs.bootstrap }}
          NPM_TAG: ${{ needs.prepare-release-promotion.outputs.npm_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          discovery_args=("$BOOTSTRAP")
          if [ "$BOOTSTRAP" = npm ]; then
            discovery_args+=(--npm-tag "$NPM_TAG")
          fi
          current_tag="$(python scripts/release/discover_channel_tag.py "${discovery_args[@]}")"
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "current_tag=$current_tag" >> "$GITHUB_OUTPUT"
      - name: Begin or resume the release channel transaction
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release-promotion.outputs.commit }}
          LEDGER_SHA256: ${{ needs.prepare-release-promotion.outputs.ledger_sha256 }}
          CONTAINER_DIGEST: ${{ needs.stage-container.outputs.image_digest }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          JOURNAL_KEY: ${{ needs.prepare-release-promotion.outputs.journal_key }}
          CURRENT_TAG: ${{ steps.channel.outputs.current_tag }}
          ALLOW_LEGACY: ${{ needs.prepare-release-promotion.outputs.allow_legacy }}
        run: |
          set -euo pipefail
          bootstrap_args=()
          if [ -n "$CURRENT_TAG" ]; then
            bootstrap_args=(--bootstrap-current "$CURRENT_TAG")
          fi
          legacy_args=()
          if [ "$ALLOW_LEGACY" = true ]; then legacy_args=(--allow-legacy-candidate); fi
          python scripts/release/release_channel_state.py begin \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --key "$JOURNAL_KEY" \
            --channel "$CHANNEL" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --ledger-sha256 "$LEDGER_SHA256" \
            --container-digest "$CONTAINER_DIGEST" \
            "${legacy_args[@]}" \
            "${bootstrap_args[@]}"

  promote-channel-aliases:
    name: Commit policy-selected mutable channel aliases
    needs:
      - prepare-release-promotion
      - begin-release-channel
      - publish-cli-npm
      - publish-cli-pypi
      - prepare-zig-homebrew
      - stage-container
    if: >-
      ${{ always() &&
          needs.prepare-release-promotion.result == 'success' &&
          needs.begin-release-channel.result == 'success' &&
          needs.publish-cli-npm.result == 'success' &&
          (needs.publish-cli-pypi.result == 'success' || needs.publish-cli-pypi.result == 'skipped') &&
          (needs.prepare-zig-homebrew.result == 'success' || needs.prepare-zig-homebrew.result == 'skipped') &&
          needs.stage-container.result == 'success' }}
    runs-on: arc-antfly-standard
    environment: container-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: antfly-release-payload
          path: dist/release-payload
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: ${{ needs.prepare-release-promotion.outputs.publish_homebrew == 'true' }}
        with:
          name: antfly-homebrew-formula
          path: dist/homebrew
      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ needs.prepare-release-promotion.outputs.publish_homebrew == 'true' }}
        with:
          repository: antflydb/homebrew-taps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-taps
          fetch-depth: 1
      - name: Commit the stable Homebrew formula
        if: ${{ needs.prepare-release-promotion.outputs.publish_homebrew == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
        run: |
          set -euo pipefail
          tap_dir="$GITHUB_WORKSPACE/homebrew-taps"
          cp dist/homebrew/antfly.rb "$tap_dir/Formula/antfly.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/antfly.rb; then exit 0; fi
          git add Formula/antfly.rb
          git commit -m "Update antfly to ${RELEASE_TAG}"
          git push origin HEAD:main
      - name: Authenticate to Google Cloud for container channel aliases
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Commit digest-pinned container version and channel aliases
        env:
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          CONTAINER_ALIAS: ${{ needs.prepare-release-promotion.outputs.container_alias }}
          CONTAINER_DIGEST: ${{ needs.stage-container.outputs.image_digest }}
          LEDGER_SHA256: ${{ needs.prepare-release-promotion.outputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          echo "${{ steps.auth.outputs.access_token }}" | crane auth login "$GAR_REGISTRY" -u oauth2accesstoken --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          gar_image="$GAR_REGISTRY/$GCP_PROJECT/$GCP_REPOSITORY/antfly"
          source="${gar_image}@${CONTAINER_DIGEST}"
          python3 scripts/release/registryctl.py container-verify \
            --ref "$source" --digest "$CONTAINER_DIGEST"
          manifest="$(crane manifest "$source")"
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected one linux/amd64 manifest") end' <<<"$manifest")"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("expected one linux/arm64 manifest") end' <<<"$manifest")"
          python3 scripts/release/registryctl.py container-alias \
            --source "${gar_image}@${amd64_digest}" \
            --destination "${gar_image}:${RELEASE_TAG}-amd64"
          python3 scripts/release/registryctl.py container-alias \
            --source "${gar_image}@${arm64_digest}" \
            --destination "${gar_image}:${RELEASE_TAG}-arm64"
          python3 scripts/release/registryctl.py container-alias \
            --source "$source" \
            --destination "${gar_image}:${RELEASE_TAG}"
          python3 scripts/release/registryctl.py container-alias \
            --source "$source" \
            --destination "ghcr.io/antflydb/antfly:${RELEASE_TAG}"
          python3 scripts/release/registryctl.py container-alias \
            --source "$source" \
            --destination "${gar_image}:${CONTAINER_ALIAS}"
          python3 scripts/release/registryctl.py container-alias \
            --source "$source" \
            --destination "ghcr.io/antflydb/antfly:${CONTAINER_ALIAS}"
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ needs.prepare-release-promotion.outputs.commit }}" \
            -a "ledger_sha256=${LEDGER_SHA256}" \
            "${gar_image}@${CONTAINER_DIGEST}"
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ needs.prepare-release-promotion.outputs.commit }}" \
            -a "ledger_sha256=${LEDGER_SHA256}" \
            "ghcr.io/antflydb/antfly@${CONTAINER_DIGEST}"
      - name: Commit object-storage channel aliases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          OBJECT_ALIAS: ${{ needs.prepare-release-promotion.outputs.object_alias }}
        run: |
          python scripts/release/publish_objectstorage.py \
            --provider s3 \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --prefix "antfly/${RELEASE_TAG}" \
            --content-addressed-prefix antfly/artifacts \
            --latest-prefix "antfly/${OBJECT_ALIAS}" \
            --publish-latest \
            dist/release-payload/*

  publish-github-release:
    name: Publish policy-selected GitHub release
    needs:
      - prepare-release-promotion
      - begin-release-channel
      - publish-cli-npm
      - promote-channel-aliases
    if: >-
      ${{ always() &&
          needs.prepare-release-promotion.result == 'success' &&
          needs.begin-release-channel.result == 'success' &&
          needs.publish-cli-npm.result == 'success' &&
          needs.promote-channel-aliases.result == 'success' &&
          needs.prepare-release-promotion.outputs.github_release != 'none' }}
    runs-on: arc-antfly-standard
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          GITHUB_RELEASE_MODE: ${{ needs.prepare-release-promotion.outputs.github_release }}
        run: |
          case "$GITHUB_RELEASE_MODE" in
            latest) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
            prerelease) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
            *) echo "unsupported GitHub release mode: $GITHUB_RELEASE_MODE" >&2; exit 2 ;;
          esac

  complete-release-channel:
    name: Commit release channel transaction
    needs:
      - prepare-release-promotion
      - begin-release-channel
      - publish-cli-npm
      - promote-channel-aliases
      - publish-github-release
      - stage-container
    if: >-
      ${{ always() &&
          needs.prepare-release-promotion.result == 'success' &&
          needs.begin-release-channel.result == 'success' &&
          needs.publish-cli-npm.result == 'success' &&
          needs.promote-channel-aliases.result == 'success' &&
          needs.stage-container.result == 'success' &&
          (needs.publish-github-release.result == 'success' || needs.publish-github-release.result == 'skipped') }}
    runs-on: arc-antfly-standard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-promotion.outputs.promotion_controller_commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check
      - name: Verify npm channel aliases before committing the journal
        env:
          RELEASE_VERSION: ${{ needs.prepare-release-promotion.outputs.version }}
          NPM_TAG: ${{ needs.prepare-release-promotion.outputs.npm_tag }}
        run: |
          set -euo pipefail
          for package in @antfly/cli-darwin-arm64 @antfly/cli-linux-arm64 @antfly/cli-linux-x64 @antfly/cli; do
            observed="$(python3 scripts/release/registryctl.py npm-tag \
              --package "$package" --tag "$NPM_TAG")"
            test "$observed" = "$RELEASE_VERSION"
          done
      - name: Verify public container aliases before committing the journal
        env:
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          CONTAINER_ALIAS: ${{ needs.prepare-release-promotion.outputs.container_alias }}
          CONTAINER_DIGEST: ${{ needs.stage-container.outputs.image_digest }}
        run: |
          python3 scripts/release/registryctl.py container-verify \
            --ref "ghcr.io/antflydb/antfly:${RELEASE_TAG}" \
            --digest "$CONTAINER_DIGEST"
          python3 scripts/release/registryctl.py container-verify \
            --ref "ghcr.io/antflydb/antfly:${CONTAINER_ALIAS}" \
            --digest "$CONTAINER_DIGEST"
      - name: Commit the release channel transaction
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          RELEASE_TAG: ${{ needs.prepare-release-promotion.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release-promotion.outputs.commit }}
          LEDGER_SHA256: ${{ needs.prepare-release-promotion.outputs.ledger_sha256 }}
          CONTAINER_DIGEST: ${{ needs.stage-container.outputs.image_digest }}
          CHANNEL: ${{ needs.begin-release-channel.outputs.channel }}
          JOURNAL_KEY: ${{ needs.prepare-release-promotion.outputs.journal_key }}
          ALLOW_LEGACY: ${{ needs.prepare-release-promotion.outputs.allow_legacy }}
        run: |
          legacy_args=()
          if [ "$ALLOW_LEGACY" = true ]; then legacy_args=(--allow-legacy-candidate); fi
          python scripts/release/release_channel_state.py finish \
            --endpoint "$AWS_ENDPOINT_URL" \
            --bucket antfly-releases \
            --key "$JOURNAL_KEY" \
            --channel "$CHANNEL" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --container-digest "$CONTAINER_DIGEST" \
            "${legacy_args[@]}" \
            --ledger-sha256 "$LEDGER_SHA256"
