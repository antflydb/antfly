name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v0.0.0-dev10

permissions:
  contents: write # Required for creating releases
  packages: write # Required if publishing Docker images
  id-token: write # Required for keyless OIDC signing in container workflow

jobs:
  goreleaser:
    runs-on: arc-antfly-heavy
    env:
      GOEXPERIMENT: simd
      GOCACHE: /mnt/cache/go-build
      GOMODCACHE: /mnt/cache/go-mod
      XDG_CACHE_HOME: /mnt/cache/xdg
      TMPDIR: /mnt/cache/tmp
    steps:
      - name: Prepare cache directories
        run: mkdir -p "$GOCACHE" "$GOMODCACHE" "$XDG_CACHE_HOME" "$TMPDIR"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for GoReleaser changelog generation
          submodules: true # Your project uses submodules

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Verify Go version
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install protoc
        run: |
          # Install protoc 33.1 (supports Protobuf Editions)
          # Ubuntu apt has old versions that don't support edition = "2023"
          PROTOC_VERSION="33.1"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o "protoc-${PROTOC_VERSION}-linux-x86_64.zip" -d /usr/local
          rm "protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          protoc --version

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Cache ONNX Runtime libraries (versions from scripts/download-onnxruntime.sh)
      - name: Cache ONNX Runtime libraries
        id: cache-onnx
        uses: actions/cache@v5
        with:
          path: onnxruntime
          key: onnxruntime-1.24.3-genai-0.12.1-tokenizers-1.26.0

      - name: Download ONNX Runtime libraries
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: ./scripts/download-onnxruntime.sh

      # Cache PJRT libraries (versions from scripts/download-pjrt.sh)
      - name: Cache PJRT libraries
        id: cache-pjrt
        uses: actions/cache@v5
        with:
          path: pjrt
          key: pjrt-0.83.4-tokenizers-1.25.0

      - name: Download PJRT libraries
        if: steps.cache-pjrt.outputs.cache-hit != 'true'
        run: ./scripts/download-pjrt.sh

      # Cache macOS SDK for cross-compilation
      - name: Cache macOS SDK
        id: cache-macos-sdk
        uses: actions/cache@v5
        with:
          path: /tmp/macos-sdk
          key: macos-sdk-15.5

      - name: Download macOS SDK for cross-compilation
        if: steps.cache-macos-sdk.outputs.cache-hit != 'true'
        run: |
          # Download macOS SDK for cross-compilation
          # Using the osxcross SDK packages from joseluisq/macosx-sdks
          mkdir -p /tmp/macos-sdk
          curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz | tar -xJf - -C /tmp/macos-sdk

      - name: Set macOS SDK path
        run: |
          echo "SDK_PATH=/tmp/macos-sdk/MacOSX15.5.sdk" >> $GITHUB_ENV
          # Verify required headers exist (mach headers are in Kernel.framework, not usr/include)
          echo "Checking for mach headers in Kernel.framework..."
          ls -la /tmp/macos-sdk/MacOSX15.5.sdk/System/Library/Frameworks/Kernel.framework/Versions/A/Headers/mach/ | head -20 || echo "WARNING: mach headers not found in Kernel.framework"
          ls /tmp/macos-sdk/MacOSX15.5.sdk/System/Library/Frameworks/Kernel.framework/Versions/A/Headers/mach/mach_vm.h || echo "WARNING: mach_vm.h not found"

      - name: Configure Go for private modules
        run: |
          echo "GONOPROXY=github.com/antflydb/antfly" >> $GITHUB_ENV
          echo "GOPRIVATE=github.com/antflydb/antfly" >> $GITHUB_ENV
          echo "ONNXRUNTIME_ROOT=${{ github.workspace }}/onnxruntime" >> $GITHUB_ENV
          echo "PJRT_ROOT=${{ github.workspace }}/pjrt" >> $GITHUB_ENV

      - name: Extract version from tag
        run: |
          echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "Release version: ${GITHUB_REF_NAME}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.12.0"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}

  package-cli-artifacts:
    name: Build CLI package artifacts
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Download release archives
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          base="https://releases.antfly.io/antfly/${tag}"
          mkdir -p dist/release-archives
          for archive in \
            "antfly_${version}_Darwin_arm64.tar.gz" \
            "antfly_${version}_Linux_arm64.tar.gz" \
            "antfly_${version}_Linux_x86_64.tar.gz"
          do
            curl -fsSL "${base}/${archive}" -o "dist/release-archives/${archive}"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Build wheels and populate npm packages
        run: |
          python scripts/packaging/package_cli_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --archive-dir dist/release-archives \
            --out-dir dist/cli-packages

      - name: Smoke check package wrappers
        run: |
          python -m compileall -q py/packages/cli/src/antfly_cli
          node --check ts/packages/cli/bin/antfly.js

      - name: Pack npm packages
        run: |
          set -euo pipefail
          mkdir -p dist/cli-packages/npm
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-darwin-arm64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-linux-arm64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli-linux-x64
          npm pack --pack-destination dist/cli-packages/npm ./ts/packages/cli

      - name: Upload Python wheels
        uses: actions/upload-artifact@v6
        with:
          name: antfly-cli-wheels
          path: dist/cli-packages/python/*.whl

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v6
        with:
          name: antfly-cli-npm
          path: dist/cli-packages/npm/*.tgz

  publish-cli-pypi:
    name: Publish antfly-cli to PyPI
    needs: package-cli-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antfly-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-wheels
          path: dist/

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-cli-npm:
    name: Publish @antfly/cli to npm
    needs: package-cli-artifacts
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: antfly-cli-npm
          path: dist/

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish npm packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm_tag="latest"
          case "$version" in
            *-*) npm_tag="next" ;;
          esac
          echo "Publishing CLI npm packages with dist-tag: ${npm_tag}"
          npm publish dist/antfly-cli-darwin-arm64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish dist/antfly-cli-linux-arm64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish dist/antfly-cli-linux-x64-*.tgz --access public --provenance --tag "$npm_tag"
          npm publish dist/antfly-cli-[0-9]*.tgz --access public --provenance --tag "$npm_tag"

  # Build and publish container images after release
  publish-container:
    needs:
      - goreleaser
      - publish-cli-pypi
      - publish-cli-npm
    uses: ./.github/workflows/antfly-container.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit
