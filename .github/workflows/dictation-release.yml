name: Dictation release

# Signing and publication tools always come from the default branch.
on:
  workflow_run:
    workflows: ['Dictation release request']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: dictation-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  resolve:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-request
          path: dist/dictation-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate tag event, identity, and default-branch ancestry
        id: identity
        run: python3 examples/dictation/release/release.py resolve dist/dictation-request/request.json --output dist/identity/identity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-identity
          path: dist/identity/identity.json
          if-no-files-found: error

  build:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false
      - name: Test app and release policy
        run: |
          bash examples/dictation/release/fetch-tools.sh
          python3 -m unittest discover -s examples/dictation/release -p 'test_*.py'
          examples/dictation/test.sh
      - name: Build universal app without signing credentials
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SPARKLE_PUBLIC_KEY: ${{ vars.DICTATION_SPARKLE_PUBLIC_KEY }}
          UNIVERSAL_BUILD: '1'
        run: |
          examples/dictation/build-app.sh
          DICTATION_TEST_APP="$PWD/examples/dictation/dist/Antfly Dictation.app/Contents/MacOS/AntflyDictation" DICTATION_TEST_RUNTIME="$PWD/examples/dictation/dist/Antfly Dictation.app/Contents/Resources/Runtime/antfly" python3 -m unittest discover -s examples/dictation/release -p 'test_runtime.py'
          ditto -c -k --sequesterRsrc --keepParent 'examples/dictation/dist/Antfly Dictation.app' dist-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-unsigned
          path: dist-unsigned.zip
          if-no-files-found: error

  sign:
    needs: [resolve, build]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: dictation-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-identity
          path: dist/identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-unsigned
          path: dist/unsigned
      - name: Verify current release identity before accessing signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'examples/dictation/release')
          from release import verify_source
          verify_source(json.load(open('dist/identity/identity.json')))
          PY
      - name: Developer ID sign, notarize, staple, and sign Sparkle payloads
        env:
          DICTATION_CERTIFICATE_P12_BASE64: ${{ secrets.DICTATION_CERTIFICATE_P12_BASE64 }}
          DICTATION_CERTIFICATE_PASSWORD: ${{ secrets.DICTATION_CERTIFICATE_PASSWORD }}
          DICTATION_APPLE_API_KEY_P8: ${{ secrets.DICTATION_APPLE_API_KEY_P8 }}
          DICTATION_APPLE_API_KEY_ID: ${{ secrets.DICTATION_APPLE_API_KEY_ID }}
          DICTATION_APPLE_API_ISSUER_ID: ${{ secrets.DICTATION_APPLE_API_ISSUER_ID }}
          DICTATION_SPARKLE_PRIVATE_KEY: ${{ secrets.DICTATION_SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.DICTATION_SPARKLE_PUBLIC_KEY }}
          SIGNING_IDENTITY: ${{ vars.DICTATION_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.DICTATION_APPLE_TEAM_ID }}
        run: bash examples/dictation/release/sign-release.sh "$PWD/dist/identity/identity.json" "$PWD/dist/unsigned/dist-unsigned.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-signed
          path: examples/dictation/dist/release
          if-no-files-found: error
  publish:
    needs: [resolve, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-promotion
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-identity
          path: dist/identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-signed
          path: dist/signed
      - id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - name: Install locked release dependencies
        run: python3 -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Publish immutable downloads, then advance signed channel feeds
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: python3 examples/dictation/release/release.py publish dist/identity/identity.json dist/signed

  github-mirror:
    if: ${{ vars.DICTATION_GITHUB_MIRROR == 'true' }}
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-promotion
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-identity
          path: dist/identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictation-signed
          path: dist/signed
      - name: Mirror sealed downloads without controlling the update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 examples/dictation/release/release.py mirror dist/identity/identity.json dist/signed
