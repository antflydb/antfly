name: Abort unpublished v0.2.4 promotion

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Verify unpublished v0.2.4 reservation
    runs-on: arc-antfly-standard
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: ./.github/actions/setup-github-cli
      - name: Verify protected release environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/release/github_environment.py check
          --repository "$GITHUB_REPOSITORY"
          --environment release-promotion
      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check
      - name: Check cancelled promotion and live publication state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          python scripts/release/abort_unpublished_v024.py \
            --endpoint "$AWS_ENDPOINT_URL" --check-only
          {
            echo '### Proposed release recovery'
            echo
            echo 'Abort only the unpublished v0.2.4 stable-channel reservation from cancelled promotion run 36062063327.'
            echo 'The apply job will repeat all live checks under the release storage lock before its conditional journal update.'
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve v0.2.4 reservation abort
    needs: plan
    runs-on: ubuntu-latest
    environment: release-promotion
    steps:
      - run: true

  apply:
    name: Abort exact unpublished v0.2.4 reservation
    needs: approve
    runs-on: arc-antfly-standard
    concurrency:
      group: antfly-release-storage
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_build }}
      - uses: ./.github/actions/setup-github-cli
      - name: Verify protected release environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/release/github_environment.py check
          --repository "$GITHUB_REPOSITORY"
          --environment release-promotion
      - name: Install hash-locked object storage client
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.lock
          python -m pip check
      - name: Repeat checks and conditionally clear the reservation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: >-
          python scripts/release/abort_unpublished_v024.py
          --endpoint "$AWS_ENDPOINT_URL"
