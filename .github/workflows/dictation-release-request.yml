name: Dictation release request

on:
  push:
    tags: ['dictation/v*']

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record tag request without signing or publication credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist/dictation-request
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$SOURCE_COMMIT" \
            '{schema_version: 1, tag: $tag, source_commit: $commit}' > dist/dictation-request/request.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-request
          retention-days: 90
          path: dist/dictation-request/request.json
          if-no-files-found: error
