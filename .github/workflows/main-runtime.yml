name: Main Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Resolve main only after earlier main publications finish. github.sha belongs
  # to a potentially delayed event, so it must not select this lock.
  group: main-runtime-main
  cancel-in-progress: false

# The image registry and build configuration live in the existing local helper.
# Keeping this orchestration free of infrastructure coordinates avoids creating a
# second public configuration surface.
jobs:
  resolve:
    runs-on: arc-antfly-publish
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      exists: ${{ steps.runtime.outputs.exists }}
      source_sha: ${{ steps.runtime.outputs.source_sha }}
      tag: ${{ steps.runtime.outputs.tag }}
      image_tag: ${{ steps.runtime.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse a stale main workflow
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "main advanced after this workflow was selected; refusing stale publication" >&2
            exit 1
          }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3
      - id: runtime
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tag="main-${source_sha}"
          image_tag="$(scripts/publish-zig-runtime-dev.sh --tag "$tag" --image-ref)"
          registry="${image_tag%%/*}"
          echo "$(gcloud auth print-access-token)" | crane auth login "$registry" -u oauth2accesstoken --password-stdin
          if lookup="$(crane digest "$image_tag" 2>&1)"; then
            [[ "$lookup" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid registry digest: $lookup" >&2; exit 1; }
            exists=true
          elif [[ "$lookup" == *MANIFEST_UNKNOWN* || "$lookup" == *NAME_UNKNOWN* ]]; then
            exists=false
          else
            echo "unable to determine whether $image_tag exists: $lookup" >&2
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: arc-antfly-publish
            optimize: ReleaseFast
            jobs: ''
          - arch: arm64
            runner: arc-antfly-publish-arm64
            optimize: ReleaseSmall
            jobs: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          submodules: true
      - name: Require the current main commit
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == '${{ needs.resolve.outputs.source_sha }}' ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3
      - name: Install the pinned native build toolchain
        env:
          ZIG_VERSION: 0.16.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld curl xz-utils git perl python3 linux-libc-dev ca-certificates
          case '${{ matrix.arch }}' in
            amd64) zig_arch=x86_64 ;;
            arm64) zig_arch=aarch64 ;;
            *) exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version | grep -Fx "$ZIG_VERSION"
      - name: Build the native runtime artifact
        run: |
          args=(--tag '${{ needs.resolve.outputs.tag }}' --arch '${{ matrix.arch }}' --optimize '${{ matrix.optimize }}')
          [[ -z '${{ matrix.jobs }}' ]] || args+=(--jobs '${{ matrix.jobs }}')
          scripts/publish-zig-runtime-dev.sh "${args[@]}"
      - name: Sign the source-bound platform image
        run: |
          set -euo pipefail
          image_tag="$(scripts/publish-zig-runtime-dev.sh --tag '${{ needs.resolve.outputs.tag }}' --image-ref)-${{ matrix.arch }}"
          registry="${image_tag%%/*}"
          echo "$(gcloud auth print-access-token)" | crane auth login "$registry" -u oauth2accesstoken --password-stdin
          image="${image_tag}@$(crane digest "$image_tag")"
          cosign sign --yes -a "repo=${{ github.repository }}" -a "workflow=${{ github.workflow }}" -a "ref=${{ needs.resolve.outputs.source_sha }}" -a "platform=${{ matrix.arch }}" "$image"

  manifest:
    needs: [resolve, publish]
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.exists == 'true' || needs.publish.result == 'success')
    runs-on: arc-antfly-publish
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Require the current main commit
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == '${{ needs.resolve.outputs.source_sha }}' ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3
      - id: runtime
        run: |
          set -euo pipefail
          tag='${{ needs.resolve.outputs.tag }}'
          image_tag='${{ needs.resolve.outputs.image_tag }}'
          # Re-running the same verified main commit only resolves its existing
          # immutable tag; it does not create aliases or a second image identity.
          registry="${image_tag%%/*}"
          echo "$(gcloud auth print-access-token)" | crane auth login "$registry" -u oauth2accesstoken --password-stdin
          if lookup="$(crane digest "$image_tag" 2>&1)"; then
            digest="$lookup"
            cosign verify --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/main-runtime.yml@" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" -a "repo=${{ github.repository }}" -a "ref=${{ needs.resolve.outputs.source_sha }}" "${image_tag}@${digest}" >/dev/null
          elif [[ "$lookup" == *MANIFEST_UNKNOWN* || "$lookup" == *NAME_UNKNOWN* ]]; then
            # Recheck immediately before publication. The helper refuses to
            # retag an image that appeared after this lookup.
            amd64_index_digest="$(crane digest "${image_tag}-amd64")"
            arm64_index_digest="$(crane digest "${image_tag}-arm64")"
            amd64_digest="$amd64_index_digest"
            arm64_digest="$arm64_index_digest"
            for spec in "${image_tag}-amd64@${amd64_digest}:amd64" "${image_tag}-arm64@${arm64_digest}:arm64"; do
              image="${spec%:*}"; platform="${spec##*:}"
              cosign verify --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/main-runtime.yml@" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" -a "repo=${{ github.repository }}" -a "ref=${{ needs.resolve.outputs.source_sha }}" -a "platform=${platform}" "$image" >/dev/null
            done
            if ! scripts/publish-zig-runtime-dev.sh --tag "$tag" --manifest --amd64-digest "$amd64_digest" --arm64-digest "$arm64_digest"; then
              echo "final tag appeared after the verified miss; refusing raced publication" >&2
              exit 1
            else
              digest="$(crane digest "$image_tag")"
            fi
          else
            echo "unable to determine whether $image_tag exists: $lookup" >&2
            exit 1
          fi
          runnable_child() {
            crane manifest "$1" | jq -er --arg arch "$2" '
              [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("expected one runnable platform child") end
            '
          }
          if [[ '${{ needs.resolve.outputs.exists }}' != true ]]; then
            amd64_digest="$(runnable_child "${image_tag}@${amd64_index_digest}" amd64)"
            arm64_digest="$(runnable_child "${image_tag}@${arm64_index_digest}" arm64)"
          else
            amd64_digest="$(runnable_child "${image_tag}-amd64" amd64)"
            arm64_digest="$(runnable_child "${image_tag}-arm64" arm64)"
          fi
          crane manifest "$image_tag" | jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            ([.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest] | sort) == ([$amd64, $arm64] | sort)
          ' >/dev/null || { echo "immutable image conflicts with this main runtime's platform images" >&2; exit 1; }
          crane manifest "$image_tag" | jq -e '[.manifests[]? | select(.platform.os == "unknown" and .platform.architecture == "unknown")] | length >= 2' >/dev/null || {
            echo "final image is missing Buildx provenance attestations" >&2; exit 1
          }
          repository="${image_tag%:*}"
          image="${repository}@${digest}"
          if [[ '${{ needs.resolve.outputs.exists }}' != true ]]; then
            cosign sign --yes -a "repo=${{ github.repository }}" -a "workflow=${{ github.workflow }}" -a "ref=${{ needs.resolve.outputs.source_sha }}" "$image"
          fi
          cosign verify --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/main-runtime.yml@" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" -a "repo=${{ github.repository }}" -a "ref=${{ needs.resolve.outputs.source_sha }}" "$image" >/dev/null
          jq -cn --arg source_sha '${{ needs.resolve.outputs.source_sha }}' --arg image "$image" --arg tag "$tag" '{source_sha:$source_sha,image:$image,tag:$tag,platforms:["linux/amd64","linux/arm64"]}' > antfly-main-runtime.json
          receipt_digest="$(jq -r '.image | split("@")[1]' antfly-main-runtime.json)"
          [[ "$receipt_digest" == "$(crane digest "$image_tag")" ]] || { echo "receipt digest does not equal final tag" >&2; exit 1; }
          cat antfly-main-runtime.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: antfly-main-runtime
          path: antfly-main-runtime.json
          retention-days: 7
