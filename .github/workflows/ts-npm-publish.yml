# Publish packages to npm when tagged
# - ts/antfly/sdk/v* tags publish @antfly/sdk
# - ts/antfly/better-auth/v* tags publish @antfly/better-auth
# - ts/antfly/components/v* tags publish @antfly/components
# - ts/antfly/design-system/v* tags publish @antfly/design-system
# - ts/antfly/web/v* tags publish @antfly/web
#
# Uses npm Trusted Publishing (OIDC) - no secrets required.
# Configure trusted publishers at: https://www.npmjs.com/package/@antfly/sdk/access
# https://www.npmjs.com/package/@antfly/components/access
# and https://www.npmjs.com/package/@antfly/design-system/access

name: Publish to npm

on:
  push:
    tags:
      - 'ts/antfly/sdk/v*'
      - 'ts/antfly/better-auth/v*'
      - 'ts/antfly/components/v*'
      - 'ts/antfly/design-system/v*'
      - 'ts/antfly/web/v*'
      - 'ts/antfly/langchain/v*'
      - 'ts/antfly/langgraph-store/v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auth-checks:
    permissions:
      contents: read
      id-token: write # Read-only verified Zig dependency mirror.
    if: startsWith(github.ref, 'refs/tags/ts/antfly/better-auth/v')
    uses: ./.github/workflows/better-auth-compatibility.yml

  publish:
    needs: auth-checks
    if: ${{ !cancelled() && (needs.auth-checks.result == 'success' || needs.auth-checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/

      # Install Node first so pnpm/action-setup uses its JavaScript bootstrap
      # instead of a runner-dependent native standalone executable.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
          cache: true
          cache_dependency_path: ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: ts
        run: pnpm build --force

      - name: Run tests
        working-directory: ts
        run: pnpm test

      - name: Upgrade npm for OIDC support
        # npm 12.0.0 omitted sigstore from its published bundle: npm/cli#9722.
        # Keep every trusted-publishing workflow on the same supported major.
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm_version }}
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Publish SDK
        if: startsWith(github.ref, 'refs/tags/ts/antfly/sdk/v')
        working-directory: ts
        run: pnpm --filter @antfly/sdk publish --access public --no-git-checks --provenance

      - name: Publish Components
        if: startsWith(github.ref, 'refs/tags/ts/antfly/components/v')
        working-directory: ts
        run: pnpm --filter @antfly/components publish --access public --no-git-checks --provenance

      - name: Publish Design System
        if: startsWith(github.ref, 'refs/tags/ts/antfly/design-system/v')
        working-directory: ts
        run: pnpm --filter @antfly/design-system publish --access public --no-git-checks --provenance

      - name: Publish Browser Inference Client
        if: startsWith(github.ref, 'refs/tags/ts/antfly/web/v')
        working-directory: ts
        run: pnpm --filter @antfly/web publish --access public --no-git-checks --provenance

      - name: Publish Better Auth integration
        if: startsWith(github.ref, 'refs/tags/ts/antfly/better-auth/v')
        working-directory: ts
        run: |
          version=$(node -p "require('./packages/better-auth/package.json').version")
          test "$GITHUB_REF_NAME" = "ts/antfly/better-auth/v$version"
          case "$version" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          pnpm --filter @antfly/better-auth publish --access public --no-git-checks --provenance --tag "$channel"

      - name: Verify LangChain package consumer
        if: startsWith(github.ref, 'refs/tags/ts/antfly/langchain/v') || startsWith(github.ref, 'refs/tags/ts/antfly/langgraph-store/v')
        working-directory: ts
        run: pnpm --filter @antfly/langchain test:package

      - name: Verify LangChain registry dependencies
        if: startsWith(github.ref, 'refs/tags/ts/antfly/langchain/v')
        working-directory: ts
        run: node packages/langchain/scripts/verify-release.mjs langchain

      - name: Verify LangGraph registry dependencies
        if: startsWith(github.ref, 'refs/tags/ts/antfly/langgraph-store/v')
        working-directory: ts
        run: node packages/langchain/scripts/verify-release.mjs langgraph-store

      - name: Publish LangChain integration
        if: startsWith(github.ref, 'refs/tags/ts/antfly/langchain/v')
        working-directory: ts
        run: pnpm --filter @antfly/langchain publish --access public --no-git-checks --provenance

      - name: Publish LangGraph memory integration
        if: startsWith(github.ref, 'refs/tags/ts/antfly/langgraph-store/v')
        working-directory: ts
        run: pnpm --filter @antfly/langgraph-store publish --access public --no-git-checks --provenance
