# Publish packages to npm when tagged
# - ts/antfly/sdk/v* tags publish @antfly/sdk
# - ts/antfly/components/v* tags publish @antfly/components
# - ts/antfly/design-system/v* tags publish @antfly/design-system
#
# Uses npm Trusted Publishing (OIDC) - no secrets required.
# Configure trusted publishers at: https://www.npmjs.com/package/@antfly/sdk/access
# https://www.npmjs.com/package/@antfly/components/access
# and https://www.npmjs.com/package/@antfly/design-system/access

name: Publish to npm

on:
  push:
    tags:
      - 'ts/antfly/sdk/v*'
      - 'ts/antfly/components/v*'
      - 'ts/antfly/design-system/v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_VERSION: 11.19.1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: ts
        run: pnpm build --force

      - name: Run tests
        working-directory: ts
        run: pnpm test

      - name: Upgrade npm for OIDC support
        # npm 12.0.0 omitted sigstore from its published bundle: npm/cli#9722.
        # Keep every trusted-publishing workflow on the same supported major.
        run: |
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Publish SDK
        if: startsWith(github.ref, 'refs/tags/ts/antfly/sdk/v')
        working-directory: ts
        run: pnpm --filter @antfly/sdk publish --access public --no-git-checks --provenance

      - name: Publish Components
        if: startsWith(github.ref, 'refs/tags/ts/antfly/components/v')
        working-directory: ts
        run: pnpm --filter @antfly/components publish --access public --no-git-checks --provenance

      - name: Publish Design System
        if: startsWith(github.ref, 'refs/tags/ts/antfly/design-system/v')
        working-directory: ts
        run: pnpm --filter @antfly/design-system publish --access public --no-git-checks --provenance
