name: AI SDK integration
on:
  push:
    branches: [main]
    paths: ['ts/packages/ai-sdk/**', 'ts/packages/sdk/**', 'ts/pnpm-lock.yaml', 'ts/pnpm-workspace.yaml', '.github/workflows/ai-sdk-js.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * 1'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest-compatible]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: ts
      - name: Update compatible dependencies
        if: matrix.dependencies == 'latest-compatible'
        working-directory: ts
        run: pnpm --filter @antfly/ai-sdk add --save-dev 'ai@^7.0.162' 'zod@^4.1.8' --ignore-scripts
      - name: Build, typecheck, lint and test
        working-directory: ts
        run: |
          pnpm --filter @antfly/ai-sdk... build
          pnpm --filter @antfly/ai-sdk... typecheck
          pnpm --filter @antfly/ai-sdk lint
          pnpm --filter @antfly/ai-sdk... test
      - name: Verify independent npm consumer
        working-directory: ts
        run: |
          if [ '${{ matrix.dependencies }}' = latest-compatible ]; then
            pnpm --filter @antfly/ai-sdk test:package --latest-peers
          else
            pnpm --filter @antfly/ai-sdk test:package
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-sdk-package-${{ matrix.dependencies }}
          path: .state/ai-sdk/consumer-*/receipt.json
          include-hidden-files: true
