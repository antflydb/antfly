name: Recover interrupted VOPR checkout
on:
  workflow_run:
    workflows: [Zig VOPR soaks]
    types: [completed]
permissions:
  contents: read
jobs:
  recover:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: recover-vopr-checkout-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {recover} = require('./.github/scripts/recover-vopr-checkout.cjs');
            await recover({github, context, core});
