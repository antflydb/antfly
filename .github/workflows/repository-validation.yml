name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validation:
    name: repository-validation
    runs-on: arc-antfly-standard
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify validation scopes
        id: scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python3 scripts/ci/classify_validation.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/classify_validation.py \
              --base "$BASE_SHA" \
              --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Load pinned toolchain policy
        id: policy
        run: |
          policy=scripts/ci/check_sdk_policy.py
          {
            echo "python_build=$(python3 "$policy" --get python-build)"
            echo "python_supported=$(python3 "$policy" --get python-supported)"
            echo "go_version=$(python3 "$policy" --get go)"
            echo "zig_version=$(python3 "$policy" --get zig)"
            echo "rust_version=$(python3 "$policy" --get rust)"
          } >> "$GITHUB_OUTPUT"

      - name: Test validation scope classification
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Set up Python
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true' || steps.scopes.outputs.release == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.policy.outputs.python_build }}

      - name: Install uv
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Node.js
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_typescript == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json

      - name: Install pnpm
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_typescript == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ts/package.json
          cache: true
          cache_dependency_path: ts/pnpm-lock.yaml

      - name: Set up Go
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.memoryaf == 'true' || steps.scopes.outputs.format_go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.policy.outputs.go_version }}
          cache: true
          cache-dependency-path: |
            go/pkg/sdk/go.sum
            go/pkg/memoryaf/go.sum

      - name: Set up Rust
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.policy.outputs.rust_version }}
          components: rustfmt

      - name: Set up Zig
        if: steps.scopes.outputs.format_zig == 'true' || steps.scopes.outputs.release == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.policy.outputs.zig_version }}
          use-cache: false

      - name: Install native test dependencies
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.memoryaf == 'true' || steps.scopes.outputs.release == 'true'
        run: |
          sudo_cmd=""
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install --yes --no-install-recommends \
            build-essential cmake pkg-config xz-utils

      - name: Install Python tooling
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_python == 'true'
        run: |
          uv python install ${{ steps.policy.outputs.python_supported }}
          uv sync \
            --project py/packages/sdk \
            --python "${{ steps.policy.outputs.python_build }}" \
            --locked

      - name: Install TypeScript tooling
        if: steps.scopes.outputs.sdk == 'true' || steps.scopes.outputs.format_typescript == 'true'
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Check Zig formatting
        if: steps.scopes.outputs.format_zig == 'true'
        run: scripts/ci/check.sh format zig

      - name: Check Go formatting
        if: steps.scopes.outputs.format_go == 'true'
        run: scripts/ci/check.sh format go

      - name: Check Python formatting
        if: steps.scopes.outputs.format_python == 'true'
        run: scripts/ci/check.sh format python

      - name: Check TypeScript formatting
        if: steps.scopes.outputs.format_typescript == 'true'
        run: scripts/ci/check.sh format typescript

      - name: Check Rust formatting
        if: steps.scopes.outputs.format_rust == 'true'
        run: scripts/ci/check.sh format rust

      - name: Check SDKs
        if: steps.scopes.outputs.sdk == 'true'
        run: scripts/ci/check.sh sdk

      - name: Check memoryaf
        if: steps.scopes.outputs.memoryaf == 'true'
        run: scripts/ci/check.sh memoryaf

      - name: Check release packaging and scripts
        if: steps.scopes.outputs.release == 'true'
        run: scripts/ci/check.sh release
