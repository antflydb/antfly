name: Zig Scale Tests

# Scale labels select suites; /ci run <sha> approves each PR run.
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      check_id:
        type: string
        default: ''
      comment_id:
        type: string
        default: ''
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-cache-scale
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig/.zig-global-cache-scale

concurrency:
  group: scale-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    uses: ./.github/workflows/pr-ci-admission.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      check_id: ${{ inputs.check_id }}
      comment_id: ${{ inputs.comment_id }}
      suite: scale

  artifact-full-text:
    if: >-
      ${{ !cancelled() &&
      success() &&
      needs.admission.result == 'success' &&
      (inputs.pr_number == '' ||
      github.run_attempt == 1) }}
    needs: admission
    name: Artifact full-text / >1M chunks
    runs-on: arc-antfly-heavy
    timeout-minutes: 60
    env:
      ANTFLY_CI_ZIG_OPTIMIZE: ReleaseSafe
      ANTFLY_CI_ZIG_STRIP: "true"
      ANTFLY_ARTIFACT_FULL_TEXT_SCALE: "1"
      ANTFLY_BIN: ./zig-out/bin/antfly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ca-certificates git curl xz-utils

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.zig_version }}
          use-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Compute CPU bound
        id: cpus
        run: |
          jobs=$(nproc)
          if [ "$jobs" -gt 8 ]; then jobs=8; fi
          echo "list=0-$((jobs - 1))" >> "$GITHUB_OUTPUT"

      - name: Build E2E executable
        run: scripts/ci/zig-build-e2e-binaries.sh

      - name: Run artifact full-text scale gate
        working-directory: zig
        run: |
          chmod +x ./zig-out/bin/antfly
          taskset -c ${{ steps.cpus.outputs.list }} \
            uv run --project e2e/antfly pytest -q \
            e2e/antfly/test_artifacts.py::test_artifact_full_text_scale_exceeds_one_million_chunks_on_three_shards
