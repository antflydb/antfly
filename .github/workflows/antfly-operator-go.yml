# Antfly Operator CI workflow
# Tests, lints, and builds the Kubernetes operator

name: Antfly Operator Tests

on:
  push:
    branches: ["main"]
    paths:
      - 'go/pkg/operator/**'
      - 'go/pkg/sdk/admin/**'
      - 'go/pkg/sdk/go.mod'
      - 'go/pkg/sdk/go.sum'
      - 'specs/openapi/antfly/admin.yaml'
      - '.github/workflows/antfly-operator-go.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'go/pkg/operator/**'
      - 'go/pkg/sdk/admin/**'
      - 'go/pkg/sdk/go.mod'
      - 'go/pkg/sdk/go.sum'
      - 'specs/openapi/antfly/admin.yaml'
      - '.github/workflows/antfly-operator-go.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: "1.26.4"

jobs:
  test:
    runs-on: arc-antfly-standard
    defaults:
      run:
        working-directory: go/pkg/operator
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set Go experiment
        run: echo "GOEXPERIMENT=simd" >> $GITHUB_ENV

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: GOWORK=off go mod download

      - name: Run tests
        run: make test

      - name: Run lint
        run: make lint

      - name: Build
        run: make build
