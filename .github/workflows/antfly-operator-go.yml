# Antfly Operator CI workflow
# Tests, lints, and builds the Kubernetes operator

name: Antfly Operator Tests

on:
  push:
    branches: ["main"]
    paths:
      - 'go/pkg/operator/**'
      - 'go/pkg/sdk/admin/**'
      - 'go/pkg/sdk/go.mod'
      - 'go/pkg/sdk/go.sum'
      - 'specs/openapi/**'
      - 'scripts/ci/toolchain-policy.json'
      - '.github/actions/load-toolchain-policy/action.yml'
      - '.github/workflows/antfly-operator-go.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'go/pkg/operator/**'
      - 'go/pkg/sdk/admin/**'
      - 'go/pkg/sdk/go.mod'
      - 'go/pkg/sdk/go.sum'
      - 'specs/openapi/**'
      - 'scripts/ci/toolchain-policy.json'
      - '.github/actions/load-toolchain-policy/action.yml'
      - '.github/workflows/antfly-operator-go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: arc-antfly-standard
    defaults:
      run:
        working-directory: go/pkg/operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned toolchain policy
        id: toolchain
        uses: ./.github/actions/load-toolchain-policy

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Set Go experiment
        run: echo "GOEXPERIMENT=simd" >> "$GITHUB_ENV"

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: GOWORK=off go mod download

      - name: Configure envtest
        run: |
          assets="$(GOWORK=off go tool setup-envtest use -p path 1.35.x!)"
          printf 'KUBEBUILDER_ASSETS=%s\n' "$assets" >> "$GITHUB_ENV"

      - name: Run tests
        run: make test

      - name: Run lint
        run: make lint

      - name: Build
        run: make build
